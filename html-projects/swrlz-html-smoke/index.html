<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>§C | HTML Project Launch Check</title>
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>
<body>
  <main class="shell">
    <p class="eyebrow">§WYRLZ · HTML PROJECT</p>
    <h1>Launch verified.<span class="cursor">_</span></h1>
    <p class="sub">A real multi-file website, committed in GitHub and served from the existing §C Hugging Face Space.</p>
    <section class="tester" aria-labelledby="test-title">
      <div class="head"><span class="dot"></span><h2 id="test-title">Live JavaScript check</h2></div>
      <output id="counter" aria-live="polite" aria-label="Number of clicks">0</output>
      <button id="increment" type="button">Test interaction</button>
      <p id="message" role="status">Press the button. The count should increase without reloading.</p>
    </section>
    <footer>Sandboxed project origin · no access to §C login sessions</footer>
  </main>
</body>
</html>
