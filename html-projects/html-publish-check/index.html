<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>§C HTML Publishing · Live Acceptance</title>
  <style>
    :root{color-scheme:dark;font:16px system-ui,sans-serif}
    *{box-sizing:border-box}
    body{min-height:100dvh;display:grid;place-items:center;margin:0;padding:24px;color:#e8f8ff;background:radial-gradient(circle at 20% 0,#153f58,transparent 55%),#07151f}
    main{width:min(580px,100%);padding:28px;border-radius:18px;border:1px solid #39738b;background:#0b2535;box-shadow:0 18px 60px #0008}
    small{color:#8de4ef;letter-spacing:.15em;text-transform:uppercase}
    h1{font-size:clamp(25px,5vw,36px);margin:14px 0}
    p{line-height:1.65;color:#b9d4de}
    button{background:#2b7899;color:white;border:1px solid #70b9d1;border-radius:10px;padding:12px 18px;cursor:pointer;font-weight:700}
    output{display:block;margin-top:18px;padding:13px;border-radius:9px;background:#071923;border:1px solid #234e65;min-height:52px}
  </style>
</head>
<body>
  <main>
    <small>§C · GitHub → Hugging Face</small>
    <h1>Project publishing verification</h1>
    <p>This page is a deliberately isolated test project. Its HTML and JavaScript are served by the same CSP-sandboxed route used for future projects.</p>
    <button id="exercise" type="button">Run interactive check</button>
    <output id="result" aria-live="polite">Waiting for interaction.</output>
  </main>
  <script>
    const button=document.getElementById("exercise");
    const result=document.getElementById("result");
    button.addEventListener("click",()=>{
      const next=Number(button.dataset.count||0)+1;
      button.dataset.count=String(next);
      result.textContent="JavaScript interaction verified · clicks: "+next;
    });
  </script>
</body>
</html>
