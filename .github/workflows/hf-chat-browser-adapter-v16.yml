name: Release §C pluggable browser execution v16
on:
  pull_request:
    paths:
      - 'api/html_project_browser_backend_v1.py'
      - 'api/html_project_agent_runtime_v1.py'
      - 'api/html_project_repair_v1.py'
      - 'scripts/*browser*v16.py'
      - 'tests/test_html_project_browser_backend_v16.py'
      - '.github/workflows/hf-html-project-browser-worker-v16.yml'
      - '.github/workflows/hf-chat-browser-adapter-v16.yml'
  push:
    branches: [main]
    paths:
      - 'api/html_project_browser_backend_v1.py'
      - 'api/html_project_agent_runtime_v1.py'
      - 'api/html_project_repair_v1.py'
      - 'scripts/*browser*v16.py'
      - 'tests/test_html_project_browser_backend_v16.py'
      - '.github/workflows/hf-html-project-browser-worker-v16.yml'
      - '.github/workflows/hf-chat-browser-adapter-v16.yml'
permissions: {contents: read}
concurrency:
  group: swrlz-browser-adapter-v16
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet 'requests>=2.31,<3' 'huggingface_hub>=0.34,<2'
      - run: |
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/api"
          python -m unittest discover -s tests -p 'test_html_project_browser_backend_v16.py' -v
          python -m unittest discover -s tests -p 'test_html_project_agent_runtime_v1.py' -v
          python -m unittest discover -s tests -p 'test_html_project_repair_v1.py' -v
          python scripts/hf_chat_browser_adapter_release_v16.py preflight
          python -m py_compile scripts/run_browser_worker_v16.py scripts/verify_github_browser_receipt_v16.py
  publish:
    needs: validate
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[release-chat-browser-adapter-v16]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: {contents: read, actions: write}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet 'requests>=2.31,<3' 'huggingface_hub>=0.34,<2'
      - name: Prove real read-only worker success and error feedback; activate §C
        env:
          GH_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SWRLZ_V16_APPROVED: '1'
          PYTHONPATH: ${{ github.workspace }}/api:${{ github.workspace }}
        run: python -u scripts/hf_chat_browser_adapter_release_v16.py publish
