name: Guarded §C native Qwen WebUI asset fix

on:
  push:
    branches: [main]
    paths: [".deploy/HF_CHAT_QWEN_UI_ASSET_REQUEST.txt"]

permissions:
  contents: read

concurrency:
  group: swrlz-hf-space-deployment
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Enforce exact Space and native-only scope
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request=".deploy/HF_CHAT_QWEN_UI_ASSET_REQUEST.txt"
          test -f "$request"
          get() { sed -n "s/^$1=//p" "$request" | tail -n 1; }
          test "$(get TARGET)" = "kamiloki/Swyrlz"
          test "$(get SOURCE_REVISION)" = "79c9f0dd2cd5ab89d351f2a678f4a52cc338ce88"
          test "$(get SCOPE)" = "disable-native-unneeded-webui-assets"
          mode="$(get MODE)"
          test "$mode" = inspect -o "$mode" = deploy
          if [ "$mode" = deploy ]; then
            test "$(get APPROVED)" = yes || { echo "::error::Missing approval"; exit 1; }
          fi
          nonce="$(get REQUEST_NONCE)"
          [[ "$nonce" =~ ^[a-z0-9-]{12,96}$ ]]
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Validate source-preserving native build fix
        run: python -m py_compile scripts/hf_chat_qwen_ui_asset_fix.py
      - name: Install Hub SDK
        run: python -m pip install --quiet "huggingface_hub>=0.34,<2"
      - name: Snapshot current Qwen source and validate only intended CMake change
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u scripts/hf_chat_qwen_ui_asset_fix.py inspect
      - name: Preserve exact original native source and validated candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swrlz-qwen-native-ui-asset-prerelease
          path: reports/swrlz-native-ui-asset-fix/
          retention-days: 30
          if-no-files-found: ignore
      - name: Publish approved native-only fix and require actual Qwen warmup proof
        if: ${{ steps.request.outputs.mode == 'deploy' }}
        timeout-minutes: 24
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SWRLZ_QWEN_UI_ASSET_APPROVED: "yes"
        run: |
          set -euo pipefail
          python -u scripts/hf_chat_qwen_ui_asset_fix.py publish
          echo "SWRLZ_MODEL_WARMUP_READY_VERIFIED"
