name: Guarded live §C 16K coding context and provisional preview
on:
  push:
    branches: [main]
    paths: [".deploy/HF_CHAT_CODE_CONTEXT_PREVIEW_REQUEST.txt"]
permissions:
  contents: read
concurrency:
  group: swrlz-hf-space-deployment
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 52
    steps:
      - uses: actions/checkout@v4
      - name: Validate existing Space owner authorization and pinned release source
        id: approved
        shell: bash
        run: |
          set -euo pipefail
          request=.deploy/HF_CHAT_CODE_CONTEXT_PREVIEW_REQUEST.txt
          test -f "$request"
          get() { sed -n "s/^$1=//p" "$request" | tail -n 1; }
          test "$(get TARGET)" = "kamiloki/Swyrlz"
          test "$(get APPROVED)" = "1"
          test "$(get CHANGE_SCOPE)" = "coding-context16k-provisional-draft-only"
          test "$(get MODEL)" = "qwen3.5-9b"
          test "$(get THREADS)" = "18"
          ref="$(get SOURCE_REF)"
          nonce="$(get REQUEST_NONCE)"
          [[ "$ref" =~ ^[a-f0-9]{40}$ ]]
          [[ "$nonce" =~ ^[a-z0-9-]{12,96}$ ]]
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Current 9B model, CPU quota and §E authority remain unchanged."
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.approved.outputs.ref }}
          path: release-source
          fetch-depth: 1
      - name: Install source release client
        run: python -m pip install 'huggingface_hub>=0.34,<2'
      - name: Verify exact production source before any writes
        working-directory: release-source
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          python -m py_compile scripts/hf_chat_code_context_preview_v1.py
          python -u scripts/hf_chat_code_context_preview_v1.py snapshot
      - uses: actions/upload-artifact@v4
        with:
          name: swrlz-code-context16k-preview-exact-source-rollback
          path: release-source/qwen35-code-preview-backup/
          retention-days: 14
          if-no-files-found: error
      - name: Publish and verify live 9B context and provisional coding stream; rollback on failure
        working-directory: release-source
        timeout-minutes: 43
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SWRLZ_CODE_PREVIEW_16K_APPROVED: "1"
        run: |
          set -euo pipefail
          python -u scripts/hf_chat_code_context_preview_v1.py publish
          echo "SWRLZ_CODE_CONTEXT16K_PREVIEW_LIVE_ACCEPTED"
