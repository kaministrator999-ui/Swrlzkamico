name: Guarded §C live 16-vs-18 thread latency trial
on:
  push:
    branches: [main]
    paths:
      - ".deploy/HF_CHAT_QWEN35_THREAD_AB_REQUEST.txt"
permissions:
  contents: read
concurrency:
  group: swrlz-hf-space-deployment
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Validate explicit request for unchanged free CPU hardware
        id: approval
        shell: bash
        run: |
          set -euo pipefail
          request=.deploy/HF_CHAT_QWEN35_THREAD_AB_REQUEST.txt
          test -f "$request"
          get() { sed -n "s/^$1=//p" "$request" | tail -n 1; }
          test "$(get TARGET)" = "kamiloki/Swyrlz"
          test "$(get APPROVED)" = "1"
          test "$(get BASE_THREADS)" = "16"
          test "$(get TRIAL_THREADS)" = "18"
          ref="$(get SOURCE_REF)"
          nonce="$(get REQUEST_NONCE)"
          [[ "$ref" =~ ^[a-f0-9]{40}$ ]]
          [[ "$nonce" =~ ^[a-z0-9-]{12,96}$ ]]
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "No new hardware; test 18 threads on measured 16 CPU quota, revert unless faster."
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.approval.outputs.ref }}
          path: thread-trial-source
          fetch-depth: 1
      - name: Install Hugging Face release client
        run: python -m pip install 'huggingface_hub>=0.34,<2'
      - name: Parse and independently snapshot exact existing backend
        working-directory: thread-trial-source
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          python -m py_compile scripts/hf_qwen35_thread_trial.py
          python -u scripts/hf_qwen35_thread_trial.py snapshot
      - name: Preserve rollback source off-box before any changes
        uses: actions/upload-artifact@v4
        with:
          name: swrlz-9b-thread-trial-exact-16-thread-rollback
          path: thread-trial-source/qwen35-thread-experiment-backup/
          retention-days: 14
          if-no-files-found: error
      - name: Benchmark same inputs on 16 and 18; retain only if faster
        working-directory: thread-trial-source
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SWRLZ_THREAD_TRIAL_APPROVED: "1"
        run: |
          set -euo pipefail
          python -u scripts/hf_qwen35_thread_trial.py trial
          echo "SWRLZ_16_VS_18_BENCHMARK_REPORTED"
