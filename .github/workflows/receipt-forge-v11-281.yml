name: §E v11.281 Rocky Anime Hand sealed release
# Rerun after adding missing dot/cross vector operations to the narrow smoke harness
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/receipt-forge-v11-281.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sealed:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native rocky hand generator smoke
        run: node projects/swrlz-forge-moba/scripts/smoke_v11_281_rocky_hand.js
      - name: Verify source-sealed release and assembled JavaScript syntax
        run: python projects/swrlz-forge-moba/scripts/verify_v11_281_release.py --output /tmp/se281-sealed
