name: Verify §E v11.217 sealed hand release
on:
  push:
    branches: [main]
    paths:
      - 'projects/swrlz-forge-moba/source-manifest.json'
      - 'projects/swrlz-forge-moba/scripts/verify_v11_217_release.py'
      - '.github/workflows/verify-forge-v11-217-sealed.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sealed:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify sealed HTML, modeler route and all 68 assets
        run: python3 projects/swrlz-forge-moba/scripts/verify_v11_217_release.py --output /tmp/swrlz-hand-v11-217-release
      - name: Check native hand geometry JS syntax
        run: node --check projects/swrlz-forge-moba/runtime/model_atelier_hand_proportions_v11_217.js
