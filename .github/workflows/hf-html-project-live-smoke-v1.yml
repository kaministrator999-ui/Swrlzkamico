name: Verify live §C HTML project publishing end to end
on:
  push:
    branches: [main]
    paths: ['.deploy/HF_HTML_PROJECT_SMOKE_REQUEST.txt']
permissions: {contents: read}
concurrency:
  group: swrlz-hf-space-deployment
  cancel-in-progress: false
jobs:
  smoke:
    if: ${{ github.actor == 'kaministrator999-ui' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Require exact owner-approved acceptance project and source
        id: approved
        shell: bash
        run: |
          set -euo pipefail
          request='.deploy/HF_HTML_PROJECT_SMOKE_REQUEST.txt'
          test -f "$request"
          get() { sed -n "s/^$1=//p" "$request" | tail -n 1; }
          test "$(get TARGET)" = "kamiloki/Swyrlz"
          test "$(get APPROVED)" = "1"
          test "$(get CHANGE_SCOPE)" = "html-publish-check-only"
          test "$(get PROJECT)" = "html-publish-check"
          ref="$(get SOURCE_REF)"
          nonce="$(get REQUEST_NONCE)"
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          [[ "$nonce" =~ ^[a-z0-9-]{12,96}$ ]]
          git merge-base --is-ancestor "$ref" HEAD
          git diff --exit-code "$ref" HEAD -- scripts/hf_html_project_publish_v1.py html-projects/html-publish-check/index.html
          git diff-tree --no-commit-id --name-only -r HEAD | grep -Fx "$request"
          echo "source=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.approved.outputs.source }}
          path: reviewed-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet 'huggingface_hub>=0.34,<2'
      - name: Verify sample and immutable selected source
        env:
          SOURCE_SHA: ${{ steps.approved.outputs.source }}
          SWRLZ_PROJECT_SOURCE_ROOT: reviewed-source
        run: |
          python -m py_compile scripts/hf_html_project_publish_v1.py
          python scripts/hf_html_project_publish_v1.py validate --project html-publish-check
          python - <<'PY'
          from scripts.hf_html_project_publish_v1 import assert_immutable_source
          assert_immutable_source()
          PY
      - name: Publish exact acceptance fixture to existing CSP-isolated Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SWRLZ_HTML_PROJECT_APPROVED: '1'
          SOURCE_SHA: ${{ steps.approved.outputs.source }}
          SWRLZ_PROJECT_SOURCE_ROOT: reviewed-source
        run: python -u scripts/hf_html_project_publish_v1.py publish --project html-publish-check --approved yes
      - name: Verify publicly served HTML digest and sandbox headers
        env:
          SWRLZ_PROJECT_SOURCE_ROOT: reviewed-source
        run: python -u scripts/hf_html_project_publish_v1.py probe --project html-publish-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swrlz-html-live-publication-check-receipt
          path: html-project-receipt.json
          if-no-files-found: warn
          retention-days: 30
