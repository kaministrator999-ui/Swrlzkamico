name: Verify §E v11.196 Quest camera and shared fog candidate
on:
  push:
    branches: [fix/quest-sheep-v196-stable-menu-fog-camera]
    paths:
      - "projects/swrlz-forge-moba/**"
      - ".github/workflows/verify-v11-196-candidate.yml"
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Shared fog and Quest XR regressions
        run: |
          node --check projects/swrlz-forge-moba/runtime/engine_xr_sheep_stability_v11_196.js
          python -m py_compile projects/swrlz-forge-moba/patches/v11_196_sheep_fog_radial_camera_recovery.py
          node projects/swrlz-forge-moba/tests/test_v11_196_quest_fog_menu.cjs
          node projects/swrlz-forge-moba/tests/test_v11_195_quest_stability.cjs
          node projects/swrlz-forge-moba/tests/test_v11_194_emberfall_arpg.cjs
          node projects/swrlz-forge-moba/tests/test_v11_193_sheep_vr.cjs
          node projects/swrlz-forge-moba/tests/test_v11_192_native_vr_editor.cjs
          node projects/swrlz-forge-moba/tests/test_v11_191_xr_recovery.cjs
      - name: Build additive 228-patch candidate and derive exact checksum
        run: |
          python - <<'PY'
          import sys,json,subprocess,hashlib
          from pathlib import Path
          root=Path('projects/swrlz-forge-moba')
          p=root/'source-manifest.json'
          m=json.loads(p.read_text(encoding='utf8'))
          new='patches/v11_196_sheep_fog_radial_camera_recovery.py'
          if new not in m['patches']:m['patches'].append(new)
          assert len(m['patches'])==228 and m['patches'][-1]==new
          m['name']='§wyrl§ Engine v11.196'
          m['finalArtifact']='swyrl_engine_v11_196.html'
          m['finalBytes']=0;m['finalSha256']=''
          p.write_text(json.dumps(m,indent=2,ensure_ascii=False)+'\n',encoding='utf8')
          subprocess.run([sys.executable,str(root/'build_space.py'),'--output','dist/quest196'],check=True)
          raw=Path('dist/quest196/index.html').read_bytes()
          html=raw.decode('utf8')
          for needle in ['V11_196_SHEEP_FOG_RADIAL_CAMERA_RECOVERY',
                         'se196FogRepair','se195PositionRadial=function',
                         'se195MenuCamera=function','se195FollowCamera=function',
                         'window.SWYRL_ENGINE_SHEEP_VR_FIX196']:
              assert needle in html,needle
          assert html.count('renderer.setAnimationLoop(tick);')==1
          assert len(json.loads(Path('dist/quest196/SOURCE.json').read_text(encoding='utf8'))['assets'])==68
          print('SE196_BYTES='+str(len(raw)),flush=True)
          print('SE196_SHA256='+hashlib.sha256(raw).hexdigest(),flush=True)
          print('SE196_BUILD_PASS',flush=True)
          PY
