name: Release §C GitHub HTML project approval and deploy UI
on:
  pull_request:
    paths:
      - 'api/github_html_publish_action_v1.py'
      - 'chat/html-project-publish-review-v1.js'
      - 'scripts/hf_chat_html_publish_ui_release_v1.py'
      - 'tests/test_github_html_publish_action_v1.py'
      - '.github/workflows/hf-chat-html-publish-ui-release-v1.yml'
      - '.github/workflows/hf-html-project-publish-v1.yml'
  push:
    branches: [main]
    paths:
      - 'api/github_html_publish_action_v1.py'
      - 'chat/html-project-publish-review-v1.js'
      - 'scripts/hf_chat_html_publish_ui_release_v1.py'
      - '.github/workflows/hf-chat-html-publish-ui-release-v1.yml'
      - 'html-projects/README.md'
permissions: {contents: read}
concurrency:
  group: swrlz-hf-space-deployment
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet 'requests>=2.31,<3'
      - run: python -m py_compile api/github_html_publish_action_v1.py scripts/hf_chat_html_publish_ui_release_v1.py
      - run: node --check chat/html-project-publish-review-v1.js
      - run: python -m unittest discover -s tests -p 'test_github_html_publish_action_v1.py' -v
      - run: python scripts/hf_chat_html_publish_ui_release_v1.py selftest
  release:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release-html-publish-ui-v1]') }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet 'huggingface_hub>=0.34,<2'
      - name: CAS publish only Station routing, GitHub handler, review UI and two new helper assets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SWRLZ_HTML_CHAT_APPROVED: '1'
        run: python scripts/hf_chat_html_publish_ui_release_v1.py publish
