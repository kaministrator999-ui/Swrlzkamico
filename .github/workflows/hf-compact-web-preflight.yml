name: Preflight §C compact HTML source-preserving profile
on:
  push:
    branches: [main]
    paths:
      - 'scripts/hf_compact_web_profile_v1.py'
      - '.github/workflows/hf-compact-web-preflight.yml'
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet 'huggingface_hub>=0.34,<2'
      - run: python -m py_compile scripts/hf_compact_web_profile_v1.py
      - name: Check exact deployed source, target selection and preserved code budget
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u scripts/hf_compact_web_profile_v1.py preflight
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-web-profile-preflight-${{ github.run_id }}
          path: reports/swrlz-compact-web-profile/
          retention-days: 21
          if-no-files-found: ignore
