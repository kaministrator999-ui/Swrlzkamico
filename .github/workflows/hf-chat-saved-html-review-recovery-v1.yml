name: Restore §C saved HTML project review and place approval after code
on:
  push:
    branches: [main]
    paths:
      - api/github_html_project_handoff_v1.py
      - scripts/hf_chat_saved_html_review_recovery_v1.py
      - tests/test_github_html_project_handoff_v1.py
      - .github/workflows/hf-chat-saved-html-review-recovery-v1.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: swrlz-hf-space-deployment
  cancel-in-progress: false
jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release-saved-html-review-v1]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install scoped Space dependencies
        run: python -m pip install --quiet 'huggingface_hub>=0.34,<2' 'requests>=2.31,<3'
      - name: Validate saved-artifact command and source integrity
        run: |
          python -m py_compile scripts/hf_chat_saved_html_review_recovery_v1.py api/github_html_project_handoff_v1.py
          python -m unittest discover -s tests -p 'test_github_html_project_handoff_v1.py' -v
          python scripts/hf_chat_saved_html_review_recovery_v1.py selftest
      - name: Validate exact live Station and UI anchors
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/hf_chat_saved_html_review_recovery_v1.py preflight
      - name: Publish and verify same-thread saved HTML review to live Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SWRLZ_SAVED_HTML_REVIEW_APPROVED: '1'
        run: python -u scripts/hf_chat_saved_html_review_recovery_v1.py publish
