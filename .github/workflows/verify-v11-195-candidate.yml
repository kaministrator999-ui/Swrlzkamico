name: Verify §E v11.195 Quest Sheep stability candidate
on:
  push:
    branches: [fix/quest-sheep-vr-195-camera-fog-radial]
    paths:
      - "projects/swrlz-forge-moba/**"
      - ".github/workflows/verify-v11-195-candidate.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Quest XR stability and existing regression
        run: |
          node --check projects/swrlz-forge-moba/runtime/engine_xr_sheep_stability_v11_195.js
          python -m py_compile projects/swrlz-forge-moba/patches/v11_195_quest_sheep_stability_radial.py
          node projects/swrlz-forge-moba/tests/test_v11_195_quest_stability.cjs
          node projects/swrlz-forge-moba/tests/test_v11_194_emberfall_arpg.cjs
          node projects/swrlz-forge-moba/tests/test_v11_193_sheep_vr.cjs
          node projects/swrlz-forge-moba/tests/test_v11_192_native_vr_editor.cjs
          node projects/swrlz-forge-moba/tests/test_v11_191_xr_recovery.cjs
      - name: Rebuild 227 patches and calculate canonical exact bytes and SHA
        run: |
          python - <<'PY'
          import hashlib,json,subprocess,sys
          from pathlib import Path
          root=Path('projects/swrlz-forge-moba')
          p=root/'source-manifest.json'
          m=json.loads(p.read_text(encoding='utf8'))
          patch='patches/v11_195_quest_sheep_stability_radial.py'
          if patch not in m['patches']:m['patches'].append(patch)
          assert len(m['patches'])==227 and m['patches'][-1]==patch
          m['name']='§wyrl§ Engine v11.195'
          m['finalArtifact']='swyrl_engine_v11_195.html'
          m['finalBytes']=0;m['finalSha256']=''
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf8')
          subprocess.run([sys.executable,str(root/'build_space.py'),'--output','dist/quest195'],check=True)
          html=Path('dist/quest195/index.html').read_bytes()
          s=html.decode('utf8')
          for marker in ['SWYRL_ENGINE_DEPLOY_MARKER: V11_195_QUEST_SHEEP_STABILITY_RADIAL',
                         "window.SWYRL_ENGINE_VR_POLISH", "se195RadialHit",
                         "se195FollowCamera", "se195FogPrepare"]:
              assert marker in s,marker
          assert s.count('renderer.setAnimationLoop(tick);')==1
          assert len(json.loads(Path('dist/quest195/SOURCE.json').read_text())['assets'])==68
          print('QUEST_195_BYTES='+str(len(html)),flush=True)
          print('QUEST_195_SHA256='+hashlib.sha256(html).hexdigest(),flush=True)
          print('QUEST_195_SOURCE_PASS',flush=True)
          PY
