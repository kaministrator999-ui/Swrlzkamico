name: Deploy §wyrl§ Engine to Hugging Face

# Deliberately minimal: build the release package and upload it.
# No browser tests, asset-fetch audit, live polling, or separate verification.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/DEPLOY_REQUEST.json"

permissions:
  contents: read

concurrency:
  group: swrlz-forge-moba-hf
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout engine source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Package the engine for HF
        run: python projects/swrlz-forge-moba/scripts/verify_v11_487_release.py --output dist/swrlz-forge-moba --request
      - name: Prepare browser-renderable static files under 10MB each
        run: |
          python projects/swrlz-forge-moba/scripts/package_static_delivery_v11_487.py --output dist/swrlz-forge-moba
          node --check dist/swrlz-forge-moba/swrlz-engine-v11.487.js
      - name: Upload to the existing static HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m pip install --quiet "huggingface_hub>=0.34,<2"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          token=os.environ.get("HF_TOKEN","")
          if not token:
              raise SystemExit("HF_TOKEN is required")
          HfApi(token=token).upload_folder(
              folder_path="dist/swrlz-forge-moba",
              repo_id="kamiloki/swrlz-forge-moba",
              repo_type="space",
              commit_message="Deploy §wyrl§ Engine from GitHub",
          )
          print("Uploaded §wyrl§ Engine to https://huggingface.co/spaces/kamiloki/swrlz-forge-moba")
          PY

      - name: Convert published HTML entrypoints to regular Git blobs
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python projects/swrlz-forge-moba/scripts/repair_static_html_git_blobs.py
      - name: Check public HTML and JavaScript response headers
        run: |
          python - <<'PY'
          import time
          from urllib.request import Request, urlopen
          host="https://kamiloki-swrlz-forge-moba.static.hf.space/"
          for route,want in (("", "text/html"), ("modeler.html", "text/html"),
                             ("swrlz-engine-v11.487.js", "javascript")):
              last=None
              for attempt in range(8):
                  try:
                      req=Request(host+route,headers={"Cache-Control":"no-cache"})
                      with urlopen(req,timeout=22) as response:
                          mime=(response.headers.get("Content-Type") or "").lower()
                          disposition=(response.headers.get("Content-Disposition") or "").lower()
                          size=response.headers.get("Content-Length")
                          print("SPACE_HTTP",route or "/",response.status,mime,disposition,size,flush=True)
                          if want not in mime or "attachment" in disposition:
                              raise ValueError("Public URL still downloads instead of rendering")
                      last=None
                      break
                  except Exception as e:
                      last=e
                      if attempt<7: time.sleep(6)
              if last is not None: raise SystemExit(f"Browser-delivery check failed: {route or '/'}: {last}")
          print("SE487_PUBLIC_BROWSER_DELIVERY_OK",flush=True)
          PY
