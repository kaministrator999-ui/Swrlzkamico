name: Deploy §wyrl§ Engine to Hugging Face

# Version-neutral workflow name: the independent hosted audit listens to it via workflow_run.
# Production deploys only when the dedicated release-button file is deliberately changed.
# Ordinary §E source/docs/manifest edits MUST NOT trigger production.
on:
  push:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/DEPLOY_REQUEST.json"

permissions:
  contents: read

concurrency:
  group: swrlz-forge-moba-hf
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact GitHub source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Package the verified v11.136 source for deployment
        run: |
          set -euo pipefail
          python projects/swrlz-forge-moba/scripts/verify_v11_136_release.py --output dist/swrlz-forge-moba
          test -s dist/swrlz-forge-moba/index.html
          test -s dist/swrlz-forge-moba/README.md
          grep -q "SWYRL_ENGINE_DEPLOY_MARKER: V11_136_SHEEP_DRAG_CAMERA_CAPTURE_CLEANUP" dist/swrlz-forge-moba/index.html
          grep -q "sdk: static" dist/swrlz-forge-moba/README.md
          node --check dist/swrlz-forge-moba-module.mjs
          # Ensure runtime labels, source seal and requested deployment agree.
          python - <<'PY'
          import hashlib, json, re
          from pathlib import Path
          root = Path("projects/swrlz-forge-moba")
          out = Path("dist/swrlz-forge-moba")
          manifest = json.loads((root/"source-manifest.json").read_text())
          request = json.loads((root/"DEPLOY_REQUEST.json").read_text())
          receipt = json.loads((out/"SOURCE.json").read_text())
          version = request["releaseVersion"]
          assert re.fullmatch(r"v[0-9]+[.][0-9]+(?:[.][0-9]+)?", version), version
          assert manifest["name"] == "§wyrl§ Engine " + version
          assert manifest["finalArtifact"] == "swyrl_engine_" + version.replace(".", "_") + ".html"
          assert request["target"] == "kamiloki/swrlz-forge-moba"
          assert receipt["sourceVersion"] == manifest["name"]
          assert receipt["patches"] == manifest["patches"]
          assert len(receipt["patches"]) == len(manifest["patches"])
          assert receipt["assets"] and len(receipt["assets"]) == 68
          raw = (out/"index.html").read_bytes()
          digest = hashlib.sha256(raw).hexdigest()
          assert manifest["finalSha256"] == receipt["finalSha256"] == request["sourceIntegritySha256"] == digest
          assert manifest["finalBytes"] == receipt["finalBytes"] == len(raw)
          html = raw.decode("utf-8")
          assert html.count(request["deployMarker"]) == 1
          assert "<title>§wyrl§ Engine · Maker " + version + "</title>" in html
          assert "window.SWRLZ_FORGE_BUILD={version:'" + version + "'" in html
          source_commit = request.get("sourceCommit")
          assert source_commit and re.fullmatch(r"[0-9a-f]{40}", source_commit), source_commit
          print("SE_VERSION_METADATA_ALIGNED", version, digest, len(raw), len(manifest["patches"]))
          PY

      - name: Install Hugging Face Hub client
        run: python -m pip install "huggingface_hub>=0.34,<2"

      - name: Create/update dedicated static Space
        id: deploy_space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN" || { echo "::error::HF_TOKEN repository secret is missing."; exit 1; }
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]
          target = "kamiloki/swrlz-forge-moba"
          source_sha = os.environ["SOURCE_SHA"]
          folder = Path("dist/swrlz-forge-moba")

          api = HfApi(token=token)
          api.create_repo(
              repo_id=target,
              repo_type="space",
              space_sdk="static",
              private=False,
              exist_ok=True,
          )

          commit = api.upload_folder(
              folder_path=str(folder),
              repo_id=target,
              repo_type="space",
              commit_message=f"Deploy §wyrl§ Engine from GitHub {source_sha[:12]}",
          )

          info = api.space_info(target)
          host = getattr(info, "host", None)
          subdomain = getattr(info, "subdomain", None)
          if host:
              app_url = host if str(host).startswith("http") else f"https://{host}"
          elif subdomain:
              app_url = f"https://{subdomain}.hf.space"
          else:
              raise RuntimeError("Hugging Face SpaceInfo did not expose host or subdomain")
          app_url = app_url.rstrip("/") + "/"

          source = json.loads((folder / "SOURCE.json").read_text(encoding="utf-8"))
          receipt = {
              "schema": "swrlz-forge-hf-deploy-v1",
              "deployedAt": datetime.now(timezone.utc).isoformat(),
              "sourceRepository": "kaministrator999-ui/Swrlzkamico",
              "sourceCommit": source_sha,
              "sourcePath": "projects/swrlz-forge-moba",
              "sourceVersion": "v11.136",
              "engineName": "§wyrl§ Engine",
              "sourceSha256": source["finalSha256"],
              "sourceBytes": source["finalBytes"],
              "sourceAssets": source["assets"],
              "sourcePatchCount": len(source["patches"]),
              "sourceLatestPatch": source["patches"][-1],
              "spaceRepository": target,
              "spaceRevision": info.sha,
              "spacePage": "https://huggingface.co/spaces/kamiloki/swrlz-forge-moba",
              "appUrl": app_url,
              "spaceHost": host,
              "spaceSubdomain": subdomain,
              "spaceStage": str(getattr(getattr(info, "runtime", None), "stage", None)),
              "spacePrivate": getattr(info, "private", None),
              "uploadCommit": getattr(commit, "oid", None) or getattr(commit, "commit_id", None),
          }
          Path("swrlz-forge-deploy-receipt.json").write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"app_url={app_url}\n")
          print(json.dumps(receipt, indent=2))
          PY

      - name: Verify live Space serves the complete §wyrl§ Engine v11.136 package
        env:
          SOURCE_SHA: ${{ github.sha }}
          APP_URL: ${{ steps.deploy_space.outputs.app_url }}
        run: |
          set -euo pipefail
          test -n "$APP_URL" || { echo "::error::Hugging Face did not return a live app URL."; exit 1; }
          URL="${APP_URL}?build=$SOURCE_SHA"
          EXPECTED_HTML_SHA="$(sha256sum dist/swrlz-forge-moba/index.html | cut -d ' ' -f1)"
          EXPECTED_HTML_BYTES="$(wc -c < dist/swrlz-forge-moba/index.html)"
          python - <<'PYCODE'
          import json
          from pathlib import Path
          official=json.loads(Path('dist/swrlz-forge-moba/SOURCE.json').read_text())
          assert len(official['patches'])==168
          assert official['patches'][-3]=='patches/v11_134_rapid_cancel_sheep_seed_skills_house_swap.py'
          assert official['patches'][-2]=='patches/v11_135_sheep_ghost_relative_drag_hud.py'
          assert official['patches'][-1]=='patches/v11_136_sheep_drag_capture_cleanup.py'
          expected={'episodes/ghosts-in-different-forms-ep01.html',
                    'scenes/ghosts-in-different-forms-ep01.swyrl.json',
                    'scenes/ghosts-in-different-forms-ep01-storybook.swyrl.json',
                    'scenes/ghosts-in-different-forms-ep01-rigged.swyrl.json',
                    'scenes/ghosts-in-different-forms-ep01-depth.swyrl.json',
                    'scenes/ghosts-in-different-forms-ep01-positioned.swyrl.json',
                    'scenes/ghosts-in-different-forms-ep01-sockets.swyrl.json',
                    'scenes/ghosts-in-different-forms-ep01-staff-grip.swyrl.json',
                    'scenes/ghosts-in-different-forms-ep01-natural-grip.swyrl.json',
                    'scenes/ghosts-in-different-forms-ep01-full-staff.swyrl.json',
                    'scenes/ghosts-in-different-forms-ep01-performance.swyrl.json',
                    'scenes/sheep-tag-meadow.swyrl.json',
                    'scenes/sheep-tag-moonbell-archive.swyrl.json',
                    'scenes/maul-frostveil.swyrl.json',
                    'scenes/maul-frostveil-classic.swyrl.json',
                    'scenes/maul-frostveil-groups.swyrl.json',
                    'scenes/maul-frostveil-flight.swyrl.json',
                    'scenes/model-atelier-prism-jester.swyrl.json','scenes/model-atelier-prism-jester-ferret-v11-4.swyrl.json','scenes/model-atelier-prism-jester-festival-v11-5.swyrl.json','scenes/model-atelier-prism-jester-festival-v11-6.swyrl.json','scenes/model-atelier-prism-jester-festival-v11-7.swyrl.json','scenes/model-atelier-prism-jester-festival-v11-8.swyrl.json','scenes/model-atelier-prism-jester-festival-v11-9.swyrl.json','scenes/model-atelier-festival-reference-v11-13.swyrl.json','scenes/model-atelier-festival-refined-v11-14.swyrl.json','scenes/model-atelier-festival-surface-v11-15.swyrl.json','scenes/model-atelier-festival-detail-v11-16.swyrl.json','scenes/model-atelier-festival-hd-v11-17.swyrl.json','scenes/model-atelier-festival-reference-v11-18.swyrl.json','scenes/model-atelier-festival-polish-v11-19.swyrl.json', 'scenes/model-atelier-festival-anatomy-v11-20.swyrl.json'}
          expected.update('assets/anime/'+name+'.png' for name in (
              'kami','swyrlz','cathedral','workshop','foreground','kami-rig',
              'swyrlz-rig','scenery-parts','kami-grip-layers',
              'mage-faces-painted','kami-full-staff'))
          expected.update({'scenes/model-atelier-comet-courier-v11-77.swyrl.json','assets/models/comet-courier/astra-basecolor-4k.jpg','assets/models/comet-courier/astra-normal-4k.png'})
          expected.update({'scenes/sheep-tag-wildwood-v11-79.swyrl.json','assets/sheep-tag/moonbell-wildwood-ground-4k.jpg'})
          expected.update({'scenes/model-atelier-organic-sheep-v11-87.swyrl.json','scenes/model-atelier-organic-wolf-v11-87.swyrl.json','assets/models/wildwood-animals/wildwood-basecolor-4k.jpg','assets/models/wildwood-animals/wildwood-normal-4k.png'})
          expected.update({'scenes/sheep-tag-vast-wildwood-v11-80.swyrl.json','scenes/sheep-tag-wide-walkways-v11-84.swyrl.json','scenes/sheep-tag-seven-minute-v11-85.swyrl.json'})
          expected.add('scenes/model-atelier-original-wolf-organic-v11-88.swyrl.json')
          expected.update({'scenes/model-atelier-living-astra-v11-89.swyrl.json','scenes/sheep-tag-clover-model-v11-89.swyrl.json'})
          expected.update({'scenes/model-atelier-furred-astra-v11-90.swyrl.json','scenes/sheep-tag-furred-wolf-v11-90.swyrl.json'})
          expected.update({'scenes/model-atelier-girl-saved-v11-90.swyrl.json','scenes/model-atelier-organic-anime-girl-v11-91.swyrl.json','assets/models/festival-girl/festival-basecolor-4k.jpg','assets/models/festival-girl/festival-normal-4k.png'})
          expected.add('scenes/model-atelier-reference-girl-v11-92.swyrl.json')
          expected.add('scenes/model-atelier-smooth-girl-v11-93.swyrl.json')
          expected.add('scenes/model-atelier-knee-armor-v11-94.swyrl.json')
          expected.add('scenes/model-atelier-fitted-waist-v11-95.swyrl.json')
          assert len(official['assets'])==68
          assert set(official['assets'])==expected
          # Fetch every bundled media asset, including the authored scene and
          # transparent PNG layers, then verify the complete source receipt.
          Path('/tmp/forge-asset-paths.txt').write_text(
              '\n'.join([*sorted(official['assets']), 'SOURCE.json'])+'\n')
          PYCODE
          for attempt in 1 2 3 4 5 6; do
            echo "Live verification attempt $attempt"
            if curl -fsSL --max-time 30 "$URL&attempt=$attempt" -o /tmp/forge-live.html; then
              # Static Spaces inject only their creator metadata script after <head>.
              # Strip that recognized provider wrapper before comparing source bytes.
              python - <<'PYCODE'
          import runpy
          from pathlib import Path
          served = Path("/tmp/forge-live.html").read_bytes()
          normalizer = runpy.run_path('projects/swrlz-forge-moba/scripts/normalize_hf_static_html.py')['normalize_served_html']
          source = normalizer(served)
          Path("/tmp/forge-live-source.html").write_bytes(source)
          PYCODE
              LIVE_HTML_SHA="$(sha256sum /tmp/forge-live-source.html | cut -d ' ' -f1)"
              LIVE_HTML_BYTES="$(wc -c < /tmp/forge-live-source.html)"
              if grep -q "SWYRL_ENGINE_DEPLOY_MARKER: V11_136_SHEEP_DRAG_CAMERA_CAPTURE_CLEANUP" /tmp/forge-live.html && [ "$LIVE_HTML_SHA" = "$EXPECTED_HTML_SHA" ] && [ "$LIVE_HTML_BYTES" -eq "$EXPECTED_HTML_BYTES" ]; then
                ASSET_OK=1
                while IFS= read -r asset; do
                  mkdir -p "/tmp/forge-assets/$(dirname "$asset")"
                  if ! curl -fsSL --max-time 30 "${APP_URL}${asset}?build=$SOURCE_SHA&attempt=$attempt" -o "/tmp/forge-assets/$asset"; then
                    ASSET_OK=0
                    break
                  fi
                done < /tmp/forge-asset-paths.txt
                if [ "$ASSET_OK" -eq 1 ]; then
                  if python - <<'PYCODE'
          import hashlib,json,runpy
          from pathlib import Path
          expected=Path('dist/swrlz-forge-moba/SOURCE.json')
          live_receipt=Path('/tmp/forge-assets/SOURCE.json').read_bytes()
          assert live_receipt==expected.read_bytes(),'Live SOURCE receipt bytes differ'
          source=json.loads(live_receipt)
          official=json.loads(expected.read_text())
          assert source['finalSha256']==official['finalSha256']
          assert source['finalBytes']==official['finalBytes']
          assert source['patches']==official['patches']
          assert source['assets']==official['assets']
          normalizer = runpy.run_path('projects/swrlz-forge-moba/scripts/normalize_hf_static_html.py')['normalize_served_html']
          for asset,meta in official['assets'].items():
              live=Path('/tmp/forge-assets')/asset
              served=live.read_bytes()
              # Static HF Space injects creator metadata into every served HTML
              # file, not only index.html. Remove only this known wrapper.
              data=(normalizer(served) if asset.endswith('.html') else served)
              print('SERVING_ASSET='+asset+' LIVE_BYTES='+str(len(served))+
                    ' NORMALIZED_BYTES='+str(len(data))+
                    ' EXPECTED_BYTES='+str(meta['bytes']))
              assert len(data)==meta['bytes'],asset
              assert hashlib.sha256(data).hexdigest()==meta['sha256'],asset
              assert data==(Path('dist/swrlz-forge-moba')/asset).read_bytes(),asset
          print('LIVE_V10_9_ARTWORK_SCENES_SCREENING_AND_SOURCE_RECEIPT_MATCH')
          PYCODE
                  then
                    echo "Verified: exact §wyrl§ Engine v11.136, all bundled artwork/scenes/screening, and SOURCE receipt."
                    exit 0
                  fi
                fi
                echo "Editor HTML arrived but bundled anime assets or SOURCE receipt did not match yet."
              fi
              echo "Live page responded, but the exact v11.136 artifact was not present yet."
            fi
            sleep 10
          done
          echo "::error::Hugging Face upload completed, but the live Space did not serve the complete v11.136 package within the verification window."
          exit 1

      - name: Preserve deploy receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swrlz-forge-hf-deploy-receipt
          path: swrlz-forge-deploy-receipt.json
          retention-days: 30
