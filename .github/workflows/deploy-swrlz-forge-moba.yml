name: Deploy §wyrl§ Engine to Hugging Face

# Deliberately minimal: build the release package and upload it.
# No browser tests, asset-fetch audit, live polling, or separate verification.
on:
  push:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/DEPLOY_REQUEST.json"

permissions:
  contents: read

concurrency:
  group: swrlz-forge-moba-hf
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout engine source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Package the engine for HF
        run: python projects/swrlz-forge-moba/scripts/verify_v11_178_release.py --output dist/swrlz-forge-moba --request
      - name: Upload to the existing static HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m pip install --quiet "huggingface_hub>=0.34,<2"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          token=os.environ.get("HF_TOKEN","")
          if not token:
              raise SystemExit("HF_TOKEN is required")
          HfApi(token=token).upload_folder(
              folder_path="dist/swrlz-forge-moba",
              repo_id="kamiloki/swrlz-forge-moba",
              repo_type="space",
              commit_message="Deploy §wyrl§ Engine from GitHub",
          )
          print("Uploaded §wyrl§ Engine to https://huggingface.co/spaces/kamiloki/swrlz-forge-moba")
          PY
