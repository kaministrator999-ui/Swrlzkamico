name: Guarded §C non-code intent precision release
on:
  push:
    branches: [main]
    paths:
      - 'scripts/hf_noncoding_intent_precision_v2.py'
      - '.github/workflows/hf-noncode-intent-v2-release.yml'
permissions: {contents: read}
concurrency:
  group: swrlz-chat-hf-music-route-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install version-bounded Hugging Face and anonymous Chromium
        run: |
          python -m pip install 'huggingface_hub>=0.34,<2' playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Compile and run read-only source-backed classifier tests
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m py_compile scripts/hf_noncoding_intent_precision_v2.py
          python -m py_compile scripts/eval_chat_research_lyrics_conversations.py
          python -u scripts/hf_noncoding_intent_precision_v2.py preflight
      - name: Archive exact prior source before any live change
        uses: actions/upload-artifact@v4
        with:
          name: sc-noncode-intent-source-backup-${{ github.run_id }}
          path: reports/sc-noncode-intent-v2/
          retention-days: 90
          if-no-files-found: error
      - name: Publish one-file source only with expected live revision
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SWRLZ_NONCODE_INTENT_APPROVED: '1'
        run: python -u scripts/hf_noncoding_intent_precision_v2.py publish
      - name: Gate acceptance on the exact newly serving HF revision
        id: revision
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m py_compile scripts/hf_wait_exact_serving_revision.py
          SWRLZ_REVISION_GATE_SELFTEST=1 python -u scripts/hf_wait_exact_serving_revision.py
          python -u scripts/hf_wait_exact_serving_revision.py --manifest reports/sc-noncode-intent-v2/manifest.json --limit-seconds 900 --poll-seconds 12
      - name: Run isolated guest reasoning and task-list acceptance
        id: reason
        shell: bash
        env:
          SWRLZ_EVAL_BASE: https://kamiloki-swyrlz.hf.space
          SWRLZ_EVAL_MODEL: 700m
          SWRLZ_RESEARCH_LYRICS_TURN_TIMEOUT: '215'
        run: |
          set -uo pipefail
          if python -u - <<'PY'
          import asyncio,json
          from scripts import eval_chat_research_lyrics_conversations as ev
          chosen={'client-server-direction','guest-browser-constraints',
                  'tests-are-not-deployments','surgical-task-update'}
          ev.CASES['reasoning']=[c for c in ev.CASES['reasoning'] if c['id'] in chosen]
          assert len(ev.CASES['reasoning'])==4
          asyncio.run(ev.main('reasoning'))
          data=json.loads((ev.OUT/'report.json').read_text())
          for case in data['results']:
              print('NONCODE_LIVE_RESULT',json.dumps({
                  'id':case['id'],'outcome':case['outcome'],
                  'failure_types':case.get('failure_types',[])}),flush=True)
              assert case['outcome']!='BLOCKED' and len(case['turns'])==2
              for turn in case['turns']:
                  failed=[c['check'] for c in turn['evaluation']['checks'] if not c['pass']]
                  assert 'no_code_generator_hijack' not in failed,failed
                  assert not any(p.startswith('CODE_DRAFT') or p in
                    {'CODE_REPAIRING','RESUMING_CODE','CANDIDATE_INCOMPLETE'}
                    for p in turn['phases']),turn['phases']
                  # Non-code routing is the patch's acceptance target.
                  # Separate retrieval defects remain visible in artifacts
                  # but must not falsely fail this independent source change.
          PY
          then exitcode=0;else exitcode=$?;fi
          echo "exit=$exitcode" >> "$GITHUB_OUTPUT"
          mkdir -p reports/sc-noncode-intent-acceptance/reason
          cp -a reports/chat-research-lyrics-conversation/. reports/sc-noncode-intent-acceptance/reason/ || true
          echo "NONCODE_REASONING_EXIT=$exitcode"
      - name: Verify legitimate code-generation remains accessible
        id: code
        if: steps.reason.outputs.exit == '0'
        shell: bash
        env:
          SWRLZ_EVAL_BASE: https://kamiloki-swyrlz.hf.space
          SWRLZ_EVAL_MODEL: 700m
        run: |
          set -uo pipefail
          if python -u - <<'PY'
          import asyncio,json
          from scripts import eval_chat_guest_suite as ev
          ev.CASES['1']=[c for c in ev.CASES['1'] if c['id']=='python-repair']
          assert len(ev.CASES['1'])==1
          asyncio.run(ev.main('live','1'))
          data=json.loads((ev.OUT/'report.json').read_text())
          case=data['results'][0]
          print('CODE_GENERATION_POSITIVE_CONTROL',json.dumps({
              'id':case['id'],'status':case['status'],
              'checks':[t['evaluation']['status'] for t in case['turns']]}),flush=True)
          assert case['status']=='PASS_EVIDENCE'
          PY
          then exitcode=0;else exitcode=$?;fi
          echo "exit=$exitcode" >> "$GITHUB_OUTPUT"
          mkdir -p reports/sc-noncode-intent-acceptance/code
          cp -a reports/chat-guest-eval/. reports/sc-noncode-intent-acceptance/code/ || true
          echo "CODE_POSITIVE_CONTROL_EXIT=$exitcode"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sc-noncode-intent-live-acceptance-${{ github.run_id }}
          path: reports/sc-noncode-intent-acceptance/
          retention-days: 21
          if-no-files-found: ignore
      - name: Restore exact previous live source if acceptance fails
        if: ${{ always() && (steps.revision.outcome != 'success' || steps.reason.outputs.exit != '0' || steps.code.outputs.exit != '0') }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SWRLZ_NONCODE_INTENT_APPROVED: '1'
        run: python -u scripts/hf_noncoding_intent_precision_v2.py rollback
      - name: Require original reasoning and coding paths both pass
        if: ${{ always() && (steps.revision.outcome != 'success' || steps.reason.outputs.exit != '0' || steps.code.outputs.exit != '0') }}
        run: |
          echo "::error::Guest verification failed, or revision mismatch; see rollback and saved transcripts."
          exit 1
