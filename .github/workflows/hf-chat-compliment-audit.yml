name: Audit §C live compliments routing and latency safety
on:
  push:
    branches: [main]
    paths: [".github/workflows/hf-chat-compliment-audit.yml"]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Install source reader
        run: python -m pip install 'huggingface_hub>=0.34,<2'
      - name: Read current live route and test safe classifier in isolation
        shell: bash
        run: |
          python - <<'PY'
          import ast, json, os, re
          from pathlib import Path
          from huggingface_hub import HfApi,hf_hub_download
          space="kamiloki/Swyrlz"
          api=HfApi()
          sha=api.repo_info(space,repo_type="space").sha
          print("LIVE_COMPLIMENT_REV",sha,flush=True)
          s=Path(hf_hub_download(space,"lfm2_700m_engine.py",repo_type="space",revision=sha)).read_text()
          lines=s.splitlines()
          t=ast.parse(s)
          for n in t.body:
              if isinstance(n,ast.FunctionDef) and n.name=="_qwen35_plain_social_turn":
                  print("LIVE_SOCIAL_CLASSIFIER",ast.get_source_segment(s,n),flush=True)
                  mod=ast.Module(body=[n],type_ignores=[])
                  scope={"re":re}
                  exec(compile(mod,"<classifier>","exec"),scope)
                  fn=scope[n.name]
                  for prompt in ("good job","Good job!","good job lol","Nice!","Awesome","thanks","2 + 2","fix this bug","good job on the patch","can you verify the source?"):
                      try: result=fn(prompt,{}, {},False,False)
                      except Exception as e: result=type(e).__name__
                      print("SOCIAL_CLASSIFICATION",json.dumps({"prompt":prompt,"result":result}),flush=True)
          for i,line in enumerate(lines):
              if "_qwen35_plain_social_turn(" in line and "def " not in line:
                  lo=max(0,i-14);hi=min(len(lines),i+35)
                  print("LIVE_SOCIAL_HOOK",json.dumps({"startLine":lo+1,"code":lines[lo:hi]}),flush=True)
              if 'programming_intent(' in line or 'codingTask' in line and 0<i<150:
                  lo=max(0,i-3);hi=min(len(lines),i+7)
                  print("LIVE_PROGRAMMING_ROUTE",json.dumps({"startLine":lo+1,"code":lines[lo:hi]}),flush=True)
          print("LIVE_COMPLIMENT_AUDIT_DONE",flush=True)
          PY
