name: Measure §E v11.61 governed source seal
on:
  pull_request:
    paths:
      - 'projects/swrlz-forge-moba/patches/v11_61_context_workbench.py'
      - 'projects/swrlz-forge-moba/patches/v11_61_context_workbench_preview.py'
      - 'projects/swrlz-forge-moba/scripts/measure_v11_61_release.py'
      - '.github/workflows/measure-atelier-v11-61.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Independently seal cumulative v11.61 patch chain
        run: |
          python projects/swrlz-forge-moba/scripts/measure_v11_61_release.py
          python -m py_compile projects/swrlz-forge-moba/patches/v11_61_context_workbench.py
