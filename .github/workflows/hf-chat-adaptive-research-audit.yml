name: Read-only §C adaptive public research source audit
on:
  push:
    branches: [main]
    paths: [".github/workflows/hf-chat-adaptive-research-audit.yml"]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: python -m pip install --quiet "huggingface_hub>=0.34,<2"
      - name: Inspect exact live retrieval functions and research call arguments
        run: |
          python - <<'PY'
          from huggingface_hub import HfApi,hf_hub_download
          from pathlib import Path
          import ast,hashlib,json,re
          space="kamiloki/Swyrlz"
          api=HfApi();rev=api.repo_info(space,repo_type="space").sha
          print("SWRLZ_ADAPTIVE_SOURCE_REV",rev,flush=True)
          for path in ("api/selective_retrieval.py","api/online_research.py","lfm2_700m_engine.py"):
            try:src=Path(hf_hub_download(space,path,repo_type="space",revision=rev)).read_text()
            except Exception as e:
              print("SWRLZ_ADAPTIVE_MISSING",path,str(e)[:180],flush=True);continue
            lines=src.splitlines();tree=ast.parse(src)
            print("SWRLZ_ADAPTIVE_FILE",json.dumps({"path":path,"bytes":len(src),
                "sha256":hashlib.sha256(src.encode()).hexdigest(),"lines":len(lines)}),flush=True)
            if path=="api/selective_retrieval.py":
              for node in tree.body:
                if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)) and node.name in (
                  "choose_retrieval","bounded_evidence","enrich_payload",
                  "reference_pages","extended_reference_pages"):
                    excerpt="\n".join("%d:%s"%(i+1,lines[i])
                                      for i in range(node.lineno-1,min(node.end_lineno,len(lines))))
                    print("SWRLZ_ADAPTIVE_FUNCTION",json.dumps({
                      "name":node.name,"text":excerpt[:25000]},ensure_ascii=False),flush=True)
            elif path=="api/online_research.py":
              for node in tree.body:
                if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)) and node.name in (
                  "research","_page_fetch","_search","_search_public"):
                    excerpt="\n".join("%d:%s"%(i+1,lines[i])
                                      for i in range(node.lineno-1,min(node.end_lineno,len(lines))))
                    print("SWRLZ_ADAPTIVE_FUNCTION",json.dumps({
                      "name":node.name,"text":excerpt[:15000]},ensure_ascii=False),flush=True)
            else:
              hits=[(i+1,line.strip()[:190]) for i,line in enumerate(lines)
                    if any(t in line for t in ('RESEARCH_READY','enrich_payload(','online_context=','source_trace_events','fact_guard'))]
              print("SWRLZ_ADAPTIVE_ENGINE_SEAMS",json.dumps(hits[:65],ensure_ascii=False),flush=True)
          PY