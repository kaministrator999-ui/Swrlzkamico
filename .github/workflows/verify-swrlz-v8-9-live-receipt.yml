name: Audit exact §E hosted release
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy §wyrl§ Engine v9.4 to Hugging Face"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  receipt:
    runs-on: ubuntu-latest
    steps:
      - name: Read the production release authority from main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Check exact deploy run and live source with every bundled asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,json,os,re,subprocess,time,urllib.request
          from pathlib import Path
          engine='projects/swrlz-forge-moba'
          request=json.loads(Path(engine+'/DEPLOY_REQUEST.json').read_text())
          trigger=subprocess.check_output(['git','log','-1','--format=%H','--',engine+'/DEPLOY_REQUEST.json'],text=True).strip()
          source_commit=request['sourceCommit']
          def committed(path):
              return subprocess.check_output(['git','show',source_commit+':'+engine+'/'+path])
          manifest=json.loads(committed('source-manifest.json'))
          expected=request['sourceIntegritySha256']
          assert manifest['finalSha256']==expected
          repo='kaministrator999-ui/Swrlzkamico'
          url=f'https://api.github.com/repos/{repo}/actions/workflows/deploy-swrlz-forge-moba.yml/runs?per_page=40'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json',
                   'X-GitHub-Api-Version':'2022-11-28'}
          def load(url,extra=None):
              req=urllib.request.Request(url,headers={**(extra or {}),'User-Agent':'swyrl-engine-live-audit'})
              return urllib.request.urlopen(req,timeout=35).read()
          final=None
          for attempt in range(16):
              runs=json.loads(load(url,headers)).get('workflow_runs',[])
              matches=[run for run in runs if run.get('head_sha')==trigger]
              if matches:
                  final=matches[0]
                  print('DEPLOY_RUN_ID='+str(final['id'])+' STATUS='+str(final['status'])+
                        ' CONCLUSION='+str(final['conclusion'])+' URL='+str(final['html_url']),flush=True)
                  if final['status']=='completed':break
              time.sleep(5)
          assert final and final['status']=='completed' and final['conclusion']=='success','Exact dedicated deployment did not succeed'
          root='https://kamiloki-swrlz-forge-moba.static.hf.space/'
          def normalized(payload):
              return re.sub(rb'(?<=<head>)<script>window\.huggingface=\{variables:\{.*?\}\};</script>',b'',payload,count=1)
          html=normalized(load(root+'index.html?receipt='+trigger))
          digest=hashlib.sha256(html).hexdigest()
          assert digest==expected
          assert len(html)==manifest['finalBytes']
          assert request['deployMarker'].encode() in html
          receipt=json.loads(load(root+'SOURCE.json?receipt='+trigger))
          assert receipt['finalSha256']==digest and receipt['finalBytes']==len(html)
          assert receipt['patches']==manifest['patches']
          paths=subprocess.check_output(['git','ls-tree','-r','--name-only',source_commit,'--',engine],text=True).splitlines()
          source_paths={path[len(engine)+1:] for path in paths}
          expected_assets={'episodes/ghosts-in-different-forms-ep01.html','scenes/ghosts-in-different-forms-ep01.swyrl.json'}
          for authored in ('scenes/ghosts-in-different-forms-ep01-storybook.swyrl.json',
                           'scenes/ghosts-in-different-forms-ep01-rigged.swyrl.json',
                           'scenes/ghosts-in-different-forms-ep01-depth.swyrl.json',
                           'scenes/ghosts-in-different-forms-ep01-positioned.swyrl.json',
                           'scenes/ghosts-in-different-forms-ep01-sockets.swyrl.json'):
              if authored in source_paths:expected_assets.add(authored)
          expected_assets.update(path for path in source_paths if path.startswith('assets/anime/') and path.endswith('.png'))
          assert set(receipt['assets'])==expected_assets,'Bundled asset set differs from committed source'
          for path,meta in receipt['assets'].items():
              served=load(root+path+'?receipt='+trigger)
              data=normalized(served) if path.endswith('.html') else served
              assert len(data)==meta['bytes'],path
              assert hashlib.sha256(data).hexdigest()==meta['sha256'],path
              assert data==committed(path),'Hosted asset differs from source: '+path
              print('LIVE_ASSET_OK='+path,flush=True)
          audit={'releaseVersion':request['releaseVersion'],'sourceCommit':source_commit,'deployTrigger':trigger,
                 'deployRun':final['html_url'],'appUrl':root,'sourceBytes':len(html),'sourceSha256':digest,
                 'assets':receipt['assets'],'result':'exact-source-and-all-assets-match'}
          Path('swyrl-hosted-audit.json').write_text(json.dumps(audit,indent=2)+'\n')
          print('HOSTED_HTML_BYTES='+str(len(html))+' SHA256='+digest)
          print('LIVE_SOURCE_AND_ALL_ASSETS_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swyrl-hosted-release-audit
          path: swyrl-hosted-audit.json
          retention-days: 30
