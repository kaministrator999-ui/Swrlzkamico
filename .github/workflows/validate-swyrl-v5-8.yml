name: Validate §wyrl§ Engine v5.8 candidate
on:
  push:
    branches: [swyrl-engine-v5-8-wisp-foot-support]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Build v5.7 then apply v5.8
        run: |
          set -euo pipefail
          python projects/swrlz-forge-moba/build_space.py --output /tmp/v57
          python - <<'PY'
          import importlib.util,hashlib
          from pathlib import Path
          s=Path('/tmp/v57/index.html').read_text()
          p=Path('projects/swrlz-forge-moba/patches/v5_8_wisp_alpha_foot_support.py')
          spec=importlib.util.spec_from_file_location('v58',p);m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          out=m.apply(s);b=out.encode()
          print(f'V58_BYTES={len(b)}');print(f'V58_SHA256={hashlib.sha256(b).hexdigest()}')
          Path('/tmp/v58.html').write_text(out)
          start=out.index('<script type="module">')+len('<script type="module">');end=out.rindex('</script>')
          Path('/tmp/v58.mjs').write_text(out[start:end])
          for token in ['V5_8_WISP_ALPHA_FOOT_SUPPORT','premultiplyAlpha=true','alphaTest:.018','support-aware-raycast','restFootX','supported.length<samples.length']:
              assert token in out,token
          PY
          node --check /tmp/v58.mjs
