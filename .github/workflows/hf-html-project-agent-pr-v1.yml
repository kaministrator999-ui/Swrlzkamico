name: §C owner-approved model-generated existing HTML repair PR
run-name: Model repair ${{ inputs.project }} · ${{ inputs.source_sha }}
on:
  pull_request:
    paths:
      - 'api/html_project_agent_v1.py'
      - 'api/html_project_agent_runtime_v1.py'
      - 'api/html_project_repair_v1.py'
      - 'scripts/html_project_agent_pr_v1.py'
      - 'tests/test_html_project_agent_v1.py'
      - '.github/workflows/hf-html-project-agent-pr-v1.yml'
  workflow_dispatch:
    inputs:
      source_sha:
        description: Immutable reviewed main revision
        required: true
        type: string
      project:
        description: Existing HTML project slug
        required: true
        type: string
      proposal_json:
        description: Owner-reviewed JSON exact patch plan
        required: true
        type: string
      publish_after_validation:
        description: Owner explicitly approved commit and deployment after browser validation
        required: false
        type: choice
        options: ['no', 'yes']
        default: 'no'
      browser_receipt_json:
        description: Authenticated §C server Chromium receipt for the exact candidate
        required: false
        type: string
        default: ''
      approved:
        description: Owner approved the listed source-pinned repair scope
        required: true
        type: choice
        options: ['no', 'yes']
        default: 'no'
permissions: {contents: read}
concurrency:
  group: swrlz-model-html-repair-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet 'requests>=2.31,<3'
      - run: echo "PYTHONPATH=$GITHUB_WORKSPACE/api:$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Source-preserving general patch regression
        run: |
          python -m py_compile api/html_project_agent_v1.py api/html_project_agent_runtime_v1.py api/html_project_repair_v1.py scripts/html_project_agent_pr_v1.py
          python -m unittest discover -s tests -p 'test_html_project_agent_v1.py' -v
          python -m unittest discover -s tests -p 'test_html_project_agent_runtime_v1.py' -v
          python -m unittest discover -s tests -p 'test_html_project_repair_v1.py' -v
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.approved == 'yes' && github.actor == 'kaministrator999-ui' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {contents: read}
    outputs:
      repair_hash: ${{ steps.stage.outputs.repair_hash }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: reviewed-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet 'requests>=2.31,<3' 'fastapi>=0.115,<1'
      - if: ${{ inputs.browser_receipt_json == '' }}
        run: |
          python -m pip install --quiet 'playwright==1.51.0'
          python -m playwright install --with-deps chromium
      - name: Reconstruct reviewed exact patch in isolated checkout
        id: stage
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          PROJECT: ${{ inputs.project }}
          MODEL_PROPOSAL_JSON: ${{ inputs.proposal_json }}
          PYTHONPATH: ${{ github.workspace }}/api:${{ github.workspace }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PROJECT" =~ ^[a-z0-9]([a-z0-9-]{0,46}[a-z0-9])?$ ]]
          python scripts/html_project_agent_pr_v1.py --project "$PROJECT" --stage
      - name: Verify signed §C server-browser receipt against reconstructed candidate
        if: ${{ inputs.browser_receipt_json != '' }}
        env:
          PROJECT: ${{ inputs.project }}
          BROWSER_RECEIPT_JSON: ${{ inputs.browser_receipt_json }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/verify_server_browser_delivery_v1.py receipt --project "$PROJECT" --root "reviewed-source/html-projects/$PROJECT"
      - name: Legacy Chromium candidate smoke under opaque-origin sandbox (no write credentials)
        if: ${{ inputs.browser_receipt_json == '' }}
        env:
          PROJECT: ${{ inputs.project }}
        run: python scripts/verify_html_project_browser_v1.py --project "$PROJECT" --root "reviewed-source/html-projects/$PROJECT" --receipt browser-candidate-receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-candidate-receipt
          path: |
            browser-candidate-receipt.json
            repair-output/**/repair-receipt.json
          if-no-files-found: warn
  repair:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: reviewed-source
          persist-credentials: true
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet 'requests>=2.31,<3'
      - name: Reconstruct exactly the browser-validated patch without executing project code
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          PROJECT: ${{ inputs.project }}
          MODEL_PROPOSAL_JSON: ${{ inputs.proposal_json }}
          EXPECTED_REPAIR_HASH: ${{ needs.validate.outputs.repair_hash }}
          PYTHONPATH: ${{ github.workspace }}/api:${{ github.workspace }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_REPAIR_HASH"
          test "$(git -C reviewed-source ls-remote origin refs/heads/main | cut -f1)" = "$SOURCE_SHA"
          python scripts/html_project_agent_pr_v1.py --project "$PROJECT" --stage
      - name: Commit browser-tested repair in explicitly approved scope
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT: ${{ inputs.project }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          GH_REPO: ${{ github.repository }}
          PUBLISH_AFTER_VALIDATION: ${{ inputs.publish_after_validation }}
        shell: bash
        run: |
          set -euo pipefail
          cd reviewed-source
          branch="fix/model-html-${PROJECT}-${SOURCE_SHA:0:10}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "html-projects/$PROJECT"
          git -c core.whitespace=-blank-at-eol diff --cached --check
          git diff --cached --quiet && { echo "No changes proposed"; exit 1; }
          git commit -m "fix(html): owner-approved model-generated exact repair for $PROJECT"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$SOURCE_SHA"
          if [[ "$PUBLISH_AFTER_VALIDATION" == yes ]]; then
            git push origin HEAD:refs/heads/main
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "OWNER_APPROVED_REPAIR_COMMITTED $(git rev-parse HEAD)"
          else
            git push origin "HEAD:refs/heads/$branch"
            gh pr create --repo "$GH_REPO" --base main --head "$branch" \
              --title "fix(html): model-proposed source repair for $PROJECT" \
              --body "Owner-approved exact repair. Source-pinned and browser-smoke-tested. No merge or deployment authorized."
          fi
  publish:
    needs: repair
    if: ${{ inputs.publish_after_validation == 'yes' && needs.repair.outputs.commit_sha != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.repair.outputs.commit_sha }}
          path: reviewed-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet 'huggingface_hub>=0.34,<2'
      - name: Scoped Hugging Face publication of exact approved commit
        env:
          SOURCE_SHA: ${{ needs.repair.outputs.commit_sha }}
          PROJECT: ${{ inputs.project }}
          SWRLZ_PROJECT_SOURCE_ROOT: reviewed-source
          SWRLZ_HTML_PROJECT_APPROVED: '1'
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/hf_html_project_publish_v1.py publish --project "$PROJECT" --approved yes
      - name: Verify exact public entry bytes and sandbox headers
        env:
          PROJECT: ${{ inputs.project }}
          SWRLZ_PROJECT_SOURCE_ROOT: reviewed-source
        run: python scripts/hf_html_project_publish_v1.py probe --project "$PROJECT"
      - name: Check every public asset and static security boundary
        env:
          PROJECT: ${{ inputs.project }}
          SWRLZ_PROJECT_SOURCE_ROOT: reviewed-source
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/verify_html_project_lightweight_v1.py --project "$PROJECT" --mode published --output html-lightweight-receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-model-repair-publication-receipt
          path: |
            html-project-receipt.json
            html-lightweight-receipt.json
          if-no-files-found: warn
  verify:
    needs: [repair,publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.repair.outputs.commit_sha }}
          path: reviewed-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet 'fastapi>=0.115,<1'
      - name: Render exact live published bytes on the §C server browser
        if: ${{ inputs.browser_receipt_json != '' }}
        env:
          PROJECT: ${{ inputs.project }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/verify_server_browser_delivery_v1.py live --project "$PROJECT" --root "reviewed-source/html-projects/$PROJECT"
      - if: ${{ inputs.browser_receipt_json == '' }}
        run: |
          python -m pip install --quiet 'playwright==1.51.0'
          python -m playwright install --with-deps chromium
      - name: Legacy verify deployed project in Chromium with no credentials
        if: ${{ inputs.browser_receipt_json == '' }}
        env:
          PROJECT: ${{ inputs.project }}
        run: python scripts/verify_html_project_browser_v1.py --project "$PROJECT" --root "reviewed-source/html-projects/$PROJECT" --live --receipt browser-live-receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-live-receipt
          path: browser-live-receipt.json
          if-no-files-found: warn
