name: Preflight §C prose-only finalizer (source read-only)
on:
  push:
    branches: [main]
    paths:
      - scripts/hf_guest_prose_finalizer_v1.py
      - .github/workflows/hf-guest-prose-finalizer-preflight.yml
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet 'huggingface_hub>=0.34,<2'
      - run: python -m py_compile scripts/hf_guest_prose_finalizer_v1.py
      - name: Verify pinned live source and static prose guard tests
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u scripts/hf_guest_prose_finalizer_v1.py preflight
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prose-finalizer-preflight-${{ github.run_id }}
          path: reports/prose-guard-v1/
          retention-days: 30
          if-no-files-found: ignore
