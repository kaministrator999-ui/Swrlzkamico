name: §E v11.190 fast render source verification
on:
  push:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/source-manifest.json"
      - "projects/swrlz-forge-moba/patches/v11_190_render_fps_vault_batch.py"
      - "projects/swrlz-forge-moba/runtime/engine_render_instrument_v11_190.js"
      - "projects/swrlz-forge-moba/runtime/engine_render_instrument_v11_190.css"
      - "projects/swrlz-forge-moba/scripts/verify_v11_190_release.py"
      - ".github/workflows/measure-se-v11-190.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Syntax-check isolated render instrumentation and patch
        run: |
          python -m py_compile projects/swrlz-forge-moba/patches/v11_190_render_fps_vault_batch.py
          node --check projects/swrlz-forge-moba/runtime/engine_render_instrument_v11_190.js
      - name: Strict source receipt and bundled assets (no browser)
        run: python projects/swrlz-forge-moba/scripts/verify_v11_190_release.py --output /tmp/se190-verified
      - name: Build both routed pages and emit exact integrity receipt
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          path=Path('projects/swrlz-forge-moba/source-manifest.json')
          m=json.loads(path.read_text())
          assert m['name']=='§wyrl§ Engine v11.190'
          assert len(m['patches'])==222
          assert m['patches'][-1]=='patches/v11_190_render_fps_vault_batch.py'
          m['finalBytes']=0;m['finalSha256']=''
          path.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          PY
          python projects/swrlz-forge-moba/build_space.py --output /tmp/se190-package > /tmp/se190-build.log
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('/tmp/se190-package')
          a=(p/'index.html').read_bytes()
          b=(p/'modeler.html').read_bytes()
          assert a==b and len(a)>7000000
          s=a.decode('utf8')
          for target in [
            'SWYRL_ENGINE_DEPLOY_MARKER: V11_190_RENDER_FPS_VAULT_BATCHING',
            'se190RenderAudit','se190CountSubmittedFrame',
            'SWYRL_ENGINE_PERFORMANCE_V11190',
            'se190ComparePresets','se190VisibleActorDrawAudit',
            "d.textContent=(fps?Math.round(fps):'--')+' rendered FPS",
            'const canopyGeometry=new THREE.BufferGeometry();',
            'const wallGeometry=new THREE.BufferGeometry();',
            'const ribBrass=new THREE.InstancedMesh(',
            'const starSmall=new THREE.InstancedMesh(']:
            assert target in s,target
          scene=json.loads(Path('projects/swrlz-forge-moba/scenes/embervault-atelier.swyrl.json').read_text())
          actors=scene['scene']['actors']
          assert len(actors)==170 and len({o['id'] for o in actors})==170
          print('SE190_MEASURED_BYTES='+str(len(a)),flush=True)
          print('SE190_MEASURED_SHA256='+hashlib.sha256(a).hexdigest(),flush=True)
          print('SE190_STATIC_SOURCE_CHECK_PASS=YES',flush=True)
          PY
