name: Release §C server-owned browser validation v13
on:
  pull_request:
    paths:
      - 'browser-worker/**'
      - 'api/browser_worker_protocol_v1.py'
      - 'api/html_project_browser_client_v1.py'
      - 'api/html_project_agent_runtime_v1.py'
      - 'scripts/hf_chat_server_browser_release_v13.py'
      - '.github/workflows/hf-chat-server-browser-v13.yml'
  push:
    branches: [main]
    paths:
      - 'browser-worker/**'
      - 'api/browser_worker_protocol_v1.py'
      - 'api/html_project_browser_client_v1.py'
      - 'api/html_project_agent_runtime_v1.py'
      - 'scripts/hf_chat_server_browser_release_v13.py'
      - '.github/workflows/hf-chat-server-browser-v13.yml'
permissions: {contents: read}
concurrency:
  group: swrlz-server-browser-v13
  cancel-in-progress: false
jobs:
  validate-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Validate browser protocol and pre-approval retry loop
        run: |
          python -m pip install --quiet 'requests>=2.31,<3' 'huggingface_hub>=0.34,<2'
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/api"
          python -m unittest discover -s tests -p 'test_browser_worker_protocol_v1.py' -v
          python -m unittest discover -s tests -p 'test_html_project_agent_runtime_v1.py' -v
          python -m unittest discover -s tests -p 'test_html_project_repair_v1.py' -v
          python scripts/hf_chat_server_browser_release_v13.py selftest
      - name: Source-pinned production preflight
        run: python scripts/hf_chat_server_browser_release_v13.py preflight
      - name: Deploy free isolated worker and verify live browser before enabling §C
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[release-chat-server-browser-v13]') }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SWRLZ_V13_APPROVED: '1'
        run: python -u scripts/hf_chat_server_browser_release_v13.py publish
