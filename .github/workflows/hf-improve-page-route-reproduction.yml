name: Reproduce §C Now improve the page after repeated output-limit failures
on:
  push:
    branches: [main]
    paths: [".github/workflows/hf-improve-page-route-reproduction.yml"]
permissions: {contents: read}
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install read-only Space source test tools
        run: python -m pip install 'huggingface_hub>=0.34,<2'
      - name: Exercise real coding classifier, real engine, fake length-stopped model
        run: |
          set -euo pipefail
          python -m py_compile scripts/audit_hf_improve_page_route.py
          python -u scripts/audit_hf_improve_page_route.py
