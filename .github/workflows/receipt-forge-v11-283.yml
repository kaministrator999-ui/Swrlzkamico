name: §E v11.283 Weathered Rock Hand sealed release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/receipt-forge-v11-283.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sealed:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify actual rock topology, smoothing and original hand rig
        run: node projects/swrlz-forge-moba/scripts/smoke_v11_283_weathered_hand.js
      - name: Verify sealed 314-patch HTML and packaged asset integrity
        run: python projects/swrlz-forge-moba/scripts/verify_v11_283_release.py --output /tmp/se283-sealed
