name: Verify §E v11.275 sealed continuous swirl release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-forge-v11-275-release.yml'
      - 'projects/swrlz-forge-moba/source-manifest.json'
      - 'projects/swrlz-forge-moba/scripts/verify_v11_275_release.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sealed:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact source SHA, all assets and inline JS syntax
        run: python3 projects/swrlz-forge-moba/scripts/verify_v11_275_release.py --output /tmp/swyrl-forge-275
