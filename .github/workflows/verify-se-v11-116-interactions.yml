name: §E v11.116 precision touch source preflight
on:
  push:
    branches:
      - feature/atelier-precision-touch-v11-116
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify sealed v11.116 release and assembled JavaScript
        run: |
          python projects/swrlz-forge-moba/scripts/verify_v11_116_release.py --output /tmp/se-v11116-release
          cp /tmp/se-v11116-release-module.mjs /tmp/se-v11116.mjs
          node --check /tmp/se-v11116.mjs
      - name: Preserve original native handle and selection tests
        run: |
          npm install --no-save --no-package-lock three@0.160.1
          node projects/swrlz-forge-moba/tests/model_atelier_precision_gizmos_v11_114.mjs
          node projects/swrlz-forge-moba/tests/model_atelier_preview_selection_v11_115.mjs
          node projects/swrlz-forge-moba/tests/model_atelier_camera_precision_v11_116.mjs
