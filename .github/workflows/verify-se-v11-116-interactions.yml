name: §E v11.116 precision touch source preflight
on:
  push:
    branches:
      - feature/atelier-precision-touch-v11-116
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reconstruct source, apply candidate and measure integrity
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,json,runpy,importlib.util
          from pathlib import Path
          root=Path('projects/swrlz-forge-moba')
          m=json.loads((root/'source-manifest.json').read_text())
          source=gzip.decompress(base64.b64decode(''.join((root/p).read_text().strip() for p in m['chunks']))).decode()
          assert hashlib.sha256(source.encode()).hexdigest()==m['baseSha256']
          for name in m['patches']:
              ns=runpy.run_path(str(root/name))
              source=ns['apply'](source)
          assert hashlib.sha256(source.encode()).hexdigest()==m['finalSha256']
          ns=runpy.run_path(str(root/'patches/v11_116_precision_touch_camera.py'))
          source=ns['apply'](source)
          raw=source.encode()
          assert len(raw)>m['finalBytes']
          assert source.count('V11_116_PRECISION_TOUCH_CAMERA_REPAIR')==1
          assert source.count('<title>§wyrl§ Engine · Maker v11.116</title>')==1
          assert 'atelierCameraPointerUp(event);\n pressed=null;' in source
          assert "const threshold=event.pointerType==='touch'?18:12;" in source
          assert "atelierCameraTouches.set(d.id," in source
          assert 'Math.min(24,r*2.55)' in source
          Path('/tmp/se-v11116.mjs').write_text(source.split('<script type="module">',1)[1].rsplit('</script>',1)[0])
          print('OFFICIAL_V11116_CANDIDATE_SHA256',hashlib.sha256(raw).hexdigest())
          print('OFFICIAL_V11116_CANDIDATE_BYTES',len(raw))
          print('OFFICIAL_V11116_CANDIDATE_PATCHES',len(m['patches'])+1)
          PY
          node --check /tmp/se-v11116.mjs
      - name: Preserve original native handle and selection tests
        run: |
          npm install --no-save --no-package-lock three@0.160.1
          node projects/swrlz-forge-moba/tests/model_atelier_precision_gizmos_v11_114.mjs
          node projects/swrlz-forge-moba/tests/model_atelier_preview_selection_v11_115.mjs
          node projects/swrlz-forge-moba/tests/model_atelier_camera_precision_v11_116.mjs
