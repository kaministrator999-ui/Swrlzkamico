name: Audit live §C Redis bandwidth drivers (read-only)
on:
  push:
    branches: [feature/aiven-valkey-storage-adapter]
    paths: ["scripts/hf_valkey_bandwidth_audit.py",".github/workflows/hf-valkey-bandwidth-audit.yml"]
permissions: {contents: read}
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install "huggingface_hub>=0.34,<2"
      - name: Analyze live source call paths without reading Redis
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u scripts/hf_valkey_bandwidth_audit.py
