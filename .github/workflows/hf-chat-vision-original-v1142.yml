name: Guarded §C 1.1.42 original-pixel Qwen vision fix
on:
  push:
    branches: [main]
    paths: [".deploy/HF_CHAT_VISION_1142_REQUEST.txt"]
permissions:
  contents: read
concurrency:
  group: swrlz-hf-space-deployment
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact approved source, scope and release request
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          file=.deploy/HF_CHAT_VISION_1142_REQUEST.txt
          test -f "$file"
          read_key() { sed -n "s/^$1=//p" "$file" | tail -1; }
          test "$(read_key SPACE)" = "kamiloki/Swyrlz"
          test "$(read_key SOURCE_REVISION)" = "44330852bf147887398f0ca3eabb99d66d93db4f"
          test "$(read_key SCOPE)" = "chat-image-picker-and-qwen-vision-only"
          mode="$(read_key MODE)"
          [[ "$mode" == inspect || "$mode" == deploy ]]
          if [[ "$mode" == deploy ]]; then
            test "$(read_key APPROVED)" = yes
          fi
          nonce="$(read_key NONCE)"
          [[ "$nonce" =~ ^[a-z0-9-]{12,80}$ ]]
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Install exact-source reader and isolated test dependencies
        run: python -m pip install --quiet "huggingface_hub>=0.34,<2" "fastapi>=0.110,<1" "pillow>=10,<12"
      - name: Verify deployment code compiles
        run: python -m py_compile scripts/hf_chat_vision_original_v1142_release.py
      - name: Snapshot exact current source and build candidate
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u scripts/hf_chat_vision_original_v1142_release.py inspect
      - name: Test one Qwen inference at unchanged original resolution and browser syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast,base64,io,pathlib,re,sys,types
          from PIL import Image
          root=pathlib.Path("reports/swrlz-vision-original-v1142/candidate")
          html=(root/"chat/§wyrlz/index.html").read_text("utf-8")
          backend=root/"chat_vision.py"
          ast.parse(backend.read_text("utf-8"))
          assert 'swrlz-chat-version" content="1.1.42"' in html
          assert 'imageVisionLevelSelect' not in html
          assert 'file.arrayBuffer()' in html
          assert 'bytes instanceof Uint8Array' in html
          assert 'analysisLevels:1' in html
          assert "image = image_url" in backend.read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html,re.I)
          assert len(scripts)==1
          pathlib.Path("/tmp/swrlz-1142.js").write_text(scripts[0])
          capacity=types.ModuleType("runtime_capacity")
          class ResponseResourceMeter:
              def finish(self):return {}
          capacity.ResponseResourceMeter=ResponseResourceMeter
          qwen=types.ModuleType("qwen35_single_runtime")
          qwen.DECODE_THREADS=18;qwen.BATCH_THREADS=16;qwen.PARALLEL_REQUESTS=1
          sys.modules["runtime_capacity"]=capacity
          sys.modules["qwen35_single_runtime"]=qwen
          sys.path.insert(0,str(root))
          import chat_vision as v
          assert v.VISION_MODEL_VARIANT=="qwen3.5-9b"
          assert v.PROJECTOR_FILE=="mmproj-F16.gguf"
          original=io.BytesIO()
          Image.new("RGB",(1080,2388),(32,28,60)).save(original,format="PNG")
          data="data:image/png;base64,"+base64.b64encode(original.getvalue()).decode("ascii")
          calls=[]
          class Model:
              def create_chat_completion(self,*,messages,max_tokens,temperature,stream):
                  calls.append(messages[0]["content"][1]["image_url"]["url"])
                  yield {"choices":[{"delta":{"content":"Observed one original image."}}]}
          v._load_local_model=lambda:Model()
          state=[]
          desc=v._ask_vision_local(data,"Describe image",lambda phase,**fields:state.append((phase,fields)),analysis_levels=3)
          assert desc=="Observed one original image."
          assert calls==[data]
          assert any(f.get("sourceWidth")==1080 and f.get("sourceHeight")==2388 for _,f in state)
          assert all(f.get("requestedLevels",1)==1 for _,f in state)
          print("SWRLZ_VISION_1142_SINGLE_PASS_ORIGINAL_RESOLUTION_TEST_PASS",flush=True)
          PY
          node --check /tmp/swrlz-1142.js
      - name: Preserve immutable exact rollback and candidate source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swrlz-chat-vision-1142-source-backup
          path: reports/swrlz-vision-original-v1142/
          retention-days: 30
          if-no-files-found: ignore
      - name: Publish guarded exact Chat+vision delta and verify served revision
        if: ${{ steps.authority.outputs.mode == 'deploy' }}
        timeout-minutes: 23
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SWRLZ_VISION_1142_APPROVED: "yes"
        run: |
          set -euo pipefail
          python -u scripts/hf_chat_vision_original_v1142_release.py publish
          echo "SWRLZ_VISION_1142_LIVE_VERIFIED"
