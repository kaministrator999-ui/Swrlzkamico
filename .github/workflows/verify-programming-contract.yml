name: Verify programming contract

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".acceptance/PROGRAMMING_CONTRACT_VERIFY_REQUEST.txt"

permissions:
  contents: read

concurrency:
  group: swrlz-programming-contract-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout verification request
        uses: actions/checkout@v4

      - name: Resolve source ref
        id: request
        shell: bash
        run: |
          set -euo pipefail
          source_ref="$(grep '^SOURCE_REF=' .acceptance/PROGRAMMING_CONTRACT_VERIFY_REQUEST.txt | tail -n1 | cut -d= -f2-)"
          if [ "$source_ref" != "feature/hf-space-manual-deploy" ]; then
            test -n "$source_ref" || { echo "::error::SOURCE_REF is required."; exit 1; }
            test "$(printf '%s' "$source_ref" | wc -c | tr -d ' ')" = "40" || { echo "::error::Commit SOURCE_REF must be exactly 40 hex characters."; exit 1; }
            printf '%s' "$source_ref" | grep -Eq '^[0-9a-fA-F]+$' || { echo "::error::Commit SOURCE_REF must contain only hex characters."; exit 1; }
          fi
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
      - name: Checkout programming source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.source_ref }}

      - name: Compile programming owners
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile             hf_space/brain_programming.py             hf_space/programming_telemetry.py             hf_space/programming_repair_context.py             hf_space/response_cognition.py             hf_space/online_tools.py             hf_space/qwen_coder_engine.py             hf_space/lfm2_700m_engine.py             hf_space/model_router.py             hf_space/station.py             hf_space/app.py             hf_space/test_programming_contract_v117.py             hf_space/test_programming_telemetry_v118.py             hf_space/test_programming_receipts_v119.py             hf_space/test_programming_repair_v120.py             hf_space/test_programming_repair_state_v121.py             hf_space/test_programming_behavior_ledger_v122.py             hf_space/test_response_cognition_v123.py             hf_space/test_online_widgets_v124.py

      - name: Run deterministic programming contract tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=hf_space python hf_space/test_programming_contract_v117.py

      - name: Run candidate telemetry contract tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=hf_space python hf_space/test_programming_telemetry_v118.py

      - name: Run native receipt and canonical repair-source tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=hf_space python hf_space/test_programming_receipts_v119.py

      - name: Run downstream repair hardening tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=hf_space python hf_space/test_programming_repair_v120.py

      - name: Run persistent repair-state and structured JSON tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=hf_space python hf_space/test_programming_repair_state_v121.py

      - name: Run behavioral invariant ledger tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=hf_space python hf_space/test_programming_behavior_ledger_v122.py

      - name: Run general response cognition tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=hf_space python hf_space/test_response_cognition_v123.py

      - name: Run online research and widget tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=hf_space python hf_space/test_online_widgets_v124.py
; then
            echo "::error::SOURCE_REF must be the canonical feature branch or an exact 40-character commit SHA."
            exit 1
          fi
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout programming source
        uses: actions/checkout@v4
        with:
