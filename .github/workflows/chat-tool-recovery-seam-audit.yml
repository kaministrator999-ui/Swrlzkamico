name: §C tool recovery source-seam audit
on:
  push:
    branches: [fix/chat-tool-capability-recovery-20261116]
    paths:
      - ".github/workflows/chat-tool-recovery-seam-audit.yml"
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --quiet 'huggingface_hub>=0.34,<2'
      - name: Capture source-only exact live generation, retrieval and research handoff
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast,hashlib,json,re
          from huggingface_hub import HfApi,hf_hub_download
          space="kamiloki/Swyrlz"
          rev=HfApi().repo_info(space,repo_type="space").sha
          print("TOOL_SEAM_REV",rev,flush=True)
          files=["lfm2_700m_engine.py","station.py","model_router.py","online_tools.py","api/selective_retrieval.py"]
          needles=re.compile(r"research|onlineContext|online_context|enrich_payload|tool|generate_events|buffered_chat_completion|text_delta|DELTA|COMPLETED|CANCELLED|reference_structure|history|_swrlz_prior|followup",re.I)
          for path in files:
            try:s=Path(hf_hub_download(space,path,repo_type="space",revision=rev)).read_text()
            except Exception as exc:
              print("TOOL_SEAM_UNAVAILABLE",path,type(exc).__name__);continue
            lines=s.splitlines()
            print("TOOL_SEAM_FILE",json.dumps({"path":path,"sha256":hashlib.sha256(s.encode()).hexdigest(),"lines":len(lines)}),flush=True)
            t=ast.parse(s)
            defs=[n for n in ast.walk(t) if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef))]
            for n in defs:
              if re.search(r"generate_events|enrich_payload|research|selective|route|^stream|chat_completion|classify_online|prior_sourced|original_rap|buffered",n.name,re.I):
                print("TOOL_SEAM_DEF",json.dumps({"path":path,"name":n.name,"start":n.lineno,"end":n.end_lineno}),flush=True)
            hits=[i for i,l in enumerate(lines) if needles.search(l)]
            if path=="lfm2_700m_engine.py": indices=[i for i in hits if i>350 and (("generate_events" in lines[i]) or ("reference_structure" in lines[i]) or ("online_context" in lines[i]) or ("onlineContext" in lines[i]) or ("buffered_chat_completion" in lines[i]) or ("yield " in lines[i]))][-100:]
            elif path=="station.py":indices=[i for i in hits if ("enrich_payload" in lines[i] or "online_context" in lines[i] or "onlineContext" in lines[i] or "generate_events" in lines[i] or "research" in lines[i])][-90:]
            else:indices=hits[:95]
            ix=set()
            for i in indices:
              ix.update(range(max(0,i-2),min(len(lines),i+4)))
            for i in sorted(ix):
              print("TOOL_SEAM_LINE",json.dumps({"path":path,"line":i+1,"text":lines[i][:360]},ensure_ascii=False),flush=True)
          PY
