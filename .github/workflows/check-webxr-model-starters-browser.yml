name: Browser-check §E v11.361 four modeling starter cards
on:
  push:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/tests/ui_v11_361_webxr_model_starters.mjs"
      - ".github/workflows/check-webxr-model-starters-browser.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  four-model-starters:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore the deployed v11.361 source manifest for this isolated regression
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          file=Path('projects/swrlz-forge-moba/source-manifest.json')
          m=json.loads(file.read_text('utf8'))
          assert m['patches'][367]=='patches/v11_361_webxr_hand_open_touch_starters.py'
          m['name']='§wyrl§ Engine v11.361'
          m['finalArtifact']='swyrl_engine_v11_361.html'
          m['patches']=m['patches'][:368]
          m['finalBytes']=9346125
          m['finalSha256']='20e0bb0183cd6fcc579d6f08cf8b126472bcf3a5dcfe043366e170dcb5fe9810'
          file.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\\n')
          PY
      - name: Build the exact sealed v11.361 static package
        run: python projects/swrlz-forge-moba/scripts/verify_v11_361_release.py --output /tmp/se361-model-starters
      - name: Install one mobile browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps --only-shell chromium
      - name: Open all four projects by clicking their actual Model starter cards
        run: node projects/swrlz-forge-moba/tests/ui_v11_361_webxr_model_starters.mjs
