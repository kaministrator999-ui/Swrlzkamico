name: Inspect exact live §C coding and storage path
on:
  push:
    branches: [feature/swrlz-valkey-traffic-and-code-finish]
    paths: ["scripts/hf_live_lifecycle_source_inspect.py",".github/workflows/hf-live-lifecycle-source-inspect.yml"]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install 'huggingface_hub>=0.34,<2'
      - name: Read exact live source, no Redis or secret values
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u scripts/hf_live_lifecycle_source_inspect.py
