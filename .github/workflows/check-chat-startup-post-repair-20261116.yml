name: Check §C startup after guarded repair (read only)
on:
  push:
    branches: [main]
    paths: [".github/workflows/check-chat-startup-post-repair-20261116.yml"]
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Read current Space runtime and HTTP health without mutation
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.error
          from datetime import datetime,timezone
          for url in ('https://huggingface.co/api/spaces/kamiloki/Swyrlz','https://kamiloki-swyrlz.hf.space/','https://kamiloki-swyrlz.hf.space/health'):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'SWRLZ-Health/1'}),timeout=20) as response:
                      status=response.status
                      if '/api/spaces/' in url:
                          d=json.load(response);r=d.get('runtime') or {}
                          print('SECHAT_POST_REPAIR_STATE='+json.dumps({'sha':d.get('sha'),'stage':r.get('stage'),'errorMessage':r.get('errorMessage'),'errorCode':r.get('errorCode')},sort_keys=True),flush=True)
                      else: print('SECHAT_POST_REPAIR_HTTP='+json.dumps({'url':url,'status':status,'contentType':response.headers.get('Content-Type')},sort_keys=True),flush=True)
              except urllib.error.HTTPError as e:print('SECHAT_POST_REPAIR_HTTP='+json.dumps({'url':url,'status':e.code,'reason':str(e.reason)[:90]}),flush=True)
              except Exception as e: print('SECHAT_POST_REPAIR_FAIL='+json.dumps({'url':url,'error':str(e)[:140]}),flush=True)
          PY
