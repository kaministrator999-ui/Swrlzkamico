name: Inspect live §C Analyze Project pipeline
on:
  push:
    branches: [main]
    paths: [".github/workflows/inspect-forge-project-analysis-live.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet 'huggingface_hub>=0.34,<2'
      - name: Snapshot exact immutable live Chat source for Analyze Project inspection
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os,hashlib,json
          from pathlib import Path
          from huggingface_hub import HfApi,hf_hub_download
          repo="kamiloki/Swyrlz"
          token=os.environ.get("HF_TOKEN") or False
          api=HfApi(token=token)
          revision=api.repo_info(repo,repo_type="space").sha
          files=["forge_workspace_insights_v1.py","forge_chat_actions.py","brain_forge.py",
                 "station.py","model_router.py","forge_embed.py","app.py",
                 "chat/§wyrlz/index.html","chat/§wyrlz/assets/forge-embed-v1.js"]
          root=Path("reports/forge-project-analysis-source")
          manifest={"revision":revision,"repo":repo,"files":{}}
          for name in files:
            src=Path(hf_hub_download(repo,name,repo_type="space",revision=revision,token=token))
            data=src.read_bytes()
            path=root/name;path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(data)
            manifest["files"][name]={"sha256":hashlib.sha256(data).hexdigest(),"bytes":len(data)}
            print("SOURCE",name,len(data),manifest["files"][name]["sha256"],flush=True)
          (root/"SOURCE.json").write_text(json.dumps(manifest,indent=2)+"\n",encoding="utf8")
          print("EXACT_LIVE_REVISION",revision,flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: forge-analyze-project-source
          path: reports/forge-project-analysis-source/
          retention-days: 14
          if-no-files-found: error
