name: §E v11.184 saved project cards candidate
on:
  push:
    branches: [feature/forge-v11-184-saved-preview-default-20261031]
    paths:
      - "projects/swrlz-forge-moba/**"
      - ".github/workflows/forge-v11-184-saved-projects.yml"
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Check preview/default JavaScript syntax and static contracts
        run: |
          node --check projects/swrlz-forge-moba/runtime/user_project_default_boot_v11_184.js
          node --check projects/swrlz-forge-moba/runtime/user_project_cards_v11_184.js
          node projects/swrlz-forge-moba/tests/test_v11_184_saved_preview_default.cjs
      - name: Build candidate and print exact manifest receipt
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('projects/swrlz-forge-moba/source-manifest.json')
          m=json.loads(p.read_text());assert m['name']=='§wyrl§ Engine v11.184'
          assert len(m['patches'])==216 and m['patches'][-1]=='patches/v11_184_saved_project_previews_default.py'
          m['finalBytes']=0;m['finalSha256']='';p.write_text(json.dumps(m,ensure_ascii=False))
          PY
          python projects/swrlz-forge-moba/build_space.py --output /tmp/se184-candidate >/tmp/se184-build.log
          python - <<'PY'
          import pathlib,hashlib,json
          b=pathlib.Path('/tmp/se184-candidate/index.html').read_bytes()
          for marker in [b'V11_184_SAVED_PROJECT_PREVIEWS_AND_DEFAULT',b'SWYRL_ENGINE_SAVED_DEFAULT',
                         b'se184RenderLocalProjects',b'se184RenderCloudProjects',
                         b'se184SavedGallery',b'se184TryCloudDefault',b'se183LevelsToggle']:
              assert marker in b,marker
          print('SE184_CANDIDATE_RECEIPT',json.dumps({'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}))
          PY
