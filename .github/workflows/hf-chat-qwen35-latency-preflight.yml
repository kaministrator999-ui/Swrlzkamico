name: §C 9B response latency and source preflight
on:
  push:
    branches: [tune/chat-qwen35-latency-v3-20261113]
    paths:
      - "scripts/probe_chat_qwen35_latency.py"
      - ".github/workflows/hf-chat-qwen35-latency-preflight.yml"
      - "scripts/hf_chat_qwen35_latency_v3.py"
      - "scripts/test_hf_chat_qwen35_latency_v3.py"
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact current HF source and validate update candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'huggingface_hub>=0.34,<2'
          python -m py_compile scripts/probe_chat_qwen35_latency.py
          if test -f scripts/hf_chat_qwen35_latency_v3.py; then
            python -m py_compile scripts/hf_chat_qwen35_latency_v3.py scripts/test_hf_chat_qwen35_latency_v3.py
            python scripts/test_hf_chat_qwen35_latency_v3.py
            python scripts/hf_chat_qwen35_latency_v3.py inspect
          fi
      - name: Measure one anonymous live text response (no user data)
        shell: bash
        run: |
          python scripts/probe_chat_qwen35_latency.py
