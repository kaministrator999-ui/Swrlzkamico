name: Verify §E v11.230 wolf single-pass loader release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seal-forge-v11-230-wolf.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wolf:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify sealed assembled wolf source and prior starters
        run: python projects/swrlz-forge-moba/scripts/verify_v11_230_release.py --output /tmp/se230-check
