name: §E v11.197 Sheep meadow/fog and Quest gameplay regression
on:
  push:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/source-manifest.json"
      - "projects/swrlz-forge-moba/patches/v11_197_sheep_meadow_mip_fog_camera.py"
      - "projects/swrlz-forge-moba/runtime/sheep_visual_stability_v11_197.js"
      - "projects/swrlz-forge-moba/tests/test_v11_197_sheep_visual_stability.cjs"
      - "projects/swrlz-forge-moba/scripts/verify_v11_197_release.py"
      - ".github/workflows/measure-se-v11-197.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Sheep meadow, 2D camera, fog, prior Quest/ARPG regression
        run: |
          python -m py_compile projects/swrlz-forge-moba/patches/v11_197_sheep_meadow_mip_fog_camera.py
          node --check projects/swrlz-forge-moba/runtime/sheep_visual_stability_v11_197.js
          node projects/swrlz-forge-moba/tests/test_v11_197_sheep_visual_stability.cjs
          node projects/swrlz-forge-moba/tests/test_v11_196_quest_fog_menu.cjs
          node projects/swrlz-forge-moba/tests/test_v11_195_quest_stability.cjs
          node projects/swrlz-forge-moba/tests/test_v11_194_emberfall_arpg.cjs
          node projects/swrlz-forge-moba/tests/test_v11_193_sheep_vr.cjs
          node projects/swrlz-forge-moba/tests/test_v11_192_native_vr_editor.cjs
          node projects/swrlz-forge-moba/tests/test_v11_191_xr_recovery.cjs
      - name: Strict 229-patch release and all preserved assets
        run: python projects/swrlz-forge-moba/scripts/verify_v11_197_release.py --output /tmp/se197-strict
