name: Read-only Aiven secret and live §C layout check

on:
  push:
    branches: [feature/aiven-valkey-storage-adapter]
    paths:
      - "scripts/hf_valkey_readonly_preflight.py"
      - ".github/workflows/hf-valkey-readonly-preflight.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Hugging Face read client
        run: python -m pip install "huggingface_hub>=0.34,<2"
      - name: Inspect only Space revision, file layout, and secret names
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u scripts/hf_valkey_readonly_preflight.py
