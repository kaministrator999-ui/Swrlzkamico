name: Chat v289 Repository Readiness
on:
  push:
    branches: [feature/chat-repo-readiness-v289]
    paths:
      - 'hf_space/github_repo_readiness_v289.py'
      - 'hf_space/github_read_inference_v235.py'
      - 'hf_space/github_connection.py'
      - 'hf_space/test_github_repo_readiness_v289.py'
      - '.github/workflows/chat-repo-readiness-v289.yml'
  pull_request:
    paths:
      - 'hf_space/github_repo_readiness_v289.py'
      - 'hf_space/github_read_inference_v235.py'
      - 'hf_space/github_connection.py'
      - 'hf_space/test_github_repo_readiness_v289.py'
      - '.github/workflows/chat-repo-readiness-v289.yml'
permissions:
  contents: read
jobs:
  classify-verified-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight authenticated route dependencies
        run: python -m pip install 'fastapi>=0.110,<1' 'requests>=2,<3' 'cryptography>=42,<50'
      - name: Compile classified Stage-1 routes
        run: python -m py_compile hf_space/github_repo_readiness_v289.py hf_space/github_connection.py hf_space/github_read_inference_v235.py
      - name: Verify complete snapshot, no-write and conversation routing
        run: python hf_space/test_github_repo_readiness_v289.py
