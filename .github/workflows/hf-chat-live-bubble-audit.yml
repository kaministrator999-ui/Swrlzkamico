name: Inspect §C live reply bubble exact lines
on:
  push:
    branches: [main]
    paths: [".github/workflows/hf-chat-live-bubble-audit.yml"]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - run: python -m pip install 'huggingface_hub>=0.34,<2'
      - run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from huggingface_hub import HfApi,hf_hub_download
          S="kamiloki/Swyrlz";r=HfApi().repo_info(S,repo_type="space").sha
          l=Path(hf_hub_download(S,"chat/§wyrlz/index.html",repo_type="space",revision=r)).read_text().splitlines()
          for a,b in ((4048,4140),(4140,4195)):
              print("LIVE_BUBBLE_LINES",json.dumps({"start":a,"lines":[str(i+1)+" "+l[i] for i in range(a-1,b)]},ensure_ascii=False),flush=True)
          PY
