name: §C neutral music-theory and original-song intent probes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chat-music-neutral-route-probes.yml'
permissions: {contents: read}
concurrency:
  group: swrlz-chat-guest-eval
  cancel-in-progress: false
jobs:
  isolated_music:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - run: python -m py_compile scripts/eval_chat_music_neutral_route_probes.py scripts/eval_chat_research_lyrics_conversations.py
      - name: Test structure research and neutral pop/rap prompts without account
        env:
          SWRLZ_EVAL_BASE: https://kamiloki-swyrlz.hf.space
          SWRLZ_EVAL_MODEL: 700m
          SWRLZ_RESEARCH_LYRICS_TURN_TIMEOUT: '215'
        run: python -u -m scripts.eval_chat_music_neutral_route_probes
      - name: Audit real guest lyric/prose answers for recurring-line runaway
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from api.noncode_repetition_guard_v1 import RepetitionWatch
          file=Path("reports/swrlz-music-intent-probes/report.json")
          if not file.exists():
              raise SystemExit("No guest model outputs to examine")
          results=json.loads(file.read_text()).get("results", [])
          findings=[]
          for item in results:
              response=item.get("response") or ""
              watcher=RepetitionWatch()
              evidence=watcher.observe(response+"\\n")
              findings.append((item.get("id"),item.get("status"),evidence))
              if evidence:
                  raise SystemExit("Detected repetitive guest output: "+str(item.get("id")))
          print("LIVE_GUEST_NONCODE_LOOP_AUDIT",findings)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swrlz-neutral-music-probes-${{ github.run_id }}
          path: reports/swrlz-music-intent-probes/
          retention-days: 21
          if-no-files-found: ignore
