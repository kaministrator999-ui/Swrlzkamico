name: Measure §E v11.272 Sheep L3 Nerd Stats Toggle
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/calc-sheep-nerd-l3-v11-272.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify input toggle and source syntax
        run: |
          python3 -m py_compile projects/swrlz-forge-moba/patches/v11_272_sheep_nerd_l3_toggle.py
          node --check projects/swrlz-forge-moba/runtime/sheep_nerd_stats_l3_toggle_v11_272.js
          node projects/swrlz-forge-moba/tests/sheep_nerd_l3_toggle_v11_272.cjs
      - name: Verify exact sealed 303-patch source and assembled JS
        run: |
          python3 projects/swrlz-forge-moba/scripts/verify_v11_272_release.py --output /tmp/se272-sealed
          echo SE272_SEALED_SOURCE_VERIFIED
