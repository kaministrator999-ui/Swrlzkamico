name: Dispatch approved Qwen3-VL HF release
on:
  push:
    branches:
      - experiment/chat-vision-qwen3vl4b-20261106
      - feature/chat-vision-grounded-visual-report-20261107
    paths:
      - .deploy/QWEN3VL_APPROVED_RELEASE.txt
      - .deploy/CHAT_VISION_PR385_RELEASE.txt

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify explicit Qwen release request and pinned model
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "kaministrator999-ui/Swrlzkamico"
          # Select the exact approved source marker; never deploy a different branch.
          case "$GITHUB_REF_NAME" in
            experiment/chat-vision-qwen3vl4b-20261106)
              marker=.deploy/QWEN3VL_APPROVED_RELEASE.txt ;;
            feature/chat-vision-grounded-visual-report-20261107)
              marker=.deploy/CHAT_VISION_PR385_RELEASE.txt
              grep -Fx "SOURCE_PR=385" "$marker"
              grep -Fx "SOURCE_BRANCH=$GITHUB_REF_NAME" "$marker" ;;
            *)
              echo "::error::Unapproved release source branch"; exit 1 ;;
          esac
          grep -Fx "APPROVED_BY_USER=YES" "$marker"
          grep -Fx "TARGET_SPACE=kamiloki/Swyrlz" "$marker"
          grep -Fx "DEPLOYMENT_WORKFLOW=manual-hf-space.yml" "$marker"
          grep -Fq 'MODEL_REPO = "Qwen/Qwen3-VL-4B-Instruct-GGUF"' hf_space/chat_vision.py
          grep -Fq 'VISION_MODEL_VARIANT = "qwen3-vl-4b"' hf_space/chat_vision.py
          ! grep -Fq 'SmolVLM' hf_space/chat_vision.py
          ! grep -Fq 'MTMDChatHandler' hf_space/chat_vision.py
          python - <<'PY'
          from pathlib import Path
          header=Path("hf_space/README.md").read_text().split("---",2)[1]
          assert "Qwen3VL-4B-Instruct-Q4_K_M.gguf" in header
          assert "SmolVLM" not in header
          PY
          grep -Fq 'Qwen3VL-4B-Instruct-Q4_K_M.gguf' hf_space/README.md
          test -f hf_space/qwen3vl_local_server.py
          test -f hf_space/packages.txt
      - name: Dispatch the existing snapshot-protected manual HF deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run manual-hf-space.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f mode=deploy -f approved=yes
          echo "Dispatched canonical manual-hf-space workflow against $GITHUB_SHA"
