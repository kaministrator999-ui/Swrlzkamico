name: §E v11.170 sealed project library acceptance
on:
  push:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/scripts/verify_v11_170_release.py"
      - ".github/workflows/verify-se-v11-170-sealed.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify exact generated source seal and 68 assets
        run: python projects/swrlz-forge-moba/scripts/verify_v11_170_release.py --output dist/se170
      - name: Verify native project tab behaviour
        run: |
          npm install --prefix /tmp/se170-test --no-audit --no-fund jsdom@25.0.1
          SE_JSDOM_MODULE=/tmp/se170-test/node_modules/jsdom node projects/swrlz-forge-moba/tests/project_hub_my_projects_v11_170.mjs
          node --check projects/swrlz-forge-moba/runtime/project_hub_my_projects_v11_170.js
