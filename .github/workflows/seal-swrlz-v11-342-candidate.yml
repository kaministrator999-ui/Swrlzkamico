name: Seal v11.342 Model VR candidate
on:
  push:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/.candidate-v11-342"
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rebuild candidate source and check hover
        run: python projects/swrlz-forge-moba/scripts/calc_v11_342_candidate.py
