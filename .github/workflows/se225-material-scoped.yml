name: §E v11.225 targeted material + studio validation
on:
  push:
    branches: [feature/engine-v11-225-material-texture-tabs]
permissions: {contents: read}
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Build and verify only changed studio source
        run: |
          python -m py_compile projects/swrlz-forge-moba/patches/v11_225_material_texture_workspace_tabs.py
          node --check projects/swrlz-forge-moba/runtime/material_texture_core_v11_225.js
          node --check projects/swrlz-forge-moba/runtime/material_texture_editor_v11_225.js
          node --check projects/swrlz-forge-moba/runtime/studio_workspace_tabs_v11_225.js
          node projects/swrlz-forge-moba/scripts/test_material_texture_v11_225.js
          python projects/swrlz-forge-moba/build_space.py --output dist/se225
          python - <<'PY'
          import hashlib,json,re,subprocess
          from pathlib import Path
          raw=Path('dist/se225/index.html').read_bytes()
          html=raw.decode('utf8')
          print('SE225_SOURCE_BYTES',len(raw),'SHA256',hashlib.sha256(raw).hexdigest(),flush=True)
          assert 'SWYRL_ENGINE_DEPLOY_MARKER: V11_225_MATERIAL_TEXTURE_STUDIO_TABS' in html
          assert "window.SWRLZ_FORGE_BUILD={version:'v11.225'" in html
          assert "source.version=11.225" in html
          assert "se225DecorateNativeTabs(nav);" in html
          assert "se223Frame(dt,t);se225MaterialFrame(dt,t);" in html
          for needle in ['window.SWYRL_ENGINE_STUDIOS=Object.freeze',
           'window.SWYRL_ENGINE_MATERIALS=Object.freeze',
           "id='se225Shell'","'swyrl-material-studio-v1'",
           'se225MaterialUIInstall','se225MaterialUIImportImage',
           'se225MaterialUIPaintDown','se225MaterialTexture',
           'function se225MaterialSync(force=false)']:
            assert needle in html,needle
          assert html.count('se225MaterialFrame(dt,t);')==1
          for i,script in enumerate(re.findall(r'<script\b[^>]*>(.*?)</script>',html,re.S)):
           if not script.strip():continue
           path=Path('/tmp')/('se225_inline_'+str(i)+'.mjs')
           path.write_text(script)
           subprocess.run(['node','--check',str(path)],check=True)
          print('SE225_GENERATED_SCRIPT_SYNTAX_PASS',flush=True)
          PY