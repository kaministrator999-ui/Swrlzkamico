name: Guarded §C generated-action verification pilot
on:
  push:
    branches:
      - feat/sc-action-verification-20261120
      - main
    paths:
      - api/action_verification_v1.py
      - scripts/hf_chat_action_verification_v1_release.py
      - tests/test_action_verification_v1.py
      - tests/test_action_verification_hf_patch_v1.py
      - .github/workflows/hf-chat-action-verification-v1.yml
      - .deploy/HF_CHAT_ACTION_VERIFICATION_REQUEST.txt
permissions:
  contents: read
concurrency:
  group: swrlz-hf-space-deployment
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and run bounded synthetic QA
        run: |
          set -euo pipefail
          python -m py_compile api/action_verification_v1.py scripts/hf_chat_action_verification_v1_release.py
          python -m unittest discover -s tests -p "test_action_verification_v1.py" -v
          python -m unittest discover -s tests -p "test_action_verification_hf_patch_v1.py" -v
      - name: Install Hugging Face source reader
        run: python -m pip install -q 'huggingface_hub>=0.34,<2'
      - name: Read and compile exact current §C generation source without mutation
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u scripts/hf_chat_action_verification_v1_release.py preflight
      - name: Check explicit approved production release request
        id: gate
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          request=.deploy/HF_CHAT_ACTION_VERIFICATION_REQUEST.txt
          test -f "$request"
          get(){ sed -n "s/^$1=//p" "$request" | tail -1; }
          test "$(get TARGET)" = "kamiloki/Swyrlz"
          test "$(get SCOPE)" = "generated-action-check-with-context-only-no-new-access"
          test "$(get MODE)" = "deploy"
          test "$(get APPROVED)" = "yes"
          [[ "$(get NONCE)" =~ ^[a-z0-9-]{15,100}$ ]]
          echo "approved=yes" >> "$GITHUB_OUTPUT"
      - name: Exact-revision HF publish and source readback
        if: steps.gate.outputs.approved == 'yes'
        timeout-minutes: 30
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SWRLZ_ACTION_VERIFICATION_DEPLOY_APPROVED: yes
        run: python -u scripts/hf_chat_action_verification_v1_release.py deploy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swrlz-action-verification-source-hashes
          path: reports/swrlz-action-verification-v1/manifest.json
          retention-days: 14
          if-no-files-found: ignore
