name: Check §E v11.211 Quest system Camera overlay
on:
  push:
    branches:
      - main
      - fix/quest-meta-overlay-camera-hitch-v11-211
    paths:
      - 'projects/swrlz-forge-moba/source-manifest.json'
      - 'projects/swrlz-forge-moba/patches/v11_211_quest_os_camera_overlay_stability.py'
      - 'projects/swrlz-forge-moba/runtime/engine_xr_meta_os_overlay_stability_v11_211.js'
      - 'projects/swrlz-forge-moba/runtime/engine_xr_meta_os_overlay_stability_v11_211.js'
      - 'projects/swrlz-forge-moba/tests/test_v11_211_quest_os_overlay.cjs'
      - 'projects/swrlz-forge-moba/tests/test_v11_210_workspace.cjs'
      - 'projects/swrlz-forge-moba/scripts/verify_v11_211_release.py'
      - '.github/workflows/verify-engine-v11-211-quest-os-overlay.yml'
      - '.github/workflows/deploy-swrlz-forge-moba.yml'
  pull_request:
    paths:
      - 'projects/swrlz-forge-moba/**'
      - '.github/workflows/verify-engine-v11-211-quest-os-overlay.yml'
  workflow_dispatch:
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate runtime syntax and movement / follow regression
        run: |
          node --check projects/swrlz-forge-moba/runtime/engine_xr_meta_os_overlay_stability_v11_211.js
          node --check projects/swrlz-forge-moba/runtime/sheep_xr_workspace_controls_v11_210.js
          node projects/swrlz-forge-moba/tests/test_v11_211_quest_os_overlay.cjs
          node projects/swrlz-forge-moba/tests/test_v11_210_quest_perf.cjs
          node projects/swrlz-forge-moba/tests/test_v11_210_workspace.cjs
          node projects/swrlz-forge-moba/tests/test_v11_209_radial_icons.cjs
          node projects/swrlz-forge-moba/tests/test_v11_208_biomes_depth.cjs
          node projects/swrlz-forge-moba/tests/test_v11_207_spatial_menu.cjs
          node projects/swrlz-forge-moba/tests/test_v11_206_meadow_fog.cjs
          node projects/swrlz-forge-moba/tests/test_v11_205_tactical_menu_overlay.cjs
          node projects/swrlz-forge-moba/tests/test_v11_204_rapid_grid_wheels.cjs
          node projects/swrlz-forge-moba/tests/test_v11_203_wrist_forward_aim.cjs
          node projects/swrlz-forge-moba/tests/test_v11_202_quest_framing_input_perf.cjs
          node projects/swrlz-forge-moba/tests/test_v11_201_warcraft_footprints.cjs
          node projects/swrlz-forge-moba/tests/test_v11_200_sheep_spotlight.cjs
          node projects/swrlz-forge-moba/tests/test_v11_199_sheep_vr.cjs
          node projects/swrlz-forge-moba/tests/test_v11_198_editor_6dof_flight_gizmo.cjs
          node projects/swrlz-forge-moba/tests/test_v11_197_sheep_visual_stability.cjs
          node projects/swrlz-forge-moba/tests/test_v11_196_quest_fog_menu.cjs
          node projects/swrlz-forge-moba/tests/test_v11_195_quest_stability.cjs
          node projects/swrlz-forge-moba/tests/test_v11_194_emberfall_arpg.cjs
          node projects/swrlz-forge-moba/tests/test_v11_193_sheep_vr.cjs
          node projects/swrlz-forge-moba/tests/test_v11_192_native_vr_editor.cjs
          node projects/swrlz-forge-moba/tests/test_v11_191_xr_recovery.cjs
          node projects/swrlz-forge-moba/tests/test_v11_181_xr_session_lifecycle.cjs
      - name: Build source and record exact output for manifest sealing
        run: |
          python3 projects/swrlz-forge-moba/build_space.py --output "$RUNNER_TEMP/se-v11-211"
          wc -c "$RUNNER_TEMP/se-v11-211/index.html"
          sha256sum "$RUNNER_TEMP/se-v11-211/index.html"
          if python3 -c 'import json; m=json.load(open("projects/swrlz-forge-moba/source-manifest.json")); assert m.get("finalSha256") and m.get("finalBytes")'; then
            python3 projects/swrlz-forge-moba/scripts/verify_v11_210_release.py --output "$RUNNER_TEMP/se-v11-211-verified"
          else
            echo "Candidate built; seal reported size/hash in source-manifest before deployment."
          fi
