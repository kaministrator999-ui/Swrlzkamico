name: §E v11.284 sealed Plain Hand Base and model starter tabs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/receipt-forge-v11-284.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sealed:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify native plain hand, 17 bones, and live model card grouping
        run: node projects/swrlz-forge-moba/scripts/smoke_v11_284_plain_hand.js
      - name: Verify 315-patch sealed HTML, assembled JavaScript and assets
        run: python projects/swrlz-forge-moba/scripts/verify_v11_284_release.py --output /tmp/se284-sealed
