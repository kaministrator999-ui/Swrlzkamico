name: §C real HTML project publish + mobile Chromium acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/hf-chat-html-project-smoke-v1.yml']
permissions: {contents: read}
concurrency:
  group: swrlz-hf-space-deployment
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Validate HTML, CSS, JavaScript and source-scoped publisher
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python -m py_compile scripts/hf_html_project_publish_v1.py scripts/test_live_html_project_smoke_v1.py
          node --check html-projects/swrlz-html-smoke/main.js
          python -m unittest discover -s tests -p 'test_hf_html_project_publish_v1.py' -v
          python scripts/hf_html_project_publish_v1.py validate --project swrlz-html-smoke
      - run: python -m pip install --quiet 'huggingface_hub>=0.34,<2'
      - name: Publish one owner-approved test project in existing §C Space only
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
          PROJECT_SLUG: swrlz-html-smoke
          SWRLZ_HTML_PROJECT_APPROVED: '1'
        run: python scripts/hf_html_project_publish_v1.py publish --project "$PROJECT_SLUG" --approved yes
      - name: Verify live project CSP headers and index bytes against GitHub SHA
        env:
          PROJECT_SLUG: swrlz-html-smoke
        run: python scripts/hf_html_project_publish_v1.py probe --project "$PROJECT_SLUG"
      - run: |
          python -m pip install --quiet playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify mobile Chromium CSS, JS, and isolated browser session
        run: python scripts/test_live_html_project_smoke_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-html-smoke-receipt
          path: html-project-receipt.json
          if-no-files-found: warn
          retention-days: 30
