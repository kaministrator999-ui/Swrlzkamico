name: Prepare and seal §E v11.463 persistent transform bar
on:
  push:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/RELEASE_PREPARE_V11_463.json"
permissions:
  contents: write
  actions: write
concurrency:
  group: engine-v11-463-seal
  cancel-in-progress: false
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Build candidate and verify native toolbar/asset integrity
        run: python projects/swrlz-forge-moba/scripts/prepare_v11_463_release.py
      - name: Commit verified source seal, then separately request HF deployment
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/swrlz-forge-moba/source-manifest.json
          git commit -m "build(§E v11.463): seal compiled transform history bar source"
          git fetch origin main
          git rebase origin/main
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          export SOURCE_COMMIT
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path('projects/swrlz-forge-moba')
          m=json.loads((root/'source-manifest.json').read_text())
          assert m['name']=='§wyrl§ Engine v11.463' and len(m['patches'])==440
          req={
           'schema':'swrlz-forge-deploy-request-v1',
           'requestedBy':'ChatGPT (owner-approved)',
           'target':'kamiloki/swrlz-forge-moba',
           'releaseVersion':'v11.463',
           'deployMarker':'SWYRL_ENGINE_DEPLOY_MARKER: V11_463_TRANSFORM_BAR_HISTORY',
           'reason':'Restore top native Model Studio Undo/Redo transform toolbar after history clears mesh selection. Inactive actions disabled until selection returns; native strip remount and earlier camera/sidebar display preserved. Verified compiled source, physical Android acceptance pending.',
           'sourceCommit':os.environ['SOURCE_COMMIT'],
           'sourceIntegritySha256':m['finalSha256']
          }
          (root/'DEPLOY_REQUEST.json').write_text(json.dumps(req,indent=2,ensure_ascii=False)+'\n')
          PY
          git add projects/swrlz-forge-moba/DEPLOY_REQUEST.json
          git commit -m "deploy(§E v11.463): request verified transform-toolbar recovery"
          git push origin HEAD:main
          gh workflow run deploy-swrlz-forge-moba.yml --ref main
