name: Verify §E satchel sealed release
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-satchel-candidate.yml"
      - "projects/swrlz-forge-moba/source-manifest.json"
      - "projects/swrlz-forge-moba/patches/v11_412_apprentice_satchel_tutorial.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sealed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify complete v11.412 package and inherited native regressions
        run: python projects/swrlz-forge-moba/scripts/verify_v11_412_release.py --output dist/swrlz-forge-moba
      - name: Upload source receipt
        uses: actions/upload-artifact@v4
        with:
          name: swrlz-engine-v11-412-source
          path: dist/swrlz-forge-moba/SOURCE.json
