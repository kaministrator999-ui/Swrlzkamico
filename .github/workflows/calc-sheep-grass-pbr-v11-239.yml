name: Calculate Sheep Tag Grass PBR Engine Receipt
on:
  push:
    branches:
      - feature/sheep-tag-grass-pbr
    paths:
      - projects/swrlz-forge-moba/source-manifest.json
      - .github/workflows/calc-sheep-grass-pbr-v11-239.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check focused source
        run: |
          node --check projects/swrlz-forge-moba/runtime/sheep_grass_pbr_v11_239.js
          python3 -m py_compile projects/swrlz-forge-moba/patches/v11_239_sheep_grass_pbr.py
      - name: Decode and inspect compressed grass image
        shell: bash
        run: |
          python -m pip -q install Pillow
          python - <<'PY'
          from PIL import Image, ImageStat
          from pathlib import Path
          p=Path('projects/swrlz-forge-moba/assets/sheep-tag/grass-source-color-quest.webp')
          with Image.open(p) as im:
              im.load()
              rgb=im.convert('RGB')
              stats=ImageStat.Stat(rgb)
              print('GRASS_IMAGE_FORMAT',im.format)
              print('GRASS_IMAGE_DIMENSIONS',im.size)
              print('GRASS_IMAGE_MEAN_RGB',tuple(round(i,2) for i in stats.mean))
              assert im.size[0]>16 and im.size[1]>16
              assert stats.mean[1]>stats.mean[0], 'not a green grass source'
          PY
      - name: Build exact governed HTML and print integrity
        shell: bash
        run: |
          python3 projects/swrlz-forge-moba/build_space.py --output "$RUNNER_TEMP/grass-build"
          echo "GRASS_PBR_FINAL_BYTES=$(wc -c < "$RUNNER_TEMP/grass-build/index.html")"
          echo "GRASS_PBR_FINAL_SHA256=$(sha256sum "$RUNNER_TEMP/grass-build/index.html" | cut -d' ' -f1)"
          test -f "$RUNNER_TEMP/grass-build/assets/sheep-tag/grass-source-color-quest.webp"
      - name: Verify sealed release after receipt is set
        run: |
          SHA=$(python3 -c 'import json;print(json.load(open("projects/swrlz-forge-moba/source-manifest.json"))["finalSha256"])')
          if [ -n "$SHA" ]; then
            python3 projects/swrlz-forge-moba/scripts/verify_v11_239_release.py --output "$RUNNER_TEMP/sealed-grass"
          else
            echo "Receipt calculation only (unsealed candidate)"
          fi
