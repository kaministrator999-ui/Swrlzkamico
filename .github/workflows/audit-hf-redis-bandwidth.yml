name: Audit HF chat Redis bandwidth hot paths (read-only)
on:
  push:
    branches: [main]
    paths: [".github/workflows/audit-hf-redis-bandwidth.yml"]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - run: python -m pip install 'huggingface_hub>=0.34,<2'
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from huggingface_hub import HfApi,hf_hub_download
          repo="kamiloki/Swyrlz"
          rev=HfApi().repo_info(repo,repo_type="space").sha
          print("LIVE_REV",rev,flush=True)
          needles={
            "station.py":(r"def _persist_chat_snapshot|def _commit_revision|def _session|def _run|_commit_revision\(s\)|@app\.(?:get|post)\(.*(?:sync|status)|CODE_OUTPUT_CHECKPOINT|pendingCodeGeneration|activeGeneration|def sync|def station_sync",[(270,355),(1460,1570),(1660,1710),(1755,1810),(2075,2150)]),
            "account_chat_store.py":(r"def (save_chat|load_chat|_redis|_encrypt_native|_decode_native)|_redis\(|CHAT_CHUNK_BYTES|CHAT_MAX_RAW|\bSET\b|\bGET\b|def _pack|def _unpack",[(150,315)]),
            "github_connection.py":(r"def _redis\(|def _settings|Durable account storage temporarily unavailable",[]),
            "chat/§wyrlz/index.html":(r"setInterval\(|scheduleStationSync|syncStation\s*=|fetch\(\"/api/lalm_station/sync|fetch\(\"/api/lalm_station/live-code-control",[(4315,4335)]),
          }
          for name,(pattern,ranges) in needles.items():
            try:
              lines=Path(hf_hub_download(repo,name,repo_type="space",revision=rev)).read_text().splitlines()
            except Exception as ex:
              print("MISSING",name,type(ex).__name__,flush=True)
              continue
            hits=[i+1 for i,line in enumerate(lines) if re.search(pattern,line)]
            print("FILE",name,"LINES",len(lines),"HITS",len(hits),"MARKERS",hits[:160],flush=True)
            keep=set()
            for at in hits:
              radius=10 if name!="station.py" else 4
              keep.update(range(max(1,at-radius),min(len(lines),at+radius)+1))
            for a,b in ranges:
              keep.update(range(a,min(b,len(lines))+1))
            for n in sorted(keep):
              line=lines[n-1]
              if any(tok in line for tok in ("HF_TOKEN","REDIS_REST_TOKEN","FERNET_KEY","ENCRYPTION_KEY","SWRLZ_DIAGNOSTIC_GITHUB_TOKEN")):
                continue
              print(f"AUDIT_LINE {name}:{n}: {line[:350]}",flush=True)
          PY
