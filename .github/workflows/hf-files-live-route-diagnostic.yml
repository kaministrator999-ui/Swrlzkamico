name: Diagnose §C Files control serving route and rollback state
on:
  push:
    branches: [main]
    paths: [".github/workflows/hf-files-live-route-diagnostic.yml"]
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - run: python -m pip install 'huggingface_hub>=0.34,<2'
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,urllib.request,urllib.error,uuid
          from huggingface_hub import HfApi,hf_hub_download
          S="kamiloki/Swyrlz";r=HfApi().repo_info(S,repo_type="space").sha
          print("FILE_ROUTE_SPACE_REV",r,flush=True)
          for f in ("station.py","qwen_coder_engine.py","lfm2_700m_engine.py","chat/§wyrlz/index.html"):
              code=Path(hf_hub_download(S,f,repo_type="space",revision=r)).read_text()
              print("FILE_ROUTE_SOURCE",json.dumps({"file":f,"marker":code.count("swrlz-project-source-import-v1"),
                  "newFilePicker":code.count("projectFilePickButton"),"bytes":len(code)}),flush=True)
          base="https://kamiloki-swyrlz.hf.space"
          paths=("/chat/%C2%A7wyrlz","/chat/%C2%A7wyrlz/","/chat/%C2%A7wyrlz/index.html",
                 "/chat/","/","/api/hf/qwen35-ready")
          for path in paths:
              try:
                  q=urllib.request.Request(base+path+"?import_probe="+uuid.uuid4().hex,
                     headers={"User-Agent":"Swyrlz-Upload-Verification","Cache-Control":"no-cache"})
                  with urllib.request.urlopen(q,timeout=22) as response:
                      chunk=response.read(1250000)
                      body=chunk.decode("utf-8","replace")
                      print("FILE_ROUTE_HTTP",json.dumps({"path":path,"code":response.status,
                          "finalUrl":response.geturl(),"chars":len(body),"contentType":response.headers.get("Content-Type"),
                          "picker":'id="projectFilePicker"' in body,"imagePicker":'id="imagePicker"' in body,
                          "heading":body[:70]}),flush=True)
              except Exception as e:print("FILE_ROUTE_HTTP_ERROR",json.dumps({"path":path,"type":type(e).__name__,
                           "detail":str(e)[:150]}),flush=True)
          PY
