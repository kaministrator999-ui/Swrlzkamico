name: Verify §E v11.62 adaptive contextual tool workbench production release
on:
  push:
    branches: [release/atelier-v11-59-production]
    paths:
      - 'projects/swrlz-forge-moba/scripts/verify_v11_62_release.py'
      - 'projects/swrlz-forge-moba/source-manifest.json'
      - 'projects/swrlz-forge-moba/patches/v11_59_precision_model_atelier.py'
      - 'projects/swrlz-forge-moba/patches/v11_60_floating_tool_dock.py'
      - 'projects/swrlz-forge-moba/patches/v11_60_floating_tool_dock_preview.py'
      - 'projects/swrlz-forge-moba/patches/v11_61_context_workbench.py'
      - 'projects/swrlz-forge-moba/patches/v11_61_context_workbench_preview.py'
      - 'projects/swrlz-forge-moba/runtime/model_atelier_*.js'
      - 'projects/swrlz-forge-moba/patches/v11_21_vertex_sphere_brush_preview.py'
      - 'projects/swrlz-forge-moba/tests/model_atelier_*.mjs'
      - '.github/workflows/verify-production-atelier-v11-59.yml'
  pull_request:
    paths:
      - 'projects/swrlz-forge-moba/**'
      - '.github/workflows/verify-production-atelier-v11-59.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: precision-context-v1162
  cancel-in-progress: true
jobs:
  geometry-and-native-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build sealed original model and overlay ALL saved precision tools
        run: |
          python projects/swrlz-forge-moba/scripts/verify_v11_62_release.py --output dist/atelier-precision-v11-61
          node --check projects/swrlz-forge-moba/runtime/model_atelier_occluded_brush_v11_51.js
          node --check projects/swrlz-forge-moba/runtime/model_atelier_screen_brush_v11_52.js
          node --check projects/swrlz-forge-moba/runtime/model_atelier_painted_regions_v11_53.js
          node --check projects/swrlz-forge-moba/runtime/model_atelier_viewport_gizmo_v11_54.js
          node --check projects/swrlz-forge-moba/runtime/model_atelier_photo_cutout_v11_55.js
          node --check projects/swrlz-forge-moba/runtime/model_atelier_custom_falloff_v11_56.js
          node --check projects/swrlz-forge-moba/runtime/model_atelier_floating_references_v11_57.js
          node --check projects/swrlz-forge-moba/runtime/model_atelier_topology_lod_v11_38.js
          node --check projects/swrlz-forge-moba/runtime/model_atelier_surface_targeting_v11_22.js
          node --check dist/atelier-precision-v11-61-module.mjs
          python -m py_compile projects/swrlz-forge-moba/patches/v11_21_vertex_sphere_brush_preview.py
      - name: All precision-tool geometry, serialization and safety contracts
        run: |
          npm install --no-save three@0.169.0 playwright@1.56.1
          for file in \
            model_sculpt_brush_cpu_v11_21.mjs \
            model_atelier_surface_targeting_v11_22.mjs \
            model_atelier_lasso_v11_22.mjs \
            model_atelier_face_sheet_v11_23.mjs \
            model_atelier_face_volume_v11_23.mjs \
            model_atelier_numeric_groups_v11_23.mjs \
            model_atelier_local_refine_v11_23.mjs \
            model_atelier_freehand_lasso_v11_24.mjs \
            model_atelier_interior_camera_v11_25.mjs \
            model_atelier_brush_ops_v11_27.mjs \
            model_atelier_density_profiles_v11_28.mjs \
            model_atelier_lasso_group_v11_30.mjs \
            model_atelier_refine_layers_v11_31.mjs \
            model_atelier_ref_dock_v11_32.mjs \
            model_atelier_region_boolean_v11_34.mjs \
            model_atelier_lasso_curve_v11_35.mjs \
            model_atelier_lasso_segment_v11_36.mjs \
            model_atelier_topology_lod_v11_38.mjs \
            model_atelier_face_landmarks_v11_39.mjs \
            model_atelier_topology_direct_v11_40.mjs \
            model_atelier_face_contour_v11_41.mjs \
            model_atelier_runtime_lod_v11_43.mjs \
            model_atelier_topology_audit_v11_44.mjs \
            model_atelier_reference_compare_v11_45.mjs \
            model_atelier_adaptive_topology_v11_46.mjs \
            model_atelier_face_profile_v11_47.mjs \
            model_atelier_boundary_cap_v11_48.mjs \
            model_atelier_uv_reprojection_v11_49.mjs \
            model_atelier_face_extrude_v11_50.mjs \
            model_atelier_occluded_brush_v11_51.mjs \
            model_atelier_screen_brush_v11_52.mjs \
            model_atelier_painted_regions_v11_53.mjs \
            model_atelier_viewport_gizmo_v11_54.mjs \
            model_atelier_photo_cutout_v11_55.mjs \
            model_atelier_custom_falloff_v11_56.mjs \
            model_atelier_floating_references_v11_57.mjs \
            model_atelier_uv_island_lod_v11_58.mjs \
            model_atelier_visible_geodesic_v11_59.mjs; do
              echo "Checking $file"
              node "projects/swrlz-forge-moba/tests/$file"
          done
          python projects/swrlz-forge-moba/tests/verify_atelier_ci_routing_v11_33.py
  actual-browser-cross-tool:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    strategy:
      fail-fast: false
      matrix:
        shard: [surface, sculpt, references-core, references-face, topology-regions, topology-mesh]
    env:
      SHARD: ${{ matrix.shard }}
      SWYRL_SCULPT_TEST_URL: http://127.0.0.1:8787
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify v11.62 release then reconstruct exact historical v11.59 tool fixture
        run: |
          python projects/swrlz-forge-moba/scripts/verify_v11_62_release.py --output /tmp/atelier-precision-v11-61
          node --check /tmp/atelier-precision-v11-61-module.mjs
          python projects/swrlz-forge-moba/scripts/prepare_v11_59_regression_fixture.py /tmp/atelier-precision-v11-61
      - name: Install one browser per validation shard
        run: |
          npm install --no-save playwright@1.56.1 three@0.169.0
          npx playwright install --with-deps --only-shell chromium
      - name: Run all selected tests through original editor on desktop and Android
        run: |
          python -m http.server 8787 --directory /tmp/atelier-precision-v11-61 >/tmp/atelier-preview-server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8787/ >/dev/null; then break; fi
            sleep .3
          done
          curl -fsS http://127.0.0.1:8787/ >/dev/null
          case "$SHARD" in
            surface)
              files="model_sculpt_brush_playwright_v11_21.mjs model_atelier_surface_brush_browser_v11_22.mjs model_atelier_freehand_browser_v11_24.mjs model_atelier_interior_browser_v11_25.mjs model_atelier_occluded_brush_browser_v11_51.mjs model_atelier_screen_brush_browser_v11_52.mjs model_atelier_visible_geodesic_browser_v11_59.mjs"
              ;;
            sculpt)
              files="model_atelier_brush_ops_browser_v11_27.mjs model_atelier_density_profiles_browser_v11_28.mjs model_atelier_nearest_shell_browser_v11_29.mjs model_atelier_refine_layers_browser_v11_31.mjs model_atelier_custom_falloff_browser_v11_56.mjs"
              ;;
            references-core)
              files="model_atelier_reference_studio_v11_22.mjs model_atelier_face_sheet_browser_v11_23.mjs model_atelier_numeric_groups_browser_v11_23.mjs model_atelier_ref_dock_browser_v11_32.mjs model_atelier_floating_references_browser_v11_57.mjs"
              ;;
            references-face)
              files="model_atelier_face_landmarks_browser_v11_39.mjs model_atelier_face_contour_browser_v11_41.mjs model_atelier_face_tap_browser_v11_42.mjs model_atelier_reference_compare_browser_v11_45.mjs model_atelier_face_profile_browser_v11_47.mjs model_atelier_photo_cutout_browser_v11_55.mjs"
              ;;
            topology-regions)
              files="model_atelier_lasso_browser_v11_22.mjs model_atelier_refinement_browser_v11_23.mjs model_atelier_region_boolean_browser_v11_34.mjs model_atelier_lasso_curve_browser_v11_35.mjs model_atelier_lasso_segment_browser_v11_36.mjs model_atelier_painted_regions_browser_v11_53.mjs model_atelier_viewport_gizmo_browser_v11_54.mjs"
              ;;
            topology-mesh)
              files="model_atelier_topology_lod_browser_v11_38.mjs model_atelier_topology_direct_browser_v11_40.mjs model_atelier_runtime_lod_browser_v11_43.mjs model_atelier_topology_audit_browser_v11_44.mjs model_atelier_adaptive_topology_browser_v11_46.mjs model_atelier_boundary_cap_browser_v11_48.mjs model_atelier_uv_reprojection_browser_v11_49.mjs model_atelier_face_extrude_browser_v11_50.mjs model_atelier_uv_island_lod_browser_v11_58.mjs"
              ;;
            *) exit 1 ;;
          esac
          for file in $files; do
            echo "INTEGRATION TEST $SHARD $file"
            node "projects/swrlz-forge-moba/tests/$file"
          done
