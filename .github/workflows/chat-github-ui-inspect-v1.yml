name: Inspect live §C GitHub UI anchors
on:
  push:
    branches: [improve/chat-github-review-receipt-ui-v1]
    paths: ['.github/workflows/chat-github-ui-inspect-v1.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip -q install 'huggingface_hub>=0.34,<2'
      - name: Inspect UI integration anchors only
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          from huggingface_hub import HfApi,hf_hub_download
          from pathlib import Path
          api=HfApi()
          rev=api.repo_info('kamiloki/Swyrlz',repo_type='space').sha
          s=Path(hf_hub_download('kamiloki/Swyrlz','chat/§wyrlz/index.html',repo_type='space',revision=rev)).read_text()
          for q in ['SwrlzGithubChangeReviewV1','github-change-review-v1.js','github-change-review','github-change-receipt','swrlz-github-change-review','githubChatFileAction','reconcileReceipt']:
            i=s.find(q)
            print('ANCHOR',repr(q),'INDEX',i,'CONTEXT',repr(s[max(0,i-180):i+350]) if i>=0 else '')
          PY
