name: Measure §E v11.421 Quest tutorial menu fix
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/measure-vr-tutorial-menus-v11-420.yml"
      - "projects/swrlz-forge-moba/patches/v11_421_vr_tutorial_menu_interaction.py"
      - "projects/swrlz-forge-moba/runtime/model_vr_menu_stability_v11_421.js"
      - "projects/swrlz-forge-moba/tests/model_vr_menu_stability_v11_421.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test native XR menu hit arbitration
        run: node projects/swrlz-forge-moba/tests/model_vr_menu_stability_v11_421.cjs
      - name: Build 401-patch Quest menu candidate and measure source
        run: |
          python - <<'PY'
          import pathlib,json,base64,gzip,hashlib,importlib.util,subprocess,sys,tempfile
          root=pathlib.Path("projects/swrlz-forge-moba").resolve()
          m=json.loads((root/"source-manifest.json").read_text())
          assert m["name"]=="§wyrl§ Engine v11.420" and len(m["patches"])==401
          raw=gzip.decompress(base64.b64decode("".join((root/n).read_text().strip() for n in m["chunks"])))
          assert len(raw)==m["baseBytes"] and hashlib.sha256(raw).hexdigest()==m["baseSha256"]
          html=raw.decode()
          def apply(rel,n):
              global html
              spec=importlib.util.spec_from_file_location("release_"+str(n),root/rel)
              module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
              html=module.apply(html)
          for i,rel in enumerate(m["patches"]):apply(rel,i)
          assert len(html.encode())==m["finalBytes"] and hashlib.sha256(html.encode()).hexdigest()==m["finalSha256"]
          apply("patches/v11_421_vr_tutorial_menu_interaction.py",len(m["patches"]))
          data=html.encode("utf8")
          for token in ["SE421_MODEL_VR_MENU_STABILITY_START","SWYRL_ENGINE_DEPLOY_MARKER: V11_421_VR_TUTORIAL_MENU_INTERACTION","box.positioned||box.userPositioned","panelParentIsScene"]:
              assert token in html,token
          temp=pathlib.Path(tempfile.gettempdir())/"se420_candidate.html";temp.write_bytes(data)
          subprocess.run([sys.executable,str(root/"scripts/check_inline_js_syntax_v11_266.py"),str(temp)],check=True)
          subprocess.run(["node","--check",str(root/"runtime/model_vr_menu_stability_v11_421.js")],check=True)
          print("VR_MENU_420_FINAL_BYTES="+str(len(data)))
          print("VR_MENU_420_FINAL_SHA256="+hashlib.sha256(data).hexdigest())
          print("VR_MENU_420_PATCHES="+str(len(m["patches"])+1))
          PY