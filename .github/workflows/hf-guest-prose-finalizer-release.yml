name: Guarded §C no-code finalizer and guest evaluation batches 1–3
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hf-guest-prose-finalizer-release.yml'
permissions: {contents: read}
concurrency:
  group: swrlz-chat-guest-eval
  cancel-in-progress: false
jobs:
  release_and_accept:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned test dependencies
        run: |
          python -m pip install 'huggingface_hub>=0.34,<2' playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Validate scripts
        run: |
          python -m py_compile scripts/hf_guest_prose_finalizer_v1.py
          python -m py_compile scripts/eval_chat_guest_suite.py
      - name: Preflight exact current HF source and static regression fixtures
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u scripts/hf_guest_prose_finalizer_v1.py preflight
      - name: Preserve complete exact pre-release source
        uses: actions/upload-artifact@v4
        with:
          name: swrlz-prose-finalizer-source-rollback-${{ github.run_id }}
          path: reports/prose-guard-v1/
          retention-days: 90
          if-no-files-found: error
      - name: Publish one-file revision-guarded prose delivery correction
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SWRLZ_PROSE_FINALIZER_APPROVED: '1'
        run: python -u scripts/hf_guest_prose_finalizer_v1.py publish
      - name: Evaluate live guest chat, HTML generation and guest reload
        id: tests
        shell: bash
        env:
          SWRLZ_EVAL_BASE: https://kamiloki-swyrlz.hf.space
          SWRLZ_EVAL_MODEL: 700m
        run: |
          set -uo pipefail
          failures=0
          for batch in 1 2 3; do
            echo "=== §C GUEST LIVE BATCH $batch ==="
            rm -rf reports/chat-guest-eval
            python -u scripts/eval_chat_guest_suite.py --mode live --batch "$batch"
            status=$?
            mkdir -p "reports/guest-finalizer-evaluation/batch-$batch"
            if [[ -d reports/chat-guest-eval ]]; then
              cp -a reports/chat-guest-eval/. "reports/guest-finalizer-evaluation/batch-$batch/"
              cat reports/chat-guest-eval/summary.md >> "$GITHUB_STEP_SUMMARY" || true
              printf '\n---\n' >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "BATCH_RESULT batch=$batch exit=$status"
            if [[ "$status" -ne 0 ]]; then failures=1; fi
          done
          echo "failed=$failures" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload all guest regression reports, logs and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swrlz-guest-batches-1-2-3-${{ github.run_id }}
          path: reports/guest-finalizer-evaluation/
          retention-days: 21
          if-no-files-found: ignore
      - name: Enforce complete regression acceptance
        if: steps.tests.outputs.failed == '1'
        run: |
          echo "::warning::At least one live batch did not pass. Read per-batch artifacts; do not equate static preflight with live success."
          exit 1
