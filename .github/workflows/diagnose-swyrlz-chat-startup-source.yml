name: Diagnose §C deployed startup source (read only)
on:
  push:
    branches: [main]
    paths: [".github/workflows/diagnose-swyrlz-chat-startup-source.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Compare deployed Gradio startup, ZeroGPU binding and source
        run: |
          python - <<'PY'
          import json,re,urllib.request
          base='https://huggingface.co/spaces/kamiloki/Swyrlz/resolve/main/'
          def get(name):
              with urllib.request.urlopen(urllib.request.Request(base+name,headers={'User-Agent':'SWRLZ-ReadOnly-Startup/1'}),timeout=20) as r:return r.read().decode('utf-8')
          for name in ['README.md','app.py','requirements.txt']:
              try:
                  body=get(name)
                  print('SECHAT_FILE',name,'bytes',len(body.encode()),flush=True)
                  if name=='README.md':
                      print('SECHAT_CARD',repr(body[:650]),flush=True)
                  elif name=='app.py':
                      lines=body.splitlines()
                      for i,line in enumerate(lines):
                          if i<50 or re.search(r'@spaces\.GPU|import spaces|\.click\(|\.submit\(|\.load\(|gradio|gr\.Blocks|gr\.Interface|def .*generate|def .*predict',line):
                              print('SECHAT_APP',i+1,line[:250],flush=True)
                  else:
                      print('SECHAT_DEPS',[x for x in body.splitlines() if re.search(r'^(gradio|spaces|torch|transformers|llama|huggingface)',x,re.I)],flush=True)
              except Exception as e:print('SECHAT_FETCH_ERROR',name,type(e).__name__,str(e)[:150],flush=True)
          PY
