name: Verify live HF programming contract

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".acceptance/HF_PROGRAMMING_CONTRACT_LIVE.txt"

permissions:
  contents: read

concurrency:
  group: swrlz-hf-programming-contract-live
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Verify live language and failure-evidence contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import base64
          import http.cookiejar
          import json
          import re
          import time
          import urllib.error
          import urllib.request
          import uuid
          from pathlib import Path

          request = {}
          for raw in Path(".acceptance/HF_PROGRAMMING_CONTRACT_LIVE.txt").read_text(encoding="utf-8").splitlines():
              if "=" in raw:
                  key, value = raw.split("=", 1)
                  request[key.strip()] = value.strip()

          base = request.get("SPACE_BASE", "https://kamiloki-swyrlz.hf.space").rstrip("/")
          expected_revision = request["EXPECTED_SPACE_REVISION"]
          expected_source = request["EXPECTED_SOURCE"]

          with urllib.request.urlopen("https://huggingface.co/api/spaces/kamiloki/Swyrlz", timeout=30) as response:
              meta = json.loads(response.read().decode("utf-8"))
          live_revision = str(meta.get("sha") or "")
          assert live_revision == expected_revision, (live_revision, expected_revision)
          print(json.dumps({"checkpoint":"space-revision","spaceRevision":live_revision,"expectedSource":expected_source,"status":"PASS"}))

          class Client:
              def __init__(self):
                  jar = http.cookiejar.CookieJar()
                  self.opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))

              def get(self, path):
                  req = urllib.request.Request(base + path, headers={"User-Agent":"swrlz-programming-contract-live/1.0"})
                  with self.opener.open(req, timeout=45) as response:
                      return response.status, json.loads(response.read().decode("utf-8"))

              def post(self, path, payload):
                  req = urllib.request.Request(
                      base + path,
                      data=json.dumps(payload).encode("utf-8"),
                      method="POST",
                      headers={"Content-Type":"application/json","User-Agent":"swrlz-programming-contract-live/1.0"},
                  )
                  with self.opener.open(req, timeout=45) as response:
                      return response.status, json.loads(response.read().decode("utf-8"))

              def send_and_wait(self, thread_id, prompt):
                  rid = "v118-" + uuid.uuid4().hex[:12]
                  status, ack = self.post("/api/lalm_station/send", {
                      "modelId":"700m",
                      "threadId":thread_id,
                      "requestId":rid,
                      "messageId":"u-" + uuid.uuid4().hex[:12],
                      "assistantMessageId":"a-" + uuid.uuid4().hex[:12],
                      "prompt":prompt,
                      "profile":"",
                      "userProfile":"",
                      "timeZone":"America/Chicago",
                  })
                  assert status == 202, (status, ack)
                  assert ack.get("modelId") == "700m", ack
                  latest = None
                  for attempt in range(210):
                      status, snapshot = self.get("/api/lalm_station/sync")
                      assert status == 200, status
                      generation = snapshot.get("activeGeneration") or {}
                      if generation.get("requestId") == rid:
                          latest = (generation, snapshot)
                          if generation.get("terminal"):
                              return generation, snapshot
                      time.sleep(2)
                  raise AssertionError(("generation-timeout", rid, latest))

          warm = Client()
          models = None
          for attempt in range(80):
              try:
                  status, payload = warm.get("/api/hf/models")
                  if status == 200 and isinstance(payload.get("models"), list):
                      models = payload["models"]
                      break
              except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError):
                  pass
              time.sleep(3)
          assert models is not None, "Space did not become ready"
          coder = next((item for item in models if item.get("model_id") == "coder" or item.get("modelId") == "coder"), None)
          assert coder and "Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF" in str(coder.get("checkpoint") or ""), coder

          def route_state(generation):
              statuses = generation.get("status") if isinstance(generation.get("status"), list) else []
              phases = [str(item.get("phase") or "") for item in statuses if isinstance(item, dict)]
              intent = generation.get("programmingIntent") if isinstance(generation.get("programmingIntent"), dict) else {}
              validation = generation.get("candidateValidation") if isinstance(generation.get("candidateValidation"), dict) else {}
              assert intent.get("codingTask") is True, intent
              assert "PROGRAMMING_INTENT" in phases, phases
              assert "CODER_AUTO_ROUTE" in phases, phases
              return phases, intent, validation

          def wait_for_github_persistence(client, request_id):
              latest = None
              for _ in range(45):
                  status, snapshot = client.get("/api/lalm_station/sync")
                  assert status == 200, status
                  generation = snapshot.get("activeGeneration") or {}
                  if generation.get("requestId") == request_id:
                      latest = (generation, snapshot)
                      persisted = generation.get("githubTelemetryPersistence") or {}
                      if persisted.get("ok") is True:
                          return generation, snapshot, persisted
                      if persisted.get("ok") is False and persisted.get("state") != "QUEUED":
                          raise AssertionError(("github-telemetry-persistence-failed", persisted))
                  time.sleep(1)
              raise AssertionError(("github-telemetry-persistence-timeout", request_id, latest))

          def fetch_runtime_programming_log(request_id):
              safe_request = "".join(ch for ch in request_id if ch.isalnum() or ch in "-_")[:80]
              path = f"runtime-diagnostics/programming/{safe_request}/candidate-attempt-telemetry.json"
              url = "https://api.github.com/repos/kaministrator999-ui/Swrlzkamico/contents/" + path + "?ref=runtime"
              latest_error = None
              for _ in range(30):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent":"swrlz-programming-contract-live/1.0"})
                      with urllib.request.urlopen(req, timeout=30) as response:
                          payload = json.loads(response.read().decode("utf-8"))
                      content = base64.b64decode(payload["content"]).decode("utf-8")
                      return path, json.loads(content)
                  except (urllib.error.HTTPError, urllib.error.URLError, KeyError, ValueError) as exc:
                      latest_error = repr(exc)
                      time.sleep(1)
              raise AssertionError(("github-runtime-log-unavailable", path, latest_error))

          receipts = []

          c1 = Client()
          g1, s1 = c1.send_and_wait("language-" + uuid.uuid4().hex[:10], "Can you write me an example html page")
          _, intent1, validation1 = route_state(g1)
          assert g1.get("terminalType") == "COMPLETE", g1
          assert validation1.get("status") == "PASS", validation1
          attempts1 = g1.get("candidateAttempts") if isinstance(g1.get("candidateAttempts"), list) else []
          telemetry1 = g1.get("generationTelemetry") if isinstance(g1.get("generationTelemetry"), dict) else {}
          station1 = g1.get("stationTiming") if isinstance(g1.get("stationTiming"), dict) else {}
          assert len(attempts1) >= 1, g1
          assert telemetry1.get("attemptCount") == len(attempts1), (telemetry1, attempts1)
          assert telemetry1.get("regenerationCount") == max(0, len(attempts1)-1), telemetry1
          assert telemetry1.get("finalCandidateStatus") == "PASS", telemetry1
          assert telemetry1.get("finalAcceptedAttempt") == len(attempts1), telemetry1
          assert isinstance(telemetry1.get("engineTotalLatencyMs"), (int,float)), telemetry1
          assert isinstance(telemetry1.get("visibleFirstDeltaLatencyMs"), (int,float)), telemetry1
          assert isinstance(station1.get("endToEndMs"), int) and station1.get("endToEndMs") >= 0, station1
          assert station1.get("endToEndMs") >= station1.get("stationRunMs",0), station1
          for index, attempt_receipt in enumerate(attempts1, start=1):
              assert attempt_receipt.get("attempt") == index, attempt_receipt
              assert isinstance(attempt_receipt.get("durationMs"), (int,float)), attempt_receipt
              assert attempt_receipt.get("candidateFingerprint"), attempt_receipt
              assert attempt_receipt.get("validationStatus") in ("PASS","REJECT"), attempt_receipt
          language1 = ((intent1.get("intentContract") or {}).get("languageContract") or {})
          assert language1.get("requestedLanguages") == ["html"], language1
          assert "html" in (validation1.get("detectedLanguages") or []), validation1
          assert "python" not in (validation1.get("detectedLanguages") or []), validation1
          text1 = str(g1.get("text") or "")
          assert re.search(r"(?is)<!doctype\s+html|<html\b", text1), text1
          assert not re.search(r"```python\b|\bfrom\s+flask\s+import\b", text1, re.I), text1
          g1, s1, persistence1 = wait_for_github_persistence(c1, g1.get("requestId"))
          expected_log_path = "runtime-diagnostics/programming/" + g1.get("requestId") + "/candidate-attempt-telemetry.json"
          assert persistence1.get("path") == expected_log_path, persistence1
          assert persistence1.get("branch") == "runtime", persistence1

          thread1 = next((thread for thread in (s1.get("threads") or []) if thread.get("id") == g1.get("threadId")), None)
          assert thread1, s1
          assistant1 = next((msg for msg in reversed(thread1.get("messages") or []) if (msg.get("meta") or {}).get("requestId") == g1.get("requestId") and msg.get("role") == "assistant"), None)
          assert assistant1, thread1
          message_telemetry = ((assistant1.get("meta") or {}).get("programmingTelemetry") or {})
          assert (message_telemetry.get("generation") or {}).get("attemptCount") == len(attempts1), message_telemetry
          assert (assistant1.get("meta") or {}).get("githubTelemetryPersistence",{}).get("ok") is True, assistant1.get("meta")

          log_path1, repo_log1 = fetch_runtime_programming_log(g1.get("requestId"))
          assert log_path1 == expected_log_path, log_path1
          assert repo_log1.get("schema") == "swrlz-github-programming-attempt-log-v1", repo_log1
          assert repo_log1.get("requestId") == g1.get("requestId"), repo_log1
          assert repo_log1.get("sourceRef") == expected_source, repo_log1
          diagnostic1 = repo_log1.get("diagnostic") or {}
          persisted_generation1 = diagnostic1.get("generationTelemetry") or {}
          persisted_station1 = diagnostic1.get("stationTiming") or {}
          assert persisted_generation1.get("attemptCount") == len(attempts1), persisted_generation1
          assert persisted_generation1.get("regenerationCount") == max(0,len(attempts1)-1), persisted_generation1
          assert persisted_station1.get("endToEndMs") == station1.get("endToEndMs"), (persisted_station1, station1)
          serialized_log1 = json.dumps(repo_log1, ensure_ascii=False).lower()
          assert "can you write me an example html page" not in serialized_log1, serialized_log1
          assert "<!doctype html" not in serialized_log1 and "<html" not in serialized_log1, serialized_log1
          assert "userprofile" not in serialized_log1 and "profile" not in (repo_log1.get("diagnostic") or {}), repo_log1

          receipts.append({
              "case":"html-language-fidelity-and-attempt-camera",
              "validation":validation1,
              "attemptCount":len(attempts1),
              "regenerationCount":telemetry1.get("regenerationCount"),
              "engineTotalLatencyMs":telemetry1.get("engineTotalLatencyMs"),
              "stationEndToEndMs":station1.get("endToEndMs"),
              "githubLogPath":log_path1,
              "githubPersisted":True,
              "status":"PASS",
          })

          c2 = Client()
          repair_prompt = "\n".join([
              "Fix this Python code and return the complete corrected code.",
              "```python",
              "def digest(value):",
              "    return hashlib.sha256(value.encode()).hexdigest()",
              "```",
              "Traceback (most recent call last):",
              "NameError: name 'hashlib' is not defined",
          ])
          g2, _ = c2.send_and_wait("seed-repair-" + uuid.uuid4().hex[:10], repair_prompt)
          _, intent2, validation2 = route_state(g2)
          assert g2.get("terminalType") == "COMPLETE", g2
          assert validation2.get("status") == "PASS", validation2
          evidence2 = intent2.get("failureEvidence") or {}
          assert evidence2.get("receiptSourceOwnership") == "user-seed", evidence2
          assert "hashlib" in ((evidence2.get("receiptSemantics") or {}).get("reportedSymbols") or []), evidence2
          assert validation2.get("diagnosticGrounded") is True, validation2
          assert validation2.get("executionVerified") is False, validation2
          assert validation2.get("verificationState") == "AWAITING_EXTERNAL_RECEIPT", validation2
          text2 = str(g2.get("text") or "")
          fenced2 = re.search(r"```python[^\n]*\n([\s\S]*?)```", text2, re.I)
          source2 = fenced2.group(1).strip() if fenced2 else text2.strip()
          tree2 = ast.parse(source2)
          digest = next((node for node in tree2.body if isinstance(node, ast.FunctionDef) and node.name == "digest"), None)
          assert digest is not None, source2
          has_hashlib_import = any(
              (isinstance(node, ast.Import) and any(alias.name == "hashlib" for alias in node.names))
              or (isinstance(node, ast.ImportFrom) and node.module == "hashlib")
              for node in tree2.body
          )
          hashlib_name_used = any(isinstance(node, ast.Name) and node.id == "hashlib" for node in ast.walk(tree2))
          assert has_hashlib_import or not hashlib_name_used, source2
          receipts.append({"case":"user-seed-compiler-repair","validation":validation2,"status":"PASS"})

          c3 = Client()
          thread3 = "artifact-lineage-" + uuid.uuid4().hex[:10]
          g3a, _ = c3.send_and_wait(thread3, "Write a Python function named add(a, b) that returns a + b. Return complete runnable code.")
          _, intent3a, validation3a = route_state(g3a)
          assert g3a.get("terminalType") == "COMPLETE", g3a
          assert validation3a.get("status") == "PASS", validation3a
          artifact3 = (g3a.get("artifactReceipt") or {}).get("artifactId")
          assert artifact3, g3a.get("artifactReceipt")

          g3b, _ = c3.send_and_wait(thread3, "it doesn't work")
          _, intent3b, validation3b = route_state(g3b)
          assert intent3b.get("needsFailureEvidence") is True, intent3b
          assert intent3b.get("repairLifecycleState") == "EVIDENCE_REQUIRED", intent3b
          assert intent3b.get("artifactTargetId") == artifact3, (intent3b, artifact3)
          assert intent3b.get("artifactMutationRequested") is False, intent3b
          assert validation3b.get("status") == "EVIDENCE_REQUIRED", validation3b
          assert "Paste the compiler" in str(g3b.get("text") or ""), g3b.get("text")

          g3c, _ = c3.send_and_wait(thread3, "RuntimeError: simulated external verification failure")
          _, intent3c, validation3c = route_state(g3c)
          evidence3 = intent3c.get("failureEvidence") or {}
          assert intent3c.get("artifactTargetId") == artifact3, (intent3c, artifact3)
          assert intent3c.get("artifactMutationRequested") is True, intent3c
          assert evidence3.get("repairTargetArtifactId") == artifact3, evidence3
          assert evidence3.get("receiptSourceOwnership") == "previous-assistant-candidate", evidence3
          receipts.append({
              "case":"generated-artifact-evidence-lineage",
              "evidenceRequestValidation":validation3b,
              "repairValidation":validation3c,
              "artifactId":artifact3,
              "status":"PASS",
          })

          receipt = {
              "checkpoint":"live-programming-contract-v118",
              "spaceRevision":live_revision,
              "expectedSource":expected_source,
              "coderCheckpoint":coder.get("checkpoint"),
              "cases":receipts,
              "status":"PASS",
          }
          print(json.dumps(receipt, ensure_ascii=False))
          Path("hf-programming-contract-live.json").write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hf-programming-contract-live
          path: hf-programming-contract-live.json
          if-no-files-found: ignore
          retention-days: 30
