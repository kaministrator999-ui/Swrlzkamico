name: Verify live HF programming contract

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".acceptance/HF_PROGRAMMING_CONTRACT_LIVE.txt"

permissions:
  contents: read

concurrency:
  group: swrlz-hf-programming-contract-live
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 36
    steps:
      - uses: actions/checkout@v4

      - name: Verify live language and failure-evidence contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import base64
          import hashlib
          import http.cookiejar
          import json
          import re
          import time
          import urllib.error
          import urllib.request
          import uuid
          from pathlib import Path

          request = {}
          for raw in Path(".acceptance/HF_PROGRAMMING_CONTRACT_LIVE.txt").read_text(encoding="utf-8").splitlines():
              if "=" in raw:
                  key, value = raw.split("=", 1)
                  request[key.strip()] = value.strip()

          base = request.get("SPACE_BASE", "https://kamiloki-swyrlz.hf.space").rstrip("/")
          expected_revision = request["EXPECTED_SPACE_REVISION"]
          expected_source = request["EXPECTED_SOURCE"]

          with urllib.request.urlopen("https://huggingface.co/api/spaces/kamiloki/Swyrlz", timeout=30) as response:
              meta = json.loads(response.read().decode("utf-8"))
          live_revision = str(meta.get("sha") or "")
          assert live_revision == expected_revision, (live_revision, expected_revision)
          print(json.dumps({"checkpoint":"space-revision","spaceRevision":live_revision,"expectedSource":expected_source,"status":"PASS"}))

          class Client:
              def __init__(self):
                  jar = http.cookiejar.CookieJar()
                  self.opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))

              def get(self, path):
                  req = urllib.request.Request(base + path, headers={"User-Agent":"swrlz-programming-contract-live/1.0"})
                  with self.opener.open(req, timeout=45) as response:
                      return response.status, json.loads(response.read().decode("utf-8"))

              def post(self, path, payload):
                  req = urllib.request.Request(
                      base + path,
                      data=json.dumps(payload).encode("utf-8"),
                      method="POST",
                      headers={"Content-Type":"application/json","User-Agent":"swrlz-programming-contract-live/1.0"},
                  )
                  with self.opener.open(req, timeout=45) as response:
                      return response.status, json.loads(response.read().decode("utf-8"))

              def send_and_wait(self, thread_id, prompt, model_id="700m"):
                  rid = "v122-" + uuid.uuid4().hex[:12]
                  status, ack = self.post("/api/lalm_station/send", {
                      "modelId":model_id,
                      "threadId":thread_id,
                      "requestId":rid,
                      "messageId":"u-" + uuid.uuid4().hex[:12],
                      "assistantMessageId":"a-" + uuid.uuid4().hex[:12],
                      "prompt":prompt,
                      "profile":"",
                      "userProfile":"",
                      "timeZone":"America/Chicago",
                  })
                  assert status == 202, (status, ack)
                  assert ack.get("modelId") == model_id, ack
                  latest = None
                  for attempt in range(420):
                      status, snapshot = self.get("/api/lalm_station/sync")
                      assert status == 200, status
                      generation = snapshot.get("activeGeneration") or {}
                      if generation.get("requestId") == rid:
                          latest = (generation, snapshot)
                          if generation.get("terminal"):
                              return generation, snapshot
                      time.sleep(2)
                  raise AssertionError(("generation-timeout", rid, latest))

          def wait_for_online_persistence(client, request_id):
              latest = None
              for _ in range(90):
                  status, snapshot = client.get("/api/lalm_station/sync")
                  assert status == 200, status
                  generation = snapshot.get("activeGeneration") or {}
                  if generation.get("requestId") == request_id:
                      latest = (generation, snapshot)
                      persisted = generation.get("onlineLogPersistence") if isinstance(generation.get("onlineLogPersistence"), dict) else {}
                      trace = persisted.get("trace") if isinstance(persisted.get("trace"), dict) else {}
                      outcome = persisted.get("outcome") if isinstance(persisted.get("outcome"), dict) else {}
                      for label, receipt in (("trace", trace), ("outcome", outcome)):
                          if receipt.get("ok") is False:
                              raise AssertionError(("online-log-persistence-failed", label, receipt))
                      if trace.get("ok") is True and outcome.get("ok") is True:
                          return generation, snapshot, persisted
                  time.sleep(1)
              raise AssertionError(("online-log-persistence-timeout", request_id, latest))

          warm = Client()
          models = None
          for attempt in range(80):
              try:
                  status, payload = warm.get("/api/hf/models")
                  if status == 200 and isinstance(payload.get("models"), list):
                      models = payload["models"]
                      break
              except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError):
                  pass
              time.sleep(3)
          assert models is not None, "Space did not become ready"
          coder = next((item for item in models if item.get("model_id") == "coder" or item.get("modelId") == "coder"), None)
          assert coder and "Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF" in str(coder.get("checkpoint") or ""), coder

          with urllib.request.urlopen(base + "/", timeout=45) as response:
              chat_html = response.read().decode("utf-8", "replace")
          assert "station-online-trail" in chat_html, "deployed Chat missing live online trail"
          assert "SEARCH_PROVIDER_VISIT" in chat_html and "WEATHER_FORECAST_VISIT" in chat_html, "deployed Chat missing online phase labels"
          assert "site:String(event.site||\"\")" in chat_html, "deployed Chat does not retain streamed site field"
          print(json.dumps({"checkpoint":"chat-online-status-ui","status":"PASS"}))

          receipts = []

          # v123 general-response cognition: prove current-turn relationship state survives live Station routing.
          rc = Client()
          rc_thread = "response-cognition-" + uuid.uuid4().hex[:10]
          rg1, _ = rc.send_and_wait(rc_thread, "Create 2 short names for a moon base.")
          assert rg1.get("terminalType") == "COMPLETE", rg1
          rc1 = rg1.get("responseCognition") if isinstance(rg1.get("responseCognition"), dict) else {}
          assert rc1.get("relation") == "standalone", rc1
          assert rc1.get("operation") == "create", rc1
          assert rc1.get("requestedCount") == 2, rc1

          rg2, _ = rc.send_and_wait(rc_thread, "keep going")
          assert rg2.get("terminalType") == "COMPLETE", rg2
          rc2 = rg2.get("responseCognition") if isinstance(rg2.get("responseCognition"), dict) else {}
          assert rc2.get("relation") == "continuation", rc2
          assert rc2.get("operation") == "continue", rc2
          assert int(rc2.get("historyTurns") or 0) >= 2, rc2

          rg3, rs3 = rc.send_and_wait(rc_thread, "No, I meant names for an underwater lab.")
          assert rg3.get("terminalType") == "COMPLETE", rg3
          rc3 = rg3.get("responseCognition") if isinstance(rg3.get("responseCognition"), dict) else {}
          assert rc3.get("relation") == "correction", rc3
          assert rc3.get("operation") == "correct", rc3
          rc_thread_state = next((thread for thread in (rs3.get("threads") or []) if thread.get("id") == rc_thread), None)
          assert rc_thread_state, rs3
          rc_assistant = next((msg for msg in reversed(rc_thread_state.get("messages") or []) if (msg.get("meta") or {}).get("requestId") == rg3.get("requestId") and msg.get("role") == "assistant"), None)
          assert rc_assistant, rc_thread_state
          assert ((rc_assistant.get("meta") or {}).get("responseCognition") or {}).get("relation") == "correction", rc_assistant

          # v126 real-user weather regression: preserve the exact wording that failed
          # in the user's live Chat and require city+state geocode fallback.
          weather_client = Client()
          weather_thread = "weather-" + uuid.uuid4().hex[:10]
          wg, ws = weather_client.send_and_wait(weather_thread, "Can you check the weather in Leavenworth kansas")
          assert wg.get("terminalType") == "COMPLETE", wg
          weather_research = wg.get("onlineResearch") if isinstance(wg.get("onlineResearch"), dict) else {}
          weather_widgets = wg.get("widgets") if isinstance(wg.get("widgets"), list) else []
          weather_sources = wg.get("sources") if isinstance(wg.get("sources"), list) else []
          assert weather_research.get("kind") == "weather" and weather_research.get("status") == "OK", weather_research
          assert weather_research.get("provider") == "Open-Meteo", weather_research
          assert weather_widgets and weather_widgets[0].get("contract") == "swrlz-widget-v1", weather_widgets
          assert weather_widgets[0].get("kind") == "weather", weather_widgets[0]
          weather_location = ((weather_widgets[0].get("data") or {}).get("location") or {})
          assert "Leavenworth" in str(weather_location.get("label") or ""), weather_location
          assert "Kansas" in str(weather_location.get("label") or ""), weather_location
          weather_current = ((weather_widgets[0].get("data") or {}).get("current") or {})
          assert weather_current.get("temperature") is not None, weather_current
          assert weather_current.get("humidity") is not None, weather_current
          assert weather_current.get("windSpeed") is not None, weather_current
          assert weather_sources and any("open-meteo.com" in str(item.get("url") or "") for item in weather_sources), weather_sources
          weather_thread_state = next((thread for thread in (ws.get("threads") or []) if thread.get("id") == weather_thread), None)
          assert weather_thread_state, ws
          weather_assistant = next((msg for msg in reversed(weather_thread_state.get("messages") or []) if (msg.get("meta") or {}).get("requestId") == wg.get("requestId") and msg.get("role") == "assistant"), None)
          assert weather_assistant, weather_thread_state
          persisted_weather_widgets = (weather_assistant.get("meta") or {}).get("widgets") or []
          assert persisted_weather_widgets and persisted_weather_widgets[0].get("kind") == "weather", weather_assistant
          weather_trace = wg.get("onlineTrace") if isinstance(wg.get("onlineTrace"), list) else []
          assert any(item.get("phase") == "WEATHER_GEOCODE_VISIT" and item.get("site") == "geocoding-api.open-meteo.com" for item in weather_trace), weather_trace
          assert any(item.get("phase") == "WEATHER_GEOCODE_RETRY" for item in weather_trace), weather_trace
          assert any(item.get("phase") == "WEATHER_FORECAST_VISIT" and item.get("site") == "api.open-meteo.com" for item in weather_trace), weather_trace
          assert all("?" not in str(item.get("url") or "") for item in weather_trace), weather_trace
          wg_persisted, ws_persisted, weather_logs = wait_for_online_persistence(weather_client, wg.get("requestId"))
          assert weather_logs.get("tracePath") == "runtime-diagnostics/online-research/" + wg.get("requestId") + "/online-research-trace.json", weather_logs
          assert weather_logs.get("outcomePath") == "runtime-diagnostics/online-research/" + wg.get("requestId") + "/online-research-outcome.json", weather_logs
          assert (weather_logs.get("trace") or {}).get("ok") is True, weather_logs
          assert (weather_logs.get("outcome") or {}).get("ok") is True, weather_logs
          receipts.append({
              "case":"v126-real-user-leavenworth-weather-live",
              "provider":weather_research.get("provider"),
              "condition":weather_current.get("condition"),
              "temperature":weather_current.get("temperature"),
              "widgetKind":weather_widgets[0].get("kind"),
              "sourceCount":len(weather_sources),
              "status":"PASS",
          })

          # v127 exact screenshot continuation: this must inherit weather + Leavenworth,
          # remain on 700M, and never search the literal words "Yes for today".
          follow_g, follow_s = weather_client.send_and_wait(weather_thread, "Yes for today", model_id="700m")
          assert follow_g.get("terminalType") == "COMPLETE", follow_g
          assert follow_g.get("selectedModelId") == "700m", follow_g
          follow_intent = follow_g.get("programmingIntent") if isinstance(follow_g.get("programmingIntent"), dict) else {}
          assert follow_intent.get("codingTask") is False, follow_intent
          follow_research = follow_g.get("onlineResearch") if isinstance(follow_g.get("onlineResearch"), dict) else {}
          follow_widgets = follow_g.get("widgets") if isinstance(follow_g.get("widgets"), list) else []
          assert follow_research.get("kind") == "weather" and follow_research.get("status") == "OK", follow_research
          assert follow_research.get("reason") == "weather-continuation", follow_research
          assert follow_widgets and follow_widgets[0].get("kind") == "weather", follow_widgets
          follow_location = ((follow_widgets[0].get("data") or {}).get("location") or {})
          assert "Leavenworth" in str(follow_location.get("label") or "") and "Kansas" in str(follow_location.get("label") or ""), follow_location
          follow_text = str(follow_g.get("text") or "").lower()
          assert "i can't access" not in follow_text and "i cannot access" not in follow_text, follow_text
          receipts.append({
              "case":"v127-weather-continuation-live",
              "selectedModelId":follow_g.get("selectedModelId"),
              "reason":follow_research.get("reason"),
              "widgetKind":follow_widgets[0].get("kind"),
              "location":follow_location.get("label"),
              "status":"PASS",
          })

          # v127 exact screenshot correction: reject weather lineage, search only "hey",
          # stay on 700M, and never fall into Coder/no-code-candidate validation.
          correction_prompt = "I didn't mean look up weather I want you to look up the word hey"
          correction_g, correction_s = weather_client.send_and_wait(weather_thread, correction_prompt, model_id="700m")
          assert correction_g.get("terminalType") == "COMPLETE", correction_g
          assert correction_g.get("selectedModelId") == "700m", correction_g
          correction_intent = correction_g.get("programmingIntent") if isinstance(correction_g.get("programmingIntent"), dict) else {}
          assert correction_intent.get("codingTask") is False, correction_intent
          correction_research = correction_g.get("onlineResearch") if isinstance(correction_g.get("onlineResearch"), dict) else {}
          correction_widgets = correction_g.get("widgets") if isinstance(correction_g.get("widgets"), list) else []
          assert correction_research.get("kind") == "search" and correction_research.get("status") == "OK", correction_research
          assert correction_widgets and correction_widgets[0].get("kind") == "search-results", correction_widgets
          correction_query = str(((correction_widgets[0].get("data") or {}).get("query") or "")).strip().lower()
          assert correction_query == "hey", (correction_query, correction_widgets[0])
          correction_text = str(correction_g.get("text") or "").lower()
          assert "can't assist" not in correction_text and "cannot assist" not in correction_text, correction_text
          assert "can't access" not in correction_text and "cannot access" not in correction_text, correction_text
          correction_phases=[str(item.get("phase") or "") for item in (correction_g.get("status") or []) if isinstance(item,dict)]
          assert "CODER_AUTO_ROUTE" not in correction_phases, correction_phases
          receipts.append({
              "case":"v127-search-correction-stays-700m-live",
              "selectedModelId":correction_g.get("selectedModelId"),
              "query":correction_query,
              "widgetKind":correction_widgets[0].get("kind"),
              "resultCount":correction_research.get("resultCount"),
              "status":"PASS",
          })

          # v124 general web search: exercise the canonical bounded search owner
          # through Station and require provenance-bearing structured results.
          search_client = Client()
          search_thread = "search-" + uuid.uuid4().hex[:10]
          sg, ss = search_client.send_and_wait(search_thread, "Search online for Open-Meteo weather API documentation")
          assert sg.get("terminalType") == "COMPLETE", sg
          search_research = sg.get("onlineResearch") if isinstance(sg.get("onlineResearch"), dict) else {}
          search_widgets = sg.get("widgets") if isinstance(sg.get("widgets"), list) else []
          search_sources = sg.get("sources") if isinstance(sg.get("sources"), list) else []
          assert search_research.get("kind") == "search", search_research
          assert search_research.get("status") == "OK", search_research
          assert int(search_research.get("resultCount") or 0) > 0, search_research
          assert search_widgets and search_widgets[0].get("kind") == "search-results", search_widgets
          assert search_sources and all(str(item.get("url") or "").startswith(("http://","https://")) for item in search_sources), search_sources
          search_thread_state = next((thread for thread in (ss.get("threads") or []) if thread.get("id") == search_thread), None)
          assert search_thread_state, ss
          search_assistant = next((msg for msg in reversed(search_thread_state.get("messages") or []) if (msg.get("meta") or {}).get("requestId") == sg.get("requestId") and msg.get("role") == "assistant"), None)
          assert search_assistant, search_thread_state
          assert ((search_assistant.get("meta") or {}).get("widgets") or [])[0].get("kind") == "search-results", search_assistant
          search_trace = sg.get("onlineTrace") if isinstance(sg.get("onlineTrace"), list) else []
          assert any(item.get("phase") == "SEARCH_PROVIDER_VISIT" and item.get("site") for item in search_trace), search_trace
          assert all("?" not in str(item.get("url") or "") for item in search_trace), search_trace
          assert ((search_assistant.get("meta") or {}).get("onlineTrace") or []), search_assistant
          sg_persisted, ss_persisted, search_logs = wait_for_online_persistence(search_client, sg.get("requestId"))
          assert search_logs.get("tracePath") == "runtime-diagnostics/online-research/" + sg.get("requestId") + "/online-research-trace.json", search_logs
          assert search_logs.get("outcomePath") == "runtime-diagnostics/online-research/" + sg.get("requestId") + "/online-research-outcome.json", search_logs
          assert (search_logs.get("trace") or {}).get("ok") is True, search_logs
          assert (search_logs.get("outcome") or {}).get("ok") is True, search_logs
          receipts.append({
              "case":"v125-online-search-observability-live",
              "provider":search_research.get("provider"),
              "resultCount":search_research.get("resultCount"),
              "widgetKind":search_widgets[0].get("kind"),
              "sourceCount":len(search_sources),
              "status":"PASS",
          })

          # Explicitly prove the newest coding route receives the same online layer.
          coder_client = Client()
          coder_thread = "coder-search-" + uuid.uuid4().hex[:10]
          cg, cs = coder_client.send_and_wait(
              coder_thread,
              "Search online for the latest FastAPI release documentation and show the Python code changes needed to update an app.",
              model_id="coder",
          )
          assert cg.get("terminalType") == "COMPLETE", cg
          assert cg.get("modelId") == "coder", cg
          assert (cg.get("programmingIntent") or {}).get("codingTask") is True, cg.get("programmingIntent")
          coder_research = cg.get("onlineResearch") if isinstance(cg.get("onlineResearch"), dict) else {}
          coder_widgets = cg.get("widgets") if isinstance(cg.get("widgets"), list) else []
          coder_sources = cg.get("sources") if isinstance(cg.get("sources"), list) else []
          assert coder_research.get("kind") == "search" and coder_research.get("status") == "OK", coder_research
          assert int(coder_research.get("resultCount") or 0) > 0, coder_research
          assert coder_widgets and coder_widgets[0].get("kind") == "search-results", coder_widgets
          assert coder_sources, coder_sources
          coder_thread_state = next((thread for thread in (cs.get("threads") or []) if thread.get("id") == coder_thread), None)
          assert coder_thread_state, cs
          coder_assistant = next((msg for msg in reversed(coder_thread_state.get("messages") or []) if (msg.get("meta") or {}).get("requestId") == cg.get("requestId") and msg.get("role") == "assistant"), None)
          assert coder_assistant and (coder_assistant.get("meta") or {}).get("modelId") == "coder", coder_assistant
          assert ((coder_assistant.get("meta") or {}).get("widgets") or [])[0].get("kind") == "search-results", coder_assistant
          assert cg.get("selectedModelId") == "coder", cg
          assert (((coder_assistant.get("meta") or {}).get("onlineModelRoute") or {}).get("selectedModelId")) == "coder", coder_assistant
          coder_trace = cg.get("onlineTrace") if isinstance(cg.get("onlineTrace"), list) else []
          assert any(item.get("phase") == "SEARCH_PROVIDER_VISIT" and item.get("site") for item in coder_trace), coder_trace
          cg_persisted, cs_persisted, coder_logs = wait_for_online_persistence(coder_client, cg.get("requestId"))
          assert coder_logs.get("tracePath") == "runtime-diagnostics/online-research/" + cg.get("requestId") + "/online-research-trace.json", coder_logs
          assert coder_logs.get("outcomePath") == "runtime-diagnostics/online-research/" + cg.get("requestId") + "/online-research-outcome.json", coder_logs
          assert (coder_logs.get("trace") or {}).get("ok") is True, coder_logs
          assert (coder_logs.get("outcome") or {}).get("ok") is True, coder_logs
          receipts.append({
              "case":"v125-coder-online-search-observability-live",
              "modelId":"coder",
              "checkpoint":coder.get("checkpoint"),
              "provider":coder_research.get("provider"),
              "resultCount":coder_research.get("resultCount"),
              "widgetKind":coder_widgets[0].get("kind"),
              "sourceCount":len(coder_sources),
              "status":"PASS",
          })

          def route_state(generation):
              statuses = generation.get("status") if isinstance(generation.get("status"), list) else []
              phases = [str(item.get("phase") or "") for item in statuses if isinstance(item, dict)]
              intent = generation.get("programmingIntent") if isinstance(generation.get("programmingIntent"), dict) else {}
              validation = generation.get("candidateValidation") if isinstance(generation.get("candidateValidation"), dict) else {}
              assert intent.get("codingTask") is True, intent
              assert "PROGRAMMING_INTENT" in phases, phases
              assert "CODER_AUTO_ROUTE" in phases, phases
              return phases, intent, validation

          def wait_for_github_persistence(client, request_id):
              latest = None
              for _ in range(45):
                  status, snapshot = client.get("/api/lalm_station/sync")
                  assert status == 200, status
                  generation = snapshot.get("activeGeneration") or {}
                  if generation.get("requestId") == request_id:
                      latest = (generation, snapshot)
                      persisted = generation.get("githubTelemetryPersistence") or {}
                      if persisted.get("ok") is True:
                          return generation, snapshot, persisted
                      if persisted.get("ok") is False and persisted.get("state") != "QUEUED":
                          raise AssertionError(("github-telemetry-persistence-failed", persisted))
                  time.sleep(1)
              raise AssertionError(("github-telemetry-persistence-timeout", request_id, latest))

          def fetch_runtime_programming_log(request_id):
              safe_request = "".join(ch for ch in request_id if ch.isalnum() or ch in "-_")[:80]
              path = f"runtime-diagnostics/programming/{safe_request}/candidate-attempt-telemetry.json"
              url = "https://api.github.com/repos/kaministrator999-ui/Swrlzkamico/contents/" + path + "?ref=runtime"
              latest_error = None
              for _ in range(30):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent":"swrlz-programming-contract-live/1.0"})
                      with urllib.request.urlopen(req, timeout=30) as response:
                          payload = json.loads(response.read().decode("utf-8"))
                      content = base64.b64decode(payload["content"]).decode("utf-8")
                      return path, json.loads(content)
                  except (urllib.error.HTTPError, urllib.error.URLError, KeyError, ValueError) as exc:
                      latest_error = repr(exc)
                      time.sleep(1)
              raise AssertionError(("github-runtime-log-unavailable", path, latest_error))

          def fetch_runtime_log_path(path):
              url = "https://api.github.com/repos/kaministrator999-ui/Swrlzkamico/contents/" + path + "?ref=runtime"
              latest_error = None
              for _ in range(40):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent":"swrlz-programming-contract-live/1.0"})
                      with urllib.request.urlopen(req, timeout=30) as response:
                          payload = json.loads(response.read().decode("utf-8"))
                      content = base64.b64decode(payload["content"]).decode("utf-8")
                      return json.loads(content)
                  except (urllib.error.HTTPError, urllib.error.URLError, KeyError, ValueError) as exc:
                      latest_error = repr(exc)
                      time.sleep(1)
              raise AssertionError(("github-runtime-log-unavailable", path, latest_error))

          online_logs = []
          for label, persisted in (("weather", weather_logs), ("search", search_logs), ("coder", coder_logs)):
              for log_kind, path_key, expected_schema in (
                  ("trace", "tracePath", "swrlz-github-online-research-trace-v1"),
                  ("outcome", "outcomePath", "swrlz-github-online-research-outcome-v1"),
              ):
                  path = str(persisted.get(path_key) or "")
                  assert path.startswith("runtime-diagnostics/online-research/"), (label, log_kind, persisted)
                  online_log = fetch_runtime_log_path(path)
                  assert online_log.get("schema") == expected_schema, online_log
                  assert online_log.get("sourceRef") == expected_source, online_log
                  diagnostic = online_log.get("diagnostic") or {}
                  assert diagnostic.get("rawPromptStored") is False, diagnostic
                  assert diagnostic.get("historyStored") is False, diagnostic
                  assert diagnostic.get("preciseLocationStored") is False, diagnostic
