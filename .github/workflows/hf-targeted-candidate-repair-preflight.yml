name: Read-only §C targeted code repair and source-preservation preflight
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hf-targeted-candidate-repair-preflight.yml"
      - "scripts/hf_chat_targeted_candidate_repair_v1.py"
      - "scripts/project_code_targeted_repair_v1.py"
      - "scripts/test_project_code_targeted_repair_v1.py"
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install 'huggingface_hub>=0.34,<2'
      - name: Validate bounded micro-patch behavior, exact production AST and fake native JSON repair
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/project_code_targeted_repair_v1.py scripts/hf_chat_targeted_candidate_repair_v1.py
          python -m unittest discover -s scripts -p test_project_code_targeted_repair_v1.py -v
          python -u scripts/hf_chat_targeted_candidate_repair_v1.py preflight
          echo "SWRLZ_TARGETED_CODE_REPAIR_PREFLIGHT_PASS"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: swrlz-targeted-code-repair-exact-prior-engine
          path: swrlz-targeted-candidate-repair-backup/
          retention-days: 14
          if-no-files-found: error
