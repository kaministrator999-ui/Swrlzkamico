name: §E v11.485 Sorting Hat curved-tip asset repair
on:
  push:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/SORTING_HAT_TIP_FIX_REQUEST.json"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: se485-sorting-hat-tip
  cancel-in-progress: false
jobs:
  verify-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Regenerate tip only and verify sealed engine plus immutable UV/face geometry
        run: python projects/swrlz-forge-moba/scripts/repair_sorting_hat_tip_v11_485.py
      - name: Commit verified native Sorting Hat scene, preserving rest of engine
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/swrlz-forge-moba/scenes/model-atelier-sorting-hat.swyrl.json
          git diff --cached --quiet && { echo "No new hat-tip shape"; exit 1; }
          git commit -m "fix(§E): smooth Sorting Hat curled point within its one UV-painted mesh"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Save hotfix audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: se485-hat-tip-geometry-hotfix
          path: |
            projects/swrlz-forge-moba/scenes/model-atelier-sorting-hat.swyrl.json
            projects/swrlz-forge-moba/source-manifest.json
          if-no-files-found: error
