name: Verify §E v11.413 Quest satchel sealed source
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-satchel-vr-v11-413.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sealed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify complete v11.413 package, JS syntax, saved assets and relevant regressions
        run: python projects/swrlz-forge-moba/scripts/verify_v11_413_release.py --output dist/swrlz-forge-moba
      - name: Check XR ownership and quest ray-block contract
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path("projects/swrlz-forge-moba")
          js=(root/"runtime/model_satchel_vr_quest_v11_413.js").read_text()
          html=Path("dist/swrlz-forge-moba/index.html").read_text()
          for part in ("box.root.position.copy(ui.root.localToWorld", 
                       "box.folded?box.buttons.filter(o=>o.visible):[...box.buttons,box.panel]",
                       "se340Trigger=function(record,additive=false)", 
                       "se340Cleanup=function(...a){dispose();"):
              assert part in js,part
          for absent in ("setAnimationLoop(", "requestAnimationFrame(", ".camera.add(root)"):
              assert absent not in js,absent
          assert "Build real open-top walls" in html
          assert "SE413_SATCHEL_VR_QUEST_START" in html
          print("SATCHEL_VR_WORLD_SPACE_RAY_GUARD_PASS")
          PY
      - name: Upload source receipt
        uses: actions/upload-artifact@v4
        with:
          name: swrlz-engine-v11-413-source
          path: dist/swrlz-forge-moba/SOURCE.json