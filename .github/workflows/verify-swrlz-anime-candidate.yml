name: Verify §wyrl§ v9.3 authored anime candidate

on:
  push:
    branches: [main]
    paths: &anime_paths
      - ".github/workflows/verify-swrlz-anime-candidate.yml"
      - "projects/swrlz-forge-moba/source-manifest.json"
      - "projects/swrlz-forge-moba/patches/**"
      - "projects/swrlz-forge-moba/runtime/**"
      - "projects/swrlz-forge-moba/assets/anime/**"
      - "projects/swrlz-forge-moba/build_space.py"
      - "projects/swrlz-forge-moba/scenes/ghosts-in-different-forms-ep01*.swyrl.json"
      - "projects/swrlz-forge-moba/episodes/ghosts-in-different-forms-ep01.html"
      - "projects/swrlz-forge-moba/tests/*anime*.mjs"
      - "projects/swrlz-forge-moba/tests/storybook_authoring_playwright.mjs"
      - "projects/swrlz-forge-moba/tests/character_rig_playwright.mjs"
      - "projects/swrlz-forge-moba/tests/depth_theatre_playwright.mjs"
      - "projects/swrlz-forge-moba/tests/character_alignment_playwright.mjs"
  pull_request:
    branches: [main]
    paths: *anime_paths
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independently reconstruct sealed v9.3 source
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,json,runpy
          from pathlib import Path
          root=Path('projects/swrlz-forge-moba')
          manifest=json.loads((root/'source-manifest.json').read_text(encoding='utf-8'))
          mod=runpy.run_path(str(root/'build_space.py'))
          raw=gzip.decompress(base64.b64decode(''.join((root/p).read_text(encoding='utf-8').strip() for p in manifest['chunks'])))
          assert len(raw)==manifest['baseBytes']
          assert hashlib.sha256(raw).hexdigest()==manifest['baseSha256']
          assert len(manifest['patches'])==52
          assert manifest['patches'][-1]=='patches/v9_3_character_alignment.py'
          source=raw.decode('utf-8')
          for patch in manifest['patches']:
              source=mod['load_patch'](root/patch)(source)
          output=source.encode('utf-8')
          assert len(output)==manifest['finalBytes']
          assert hashlib.sha256(output).hexdigest()==manifest['finalSha256']
          for feature in ('V9_3_CONNECTED_CHARACTER_PIECES','Maker v9.3',
                          'CANONICAL_ANIME_EPISODE_PROJECT','SWYRL_ENGINE_CINEMATIC',
                          'SWYRL_ENGINE_ANIMATION','SWYRL_ENGINE_STORYBOARD','SWYRL_ENGINE_RIG','SWYRL_ENGINE_SCENERY',
                          'animeCreateCelLayers','animeDirectorInstall','animeMakePaperBook',
                          'animePopupStageSafety','storyEditorInstall','anime-ghosts-ep01',
                          'openAnimeScreening','animeUpdateCinematic','animeUpdateCelLayers',
                          'animeLayerVisible','animeDisposeGroup','animeCleanLayers',
                          'popKamiArt','popSwyrlzArt','ANIME_2D_LAYER_SPECS',
                          'animeMakeCast','animeCineLayers','popLowStageTrim',
                          'animePopSanitize','animePopUp','popupHinge','popUpStatus'):
              assert feature in source, feature
          assert 'data-project-template="anime-ghosts-ep01"' in source
          Path('/tmp/swyrl-anime-engine.html').write_bytes(output)
          begin=source.index('<script type="module">')+len('<script type="module">')
          Path('/tmp/swyrl-anime-engine.mjs').write_text(source[begin:source.rindex('</script>')],encoding='utf-8')
          print('ENGINE_EXPECTED_BYTES='+str(len(output)))
          print('ENGINE_EXPECTED_SHA256='+hashlib.sha256(output).hexdigest())
          print('CANDIDATE_52_PATCH_RECONSTRUCT_OK')
          PY
          node --check /tmp/swyrl-anime-engine.mjs
          python -m compileall -q projects/swrlz-forge-moba/patches projects/swrlz-forge-moba/build_space.py
      - name: Verify complete v9.3 package against source and manifest
        run: |
          python projects/swrlz-forge-moba/build_space.py --output dist/swrlz-forge-moba
          cmp /tmp/swyrl-anime-engine.html dist/swrlz-forge-moba/index.html
          python - <<'PY'
          import hashlib,json,math
          from pathlib import Path
          root=Path('projects/swrlz-forge-moba')
          out=Path('dist/swrlz-forge-moba')
          manifest=json.loads((root/'source-manifest.json').read_text())
          receipt=json.loads((out/'SOURCE.json').read_text())
          assert receipt['finalBytes']==manifest['finalBytes']
          assert receipt['finalSha256']==manifest['finalSha256']
          assert receipt['patches']==manifest['patches']
          assert len(receipt['patches'])==52
          assert receipt['patches'][-1]=='patches/v9_3_character_alignment.py'
          expected={'episodes/ghosts-in-different-forms-ep01.html',
                    'scenes/ghosts-in-different-forms-ep01.swyrl.json',
                    'scenes/ghosts-in-different-forms-ep01-storybook.swyrl.json',
                    'scenes/ghosts-in-different-forms-ep01-rigged.swyrl.json',
                    'scenes/ghosts-in-different-forms-ep01-depth.swyrl.json',
                    'scenes/ghosts-in-different-forms-ep01-positioned.swyrl.json'}
          expected.update(p.relative_to(root).as_posix() for p in (root/'assets/anime').glob('*.png'))
          assert {'assets/anime/'+name+'.png' for name in ('kami','swyrlz','cathedral','workshop','foreground','kami-rig','swyrlz-rig','scenery-parts')}<=expected
          assert set(receipt['assets'])==expected
          assert len(receipt['assets'])==14
          saved=json.loads((out/'scenes/ghosts-in-different-forms-ep01-positioned.swyrl.json').read_text())
          assert len(saved['scene']['actors'])==70
          assert len(saved['editor']['layers'])==11
          assert len(saved['project']['animeTimeline']['tracks'])==9
          rigs=saved['project']['animeRigs']
          assert rigs['schema']=='anime-character-rigs-v1'
          assert set(rigs['characters'])=={'kami','swyrlz'}
          for character,rig in rigs['characters'].items():
              assert rig['asset']=='assets/anime/'+character+'-rig.png'
              assert rig['joints'] and rig['face']
              assert set(rig['layout'])==set(rig['joints'])
              fit_bounds={'x':(-4,4),'y':(-4,4),'artX':(-4,4),'artY':(-4,4),
                          'width':(.2,4),'height':(.2,5),'rotationZ':(-math.pi,math.pi)}
              for part,layout in rig['layout'].items():
                  assert set(layout)==set(fit_bounds),(character,part)
                  for field,(low,high) in fit_bounds.items():
                      assert math.isfinite(layout[field]) and low<=layout[field]<=high,(character,part,field)
          scenery=saved['project']['animeScenery']
          assert scenery['schema']=='anime-scenery-v1'
          assert scenery['enabled'] is True
          assert len(scenery['objects'])==34
          star_ids={'stars-far','stars-middle','stars-near'}
          assert {name for name,obj in scenery['objects'].items() if obj.get('kind')=='stars'}==star_ids
          assert all(scenery['objects'][name]['count']==70 for name in star_ids)
          duration=saved['project']['animeTimeline']['duration']
          for name,obj in scenery['objects'].items():
              assert obj['id']==name and obj['keys'],name
              assert obj['parent'] in ('background','midground','atmosphere','effects'),name
              assert obj['asset']=='assets/anime/scenery-parts.png',name
              assert obj['keys'][0]['time']==0 and obj['keys'][-1]['time']==duration,name
              assert 2<=len(obj['keys'])<=128,name
          assert 'SWYRL_ENGINE_SCENERY' in (out/'index.html').read_text()
          for asset,data in receipt['assets'].items():
              packed=(out/asset).read_bytes()
              assert (root/asset).read_bytes()==packed, asset
              assert len(packed)==data['bytes'], asset
              assert hashlib.sha256(packed).hexdigest()==data['sha256'], asset
          print('PACKAGING_52_PATCHES_AND_ALL_ASSETS_VERIFIED')
          PY
