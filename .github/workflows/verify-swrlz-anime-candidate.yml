name: Verify §wyrl§ v8.6 native anime candidate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-swrlz-anime-candidate.yml"
      - "projects/swrlz-forge-moba/source-manifest.json"
      - "projects/swrlz-forge-moba/patches/v8_5_anime_starter.py"
      - "projects/swrlz-forge-moba/patches/v8_6_native_anime_cinematic.py"
      - "projects/swrlz-forge-moba/build_space.py"
      - "projects/swrlz-forge-moba/scenes/ghosts-in-different-forms-ep01.swyrl.json"
      - "projects/swrlz-forge-moba/episodes/ghosts-in-different-forms-ep01.html"
  pull_request:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/patches/v8_5_anime_starter.py"
      - "projects/swrlz-forge-moba/source-manifest.json"
      - ".github/workflows/verify-swrlz-anime-candidate.yml"
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct candidate and print exact integrity
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,json
          from pathlib import Path
          import runpy
          root=Path("projects/swrlz-forge-moba")
          manifest=json.loads((root/"source-manifest.json").read_text(encoding="utf-8"))
          mod=runpy.run_path(str(root/"build_space.py"))
          raw=gzip.decompress(base64.b64decode("".join((root/p).read_text(encoding="utf-8").strip() for p in manifest["chunks"])))
          assert hashlib.sha256(raw).hexdigest()==manifest["baseSha256"]
          assert len(raw)==manifest["baseBytes"]
          source=raw.decode("utf-8")
          for rel in manifest["patches"]:
              source=mod["load_patch"](root/rel)(source)
          output=source.encode("utf-8")
          Path("/tmp/swyrl-anime-engine.html").write_bytes(output)
          print("ENGINE_EXPECTED_BYTES="+str(len(output)))
          print("ENGINE_EXPECTED_SHA256="+hashlib.sha256(output).hexdigest())
          for rel in ("episodes/ghosts-in-different-forms-ep01.html","scenes/ghosts-in-different-forms-ep01.swyrl.json"):
              payload=(root/rel).read_bytes()
              print("PACK_ASSET="+rel+" BYTES="+str(len(payload))+" SHA256="+hashlib.sha256(payload).hexdigest())
          assert "V8_6_NATIVE_ANIME_CINEMATIC" in source
          assert 'data-project-template="anime-ghosts-ep01"' in source
          assert "CANONICAL_ANIME_EPISODE_PROJECT" in source
          assert "openAnimeScreening" in source
          assert "animeUpdateCinematic" in source
          assert "animeEndCinematic" in source
          assert "animeCineExplore" in source
          assert "SWYRL_ENGINE_CINEMATIC" in source
          assert "anime-ghosts-ep01" in source
          assert "Maker v8.6" in source
          begin=source.index('<script type="module">')+len('<script type="module">')
          end=source.rindex("</script>")
          Path("/tmp/swyrl-anime-engine.mjs").write_text(source[begin:end],encoding="utf-8")
          print("CANDIDATE_RECONSTRUCT_OK")
          PY
          node --check /tmp/swyrl-anime-engine.mjs
          python -m py_compile projects/swrlz-forge-moba/patches/v8_5_anime_starter.py projects/swrlz-forge-moba/patches/v8_6_native_anime_cinematic.py projects/swrlz-forge-moba/build_space.py
          echo "NODE_SYNTAX_AND_PYTHON_COMPILE_OK"
      - name: Verify packaged source and both starter assets
        run: |
          python projects/swrlz-forge-moba/build_space.py --output dist/swrlz-forge-moba
          cmp /tmp/swyrl-anime-engine.html dist/swrlz-forge-moba/index.html
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('projects/swrlz-forge-moba')
          out=Path('dist/swrlz-forge-moba')
          receipt=json.loads((out/'SOURCE.json').read_text())
          assert receipt['finalBytes']==611675
          assert receipt['finalSha256']=='1468357c5ce082b71548de983fd11f818cf4eeccb34eca3df92a0f15e3e94dc0'
          assert len(receipt['patches'])==45
          for asset,data in receipt['assets'].items():
              source=(root/asset).read_bytes()
              packed=(out/asset).read_bytes()
              assert source==packed
              assert len(packed)==data['bytes']
              assert hashlib.sha256(packed).hexdigest()==data['sha256']
          print('PACKAGING_45_PATCHES_AND_BOTH_ASSETS_VERIFIED')
          PY
      - name: Inspect exact v8.6 production deployment run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          from urllib.parse import urlencode
          trigger='51fec4bdf785e32950cc1d41256e3dba13c46598'
          url='https://api.github.com/repos/kaministrator999-ui/Swrlzkamico/actions/workflows/deploy-swrlz-forge-moba.yml/runs?per_page=30'
          req=urllib.request.Request(url,headers={
            'Accept':'application/vnd.github+json',
            'Authorization':'Bearer '+os.environ['GH_TOKEN'],
            'User-Agent':'swyrl-engine-deployment-check',
            'X-GitHub-Api-Version':'2022-11-28'})
          data=json.load(urllib.request.urlopen(req,timeout=30))
          found=[r for r in data.get('workflow_runs',[]) if r['head_sha']==trigger]
          for r in found:print('EXACT_V8_6_DEPLOY_RUN='+str(r['id'])+' STATUS='+str(r['status'])+' CONCLUSION='+str(r.get('conclusion'))+' URL='+str(r.get('html_url')))
          if not found:print('EXACT_V8_6_DEPLOY_RUN_NOT_YET_LISTED')
          PY
      - name: Seal exact v8.6 artifact manifest after verification
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          target=Path("projects/swrlz-forge-moba/source-manifest.json")
          meta=json.loads(target.read_text(encoding="utf-8"))
          data=Path("/tmp/swyrl-anime-engine.html").read_bytes()
          meta["finalBytes"]=len(data)
          meta["finalSha256"]=hashlib.sha256(data).hexdigest()
          target.write_text(json.dumps(meta,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("SEALED_BYTES="+str(meta["finalBytes"]))
          print("SEALED_SHA256="+meta["finalSha256"])
          PY
          python projects/swrlz-forge-moba/build_space.py --output dist/swrlz-forge-moba
          cmp /tmp/swyrl-anime-engine.html dist/swrlz-forge-moba/index.html
          test -s dist/swrlz-forge-moba/episodes/ghosts-in-different-forms-ep01.html
          test -s dist/swrlz-forge-moba/scenes/ghosts-in-different-forms-ep01.swyrl.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/swrlz-forge-moba/source-manifest.json
          if ! git diff --staged --quiet; then
            git commit -m "Seal exact v8.6 anime starter source integrity"
            git push origin HEAD:main
          fi
          echo "CANDIDATE_EXACT_SOURCE_VERIFIED"
