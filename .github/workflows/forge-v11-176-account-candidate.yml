name: §E v11.176 account project candidate verification
on:
  push:
    branches: [fix/forge-v11-176-account-project-picker]
    paths:
      - "projects/swrlz-forge-moba/**"
      - ".github/workflows/forge-v11-176-account-candidate.yml"
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify sealed v11.176 engine and account project picker
        run: |
          python projects/swrlz-forge-moba/scripts/verify_v11_176_release.py --output /tmp/swrlz-forge-176
          python projects/swrlz-forge-moba/tests/test_v11_176_chat_account_project_picker.py /tmp/swrlz-forge-176/index.html
          node --check projects/swrlz-forge-moba/runtime/chat_panel_account_project_v11_176.js
          node projects/swrlz-forge-moba/tests/test_v11_176_chat_picker.mjs
