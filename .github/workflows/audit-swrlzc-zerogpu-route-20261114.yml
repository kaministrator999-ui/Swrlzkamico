name: Inspect §C ZeroGPU route and remaining included quota (read-only)
on:
  push:
    branches: [audit/swrlzc-free-quota-20261114]
    paths:
      - scripts/audit_swrlzc_zerogpu_route_20261114.py
      - .github/workflows/audit-swrlzc-zerogpu-route-20261114.yml
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --quiet "huggingface_hub>=1.2,<3"
      - name: Inspect only route decorators, optional free GPU quota and runtime
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u scripts/audit_swrlzc_zerogpu_route_20261114.py
