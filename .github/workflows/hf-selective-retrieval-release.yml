name: Guarded §C selective factual retrieval live release
on:
  push:
    branches: [main]
    paths:
      - ".deploy/HF_CHAT_SELECTIVE_RETRIEVAL_REQUEST.txt"
permissions:
  contents: read
concurrency:
  group: swrlz-hf-space-deployment
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Require explicit existing Space and approved immutable source
        id: owner
        shell: bash
        run: |
          set -euo pipefail
          p=.deploy/HF_CHAT_SELECTIVE_RETRIEVAL_REQUEST.txt
          test -f "$p"
          get() { sed -n "s/^$1=//p" "$p" | tail -n 1; }
          test "$(get TARGET)" = "kamiloki/Swyrlz"
          test "$(get APPROVED)" = "1"
          test "$(get MODEL)" = "qwen3.5-9b"
          test "$(get FEATURE)" = "selective-public-fact-retrieval-v1"
          ref="$(get SOURCE_REF)"
          nonce="$(get REQUEST_NONCE)"
          [[ "$ref" =~ ^[a-f0-9]{40}$ ]]
          [[ "$nonce" =~ ^[a-z0-9-]{12,96}$ ]]
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Existing Space only; two source files; no model/hardware/account changes"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.owner.outputs.ref }}
          path: trial-source
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing Hugging Face client
        run: python -m pip install --quiet "huggingface_hub>=0.34,<2"
      - name: Verify reviewed research route and guarded deployment implementation
        working-directory: trial-source
        run: |
          set -euo pipefail
          python -m py_compile api/selective_retrieval.py scripts/hf_chat_selective_retrieval_trial.py scripts/hf_chat_selective_retrieval_release.py
          python -m unittest discover -s tests -p "test_selective_retrieval.py" -v
          python -m unittest discover -s tests -p "test_hf_selective_retrieval_trial.py" -v
      - name: Stage exact existing Space source with no mutation
        working-directory: trial-source
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          python -u scripts/hf_chat_selective_retrieval_trial.py --out swrlz-selective-preflight
      - name: Publish minimal existing-Space patch, verify and roll back on failure
        working-directory: trial-source
        timeout-minutes: 33
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SWRLZ_SELECTIVE_RETRIEVAL_DEPLOY_APPROVED: "1"
        run: |
          set -euo pipefail
          python -u scripts/hf_chat_selective_retrieval_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swrlz-selective-retrieval-exact-source-rollback
          path: |
            trial-source/swrlz-selective-preflight/
            trial-source/swrlz-selective-retrieval-rollback/
          retention-days: 14
          if-no-files-found: warn
