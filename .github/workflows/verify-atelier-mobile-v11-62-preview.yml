name: Verify §E v11.62 mobile adaptive tool sheet preview
on:
  pull_request:
    paths:
      - 'projects/swrlz-forge-moba/patches/v11_62_mobile_adaptive_preview.py'
      - 'projects/swrlz-forge-moba/tests/mobile_adaptive_tool_layout_browser_v11_62.mjs'
      - '.github/workflows/verify-atelier-mobile-v11-62-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: se-v11-62-mobile-preview
  cancel-in-progress: true
jobs:
  phone-landscape-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build exact sealed v11.61 and additive mobile preview
        run: |
          set -euo pipefail
          python projects/swrlz-forge-moba/scripts/verify_v11_61_release.py --output /tmp/se-mobile-preview
          python - <<'PY'
          import hashlib,runpy,json
          from pathlib import Path
          root=Path('projects/swrlz-forge-moba')
          p=Path('/tmp/se-mobile-preview/index.html')
          original=p.read_text()
          assert 'SWYRL_ENGINE_DEPLOY_MARKER: V11_61_ADAPTIVE_CONTEXT_TOOL_WORKBENCH' in original
          decoder=json.JSONDecoder()
          marker='const MODEL_ATELIER_CANONICAL_PROJECT='
          def canonical(s): return decoder.raw_decode(s.split(marker,1)[1])[0]
          old=canonical(original)
          patch=runpy.run_path(str(root/'patches/v11_62_mobile_adaptive_preview.py'))
          updated=patch['apply'](original)
          assert canonical(updated)==old and len(old.get('parts',[]))==283
          print('MOBILE_HOOK_MATCHES',updated.count('atelierMobileLayoutInstall(panel);'),updated.count('    atelierMobileLayoutInstall(panel);'),flush=True)
          assert updated.count('    atelierMobileLayoutInstall(panel);')==1
          assert original!=updated
          p.write_text(updated)
          module=updated.split('<script type="module">',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/se-mobile-preview-module.mjs').write_text(module)
          print('V1162_MOBILE_PREVIEW_PATCH_PASS',len(updated.encode()),hashlib.sha256(updated.encode()).hexdigest())
          PY
          node --check /tmp/se-mobile-preview-module.mjs
          node --check projects/swrlz-forge-moba/tests/mobile_adaptive_tool_layout_browser_v11_62.mjs
      - name: Install Chromium and Playwright
        run: |
          npm install --no-save playwright@1.56.1 three@0.169.0
          npx playwright install --with-deps --only-shell chromium
      - name: Check all portrait, landscape and desktop layout/behavior
        env:
          SWYRL_MOBILE_TEST_URL: http://127.0.0.1:8794
        run: |
          python -m http.server 8794 --directory /tmp/se-mobile-preview >/tmp/se-mobile-server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8794/ >/dev/null; then break; fi
            sleep .3
          done
          node projects/swrlz-forge-moba/tests/mobile_adaptive_tool_layout_browser_v11_62.mjs
          node projects/swrlz-forge-moba/tests/model_atelier_context_workbench_browser_v11_61.mjs
          node projects/swrlz-forge-moba/tests/model_atelier_tool_dock_browser_v11_60.mjs
