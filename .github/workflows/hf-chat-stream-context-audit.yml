name: Inspect §C streaming context telemetry for accurate latency tests
on:
  push:
    branches: [main]
    paths: [".github/workflows/hf-chat-stream-context-audit.yml"]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: python -m pip install 'huggingface_hub>=0.34,<2'
      - name: Trace live Station context events and snapshot endpoint
        shell: bash
        run: |
          python - <<'PY'
          import ast,re
          from pathlib import Path
          from huggingface_hub import HfApi,hf_hub_download
          space="kamiloki/Swyrlz";revision=HfApi().repo_info(space,repo_type="space").sha
          s=Path(hf_hub_download(space,"station.py",repo_type="space",revision=revision)).read_text()
          lines=s.splitlines()
          print("STATION_REV",revision,"LINES",len(lines),flush=True)
          for i,line in enumerate(lines):
              if any(k in line for k in ("contextBudget", 'kind=="CONTEXT"', 'kind == "CONTEXT"',
                                        '@app.get("/api/lalm_station', 'async def stream_generation',
                                        'def session_', 'def get_session', 'def state_')):
                  a=max(0,i-3);b=min(len(lines),i+12)
                  print("STREAM_CONTEXT_SITE",i+1,"\n".join("%d %s"%(j+1,lines[j]) for j in range(a,b)),flush=True)
          print("STATION_CONTEXT_AUDIT_DONE",flush=True)
          PY
