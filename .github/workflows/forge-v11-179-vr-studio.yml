name: §E v11.179 VR Controller Studio candidate
on:
  push:
    branches: [feature/forge-v11-179-vr-controller-studio-20261031]
    paths:
      - "projects/swrlz-forge-moba/**"
      - ".github/workflows/forge-v11-179-vr-studio.yml"
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax and independent local controller invariants
        run: |
          node --check projects/swrlz-forge-moba/runtime/vr_controller_studio_v11_179.js
          node projects/swrlz-forge-moba/tests/test_v11_179_vr_studio.cjs
      - name: Rebuild exact engine candidate and print hash
        run: |
          python - <<'PY'
          import json,pathlib
          f=pathlib.Path('projects/swrlz-forge-moba/source-manifest.json')
          data=json.loads(f.read_text())
          if data['name']!='§wyrl§ Engine v11.179':raise ValueError('Unexpected source')
          if data['patches'][-1]!='patches/v11_179_vr_controller_studio.py':raise ValueError('Unsealed patch')
          data['finalSha256']=''
          data['finalBytes']=0
          f.write_text(json.dumps(data,ensure_ascii=False))
          PY
          python projects/swrlz-forge-moba/build_space.py --output /tmp/forge-vr179 > /tmp/buildout
          python - <<'PY'
          import pathlib,hashlib,json
          data=(pathlib.Path('/tmp/forge-vr179')/'index.html').read_bytes()
          print('FORGE_VR179_MEASURED',json.dumps({'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}))
          assert b'V11_179_VR_CONTROLLER_STUDIO' in data
          assert b'SWYRL_VR_CONTROLS' in data
          PY
