name: §E v11.112 manual round-hole full release seal
on:
  push:
    branches: ['feature/se-v11-112-manual-precision-holes']
    paths: ['.github/workflows/se-v11112-manual-holes-seal.yml']
permissions:
  contents: read
jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Rebuild every patch and derive the entire v11.112 HTML integrity seal
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import gzip,base64,hashlib,json,sys
          root=Path('projects/swrlz-forge-moba')
          sys.path.insert(0,str(root.resolve()))
          from build_space import load_patch
          m=json.loads((root/'source-manifest.json').read_text())
          assert m['name']=='§wyrl§ Engine v11.112' and len(m['patches'])==144
          assert m['patches'][-1]=='patches/v11_112_manual_precision_hole_tools.py'
          data=gzip.decompress(base64.b64decode(''.join((root/p).read_text().strip() for p in m['chunks'])))
          assert len(data)==m['baseBytes'] and hashlib.sha256(data).hexdigest()==m['baseSha256']
          html=data.decode('utf8')
          for rel in m['patches']:html=load_patch(root/rel)(html)
          for token in ('SWYRL_ENGINE_DEPLOY_MARKER: V11_112_MANUAL_ROUND_HOLE_SCULPT',
            '<title>§wyrl§ Engine · Maker v11.112</title>',
            'function atelierBorePlanValid(part){',
            'function atelierBoreCoordinates(plan,point){',
            'Precision circle carve · one hole at a time',
            'roundHolePlan:plan',
            'for(let level=0;level<2;level++){'):
            assert token in html,token
          assert '3 holes · bowling ball' not in html
          module=html.split('<script type="module">',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/se-v11112-module.mjs').write_text(module)
          raw=html.encode()
          print('SE_V11112_FINAL_BYTES='+str(len(raw)))
          print('SE_V11112_FINAL_SHA256='+hashlib.sha256(raw).hexdigest())
          print('SE_V11112_MANUAL_RELEASE_SOURCE_PASS')
          PY
          node --check /tmp/se-v11112-module.mjs
