name: Seal §E v11.543 find-tool navigation
on:
  push:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/RELEASE_PREPARE_V11_543.json"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: se543-native-tool-search-seal
  cancel-in-progress: false
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout governed engine source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test navigation runtime and manifest patch syntax
        run: |
          node --check projects/swrlz-forge-moba/runtime/tool_navigation_search_v11_543.js
          node projects/swrlz-forge-moba/tests/tool_navigation_search_v11_543.cjs
          python -m py_compile projects/swrlz-forge-moba/patches/v11_543_tool_navigation_search.py
      - name: Rebuild exact source and calculate hash
        run: python projects/swrlz-forge-moba/scripts/prepare_v11_543_release.py
      - name: Verify actual assembled DOM menu, native API routes and package integrity
        run: |
          python projects/swrlz-forge-moba/scripts/verify_v11_543_release.py --output /tmp/se543-release
          python projects/swrlz-forge-moba/scripts/package_static_delivery_v11_543.py --output /tmp/se543-release
          node --check /tmp/se543-release/swrlz-engine-v11.543.js
      - name: Commit only verified integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/swrlz-forge-moba/source-manifest.json
          git diff --cached --quiet && { echo "No verified source manifest changes"; exit 1; }
          git commit -m "seal(§E v11.543): verified real tool navigation search and source SHA"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Retain validated manifest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: se543-tool-navigation-sha
          path: projects/swrlz-forge-moba/source-manifest.json
          if-no-files-found: warn
