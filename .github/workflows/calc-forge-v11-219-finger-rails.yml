name: Verify §E v11.219 sealed finger rail release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/calc-forge-v11-219-finger-rails.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sealed-rail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check of new hand patch
        run: |
          node --check projects/swrlz-forge-moba/runtime/model_atelier_finger_rails_v11_219.js
          python3 -m py_compile projects/swrlz-forge-moba/patches/v11_219_finger_rail_contact.py
      - name: Verify sealed 251-patch package, source identity and assets
        run: python3 projects/swrlz-forge-moba/scripts/verify_v11_219_release.py --output /tmp/se219-finger-rails
