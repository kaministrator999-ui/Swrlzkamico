name: Temporary §E v11.437 source-seal validation
on:
  push:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/patches/v11_437_sheep_territory_capture.py"
permissions:
  contents: read
jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check new JavaScript and territory behavior
        run: |
          node --check projects/swrlz-forge-moba/runtime/sheep_territory_capture_v11_437.js
          node projects/swrlz-forge-moba/tests/test_sheep_territory_capture_v11_437.cjs
      - name: Rebuild proposed 413-patch release without changing previous seal
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('projects/swrlz-forge-moba/source-manifest.json')
          m=json.loads(p.read_text())
          assert m['name']=='§wyrl§ Engine v11.436'
          m['patches'].append('patches/v11_437_sheep_territory_capture.py')
          m['name']='§wyrl§ Engine v11.437'
          m['finalArtifact']='swyrl_engine_v11_436.html'
          m['finalSha256']=None
          m['finalBytes']=None
          p.write_text(json.dumps(m,indent=2))
          PY
          python projects/swrlz-forge-moba/build_space.py --output /tmp/swrlz-se437 > /tmp/se437-build.txt
          python projects/swrlz-forge-moba/scripts/check_inline_js_syntax_v11_266.py /tmp/swrlz-se437/index.html
          python - <<'PY'
          from pathlib import Path
          import hashlib
          b=Path('/tmp/swrlz-se437/index.html').read_bytes()
          assert b==Path('/tmp/swrlz-se437/modeler.html').read_bytes()
          text=b.decode()
          assert 'SE437_SHEEP_TERRITORY_CAPTURE_START' in text
          print('SE437_SEAL_RECEIPT',len(b),hashlib.sha256(b).hexdigest(),flush=True)
          PY
