name: Deploy §C atomic revision-first Redis optimization
on:
  push:
    branches: [feature/swrlz-valkey-traffic-and-code-finish]
    paths:
      - "scripts/hf_revision_first_release.py"
      - ".github/workflows/hf-revision-first-release.yml"
permissions: {contents: read}
concurrency:
  group: swrlz-hf-space-deployment
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install 'huggingface_hub>=0.34,<2'
      - name: Compile and source-test patch without touching data
        run: python -m py_compile scripts/hf_revision_first_release.py
      - name: Snapshot exact live files and run deterministic regression tests
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u scripts/hf_revision_first_release.py preflight
      - uses: actions/upload-artifact@v4
        with:
          name: swrlz-revision-first-previous-live-source
          path: swrlz-revision-first-original/
          retention-days: 90
          if-no-files-found: error
      - name: Publish exact additive source changes
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u scripts/hf_revision_first_release.py publish
