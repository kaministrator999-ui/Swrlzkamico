name: Release §C loaded repair runtime and isolate HTML handoff v7
on:
  pull_request:
    paths:
      - 'scripts/hf_chat_repair_runtime_sync_release_v7.py'
      - 'tests/test_hf_repair_runtime_execution_v7.py'
      - '.github/workflows/hf-chat-repair-runtime-v7.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/hf_chat_repair_runtime_sync_release_v7.py'
      - '.github/workflows/hf-chat-repair-runtime-v7.yml'
permissions: {contents: read}
concurrency:
  group: swrlz-chat-repair-runtime-v7
  cancel-in-progress: false
jobs:
  validate-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Test bytecode, module reload, and existing-project handoff isolation
        run: |
          python -m pip install --quiet 'requests>=2.31,<3'
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/api"
          echo "PYTHONPATH=$PYTHONPATH" >> "$GITHUB_ENV"
          python -m py_compile scripts/hf_chat_repair_runtime_sync_release_v7.py
          python -m unittest discover -s tests -p 'test_hf_repair_runtime_execution_v7.py' -v
          python -m unittest discover -s tests -p 'test_html_project_agent_runtime_v1.py' -v
          python -m unittest discover -s tests -p 'test_station_existing_repair_precedence_v5.py' -v
          python scripts/hf_chat_repair_runtime_sync_release_v7.py selftest
      - name: Install Hugging Face client
        run: python -m pip install --quiet 'huggingface_hub>=0.34,<2'
      - name: Verify exact deployed Station and repair helper source
        run: python -u scripts/hf_chat_repair_runtime_sync_release_v7.py preflight
      - name: CAS publish guarded fix to Hugging Face
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[release-chat-repair-runtime-v7]') }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SWRLZ_REPAIR_RUNTIME_V7_APPROVED: '1'
        run: python -u scripts/hf_chat_repair_runtime_sync_release_v7.py publish
      - name: Verify loaded Python bytecode on the live Space
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[release-chat-repair-runtime-v7]') }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u scripts/hf_chat_repair_runtime_sync_release_v7.py verify
