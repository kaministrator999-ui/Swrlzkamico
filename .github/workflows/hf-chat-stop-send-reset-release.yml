name: Deploy §C Stop-to-Send terminal UI correction to Hugging Face
on:
  push:
    branches: [main]
    paths:
      - ".deploy/HF_CHAT_STOP_SEND_RESET_REQUEST.txt"
permissions: {contents: read}
concurrency:
  group: swrlz-hf-space-deployment
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - name: Verify precise owner-approved hotfix scope
        shell: bash
        run: |
          set -euo pipefail
          f=.deploy/HF_CHAT_STOP_SEND_RESET_REQUEST.txt
          test "$(sed -n 's/^TARGET=//p' "$f")" = "kamiloki/Swyrlz"
          test "$(sed -n 's/^APPROVED=//p' "$f")" = "1"
          test "$(sed -n 's/^CHANGE_SCOPE=//p' "$f")" = "stop-button-send-terminal-reconcile-only"
          test "$(sed -n 's/^NONCE=//p' "$f")" = "stop-to-send-on-cancel-20261114-v1"
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: python -m pip install --quiet "huggingface_hub>=0.34,<2"
      - name: Preflight current live Chat UI and true STOP/CANCELLED transitions
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m py_compile scripts/hf_chat_stop_button_reset_v1.py
          python -u scripts/hf_chat_stop_button_reset_v1.py preflight
      - uses: actions/upload-artifact@v4
        with:
          name: swrlz-stop-send-exact-prior-chat-source
          path: swrlz-stop-send-previous/
          retention-days: 14
          if-no-files-found: error
      - name: Publish one-file live UI correction and rollback on failed verification
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SWRLZ_STOP_SEND_DEPLOY_APPROVED: "1"
        run: |
          python -u scripts/hf_chat_stop_button_reset_v1.py publish
          echo "SWRLZ_STOP_SEND_LIVE_VERIFIED"
