name: §E v11.198 one-time browser boot, editor and Sheep smoke
on:
  push:
    branches: [feature/quest-spatial-editor-flight-gizmo-v11-198]
    paths: [".github/workflows/verify-v11-198-browser-once.yml"]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Rebuild exact release and install Chrome automation
        run: |
          python projects/swrlz-forge-moba/scripts/verify_v11_198_release.py --output dist/quest198 >/tmp/quest198-source.log
          python -m pip install --quiet "playwright>=1.50,<2"
          which google-chrome || which google-chrome-stable || which chromium
      - name: Verify normal editor startup and game Play/Stop unaffected
        run: |
          python -m http.server 8765 --directory dist/quest198 >/tmp/se198-http.log 2>&1 &
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,channel='chrome',args=[
                  '--no-sandbox','--disable-dev-shm-usage','--use-gl=angle',
                  '--use-angle=swiftshader','--enable-webgl','--enable-unsafe-swiftshader'])
              page=browser.new_page(viewport={'width':1280,'height':780})
              errors=[]
              page.on('pageerror',lambda err:errors.append(str(err)))
              page.goto('http://127.0.0.1:8765/index.html?project=sheep-tag-meadow',
                        wait_until='domcontentloaded',timeout=120000)
              page.wait_for_function("""() => !!window.SWYRL_ENGINE_XR_EDITOR_198 &&
                !!window.SWYRL_ENGINE_LEVELS &&
                window.SWYRL_ENGINE_LEVELS.status().levels>=2""",timeout=90000)
              diagnostics=page.evaluate('window.SWYRL_ENGINE_XR_EDITOR_198.diagnose()')
              assert not diagnostics['editor'],'without Quest session should remain flat editor'
              assert diagnostics['flySpeed']>0
              assert page.evaluate('window.SWYRL_ENGINE_XR_EDITOR_198.showLegend()') is False
              assert page.evaluate("window.SWYRL_ENGINE_LEVELS.status().active")=='menu'
              print('QUEST198_BROWSER_BOOT_PASS',diagnostics,flush=True)
              page.evaluate("document.getElementById('playBtn').click()")
              page.wait_for_function("window.SWYRL_ENGINE_LEVELS.status().menuPlaying",timeout=45000)
              page.evaluate("document.getElementById('st141StartGame').click()")
              page.wait_for_function("window.SWYRL_ENGINE_SHEEP_TAG.status().active",timeout=45000)
              assert len(page.evaluate("window.SWYRL_ENGINE_SHEEP_TAG.status().units"))>=2
              page.evaluate("document.getElementById('stopBtn').click()")
              page.wait_for_function("!window.SWYRL_ENGINE_SHEEP_TAG.status().active",timeout=45000)
              problems=[x for x in errors if any(w in x.lower() for w in ['se198','xr_editor','sheep','level'])]
              assert not problems,'relevant JavaScript errors '+repr(problems)
              print('QUEST198_BROWSER_GAME_AND_STOP_PASS',flush=True)
              browser.close()
          PY
