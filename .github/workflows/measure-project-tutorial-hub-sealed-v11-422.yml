name: Measure sealed §E v11.422 Projects Tutorials recovery
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/measure-project-tutorial-hub-sealed-v11-422.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Measure final 403-patch source and test repaired native hub
        run: |
          python - <<'PY'
          import pathlib,json,base64,gzip,hashlib,importlib.util,subprocess,sys,tempfile
          root=pathlib.Path("projects/swrlz-forge-moba").resolve()
          m=json.loads((root/"source-manifest.json").read_text())
          assert m["name"]=="§wyrl§ Engine v11.422" and len(m["patches"])==403
          assert m["patches"][-1]=="patches/v11_422_project_tutorial_hub_recovery.py"
          raw=gzip.decompress(base64.b64decode("".join((root/n).read_text().strip() for n in m["chunks"])))
          assert len(raw)==m["baseBytes"] and hashlib.sha256(raw).hexdigest()==m["baseSha256"]
          html=raw.decode()
          for i,rel in enumerate(m["patches"]):
              spec=importlib.util.spec_from_file_location("release_"+str(i),root/rel)
              module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
              html=module.apply(html)
          data=html.encode("utf8")
          assert "SWYRL_ENGINE_PROJECT_TUTORIAL_HUB_422" in html
          assert "SWYRL_ENGINE_DEPLOY_MARKER: V11_422_PROJECT_TUTORIAL_HUB_RECOVERY" in html
          temp=pathlib.Path(tempfile.gettempdir())/"se422_sealed.html";temp.write_bytes(data)
          subprocess.run([sys.executable,str(root/"scripts/check_inline_js_syntax_v11_266.py"),str(temp)],check=True)
          subprocess.run(["node",str(root/"tests/project_tutorial_hub_recovery_v11_422.cjs")],check=True)
          print("TUTORIAL_HUB_422_SEALED_FINAL_BYTES="+str(len(data)))
          print("TUTORIAL_HUB_422_SEALED_FINAL_SHA256="+hashlib.sha256(data).hexdigest())
          print("TUTORIAL_HUB_422_SEALED_PATCHES="+str(len(m["patches"])))
          PY