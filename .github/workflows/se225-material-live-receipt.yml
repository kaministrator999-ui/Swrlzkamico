name: §E v11.225 hosted material studio receipt
on:
  push:
    branches: [feature/engine-v11-225-material-texture-tabs]
permissions: {contents: read}
jobs:
  read-only-hosted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Match material workspace served app source to sealed manifest
        run: |
          python projects/swrlz-forge-moba/scripts/verify_v11_225_release.py --output dist/se225
          python - <<'PY'
          import urllib.request,hashlib,json
          from pathlib import Path
          origin='https://kamiloki-swrlz-forge-moba.static.hf.space/'
          expected=Path('dist/se225/index.html').read_bytes()
          digest=hashlib.sha256(expected).hexdigest()
          with urllib.request.urlopen(origin+'SOURCE.json',timeout=45) as r:
           source=json.load(r)
          with urllib.request.urlopen(origin+'index.html',timeout=50) as r:
           served=r.read()
          print('SE225_HOST_VERSION',source.get('sourceVersion'),flush=True)
          print('SE225_HOST_BYTES',len(served),'EXPECTED',len(expected),flush=True)
          assert source['sourceVersion']=='§wyrl§ Engine v11.225'
          assert source['finalBytes']==len(expected)==7642539
          assert source['finalSha256']==digest=='7407ca6b520912437c280035c1f4258f5b1e7a8ab577f3701b855db26f7bf3a7'
          assert len(source['patches'])==257 and len(source['assets'])==68
          if served!=expected:
           prefix=0
           while prefix<min(len(served),len(expected)) and served[prefix]==expected[prefix]:
            prefix+=1
           extra=len(served)-len(expected)
           assert 0<extra<3000
           chunk=served[prefix:prefix+extra]
           assert served[prefix+extra:]==expected[prefix:],'Hosted application code differs'
           assert chunk.startswith(b'<script>window.huggingface='),'Unexpected served markup'
           print('SE225_HOST_INJECTION',extra,'at',prefix,flush=True)
          assert b'SWYRL_ENGINE_DEPLOY_MARKER: V11_225_MATERIAL_TEXTURE_STUDIO_TABS' in served
          assert b'window.SWYRL_ENGINE_MATERIALS=Object.freeze' in served
          assert b'window.SWYRL_ENGINE_STUDIOS=Object.freeze' in served
          print('SE225_LIVE_MATERIAL_STUDIO_VERIFIED',flush=True)
          PY
