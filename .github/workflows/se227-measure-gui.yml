name: Measure §E GUI/Menu candidate (one-off source build)
on:
  push:
    branches: [feature/game-gui-menu-subtab]
    paths:
      - ".github/workflows/se227-measure-gui.yml"
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest engine main (no publisher credentials)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Copy exact candidate source from isolated branch
        run: |
          git fetch origin feature/game-gui-menu-subtab:refs/remotes/origin/feature/game-gui-menu-subtab
          git checkout origin/feature/game-gui-menu-subtab -- \
            projects/swrlz-forge-moba/runtime/game_gui_menu_subtab_v11_227.js \
            projects/swrlz-forge-moba/runtime/game_gui_menu_subtab_v11_227.css \
            projects/swrlz-forge-moba/patches/v11_227_game_gui_menu_subtab.py \
            projects/swrlz-forge-moba/tests/game_gui_menu_subtab_v11_227.cjs
      - name: Measure actual 259-patch HTML without changing signed repository files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('projects/swrlz-forge-moba/source-manifest.json')
          m=json.loads(p.read_text())
          assert m['name']=='§wyrl§ Engine v11.226',m['name']
          assert len(m['patches'])==258
          assert m['patches'][-1]=='patches/v11_226_sheep_building_starters.py'
          m['name']='§wyrl§ Engine v11.227'
          m['finalArtifact']='swyrl_engine_v11_227.html'
          m['patches'].append('patches/v11_227_game_gui_menu_subtab.py')
          m['finalBytes']=0
          m['finalSha256']=''
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          PY
          node --check projects/swrlz-forge-moba/runtime/game_gui_menu_subtab_v11_227.js
          node projects/swrlz-forge-moba/tests/game_gui_menu_subtab_v11_227.cjs
          python projects/swrlz-forge-moba/build_space.py --output /tmp/se227-measure > /tmp/se227-build.log
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          b=Path('/tmp/se227-measure/index.html').read_bytes()
          assert b'SWYRL_ENGINE_DEPLOY_MARKER: V11_227_GAME_GUI_MENU_STUDIO' in b
          assert b'SWYRL_ENGINE_GUI_STUDIO' in b
          print('SEGUI_MEASURE_JSON='+json.dumps({'version':'v11.227','bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}),flush=True)
          PY
