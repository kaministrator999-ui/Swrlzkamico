name: Inspect live §C guided coding state transitions (read-only)
on:
  push:
    branches: [main]
    paths: [".github/workflows/hf-live-guidance-worker-audit.yml"]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: python -m pip install 'huggingface_hub>=0.34,<2'
      - run: |
          python - <<'PY'
          from pathlib import Path
          from huggingface_hub import HfApi,hf_hub_download
          repo="kamiloki/Swyrlz"
          rev=HfApi().repo_info(repo,repo_type="space").sha
          spans={
            "station.py":[(260,290),(690,760),(780,850),(880,950),(970,1055),(1080,1175),(1200,1240),(1975,2055),(2090,2145)],
            "chat/§wyrlz/index.html":[(3895,3985),(4380,4465),(4565,4665),(4720,4845)],
            "qwen_coder_engine.py":[(795,910),(915,935),(1175,1220),(1230,1280)],
          }
          print("LIVE_REVISION",rev,flush=True)
          for name,ranges in spans.items():
            ls=Path(hf_hub_download(repo,name,repo_type="space",revision=rev)).read_text().splitlines()
            for a,b in ranges:
              print("LIVE_SOURCE_SECTION",name,a,b,flush=True)
              for i in range(a-1,min(b,len(ls))):
                line=ls[i]
                if any(x in line for x in ("HF_TOKEN","SWRLZ_DIAGNOSTIC_GITHUB_TOKEN")):
                    continue
                print(f"LIVE_LINE {name}:{i+1}: {line[:420]}",flush=True)
          PY
