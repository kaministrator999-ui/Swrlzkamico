name: Prepare and seal §E v11.464 visual modeler polish
on:
  push:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/RELEASE_PREPARE_V11_464.json"
permissions:
  contents: write
  actions: write
concurrency:
  group: engine-v11-464-seal
  cancel-in-progress: false
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Build candidate and verify visual, selection, inspector and asset integrity
        run: python projects/swrlz-forge-moba/scripts/prepare_v11_464_release.py
      - name: Commit verified source seal, then separately request HF deployment
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/swrlz-forge-moba/source-manifest.json
          git commit -m "build(§E v11.464): seal native modeler visual polish source"
          git fetch origin main
          git rebase origin/main
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          export SOURCE_COMMIT
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path('projects/swrlz-forge-moba')
          m=json.loads((root/'source-manifest.json').read_text())
          assert m['name']=='§wyrl§ Engine v11.464' and len(m['patches'])==441
          req={
           'schema':'swrlz-forge-deploy-request-v1',
           'requestedBy':'ChatGPT (owner-approved)',
           'target':'kamiloki/swrlz-forge-moba',
           'releaseVersion':'v11.464',
           'deployMarker':'SWYRL_ENGINE_DEPLOY_MARKER: V11_464_MODEL_VISUAL_INSPECTOR',
           'reason':'Improve Solid/Material cavity depth, replace cloudy X-Ray with depth-correct wire overlay, strengthen component selection and add touch inspector Expand/Dock preserving camera, drag splitters, transforms, VR and native history; exact source tests passed and physical Android acceptance pending.',
           'sourceCommit':os.environ['SOURCE_COMMIT'],
           'sourceIntegritySha256':m['finalSha256']
          }
          (root/'DEPLOY_REQUEST.json').write_text(json.dumps(req,indent=2,ensure_ascii=False)+'\n')
          PY
          git add projects/swrlz-forge-moba/DEPLOY_REQUEST.json
          git commit -m "deploy(§E v11.464): request verified visual and inspector polish"
          git push origin HEAD:main
          gh workflow run deploy-swrlz-forge-moba.yml --ref main
