name: One-shot §E v11.334 photo hand and dorsal crystal seal
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-forge-v11-334-photo-crystal-seal.yml'
      - 'projects/swrlz-forge-moba/patches/v11_334_cliff_photo_dorsal_crystals.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build latest original atlas source with isolated crystal material
        run: |
          node --check projects/swrlz-forge-moba/runtime/cliff_hand_photo_crystal_v11_334.js
          python - <<'PY'
          import sys,json,hashlib,subprocess
          from pathlib import Path
          root=Path('projects/swrlz-forge-moba')
          m=json.loads((root/'source-manifest.json').read_text('utf8'))
          assert m['name']=='§wyrl§ Engine v11.334'
          assert len(m['patches'])==347
          assert m['patches'][-1]=='patches/v11_334_cliff_photo_dorsal_crystals.py'
          out=Path('/tmp/se334')
          subprocess.run([sys.executable,str(root/'build_space.py'),'--output',str(out)],check=True)
          raw=(out/'index.html').read_bytes()
          assert raw==(out/'modeler.html').read_bytes()
          html=raw.decode('utf8')
          for token in (
             'SWYRL_ENGINE_DEPLOY_MARKER: V11_334_PHOTO_DORSAL_CRYSTALS',
             "window.SWRLZ_FORGE_BUILD={version:'v11.334'",
             '<title>§wyrl§ Engine · Maker v11.334</title>',
             'function se334ReferenceHandField(math){',
             'function se334PaintCrystal(ctx,k){',
             'function se334DorsalOnlyCrystalMaterial(mat){',
             'vMapUv',
             'se334DorsalWeight = smoothstep(0.13, 0.67, -objectNormal.z);',
             'const hand=se334ReferenceHandField(math);',
             'return se334DorsalOnlyCrystalMaterial(mat);',
             'se332OverlayRockFractures(img,albedo);',
             "image.src=SE333_EMBEDDED_CLIFF_ATLAS;",
             "model.parts=[stone];model.meshGroups=[];"):
              assert token in html,token
          assert html.count(' se292DrawKnuckleColor(albedo);')==0
          assert " for(const type of ['normal','ao'])se292DrawKnuckleRelief(at(type).ctx,type);" not in html
          subprocess.run([sys.executable,str(root/'scripts/check_inline_js_syntax_v11_266.py'),str(out/'index.html')],check=True)
          subprocess.run(['node',str(root/'scripts/test_v11_332_cliff_fractures.cjs')],check=True)
          receipt=json.loads((out/'SOURCE.json').read_text('utf8'))
          assert len(receipt['assets'])==71
          print('SE334_SHA256='+hashlib.sha256(raw).hexdigest(),flush=True)
          print('SE334_BYTES='+str(len(raw)),flush=True)
          print('SE334_PATCHES=347',flush=True)
          print('SE334_ASSETS=71',flush=True)
          print('SE334_SOURCE_SEAL_PASS',flush=True)
          PY
      - name: Actual desktop and Android WebGL palmar/dorsal render test
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
          python projects/swrlz-forge-moba/scripts/inspect_cliff_live_render.py --package /tmp/se334 --block-atlas
