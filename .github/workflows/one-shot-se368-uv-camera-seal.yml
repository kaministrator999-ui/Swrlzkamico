name: One-shot §E v11.368 UV auto-orientation seal
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-se368-uv-camera-seal.yml"
      - "projects/swrlz-forge-moba/source-manifest.json"
permissions:
  contents: read
jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Verify UV math, preserve stone hands, measure source
        run: |
          node --check projects/swrlz-forge-moba/runtime/model_uv_art_marker_v11_366.js
          node projects/swrlz-forge-moba/scripts/test_v11_366_uv_marker.cjs
          node projects/swrlz-forge-moba/scripts/test_v11_367_full_rock_hand.cjs
          node projects/swrlz-forge-moba/scripts/test_v11_367_connected_cliff.cjs
          python projects/swrlz-forge-moba/build_space.py --output /tmp/se368-candidate
          python projects/swrlz-forge-moba/scripts/check_inline_js_syntax_v11_266.py /tmp/se368-candidate/index.html
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          p=Path('/tmp/se368-candidate/index.html')
          raw=p.read_bytes()
          for k in (b"window.SWRLZ_FORGE_BUILD={version:'v11.368'",b'se366AutoAlignCamera',
            b'se366CaptureSlide',b'se366AngleFromView',b'se367AnatomicalRockScene'):
              assert k in raw,k
          print('SE368_BYTES='+str(len(raw)),flush=True)
          print('SE368_SHA256='+sha256(raw).hexdigest(),flush=True)
          PY
