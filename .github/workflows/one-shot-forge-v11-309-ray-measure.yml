name: One-shot §E v11.309 Arcane ray source measurement
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-forge-v11-309-ray-measure.yml'
permissions:
  contents: read
jobs:
  focused-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Measure exact assembly and native ray regression
        run: |
          python - <<'PY'
          import json,hashlib,subprocess,sys
          from pathlib import Path
          root=Path('projects/swrlz-forge-moba')
          mpath=root/'source-manifest.json'
          m=json.loads(mpath.read_text('utf8'))
          assert m['name']=='§wyrl§ Engine v11.309'
          assert len(m['patches'])==340
          assert m['patches'][-1]=='patches/v11_309_arcane_native_ray_aim.py'
          m['finalBytes']=None;m['finalSha256']=None
          mpath.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n','utf8')
          subprocess.run([sys.executable,'-m','py_compile',
            str(root/'patches/v11_309_arcane_native_ray_aim.py')],check=True)
          subprocess.run(['node','--check',
            str(root/'runtime/arcane_ray_alignment_v11_309.js')],check=True)
          out=Path('/tmp/swrlz-v11-309')
          subprocess.run([sys.executable,str(root/'build_space.py'),'--output',str(out)],check=True)
          raw=(out/'index.html').read_bytes()
          assert raw==(out/'modeler.html').read_bytes()
          html=raw.decode('utf8')
          for key in ('SWYRL_ENGINE_DEPLOY_MARKER: V11_309_ARCANE_NATIVE_RAY_AIM',
            'function se309HideRayGraphics(record){','se309Rayless',
            "window.SWRLZ_FORGE_BUILD={version:'v11.309'"):
            if key=='se309Rayless':continue
            assert key in html,key
          assert html.count('renderer.setAnimationLoop(tick);')==1
          assert html.count('function se280Cast(side,record,key){')==1
          subprocess.run([sys.executable,str(root/'scripts/check_inline_js_syntax_v11_266.py'),
            str(out/'index.html')],check=True)
          subprocess.run(['node',str(root/'tests/arcane_native_ray_v11_309.cjs'),
            str(out/'index.html')],check=True)
          print('SE309_EXACT_MEASUREMENT='+json.dumps({
            'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),
            'patches':len(m['patches'])},sort_keys=True),flush=True)
          PY

# Focused rerun after robust runtime-source test extraction.
