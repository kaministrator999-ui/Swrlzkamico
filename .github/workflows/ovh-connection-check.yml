name: OVH connection check
on:
  workflow_dispatch:
permissions: {}
jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify restricted SSH connection
        shell: bash
        env:
          HOST: ${{ secrets.SWRLZ_SERVER_HOST }}
          LOGIN: ${{ secrets.SWRLZ_SERVER_USER }}
          SSH_KEY: ${{ secrets.SWRLZ_SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SWRLZ_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$LOGIN" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          test "$LOGIN" = swrlz-deploy
          umask 077
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT
          printf '%s\n' "$SSH_KEY" > "$d/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$d/known_hosts"
          unset SSH_KEY KNOWN_HOSTS
          ssh-keygen -y -f "$d/key" >/dev/null
          if ! ssh -F /dev/null -T -i "$d/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 \
            -o UserKnownHostsFile="$d/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 -o ClearAllForwardings=yes \
            "$LOGIN@$HOST" /usr/local/bin/swrlz-deploy-check > "$d/result"; then
            echo 'Restricted SSH connection failed.' >&2
            exit 1
          fi
          grep -Fxq SWRLZ_DEPLOY_ACCESS_OK "$d/result"
          echo 'SWRLZ_DEPLOY_ACCESS_OK'
