      - "projects/swrlz-forge-moba/patches/v9_4_socket_book_emergence.py"
      - "projects/swrlz-forge-moba/patches/v9_5_staff_grip_fit.py"
      - "projects/swrlz-forge-moba/patches/v9_5_character_depth_sections.py"
      - "projects/swrlz-forge-moba/patches/v9_6_natural_staff_painted_faces.py"
      - "projects/swrlz-forge-moba/patches/v9_7_ornate_staff.py"
      - "projects/swrlz-forge-moba/patches/v9_8_full_length_staff.py"
      - "projects/swrlz-forge-moba/patches/v9_9_episode_shuttle.py"
      - "projects/swrlz-forge-moba/runtime/**"
      - "projects/swrlz-forge-moba/tests/episode_transport_playwright.mjs"
      - "projects/swrlz-forge-moba/assets/anime/**"
      - "projects/swrlz-forge-moba/scenes/ghosts-in-different-forms-ep01-storybook.swyrl.json"
      - "projects/swrlz-forge-moba/scenes/ghosts-in-different-forms-ep01-rigged.swyrl.json"
      - "projects/swrlz-forge-moba/scenes/ghosts-in-different-forms-ep01-depth.swyrl.json"
      - "projects/swrlz-forge-moba/scenes/ghosts-in-different-forms-ep01-positioned.swyrl.json"
      - "projects/swrlz-forge-moba/scenes/ghosts-in-different-forms-ep01-sockets.swyrl.json"
      - "projects/swrlz-forge-moba/scenes/ghosts-in-different-forms-ep01-staff-grip.swyrl.json"
      - "projects/swrlz-forge-moba/scenes/ghosts-in-different-forms-ep01-natural-grip.swyrl.json"
      - "projects/swrlz-forge-moba/scenes/ghosts-in-different-forms-ep01-full-staff.swyrl.json"
      - "projects/swrlz-forge-moba/build_space.py"
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct independent full-source candidate
        run: |
          python - <<'PY'
          import base64,gzip,json,hashlib
          from pathlib import Path
          import runpy
          root=Path('projects/swrlz-forge-moba')
          manifest=json.loads((root/'source-manifest.json').read_text())
          mod=runpy.run_path(str(root/'build_space.py'))
          raw=gzip.decompress(base64.b64decode(''.join((root/p).read_text().strip() for p in manifest['chunks'])))
          assert len(raw)==manifest['baseBytes'] and hashlib.sha256(raw).hexdigest()==manifest['baseSha256']
          s=raw.decode('utf-8')
          assert len(manifest['patches'])==87
          assert manifest['patches'][-1]=='patches/v11_17_hd_character_sculpt.py'
          for path in manifest['patches']:s=mod['load_patch'](root/path)(s)
          assert len(s.encode())==manifest['finalBytes']
          assert hashlib.sha256(s.encode()).hexdigest()==manifest['finalSha256']
          for feature in ('MODEL_ATELIER_V11_3_BEGIN','SWYRL_ENGINE_MODEL_ATELIER','V11_17_HD_CHARACTER_SCULPT','SWYRL_ENGINE_PERFORMANCE','anime-performance-v1','SWYRL_ENGINE_STORY_EFFECTS','anime-story-effects-v1','MAUL_BATCH_CORE','grouped-v1','MAUL_LAYOUT_CORE','classic-v2','SWYRL_ENGINE_MAUL','MAUL_CORE','maul-frostveil','SWYRL_ENGINE_SHEEP_TAG_RUNS','SWYRL_ENGINE_RUNS','stRunAfterTick','stRunInstallUI','stRunViewerMount','swyrl-editor-play-run-v1','stTouchPlacementScreen','stTouchPlacementGround','touchPlacement','SWYRL_ENGINE_SHEEP_TAG','sheep-tag-meadow','sheep-tag-moonbell-archive','swyrl-sheep-tag-map-v1','SWYRL_ENGINE_TRANSPORT','animeCineRewind','animeCineFastForward','SWYRL_ENGINE_STAFF','rigFullStaffStatus','painted-full-v1','assets/anime/kami-full-staff.png','SWYRL_ENGINE_RIG','SWYRL_ENGINE_SCENERY','SWYRL_ENGINE_SOCKETS','SWYRL_ENGINE_EMERGENCE','SWYRL_ENGINE_RELIEF',
                          'anime-rig-sockets-v1','anime-book-emergence-v1','anime-character-relief-v1','animeMakePaperBook','popLowStageTrim','animePopupStageSafety','popKamiArt',
                          'popSwyrlzArt','animePopSanitize','animeDirectorInstall',
                          'animePopUp','popupHinge','popUpStatus','animeUpdateCelLayers'):
              assert feature in s, feature
          out=Path('/tmp/storybook-test');out.mkdir(parents=True,exist_ok=True)
          (out/'index.html').write_text(s,encoding='utf-8')
          (out/'module.mjs').write_text(s[s.index('<script type="module">')+len('<script type="module">'):s.rindex('</script>')],encoding='utf-8')
          print('STAGING_EXPECTED_BYTES='+str(len(s.encode())))
          print('STAGING_EXPECTED_SHA256='+hashlib.sha256(s.encode()).hexdigest())
          print('STAGING_RECONSTRUCT_OK')
          PY
          node --check /tmp/storybook-test/module.mjs
          python -m py_compile projects/swrlz-forge-moba/patches/v8_9_cinematic_staging.py
          python projects/swrlz-forge-moba/build_space.py --output /tmp/storybook-package
          cmp /tmp/storybook-test/index.html /tmp/storybook-package/index.html
          python projects/swrlz-forge-moba/tests/maul_layout_package.py --package /tmp/storybook-package
          python projects/swrlz-forge-moba/tests/maul_batch_package.py --package /tmp/storybook-package
          python projects/swrlz-forge-moba/tests/episode_performance_package.py --package /tmp/storybook-package
      - name: Install Chromium and Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run actual desktop and mobile director/cel/project export acceptance
        run: |
          python -m http.server 8765 --directory /tmp/storybook-package >/tmp/storybook-test-server.log 2>&1 &
          SWYRL_TEST_SERVER_PID=$!
          trap 'kill "$SWYRL_TEST_SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..10}; do
            if curl -fsS http://127.0.0.1:8765/SOURCE.json >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/SOURCE.json >/dev/null
          SWYRL_ANIME_TEST_URL=http://127.0.0.1:8765 node projects/swrlz-forge-moba/tests/native_anime_playwright.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anime-popup-book-browser-debug
          path: native-anime-*.png
          retention-days: 5
