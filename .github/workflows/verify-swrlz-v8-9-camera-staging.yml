      - "projects/swrlz-forge-moba/tests/maul_cpu.mjs"
      - "projects/swrlz-forge-moba/runtime/sheep_touch_selection.js"
      - "projects/swrlz-forge-moba/runtime/sheep_placement_grid.js"
      - "projects/swrlz-forge-moba/runtime/sheep_touch_offset.js"
      - "projects/swrlz-forge-moba/runtime/sheep_lanes.js"
      - "projects/swrlz-forge-moba/runtime/sheep_run_recorder.js"
      - "projects/swrlz-forge-moba/runtime/sheep_run_review.js"
      - "projects/swrlz-forge-moba/tests/sheep_run_playwright.mjs"
      - "projects/swrlz-forge-moba/tests/sheep_touch_playwright.mjs"
      - "projects/swrlz-forge-moba/patches/v9_0_animation_studio.py"
      - "projects/swrlz-forge-moba/patches/v9_1_character_rigs.py"
      - "projects/swrlz-forge-moba/patches/v9_2_depth_theatre.py"
