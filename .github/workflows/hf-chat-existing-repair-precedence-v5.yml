name: Release §C existing GitHub project repair before new HTML
on:
  pull_request:
    paths:
      - 'scripts/hf_chat_station_existing_repair_precedence_v5.py'
      - 'tests/test_station_existing_repair_precedence_v5.py'
      - '.github/workflows/hf-chat-existing-repair-precedence-v5.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/hf_chat_station_existing_repair_precedence_v5.py'
      - '.github/workflows/hf-chat-existing-repair-precedence-v5.yml'
permissions: {contents: read}
concurrency:
  group: swrlz-hf-station-existing-repair-v5
  cancel-in-progress: false
jobs:
  validate-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Test actual precedence with exact reported prompt and source failures
        run: |
          python -m pip install --quiet 'requests>=2.31,<3'
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/api"
          python -m py_compile scripts/hf_chat_station_existing_repair_precedence_v5.py
          python -m unittest discover -s tests -p 'test_station_existing_repair_precedence_v5.py' -v
          python -m unittest discover -s tests -p 'test_html_project_context_v1.py' -v
          python -m unittest discover -s tests -p 'test_html_project_repair_v1.py' -v
          python scripts/hf_chat_station_existing_repair_precedence_v5.py selftest
      - name: Install public Hugging Face source reader
        run: python -m pip install --quiet 'huggingface_hub>=0.34,<2'
      - name: Preflight actual deployed Station source and exact scoped diff
        run: python -u scripts/hf_chat_station_existing_repair_precedence_v5.py preflight
      - name: CAS-publish existing project routing fix to Hugging Face
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[release-chat-existing-repair-v5]') }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SWRLZ_STATION_REPAIR_V5_APPROVED: '1'
        run: python -u scripts/hf_chat_station_existing_repair_precedence_v5.py publish
      - name: Independently verify exact source and new-version live route health
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[release-chat-existing-repair-v5]') }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u scripts/hf_chat_station_existing_repair_precedence_v5.py verify
