name: §E v11.133 sealed Android rapid button and sheep hologram
on:
  push:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/scripts/verify_v11_133_release.py"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install DOM touch event test harness
        run: npm install --prefix /tmp/se133-test --no-audit --no-fund jsdom@25.0.1
      - name: Verify exact 165-patch release and 68 bundled assets
        run: |
          python projects/swrlz-forge-moba/scripts/verify_v11_133_release.py --output /tmp/se133-release
          node --check /tmp/se133-release-module.mjs
      - name: Verify native Android touch click, house hologram and Rapid UI
        env:
          SE_JSDOM_MODULE: /tmp/se133-test/node_modules/jsdom
          SE_ASSEMBLED_HTML: /tmp/se133-release/index.html
        run: node projects/swrlz-forge-moba/tests/rapid_click_sheep_ghost_v11_133.mjs
