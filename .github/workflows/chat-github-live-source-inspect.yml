name: Inspect exact live §C GitHub routing

on:
  push:
    branches:
      - feature/chat-github-live-integration-v1
    paths:
      - '.github/workflows/chat-github-live-source-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet 'huggingface_hub>=0.34,<2'
      - name: Inspect current HF source without editing it
        run: |
          python - <<'PY'
          import hashlib,re
          from pathlib import Path
          from huggingface_hub import HfApi,hf_hub_download
          repo='kamiloki/Swyrlz'
          api=HfApi()
          sha=api.repo_info(repo,repo_type='space').sha
          files=api.list_repo_files(repo,repo_type='space',revision=sha)
          print('LIVE_REVISION',sha,flush=True)
          for term in ('station.py','github_connection.py','github_conversation_actions','github_general_create','chat/§wyrlz/index.html'):
            hits=[p for p in files if p.endswith(term)]
            print('FILE',term,hits,flush=True)
            for p in hits[:2]:
              source=Path(hf_hub_download(repo,p,repo_type='space',revision=sha)).read_text()
              print('DETAIL',p,'bytes',len(source.encode()),'sha256',hashlib.sha256(source.encode()).hexdigest(),flush=True)
              for needle in ('githubChatFileAction','github_chat_files','GITHUB_CAPABILITY_STAGE','github-change-review','github-review-card','_READ_STAGE_DESCRIPTION','public-write','github-general-create','github_general_create','/api/github/start','commitDraftFromPrompt','/api/github/'):
                matches=list(re.finditer(re.escape(needle),source))
                if matches:
                  print('MARKER',p,needle,'count',len(matches),'first',matches[0].start(),flush=True)
              if p.endswith('github_connection.py'):
                for line in source.splitlines():
                  if line.startswith(('GITHUB_CAPABILITY_STAGE =','GITHUB_SCOPE =','_READ_STAGE_DESCRIPTION =','def _stage_blocks','def start(')):
                    print('CONFIG',line[:180],flush=True)
          PY
      - name: Locate live GitHub implementation and UI insertion points
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from huggingface_hub import HfApi,hf_hub_download
          repo='kamiloki/Swyrlz';api=HfApi();sha=api.repo_info(repo,repo_type='space').sha
          files=api.list_repo_files(repo,repo_type='space',revision=sha)
          print('GH_FILES',[p for p in files if 'github' in p.lower() and p.endswith('.py')][:45],flush=True)
          targets=('station.py','github_connection.py','github_conversation_actions_v264.py','github_general_create_v262.py','chat/§wyrlz/index.html')
          for p in targets:
            if p not in files:continue
            s=Path(hf_hub_download(repo,p,repo_type='space',revision=sha)).read_text()
            terms={'station.py':('github_chat_files.handle','githubChatFileAction','github_chat_files.has_pending','elif github_chat_files.is_file_action'),
                   'github_connection.py':('GITHUB_CAPABILITY_STAGE =','def _stage_blocks(','if GITHUB_CAPABILITY_STAGE != "read-repository":','def _authorize','def start('),
                   'github_conversation_actions_v264.py':('def handle(','def _prepare_create(','def _confirmation('),
                   'github_general_create_v262.py':('def _authorize(','def prepare(','def confirm('),
                   'chat/§wyrlz/index.html':('widget.kind==="github-work"','function renderMessageWidgets','function commitDraftFromPrompt','if(widget.kind===','const github','/api/github/start')}[p]
            print('SOURCE',p,len(s),flush=True)
            for term in terms:
              pos=s.find(term)
              if pos<0:continue
              start=max(0,pos-280);end=min(len(s),pos+(2200 if term in ('def handle(','def _prepare_create(','def _stage_blocks(','if(widget.kind===') else 580))
              print('FRAGMENT',p,term,repr(s[start:end]),flush=True)
          PY
