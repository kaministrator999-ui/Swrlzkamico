name: Prepare and seal §E v11.447 smooth face viewport orbit
on:
  push:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/RELEASE_PREPARE_V11_447.json"

permissions:
  contents: write
  actions: write

concurrency:
  group: engine-v11-447-seal
  cancel-in-progress: false

jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout governed engine source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build, seal, and run focused verification
        run: python projects/swrlz-forge-moba/scripts/prepare_v11_447_release.py
      - name: Commit verified receipt, then separate deploy request
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/swrlz-forge-moba/source-manifest.json
          git commit -m "build(§E): seal verified v11.447 smooth face viewport orbit HTML receipt"
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          export SOURCE_COMMIT
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path('projects/swrlz-forge-moba')
          manifest=json.loads((root/'source-manifest.json').read_text())
          assert manifest['name']=='§wyrl§ Engine v11.447'
          request={
           'schema':'swrlz-forge-deploy-request-v1',
           'requestedBy':'ChatGPT (owner-approved)',
           'target':'kamiloki/swrlz-forge-moba',
           'releaseVersion':'v11.447',
           'deployMarker':'SWYRL_ENGINE_DEPLOY_MARKER: V11_447_SMOOTH_FACE_ORBIT',
           'reason':'Publish smooth per-frame camera orbit in Face mode and during Inset/Extrude topology preview, preserving touch inversion, two-finger navigation, geometry and Undo. Source verified; physical phone acceptance pending.',
           'sourceCommit':os.environ['SOURCE_COMMIT'],
           'sourceIntegritySha256':manifest['finalSha256']
          }
          (root/'DEPLOY_REQUEST.json').write_text(json.dumps(request,indent=2,ensure_ascii=False)+'\n')
          PY
          git add projects/swrlz-forge-moba/DEPLOY_REQUEST.json
          git commit -m "deploy(§E): request verified v11.447 HF publication"
          git push origin HEAD:main
          gh workflow run deploy-swrlz-forge-moba.yml --ref main
