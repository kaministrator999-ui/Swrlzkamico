name: Snapshot deployed §C coder source for HTML quality diagnostics
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-hf-live-coder-snapshot.yml'
permissions: {contents: read}
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet 'huggingface_hub>=0.34,<2'
      - name: Fetch exact current source revision (read-only)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          from huggingface_hub import HfApi,hf_hub_download
          from pathlib import Path
          import os,json,hashlib
          repo='kamiloki/Swyrlz'
          api=HfApi(token=os.getenv('HF_TOKEN') or None)
          rev=api.repo_info(repo,repo_type='space').sha
          root=Path('reports/hf-live-coder-audit');root.mkdir(parents=True,exist_ok=True)
          manifest={'revision':rev,'files':{}}
          for filename in ['qwen_coder_engine.py','brain_programming.py','station.py','lfm2_700m_engine.py','model_router.py','app.py']:
              file=Path(hf_hub_download(repo,filename,repo_type='space',revision=rev,token=api.token))
              raw=file.read_bytes()
              (root/filename).write_bytes(raw)
              manifest['files'][filename]={'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
          (root/'manifest.json').write_text(json.dumps(manifest,indent=2))
          print('SNAPSHOT_REVISION',rev,'FILES',list(manifest['files']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hf-live-coder-audit-${{ github.run_id }}
          path: reports/hf-live-coder-audit/
          retention-days: 7
          if-no-files-found: error
