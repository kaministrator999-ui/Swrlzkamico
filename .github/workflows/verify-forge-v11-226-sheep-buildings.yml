name: Verify §E v11.226 sheep building starters
# Exact packaged v11.226 checksum, unchanged assets and five model meshes.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-forge-v11-226-sheep-buildings.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build sealed source, verify 68 packaged assets, test five native editable model scenes
        run: python projects/swrlz-forge-moba/scripts/verify_v11_226_sheep_buildings_release.py --output /tmp/se226-sheep
