name: Verify §E v11.420 sealed Sheep Tag VR menu release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-forge-v11-420-sheep-menu.yml'
      - 'projects/swrlz-forge-moba/scripts/verify_v11_420_release.py'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify exact sealed 401-patch engine, Quest radial actions, syntax and regressions
        run: python projects/swrlz-forge-moba/scripts/verify_v11_420_release.py --output /tmp/se420-verified
