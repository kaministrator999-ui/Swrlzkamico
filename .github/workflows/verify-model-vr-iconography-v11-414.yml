name: Verify §E v11.414 Model VR iconography
on:
  pull_request:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/patches/v11_414_model_vr_iconography.py"
      - "projects/swrlz-forge-moba/source-manifest.json"
      - "projects/swrlz-forge-moba/scripts/verify_v11_414_release.py"
      - "projects/swrlz-forge-moba/tests/test_model_vr_iconography_v11_414.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-vr-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify actual patched icon source and Node syntax
        run: python projects/swrlz-forge-moba/tests/test_model_vr_iconography_v11_414.py
      - name: Independently compute new HTML seal and compare source manifest
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,subprocess,sys
          root=pathlib.Path('projects/swrlz-forge-moba')
          p=root/'source-manifest.json'
          manifest=json.loads(p.read_text())
          want_sha=manifest['finalSha256'];want_bytes=manifest['finalBytes']
          manifest.update(finalSha256='',finalBytes=0)
          p.write_text(json.dumps(manifest,ensure_ascii=False))
          subprocess.run([sys.executable,str(root/'build_space.py'),'--output','/tmp/se414-source'],check=True)
          data=pathlib.Path('/tmp/se414-source/index.html').read_bytes()
          got_sha=hashlib.sha256(data).hexdigest();got_bytes=len(data)
          print(f'SE414_COMPUTED_BYTES={got_bytes}',flush=True)
          print(f'SE414_COMPUTED_SHA256={got_sha}',flush=True)
          if (want_sha,want_bytes)!=(got_sha,got_bytes):
              raise SystemExit('Update the versioned manifest with this computed seal, then rerun the PR check.')
          PY
      - name: Run source integrity and package verification
        run: python projects/swrlz-forge-moba/scripts/verify_v11_414_release.py --output dist/swrlz-forge-moba
