name: Guarded §C small HTML speed release with rollback
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hf-small-html-release.yml'
permissions: {contents: read}
concurrency:
  group: swrlz-chat-guest-eval
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install 'huggingface_hub>=0.34,<2' playwright==1.56.0
          python -m playwright install --with-deps chromium
      - run: python -m py_compile scripts/hf_small_html_output_budget_v1.py scripts/eval_chat_guest_suite.py
      - name: Verify exact current model source and output budget acceptance
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u scripts/hf_small_html_output_budget_v1.py preflight
      - name: Preserve exact model rollback source
        uses: actions/upload-artifact@v4
        with:
          name: short-html-source-backup-${{ github.run_id }}
          path: reports/swrlz-small-html-budget/
          retention-days: 90
          if-no-files-found: error
      - name: Publish the scoped small HTML budget
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SWRLZ_SMALL_HTML_APPROVED: '1'
        run: python -u scripts/hf_small_html_output_budget_v1.py publish
      - name: Wait for resident model ready status
        run: |
          python - <<'PY'
          import json,time,urllib.request
          url="https://kamiloki-swyrlz.hf.space/api/hf/qwen35-ready"
          for n in range(24):
              try:
                  with urllib.request.urlopen(url,timeout=15) as r: status=json.load(r)
                  if status.get("ready") is True:
                      print("SHORT_HTML_MODEL_READY",status.get("model"),flush=True);break
              except Exception:pass
              time.sleep(8)
          else:raise RuntimeError("Resident model not ready for test")
          PY
      - name: Test short HTML generation and complete follow-up using guest Chromium
        id: acceptance
        shell: bash
        env:
          SWRLZ_EVAL_BASE: https://kamiloki-swyrlz.hf.space
          SWRLZ_EVAL_MODEL: 700m
        run: |
          set -uo pipefail
          if python -u - <<'PY'
          import asyncio,sys
          import scripts.eval_chat_guest_suite as ev
          ev.CASES["2"]=[c for c in ev.CASES["2"] if c["id"]=="html-button-ui"]
          if len(ev.CASES["2"])!=1:raise RuntimeError("HTML regression fixture missing")
          sys.exit(asyncio.run(ev.main("live","2")))
          PY
          then status=0;else status=$?;fi
          echo "acceptance_exit=$status" >> "$GITHUB_OUTPUT"
          echo "SHORT_HTML_GUEST_ACCEPTANCE_EXIT=$status"
          exit 0
      - name: Preserve all HTML transcripts and validator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-html-live-acceptance-${{ github.run_id }}
          path: reports/chat-guest-eval/
          retention-days: 21
          if-no-files-found: ignore
      - name: Roll back HTML budget automatically if acceptance fails
        if: steps.acceptance.outputs.acceptance_exit == '1'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SWRLZ_SMALL_HTML_APPROVED: '1'
        run: python -u scripts/hf_small_html_output_budget_v1.py rollback
      - name: Require complete guest test acceptance
        if: steps.acceptance.outputs.acceptance_exit != '0'
        run: |
          echo "::warning::HTML compact budget failed acceptance; review rollback and test artifacts."
          exit 1
