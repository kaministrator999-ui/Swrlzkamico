name: Inspect §C coder validation and browser streaming integration
on:
  push:
    branches: [main]
    paths: [".github/workflows/hf-code-ui-validation-audit.yml"]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - run: python -m pip install 'huggingface_hub>=0.34,<2'
      - run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from huggingface_hub import HfApi,hf_hub_download
          S="kamiloki/Swyrlz";api=HfApi();rev=api.repo_info(S,repo_type="space").sha
          files=api.list_repo_files(S,repo_type="space",revision=rev)
          print("LIVE_UI_REV",rev,flush=True)
          print("LIVE_UI_FILES",json.dumps([f for f in files if f.endswith((".html",".js",".tsx",".jsx",".ts",".css",".py"))][:200]),flush=True)
          ranges={
            "qwen_coder_engine.py":[(650,750),(750,840),(840,905)],
            "station.py":[(1310,1352),(1510,1557)],
            "qwen35_single_runtime.py":[(32,78),(242,305)],
          }
          for name,rs in ranges.items():
              l=Path(hf_hub_download(S,name,repo_type="space",revision=rev)).read_text().splitlines()
              for a,b in rs:
                  print("LIVE_UI_RANGE",json.dumps({"file":name,"start":a,"end":min(b,len(l)),
                      "code":[str(i+1)+" "+l[i] for i in range(a-1,min(b,len(l)))]},ensure_ascii=False),flush=True)
          print("UI_AUDIT_COMPLETE",flush=True)
          PY
