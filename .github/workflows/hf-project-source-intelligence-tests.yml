name: Validate §C project-source style and dependency evidence
on:
  push:
    branches: [main]
    paths: [".github/workflows/hf-project-source-intelligence-tests.yml"]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Exact source import and bounded style-evidence regression
        run: |
          set -euo pipefail
          python -m py_compile scripts/project_source_intelligence_v1.py scripts/test_project_source_intelligence_v1.py
          python -m unittest discover -s scripts -p test_project_source_intelligence_v1.py -v
          echo "SWRLZ_PROJECT_SOURCE_INTELLIGENCE_PASS"
