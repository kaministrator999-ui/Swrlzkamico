name: Verify §E v11.21 vertex sphere brush on Codex head
on:
  push:
    branches: [feature/atelier-vertex-sphere-brush-v11-21]
    paths:
      - 'projects/swrlz-forge-moba/runtime/model_atelier_sculpt_brush_v11_21.js'
      - 'projects/swrlz-forge-moba/runtime/model_atelier_surface_targeting_v11_22.js'
      - 'projects/swrlz-forge-moba/runtime/model_atelier_surface_lasso_v11_22.js'
      - 'projects/swrlz-forge-moba/runtime/model_atelier_local_refinement_v11_23.js'
      - 'projects/swrlz-forge-moba/runtime/model_atelier_face_sheet_v11_23.js'
      - 'projects/swrlz-forge-moba/runtime/model_atelier_numeric_gizmos_v11_23.js'
      - 'projects/swrlz-forge-moba/runtime/model_atelier_face_volume_v11_23.js'
      - 'projects/swrlz-forge-moba/tests/model_atelier_numeric_groups_v11_23.mjs'
      - 'projects/swrlz-forge-moba/tests/model_atelier_numeric_groups_browser_v11_23.mjs'
      - 'projects/swrlz-forge-moba/tests/model_atelier_face_volume_v11_23.mjs'
      - 'projects/swrlz-forge-moba/tests/model_atelier_face_sheet_v11_23.mjs'
      - 'projects/swrlz-forge-moba/tests/model_atelier_face_sheet_browser_v11_23.mjs'
      - 'projects/swrlz-forge-moba/tests/model_atelier_refinement_browser_v11_23.mjs'
      - 'projects/swrlz-forge-moba/tests/model_atelier_local_refine_v11_23.mjs'
      - 'projects/swrlz-forge-moba/tests/model_atelier_lasso_v11_22.mjs'
      - 'projects/swrlz-forge-moba/tests/model_atelier_surface_targeting_v11_22.mjs'
      - 'projects/swrlz-forge-moba/runtime/model_atelier_viewport_v11_21.js'
      - 'projects/swrlz-forge-moba/runtime/model_atelier_reference_studio_v11_22.js'
      - 'projects/swrlz-forge-moba/tests/model_atelier_reference_studio_v11_22.mjs'
      - 'projects/swrlz-forge-moba/patches/v11_21_vertex_sphere_brush_preview.py'
      - 'projects/swrlz-forge-moba/tests/model_sculpt_brush_*v11_21.mjs'
      - 'projects/swrlz-forge-moba/tests/model_atelier_viewport_v11_21.mjs'
      - '.github/workflows/verify-engine-vertex-brush-v11-21.yml'
permissions:
  contents: read
concurrency:
  group: verify-vertex-sculpt-v1121
  cancel-in-progress: true
jobs:
  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build official v11.20 head and apply native sculpt extension
        run: |
          set -euo pipefail
          python projects/swrlz-forge-moba/build_space.py --output /tmp/vertex-sculpt-editor
          python - <<'PY'
          from pathlib import Path
          import runpy
          p=Path('/tmp/vertex-sculpt-editor/index.html')
          before=p.read_text()
          assert 'V11_20_ANATOMICAL_HEAD' in before
          after=runpy.run_path('projects/swrlz-forge-moba/patches/v11_21_vertex_sphere_brush_preview.py')['apply'](before)
          assert 'V11_21_VERTEX_SPHERE_BRUSH_PREVIEW' in after
          assert 'modelAtelierSculptBrushVertexToggle' in after
          p.write_text(after)
          Path('/tmp/v1121-sculpt.mjs').write_text(after.split('<script type="module">',1)[1].rsplit('</script>',1)[0])
          PY
          node --check /tmp/v1121-sculpt.mjs
      - name: Install browser and Three.js
        run: |
          npm install --no-save playwright@1.56.1 three@0.169.0
          npx playwright install --with-deps --only-shell chromium
      - name: Verify actual vertex geometry + desktop/mobile editor and persistence
        run: |
          set -euo pipefail
          node projects/swrlz-forge-moba/tests/model_sculpt_brush_cpu_v11_21.mjs
          node projects/swrlz-forge-moba/tests/model_atelier_surface_targeting_v11_22.mjs
          node projects/swrlz-forge-moba/tests/model_atelier_lasso_v11_22.mjs
          node projects/swrlz-forge-moba/tests/model_atelier_local_refine_v11_23.mjs
          node projects/swrlz-forge-moba/tests/model_atelier_face_sheet_v11_23.mjs
          node projects/swrlz-forge-moba/tests/model_atelier_numeric_groups_v11_23.mjs
          node projects/swrlz-forge-moba/tests/model_atelier_face_volume_v11_23.mjs
          python -m http.server 8787 --directory /tmp/vertex-sculpt-editor >/tmp/v1121-sculpt-http.log 2>&1 &
          HTTP_PID=$!
          trap 'kill "$HTTP_PID" 2>/dev/null || true' EXIT
          SWYRL_SCULPT_TEST_URL=http://127.0.0.1:8787 node projects/swrlz-forge-moba/tests/model_atelier_viewport_v11_21.mjs
          SWYRL_SCULPT_TEST_URL=http://127.0.0.1:8787 node projects/swrlz-forge-moba/tests/model_atelier_reference_studio_v11_22.mjs
          SWYRL_SCULPT_TEST_URL=http://127.0.0.1:8787 node projects/swrlz-forge-moba/tests/model_sculpt_brush_playwright_v11_21.mjs
          SWYRL_SCULPT_TEST_URL=http://127.0.0.1:8787 node projects/swrlz-forge-moba/tests/model_atelier_numeric_groups_browser_v11_23.mjs
          SWYRL_SCULPT_TEST_URL=http://127.0.0.1:8787 node projects/swrlz-forge-moba/tests/model_atelier_face_sheet_browser_v11_23.mjs
