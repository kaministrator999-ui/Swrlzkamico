name: Verify §E v11.414 native button guide
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-satchel-buttons-v11-414.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sealed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify sealed v11.414 package and button reference tests
        run: python projects/swrlz-forge-moba/scripts/verify_v11_414_release.py --output dist/swrlz-forge-moba
      - name: Preserve source receipt
        uses: actions/upload-artifact@v4
        with:
          name: swrlz-engine-v11-414-source
          path: dist/swrlz-forge-moba/SOURCE.json