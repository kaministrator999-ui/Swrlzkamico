name: §E v11.181 immersive WebXR candidate
on:
  push:
    branches: [feature/forge-v11-181-immersive-webxr-20261031]
    paths:
      - 'projects/swrlz-forge-moba/**'
      - '.github/workflows/forge-v11-181-webxr-inspect.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check XR module syntax and immutable native boundaries
        run: |
          node --check projects/swrlz-forge-moba/runtime/immersive_xr_gateway_v11_181.js
          node projects/swrlz-forge-moba/tests/test_v11_181_immersive_xr.cjs
          node projects/swrlz-forge-moba/tests/test_v11_181_xr_session_lifecycle.cjs
      - name: Rebuild candidate and measure exact source
        run: |
          python - <<'PY'
          import json,pathlib
          f=pathlib.Path('projects/swrlz-forge-moba/source-manifest.json')
          m=json.loads(f.read_text())
          assert m['name']=='§wyrl§ Engine v11.181'
          assert len(m['patches'])==213 and m['patches'][-1]=='patches/v11_181_immersive_xr_gateway.py'
          m['finalBytes']=0;m['finalSha256']=''
          f.write_text(json.dumps(m,ensure_ascii=False))
          PY
          python projects/swrlz-forge-moba/build_space.py --output /tmp/forge181
          python - <<'PY'
          import hashlib,pathlib,json
          raw=pathlib.Path('/tmp/forge181/index.html').read_bytes()
          source=raw.decode('utf-8')
          assert source.count('renderer.setAnimationLoop(tick);')==1
          assert source.count('function se181XREnter()')==1
          assert 'se181XRRender();renderer.render(scene,camera);' in source
          assert 'SWYRL_ENGINE_DEPLOY_MARKER: V11_181_IMMERSIVE_WEBXR_GATE' in source
          print('XR_GATEWAY_MEASURED',json.dumps({'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}))
          PY
