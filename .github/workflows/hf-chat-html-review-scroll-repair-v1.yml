name: Repair §C HTML approval cards, expiry and reading-position scrolling
on:
  push:
    branches: [main]
    paths:
      - scripts/hf_chat_html_review_scroll_repair_v1.py
      - api/github_html_project_handoff_v1.py
      - tests/test_github_html_project_handoff_v1.py
      - .github/workflows/hf-chat-html-review-scroll-repair-v1.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: swrlz-hf-space-deployment
  cancel-in-progress: false
jobs:
  repair:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release-html-review-scroll-fix-v1]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install Hugging Face publishing dependencies
        run: python -m pip install --quiet 'huggingface_hub>=0.34,<2' 'requests>=2.31,<3'
      - name: Verify review expiry and repair source
        run: |
          python -m py_compile scripts/hf_chat_html_review_scroll_repair_v1.py api/github_html_project_handoff_v1.py
          python -m unittest discover -s tests -p 'test_github_html_project_handoff_v1.py' -v
          python scripts/hf_chat_html_review_scroll_repair_v1.py selftest
      - name: Verify exact live integration anchors and syntax before publish
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u scripts/hf_chat_html_review_scroll_repair_v1.py preflight
      - name: Commit exact reviewed live change, validate and serve
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SWRLZ_HTML_REVIEW_SCROLL_APPROVED: '1'
        run: python -u scripts/hf_chat_html_review_scroll_repair_v1.py publish
