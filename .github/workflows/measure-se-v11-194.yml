name: §E v11.194 Emberfall native ARPG and XR fast checks
on:
  push:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/source-manifest.json"
      - "projects/swrlz-forge-moba/patches/v11_194_emberfall_arpg_starter.py"
      - "projects/swrlz-forge-moba/runtime/emberfall_arpg_v11_194.js"
      - "projects/swrlz-forge-moba/runtime/emberfall_arpg_v11_194.css"
      - "projects/swrlz-forge-moba/tests/test_v11_194_emberfall_arpg.cjs"
      - "projects/swrlz-forge-moba/scripts/verify_v11_194_release.py"
      - ".github/workflows/measure-se-v11-194.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Native ARPG, Quest controller and session regression
        run: |
          python -m py_compile projects/swrlz-forge-moba/patches/v11_194_emberfall_arpg_starter.py
          node --check projects/swrlz-forge-moba/runtime/emberfall_arpg_v11_194.js
          node projects/swrlz-forge-moba/tests/test_v11_194_emberfall_arpg.cjs
          node projects/swrlz-forge-moba/tests/test_v11_193_sheep_vr.cjs
          node projects/swrlz-forge-moba/tests/test_v11_192_native_vr_editor.cjs
          node projects/swrlz-forge-moba/tests/test_v11_191_xr_recovery.cjs
          node projects/swrlz-forge-moba/tests/test_v11_181_xr_session_lifecycle.cjs
      - name: Strict v11.194 HTML asset and source manifest integrity
        run: python projects/swrlz-forge-moba/scripts/verify_v11_194_release.py --output /tmp/se194-strict
