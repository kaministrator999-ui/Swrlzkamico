name: §E v11.198 Quest spatial editor and regression
on:
  push:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/source-manifest.json"
      - "projects/swrlz-forge-moba/patches/v11_198_xr_editor_flight_gizmo_legend.py"
      - "projects/swrlz-forge-moba/runtime/engine_xr_editor_controls_v11_198.js"
      - "projects/swrlz-forge-moba/tests/test_v11_198_editor_6dof_flight_gizmo.cjs"
      - "projects/swrlz-forge-moba/scripts/verify_v11_198_release.py"
      - ".github/workflows/measure-se-v11-198.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Quest VR editor, prior Sheep Tag and ARPG regression
        run: |
          node --check projects/swrlz-forge-moba/runtime/engine_xr_editor_controls_v11_198.js
          python -m py_compile projects/swrlz-forge-moba/patches/v11_198_xr_editor_flight_gizmo_legend.py
          node projects/swrlz-forge-moba/tests/test_v11_198_editor_6dof_flight_gizmo.cjs
          node projects/swrlz-forge-moba/tests/test_v11_197_sheep_visual_stability.cjs
          node projects/swrlz-forge-moba/tests/test_v11_196_quest_fog_menu.cjs
          node projects/swrlz-forge-moba/tests/test_v11_195_quest_stability.cjs
          node projects/swrlz-forge-moba/tests/test_v11_194_emberfall_arpg.cjs
          node projects/swrlz-forge-moba/tests/test_v11_193_sheep_vr.cjs
          node projects/swrlz-forge-moba/tests/test_v11_192_native_vr_editor.cjs
          node projects/swrlz-forge-moba/tests/test_v11_191_xr_recovery.cjs
          node projects/swrlz-forge-moba/tests/test_v11_181_xr_session_lifecycle.cjs
      - name: Full strict 230-patch source and packaged asset integrity
        run: python projects/swrlz-forge-moba/scripts/verify_v11_198_release.py --output /tmp/se198-strict
