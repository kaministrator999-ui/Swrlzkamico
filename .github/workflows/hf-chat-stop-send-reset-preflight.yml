name: Verify §C Stop-to-Send terminal state reconciliation
on:
  push:
    branches: [feature/chat-stop-button-reset-20261114]
    paths:
      - "scripts/hf_chat_stop_button_reset_v1.py"
      - ".github/workflows/hf-chat-stop-send-reset-preflight.yml"
permissions: {contents: read}
jobs:
  source-and-ui-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: python -m pip install --quiet "huggingface_hub>=0.34,<2"
      - name: Validate exact live Chat UI and seven Stop/Send transition cases
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m py_compile scripts/hf_chat_stop_button_reset_v1.py
          python -u scripts/hf_chat_stop_button_reset_v1.py preflight
