name: Chat Studio Commands v1 focused source check
on:
  push:
    branches:
      - feature/chat-forge-native-studio-v3-20261102
    paths:
      - .github/workflows/chat-studio-v1-focused.yml
      - hf_space/forge_studio_commands_v1.py
      - hf_space/forge_chat_actions.py
      - hf_space/brain_forge.py
      - hf_space/forge_design_preview_v1.py
      - hf_space/test_forge_studio_commands_v1.py
      - projects/swrlz-forge-moba/runtime/chat_account_panel_v1.js
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax only
        run: |
          python -m py_compile hf_space/forge_studio_commands_v1.py hf_space/forge_chat_actions.py hf_space/brain_forge.py hf_space/forge_design_preview_v1.py hf_space/forge_modeling_lessons.py hf_space/test_forge_studio_commands_v1.py
      - name: Studio authorization and frozen-preview contract (no live models)
        run: PYTHONPATH=hf_space python hf_space/test_forge_studio_commands_v1.py
      - name: Check host adapter JavaScript parse
        run: node --check projects/swrlz-forge-moba/runtime/chat_account_panel_v1.js
