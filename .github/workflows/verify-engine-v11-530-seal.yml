name: Verify and measure §E v11.530 candidate source
on:
  push:
    branches: [main]
    paths:
      - projects/swrlz-forge-moba/RELEASE_PREPARE_V11_530.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify the sealed source, XR regressions and static packaging
        run: |
          node --check projects/swrlz-forge-moba/runtime/model_vr_controller_palette_v11_530.js
          python -m py_compile projects/swrlz-forge-moba/patches/v11_530_quest_gizmo_controller_menu.py
          python projects/swrlz-forge-moba/scripts/verify_v11_530_release.py --output /tmp/se530-sealed
          python projects/swrlz-forge-moba/scripts/package_static_delivery_v11_530.py --output /tmp/se530-sealed
          node --check /tmp/se530-sealed/swrlz-engine-v11.530.js
          echo 'SE530_SEALED_RELEASE_AND_STATIC_DELIVERY_OK'
