name: Verify and measure §E v11.530 candidate source
on:
  push:
    branches: [main]
    paths:
      - projects/swrlz-forge-moba/RELEASE_PREPARE_V11_530.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify candidate source and print computed integrity
        run: |
          node --check projects/swrlz-forge-moba/runtime/model_vr_controller_palette_v11_530.js
          python -m py_compile projects/swrlz-forge-moba/patches/v11_530_quest_gizmo_controller_menu.py
          python - <<'PY'
          import hashlib,json,subprocess,sys
          from pathlib import Path
          root=Path("projects/swrlz-forge-moba")
          path=root/"source-manifest.json"
          manifest=json.loads(path.read_text(encoding="utf8"))
          assert manifest["name"]=="§wyrl§ Engine v11.530",manifest["name"]
          assert manifest["patches"][-1]=="patches/v11_530_quest_gizmo_controller_menu.py"
          # Only the working checkout is temporarily unsealed here. Do not
          # push a checksum until the entire real generated artifact is built.
          manifest["finalSha256"]=""
          manifest["finalBytes"]=0
          path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+"\n",encoding="utf8")
          subprocess.run([sys.executable,str(root/"build_space.py"),"--output","/tmp/swrlz-v11-530"],check=True)
          raw=Path("/tmp/swrlz-v11-530/index.html").read_bytes()
          assert raw==Path("/tmp/swrlz-v11-530/modeler.html").read_bytes()
          s=raw.decode("utf8")
          for token in ("V11_530_QUEST_GIZMO_CONTROLLER_MENU",
              "SE530_VR_CONTINUOUS_GIZMO_AND_CONTROLLER_PALETTE_END",
              "['sculpt-push','Push / Pull']",
              "controllerFollowMenu:true"):
              assert token in s,token
          print("SE530_FINAL_BYTES="+str(len(raw)),flush=True)
          print("SE530_FINAL_SHA256="+hashlib.sha256(raw).hexdigest(),flush=True)
          subprocess.run([sys.executable,str(root/"scripts/check_inline_js_syntax_v11_266.py"),
              "/tmp/swrlz-v11-530/index.html"],check=True)
          print("SE530_CANDIDATE_SYNTAX_OK",flush=True)
          PY
