name: Guarded §C functional webpage generation quality release
on:
  push:
    branches: [feature/swrlz-web-artifact-quality-v1]
    paths:
      - "scripts/hf_webpage_quality_release.py"
      - ".github/workflows/hf-webpage-quality-release.yml"
permissions: {contents: read}
concurrency:
  group: swrlz-hf-space-deployment
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install 'huggingface_hub>=0.34,<2'
      - name: Compile and test code policy and HTML output checks
        run: |
          python -m py_compile scripts/hf_webpage_quality_policy_v1.py scripts/hf_webpage_quality_release.py
          python -m unittest discover -s scripts -p 'test_hf_webpage_quality_policy_v1.py' -v
      - name: Snapshot and verify exact running §C coder source
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u scripts/hf_webpage_quality_release.py preflight
      - uses: actions/upload-artifact@v4
        with:
          name: swrlz-webpage-quality-original-coder-source
          path: swrlz-webpage-quality-source-backup/
          retention-days: 90
          if-no-files-found: error
      - name: Publish only responsive functional-page quality contract
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SWRLZ_WEB_QUALITY_APPROVAL: "webpage-html-generation-quality-only"
        timeout-minutes: 12
        run: python -u scripts/hf_webpage_quality_release.py publish
