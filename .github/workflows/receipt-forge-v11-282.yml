name: §E v11.282 sealed Rock Cliff Hand + native mesh check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/receipt-forge-v11-282.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sealed:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native 17-bone and full rock coverage generator smoke
        run: node projects/swrlz-forge-moba/scripts/smoke_v11_282_cliff_hand.js
      - name: Verify sealed HTML, 313 patches, asset checksums and inline script
        run: python projects/swrlz-forge-moba/scripts/verify_v11_282_release.py --output /tmp/se282-sealed
