name: Measure §E v11.65 mesh selection once
on:
  push:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/patches/v11_65_selection_mesh_gizmos.py"
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build and assert new native mesh tools
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,gzip,hashlib,importlib.util,json
          from pathlib import Path
          root=Path('projects/swrlz-forge-moba')
          mf=json.loads((root/'source-manifest.json').read_text())
          html=gzip.decompress(base64.b64decode(''.join((root/f).read_text().strip() for f in mf['chunks']))).decode()
          for n,rel in enumerate(mf['patches']+['patches/v11_65_selection_mesh_gizmos.py']):
              spec=importlib.util.spec_from_file_location('patch'+str(n),root/rel)
              mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
              html=mod.apply(html)
          data=html.encode()
          print('SWRLZ_V1165_FINAL_BYTES='+str(len(data)))
          print('SWRLZ_V1165_FINAL_SHA256='+hashlib.sha256(data).hexdigest())
          print('SWRLZ_V1165_PATCH_COUNT='+str(len(mf['patches'])+1))
          assert 'function atelierMeshGizmoDown(e)' in html
          assert 'function atelierMeshJoin()' in html
          assert 'function atelierMeshSetDensity(' in html
          assert 'function atelierMeshPrimitiveDensityGeometry(part)' in html
          assert 'SWYRL_ENGINE_DEPLOY_MARKER: V11_65_SELECTION_MESH_GIZMOS' in html
          assert '283' in (root/'README.md').read_text()
          module=html.split('<script type="module">',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/swyrl-v1165-module.mjs').write_text(module)
          PY
          node --check /tmp/swyrl-v1165-module.mjs
          echo SWRLZ_V1165_NATIVE_MESH_SYNTAX_PASS
