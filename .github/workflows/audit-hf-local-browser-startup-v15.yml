name: Audit §C browser startup and failed revision
on:
  pull_request:
    paths:
      - 'scripts/audit_hf_local_browser_startup_v15.py'
      - '.github/workflows/audit-hf-local-browser-startup-v15.yml'
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet 'huggingface_hub>=0.34,<2'
      - run: python -u scripts/audit_hf_local_browser_startup_v15.py
