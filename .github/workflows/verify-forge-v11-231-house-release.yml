name: Verify §E v11.231 Sheep Tag house camera release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-forge-v11-231-house-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-seal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm exact 263-patch artifact and all native house components
        run: python projects/swrlz-forge-moba/scripts/verify_v11_231_release.py --output /tmp/se231-house-sealed
