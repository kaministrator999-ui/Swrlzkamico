name: Measure §E v11.278 Quest metrics menu budget
on:
  push:
    branches: [fix/se278-quest-metrics-menu-frame-budget]
    paths:
      - "projects/swrlz-forge-moba/source-manifest.json"
      - "projects/swrlz-forge-moba/runtime/sheep_quest_menu_cadence_v11_278.js"
      - "projects/swrlz-forge-moba/patches/v11_278_quest_menu_cadence.py"
      - "projects/swrlz-forge-moba/scripts/verify_v11_278_release.py"
      - ".github/workflows/measure-se278-quest.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate added VR metrics runtime syntax
        run: node --check projects/swrlz-forge-moba/runtime/sheep_quest_menu_cadence_v11_278.js
      - name: Assemble exact §E source and measure HTML SHA256
        run: python projects/swrlz-forge-moba/build_space.py --output /tmp/se278-measure
      - name: Validate complete inline JavaScript
        run: python projects/swrlz-forge-moba/scripts/check_inline_js_syntax_v11_266.py /tmp/se278-measure/index.html
