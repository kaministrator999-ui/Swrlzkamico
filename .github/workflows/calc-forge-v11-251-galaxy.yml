name: §E v11.251 galaxy and curve integrity
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/calc-forge-v11-251-galaxy.yml'
      - 'projects/swrlz-forge-moba/scripts/calc_v11_251_galaxy_curves_integrity.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-source:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check changed modules
        run: |
          for f in \
            particle_curve_runtime_v11_251.js \
            particle_curve_editor_v11_251.js \
            particle_parameter_timeline_v11_251.js \
            astral_nebula_settings_v11_251.js \
            astral_nebula_filaments_v11_251.js \
            shared_editor_workstations_v11_251.js; do
            node --check "projects/swrlz-forge-moba/runtime/$f"
          done
          python -m py_compile projects/swrlz-forge-moba/patches/v11_251_unified_studios_galaxy_curves.py
      - name: Assemble all source patches and measure
        run: python3 projects/swrlz-forge-moba/scripts/calc_v11_251_galaxy_curves_integrity.py
