name: Purge Stale Vercel Deployments

on:
  workflow_dispatch:
    inputs:
      approved:
        description: "Delete every deployment for this project except the deployment currently serving the production hostname"
        required: true
        type: choice
        options: ["no", "yes"]
        default: "no"
  push:
    branches: [main]
    paths:
      - ".deploy/DELETE_STALE_VERCEL_DEPLOYMENTS.txt"

permissions:
  contents: read

concurrency:
  group: swrlz-vercel-deployment-purge
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_E4y2LpTSFo9UxTErO9aw6HW1
  VERCEL_PROJECT_ID: prj_dGgleDMgkOQ57wULKlDH5fcYj9Yp
  VERCEL_PRODUCTION_HOST: swrlzkamico-o3nu.vercel.app

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authorize destructive cleanup
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          allowed=no
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            allowed="${{ inputs.approved }}"
          else
            file=".deploy/DELETE_STALE_VERCEL_DEPLOYMENTS.txt"
            approved="$(grep '^APPROVED=' "$file" | tail -n1 | cut -d= -f2- || true)"
            if [[ "$approved" == "1" ]]; then
              allowed=yes
            fi
          fi
          if [[ "$allowed" != "yes" ]]; then
            echo "Cleanup not approved; exiting without mutation."
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: Verify Vercel token
        if: steps.gate.outputs.allowed == 'true'
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "VERCEL_TOKEN is required" >&2; exit 1; }

      - name: Set up Node.js for Vercel verifier
        if: steps.gate.outputs.allowed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI for project-scoped enumeration
        if: steps.gate.outputs.allowed == 'true'
        run: npm install --global vercel@latest

      - name: Purge every stale deployment, preserve current production
        if: steps.gate.outputs.allowed == 'true'
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $VERCEL_TOKEN")

          # Resolve the protected production deployment from the production alias.
          # This is the authoritative mapping; never guess from recency.
          alias_json="$(curl --fail-with-body --silent --show-error \
            "${auth[@]}" \
            "https://api.vercel.com/v4/aliases/$VERCEL_PRODUCTION_HOST?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID")"
          keep_id="$(jq -r '.deploymentId // .deployment.id // empty' <<<"$alias_json")"
          keep_url="$(jq -r '.deployment.url // empty' <<<"$alias_json")"
          resolved_project="$(jq -r '.projectId // empty' <<<"$alias_json")"
          if [[ "$resolved_project" != "$VERCEL_PROJECT_ID" || -z "$keep_id" || "$keep_id" != dpl_* ]]; then
            echo "Could not prove the production alias belongs to the canonical project; refusing destructive cleanup." >&2
            echo "$alias_json" | jq .
            exit 1
          fi

          # Link the checkout to the existing project. vercel pull MUST reuse the
          # supplied canonical project/org IDs; project creation is forbidden.
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN" >/dev/null

          enumerate() {
            vercel list swrlzkamico-o3nu --team kamiswrlzco-cloud --yes --token="$VERCEL_TOKEN" 2>&1 \
              | sed -r 's/\x1B\[[0-9;]*[mK]//g' \
              | grep -Eo 'https://[^[:space:]]+\.vercel\.app' \
              | sort -u || true
          }

          mapfile -t urls < <(enumerate)
          if [[ "${#urls[@]}" -eq 0 ]]; then
            echo "Project-scoped Vercel CLI enumeration returned no deployments; refusing to call cleanup verified." >&2
            exit 1
          fi

          # Resolve the protected deployment URL directly when the alias payload
          # omits it, while still pinning by deployment ID.
          if [[ -z "$keep_url" ]]; then
            keep_json="$(curl --fail-with-body --silent --show-error "${auth[@]}" \
              "https://api.vercel.com/v13/deployments/$keep_id?teamId=$VERCEL_ORG_ID")"
            keep_url="$(jq -r '.url // empty' <<<"$keep_json")"
          fi
          keep_full="https://$keep_url"
          if [[ -z "$keep_url" || ! " ${urls[*]} " =~ " $keep_full " ]]; then
            echo "Protected production deployment was not present in project-scoped CLI enumeration; refusing cleanup." >&2
            printf 'Protected: %s\nEnumerated: %s\n' "$keep_full" "${urls[*]:-none}" >&2
            exit 1
          fi

          echo "Current production deployment protected: $keep_id ($keep_full)"
          echo "### Vercel stale-deployment purge" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- Protected production deployment: `%s`\n' "$keep_id" >> "$GITHUB_STEP_SUMMARY"

          deleted=0
          failed=0
          for url in "${urls[@]}"; do
            [[ "$url" == "$keep_full" ]] && continue
            echo "Deleting stale deployment $url"
            if vercel remove "$url" --yes --team kamiswrlzco-cloud --token="$VERCEL_TOKEN"; then
              deleted=$((deleted+1))
              printf -- '- deleted `%s`\n' "$url" >> "$GITHUB_STEP_SUMMARY"
            else
              failed=$((failed+1))
              printf -- '- FAILED `%s`\n' "$url" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          mapfile -t remaining < <(enumerate)
          echo "- Deleted: $deleted" >> "$GITHUB_STEP_SUMMARY"
          echo "- Failed: $failed" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- Remaining deployment URLs: `%s`\n' "${remaining[*]:-none}" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi
          if [[ "${#remaining[@]}" -ne 1 || "${remaining[0]}" != "$keep_full" ]]; then
            echo "Cleanup incomplete: expected only $keep_full to remain, got: ${remaining[*]:-none}" >&2
            exit 1
          fi

          echo "Exactly one deployment remains, and it is the current production deployment."
