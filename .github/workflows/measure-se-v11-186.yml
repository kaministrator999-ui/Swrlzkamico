name: Measure and browser-check §E v11.186 first-paint splash
on:
  push:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/source-manifest.json"
      - "projects/swrlz-forge-moba/patches/v11_186_first_paint_wisp_boot.py"
      - "projects/swrlz-forge-moba/runtime/engine_boot_first_paint_v11_186.js"
      - "projects/swrlz-forge-moba/runtime/engine_boot_first_paint_v11_186.css"
      - "projects/swrlz-forge-moba/scripts/verify_v11_186_release.py"
      - "projects/swrlz-forge-moba/tests/ui_v11_186_first_paint.cjs"
      - ".github/workflows/measure-se-v11-186.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Parse new patch and independent startup handler
        run: |
          python -m py_compile projects/swrlz-forge-moba/patches/v11_186_first_paint_wisp_boot.py
          node --check projects/swrlz-forge-moba/runtime/engine_boot_first_paint_v11_186.js
          node --check projects/swrlz-forge-moba/tests/ui_v11_186_first_paint.cjs
      - name: Verify sealed source, all asset hashes, and startup markers
        run: python projects/swrlz-forge-moba/scripts/verify_v11_186_release.py --output /tmp/se186-strict
      - name: Measure exact rebuilt HTML and first-paint ordering
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          f=Path('projects/swrlz-forge-moba/source-manifest.json')
          m=json.loads(f.read_text())
          assert m['name']=='§wyrl§ Engine v11.186'
          assert len(m['patches'])==218 and m['patches'][-1]=='patches/v11_186_first_paint_wisp_boot.py'
          m['finalSha256']=''
          m['finalBytes']=0
          f.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          PY
          python projects/swrlz-forge-moba/build_space.py --output /tmp/se186-package > /tmp/se186-build.log
          python - <<'PY'
          from pathlib import Path
          import hashlib,re,json
          p=Path('/tmp/se186-package/index.html')
          s=p.read_text()
          assert s.find('data-se186-early="1"')<s.find('window.SWRLZ_FORGE_BUILD=')
          assert s.find('<script id="se186StartupBeforeEngine">')<s.find('window.SWRLZ_FORGE_BUILD=')
          assert s.count('id="se185Init"')==1
          assert s.count('--se185-radius-out:')>=32
          assert 'SWYRL_ENGINE_DEPLOY_MARKER: V11_186_FIRST_PAINT_WISP_BOOT' in s
          b=p.read_bytes()
          print('SE186_MEASURED_BYTES='+str(len(b)),flush=True)
          print('SE186_MEASURED_SHA256='+hashlib.sha256(b).hexdigest(),flush=True)
          PY
      - name: Install Chromium smoke runtime
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps --only-shell chromium
      - name: Prove particles visible before engine module, mobile and desktop
        run: node projects/swrlz-forge-moba/tests/ui_v11_186_first_paint.cjs
