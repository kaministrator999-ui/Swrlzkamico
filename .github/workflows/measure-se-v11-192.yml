name: §E v11.192 native VR editor fast checks
on:
  push:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/source-manifest.json"
      - "projects/swrlz-forge-moba/patches/v11_192_spatial_vr_editor.py"
      - "projects/swrlz-forge-moba/runtime/engine_xr_spatial_editor_v11_192.js"
      - "projects/swrlz-forge-moba/tests/test_v11_192_native_vr_editor.cjs"
      - "projects/swrlz-forge-moba/scripts/verify_v11_192_release.py"
      - ".github/workflows/measure-se-v11-192.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Native controller, grab-history and XR lifecycle unit tests (no browser)
        run: |
          python -m py_compile projects/swrlz-forge-moba/patches/v11_192_spatial_vr_editor.py
          node --check projects/swrlz-forge-moba/runtime/engine_xr_spatial_editor_v11_192.js
          node projects/swrlz-forge-moba/tests/test_v11_192_native_vr_editor.cjs
          node projects/swrlz-forge-moba/tests/test_v11_191_xr_recovery.cjs
          node projects/swrlz-forge-moba/tests/test_v11_181_xr_session_lifecycle.cjs
      - name: Reconstruct both editor routes and issue exact source hash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          f=Path('projects/swrlz-forge-moba/source-manifest.json')
          m=json.loads(f.read_text())
          assert m['name']=='§wyrl§ Engine v11.192'
          assert len(m['patches'])==224
          assert m['patches'][-1]=='patches/v11_192_spatial_vr_editor.py'
          m['finalBytes']=0;m['finalSha256']=''
          f.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          PY
          python projects/swrlz-forge-moba/build_space.py --output /tmp/se192-package >/tmp/se192-build.log
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=Path('/tmp/se192-package')
          a=(d/'index.html').read_bytes()
          b=(d/'modeler.html').read_bytes()
          assert a==b and len(a)>7000000
          s=a.decode('utf8')
          for key in [
             'SWYRL_ENGINE_DEPLOY_MARKER: V11_192_XR_SPATIAL_EDITOR',
             'window.SWYRL_ENGINE_VR_EDITOR',
             'se192VRFrame();renderer.render(scene,camera);',
             'se192VRCleanup();',
             'se192VRStart();',
             'se192XRGamepadButton',
             'se192Place(type,record)',
             'se192FreezeBillboards();',
             'se192TaperGeometry();',
             "se192Select(record);",
             "se191XRRayHit(record)",
             "renderer.setAnimationLoop(tick);"
          ]:assert key in s,key
          assert s.count('renderer.setAnimationLoop(tick);')==1
          receipt=json.loads((d/'SOURCE.json').read_text())
          assert len(receipt['assets'])==68
          print('SE192_MEASURED_BYTES='+str(len(a)),flush=True)
          print('SE192_MEASURED_SHA256='+hashlib.sha256(a).hexdigest(),flush=True)
          print('SE192_SOURCE_CHECK_PASS',flush=True)
          PY
