name: Read-only §C runtime health after Valkey probe
on:
  push:
    branches: [feature/aiven-valkey-storage-adapter]
    paths: ["scripts/hf_valkey_runtime_check.py",".github/workflows/hf-valkey-runtime-health.yml"]
permissions: {contents: read}
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install "huggingface_hub>=0.34,<2"
      - name: Check current Space stage and account-status HTTP status only
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u scripts/hf_valkey_runtime_check.py
