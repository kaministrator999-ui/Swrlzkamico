name: Measure §E v11.527 Draw menu
on:
  push:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/patches/v11_527_draw_menu_cleanup.py"
      - "projects/swrlz-forge-moba/scripts/measure_v11_527_source.py"
      - "projects/swrlz-forge-moba/source-manifest.json"
      - "projects/swrlz-forge-moba/tests/model_vr_draw_menu_v11_527.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python projects/swrlz-forge-moba/scripts/measure_v11_527_source.py
