name: §X browser diagnostics deploy
on:
  push:
    branches: [main, feat/swrlz-execution-v01]
    paths:
      - 'projects/swrlz-execution/**'
      - '.github/workflows/swrlz-execution-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: swrlz-execution-deploy
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/swrlz-execution-v01'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate diagnostic source
        run: |
          python -m py_compile projects/swrlz-execution/app.py
          python -m pip install --quiet 'huggingface_hub>=0.34,<2'
      - name: Publish only to §X and verify exact file contents
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -u - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi, CommitOperationAdd, hf_hub_download
          target = "kamiloki/swrlz-execution"
          names = ("app.py", "packages.txt", "requirements.txt")
          root = Path("projects/swrlz-execution")
          token = os.environ.get("HF_TOKEN")
          if not token:
              raise SystemExit("HF_TOKEN_MISSING")
          api = HfApi(token=token)
          info = api.repo_info(target, repo_type="space")
          assert info.id.lower() == target
          if not info.sha:
              raise SystemExit("TARGET_REVISION_MISSING")
          existing = set(api.list_repo_files(target, repo_type="space", revision=info.sha))
          same = all(name in existing and Path(hf_hub_download(target, name, repo_type="space", revision=info.sha, token=token)).read_bytes() == (root/name).read_bytes() for name in names)
          if same:
              revision = info.sha
              print("SOURCE_ALREADY_CURRENT")
          else:
              result = api.create_commit(repo_id=target, repo_type="space", revision="main", parent_commit=info.sha, operations=[CommitOperationAdd(path_in_repo=name, path_or_fileobj=root/name) for name in names], commit_message="Deploy §X fixed browser diagnostics from GitHub")
              revision = result.oid
          for name in names:
              actual = Path(hf_hub_download(target, name, repo_type="space", revision=revision, token=token)).read_bytes()
              if actual != (root/name).read_bytes():
                  raise SystemExit("READBACK_MISMATCH: " + name)
          print("HF_WRITE_AND_READBACK_PASS", target, revision)
          PY
      - name: Check Space runtime
        run: |
          python -u - <<'PY'
          import time
          from huggingface_hub import HfApi
          api = HfApi()
          target = "kamiloki/swrlz-execution"
          for _ in range(48):
              runtime = api.get_space_runtime(target)
              stage = str(runtime.stage)
              print("SPACE_STAGE", stage, flush=True)
              if stage in ("RUNNING", "RUNNING_BUILDING"):
                  if stage == "RUNNING":
                      break
              if stage in ("BUILD_ERROR", "RUNTIME_ERROR", "CONFIG_ERROR"):
                  raise SystemExit("SPACE_FAILURE: " + stage)
              time.sleep(10)
          else:
              raise SystemExit("SPACE_RUNTIME_NOT_CONFIRMED")
          PY
