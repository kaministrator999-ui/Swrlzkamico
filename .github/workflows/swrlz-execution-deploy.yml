name: §X signed diagnostics deploy
on:
  push:
    branches: [main, feat/swrlz-execution-v01]
    paths:
      - 'projects/swrlz-execution/**'
      - '.github/workflows/swrlz-execution-deploy.yml'
  pull_request:
    paths:
      - 'projects/swrlz-execution/**'
      - '.github/workflows/swrlz-execution-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: swrlz-execution-deploy
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet 'huggingface_hub>=0.34,<2' 'requests>=2.31,<3'
      - run: python projects/swrlz-execution/release_diagnostics_v1.py
  publish:
    needs: validate
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/swrlz-execution-v01')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet 'huggingface_hub>=0.34,<2' 'requests>=2.31,<3'
      - name: Deploy and prove §X then §C to §X
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u projects/swrlz-execution/release_diagnostics_v1.py publish
