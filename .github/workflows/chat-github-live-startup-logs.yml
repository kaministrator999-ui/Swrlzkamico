name: Diagnose live §C startup exception types
on:
  push:
    branches: [feature/chat-github-live-integration-v1]
    paths: ['.github/workflows/chat-github-live-startup-logs.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet 'huggingface_hub>=0.34,<2'
      - name: Summarize Space runtime errors without exposing private log data
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os,re,collections
          from huggingface_hub import HfApi,fetch_space_logs
          api=HfApi(token=os.environ.get('HF_TOKEN'))
          runtime=api.get_space_runtime('kamiloki/Swyrlz')
          print('SPACE_STAGE',runtime.stage,flush=True)
          for build in (False,True):
              try:
                  messages=collections.deque(fetch_space_logs('kamiloki/Swyrlz',build=build,follow=False,token=os.environ.get('HF_TOKEN')),maxlen=200)
                  names=collections.Counter()
                  for line in messages:
                      for kind in ('ModuleNotFoundError','ImportError','SyntaxError','IndentationError','AttributeError','RuntimeError','ValueError','NameError','Traceback','CUDA out of memory'):
                          if kind in line:names[kind]+=1
                  print('LOG_ERROR_CLASSES',('build' if build else 'run'),dict(names),flush=True)
                  for line in list(messages)[-35:]:
                      m=re.search(r"(ModuleNotFoundError|ImportError|SyntaxError|IndentationError|AttributeError|RuntimeError|ValueError|NameError): ([A-Za-z0-9_./\- ]{0,120})",line)
                      if m:print('EXCEPTION_SUMMARY',m.group(1),m.group(2),flush=True)
              except Exception as e:print('LOG_FETCH_UNAVAILABLE',('build' if build else 'run'),type(e).__name__,flush=True)
          PY
