name: Validate §wyrl§ Engine v7.1
on:
  push:
    branches: [main]
    paths: [".github/workflows/validate-swrlz-forge-v7-1.yml"]
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Reconstruct and validate breathing-room pass
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,gzip,hashlib,importlib.util,json
          from pathlib import Path
          root=Path("projects/swrlz-forge-moba");m=json.loads((root/"source-manifest.json").read_text())
          html=gzip.decompress(base64.b64decode("".join((root/p).read_text().strip() for p in m["chunks"]))).decode()
          for rel in m["patches"]:
              spec=importlib.util.spec_from_file_location("p",root/rel);mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod);html=mod.apply(html)
          b=html.encode();print("FINAL_BYTES="+str(len(b)));print("FINAL_SHA256="+hashlib.sha256(b).hexdigest())
          for x in ["V7_1_FRACTURE_FORGE_BREATHING_ROOM","makeGlitchDragonV3([25,0,11]","makeGlitchDragonV3([-27,0,-8]","makeGlitchDragonV3([22,0,-24]","makeDenStructure('arch',[0,0,27]","bottom:92px!important","button:last-child"]: assert x in html,x
          for x in ["makeGlitchDragonV3([17,0,8]","makeGlitchDragonV3([-18,0,-5]","makeGlitchDragonV3([14,0,-15]"]: assert x not in html,x
          start=html.index('<script type="module">')+len('<script type="module">');end=html.rindex('</script>');Path("/tmp/e.mjs").write_text(html[start:end])
          PY
          node --check /tmp/e.mjs
