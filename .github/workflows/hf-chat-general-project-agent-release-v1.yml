name: Release §C model-led existing project repair agent
on:
  pull_request:
    paths:
      - 'api/html_project_agent_v1.py'
      - 'api/html_project_agent_runtime_v1.py'
      - 'api/html_project_repair_v1.py'
      - 'scripts/project_code_targeted_repair_v1.py'
      - 'scripts/hf_chat_general_project_agent_release_v1.py'
      - 'tests/test_html_project_agent_v1.py'
      - 'tests/test_html_project_agent_runtime_v1.py'
      - '.github/workflows/hf-chat-general-project-agent-release-v1.yml'
  push:
    branches: [main]
    paths:
      - 'api/html_project_agent_v1.py'
      - 'api/html_project_agent_runtime_v1.py'
      - 'api/html_project_repair_v1.py'
      - 'scripts/hf_chat_general_project_agent_release_v1.py'
      - '.github/workflows/hf-chat-general-project-agent-release-v1.yml'
permissions: {contents: read}
concurrency:
  group: swrlz-general-html-repair-agent-space-deploy
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Code, model invocation, approval and source safety contract
        run: |
          python -m py_compile api/html_project_agent_v1.py api/html_project_agent_runtime_v1.py \
            api/html_project_repair_v1.py scripts/hf_chat_general_project_agent_release_v1.py \
            scripts/html_project_agent_pr_v1.py
          python -m unittest discover -s tests -p 'test_html_project_agent_v1.py' -v
          python -m unittest discover -s tests -p 'test_html_project_agent_runtime_v1.py' -v
          python -m unittest discover -s tests -p 'test_html_project_repair_v1.py' -v
          python scripts/hf_chat_general_project_agent_release_v1.py selftest
      - name: Install safe public Hugging Face source reader
        run: python -m pip install --quiet 'huggingface_hub>=0.34,<2'
      - name: Preflight exact production Station route without mutation
        run: python scripts/hf_chat_general_project_agent_release_v1.py preflight
      - name: Deploy to Hugging Face only on verified owner-requested main release
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[release-chat-general-repair-agent-v1]') }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SWRLZ_GENERAL_REPAIR_APPROVED: '1'
        run: python -u scripts/hf_chat_general_project_agent_release_v1.py publish
