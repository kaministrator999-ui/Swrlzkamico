name: Diagnose §E v11.193 hosted static HTML transformation (one-time)
on:
  push:
    branches: [feature/quest-sheep-vr-menu-camera-capture]
    paths: [".github/workflows/verify-v11-193-hosted-once.yml"]
permissions:
  contents: read
jobs:
  hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Compare authored source with hosted HTML and identify server changes
        shell: bash
        run: |
          python projects/swrlz-forge-moba/scripts/verify_v11_193_release.py --output /tmp/quest-local >/tmp/quest-build.log
          python - <<'PY'
          import hashlib,json,urllib.request
          from pathlib import Path
          raw=Path('/tmp/quest-local/index.html').read_bytes()
          base="https://kamiloki-swrlz-forge-moba.static.hf.space"
          def get(f):
              q=urllib.request.Request(base+f,headers={"Cache-Control":"no-cache","User-Agent":"se193-difference-diagnostic"})
              with urllib.request.urlopen(q,timeout=30) as r:return r.read()
          receipt=json.loads(get("/SOURCE.json"))
          served=get("/index.html")
          print("HOSTED_VERSION",receipt.get('sourceVersion'),flush=True)
          print("HOSTED_RECEIPT",receipt.get('finalBytes'),receipt.get('finalSha256'),flush=True)
          print("RAW",len(raw),hashlib.sha256(raw).hexdigest(),flush=True)
          print("SERVED",len(served),hashlib.sha256(served).hexdigest(),flush=True)
          p=0
          while p<min(len(raw),len(served)) and raw[p]==served[p]:p+=1
          s=0
          while s<min(len(raw),len(served))-p and raw[-1-s]==served[-1-s]:s+=1
          print("FIRST_DIFFERENCE_OFFSET",p,"EQUAL_SUFFIX_BYTES",s,flush=True)
          print("ORIGINAL_CONTEXT",repr(raw[max(0,p-180):p+850]),flush=True)
          print("HOSTED_CONTEXT",repr(served[max(0,p-180):p+1500]),flush=True)
          if p+s>=len(raw):
              print("SERVED_ADDITION",repr(served[p:len(served)-s]),flush=True)
              print("LIVE_SOURCE_INTACT_WITH_ADDED_BYTES",flush=True)
          elif b'SWYRL_ENGINE_DEPLOY_MARKER: V11_193_SHEEP_VR_CAPTURE' in served:
              print("HOSTED_MARKER_CORRECT_BUT_DIFF_NEEDS_NORMALIZATION",flush=True)
          else:raise SystemExit("HOSTED_SOURCE_MARKER_MISSING")
          PY
