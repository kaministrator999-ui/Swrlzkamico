name: Release §C sandboxed HTML project serving to existing Space
on:
  pull_request:
    paths:
      - 'api/html_project_safe_route_v1.py'
      - 'tests/test_html_project_safe_route_v1.py'
      - 'scripts/hf_chat_html_project_route_release_v1.py'
      - '.github/workflows/hf-chat-html-project-route-release-v1.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/hf-chat-html-project-route-release-v1.yml'
      - 'scripts/hf_chat_html_project_route_release_v1.py'
      - 'api/html_project_safe_route_v1.py'
permissions:
  contents: read
concurrency:
  group: swrlz-hf-space-deployment
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet 'fastapi>=0.115,<1' 'httpx>=0.27,<1'
      - run: python -m py_compile api/html_project_safe_route_v1.py scripts/hf_chat_html_project_route_release_v1.py
      - run: python -m unittest discover -s tests -p 'test_html_project_safe_route_v1.py' -v
      - run: python scripts/hf_chat_html_project_route_release_v1.py selftest
  publish:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet 'huggingface_hub>=0.34,<2'
      - name: Source-scoped CAS publication and live sandbox verification
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SWRLZ_HTML_ROUTE_APPROVED: '1'
        run: python scripts/hf_chat_html_project_route_release_v1.py publish
      - name: Verify live revised Station and dedicated sandbox module
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/hf_chat_html_project_route_release_v1.py verify
