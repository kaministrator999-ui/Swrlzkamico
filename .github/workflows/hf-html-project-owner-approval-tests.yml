name: Test §C owner-approved HTML publishing integration
on:
  push:
    branches: [feature/html-project-chat-publish-v3]
    paths:
      - '.github/workflows/hf-html-project-owner-approval-tests.yml'
      - 'api/html_project_publish_action_v1.py'
      - 'chat/html-project-publish-v1.js'
      - 'scripts/hf_chat_html_publish_integration_release_v1.py'
      - 'tests/test_html_project_publish_action_v1.py'
  pull_request:
    paths:
      - 'api/html_project_publish_action_v1.py'
      - 'chat/html-project-publish-v1.js'
      - 'scripts/hf_chat_html_publish_integration_release_v1.py'
      - 'tests/test_html_project_publish_action_v1.py'
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet 'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'huggingface_hub>=0.34,<2'
      - run: python -m py_compile api/html_project_publish_action_v1.py scripts/hf_chat_html_publish_integration_release_v1.py
      - run: node --check chat/html-project-publish-v1.js
      - run: python -m unittest discover -s tests -p 'test_html_project_publish_action_v1.py' -v
      - run: python scripts/hf_chat_html_publish_integration_release_v1.py selftest
      - name: Compare proposed mutation against latest real Space source
        run: python -u scripts/hf_chat_html_publish_integration_release_v1.py preflight
