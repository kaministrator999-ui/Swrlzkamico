name: Guarded §C Valkey egress and finished-code optimization release
on:
  push:
    branches: [feature/swrlz-valkey-traffic-and-code-finish]
    paths:
      - "scripts/hf_valkey_code_finish_release.py"
      - ".github/workflows/hf-valkey-code-finish-release.yml"
permissions: {contents: read}
concurrency:
  group: swrlz-hf-space-deployment
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install existing Hugging Face read/write client
        run: python -m pip install "huggingface_hub>=0.34,<2"
      - name: Compile the guarded source and regression suites
        run: |
          python -m py_compile scripts/hf_valkey_revision_sync_optimization.py scripts/hf_code_finish_and_preview_v1.py scripts/hf_valkey_code_finish_release.py scripts/test_hf_valkey_code_finish_v1.py
          python -m unittest discover -s scripts -p test_hf_valkey_code_finish_v1.py -v
      - name: Download exact live sources and test patches in isolation
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u scripts/hf_valkey_code_finish_release.py preflight
      - uses: actions/upload-artifact@v4
        with:
          name: swrlz-preoptimization-exact-production-files
          path: swrlz-valkey-code-finish-exact-backup/
          if-no-files-found: error
          retention-days: 90
      - name: Publish exact source patch to existing §C and roll back if runtime fails
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SWRLZ_OPT_APPROVED_SCOPE: "redis-revision-code-fence-and-draft-presentation-only"
        timeout-minutes: 13
        run: python -u scripts/hf_valkey_code_finish_release.py publish
