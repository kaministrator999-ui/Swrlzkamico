name: §E v11.194 one-time Emberfall browser smoke
on:
  push:
    branches: [feature/arpg-emberfall-starter-v11-194]
    paths: [".github/workflows/verify-v11-194-browser-once.yml"]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Build strictly verified engine and install small smoke runner
        run: |
          python projects/swrlz-forge-moba/scripts/verify_v11_194_release.py --output dist/emberfall >/tmp/build.log
          python -m pip install --quiet "playwright>=1.50,<2"
          which google-chrome || which google-chrome-stable || which chromium
      - name: Native starter open, Play, and Stop in headless Chrome
        env:
          CI: "1"
        run: |
          python -m http.server 8765 --directory dist/emberfall >/tmp/emberfall-http.log 2>&1 &
          python - <<'PY'
          import time
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,channel='chrome',args=[
                '--no-sandbox','--disable-dev-shm-usage','--use-gl=angle',
                '--use-angle=swiftshader','--enable-webgl','--enable-unsafe-swiftshader'])
              page=browser.new_page(viewport={'width':1200,'height':800})
              errors=[]
              page.on('pageerror',lambda e:errors.append(str(e)))
              page.goto('http://127.0.0.1:8765/index.html',wait_until='domcontentloaded',timeout=120000)
              page.wait_for_function('!!window.SWYRL_ENGINE_EMBERFALL',timeout=120000)
              assert page.locator('[data-project-template="emberfall-arpg"]').count()==1,'Starter must appear in native Projects gallery'
              loaded=page.evaluate('window.SWYRL_ENGINE_EMBERFALL.load()')
              assert loaded,'Starter load returned false'
              info=page.evaluate('window.SWYRL_ENGINE_EMBERFALL.status()')
              print('EMBERFALL_SCENE',info,flush=True)
              assert info['starter'] and info['authoredFoes']==12
              page.evaluate("document.getElementById('playBtn').click()")
              page.wait_for_function('window.SWYRL_ENGINE_EMBERFALL.status().active',timeout=25000)
              assert page.locator('#ef194Hud').is_visible(),'ARPG HUD must be visible in Play'
              print('EMBERFALL_PLAY_PASS',flush=True)
              page.evaluate("document.getElementById('stopBtn').click()")
              page.wait_for_function('!window.SWYRL_ENGINE_EMBERFALL.status().active',timeout=25000)
              assert page.locator('#ef194Hud').is_hidden()
              print('EMBERFALL_STOP_RESTORE_PASS',flush=True)
              critical=[e for e in errors if 'emberfall' in e.lower() or 'ef194' in e.lower()]
              assert not critical,'ARPG JavaScript errors: '+repr(critical)
              browser.close()
          print('EMBERFALL_BROWSER_SMOKE_PASS',flush=True)
          PY
