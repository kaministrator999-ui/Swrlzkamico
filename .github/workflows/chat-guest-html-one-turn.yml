name: §C isolated short HTML guest generation benchmark
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chat-guest-html-one-turn.yml'
permissions: {contents: read}
concurrency:
  group: swrlz-chat-guest-eval
  cancel-in-progress: false
jobs:
  html:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - run: python -m py_compile scripts/eval_chat_guest_suite.py
      - name: Measure one short complete HTML page without account
        env:
          SWRLZ_EVAL_BASE: https://kamiloki-swyrlz.hf.space
          SWRLZ_EVAL_MODEL: 700m
        run: |
          python -u - <<'PY'
          import asyncio,sys
          import scripts.eval_chat_guest_suite as ev
          ev.CASES['2']=[c for c in ev.CASES['2'] if c['id']=='html-button-ui']
          if len(ev.CASES['2'])!=1:raise RuntimeError('HTML fixture missing')
          ev.CASES['2'][0]['turns']=ev.CASES['2'][0]['turns'][:1]
          sys.exit(asyncio.run(ev.main('live','2')))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guest-html-one-turn-${{ github.run_id }}
          path: reports/chat-guest-eval/
          retention-days: 14
          if-no-files-found: ignore
