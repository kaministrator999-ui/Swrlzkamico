name: §E v11.133 Android sheep ghost and Rapid touch regression
on:
  push:
    branches: [feature/se-v11-133-rapid-touch-and-sheep-ghost]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install DOM event test harness
        run: npm install --prefix /tmp/se133-test --no-audit --no-fund jsdom@25.0.1
      - name: Rebuild and verify unchanged sealed v11.132 engine
        run: python projects/swrlz-forge-moba/scripts/verify_v11_132_release.py --output /tmp/se132-base
      - name: Assemble 165-patch candidate and check compiled JS
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('projects/swrlz-forge-moba/source-manifest.json')
          m=json.loads(p.read_text())
          assert m['name']=='§wyrl§ Engine v11.132' and len(m['patches'])==164
          m['name']='§wyrl§ Engine v11.133'
          m['patches'].append('patches/v11_133_rapid_tappable_sheep_ghost.py')
          p.write_text(json.dumps(m,ensure_ascii=False))
          PY
          python projects/swrlz-forge-moba/scripts/measure_v11_133_full_chain.py
          node --check /tmp/se133-full.mjs
      - name: Android skill pointerup/synthetic click regression and rapid button placement
        env:
          SE_JSDOM_MODULE: /tmp/se133-test/node_modules/jsdom
          SE_ASSEMBLED_HTML: /tmp/se133-full.html
        run: node projects/swrlz-forge-moba/tests/rapid_click_sheep_ghost_v11_133.mjs
