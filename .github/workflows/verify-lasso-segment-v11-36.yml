name: Verify §E v11.36 selected boundary segment grow/shrink
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-atelier-segment-v1136
  cancel-in-progress: true
jobs:
  segment-and-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Source syntax and sealed engine candidate
        run: |
          node --check projects/swrlz-forge-moba/runtime/model_atelier_surface_lasso_v11_22.js
          python -m py_compile projects/swrlz-forge-moba/patches/v11_21_vertex_sphere_brush_preview.py
          python projects/swrlz-forge-moba/build_space.py --output /tmp/atelier-segment
          python - <<'PY'
          import runpy
          from pathlib import Path
          p=Path('/tmp/atelier-segment/index.html')
          p.write_text(runpy.run_path('projects/swrlz-forge-moba/patches/v11_21_vertex_sphere_brush_preview.py')['apply'](p.read_text()))
          PY
      - name: Test geometric signed edge motion and named region/curve regressions
        run: |
          npm install --no-save playwright@1.56.1 three@0.169.0
          node projects/swrlz-forge-moba/tests/model_atelier_lasso_segment_v11_36.mjs
          node projects/swrlz-forge-moba/tests/model_atelier_lasso_curve_v11_35.mjs
          node projects/swrlz-forge-moba/tests/model_atelier_region_boolean_v11_34.mjs
      - name: Real desktop Android one-segment editing native Undo Save Reload
        run: |
          npx playwright install --with-deps --only-shell chromium
          python -m http.server 8787 --directory /tmp/atelier-segment >/tmp/atelier-segment.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8787/ >/dev/null; then break; fi
            sleep 0.3
          done
          curl -fsS http://127.0.0.1:8787/ >/dev/null
          SWYRL_SCULPT_TEST_URL=http://127.0.0.1:8787 node projects/swrlz-forge-moba/tests/model_atelier_lasso_segment_browser_v11_36.mjs
