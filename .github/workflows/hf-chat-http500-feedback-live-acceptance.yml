name: Live §C two-turn HTTP500 feedback acceptance
on:
  push:
    paths:
      - "scripts/probe_hf_http500_feedback_live_v1.py"
      - ".github/workflows/hf-chat-http500-feedback-live-acceptance.yml"
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - name: Probe exact running Space with synthetic anonymous remix + critique
        run: |
          python -m pip install -q 'huggingface_hub>=0.34,<2' requests
          python -m py_compile scripts/probe_hf_http500_feedback_live_v1.py
          python -u scripts/probe_hf_http500_feedback_live_v1.py
