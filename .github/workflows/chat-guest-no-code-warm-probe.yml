name: Verify warmed §C conversational no-code boundary
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chat-guest-no-code-warm-probe.yml'
permissions: {contents: read}
concurrency:
  group: swrlz-chat-guest-eval
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - run: python -m py_compile scripts/eval_chat_guest_suite.py
      - name: Check first Python explanation only without account
        env:
          SWRLZ_EVAL_BASE: https://kamiloki-swyrlz.hf.space
          SWRLZ_EVAL_MODEL: 700m
        run: |
          python -u - <<'PY'
          import asyncio,sys
          import scripts.eval_chat_guest_suite as e
          e.CASES['1']=[x for x in e.CASES['1'] if x['id']=='python-repair']
          e.CASES['1'][0]['turns']=e.CASES['1'][0]['turns'][:1]
          if len(e.CASES['1'])!=1:raise RuntimeError('Missing test')
          sys.exit(asyncio.run(e.main('live','1')))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: warmed-conversational-no-code-${{ github.run_id }}
          path: reports/chat-guest-eval/
          retention-days: 14
          if-no-files-found: ignore
