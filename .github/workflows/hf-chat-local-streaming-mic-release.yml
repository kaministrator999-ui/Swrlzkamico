name: Guarded HF Chat Local Streaming Mic Release
on:
  push:
    branches: [main]
    paths:
      - ".deploy/HF_CHAT_LOCAL_STREAMING_MIC_REQUEST.txt"
permissions:
  contents: read
concurrency:
  group: swrlz-hf-space-deployment
  cancel-in-progress: false
jobs:
  local-streaming-mic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout explicit production request
        uses: actions/checkout@v4
      - name: Verify pinned opt-in local-only speech request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          file=".deploy/HF_CHAT_LOCAL_STREAMING_MIC_REQUEST.txt"
          test -f "$file"
          get() { sed -n "s/^$1=//p" "$file" | tail -n 1; }
          test "$(get TARGET)" = "kamiloki/Swyrlz"
          test "$(get APPROVED)" = "1"
          test "$(get NO_PAID_SPEECH_API)" = "1"
          test "$(get NO_HARDWARE_UPGRADE)" = "1"
          ref="$(get SOURCE_REF)"
          nonce="$(get REQUEST_NONCE)"
          [[ "$ref" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::SOURCE_REF must be immutable SHA"; exit 1; }
          [[ "$nonce" =~ ^[A-Za-z0-9._-]{10,96}$ ]] || { echo "::error::Release nonce invalid"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Checkout reviewed immutable local-mic source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.ref }}
          path: voice-streaming-source
          fetch-depth: 1
      - name: Validate source syntax and no-network browser mocks
        shell: bash
        run: |
          set -euo pipefail
          node --check voice-streaming-source/chat/§wyrlz/assets/voice_conversation.js
          node --check voice-streaming-source/chat/§wyrlz/assets/local_voice_vosk.js
          node --check voice-streaming-source/scripts/patch_hf_local_streaming_voice.cjs
          node voice-streaming-source/scripts/test_chat_streaming_voice.cjs
          node voice-streaming-source/scripts/test_chat_local_streaming_vosk.cjs
          python -m py_compile voice-streaming-source/scripts/publish_hf_local_streaming.py
      - name: Install existing Hugging Face source client
        run: python -m pip install 'huggingface_hub>=0.34,<2'
      - name: Snapshot current live Talk and prepare additive local streaming variant
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          python voice-streaming-source/scripts/publish_hf_local_streaming.py prepare
      - name: Preserve original live Talk files before production patch
        uses: actions/upload-artifact@v4
        with:
          name: hf-chat-local-streaming-mic-rollback
          path: hf-local-voice-rollback/
          if-no-files-found: error
          retention-days: 90
      - name: Publish only the local mic selector and two voice JS assets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          python voice-streaming-source/scripts/publish_hf_local_streaming.py publish
