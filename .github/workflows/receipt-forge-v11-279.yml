name: §E v11.279 sealed source and glove verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/receipt-forge-v11-279.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sealed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source integrity, all shipped inline JS and starter hooks
        run: python projects/swrlz-forge-moba/scripts/verify_v11_279_release.py --output /tmp/se279-sealed
