name: Chat v291 GitHub File Create Name Continuity
on:
  push:
    branches: [feature/chat-create-name-continuity-v291]
    paths:
      - 'hf_space/github_conversation_actions_v264.py'
      - 'hf_space/station.py'
      - 'hf_space/test_github_create_name_continuity_v291.py'
      - '.github/workflows/chat-create-name-continuity-v291.yml'
  pull_request:
    paths:
      - 'hf_space/github_conversation_actions_v264.py'
      - 'hf_space/station.py'
      - 'hf_space/test_github_create_name_continuity_v291.py'
      - '.github/workflows/chat-create-name-continuity-v291.yml'
permissions:
  contents: read
jobs:
  collision-new-file:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install light provider/session dependencies
        run: python -m pip install 'fastapi>=0.110,<1' 'requests>=2,<3' 'cryptography>=42,<50'
      - name: Compile action adapter and Station route
        run: python -m py_compile hf_space/github_conversation_actions_v264.py hf_space/station.py
      - name: Verify no-overwrite, exact text, bounded followups and fresh human approval
        run: python -m unittest -v hf_space/test_github_create_name_continuity_v291.py
      - name: Protect existing supported GitHub create and rename
        run: python -m unittest -v hf_space/test_github_general_create_v262.py hf_space/test_github_rename_v263.py
