name: Audit §C free-tier capacity, artifacts and live HF source (read-only)
on:
  push:
    branches: [audit/swrlzc-free-quota-20261114]
    paths:
      - "scripts/audit_swrlzc_free_quotas_20261114.py"
      - ".github/workflows/audit-swrlzc-free-quotas-20261114.yml"
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --quiet "huggingface_hub>=0.34,<2"
      - name: Source-pinned capacity and usage metadata only
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m py_compile scripts/audit_swrlzc_free_quotas_20261114.py
          python -u scripts/audit_swrlzc_free_quotas_20261114.py
