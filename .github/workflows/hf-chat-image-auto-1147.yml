name: Guarded HF §C 1.1.47 automatic image intelligence
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hf-chat-image-auto-1147.yml"
      - ".deploy/HF_CHAT_IMAGE_AUTO_1147_REQUEST.txt"
permissions:
  contents: read
concurrency:
  group: swrlz-hf-space-deployment
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 34
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact release authority and scope
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          file=.deploy/HF_CHAT_IMAGE_AUTO_1147_REQUEST.txt
          mode=inspect
          if [[ -e "$file" ]]; then
            get(){ sed -n "s/^$1=//p" "$file" | tail -1; }
            test "$(get SPACE)" = "kamiloki/Swyrlz"
            test "$(get SOURCE_REVISION)" = "6025e37604f1efe1303be263e17a1513f512589d"
            test "$(get SCOPE)" = "only-chat-ui-station-verified-image-context-and-vision-prompt"
            [[ "$(get NONCE)" =~ ^[a-z0-9-]{12,96}$ ]]
            mode="$(get MODE)"
            [[ "$mode" == inspect || "$mode" == deploy ]]
            if [[ "$mode" == deploy ]]; then test "$(get APPROVED)" = yes; fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Static checks
        run: python -m py_compile scripts/hf_chat_image_auto_v1147_release.py
      - name: Install Hugging Face source inspection client
        run: python -m pip install --quiet "huggingface_hub>=0.34,<2"
      - name: Hash-verify exact live source and compile patched Python and JavaScript
        env:
          HF_TOKEN: \${{ secrets.HF_TOKEN }}
        run: python -u scripts/hf_chat_image_auto_v1147_release.py inspect
      - name: Preserve original + candidate and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swrlz-chat-image-auto-1147-inspection
          path: reports/swrlz-image-auto-1147/
          retention-days: 30
          if-no-files-found: ignore
      - name: Publish authorized, readback-verified Space update and verify resident Qwen readiness
        if: \${{ steps.gate.outputs.mode == 'deploy' }}
        timeout-minutes: 24
        env:
          HF_TOKEN: \${{ secrets.HF_TOKEN }}
          SWRLZ_IMAGE_AUTO_1147_APPROVED: "yes"
        run: |
          set -euo pipefail
          python -u scripts/hf_chat_image_auto_v1147_release.py deploy
          echo SWRLZ_IMAGE_AUTO_1147_VERIFIED
