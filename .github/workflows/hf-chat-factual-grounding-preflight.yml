name: §C public fact grounding preflight
on:
  push:
    branches: [fix/chat-factual-grounding-gates-v1]
    paths:
      - "api/factual_claim_guard_v1.py"
      - "api/selective_retrieval.py"
      - "scripts/hf_chat_factual_grounding_v1.py"
      - "tests/test_hf_factual_grounding_v1.py"
      - ".github/workflows/hf-chat-factual-grounding-preflight.yml"
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --quiet "huggingface_hub>=0.34,<2"
      - name: Run targeted claim-guard and retrieval source tests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_hf_factual_grounding_v1.py' -v
          python -m py_compile api/factual_claim_guard_v1.py api/selective_retrieval.py scripts/hf_chat_factual_grounding_v1.py
      - name: Prepare exact live Hugging Face Space candidate without publishing
        run: |
          set -euo pipefail
          python -u scripts/hf_chat_factual_grounding_v1.py --out swrlz-factual-source-rollback
      - name: Verify actual public source dates through the candidate adapter
        run: |
          python - <<'PY'
          from pathlib import Path
          from huggingface_hub import HfApi,hf_hub_download
          import importlib.util,sys,re,json
          import api.selective_retrieval as candidate
          repo="kamiloki/Swyrlz"
          rev=HfApi().repo_info(repo,repo_type="space").sha
          path=hf_hub_download(repo,"api/online_research.py",repo_type="space",revision=rev)
          spec=importlib.util.spec_from_file_location("swrlz_public_source_probe",path)
          mod=importlib.util.module_from_spec(spec)
          sys.modules[spec.name]=mod
          spec.loader.exec_module(mod)
          prompt="Was Diablo II Classic released before Lord of Destruction? Research both versions and explain the differences."
          out,route=candidate.enrich_payload({"prompt":prompt},mod.research,fetch_page=mod._page_fetch,enabled=True)
          evidence=out.get("onlineContext") or {}
          found=evidence.get("evidence") or []
          years=sorted(set(re.findall(r"(?<!\d)(?:18|19|20)\d{2}(?!\d)"," ".join(x.get("excerpt","") for x in found))))
          print("SWRLZ_FACTUAL_SOURCE_COVERAGE "+json.dumps({
             "phase":route.get("phase"),"years":years,
             "sources":[{"title":x.get("title"),"url":x.get("url"),
                         "excerpt":x.get("excerpt","")[:300]} for x in found]}))
          assert route.get("phase")=="RESEARCH_READY"
          assert {"2000","2001"}.issubset(set(years)), "Both version dates must be evidenced"
          assert any("Lord of Destruction" in str(x.get("title")) and "2001" in x.get("excerpt","") for x in found)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swrlz-factual-grounding-dryrun-source
          path: swrlz-factual-source-rollback/
          retention-days: 7
          if-no-files-found: warn