name: Guarded §C 1.1.41 media and Qwen fast-path

on:
  push:
    branches: [main]
    paths: [".deploy/HF_CHAT_MEDIA_QWEN_1141_REQUEST.txt"]

permissions:
  contents: read

concurrency:
  group: swrlz-hf-space-deployment
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate exact source, scope and approval
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          request=.deploy/HF_CHAT_MEDIA_QWEN_1141_REQUEST.txt
          test -f "$request"
          get() { sed -n "s/^$1=//p" "$request" | tail -n 1; }
          test "$(get TARGET)" = "kamiloki/Swyrlz"
          test "$(get SOURCE_REVISION)" = "401d3025870a6338f8f4a53c73b18dadd7cc627a"
          test "$(get SCOPE)" = "composer-media-and-single-qwen-vision-fastpath-only"
          mode="$(get MODE)"
          [[ "$mode" == inspect || "$mode" == deploy ]]
          if [[ "$mode" == deploy ]]; then
            test "$(get APPROVED)" = yes
          fi
          nonce="$(get REQUEST_NONCE)"
          [[ "$nonce" =~ ^[a-z0-9-]{12,96}$ ]]
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check patcher syntax
        run: python -m py_compile scripts/hf_chat_media_qwen_v1141_release.py
      - name: Install HF source reader
        run: python -m pip install --quiet "huggingface_hub>=0.34,<2"
      - name: Snapshot live source and create bounded patch candidate
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u scripts/hf_chat_media_qwen_v1141_release.py inspect
      - name: Verify rendered source contract and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast,pathlib,re
          root=pathlib.Path("reports/swrlz-media-qwen-unified-v1141/candidate")
          html=(root/"chat/§wyrlz/index.html").read_text()
          model=(root/"model_router.py").read_text()
          ast.parse(model)
          assert 'swrlz-chat-version" content="1.1.41"' in html
          assert 'swrlz-chat-design-version" content="1.0.60"' in html
          assert 'projectFilePickButton.disabled=!stageAllowed' in html
          assert 'micButton.disabled=!stageAllowed' in html
          assert 'imagePickButton.disabled=!stageAllowed' in html
          assert 'selectedProjectFiles.every((file,index)=>file===projectFiles[index])' in html
          assert 'analyze this image' in model and 'analyze this screenshot' in model
          scripts=[x for x in re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html,re.I) if x.strip()]
          assert len(scripts)==1, f"Expected one active inline Chat script, got {len(scripts)}"
          pathlib.Path("/tmp/swrlz-1141.js").write_text(scripts[0])
          PY
          node --check /tmp/swrlz-1141.js
      - name: Snapshot rollback and candidate file digests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swrlz-media-qwen-1141-backup
          path: reports/swrlz-media-qwen-unified-v1141/
          retention-days: 30
          if-no-files-found: ignore
      - name: Apply exact approved patch and verify live served revision
        if: ${{ steps.authority.outputs.mode == 'deploy' }}
        timeout-minutes: 20
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SWRLZ_MEDIA_QWEN_1141_APPROVED: "yes"
        run: |
          set -euo pipefail
          python -u scripts/hf_chat_media_qwen_v1141_release.py publish
          echo "SWRLZ_MEDIA_QWEN_1141_LIVE_VERIFIED"
