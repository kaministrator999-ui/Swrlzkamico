name: §E v11.132 sealed rapid construction and sheep occlusion regression
on:
  push:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/source-manifest.json"
      - "projects/swrlz-forge-moba/scripts/verify_v11_132_release.py"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Install real Three.js rendering and DOM regression harness
        run: npm install --prefix /tmp/se132-tests --no-audit --no-fund three@0.170.0 jsdom@25.0.1
      - name: Verify exact 164-patch sealed source, older Sheep Tag behavior and 68 assets
        run: |
          python projects/swrlz-forge-moba/scripts/verify_v11_132_release.py --output /tmp/se132-release
          node --check /tmp/se132-release-module.mjs
      - name: Test real animated occlusion outline, underpasses, 3 routes and rapid construction
        env:
          SE_THREE_MODULE: /tmp/se132-tests/node_modules/three
          SE_JSDOM_MODULE: /tmp/se132-tests/node_modules/jsdom
          SE_ASSEMBLED_HTML: /tmp/se132-release/index.html
        run: node projects/swrlz-forge-moba/tests/sheep_rapid_build_underpass_wireframe_v11_132.mjs
