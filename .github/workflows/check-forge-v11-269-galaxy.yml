name: Check §E v11.269 reference galaxy candidate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-forge-v11-269-galaxy.yml'
      - 'projects/swrlz-forge-moba/patches/v11_269_reference_spiral_wisps.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reassemble immutable v11.268 plus new reference-spiral patch
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, sys
          from pathlib import Path
          root=Path('projects/swrlz-forge-moba')
          sys.path.insert(0,str(root.resolve()))
          from build_space import load_patch
          m=json.loads((root/'source-manifest.json').read_text('utf8'))
          assert m['name']=='§wyrl§ Engine v11.268',m['name']
          assert m['patches'][-1]=='patches/v11_268_quest_lan_menu.py'
          encoded=''.join((root/name).read_text('utf8').strip() for name in m['chunks'])
          raw=gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(raw).hexdigest()==m['baseSha256']
          html=raw.decode('utf8')
          for name in m['patches']:
              html=load_patch(root/name)(html)
          old=html.encode('utf8')
          assert hashlib.sha256(old).hexdigest()==m['finalSha256']
          assert len(old)==m['finalBytes']
          html=load_patch(root/'patches/v11_269_reference_spiral_wisps.py')(html)
          assert html.count('renderer.setAnimationLoop(tick);')==1
          assert 'SWYRL_ENGINE_DEPLOY_MARKER: V11_269_REFERENCE_SPIRAL_WISPS' in html
          assert 'const MIST_N=72;' in html
          assert 'const a=phase+spin+arm*TAU/3+u*4.85+.18*Math.sin(TAU*u);' in html
          assert 'window.SWYRL_ENGINE_SHEEP_VR_LAN_268' in html
          assert 'window.SWYRL_ENGINE_PARTICLE_ERRORS_258' in html
          output=Path('/tmp/se269.html')
          output.write_text(html,encoding='utf8')
          data=html.encode('utf8')
          print('V11_269_CANDIDATE_SHA256='+hashlib.sha256(data).hexdigest(),flush=True)
          print('V11_269_CANDIDATE_BYTES='+str(len(data)),flush=True)
          print('V11_269_CANDIDATE_PATCHES='+str(len(m['patches'])+1),flush=True)
          PY
          python3 projects/swrlz-forge-moba/scripts/check_inline_js_syntax_v11_266.py /tmp/se269.html
          python3 -m py_compile projects/swrlz-forge-moba/patches/v11_269_reference_spiral_wisps.py
