name: Guarded §C Qwen3.5-9B free CPU profile boost
on:
  push:
    branches: [main]
    paths:
      - ".deploy/HF_CHAT_QWEN35_CPU_TUNE_REQUEST.txt"
permissions:
  contents: read
concurrency:
  group: swrlz-hf-space-deployment
  cancel-in-progress: false
jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - name: Checkout explicit authorization
        uses: actions/checkout@v4
      - name: Validate existing Space and pinned source authorization
        shell: bash
        id: approval
        run: |
          set -euo pipefail
          request=.deploy/HF_CHAT_QWEN35_CPU_TUNE_REQUEST.txt
          test -f "$request"
          get() { sed -n "s/^$1=//p" "$request" | tail -n 1; }
          test "$(get TARGET)" = "kamiloki/Swyrlz"
          test "$(get APPROVED)" = "1"
          ref="$(get SOURCE_REF)"
          nonce="$(get REQUEST_NONCE)"
          [[ "$ref" =~ ^[a-f0-9]{40}$ ]]
          [[ "$nonce" =~ ^[a-z0-9-]{10,96}$ ]]
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Approved source-only CPU quota profile tune; paid hardware unchanged."
      - name: Checkout immutable, validated tuning revision
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.approval.outputs.ref }}
          path: tuning-source
          fetch-depth: 1
      - name: Install existing Hub client
        run: python -m pip install 'huggingface_hub>=0.34,<2'
      - name: Validate CPU profile source and dry-run live patch
        shell: bash
        run: |
          set -euo pipefail
          cd tuning-source
          python -m py_compile scripts/hf_qwen35_free_cpu_tune.py scripts/hf_qwen35_free_cpu_release.py scripts/hf_chat_qwen35_9b_runtime.py scripts/test_hf_qwen35_free_cpu_profile.py
          python scripts/test_hf_qwen35_free_cpu_profile.py
          python scripts/hf_qwen35_free_cpu_tune.py inspect
      - name: Preserve exact previous source rollback artifact
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import json, pathlib,os
          from huggingface_hub import HfApi, hf_hub_download
          api=HfApi(token=os.environ['HF_TOKEN'])
          sha=api.repo_info('kamiloki/Swyrlz',repo_type='space').sha
          root=pathlib.Path('qwen35-cpu-rollback-source')
          root.mkdir(exist_ok=False)
          for name in ('qwen35_single_runtime.py','station.py'):
              src=hf_hub_download('kamiloki/Swyrlz',name,repo_type='space',revision=sha,token=api.token)
              (root/name).write_bytes(pathlib.Path(src).read_bytes())
          (root/'revision.json').write_text(json.dumps({'space':'kamiloki/Swyrlz','sha':sha}))
          print('EXACT_SOURCE_ROLLBACK_SNAPSHOT',sha)
          PY
      - name: Upload source snapshot independently before publishing
        uses: actions/upload-artifact@v4
        with:
          name: qwen35-cpu-profile-source-rollback
          path: qwen35-cpu-rollback-source/
          retention-days: 14
          if-no-files-found: error
      - name: Publish only profile source, then verify live warmup or roll back
        timeout-minutes: 30
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SWRLZ_QWEN35_CPU_TUNE_APPROVED: "1"
        run: |
          set -euo pipefail
          cd tuning-source
          python scripts/hf_qwen35_free_cpu_release.py
          echo "§C_QWEN35_CPU_PROFILE_TUNED_AND_LIVE"
