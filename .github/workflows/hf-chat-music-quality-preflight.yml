name: §C creative music transformation quality tests
on:
  push:
    paths:
      - "scripts/music_transform_quality_v1.py"
      - "tests/test_music_transform_quality_v1.py"
      - "scripts/hf_chat_music_transform_v1.py"
      - ".github/workflows/hf-chat-music-quality-preflight.yml"
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Deterministic song QA
        run: python -m unittest discover -s tests -p 'test_music_transform_quality_v1.py' -v
      - name: Syntax check
        run: python -m py_compile scripts/music_transform_quality_v1.py
