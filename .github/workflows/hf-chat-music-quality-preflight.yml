name: §C creative music transformation quality tests
on:
  push:
    paths:
      - "scripts/music_transform_quality_v1.py"
      - "tests/test_music_transform_quality_v1.py"
      - "scripts/hf_chat_music_transform_v1.py"
      - "scripts/stop_transport_v1.py"
      - "tests/test_stop_transport_v1.py"
      - ".github/workflows/hf-chat-music-quality-preflight.yml"
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Deterministic song QA
        run: python -m unittest discover -s tests -p 'test_music_transform_quality_v1.py' -v
      - name: Request-isolated native Stop regression tests
        run: python -m unittest discover -s tests -p 'test_stop_transport_v1.py' -v
      - name: Syntax check
        run: python -m py_compile scripts/music_transform_quality_v1.py scripts/hf_chat_music_transform_v1.py scripts/stop_transport_v1.py
      - name: Match and compile exact current live §C source without publication
        run: |
          python -m pip install --quiet 'huggingface_hub>=0.34,<2'
          python -u scripts/hf_chat_music_transform_v1.py snapshot
      - uses: actions/upload-artifact@v4
        with:
          name: swrlz-music-transform-readonly-source-${{ github.run_id }}
          path: reports/swrlz-music-transform-v1/
          retention-days: 30
          if-no-files-found: error
