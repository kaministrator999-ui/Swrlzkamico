name: Quest 238 sealed release source check
on:
  push:
    branches:
      - fix/quest-radial-menu-and-workspace-layout-238
    paths:
      - ".github/workflows/quest-238-seal-candidate.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify exact sealed v11.238 artifact and 68 assets (no publish)
        run: python projects/swrlz-forge-moba/scripts/verify_v11_238_release.py --output dist/swrlz-forge-moba
