name: §C non-code generation repetition guard preflight
on:
  pull_request:
    paths:
      - 'api/noncode_repetition_guard_v1.py'
      - 'scripts/hf_chat_noncode_repetition_release_v1.py'
      - 'tests/test_hf_chat_noncode_repetition_v1.py'
      - '.github/workflows/hf-chat-noncode-repetition-preflight.yml'
      - '.github/workflows/manual-hf-space.yml'
      - '.github/workflows/hf-space-request.yml'
  push:
    paths:
      - 'api/noncode_repetition_guard_v1.py'
      - 'scripts/hf_chat_noncode_repetition_release_v1.py'
      - 'tests/test_hf_chat_noncode_repetition_v1.py'
      - '.github/workflows/hf-chat-noncode-repetition-preflight.yml'
  workflow_dispatch: {}
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Run deterministic safety and native-event wrapper tests
        run: |
          python -m unittest discover -s tests -p 'test_hf_chat_noncode_repetition_v1.py' -v
          python -m py_compile api/noncode_repetition_guard_v1.py scripts/hf_chat_noncode_repetition_release_v1.py
      - name: Check existing regression families
        run: |
          python -m unittest discover -s tests -p 'test_music_transform_quality_v1.py' -v
          python -m unittest discover -s tests -p 'test_hf_chat_noncode_output_budget_v1.py' -v
      - name: Validate exact live HF engine source without changing production
        run: |
          python -m pip install --quiet 'huggingface_hub>=0.34,<2'
          python -u scripts/hf_chat_noncode_repetition_release_v1.py snapshot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swrlz-noncode-loop-readonly-source-${{ github.run_id }}
          path: reports/swrlz-noncode-repetition-guard-v1/
          retention-days: 21
          if-no-files-found: ignore
