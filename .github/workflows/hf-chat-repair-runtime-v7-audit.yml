name: Audit live §C repair handler and handoff v7
on:
  pull_request:
    paths:
      - 'scripts/audit_hf_chat_repair_runtime_v7.py'
      - '.github/workflows/hf-chat-repair-runtime-v7-audit.yml'
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet 'huggingface_hub>=0.34,<2'
      - run: python -u scripts/audit_hf_chat_repair_runtime_v7.py
