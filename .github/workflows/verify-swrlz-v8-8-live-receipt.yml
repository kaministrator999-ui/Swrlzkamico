name: Audit exact §E v8.8 hosted storybook release
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  receipt:
    runs-on: ubuntu-latest
    steps:
      - name: Check exact deploy run and live storybook source/assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,json,os,re,time,urllib.request
          from urllib.parse import urlencode
          trigger='5f2d69560fea6377866d3fa385a098bfc9567d00'
          expected='06c55a0d090bd6ffa9383ff44f914b922a841de7dc03284a50955cb4036478cd'
          repo='kaministrator999-ui/Swrlzkamico'
          url=f'https://api.github.com/repos/{repo}/actions/workflows/deploy-swrlz-forge-moba.yml/runs?per_page=40'
          h={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json',
             'User-Agent':'swyrl-storybook-live-audit','X-GitHub-Api-Version':'2022-11-28'}
          def load(url,headers={}):
            req=urllib.request.Request(url,headers={**headers,'User-Agent':'swyrl-storybook-live-audit'})
            return urllib.request.urlopen(req,timeout=35).read()
          final=None
          for i in range(16):
            runs=json.loads(load(url,h)).get('workflow_runs',[])
            match=[r for r in runs if r.get('head_sha')==trigger]
            if match:
              final=match[0]
              print('V8_8_DEPLOY_RUN_ID='+str(final['id'])+' STATUS='+str(final['status'])+
                ' CONCLUSION='+str(final['conclusion'])+' URL='+str(final['html_url']),flush=True)
              if final['status']=='completed':break
            time.sleep(5)
          assert final and final['status']=='completed' and final['conclusion']=='success', 'exact v8.8 dedicated deployment not successful'
          root='https://kamiloki-swrlz-forge-moba.static.hf.space/'
          def normalized(payload):
            return re.sub(rb'(?<=<head>)<script>window\.huggingface=\{variables:\{.*?\}\};</script>',
              b'',payload,count=1)
          html=normalized(load(root+'index.html?receipt='+trigger))
          digest=hashlib.sha256(html).hexdigest()
          print('V8_8_HOSTED_HTML_BYTES='+str(len(html))+' SHA256='+digest)
          assert digest==expected
          assert len(html)==644951
          assert b'V8_8_POPUP_STORYBOOK_DIRECTOR' in html
          receipt=json.loads(load(root+'SOURCE.json?receipt='+trigger))
          assert receipt['finalSha256']==digest
          assert len(receipt['patches'])==47
          for path,meta in receipt['assets'].items():
            source=load(root+path+'?receipt='+trigger)
            data=normalized(source) if path.endswith('.html') else source
            assert len(data)==meta['bytes'],path
            assert hashlib.sha256(data).hexdigest()==meta['sha256'],path
            print('V8_8_LIVE_ASSET_OK='+path,flush=True)
          print('V8_8_LIVE_SOURCE_AND_ASSETS_VERIFIED')
          PY
