name: Seal §E v11.261 source and verify particle update
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seal-forge-v11-261.yml'
      - 'projects/swrlz-forge-moba/patches/v11_261_visible_smoke_wisps.py'
      - 'projects/swrlz-forge-moba/scripts/verify_v11_261_release.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: seal-forge-v11-261
  cancel-in-progress: false
jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct v11.261 from historical patches, then reseal its exact bytes
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,json,sys
          from pathlib import Path
          root=Path('projects/swrlz-forge-moba')
          sys.path.insert(0,str(root.resolve()))
          from build_space import load_patch
          p=root/'source-manifest.json'
          m=json.loads(p.read_text('utf8'))
          assert m['name']=='§wyrl§ Engine v11.261'
          assert len(m['patches'])==292
          assert m['patches'][-1]=='patches/v11_261_visible_smoke_wisps.py'
          enc=''.join((root/name).read_text('utf8').strip() for name in m['chunks'])
          source=gzip.decompress(base64.b64decode(enc))
          assert hashlib.sha256(source).hexdigest()==m['baseSha256']
          html=source.decode('utf8')
          for name in m['patches']:
              html=load_patch(root/name)(html)
          assert 'SWYRL_ENGINE_DEPLOY_MARKER: V11_261_LUMINOUS_NEBULA_WISPS' in html
          assert 'window.SWYRL_ENGINE_PARTICLE_ERRORS_258' in html
          assert 'Smoke density' in html
          assert 'float cloud=.50*n+.33*n2+.17*n3;' in html
          assert 'float holes=smoothstep(.33,.61,cloud);' in html
          assert 'float opacity=tip*uOpacity*(1.13*plume+.43*wisp);' in html
          assert '(.035+Math.pow(u,.83)*(.47+b.index*.18))*widthFactor' in html
          assert '  blending:THREE.AdditiveBlending,' in html
          assert html.count('renderer.setAnimationLoop(tick);')==1
          assert html.count('const nextPoint=location(')==1
          data=html.encode('utf8')
          m['finalBytes']=len(data)
          m['finalSha256']=hashlib.sha256(data).hexdigest()
          p.write_text(json.dumps(m,indent=2)+'\n',encoding='utf8')
          print('V11_261_SOURCE_RECEIPT',len(data),m['finalSha256'])
          PY
      - name: Build and verify the complete release package
        run: python3 projects/swrlz-forge-moba/scripts/verify_v11_261_release.py --output /tmp/swyrl-forge-261
