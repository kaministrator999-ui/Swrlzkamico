name: Preflight §C guest session reload restore
on:
  push:
    branches: [main]
    paths:
      - scripts/hf_guest_thread_restore_v1.py
      - .github/workflows/hf-guest-thread-restore-preflight.yml
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m pip install --quiet 'huggingface_hub>=0.34,<2'
      - run: python -m py_compile scripts/hf_guest_thread_restore_v1.py
      - name: Pin live HF Chat source and test exact guest hydration patch
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u scripts/hf_guest_thread_restore_v1.py preflight
      - name: Check edited UI JavaScript syntax with Node
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          page=Path("reports/guest-reload-restore-v1/after/chat/§wyrlz/index.html").read_text()
          scripts=[match.group(1) for match in re.finditer(r'<script\b[^>]*>([\s\S]*?)</script\s*>',page,re.I) if match.group(1).strip()]
          if len(scripts)!=1:raise SystemExit("Expected one exact inline Chat script; found "+str(len(scripts)))
          Path("/tmp/swrlz-chat-guest-hydration-check.js").write_text(scripts[0])
          PY
          node --check /tmp/swrlz-chat-guest-hydration-check.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guest-thread-restore-source-${{ github.run_id }}
          path: reports/guest-reload-restore-v1/
          retention-days: 30
          if-no-files-found: ignore
