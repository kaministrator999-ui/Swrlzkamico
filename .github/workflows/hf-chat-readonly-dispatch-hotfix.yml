name: §C read-only dispatcher hotfix
on:
  pull_request:
    paths:
      - api/execution_continuity_v1.py
      - tests/test_execution_continuity_v1.py
      - scripts/hf_chat_readonly_dispatch_hotfix.py
      - .github/workflows/hf-chat-readonly-dispatch-hotfix.yml
  push:
    branches: [main]
    paths:
      - api/execution_continuity_v1.py
      - tests/test_execution_continuity_v1.py
      - scripts/hf_chat_readonly_dispatch_hotfix.py
      - .github/workflows/hf-chat-readonly-dispatch-hotfix.yml
permissions: {contents: read}
concurrency:
  group: swrlz-execution-continuity-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet 'huggingface_hub>=0.34,<2'
      - name: Validate read-only request routing and checkpoint continuity
        run: |
          python -m py_compile api/execution_continuity_v1.py scripts/hf_chat_readonly_dispatch_hotfix.py
          python -m unittest discover -s tests -p 'test_execution_continuity_v1.py' -v
          python -m unittest discover -s tests -p 'test_html_project_context_v1.py' -v
          python scripts/hf_chat_readonly_dispatch_hotfix.py selftest
      - name: Check exact current Space Station source and safe patch anchoring
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/hf_chat_readonly_dispatch_hotfix.py preflight
      - name: Publish scoped same-Space runtime update
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release-readonly-dispatch-hotfix]')
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SWRLZ_EXECUTION_CONTINUITY_APPROVED: '1'
        run: python -u scripts/hf_chat_readonly_dispatch_hotfix.py publish
