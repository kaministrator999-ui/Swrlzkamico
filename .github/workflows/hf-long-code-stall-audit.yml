name: Audit §C long-running code generation stalls and checkpoint cancellation
on:
  push:
    branches: [main]
    paths: [".github/workflows/hf-long-code-stall-audit.yml"]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - run: python -m pip install 'huggingface_hub>=0.34,<2'
      - shell: bash
        run: |
          python - <<'PY'
          import ast,json,re
          from pathlib import Path
          from huggingface_hub import HfApi,hf_hub_download
          api=HfApi();repo="kamiloki/Swyrlz";rev=api.repo_info(repo,repo_type="space").sha
          print("STALL_AUDIT_REV",rev,flush=True)
          for name in ("qwen_coder_engine.py","station.py"):
              lines=Path(hf_hub_download(repo,name,repo_type="space",revision=rev)).read_text().splitlines()
              tree=ast.parse("\n".join(lines))
              funcs=[{"name":node.name,"line":node.lineno,"end":node.end_lineno}
                    for node in ast.walk(tree) if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef))
                    and any(q in node.name.lower() for q in ("generate","candidate","checkpoint","worker","cancel","stream","sync","completion"))]
              print("STALL_AUDIT_FUNCTIONS",json.dumps({"file":name,"defs":funcs[:95]}),flush=True)
              for i,line in enumerate(lines):
                  if re.search(r"max_segments|540|timeout|time\.perf_counter|CODE_DRAFT_SAVED|CODE_OUTPUT_CHECKPOINT|candidate_attempts|attempt_count|repair_number|_lock|_infer|worker|HEARTBEAT|_swrlz_code_candidate_preview|CANDIDATE_PREVIEW_DELTA|cancel_event|stop_event|cancelled|deadline|threading\.Thread|codeContinuation|_commit_revision|SOURCE_HASH_CONFLICT",line,re.I):
                      if name=="station.py" and i>3000:continue
                      lo=max(0,i-2);hi=min(len(lines),i+4)
                      print("STALL_AUDIT_MATCH",json.dumps({"file":name,"line":i+1,
                        "context":"\n".join(f"{j+1} {lines[j]}" for j in range(lo,hi))},ensure_ascii=False),flush=True)
          print("STALL_AUDIT_COMPLETE",flush=True)
          PY
