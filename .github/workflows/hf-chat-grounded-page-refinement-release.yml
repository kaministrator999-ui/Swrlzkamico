name: Guarded §C grounded HTML-page follow-up intent release
on:
  push:
    branches: [main]
    paths: [".deploy/HF_CHAT_GROUNDED_PAGE_REFINEMENT_REQUEST.txt"]
permissions:
  contents: read
concurrency:
  group: swrlz-hf-space-deployment
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
      - name: Validate precise user authorization and pinned source
        id: approved
        shell: bash
        run: |
          set -euo pipefail
          request=.deploy/HF_CHAT_GROUNDED_PAGE_REFINEMENT_REQUEST.txt
          test -f "$request"
          get() { sed -n "s/^$1=//p" "$request" | tail -n 1; }
          test "$(get TARGET)" = "kamiloki/Swyrlz"
          test "$(get APPROVED)" = "1"
          test "$(get CHANGE_SCOPE)" = "grounded-existing-code-page-refinement-routing-only"
          test "$(get MODEL)" = "qwen3.5-9b"
          test "$(get CONTEXT_TOKENS)" = "16384"
          test "$(get THREADS)" = "18"
          ref="$(get SOURCE_REF)"
          nonce="$(get REQUEST_NONCE)"
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          [[ "$nonce" =~ ^[a-z0-9-]{12,96}$ ]]
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.approved.outputs.ref }}
          path: release-source
          fetch-depth: 1
      - run: python -m pip install 'huggingface_hub>=0.34,<2'
      - name: Preflight current exact source plus full multi-turn classifier
        working-directory: release-source
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          python -m py_compile scripts/hf_chat_grounded_page_refinement_v1.py
          python -u scripts/hf_chat_grounded_page_refinement_v1.py preflight
      - uses: actions/upload-artifact@v4
        with:
          name: swrlz-grounded-page-refinement-exact-prior-source
          path: release-source/swrlz-grounded-page-intent-backup/
          retention-days: 14
          if-no-files-found: error
      - name: Publish one-file source change then verify two-turn real HTML conversation; rollback on failure
        working-directory: release-source
        shell: bash
        timeout-minutes: 37
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SWRLZ_IMPROVE_PAGE_APPROVED: "1"
        run: |
          set -euo pipefail
          python -u scripts/hf_chat_grounded_page_refinement_v1.py publish
          echo "SWRLZ_GROUNDED_PAGE_REFINEMENT_LIVE_VERIFIED"
