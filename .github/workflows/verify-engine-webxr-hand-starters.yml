name: Verify §E v11.358 WebXR reference hand source
on:
  push:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/patches/v11_358_webxr_hand_starters.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check native hand runtime syntax
        run: node --check projects/swrlz-forge-moba/runtime/webxr_reference_hand_starters_v11_358.js
      - name: Compute new source integrity and validate the two native hand assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib,json,sys
          root=Path('projects/swrlz-forge-moba')
          sys.path.insert(0,str(root.resolve()))
          import build_space
          manifest=json.loads((root/'source-manifest.json').read_text('utf8'))
          assert manifest['name']=='§wyrl§ Engine v11.358'
          assert len(manifest['patches'])==366
          assert manifest['patches'][-1]=='patches/v11_358_webxr_hand_starters.py'
          compressed=''.join((root/p).read_text('utf8').strip() for p in manifest['chunks'])
          base=gzip.decompress(base64.b64decode(compressed))
          assert hashlib.sha256(base).hexdigest()==manifest['baseSha256']
          html=base.decode('utf8')
          for rel in manifest['patches']:
              html=build_space.load_patch(root/rel)(html)
          blob=html.encode('utf8')
          for needle in ['data-project-template="webxr-hand-left"','data-project-template="webxr-hand-right"',
                         "window.SWRLZ_FORGE_BUILD={version:'v11.358'",
                         'SWYRL_ENGINE_DEPLOY_MARKER: V11_358_WEBXR_HAND_STARTERS']:
              assert needle in html,needle
          import collections
          for side in ('left','right'):
              asset=json.loads((root/f'assets/models/webxr-hands/{side}.json').read_text('utf8'))
              mesh=asset['mesh']
              assert asset['schema']=='swrlz-webxr-reference-hand-v1' and asset['side']==side
              assert len(mesh['positions'])==4080 and len(mesh['uvs'])==2720 and len(mesh['indices'])==6942
              assert len(asset['joints'])==25 and len(set(x['name'] for x in asset['joints']))==25
              assert min(mesh['indices'])>=0 and max(mesh['indices'])<1360
              assert all(len(set(mesh['indices'][i:i+3]))==3 for i in range(0,len(mesh['indices']),3))
          license=(root/'assets/models/webxr-hands/LICENSE.md').read_text('utf8')
          assert 'MIT License' in license and 'Copyright (c) 2019 Amazon' in license
          print('SEAL_V358 '+json.dumps({'bytes':len(blob),'sha256':hashlib.sha256(blob).hexdigest(),
                   'patches':len(manifest['patches']),'nativeHandAssets':2,'jointsPerHand':25}))
          PY
