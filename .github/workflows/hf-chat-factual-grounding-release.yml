name: Guarded §C researched-fact accuracy release
on:
  push:
    branches: [main]
    paths: [".deploy/HF_CHAT_FACTUAL_GROUNDING_RELEASE_REQUEST.txt"]
permissions: {contents: read}
concurrency:
  group: swrlz-hf-space-deployment
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact immutable owner-authorized §C release target
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          p=.deploy/HF_CHAT_FACTUAL_GROUNDING_RELEASE_REQUEST.txt
          test -f "$p"
          get() { sed -n "s/^$1=//p" "$p" | tail -n 1; }
          test "$(get TARGET)" = "kamiloki/Swyrlz"
          test "$(get APPROVED)" = "1"
          test "$(get MODEL)" = "qwen3.5-9b"
          test "$(get FEATURE)" = "fact-checked-public-research-v1"
          ref="$(get SOURCE_REF)"
          nonce="$(get REQUEST_NONCE)"
          [[ "$ref" =~ ^[a-f0-9]{40}$ ]]
          [[ "$nonce" =~ ^[a-z0-9-]{12,96}$ ]]
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.guard.outputs.ref }}
          path: reviewed-source
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install existing Hugging Face SDK
        run: python -m pip install --quiet "huggingface_hub>=0.34,<2"
      - name: Validate claim tests, source scope and Python syntax
        working-directory: reviewed-source
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_hf_factual_grounding_v1.py' -v
          python -m py_compile scripts/hf_chat_factual_grounding_v1.py api/factual_claim_guard_v1.py api/selective_retrieval.py
      - name: Publish guarded existing-Space change, verify running SHA and factual live answer
        working-directory: reviewed-source
        timeout-minutes: 35
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SWRLZ_FACTUAL_GROUNDING_DEPLOY_APPROVED: "1"
        run: |
          set -euo pipefail
          python -u scripts/hf_chat_factual_grounding_v1.py --deploy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swrlz-factual-claim-gate-exact-source-rollback
          path: reviewed-source/swrlz-factual-source-rollback/
          retention-days: 14
          if-no-files-found: warn