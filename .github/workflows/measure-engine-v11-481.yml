name: Measure §E v11.481 painted UV fidelity working copies

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/measure-engine-v11-481.yml"
      - "projects/swrlz-forge-moba/patches/v11_481_textured_editable_copy.py"
      - "projects/swrlz-forge-moba/runtime/model_textured_editable_copy_v11_481.js"
      - "projects/swrlz-forge-moba/scripts/prepare_v11_481_release.py"
      - "projects/swrlz-forge-moba/scripts/verify_v11_481_release.py"
      - "projects/swrlz-forge-moba/tests/model_textured_editable_copy_v11_481.mjs"
      - "projects/swrlz-forge-moba/tests/model_textured_editable_copy_browser_v11_481.cjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: se481-textured-source-measure
  cancel-in-progress: true

jobs:
  textured-copy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build, calculate SHA256 and verify 458 native-source patches
        run: python projects/swrlz-forge-moba/scripts/prepare_v11_481_release.py
      - name: Install Chromium touch browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps --only-shell chromium
      - name: Test real UV-painted mesh, preserved seam coordinates, native ring editing and original-model recovery
        run: node projects/swrlz-forge-moba/tests/model_textured_editable_copy_browser_v11_481.cjs projects/swrlz-forge-moba/_release_v11_481_candidate
      - name: Seal verified source SHA and bytes to main
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'Source moved; rebuild on latest main before sealing'; exit 1; }
          git add projects/swrlz-forge-moba/source-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "§E v11.481: seal Chromium-verified textured topology source"
            git push origin HEAD:main
          fi
      - name: Preserve exact source receipt and viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: se481-textured-source-receipt
          path: |
            projects/swrlz-forge-moba/source-manifest.json
            projects/swrlz-forge-moba/_release_v11_481_candidate/se481-*.png
