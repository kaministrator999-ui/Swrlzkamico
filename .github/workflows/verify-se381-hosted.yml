name: Verify §E v11.381 hosted Space receipt

on:
  push:
    branches: [fix/sheep-xr-guest-sync-381]
    paths: ['.github/workflows/verify-se381-hosted.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Verify hosted SOURCE and canonical static pages
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,json,hashlib,time
          expected='10d562b9eecfd12a8bd967ce393d1018d1a6aeaaad11a753207f1c87e845e33a'
          static='https://kamiloki-swrlz-forge-moba.static.hf.space/'
          repo='https://huggingface.co/spaces/kamiloki/swrlz-forge-moba/resolve/main/'
          def get(url):
            with urllib.request.urlopen(url,timeout=80) as resp:return resp.read()
          last=None
          for attempt in range(7):
            try:
              receipt=json.loads(get(static+'SOURCE.json'))
              if receipt.get('sourceVersion')=='§wyrl§ Engine v11.381' and receipt.get('finalSha256')==expected:break
              last=receipt.get('sourceVersion')
            except Exception as error:last=repr(error)
            print('HOSTED_WAIT',last,flush=True);time.sleep(5)
          assert receipt['sourceVersion']=='§wyrl§ Engine v11.381',receipt
          assert receipt['finalSha256']==expected
          assert receipt['finalBytes']==9530598
          assert len(receipt['patches'])==388
          print('HOSTED_SOURCE_VERIFIED',receipt['sourceVersion'],len(receipt['patches']),flush=True)
          for name in ('index.html','modeler.html'):
            original=get(repo+name);served=get(static+name)
            sha=hashlib.sha256(original).hexdigest()
            assert sha==expected and len(original)==9530598,(name,len(original),sha)
            first=0
            while first<len(original) and first<len(served) and original[first]==served[first]:first+=1
            tail=0
            while tail<len(original)-first and original[-tail-1]==served[-tail-1]:tail+=1
            assert first+tail==len(original),(name,first,tail,len(original))
            injection=served[first:len(served)-tail]
            assert b'window.huggingface' in injection and b'og:title' in injection,(name,repr(injection[:150]))
            print('HOSTED_PAGE_VERIFIED',name,len(original),sha,'hfMetaBytes',len(injection),flush=True)
          homepage=get(static)
          index=get(static+'index.html')
          assert homepage==index
          meta=json.loads(get('https://huggingface.co/api/spaces/kamiloki/swrlz-forge-moba/runtime'))
          assert meta.get('stage')=='RUNNING',meta
          print('SE381_STATIC_SPACE_RUNNING_AND_VERIFIED',flush=True)
          PY
