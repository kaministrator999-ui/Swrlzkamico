name: Measure §E v11.66 selection UX once
on:
  push:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/patches/v11_66_selection_ux.py"
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build once, measure sealed HTML and check JS syntax
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,gzip,hashlib,importlib.util,json
          from pathlib import Path
          root=Path('projects/swrlz-forge-moba')
          mf=json.loads((root/'source-manifest.json').read_text())
          html=gzip.decompress(base64.b64decode(''.join((root/f).read_text().strip() for f in mf['chunks']))).decode('utf-8')
          for n,rel in enumerate(mf['patches']+['patches/v11_66_selection_ux.py']):
              spec=importlib.util.spec_from_file_location('patch'+str(n),root/rel)
              mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
              html=mod.apply(html)
          data=html.encode('utf-8')
          print('SWRLZ_V1166_FINAL_BYTES='+str(len(data)),flush=True)
          print('SWRLZ_V1166_FINAL_SHA256='+hashlib.sha256(data).hexdigest(),flush=True)
          print('SWRLZ_V1166_PATCH_COUNT='+str(len(mf['patches'])+1),flush=True)
          assert html.count('SWYRL_ENGINE_DEPLOY_MARKER: V11_66_MESH_SELECTION_UX_REPAIR')==1
          assert 'function atelierMeshDialogInstall()' in html
          assert 'atelierMeshHistoryShortcut' in html
          assert 'Native Model Atelier already renders a selection BoxHelper' in html
          assert 'atelierMeshClamp(pixels*.0009*Math.min(orbit.distance,8),-.45,.45)' in html
          Path('/tmp/swyrl-v1166.mjs').write_text(html.split('<script type="module">',1)[1].rsplit('</script>',1)[0])
          PY
          node --check /tmp/swyrl-v1166.mjs
          echo SWRLZ_V1166_TARGETED_JS_SYNTAX_PASS
