name: Model-Guided Project Manifest v189

on:
  push:
    branches:
      - feature/coder-manifest-planner-v1
    paths:
      - "hf_space/project_manifest.py"
      - "hf_space/staged_workspaces.py"
      - "hf_space/station.py"
      - "hf_space/qwen_coder_engine.py"
      - "chat/§wyrlz/index.html"
      - "hf_space/test_project_manifest_v189.py"
      - "hf_space/test_project_manifest_http_v189.py"
      - ".github/workflows/verify-project-manifest-v189.yml"

permissions:
  contents: read

concurrency:
  group: swrlz-project-manifest-v189
  cancel-in-progress: false

jobs:
  plan-preview-and-project:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Source and parser syntax
        run: |
          set -euo pipefail
          python -m py_compile \
            hf_space/project_manifest.py \
            hf_space/staged_workspaces.py \
            hf_space/station.py \
            hf_space/qwen_coder_engine.py \
            hf_space/test_project_manifest_v189.py \
            hf_space/test_project_manifest_http_v189.py
          PYTHONPATH=hf_space python hf_space/test_project_manifest_v189.py
          PYTHONPATH=hf_space python hf_space/test_staged_workspaces_v185.py
          PYTHONPATH=hf_space python hf_space/test_code_packages_v184.py
      - name: Chat script and planning UI contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          src=Path("chat/§wyrlz/index.html").read_text(encoding="utf-8")
          for term in ("planProjectButton","addProjectPlanAction(node,thread,msg)",
                       "Review project plan","swrlz-project-manifest-v1",
                       "plan/approve","fillNextPlannedFile"):
              assert term in src,term
          scripts=re.findall(r'<script\b[^>]*>([\s\S]*?)</script\s*>',src,re.I)
          for i,body in enumerate(scripts):
              if body.strip():Path(f"/tmp/swrlz-manifest-inline-{i}.js").write_text(body,encoding="utf-8")
          print("PROJECT_PLAN_UI_SCRIPTS_EXTRACTED",len(scripts))
          PY
          for file in /tmp/swrlz-manifest-inline-*.js; do node --check "$file"; done
      - name: Same-session HTTP manifest approval
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'fastapi>=0.115,<1' 'httpx>=0.27,<1'
          PYTHONPATH=hf_space python hf_space/test_project_manifest_http_v189.py
          PYTHONPATH=hf_space python hf_space/test_staged_workspaces_http_v185.py
          PYTHONPATH=hf_space python hf_space/test_code_packages_http_v184.py
