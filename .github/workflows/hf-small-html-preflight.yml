name: Preflight §C compact HTML output budget
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hf-small-html-preflight.yml'
      - 'scripts/hf_small_html_output_budget_v1.py'
permissions: {contents: read}
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet 'huggingface_hub>=0.34,<2'
      - run: python -m py_compile scripts/hf_small_html_output_budget_v1.py
      - name: Verify exact live coder source, preserve snapshot and regression cases
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u scripts/hf_small_html_output_budget_v1.py preflight
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: short-html-preflight-${{ github.run_id }}
          path: reports/swrlz-small-html-budget/
          retention-days: 21
          if-no-files-found: ignore
