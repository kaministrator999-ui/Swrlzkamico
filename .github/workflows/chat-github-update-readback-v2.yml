name: §C GitHub UPDATE_FILE readback fix
on:
  push:
    branches: [fix/github-update-readback-v2]
    paths:
      - 'api/github_review_update_v1.py'
      - 'tests/test_github_review_update_v1.py'
      - 'scripts/hf_github_update_readback_release_v2.py'
      - '.github/workflows/chat-github-update-readback-v2.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet requests 'huggingface_hub>=0.34,<2'
      - run: python -m py_compile api/github_review_update_v1.py scripts/hf_github_update_readback_release_v2.py tests/test_github_review_update_v1.py
      - run: python -m unittest discover -s tests -p test_github_review_update_v1.py -v
      - run: python scripts/hf_github_update_readback_release_v2.py verify
