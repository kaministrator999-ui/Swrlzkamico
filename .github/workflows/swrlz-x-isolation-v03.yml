name: §X isolation capability v0.4
on:
  push:
    branches: [feat/swrlz-x-isolation-v03]
    paths:
      - 'projects/swrlz-execution/app.py'
      - '.github/workflows/swrlz-x-isolation-v03.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    if: github.ref == 'refs/heads/feat/swrlz-x-isolation-v03'
    concurrency:
      group: swrlz-execution-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet 'huggingface_hub>=0.34,<2' 'requests>=2.31,<3'
      - name: Deploy only §X isolation probe; collect actual runtime evidence
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m py_compile projects/swrlz-execution/app.py
          python -u - <<'PY'
          import os, json, time, re, hashlib, ast
          from pathlib import Path
          import requests
          from huggingface_hub import HfApi, CommitOperationAdd, hf_hub_download
          target="kamiloki/swrlz-execution"
          api=HfApi(token=os.environ["HF_TOKEN"])
          old=api.repo_info(target,repo_type="space").sha
          local=Path("projects/swrlz-execution/app.py")
          tree=ast.parse(local.read_text())
          for node in tree.body:
              if isinstance(node,ast.Assign) and any(isinstance(t,ast.Name) and t.id in ("_COMBINED_CHILD","_LANDLOCK_CHILD") for t in node.targets):
                  compile(ast.literal_eval(node.value),"<trusted diagnostic child>","exec")
          current=Path(hf_hub_download(target,"app.py",repo_type="space",revision=old,token=os.environ["HF_TOKEN"])).read_bytes()
          if b"def remote_probe(" not in current:
              raise RuntimeError("X_SOURCE_DRIFT")
          if current != local.read_bytes():
              revision=api.create_commit(repo_id=target,repo_type="space",revision="main",parent_commit=old,operations=[CommitOperationAdd(path_in_repo="app.py",path_or_fileobj=local)],commit_message="§X v0.4 combined Landlock browser probe").oid
          else:
              revision=old
          assert Path(hf_hub_download(target,"app.py",repo_type="space",revision=revision,token=os.environ["HF_TOKEN"])).read_bytes()==local.read_bytes()
          print("X_PROBE_SOURCE_READBACK_PASS",revision,flush=True)
          url="https://kamiloki-swrlz-execution.hf.space/gradio_api/call/swrlz_combined_v04"
          for attempt in range(30):
              try:
                  r=requests.post(url,json={"data":[]},timeout=15,allow_redirects=False)
                  if r.status_code!=200: raise RuntimeError("HTTP_"+str(r.status_code))
                  event=r.json()["event_id"]
                  assert re.fullmatch(r"[0-9a-f]{32}",event)
                  with requests.get(url+"/"+event,timeout=(10,210),stream=True,allow_redirects=False) as stream:
                      stream.raise_for_status()
                      kind=""
                      for line in stream.iter_lines():
                          if line.startswith(b"event:"):kind=line[6:].strip().decode()
                          elif line.startswith(b"data:") and kind=="complete":
                              data=json.loads(line[5:].strip())[0]
                              assert data["schema"]=="swrlz-x-combined-v04"
                              assert data.get("probeSourceSha256")==hashlib.sha256(local.read_bytes()).hexdigest(), "STALE_RUNNING_SOURCE"
                              assert data["candidateExecutionEnabled"] is False and data["isolationVerified"] is False
                              if data["status"]=="BUSY":raise RuntimeError("BUSY")
                              status=str(data.get("status","UNVERIFIED"))
                              compatible=status=="FIXTURE_COMPATIBLE" and data.get("browserChecksPassed") is True
                              receipt=Path("swrlz-combined-receipt.json")
                              receipt.write_text(json.dumps(data,indent=2,sort_keys=True)+"\n")
                              with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as summary:
                                  summary.write("## §X runtime capability receipt\n\n")
                                  summary.write("Diagnostic collection: **PASS**\\n\\n".replace("\\n","\n"))
                                  summary.write("Trusted fixture compatibility: **"+("PASS" if compatible else "BLOCKED")+"**\n\n")
                                  summary.write("Candidate execution: **DISABLED**\n\n")
                                  summary.write("Source SHA-256: `"+data["probeSourceSha256"]+"`\n\n")
                                  summary.write("See attached JSON receipt for exact stage and failure details. A successful diagnostic run is not proof of isolation.\n")
                              print("X_COMBINED_BROWSER_EVIDENCE",json.dumps(data,sort_keys=True),flush=True)
                              print("CANDIDATE_EXECUTION_REMAINS_DISABLED",flush=True)
                              raise SystemExit(0)
                  raise RuntimeError("NO_RECEIPT")
              except Exception as exc:
                  if attempt==29:raise RuntimeError("X_COMBINED_PROBE_UNVERIFIED") from exc
                  if attempt%4==0:print("X_PROBE_PENDING",type(exc).__name__,flush=True)
                  time.sleep(8)
          PY
      - name: Upload runtime diagnostic receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: swrlz-combined-receipt
          path: swrlz-combined-receipt.json
          if-no-files-found: error
          retention-days: 14
