name: §C two-user intent evaluation pilot

on:
  push:
    branches: [main]
    paths:
      - 'scripts/eval_chat_pilot.py'
      - 'docs/engineering/SWRLZ_CHAT_EVALUATION_PILOT.md'
      - '.github/workflows/chat-eval-pilot.yml'
      - '.acceptance/CHAT_EVAL_LIVE_REQUEST.txt'
  pull_request:
    paths:
      - 'scripts/eval_chat_pilot.py'
      - 'docs/engineering/SWRLZ_CHAT_EVALUATION_PILOT.md'
      - '.github/workflows/chat-eval-pilot.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Smoke validates the harness; live evaluates two authenticated §C test accounts'
        type: choice
        required: true
        default: smoke
        options:
          - smoke
          - live

permissions:
  contents: read

concurrency:
  group: swrlz-chat-eval-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Select evaluation mode
        id: eval_mode
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          ONE_TIME_LIVE_REQUEST: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[chat-eval-live]') }}
        run: |
          set -euo pipefail
          mode=smoke
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            mode="${REQUESTED_MODE:-smoke}"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$ONE_TIME_LIVE_REQUEST" == "true" ]]; then
            mode=live
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Selected mode: $mode"
      - name: Verify two dedicated test sessions are configured
        if: steps.eval_mode.outputs.mode == 'live'
        env:
          EVAL_A: ${{ secrets.SWRLZ_EVAL_SESSION_A }}
          EVAL_B: ${{ secrets.SWRLZ_EVAL_SESSION_B }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$EVAL_A" || -z "$EVAL_B" ]]; then
            echo "::error::Live evaluation blocked: configure SWRLZ_EVAL_SESSION_A and SWRLZ_EVAL_SESSION_B as two different dedicated test account session values in Actions secrets."
            exit 1
          fi
          if [[ "$EVAL_A" == "$EVAL_B" ]]; then
            echo "::error::Live evaluation blocked: test account sessions must be distinct."
            exit 1
          fi
          echo "Test session secrets are configured (values not printed)."
      - name: Validate evaluation script syntax
        run: python -m py_compile scripts/eval_chat_pilot.py
      - name: Install isolated Chromium evaluator
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run two-user harness smoke (no secrets)
        if: steps.eval_mode.outputs.mode == 'smoke'
        run: python scripts/eval_chat_pilot.py --mode smoke
      - name: Run two-user authenticated live evaluation
        if: steps.eval_mode.outputs.mode == 'live'
        env:
          SWRLZ_EVAL_SESSION_A: ${{ secrets.SWRLZ_EVAL_SESSION_A }}
          SWRLZ_EVAL_SESSION_B: ${{ secrets.SWRLZ_EVAL_SESSION_B }}
        run: python scripts/eval_chat_pilot.py --mode live
      - name: Publish evaluation summary
        if: always()
        run: |
          if [ -f reports/chat-eval-pilot/summary.md ]; then
            cat reports/chat-eval-pilot/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-eval-pilot-${{ github.run_id }}
          path: reports/chat-eval-pilot/
          retention-days: 14
          if-no-files-found: ignore
