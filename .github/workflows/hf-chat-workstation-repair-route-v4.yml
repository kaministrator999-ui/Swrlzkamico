name: Inspect live §C Workstation repair routing
on:
  pull_request:
    paths:
      - 'scripts/audit_hf_workstation_project_repair_v4.py'
      - '.github/workflows/hf-chat-workstation-repair-route-v4.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet 'huggingface_hub>=0.34,<2'
      - name: Inspect actual deployed Station and Workstation source (read-only)
        run: python -u scripts/audit_hf_workstation_project_repair_v4.py sections
