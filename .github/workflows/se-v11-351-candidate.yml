name: §E v11.351 sealed quick-actions verification
on:
  pull_request:
    paths:
      - 'projects/swrlz-forge-moba/**'
      - '.github/workflows/se-v11-351-candidate.yml'
permissions:
  contents: read
jobs:
  sealed-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Strictly verify source seal, assets, release identity and inline scripts
        run: |
          python projects/swrlz-forge-moba/scripts/verify_v11_351_release.py --output /tmp/se351-sealed
          python -m py_compile projects/swrlz-forge-moba/patches/v11_351_game_quick_actions.py
