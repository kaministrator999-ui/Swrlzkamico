name: §E v11.380 sealed source verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'projects/swrlz-forge-moba/**'
      - '.github/workflows/preview-se380-source-digest.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact full source build and focused regressions
        run: python projects/swrlz-forge-moba/scripts/verify_v11_380_release.py --output dist/se380-candidate
