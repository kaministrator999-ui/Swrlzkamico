name: Read-only §C live activity pipeline audit
on:
  push:
    branches: [main]
    paths: [".github/workflows/hf-chat-activity-audit.yml"]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: python -m pip install --quiet "huggingface_hub>=0.34,<2"
      - name: Inspect running frontend and Station event seams
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          from huggingface_hub import HfApi,hf_hub_download
          S="kamiloki/Swyrlz";api=HfApi();r=api.repo_info(S,repo_type="space").sha
          print("SWRLZ_ACTIVITY_SOURCE_REV",r)
          searches={
            "chat/§wyrlz/index.html":[
              r"stationGeneration",r"activity",r"\bstatusTrail\b",r"statusTimeline",
              r"STATUS",r"messageList",r"renderMessage",r"renderMessages",
              r"renderChat",r"function render",r"trace",r"reason",r"phase",
              r"function applyStation",r"function syncStation",r"COMPLETE",
            ],
            "station.py":[
              r"def _.*stream",r"def _.*event",r"def _.*status",r"def _.*snapshot",
              r"\bSTATUS\b",r"statusTrail",r"status\]\.",r"g\[\"status\"\]",
              r"yield.*type",r"\bONLINE",r"research"
            ],
          }
          for name,patterns in searches.items():
            data=Path(hf_hub_download(S,name,revision=r,repo_type="space")).read_text()
            lines=data.splitlines()
            hits=[(i+1,line.strip()[:150]) for i,line in enumerate(lines)
                  if any(re.search(p,line) for p in patterns)]
            print("SWRLZ_ACTIVITY_FILE",json.dumps({"path":name,"lineCount":len(lines),
              "matches":hits[:125]},ensure_ascii=False))
            if name.endswith("index.html"):
              for a,b in [(3980,4050),(4110,4230),(4300,4470),(4480,4620)]:
                if a>len(lines):continue
                print("SWRLZ_ACTIVITY_WINDOW",json.dumps({"path":name,"start":a,
                  "lines":[str(i+1)+" "+lines[i][:310] for i in range(a-1,min(b,len(lines)))]},ensure_ascii=False))
            else:
              for i,line in enumerate(lines):
                if "g[\"status\"].append" in line or "status.append" in line or "kind==\"STATUS\"" in line:
                  a=max(0,i-5);b=min(len(lines),i+10)
                  print("SWRLZ_ACTIVITY_SITE",json.dumps({"line":i+1,
                    "lines":[str(j+1)+" "+lines[j][:240] for j in range(a,b)]},ensure_ascii=False))
          PY
