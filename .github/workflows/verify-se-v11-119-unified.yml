name: §E v11.119 unified movable modes preflight
on:
  push:
    branches: [feature/atelier-unified-mode-inspector-v11-119]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify official sealed v11.119 source and assembled JavaScript
        run: |
          python projects/swrlz-forge-moba/scripts/verify_v11_119_release.py --output /tmp/se-v11119-release
          cp /tmp/se-v11119-release-module.mjs /tmp/se-v11119.mjs
          node --check /tmp/se-v11119.mjs
      - name: Run unified settings and prior interaction regressions
        run: |
          node projects/swrlz-forge-moba/tests/model_atelier_unified_modes_v11_119.mjs
          npm install --no-save --no-package-lock three@0.160.1
          cp /tmp/se-v11119.mjs /tmp/se-v11116.mjs
          cp /tmp/se-v11119.mjs /tmp/se-v11118.mjs
          node projects/swrlz-forge-moba/tests/model_atelier_camera_precision_v11_116.mjs
          node projects/swrlz-forge-moba/tests/model_atelier_precision_gizmos_v11_114.mjs
          node projects/swrlz-forge-moba/tests/model_atelier_preview_selection_v11_115.mjs
          node projects/swrlz-forge-moba/tests/model_atelier_semantic_tools_v11_118.mjs
          node projects/swrlz-forge-moba/tests/model_atelier_callout_guard_v11_117.mjs

