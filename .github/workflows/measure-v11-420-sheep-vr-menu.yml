name: Measure §E v11.420 Sheep Tag VR menu interaction candidate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/measure-v11-420-sheep-vr-menu.yml'
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Test VR menu click consistency and measure v11.420 source
        run: |
          set -eu
          ROOT=projects/swrlz-forge-moba
          node --check "$ROOT/runtime/sheep_setup_menu_controls_v11_420.js"
          node "$ROOT/tests/test_sheep_setup_menu_controls_v11_420.cjs"
          node "$ROOT/tests/test_sheep_flock_setup_v11_416.cjs"
          python -m py_compile "$ROOT/patches/v11_420_sheep_setup_menu_controls.py"
          python "$ROOT/build_space.py" --output /tmp/se419-base >/tmp/se419-source.json
          python - <<'PY'
          from pathlib import Path
          import hashlib,importlib.util,json,subprocess,sys
          root=Path('projects/swrlz-forge-moba')
          patch=root/'patches/v11_420_sheep_setup_menu_controls.py'
          spec=importlib.util.spec_from_file_location('se420',patch)
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          before=Path('/tmp/se419-base/index.html').read_text('utf8')
          candidate=module.apply(before).encode('utf8')
          Path('/tmp/se420-candidate.html').write_bytes(candidate)
          print('SE420_CANDIDATE_BYTES='+str(len(candidate)),flush=True)
          print('SE420_CANDIDATE_SHA256='+hashlib.sha256(candidate).hexdigest(),flush=True)
          mp=root/'source-manifest.json'
          m=json.loads(mp.read_text('utf8'))
          assert m['name']=='§wyrl§ Engine v11.419' and len(m['patches'])==400
          m.update(name='§wyrl§ Engine v11.420',finalArtifact='swyrl_engine_v11_420.html',
                   finalBytes=0,finalSha256='')
          m['patches'].append('patches/v11_420_sheep_setup_menu_controls.py')
          mp.write_text(json.dumps(m,indent=2)+'\n','utf8')
          subprocess.run([sys.executable,str(root/'build_space.py'),'--output','/tmp/se420-full'],check=True,stdout=subprocess.DEVNULL)
          full=Path('/tmp/se420-full/index.html').read_bytes()
          print('SE420_FULL_BYTES='+str(len(full)),flush=True)
          print('SE420_FULL_SHA256='+hashlib.sha256(full).hexdigest(),flush=True)
          assert b'SWYRL_ENGINE_SHEEP_SETUP_MENU_420' in full
          PY
          python "$ROOT/scripts/check_inline_js_syntax_v11_266.py" /tmp/se420-candidate.html
