name: §E v11.195 Quest Sheep VR stability and existing gameplay
on:
  push:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/source-manifest.json"
      - "projects/swrlz-forge-moba/patches/v11_195_quest_sheep_stability_radial.py"
      - "projects/swrlz-forge-moba/runtime/engine_xr_sheep_stability_v11_195.js"
      - "projects/swrlz-forge-moba/tests/test_v11_195_quest_stability.cjs"
      - "projects/swrlz-forge-moba/scripts/verify_v11_195_release.py"
      - ".github/workflows/measure-se-v11-195.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Quest radial, fog, camera, existing gameplay and XR checks
        run: |
          node --check projects/swrlz-forge-moba/runtime/engine_xr_sheep_stability_v11_195.js
          python -m py_compile projects/swrlz-forge-moba/patches/v11_195_quest_sheep_stability_radial.py
          node projects/swrlz-forge-moba/tests/test_v11_195_quest_stability.cjs
          node projects/swrlz-forge-moba/tests/test_v11_194_emberfall_arpg.cjs
          node projects/swrlz-forge-moba/tests/test_v11_193_sheep_vr.cjs
          node projects/swrlz-forge-moba/tests/test_v11_192_native_vr_editor.cjs
          node projects/swrlz-forge-moba/tests/test_v11_191_xr_recovery.cjs
          node projects/swrlz-forge-moba/tests/test_v11_181_xr_session_lifecycle.cjs
      - name: Strict full v11.195 source integrity
        run: python projects/swrlz-forge-moba/scripts/verify_v11_195_release.py --output /tmp/se195-strict
