name: Deploy §C compact GitHub review and verified receipt UI
on:
  push:
    branches: [improve/chat-github-review-receipt-ui-v1]
    paths: ['.github/workflows/chat-github-review-ui-deploy-v2.yml']
permissions: {contents: read}
concurrency:
  group: swrlz-hf-space-deployment
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet 'huggingface_hub>=0.34,<2'
      - run: node tests/test_chat_github_review_component_v1.mjs
      - run: python scripts/hf_chat_github_review_ui_release_v2.py snapshot
      - name: Publish scoped live UI patch
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SWRLZ_GITHUB_UI_APPROVED: '1'
        run: python -u scripts/hf_chat_github_review_ui_release_v2.py publish
      - run: python scripts/hf_chat_github_review_ui_release_v2.py verify
