name: Author §E UV-First Clean Topology Humanoid
on:
  push:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/RELEASE_AUTHOR_V11_554.json"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: se554-clean-topology-author
  cancel-in-progress: false
jobs:
  author:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install PNG authoring dependency
        run: python -m pip install --quiet "pillow>=10,<13"
      - name: Generate real 3D quad-loop topology and matched UV test atlas
        run: python projects/swrlz-forge-moba/authoring/build_clean_topology_humanoid_v11_554.py
      - name: Validate native geometry, quad loops, UVs and PNG references
        run: |
          python projects/swrlz-forge-moba/scripts/check_clean_topology_humanoid_v11_554.py
          node --check projects/swrlz-forge-moba/runtime/clean_topology_humanoid_v11_554.js
      - name: Commit the verified experimental starter files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/swrlz-forge-moba/scenes/model-atelier-clean-topology-humanoid-v11-554.swyrl.json
          git add projects/swrlz-forge-moba/assets/models/clean-topology-humanoid-v11-554-uv-test.png
          git add projects/swrlz-forge-moba/assets/models/clean-topology-humanoid-v11-554-uv-guide-2048.png
          git add projects/swrlz-forge-moba/docs/qa/clean-topology-humanoid-v11-554.json
          git diff --cached --quiet && exit 0
          git commit -m "asset(engine): publish quad-loop humanoid UV-first starter"
          git pull --rebase origin main
          git push origin HEAD:main
