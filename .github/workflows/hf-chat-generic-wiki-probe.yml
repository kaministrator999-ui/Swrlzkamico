name: Read-only §C generic Wikipedia source discovery probe
on:
  push:
    branches: [main]
    paths: [".github/workflows/hf-chat-generic-wiki-probe.yml"]
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - run: python -m pip install --quiet "huggingface_hub>=0.34,<2"
      - name: Probe live bounded page fetcher against dynamic search and summary endpoints
        run: |
          python - <<'PY'
          from huggingface_hub import HfApi,hf_hub_download
          import importlib.util,json,sys,urllib.parse
          repo="kamiloki/Swyrlz";rev=HfApi().repo_info(repo,repo_type="space").sha
          path=hf_hub_download(repo,"api/online_research.py",repo_type="space",revision=rev)
          spec=importlib.util.spec_from_file_location("swrlz_generic_wiki_probe",path)
          mod=importlib.util.module_from_spec(spec);sys.modules[spec.name]=mod;spec.loader.exec_module(mod)
          urls=[
            "https://en.wikipedia.org/w/rest.php/v1/search/page?q="+urllib.parse.quote("moons of Mars")+"&limit=3",
            "https://en.wikipedia.org/api/rest_v1/page/summary/Moons_of_Mars",
            "https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch="+urllib.parse.quote("moons of Mars")+"&format=json",
          ]
          print("SWRLZ_WIKI_PROBE_REV",rev,flush=True)
          for url in urls:
              try:
                  out=mod._page_fetch(url)
                  print("SWRLZ_WIKI_PROBE "+json.dumps({"url":url,
                      "status":out.get("status"),"finalUrl":out.get("finalUrl"),
                      "keys":sorted(out.keys()),"extract":str(out.get("extract") or "")[:800],
                      "length":len(str(out.get("extract") or ""))}),flush=True)
              except Exception as e:
                  print("SWRLZ_WIKI_PROBE_ERROR "+json.dumps({
                      "url":url,"error":type(e).__name__,"detail":str(e)[:170]}),flush=True)
          PY