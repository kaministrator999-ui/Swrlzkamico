name: §E source integrity candidate receipt
on:
  push:
    paths:
      - 'projects/swrlz-forge-moba/patches/v11_372_model_vr_phase1.py'
      - 'projects/swrlz-forge-moba/runtime/model_vr_phase1_v11_372.js'
      - 'projects/swrlz-forge-moba/source-manifest.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute candidate source receipt without changing committed manifest
        run: |
          cd projects/swrlz-forge-moba
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('source-manifest.json')
          m=json.loads(p.read_text())
          m['finalSha256']=''
          m['finalBytes']=0
          p.write_text(json.dumps(m))
          PY
          python3 build_space.py --output /tmp/se372-candidate
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          data=Path('/tmp/se372-candidate/index.html').read_bytes()
          print("CANDIDATE_FINAL_BYTES="+str(len(data)), flush=True)
          print("CANDIDATE_FINAL_SHA256="+hashlib.sha256(data).hexdigest(), flush=True)
          PY
          node --check runtime/model_vr_phase1_v11_372.js
