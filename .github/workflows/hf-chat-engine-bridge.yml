name: Guarded §C native-startup and image-reference bridge
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hf-chat-engine-bridge.yml"
      - "scripts/hf_chat_engine_bridge_v1_patch.py"
      - "scripts/hf_chat_engine_bridge_v1_release.py"
      - "tests/test_hf_chat_engine_bridge_v1.py"
      - ".deploy/HF_CHAT_ENGINE_BRIDGE_REQUEST.txt"
permissions:
  contents: read
concurrency:
  group: swrlz-hf-space-deployment
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify scoped release request
        id: approval
        run: |
          set -euo pipefail
          file=.deploy/HF_CHAT_ENGINE_BRIDGE_REQUEST.txt
          mode=inspect
          if [[ -f "$file" ]]; then
            get(){ sed -n "s/^$1=//p" "$file" | tail -1; }
            test "$(get SPACE)" = "kamiloki/Swyrlz"
            test "$(get BASE_REVISION)" = "fa5676e99e7f18adbcc8c0fa4804475400faf067"
            test "$(get SCOPE)" = "only-chat-forge-embed-broker-and-chat-image-reference-ui"
            mode="$(get MODE)"
            [[ "$mode" == inspect || "$mode" == publish ]]
            if [[ "$mode" == publish ]]; then test "$(get APPROVED)" = yes; fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate release script and scoped source patch syntax
        run: python -m py_compile scripts/hf_chat_engine_bridge_v1_patch.py scripts/hf_chat_engine_bridge_v1_release.py tests/test_hf_chat_engine_bridge_v1.py
      - run: python -m pip install --quiet 'huggingface_hub>=0.34,<2'
      - name: Validate exact current §C source, candidate and JavaScript
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u scripts/hf_chat_engine_bridge_v1_release.py inspect
      - name: Preserve source and test receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-engine-login-reference-source
          path: reports/chat-engine-bridge-v1/
          retention-days: 14
          if-no-files-found: ignore
      - name: Publish scoped source and verify resident Chat
        if: ${{ steps.approval.outputs.mode == 'publish' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SWRLZ_ENGINE_BRIDGE_APPROVED: '1'
        run: python -u scripts/hf_chat_engine_bridge_v1_release.py publish
