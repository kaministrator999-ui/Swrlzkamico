name: Verify §E v11.218 sealed Arcane Glove release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/calc-forge-v11-218-hand-integrity.yml'
      - 'projects/swrlz-forge-moba/scripts/verify_v11_218_release.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sealed-glove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check new hand source syntax
        run: |
          node --check projects/swrlz-forge-moba/runtime/model_atelier_hand_fidelity_v11_218.js
          python3 -m py_compile projects/swrlz-forge-moba/patches/v11_218_arcane_glove_fidelity.py
      - name: Verify exact sealed 250-patch modeler package (no browser suite)
        run: python3 projects/swrlz-forge-moba/scripts/verify_v11_218_release.py --output /tmp/se218-glove-release
