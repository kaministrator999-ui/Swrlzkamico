name: Inspect §C actual draft code preview and scroll state paths
on:
  push:
    branches: [main]
    paths: [".github/workflows/hf-live-code-scroll-detail-audit.yml"]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - run: python -m pip install 'huggingface_hub>=0.34,<2'
      - shell: bash
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          from huggingface_hub import HfApi,hf_hub_download
          S="kamiloki/Swyrlz";rev=HfApi().repo_info(S,repo_type="space").sha
          source=Path(hf_hub_download(S,"chat/§wyrlz/index.html",repo_type="space",revision=rev)).read_text()
          anchors=["const bindCodeViewState=container=>","const renderStationGeneration=()=>",
             "const captureCodeViewState=()=>","const restoreCodeViewState=()=>",
             "const enhanceCodeArtifacts=","const renderAssistantContent=(container",
             "const applyChatState = data =>","const consumeGeneration = async response =>",
             "const consumeGeneration=async response=>"]
          for anchor in anchors:
              i=source.find(anchor)
              if i<0:continue
              length=9500 if "renderStationGeneration" in anchor else 1500 if "captureCode" in anchor or "restoreCode" in anchor else 1100
              print("SCROLL_DETAIL",json.dumps({"anchor":anchor,"text":source[i:i+length]},ensure_ascii=False),flush=True)
          for pattern in ("previewText","CANDIDATE_PREVIEW_DELTA","codeViewState.set","data-code-key","const renderLiveCode"):
              for match in list(re.finditer(re.escape(pattern),source))[:8]:
                  i=match.start()
                  print("SCROLL_MATCH",json.dumps({"pattern":pattern,"offset":i,
                      "text":source[max(0,i-220):i+380]},ensure_ascii=False),flush=True)
          print("SCROLL_DETAIL_DONE",rev,flush=True)
          PY
