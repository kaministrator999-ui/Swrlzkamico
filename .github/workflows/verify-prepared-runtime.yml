name: Verify Prepared Runtime Generation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "accepted_runtime/**"
      - "scripts/prepare_runtime_generation.py"
      - "api/hot_loader.py"
      - "api/runtime_hot.py"
      - "api/index.py"
      - "api/online_research.py"
      - "api/chat_extensions.py"
      - "api/chat_resume_sessions.py"
      - ".github/workflows/verify-prepared-runtime.yml"
      - ".github/workflows/manual-vercel-production.yml"

permissions:
  contents: read

concurrency:
  group: swrlz-prepared-runtime-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build prepared runtime generation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_runtime_generation.py \
            --accepted-root accepted_runtime \
            --output-root .swrlz-prepared-runtime

      - name: Verify prepared generation contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path(".swrlz-prepared-runtime")
          generation = json.loads((root / "generation.json").read_text(encoding="utf-8"))
          assert generation["contract"] == "swrlz-prepared-runtime-generation-v3", generation
          assert generation["requestPathSyncRequired"] is False, generation
          assert generation["r39HistoricalNetworkFetchRequired"] is False, generation
          assert generation["r39SourceDelivery"] == "local-precomposed-full-lineage-v2", generation

          entry = root / "lalm" / "r39_engine.py"
          source = entry.read_text(encoding="utf-8")
          assert "urllib.request.urlopen(" not in source
          compile(source, str(entry), "exec")

          chain = generation["r39OverlayChain"]
          assert len(chain) == 16, len(chain)
          for item in chain:
              path = root / item["acceptedTarget"]
              assert path.is_file(), path
              compile(path.read_text(encoding="utf-8"), str(path), "exec")

          print("prepared-runtime-v3 contract verified")
          ancestry = generation["r39HistoricalAncestry"]
          assert len(ancestry) >= 45, len(ancestry)
          for item in ancestry:
              path = root / "lalm" / "ancestry" / item["name"]
              assert path.is_file(), path
              compile(path.read_text(encoding="utf-8"), str(path), "exec")
          print("overlay-chain-files", len(chain))
          print("historical-ancestry-files", len(ancestry))
          print("historical-network-fetch", False)
          PY

      - name: Install LALM verification dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "numpy==2.2.6"

      - name: Boot prepared R39 with historical network blocked
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" python - <<'PY'
          import importlib.util
          import sys
          import urllib.request
          from pathlib import Path

          entry = Path(".swrlz-prepared-runtime/lalm/r39_engine.py").resolve()
          lalm_dir = str(entry.parent)
          if lalm_dir not in sys.path:
              sys.path.insert(0, lalm_dir)

          def blocked(*args, **kwargs):
              raise RuntimeError("NETWORK_FETCH_ATTEMPTED_DURING_PREPARED_R39_BOOT")

          urllib.request.urlopen = blocked
          spec = importlib.util.spec_from_file_location("swrlz_prepared_r39_verification", entry)
          assert spec is not None and spec.loader is not None
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)

          for required in ("generate_events", "inspect_engine", "ENGINE_ID", "MODEL_SHA256"):
              assert hasattr(module, required), required

          state = module.inspect_engine()
          assert isinstance(state, dict), type(state)
          revision = str(
              state.get("hotRevision")
              or state.get("revision")
              or getattr(module, "HOT_REVISION", "")
          )
          assert "v90" in revision.lower(), revision
          print("prepared R39 boot verified")
          print("revision", revision)
          print("network source fetches", 0)
          print("engine", getattr(module, "ENGINE_ID", ""))
          PY

      - name: Verify ordinary request path is synchronization-inert
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          hot_loader = Path("api/hot_loader.py").read_text(encoding="utf-8")
          runtime_hot = Path("api/runtime_hot.py").read_text(encoding="utf-8")
          index = Path("api/index.py").read_text(encoding="utf-8")
          research = Path("api/online_research.py").read_text(encoding="utf-8")
          chat_extensions = Path("api/chat_extensions.py").read_text(encoding="utf-8")
          resume = Path("api/chat_resume_sessions.py").read_text(encoding="utf-8")
          production_workflow = Path(".github/workflows/manual-vercel-production.yml").read_text(encoding="utf-8")

          assert "register_hot_refresher(None)" in runtime_hot
          assert '"requestPath": False' in runtime_hot
          assert "requestPathSync\":False" in index.replace(" ", "")
          assert "r39HistoricalNetworkFetch\":False" in index.replace(" ", "")
          assert "PREPARED_INFERENCE" in hot_loader
          assert "PREPARED_CHAT" in hot_loader
          assert "PREPARED_CHAT_HISTORY_POLICY" in hot_loader
          assert "def _refresh_hot(force:bool=False)->None:" in research
          refresh_body = research.split("def _refresh_hot(force:bool=False)->None:",1)[1].split("def _reasoner_path()",1)[0]
          assert "urlopen(" not in refresh_body
          assert "requestPathSync" in research
          assert "run_online_research(payload)" in chat_extensions
          assert "run_online_research(payload)" in resume
          assert "_resolve_runtime_head()" not in chat_extensions
          assert "_resolve_runtime_head()" not in resume
          print("ordinary request-path synchronization contract verified")
          assert 'local-precomposed-full-lineage-v2' in production_workflow
          assert 'research/online_research_reasoner.py' in production_workflow
          assert 'Prepare promoted runtime generation' in production_workflow
          assert 'Deploy production artifact' in production_workflow
          assert production_workflow.index('Prepare promoted runtime generation') < production_workflow.index('Deploy production artifact')
          print("online-research reasoner request-path refresh", False)
          print("production prepared-generation gate verified")
          PY

      - name: Publish verification summary
        if: always()
        shell: bash
        run: |
          {
            echo "## §wyrlz prepared-runtime verification"
            echo
            echo "- Production deployment: **not triggered by this workflow**"
            echo '- Prepared generation contract: swrlz-prepared-runtime-generation-v3'
            echo "- Historical R39 source delivery: full local precomposed lineage"
            echo "- Audience request-path repository synchronization: disabled by contract"
          } >> "$GITHUB_STEP_SUMMARY"
