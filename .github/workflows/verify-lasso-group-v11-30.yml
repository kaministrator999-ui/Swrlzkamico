name: Verify §E v11.30 atomic grouped boundary pins
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-atelier-lasso-v1130
  cancel-in-progress: true
jobs:
  pins-and-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Build candidate from sealed §E v11.20
        run: |
          node --check projects/swrlz-forge-moba/runtime/model_atelier_surface_lasso_v11_22.js
          python -m py_compile projects/swrlz-forge-moba/patches/v11_21_vertex_sphere_brush_preview.py
          python projects/swrlz-forge-moba/build_space.py --output /tmp/atelier-group
          python - <<'PY'
          import runpy
          from pathlib import Path
          p=Path('/tmp/atelier-group/index.html')
          p.write_text(runpy.run_path('projects/swrlz-forge-moba/patches/v11_21_vertex_sphere_brush_preview.py')['apply'](p.read_text()))
          PY
      - name: Reject invalid group boundary and preserve geometric invariants
        run: |
          npm install --no-save playwright@1.56.1 three@0.169.0
          node projects/swrlz-forge-moba/tests/model_atelier_lasso_group_v11_30.mjs
          node projects/swrlz-forge-moba/tests/model_atelier_brush_ops_v11_27.mjs
      - name: Real desktop Android lasso group gesture, Undo and JSON
        run: |
          npx playwright install --with-deps --only-shell chromium
          python -m http.server 8787 --directory /tmp/atelier-group >/tmp/atelier-group.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8787/ >/dev/null; then break; fi
            sleep 0.3
          done
          curl -fsS http://127.0.0.1:8787/ >/dev/null
          SWYRL_SCULPT_TEST_URL=http://127.0.0.1:8787 node projects/swrlz-forge-moba/tests/model_atelier_lasso_browser_v11_22.mjs
