name: §C first HTML UI vs Station diagnostic (guest, read only)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/eval_chat_first_html_ui_diagnostic.py'
      - '.github/workflows/chat-first-html-ui-diagnostic.yml'
permissions: {contents: read}
concurrency:
  group: swrlz-chat-guest-eval
  cancel-in-progress: false
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - run: python -m py_compile scripts/eval_chat_first_html_ui_diagnostic.py
      - name: Compare actual UI and Station thread, preview, and termination
        env:
          SWRLZ_EVAL_BASE: https://kamiloki-swyrlz.hf.space
          SWRLZ_EVAL_MODEL: 700m
        run: python -u -m scripts.eval_chat_first_html_ui_diagnostic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: html-ui-station-boundary-${{ github.run_id }}
          path: reports/ui-html-first-turn/
          retention-days: 14
          if-no-files-found: ignore
