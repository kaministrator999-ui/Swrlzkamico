name: Validate actual §C repair branch preserves candidate and checkpoints on error
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hf-targeted-repair-flow-regression.yml"
      - "scripts/test_targeted_repair_flow_ast.py"
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install 'huggingface_hub>=0.34,<2'
      - shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/test_targeted_repair_flow_ast.py
          python -u scripts/test_targeted_repair_flow_ast.py
