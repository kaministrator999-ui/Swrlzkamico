name: Inspect general reasoning and evidence handling for §C 1.1.52
on:
  push:
    branches: [main]
    paths: [".github/workflows/inspect-general-intelligence-1152.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -q 'huggingface_hub>=0.34,<2'
      - name: Read source only (never access user records)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os,hashlib,pathlib
          from huggingface_hub import HfApi,hf_hub_download
          api=HfApi(token=os.environ.get("HF_TOKEN"))
          space="kamiloki/Swyrlz"
          rev=api.repo_info(space,repo_type="space").sha
          print("SPACE_REVISION",rev,flush=True)
          windows={
            "station.py":[(1192,1255),(2550,2570),(2610,2645),(2698,2770)],
            "response_cognition.py":[(1,130),(270,375),(380,498)],
            "lfm2_700m_engine.py":[(38,145),(280,330),(786,835),(850,915),(1060,1110)],
            "conversation_continuity.py":[(1,150)],
            "related_visual_history.py":[(115,188)],
            "model_router.py":[(858,895),(1042,1056)],
          }
          for name,blocks in windows.items():
            raw=pathlib.Path(hf_hub_download(space,name,repo_type="space",revision=rev,token=api.token)).read_bytes()
            lines=raw.decode("utf-8").splitlines()
            print("FILE",name,"SHA",hashlib.sha256(raw).hexdigest(),"LINES",len(lines))
            for start,end in blocks:
              print("SECTION",name,start,end)
              for i in range(start-1,min(end,len(lines))):print(f"{i+1}: {lines[i][:520]}")
          PY