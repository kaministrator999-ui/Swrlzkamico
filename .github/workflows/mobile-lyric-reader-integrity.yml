name: Mobile Lyric Reader Integrity
on:
  push:
    branches:
      - feature/version-literacy-content-layout-v199
  pull_request:
    paths:
      - 'chat/§wyrlz/index.html'
      - 'chat/§wyrlz/assets/github-explorer-v223.js'
      - 'tests/test_github_directory_parser_v224.mjs'
      - 'tests/test_github_preview_persistence_v227.mjs'
      - 'tests/test_lyric_mobile_reader_v194.py'
      - 'tests/test_lyric_native_reader_fallback_v195.py'
      - '.github/workflows/mobile-lyric-reader-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reader-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check mobile lyric surfaces and untouched code viewer
        run: python -m unittest discover -s tests -p test_lyric_mobile_reader_v194.py -v
      - name: Verify default prose lyrics and opt-in compact code window
        run: python -m unittest discover -s tests -p test_lyric_native_reader_fallback_v195.py -v
      - name: Verify nested GitHub directory rendering parser
        run: |
          node tests/test_github_directory_parser_v224.mjs
          node tests/test_github_preview_persistence_v227.mjs
      - name: Declare verification scope
        run: echo "Static style, exact JS syntax, and isolated prompt routing verified; Android visual acceptance remains unverified."
