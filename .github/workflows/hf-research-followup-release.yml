name: Guarded §C source-backed research followup reuse
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hf-research-followup-release.yml'
permissions: {contents: read}
concurrency:
  group: swrlz-chat-guest-eval
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install 'huggingface_hub>=0.34,<2' playwright==1.56.0
          python -m playwright install --with-deps chromium
      - run: |
          python -m py_compile scripts/hf_research_no_lookup_followup_v1.py
          python -m py_compile scripts/eval_chat_research_lyrics_conversations.py
      - name: Check precise deployed factual engine and prior-answer source boundaries
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u scripts/hf_research_no_lookup_followup_v1.py preflight
      - uses: actions/upload-artifact@v4
        with:
          name: followup-cited-source-backup-${{ github.run_id }}
          path: reports/swrlz-research-followup-v1/
          retention-days: 90
          if-no-files-found: error
      - name: Publish one-file no-new-lookup followup route
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SWRLZ_FOLLOWUP_APPROVED: '1'
        run: python -u scripts/hf_research_no_lookup_followup_v1.py publish
      - name: Confirm exact approved source revision is RUNNING before QA
        id: revision
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m py_compile scripts/hf_wait_exact_serving_revision.py
          SWRLZ_REVISION_GATE_SELFTEST=1 python -u scripts/hf_wait_exact_serving_revision.py
          python -u scripts/hf_wait_exact_serving_revision.py --manifest reports/swrlz-research-followup-v1/manifest.json --limit-seconds 900 --poll-seconds 12
      - name: Verify no-repeat-lookup Diablo II conversation from primary publisher answer
        id: verify
        shell: bash
        env:
          SWRLZ_EVAL_BASE: https://kamiloki-swyrlz.hf.space
          SWRLZ_EVAL_MODEL: 700m
        run: |
          set -uo pipefail
          ok=1
          for sample in 1 2; do
            if python -u - <<'PY'
          import asyncio,json
          from scripts import eval_chat_research_lyrics_conversations as ev
          case=next(x for x in ev.CASES['research'] if x['id']=='diablo2-lod-classes')
          ev.CASES['research']=[case]
          asyncio.run(ev.main('research'))
          result=json.loads((ev.OUT/'report.json').read_text())
          case=result['results'][0]
          print('RESEARCH_FOLLOWUP_SAMPLE',json.dumps({'outcome':case['outcome'],
             'grades':[t['evaluation']['status'] for t in case['turns']],
             'timing':[t['total_ms'] for t in case['turns']]}),flush=True)
          assert case['outcome']=='PASS_EVIDENCE', 'Prior sourced roster not reused'
          assert len(case['turns'])==2
          assert case['turns'][0]['source_link_count']>=1
          PY
            then ok=0;else ok=$?;fi
            mkdir -p "reports/research-followup-acceptance/probe-$sample"
            cp -a reports/chat-research-lyrics-conversation/. "reports/research-followup-acceptance/probe-$sample/" || true
            if [[ "$ok" -eq 0 ]];then break;fi
            sleep 40
          done
          echo "exit=$ok" >> "$GITHUB_OUTPUT"
          echo "CITED_NO_LOOKUP_FOLLOWUP_EXIT=$ok"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-followup-live-evidence-${{ github.run_id }}
          path: reports/research-followup-acceptance/
          retention-days: 21
          if-no-files-found: ignore
      - name: Restore exact prior engine if the live no-lookup task fails
        if: ${{ always() && (steps.verify.outputs.exit != '0' || steps.revision.outcome != 'success') }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SWRLZ_FOLLOWUP_APPROVED: '1'
        run: python -u scripts/hf_research_no_lookup_followup_v1.py rollback
      - name: Require completed cited-answer continuity
        if: ${{ always() && (steps.verify.outputs.exit != '0' || steps.revision.outcome != 'success') }}
        run: |
          echo "::warning::Cited research continuation did not pass; see rollback and transcripts."
          exit 1
