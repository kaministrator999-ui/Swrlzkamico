name: Audit live §C Qwen3.5-9B profile and global inference paths
on:
  push:
    branches: [tune/chat-qwen35-global-profile-20261113]
    paths:
      - "scripts/audit_hf_qwen35_profile_and_speed.py"
      - ".github/workflows/hf-qwen35-global-profile-audit.yml"
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Install read-only Hugging Face client
        run: python -m pip install 'huggingface_hub>=0.34,<2'
      - name: Check current source profile handoff and runtime bottlenecks
        run: |
          python -m py_compile scripts/audit_hf_qwen35_profile_and_speed.py
          python -u scripts/audit_hf_qwen35_profile_and_speed.py
