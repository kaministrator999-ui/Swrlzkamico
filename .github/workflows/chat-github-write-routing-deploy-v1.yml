name: Deploy §C explicit GitHub write routing
on:
  push:
    branches: [fix/chat-github-write-routing-v1]
    paths: ['.github/workflows/chat-github-write-routing-deploy-v1.yml']
permissions:
  contents: read
concurrency:
  group: swrlz-hf-space-deployment
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet 'huggingface_hub>=0.34,<2'
      - run: python -m unittest discover -s tests -p test_chat_github_write_routing_v1.py -v
      - run: python scripts/hf_chat_github_write_routing_release_v1.py snapshot
      - name: Publish exact-live Station routing patch
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SWRLZ_WRITE_ROUTING_APPROVED: '1'
        run: python -u scripts/hf_chat_github_write_routing_release_v1.py publish
      - run: python scripts/hf_chat_github_write_routing_release_v1.py verify
