name: Guarded HF Local Turbo Utterance Fix
on:
  push:
    branches: [main]
    paths:
      - ".deploy/HF_CHAT_TURBO_ENDPOINT_REQUEST.txt"
permissions:
  contents: read
concurrency:
  group: swrlz-hf-space-deployment
  cancel-in-progress: false
jobs:
  turbo-utterance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout approved release request
        uses: actions/checkout@v4
      - name: Verify pinned scope and no-paid authorization
        id: request
        shell: bash
        run: |
          set -euo pipefail
          file=".deploy/HF_CHAT_TURBO_ENDPOINT_REQUEST.txt"
          test -f "$file"
          get() { sed -n "s/^$1=//p" "$file" | tail -n 1; }
          test "$(get TARGET)" = "kamiloki/Swyrlz"
          test "$(get APPROVED)" = "1"
          test "$(get NO_PAID_SPEECH_API)" = "1"
          test "$(get NO_HARDWARE_UPGRADE)" = "1"
          ref="$(get SOURCE_REF)"
          nonce="$(get REQUEST_NONCE)"
          [[ "$ref" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::Missing immutable source SHA"; exit 1; }
          [[ "$nonce" =~ ^[A-Za-z0-9._-]{10,96}$ ]] || { echo "::error::Invalid nonce"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Checkout immutable approved Turbo fix
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.ref }}
          path: voice-turbo-source
          fetch-depth: 1
      - name: Test all existing speech paths and corrected Turbo pause handling
        shell: bash
        run: |
          set -euo pipefail
          node --check voice-turbo-source/chat/§wyrlz/assets/local_voice_vosk.js
          node voice-turbo-source/scripts/test_chat_streaming_voice.cjs
          node voice-turbo-source/scripts/test_chat_local_streaming_vosk.cjs
          node voice-turbo-source/scripts/test_chat_local_vosk_recovery.cjs
          node voice-turbo-source/scripts/test_chat_local_turbo.cjs
          python -m py_compile voice-turbo-source/scripts/publish_hf_turbo_endpoint.py
      - name: Install existing Hugging Face client
        run: python -m pip install 'huggingface_hub>=0.34,<2'
      - name: Validate exact production version and snapshot live source
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          python voice-turbo-source/scripts/publish_hf_turbo_endpoint.py prepare
      - name: Preserve live Chat and local ASR for rollback before deployment
        uses: actions/upload-artifact@v4
        with:
          name: hf-chat-local-turbo-endpoint-rollback
          path: hf-turbo-endpoint-rollback/
          retention-days: 90
          if-no-files-found: error
      - name: Publish two-file Local Turbo speech repair
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          python voice-turbo-source/scripts/publish_hf_turbo_endpoint.py publish
