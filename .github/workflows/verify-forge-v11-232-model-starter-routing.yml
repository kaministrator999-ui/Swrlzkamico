name: Verify §E v11.232 model starter workspace routing
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-forge-v11-232-model-starter-routing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build isolated v11.232 candidate without overwriting sealed source
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('projects/swrlz-forge-moba/source-manifest.json')
          m=json.loads(p.read_text())
          assert m['name']=='§wyrl§ Engine v11.231',m['name']
          assert m['patches'][-1]=='patches/v11_231_sheep_house_camera_fit.py'
          m['name']='§wyrl§ Engine v11.232'
          m['finalArtifact']='swyrl_engine_v11_232.html'
          m['patches'].append('patches/v11_232_model_starter_workspace_activation.py')
          m['finalBytes']=0;m['finalSha256']=''
          p.write_text(json.dumps(m,ensure_ascii=False))
          PY
          python projects/swrlz-forge-moba/build_space.py --output /tmp/se232-model-routing
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('/tmp/se232-model-routing/index.html')
          b=p.read_bytes()
          text=b.decode()
          for name in ('index.html','modeler.html'):
           other=Path('/tmp/se232-model-routing')/name
           s=other.read_text()
           anchor='window.SWRLZ_FORGE_BUILD='
           assert s.count(anchor)==1
           other.write_text(s.replace(anchor,
              'window.SE232_TEST_OPEN_TEMPLATE=(key)=>createProjectFromTemplate(key,true);\n'+anchor))
          print('SE232_CANDIDATE_BYTES='+str(len(b)))
          print('SE232_CANDIDATE_SHA256='+hashlib.sha256(b).hexdigest())
          assert 'V11_232_MODEL_STARTER_WORKSPACE_ACTIVATION' in text
          PY
      - name: Install narrow mobile browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps --only-shell chromium
      - name: Verify Game first, then houses/wolf/model project enters real Modeling workspace
        run: node projects/swrlz-forge-moba/tests/ui_v11_232_game_to_modeler_starters.mjs
