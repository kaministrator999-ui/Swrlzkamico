name: Verify §E v11.418 sealed Sheep Tag flock release
# The release seal is measured on the complete 399-patch manifest build,
# not a one-off appended-patch HTML candidate (which omits a history entry).
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-forge-v11-418-sheep-release.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Reconstruct sealed source and run native Sheep Tag plus VR regression checks
        run: |
          set -eu
          python projects/swrlz-forge-moba/scripts/verify_v11_418_release.py --output /tmp/se418-full
