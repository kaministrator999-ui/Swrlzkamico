name: Measure §E v11.482 geometric Ring/Fill and draggable mobile Ring Height

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/measure-engine-v11-482.yml"
      - "projects/swrlz-forge-moba/patches/v11_482_geometric_ring_height.py"
      - "projects/swrlz-forge-moba/runtime/model_geometric_ring_v11_482.js"
      - "projects/swrlz-forge-moba/runtime/model_ring_height_layout_v11_482.js"
      - "projects/swrlz-forge-moba/runtime/model_ring_height_layout_v11_482.css"
      - "projects/swrlz-forge-moba/scripts/prepare_v11_482_release.py"
      - "projects/swrlz-forge-moba/scripts/verify_v11_482_release.py"
      - "projects/swrlz-forge-moba/tests/model_geometric_ring_height_v11_482.mjs"
      - "projects/swrlz-forge-moba/tests/model_geometric_ring_height_browser_v11_482.cjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: se482-geometric-ring-measure
  cancel-in-progress: true

jobs:
  geometric-ring:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build, calculate SHA256 and verify 459 native-source patches
        run: python projects/swrlz-forge-moba/scripts/prepare_v11_482_release.py
      - name: Install Chromium touch browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps --only-shell chromium
      - name: Test painted mesh geometric circles, source UV fidelity, draggable ring height and vertex-first inspector
        run: node projects/swrlz-forge-moba/tests/model_geometric_ring_height_browser_v11_482.cjs projects/swrlz-forge-moba/_release_v11_482_candidate
      - name: Seal verified source SHA and bytes to main
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'Source moved; rebuild on latest main before sealing'; exit 1; }
          git add projects/swrlz-forge-moba/source-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "§E v11.482: seal Chromium-verified geometric circle and Ring Height source"
            git push origin HEAD:main
          fi
      - name: Preserve exact source receipt and viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: se482-geometric-ring-receipt
          path: |
            projects/swrlz-forge-moba/source-manifest.json
            projects/swrlz-forge-moba/_release_v11_482_candidate/se482-*.png
