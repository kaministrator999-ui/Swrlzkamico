name: Release §C durable Workstation existing-project repair v4
on:
  pull_request:
    paths:
      - 'queues/swrlz_generation_v3.py'
      - 'api/durable_project_repair_v1.py'
      - 'tests/test_durable_project_repair_v1.py'
      - 'scripts/hf_chat_durable_repair_release_v4.py'
      - '.github/workflows/hf-chat-durable-repair-v4.yml'
  push:
    branches: [main]
    paths:
      - 'queues/swrlz_generation_v3.py'
      - 'api/durable_project_repair_v1.py'
      - 'scripts/hf_chat_durable_repair_release_v4.py'
      - '.github/workflows/hf-chat-durable-repair-v4.yml'
permissions: {contents: read}
concurrency:
  group: swrlz-hf-durable-repair-route-v4
  cancel-in-progress: false
jobs:
  validate-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Run exact prompt, owner and queue regression tests
        run: |
          python -m pip install --quiet 'requests>=2.31,<3'
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/api"
          python -m py_compile api/durable_project_repair_v1.py queues/swrlz_generation_v3.py scripts/hf_chat_durable_repair_release_v4.py
          python -m unittest discover -s tests -p 'test_durable_project_repair_v1.py' -v
          python -m unittest discover -s tests -p 'test_html_project_repair_v1.py' -v
          python -m unittest discover -s tests -p 'test_html_project_agent_runtime_v1.py' -v
          python scripts/hf_chat_durable_repair_release_v4.py selftest
      - name: Install Hugging Face source reader
        run: python -m pip install --quiet 'huggingface_hub>=0.34,<2'
      - name: Verify exact production durable queue source without mutation
        run: python -u scripts/hf_chat_durable_repair_release_v4.py preflight
      - name: Publish two scoped files and require live Station/send prompt acceptance
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[release-chat-durable-repair-v4]') }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SWRLZ_DURABLE_REPAIR_APPROVED: '1'
        run: python -u scripts/hf_chat_durable_repair_release_v4.py publish
      - name: Independently rerun live prompt regression on deployed source
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[release-chat-durable-repair-v4]') }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u scripts/hf_chat_durable_repair_release_v4.py verify
