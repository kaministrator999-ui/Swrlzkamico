name: §E v11.131 sealed 163-patch moving Mirror and touch UI
on:
  push:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/source-manifest.json"
      - "projects/swrlz-forge-moba/scripts/verify_v11_131_release.py"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Install DOM harness
        run: npm install --prefix /tmp/se131-dom --no-audit --no-fund jsdom@25.0.1
      - name: Verify sealed 163 ordered patches, 68 assets and prior games
        run: |
          python projects/swrlz-forge-moba/scripts/verify_v11_131_release.py --output /tmp/se131-release
          node --check /tmp/se131-release-module.mjs
      - name: Verify new directed Mirror and v11.130 gesture/build behavior
        env:
          SE_JSDOM_MODULE: /tmp/se131-dom/node_modules/jsdom
          SE_ASSEMBLED_HTML: /tmp/se131-release/index.html
        run: |
          node projects/swrlz-forge-moba/tests/sheep_directed_mirror_decoy_v11_131.mjs
          env -u SE_ASSEMBLED_HTML node projects/swrlz-forge-moba/tests/second_touchstart_sheep_build_v11_130.mjs
