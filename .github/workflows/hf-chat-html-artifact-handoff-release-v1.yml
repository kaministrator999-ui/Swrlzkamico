name: Release §C generated HTML project GitHub handoff
on:
  push:
    branches: [main]
    paths:
      - api/github_html_project_handoff_v1.py
      - chat/html-project-publish-review-v1.js
      - scripts/hf_chat_html_artifact_handoff_release_v1.py
      - tests/test_github_html_project_handoff_v1.py
      - .github/workflows/hf-chat-html-artifact-handoff-release-v1.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: swrlz-hf-space-deployment
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install pinned publishing dependencies
        run: python -m pip install --quiet 'huggingface_hub>=0.34,<2' 'requests>=2.31,<3'
      - name: Validate one-time approvals, immutable artifacts and atomic GitHub create
        run: |
          python -m py_compile api/github_html_project_handoff_v1.py scripts/hf_chat_html_artifact_handoff_release_v1.py
          python -m unittest discover -s tests -p 'test_github_html_project_handoff_v1.py' -v
          python -m unittest discover -s tests -p 'test_github_html_publish_action_v1.py' -v
          node --check chat/html-project-publish-review-v1.js
          python scripts/hf_chat_html_artifact_handoff_release_v1.py selftest
      - name: Inspect exact live Station and approval source before release
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/hf_chat_html_artifact_handoff_release_v1.py preflight
      - name: Publish approved scoped §C handoff and confirm live serving
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SWRLZ_HTML_ARTIFACT_HANDOFF_APPROVED: '1'
        run: python -u scripts/hf_chat_html_artifact_handoff_release_v1.py publish
