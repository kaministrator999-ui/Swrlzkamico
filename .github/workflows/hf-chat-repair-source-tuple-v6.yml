name: Release §C repair source suffix tuple fix v6
on:
  pull_request:
    paths:
      - 'api/html_project_agent_runtime_v1.py'
      - 'tests/test_html_project_agent_runtime_v1.py'
      - 'scripts/hf_chat_repair_source_tuple_release_v6.py'
      - '.github/workflows/hf-chat-repair-source-tuple-v6.yml'
  push:
    branches: [main]
    paths:
      - 'api/html_project_agent_runtime_v1.py'
      - 'scripts/hf_chat_repair_source_tuple_release_v6.py'
      - '.github/workflows/hf-chat-repair-source-tuple-v6.yml'
permissions: {contents: read}
concurrency:
  group: swrlz-chat-repair-source-tuple-v6
  cancel-in-progress: false
jobs:
  validate-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Validate actual manifest source loader and repair loop
        run: |
          python -m pip install --quiet 'requests>=2.31,<3'
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/api"
          echo "PYTHONPATH=$PYTHONPATH" >> "$GITHUB_ENV"
          python -m py_compile api/html_project_agent_runtime_v1.py scripts/hf_chat_repair_source_tuple_release_v6.py
          python -m unittest discover -s tests -p 'test_html_project_agent_runtime_v1.py' -v
          python -m unittest discover -s tests -p 'test_html_project_agent_v1.py' -v
          python -m unittest discover -s tests -p 'test_html_project_repair_v1.py' -v
          python scripts/hf_chat_repair_source_tuple_release_v6.py selftest
      - name: Install Hugging Face API
        run: python -m pip install --quiet 'huggingface_hub>=0.34,<2'
      - name: Preflight production runtime exact source pin
        run: python -u scripts/hf_chat_repair_source_tuple_release_v6.py preflight
      - name: CAS publish and restart Hugging Face
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[release-chat-repair-tuple-v6]') }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SWRLZ_TUPLE_REPAIR_APPROVED: '1'
        run: python -u scripts/hf_chat_repair_source_tuple_release_v6.py publish
      - name: Independently verify live Space source and health
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[release-chat-repair-tuple-v6]') }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u scripts/hf_chat_repair_source_tuple_release_v6.py verify
