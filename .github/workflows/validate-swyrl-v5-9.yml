name: Validate §wyrl§ Engine v5.9 candidate
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: swyrl-engine-v5-9-wisp-undo-contact}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: |
          python projects/swrlz-forge-moba/build_space.py --output /tmp/v58
          python - <<'PY'
          import importlib.util,hashlib
          from pathlib import Path
          s=Path('/tmp/v58/index.html').read_text()
          p=Path('projects/swrlz-forge-moba/patches/v5_9_wisp_soft_contact_history.py')
          q=importlib.util.spec_from_file_location('p',p);m=importlib.util.module_from_spec(q);q.loader.exec_module(m)
          o=m.apply(s);b=o.encode();print('V59_BYTES='+str(len(b)));print('V59_SHA256='+hashlib.sha256(b).hexdigest())
          Path('/tmp/v59.html').write_text(o);a=o.index('<script type="module">')+len('<script type="module">');z=o.rindex('</script>');Path('/tmp/v59.mjs').write_text(o[a:z])
          for t in ['V5_9_WISP_SOFT_CONTACT_HISTORY','quickUndoBtn','quickRedoBtn','supportLocked','alphaTest:0']: assert t in o,t
          PY
          node --check /tmp/v59.mjs
