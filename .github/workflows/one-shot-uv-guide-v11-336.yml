name: One-shot §E UV guide v11.336 source hash
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-uv-guide-v11-336.yml"
      - "projects/swrlz-forge-moba/patches/v11_336_model_uv_guide.py"
      - "projects/swrlz-forge-moba/source-manifest.json"
      - "projects/swrlz-forge-moba/scripts/verify_v11_336_release.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hash-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check new module and patch syntax
        run: |
          node --check projects/swrlz-forge-moba/runtime/model_atelier_uv_layout_v11_336.js
          python -m py_compile projects/swrlz-forge-moba/patches/v11_336_model_uv_guide.py
      - name: Verify manifest-sealed HTML, native inline JavaScript and focused model checks
        run: python projects/swrlz-forge-moba/scripts/verify_v11_336_release.py --output /tmp/se336-verified
