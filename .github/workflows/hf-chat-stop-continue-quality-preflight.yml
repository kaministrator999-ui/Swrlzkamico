name: Verify §C Stop, meaningful Continue, and working webpage defaults
on:
  push:
    branches: [feature/chat-generation-lifecycle-quality-20261114]
    paths:
      - "scripts/hf_chat_stop_continue_web_quality_v1.py"
      - ".github/workflows/hf-chat-stop-continue-quality-preflight.yml"
permissions: {contents: read}
concurrency:
  group: swrlz-chat-lifecycle-quality-readonly
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Install guarded source reader
        run: python -m pip install --quiet "huggingface_hub>=0.34,<2"
      - name: Validate source/patch Python syntax
        run: python -m py_compile scripts/hf_chat_stop_continue_web_quality_v1.py
      - name: Read live §C source and test exact safe patch without mutation
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u scripts/hf_chat_stop_continue_web_quality_v1.py preflight
