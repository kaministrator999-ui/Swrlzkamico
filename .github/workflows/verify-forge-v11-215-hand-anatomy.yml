name: Verify §E v11.215 Floating Hand anatomy
on:
  push:
    branches: [main]
    paths:
      - 'projects/swrlz-forge-moba/patches/v11_215_floating_hand_anatomy_upgrade.py'
      - 'projects/swrlz-forge-moba/runtime/model_atelier_hand_anatomy_v11_215.js'
      - 'projects/swrlz-forge-moba/tests/ui_v11_215_hand_anatomy.mjs'
      - 'projects/swrlz-forge-moba/scripts/verify_v11_215_release.py'
      - 'projects/swrlz-forge-moba/source-manifest.json'
      - '.github/workflows/verify-forge-v11-215-hand-anatomy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hand-anatomy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check standalone anatomy implementation syntax
        run: |
          node --check projects/swrlz-forge-moba/runtime/model_atelier_hand_anatomy_v11_215.js
          python3 -m py_compile projects/swrlz-forge-moba/patches/v11_215_floating_hand_anatomy_upgrade.py
      - name: Rebuild candidate and print SHA-256 receipt
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('projects/swrlz-forge-moba/source-manifest.json')
          m=json.loads(p.read_text())
          assert m['name']=='§wyrl§ Engine v11.215'
          assert m['patches'][-1]=='patches/v11_215_floating_hand_anatomy_upgrade.py'
          m['finalSha256']=''
          m['finalBytes']=0
          p.write_text(json.dumps(m,ensure_ascii=False))
          PY
          python3 projects/swrlz-forge-moba/build_space.py --output /tmp/se215-candidate >/tmp/se215-build.log
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          f=Path('/tmp/se215-candidate/index.html')
          s=f.read_bytes()
          assert b'V11_215_FLOATING_HAND_SCULPT_ANATOMY' in s
          assert b'se215OrganicHandSkin' in s
          assert b'se215HandAnatomicalTrim' in s
          print('SE215_CANDIDATE_BYTES='+str(len(s)))
          print('SE215_CANDIDATE_SHA256='+hashlib.sha256(s).hexdigest())
          print('SE215_CANDIDATE_PASS')
          PY
      - name: Install focused Chromium harness
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps --only-shell chromium
      - name: Load native hand and check anatomical XYZ surfaces
        run: node projects/swrlz-forge-moba/tests/ui_v11_215_hand_anatomy.mjs
      - name: Verify exactly sealed v11.215 release after browser acceptance
        run: |
          git restore projects/swrlz-forge-moba/source-manifest.json
          python3 projects/swrlz-forge-moba/scripts/verify_v11_215_release.py --output /tmp/se215-sealed
