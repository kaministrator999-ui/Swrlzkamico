name: §E v11.150 host-controlled gameplay launch validation
on:
  push:
    branches: ["feature/se-v11-150-host-start-match"]
    paths:
      - "projects/swrlz-forge-moba/**"
      - ".github/workflows/measure-engine-match-v11-150.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate native match-start module and host/guest/stop contracts
        run: |
          node --check projects/swrlz-forge-moba/runtime/sheep_lan_match_start_v11_150.js
          python -m py_compile projects/swrlz-forge-moba/patches/v11_150_host_start_native_match.py
          node projects/swrlz-forge-moba/tests/sheep_host_start_v11_150.mjs
      # Full release gates are opt-in; regular commits run the fast unit checks.
      # Add [verify-release] to an intended candidate commit to run them.
      - name: Rebuild full source and 68 assets
        if: contains(github.event.head_commit.message, '[verify-release]')
        run: |
          python projects/swrlz-forge-moba/scripts/measure_v11_150_source.py
          python projects/swrlz-forge-moba/scripts/verify_v11_150_release.py --output dist/swrlz-forge-moba
          node --check dist/swrlz-forge-moba-module.mjs
      - name: Test real Chrome host LAN start, guest receipt and editor exit
        if: contains(github.event.head_commit.message, '[verify-release]')
        run: |
          python -m pip install playwright
          python projects/swrlz-forge-moba/tests/sheep_host_start_chromium_v11_150.py
