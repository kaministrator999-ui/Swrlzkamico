name: Verify §E v11.461 rim normals, real mobile resize and model-center orbit
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/measure-engine-v11-461.yml"
      - "projects/swrlz-forge-moba/patches/v11_461_model_edges_orbit_dock.py"
      - "projects/swrlz-forge-moba/runtime/model_hard_surface_orbit_v11_461.js"
      - "projects/swrlz-forge-moba/runtime/model_touch_dock_v11_461.css"
      - "projects/swrlz-forge-moba/tests/model_hard_surface_orbit_v11_461.mjs"
      - "projects/swrlz-forge-moba/tests/browser_modeler_orbit_resize_v11_461.cjs"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Syntax of exact source and native visual module
        run: |
          set -euo pipefail
          python -m py_compile projects/swrlz-forge-moba/patches/v11_461_model_edges_orbit_dock.py
          node --check projects/swrlz-forge-moba/runtime/model_hard_surface_orbit_v11_461.js
          node projects/swrlz-forge-moba/tests/model_hard_surface_orbit_v11_461.mjs
      - name: Assemble full §E without modifying committed source seal
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('projects/swrlz-forge-moba/source-manifest.json')
          m=json.loads(p.read_text())
          assert m['name']=='§wyrl§ Engine v11.461'
          assert m['patches'][-1]=='patches/v11_461_model_edges_orbit_dock.py'
          assert len(m['patches'])==438
          m['finalSha256']=None;m['finalBytes']=None
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          PY
          python projects/swrlz-forge-moba/build_space.py --output /tmp/se461-browser
          python projects/swrlz-forge-moba/scripts/check_inline_js_syntax_v11_266.py /tmp/se461-browser/index.html
          node projects/swrlz-forge-moba/tests/model_hard_surface_orbit_v11_461.mjs /tmp/se461-browser/index.html
          node projects/swrlz-forge-moba/tests/model_native_view_commands_v11_461.mjs /tmp/se461-browser/index.html
          node projects/swrlz-forge-moba/tests/model_startup_guard_v11_461.mjs /tmp/se461-browser/index.html
          node projects/swrlz-forge-moba/tests/model_conversion_no_face_gate_v11_461.mjs /tmp/se461-browser/index.html
          node projects/swrlz-forge-moba/tests/model_inset_top_steps_v11_454.mjs /tmp/se461-browser/index.html
          node projects/swrlz-forge-moba/tests/model_dock_orbit_contrast_v11_461.mjs /tmp/se461-browser/index.html
          node projects/swrlz-forge-moba/tests/model_view_readability_v11_461.mjs /tmp/se461-browser/index.html
      - name: Install Chromium with touch emulation
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps --only-shell chromium
      - name: Real phone controls, cube orbit and both splitters
        run: node projects/swrlz-forge-moba/tests/browser_modeler_orbit_resize_v11_461.cjs
      - name: Record exact browser-verified source hash
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          b=Path('/tmp/se461-browser/index.html').read_bytes()
          receipt={"version":"v11.461","finalBytes":len(b),
           "finalSha256":hashlib.sha256(b).hexdigest(),
           "mobileResizeOrbitAndViewPassed":True}
          Path('se461-integrity.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print('SE461_SOURCE_INTEGRITY',json.dumps(receipt,sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: se461-mobile-modeler-integrity-receipt
          path: se461-integrity.json
          retention-days: 14
          if-no-files-found: error
