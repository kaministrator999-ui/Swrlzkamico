name: Verify §E v11.28 parametric density profile preview
on:
  push:
    branches: [feature/atelier-density-profiles-v11-28]
    paths:
      - 'projects/swrlz-forge-moba/runtime/model_atelier_density_profiles_v11_28.js'
      - 'projects/swrlz-forge-moba/runtime/model_atelier_sculpt_brush_v11_21.js'
      - 'projects/swrlz-forge-moba/patches/v11_21_vertex_sphere_brush_preview.py'
      - 'projects/swrlz-forge-moba/tests/model_atelier_density_profiles_v11_28.mjs'
      - 'projects/swrlz-forge-moba/tests/model_atelier_density_profiles_browser_v11_28.mjs'
      - '.github/workflows/verify-density-profiles-v11-28.yml'
permissions:
  contents: read
concurrency:
  group: verify-density-profiles-v1128
  cancel-in-progress: true
jobs:
  measured-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Syntax and sealed baseline overlay
        run: |
          node --check projects/swrlz-forge-moba/runtime/model_atelier_density_profiles_v11_28.js
          python -m py_compile projects/swrlz-forge-moba/patches/v11_21_vertex_sphere_brush_preview.py
          python projects/swrlz-forge-moba/build_space.py --output /tmp/atelier-profiles
          python - <<'PY'
          import runpy
          from pathlib import Path
          p=Path('/tmp/atelier-profiles/index.html')
          p.write_text(runpy.run_path('projects/swrlz-forge-moba/patches/v11_21_vertex_sphere_brush_preview.py')['apply'](p.read_text()))
          PY
      - name: Native parametric measurement and v11.27 regression
        run: |
          npm install --no-save playwright@1.56.1 three@0.169.0
          node projects/swrlz-forge-moba/tests/model_atelier_density_profiles_v11_28.mjs
          node projects/swrlz-forge-moba/tests/model_atelier_brush_ops_v11_27.mjs
      - name: Browser native preview apply undo import desktop Android
        run: |
          npx playwright install --with-deps --only-shell chromium
          python -m http.server 8787 --directory /tmp/atelier-profiles >/tmp/atelier-profiles.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8787/ >/dev/null; then break; fi
            sleep 0.3
          done
          curl -fsS http://127.0.0.1:8787/ >/dev/null
          SWYRL_SCULPT_TEST_URL=http://127.0.0.1:8787 node projects/swrlz-forge-moba/tests/model_atelier_density_profiles_browser_v11_28.mjs
