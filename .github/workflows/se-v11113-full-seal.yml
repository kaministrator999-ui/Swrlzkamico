name: §E v11.113 precision circle full-source seal
on:
  push:
    branches: ['feature/se-v11-113-general-circle-carve']
    paths: ['.github/workflows/se-v11113-full-seal.yml']
permissions:
  contents: read
jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Rebuild all governed §E patches, verify generalized circle controls and record bytes/SHA
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import gzip,base64,hashlib,json,sys
          root=Path('projects/swrlz-forge-moba')
          sys.path.insert(0,str(root.resolve()))
          from build_space import load_patch
          m=json.loads((root/'source-manifest.json').read_text())
          assert m['name']=='§wyrl§ Engine v11.113' and len(m['patches'])==145
          assert m['patches'][-1]=='patches/v11_113_general_precision_circle.py'
          data=gzip.decompress(base64.b64decode(''.join((root/p).read_text().strip() for p in m['chunks'])))
          assert len(data)==m['baseBytes'] and hashlib.sha256(data).hexdigest()==m['baseSha256']
          html=data.decode('utf8')
          for patch in m['patches']:html=load_patch(root/patch)(html)
          for token in (
           'SWYRL_ENGINE_DEPLOY_MARKER: V11_113_GENERAL_PRECISION_CIRCLE',
           '<title>§wyrl§ Engine · Maker v11.113</title>',
           "window.SWRLZ_FORGE_BUILD={version:'v11.113'",
           'function atelierPrecisionCircleBuild(',
           'function atelierPrecisionCircleInstall(){',
           'atelierPrecisionCircleInstall();',
           'Precision circle cut · reusable shape tool',
           "surface==='box'",
           "surface==='cylinder'",
           'modelAtelierBoreRelocate'):
            assert token in html,token
          assert '3 holes · bowling ball' not in html
          Path('/tmp/se-v11113.mjs').write_text(html.split('<script type="module">',1)[1].rsplit('</script>',1)[0])
          raw=html.encode('utf8')
          print('SE_V11113_FULL_BYTES='+str(len(raw)))
          print('SE_V11113_FULL_SHA256='+hashlib.sha256(raw).hexdigest())
          print('SE_V11113_FULL_SOURCE_GUARDS_PASS')
          PY
          node --check /tmp/se-v11113.mjs
