name: Inspect live §C long-code generation and project continuation (read-only)
on:
  push:
    branches: [main]
    paths: [".github/workflows/hf-long-code-generation-audit.yml"]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - run: python -m pip install 'huggingface_hub>=0.34,<2'
      - run: |
          python - <<'PY'
          import ast,json
          from pathlib import Path
          from huggingface_hub import HfApi,hf_hub_download
          s="kamiloki/Swyrlz"; rev=HfApi().repo_info(s,repo_type="space").sha
          print("LONG_SOURCE_REV",rev,flush=True)
          checks={
            "qwen_coder_engine.py":[(1,105),(250,330),(490,620),(670,835),(835,1010),(1010,1190)],
            "programming_repair_context.py":[(1,125),(175,285)],
            "project_revision_workspace.py":[(1,180)],
            "station.py":[(990,1140),(1440,1530)],
          }
          for name,ranges in checks.items():
              try:lines=Path(hf_hub_download(s,name,repo_type="space",revision=rev)).read_text().splitlines()
              except Exception as exc:
                  print("LONG_SOURCE_MISSING",json.dumps({"file":name,"error":str(exc)[:150]}),flush=True);continue
              tree=ast.parse("\n".join(lines))
              defs=[[n.name,n.lineno,n.end_lineno] for n in tree.body
                    if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef))]
              print("LONG_SOURCE_DEFS",json.dumps({"file":name,"definitions":defs}),flush=True)
              for lo,hi in ranges:
                  if lo>len(lines):continue
                  print("LONG_SOURCE_RANGE",json.dumps({"file":name,"start":lo,
                    "lines":[str(i+1)+" "+lines[i] for i in range(lo-1,min(hi,len(lines)))]},
                    ensure_ascii=False),flush=True)
          print("LONG_SOURCE_AUDIT_COMPLETE",flush=True)
          PY
