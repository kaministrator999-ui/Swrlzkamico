name: §E v11.352 source integrity candidate
on:
  push:
    branches:
      - fix/model-studio-transform-access-20261108
    paths:
      - '.github/workflows/seal-swrlz-v11-352-candidate.yml'
      - 'projects/swrlz-forge-moba/.candidate-v11-352'
permissions:
  contents: read
jobs:
  source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compute v11.352 native source seal and validate transform controls
        run: |
          node --check projects/swrlz-forge-moba/runtime/studio_editor_layout_v11_320.js
          python - <<'PY'
          import json,hashlib,subprocess,sys
          from pathlib import Path
          root=Path('projects/swrlz-forge-moba')
          manifest=json.loads((root/'source-manifest.json').read_text('utf8'))
          assert manifest['name']=='§wyrl§ Engine v11.352'
          assert len(manifest['patches'])==360
          assert manifest['patches'][-1]=='patches/v11_352_model_transform_access.py'
          assert not manifest['finalSha256'] and not manifest['finalBytes']
          out=Path('/tmp/se352')
          subprocess.run([sys.executable,str(root/'build_space.py'),'--output',str(out)],check=True)
          raw=(out/'index.html').read_bytes()
          assert raw==(out/'modeler.html').read_bytes()
          html=raw.decode('utf8')
          for needle in (
           'SWYRL_ENGINE_DEPLOY_MARKER: V11_352_MODEL_TRANSFORM_ACCESS',
           "window.SWRLZ_FORGE_BUILD={version:'v11.352'",
           'se320ModelTransformAccess(panel,inspector);',
           'id=\'se320ModelTransform\'',
           'data-se320-transform="move"',
           'data-se320-transform="rotate"',
           'data-se320-transform="scale"',
           'data-se320-transform="minus"',
           'data-se320-transform="plus"',
           'source?.click();',
           'SE351_GAME_QUICK_ACTIONS_START',
           'SE350_MODEL_VR_TWO_HAND_WORKSPACE'
          ):
           assert needle in html,needle
          subprocess.run([sys.executable,str(root/'scripts/check_inline_js_syntax_v11_266.py'),str(out/'index.html')],check=True)
          receipt=json.loads((out/'SOURCE.json').read_text('utf8'))
          assert len(receipt['assets'])==71
          assert len([p for p in out.rglob('*') if p.is_file()])==75
          print('V11_352_FINAL_BYTES='+str(len(raw)),flush=True)
          print('V11_352_FINAL_SHA256='+hashlib.sha256(raw).hexdigest(),flush=True)
          print('V11_352_PATCH_COUNT='+str(len(manifest['patches'])),flush=True)
          print('V11_352_ASSETS='+str(len(receipt['assets'])),flush=True)
          print('V11_352_SOURCE_SEAL_PASS',flush=True)
          PY
