name: Manual Vercel Production Deploy

on:
  workflow_dispatch:
    inputs:
      approved:
        description: "Explicit production deployment approval"
        required: true
        type: choice
        options: ["no", "yes"]
        default: "no"
      ref:
        description: "Git ref to deploy"
        required: true
        default: "main"
  push:
    branches: [main]
    paths:
      - ".deploy/REQUEST.txt"

permissions:
  contents: read

concurrency:
  group: swrlz-production-deploy
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_E4y2LpTSFo9UxTErO9aw6HW1
  VERCEL_PROJECT_ID: prj_dGgleDMgkOQ57wULKlDH5fcYj9Yp

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
      ref: ${{ steps.gate.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: gate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.approved }}" != "yes" ]]; then
              echo "allowed=false" >> "$GITHUB_OUTPUT"
              echo "ref=main" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "ref=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          target="$(grep '^TARGET=' .deploy/REQUEST.txt | tail -n1 | cut -d= -f2-)"
          approved="$(grep '^APPROVED=' .deploy/REQUEST.txt | tail -n1 | cut -d= -f2-)"
          source_ref="$(grep '^SOURCE_REF=' .deploy/REQUEST.txt | tail -n1 | cut -d= -f2-)"
          if [[ "$target" == "production" && "$approved" == "1" ]]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "ref=${source_ref:-main}" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout approved source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.ref }}

      - name: Capture approved source identity
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          stable_version="$(python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('api/index.py')
          tree = ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          value = None
          for node in tree.body:
              if not isinstance(node, ast.Assign):
                  continue
              if not any(isinstance(target, ast.Name) and target.id == 'VERSION' for target in node.targets):
                  continue
              if isinstance(node.value, ast.Constant) and isinstance(node.value.value, str):
                  value = node.value.value
                  break
          if not value:
              raise SystemExit('api/index.py VERSION authority was not found')
          print(value)
          PY
          )"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "stable_version=$stable_version" >> "$GITHUB_OUTPUT"
          echo "Approved source SHA: $source_sha" >> "$GITHUB_STEP_SUMMARY"
          echo "Expected stable server version: $stable_version" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify deployment token exists
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo "VERCEL_TOKEN repository secret is required for manual production deployment." >&2
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull production environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Verify private collector Blob store
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          COLLECTOR_BLOB_STORE: swrlz-collector-o3nu
        run: |
          set -euo pipefail
          stores="$(vercel blob list-stores --token="$VERCEL_TOKEN" 2>&1 || true)"
          printf '%s\n' "$stores"
          if ! printf '%s\n' "$stores" | grep -Fq "$COLLECTOR_BLOB_STORE"; then
            echo "Expected private collector Blob store is not connected to this project." >&2
            exit 1
          fi
          echo "Private collector Blob store is already connected."
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Install Python build tooling
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.13"
          enable-cache: false

      - name: Build native R39 extensions
        shell: bash
        env:
          # Vercel's Python runtime image does not ship libgomp.so.1.
          # Build portable native kernels without the OpenMP runtime dependency.
          SWYRLZ_OPENMP: "0"
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "numpy==2.2.6" "setuptools>=75,<82" wheel
          python setup.py build_ext --inplace
          if find swyrlz -maxdepth 1 -type f -name '_r39_*.so' -print0 | xargs -0 -r ldd | grep -Fq 'libgomp'; then
            echo "R39 production native artifacts unexpectedly depend on libgomp; refusing to deploy." >&2
            exit 1
          fi
          PYTHONPATH="$GITHUB_WORKSPACE" python scripts/verify_r39_native.py
          PYTHONPATH="$GITHUB_WORKSPACE" python - <<'PY'
          from swyrlz import r39_native
          state = r39_native.diagnostics()
          assert state.get("available") is True, state
          assert state.get("batchAvailable") is True, state
          print(state)
          PY

      - name: Prepare promoted runtime generation
        id: runtime_generation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_runtime_generation.py \
            --accepted-root "accepted_runtime" \
            --output-root ".swrzl-prepared-runtime"
          source_runtime_sha="$(python - <<'PY'
          import json
          print(json.load(open(".swrzl-prepared-runtime/generation.json"))["sourceRuntimeCommit"])
          PY
          )"
          echo "sha=$source_runtime_sha" >> "$GITHUB_OUTPUT"
          echo "Prepared promoted runtime generation: $source_runtime_sha" >> "$GITHUB_STEP_SUMMARY"
          cat .swrzl-prepared-runtime/generation.json >> "$GITHUB_STEP_SUMMARY"

      - name: Stage build-only payload outside Vercel source tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/swrlz-build-stage/native"
          # The Git integration builds the clean source tree successfully. The
          # Actions-only generated runtime and native binaries are injected AFTER
          # vercel build, never traced into every Python function by the builder.
          mv .swrzl-prepared-runtime "$RUNNER_TEMP/swrlz-build-stage/prepared-runtime"
          shopt -s nullglob
          for artifact in swyrlz/_r39_native*.so swyrlz/_r39_native*.pyd swyrlz/_r39_native*.dylib swyrlz/_r39_batch*.so swyrlz/_r39_batch*.pyd swyrlz/_r39_batch*.dylib; do
            mv "$artifact" "$RUNNER_TEMP/swrlz-build-stage/native/"
          done
          # Transport chunks are excluded from Git deployments and must not
          # inflate the local prebuilt function trace either.
          if [[ -d .transport ]]; then
            mv .transport "$RUNNER_TEMP/swrlz-build-stage/transport"
          fi
          if [[ -f SWRLZ_NEW_SERVER_GITHUB_READY.zip ]]; then
            mv SWRLZ_NEW_SERVER_GITHUB_READY.zip "$RUNNER_TEMP/swrlz-build-stage/"
          fi
          # This historical inbox contains a second ~216 MB copy of the LALM
          # transport archive. It is not a Python runtime dependency.
          if [[ -d swrlz-core ]]; then
            mv swrlz-core "$RUNNER_TEMP/swrlz-build-stage/swrlz-core"
          fi
          # Fail closed if either transport copy remains in the builder input.
          test ! -d .transport
          test ! -d swrlz-core
          du -sh "$RUNNER_TEMP/swrlz-build-stage" . || true

      - name: Build production artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Inject prepared runtime generation into Python function bundles
        shell: bash
        run: |
          set -euo pipefail
          python_functions=0
          while IFS= read -r -d '' func_dir; do
            config="$func_dir/.vc-config.json"
            if [[ ! -f "$config" ]] || ! grep -Eq '"runtime"[[:space:]]*:[[:space:]]*"python' "$config"; then
              continue
            fi
            mkdir -p "$func_dir/swrzl_prepared_runtime"
            cp -a "$RUNNER_TEMP/swrlz-build-stage/prepared-runtime/." "$func_dir/swrzl_prepared_runtime/"
            python_functions=$((python_functions + 1))
          done < <(find .vercel/output/functions -type d -name '*.func' -print0)
          if [[ "$python_functions" -lt 1 ]]; then
            echo "No Python Vercel function bundles were found for prepared runtime injection." >&2
            exit 1
          fi
          echo "Injected prepared runtime generation into $python_functions Python function bundles." >> "$GITHUB_STEP_SUMMARY"

      - name: Inject native R39 artifacts into Python function bundles
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          native_artifacts=("$RUNNER_TEMP"/swrlz-build-stage/native/_r39_native*.so "$RUNNER_TEMP"/swrlz-build-stage/native/_r39_native*.pyd "$RUNNER_TEMP"/swrlz-build-stage/native/_r39_native*.dylib)
          batch_artifacts=("$RUNNER_TEMP"/swrlz-build-stage/native/_r39_batch*.so "$RUNNER_TEMP"/swrlz-build-stage/native/_r39_batch*.pyd "$RUNNER_TEMP"/swrlz-build-stage/native/_r39_batch*.dylib)
          if [[ "${#native_artifacts[@]}" -lt 1 || "${#batch_artifacts[@]}" -lt 1 ]]; then
            echo "Compiled R39 artifacts disappeared before function-bundle injection." >&2
            exit 1
          fi
          python_functions=0
          while IFS= read -r -d '' func_dir; do
            config="$func_dir/.vc-config.json"
            if [[ ! -f "$config" ]] || ! grep -Eq '"runtime"[[:space:]]*:[[:space:]]*"python' "$config"; then
              continue
            fi
            mkdir -p "$func_dir/swyrlz"
            cp -f "${native_artifacts[@]}" "${batch_artifacts[@]}" "$func_dir/swyrlz/"
            python_functions=$((python_functions + 1))
          done < <(find .vercel/output/functions -type d -name '*.func' -print0)
          if [[ "$python_functions" -lt 1 ]]; then
            echo "No Python Vercel function bundles were found for native injection." >&2
            find .vercel/output/functions -maxdepth 3 -type f -name '.vc-config.json' -print || true
            exit 1
          fi
          echo "Injected R39 native artifacts into $python_functions Python function bundles." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify native R39 artifacts are bundled
        shell: bash
        run: |
          set -euo pipefail
          native_count="$(find .vercel/output -type f \( -name '_r39_native*.so' -o -name '_r39_native*.pyd' -o -name '_r39_native*.dylib' \) | wc -l | tr -d ' ')"
          batch_count="$(find .vercel/output -type f \( -name '_r39_batch*.so' -o -name '_r39_batch*.pyd' -o -name '_r39_batch*.dylib' \) | wc -l | tr -d ' ')"
          echo "R39 native artifacts: $native_count" >> "$GITHUB_STEP_SUMMARY"
          echo "R39 batch artifacts: $batch_count" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$native_count" -lt 1 || "$batch_count" -lt 1 ]]; then
            echo "Production artifact is missing required R39 native accelerators; refusing to deploy." >&2
            find .vercel/output -type f | grep -E 'r39|swyrlz' || true
            exit 1
          fi

      - name: Clear previous project deployments
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          # The prebuilt replacement already exists locally at this point, so the
          # destructive cleanup happens at the last possible moment before deploy.
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&limit=100" \
            > previous-deployments.json
          python - <<'PY' > previous-deployment-ids.txt
          import json
          value=json.load(open("previous-deployments.json",encoding="utf-8"))
          for item in value.get("deployments",[]):
              deployment_id=str(item.get("uid") or item.get("id") or "").strip()
              if deployment_id:
                  print(deployment_id)
          PY
          count=0
          while IFS= read -r deployment_id; do
            [[ -n "$deployment_id" ]] || continue
            echo "Removing previous deployment $deployment_id"
            curl --fail --silent --show-error \
              -X DELETE \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$deployment_id?teamId=$VERCEL_ORG_ID" \
              >/dev/null
            count=$((count + 1))
          done < previous-deployment-ids.txt
          echo "Removed $count previous deployment(s) immediately before production deploy." >> "$GITHUB_STEP_SUMMARY"

          # Re-enumerate from Vercel after deletion. The release must fail closed
          # unless the canonical project is actually empty before replacement.
          curl --fail --silent --show-error             -H "Authorization: Bearer $VERCEL_TOKEN"             "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&limit=100"             > post-delete-deployments.json
          remaining="$(python - <<'PY'
          import json
          value=json.load(open("post-delete-deployments.json",encoding="utf-8"))
          print(len(value.get("deployments",[])))
          PY
          )"
          echo "Previous deployments remaining after destructive cleanup: $remaining" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$remaining" != "0" ]]; then
            echo "Canonical project still contains $remaining deployment(s) after destructive cleanup; refusing replacement deploy." >&2
            cat post-delete-deployments.json >&2
            exit 1
          fi

      - name: Deploy production artifact
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify production server, manifest authority, and collector
        shell: bash
        env:
          # Verify the canonical production alias. Deployment-specific URLs can
          # be protected and return a Vercel auth redirect even after the same
          # deployment has been successfully promoted/aliased to production.
          DEPLOYMENT_URL: https://swrlzkamico-o3nu.vercel.app
          EXPECTED_SOURCE_SHA: ${{ steps.source.outputs.sha }}
          EXPECTED_STABLE_VERSION: ${{ steps.source.outputs.stable_version }}
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 36); do
            code="$(curl --max-time 12 --silent --show-error --output server-status.json --write-out '%{http_code}' "$DEPLOYMENT_URL/api/server/status" || true)"
            if [[ "$code" == "200" ]] && python - <<'PY'
          import json
          import os

          with open("server-status.json", encoding="utf-8") as stream:
              value = json.load(stream)
          expected_version = os.environ["EXPECTED_STABLE_VERSION"]
          expected_sha = os.environ["EXPECTED_SOURCE_SHA"]
          assert value.get("version") == expected_version, (value.get("version"), expected_version)
          assert value.get("deploymentCommit") == expected_sha, (value.get("deploymentCommit"), expected_sha)
          assert value.get("deploymentEnvironment") == "production", value.get("deploymentEnvironment")
          caps = value.get("capabilities", {})
          assert caps.get("chat-resumable-generation", {}).get("ready") is True
          assert caps.get("chat-resumable-generation", {}).get("contract") == "resumable-v1"
          assert caps.get("chat-generation-transcript", {}).get("ready") is True
          assert caps.get("chat-generation-transcript", {}).get("contract") == "generation-transcript-v1"
          assert caps.get("chat-shared-generation-transcript", {}).get("ready") is True
          assert caps.get("chat-shared-generation-transcript", {}).get("contract") == "shared-private-blob-v1"
          assert caps.get("chat-shared-generation-transcript", {}).get("access") == "private"
          assert caps.get("chat-rmcca-direct-transport", {}).get("ready") is True
          assert caps.get("chat-rmcca-direct-transport", {}).get("contract") == "rmcca-direct-v1"
          assert caps.get("runtime-delivery-optimization", {}).get("ready") is True
          assert caps.get("runtime-delivery-optimization", {}).get("contract") == "prepared-runtime-generation-v3"
          assert caps.get("runtime-delivery-optimization", {}).get("requestPathSync") is False
          assert caps.get("runtime-delivery-optimization", {}).get("r39HistoricalNetworkFetch") is False
          generation = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "swrlz-build-stage/prepared-runtime/generation.json")))
          assert generation.get("r39SourceDelivery") == "local-precomposed-full-lineage-v2"
          assert len(generation.get("r39OverlayChain") or []) == 16
          assert len(generation.get("r39HistoricalAncestry") or []) >= 1
          prepared_files = {item.get("acceptedTarget") for item in generation.get("files", [])}
          assert "research/online_research_reasoner.py" in prepared_files
          assert caps.get("runtime-manifest-authority", {}).get("ready") is True
          assert caps.get("runtime-manifest-authority", {}).get("contract") == "github-contents-manifest-v1"
          live = caps.get("instance-independent-live-source", {})
          assert live.get("assetCacheContract") == "manifest-versioned-immutable-v1"
          assert live.get("manifestAuthority") == "github-contents-api-v1"
          assert live.get("manifestFailurePolicy") == "fail-closed-no-stale-raw-manifest"
          PY
            then
              ready=1
              break
            fi
            sleep 5
          done
          if [[ "$ready" != "1" ]]; then
            echo "Approved source readiness did not pass for stable server $EXPECTED_STABLE_VERSION @ $EXPECTED_SOURCE_SHA." >&2
            if [[ -s server-status.json ]]; then
              python -m json.tool server-status.json || cat server-status.json
            fi
            exit 1
          fi

          native_code="$(curl --max-time 20 --silent --show-error --output native-status.json --write-out '%{http_code}' "$DEPLOYMENT_URL/api/lalm/native" || true)"
          test "$native_code" = "200"
          python - <<'PY'
          import json
          with open("native-status.json", encoding="utf-8") as stream:
              value = json.load(stream)
          assert value.get("ok") is True, value
          assert value.get("available") is True, value
          assert value.get("batchAvailable") is True, value
          PY

          manifest_code="$(curl --max-time 12 --silent --show-error --dump-header manifest-headers.txt --output live-manifest.json --write-out '%{http_code}' "$DEPLOYMENT_URL/live/manifest.json" || true)"
          test "$manifest_code" = "200"
          grep -iq '^x-swrlz-manifest-authority: github-contents-api-v1' manifest-headers.txt
          python - <<'PY'
          import json
          with open("live-manifest.json", encoding="utf-8") as stream:
              value = json.load(stream)
          assert int(value.get("version", 0)) >= 35, value.get("version")
          scripts = value.get("routes", {}).get("/chat", {}).get("scripts", [])
          assert "web/chat_runtime_loader_v3.js" in scripts, scripts
          PY

          loader_code="$(curl --max-time 12 --silent --show-error --output chat-runtime-loader.js --write-out '%{http_code}' "$DEPLOYMENT_URL/live/assets/chat_runtime_loader_v3.js" || true)"
          test "$loader_code" = "200"
          grep -Fq "chat_turn_integrity_v1.js" chat-runtime-loader.js

          collector_code="$(curl --max-time 12 --silent --show-error --output collector-readiness.json --write-out '%{http_code}' "$DEPLOYMENT_URL/api/collector/readiness" || true)"
          test "$collector_code" = "200"
          python - <<'PY'
          import json
          with open("collector-readiness.json", encoding="utf-8") as stream:
              value = json.load(stream)
          assert value.get("ready") is True
          assert value.get("storage", {}).get("configured") is True
          assert value.get("storage", {}).get("access") == "private"
          PY
          echo "Approved source $EXPECTED_SOURCE_SHA passed stable server $EXPECTED_STABLE_VERSION + manifest authority + optimized hot-runtime delivery + shared transcript continuity + direct RMCCA transport + collector readiness." >> "$GITHUB_STEP_SUMMARY"

      - name: Deployment receipt
        run: |
          echo "Source ref: ${{ needs.authorize.outputs.ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Approved source SHA: ${{ steps.source.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Stable server version: ${{ steps.source.outputs.stable_version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Trigger: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Workflow commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
