name: §E v11.381 sealed Quest guest verification

on:
  push:
    branches: [fix/sheep-xr-guest-sync-381]
    paths:
      - 'projects/swrlz-forge-moba/**'
      - '.github/workflows/preview-se381-source-digest.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify complete sealed source and focused Quest guest regression
        run: python projects/swrlz-forge-moba/scripts/verify_v11_381_release.py --output dist/se381-candidate
