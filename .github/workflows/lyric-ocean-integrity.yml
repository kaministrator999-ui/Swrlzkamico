name: Lyric Ocean Corpus Integrity
on:
  pull_request:
    paths:
      - 'training/lyrics/**'
      - 'hf_space/lyric_craft_school.py'
      - 'hf_space/rap_micro_curriculum.py'
      - 'tests/test_rap_micro_curriculum_v198.py'
      - 'reports/RAP_SKILL_LADDER_V198.md'
      - 'hf_space/lyric_structure_school.py'
      - 'hf_space/lyric_bounded_continuation.py'
      - 'hf_space/lyric_story_spine.py'
      - 'hf_space/lyric_research_lab.py'
      - 'tests/test_research_assisted_lyrics_v196.py'
      - 'tests/test_lyric_story_spine_v193.py'
      - 'tests/test_lyric_native_reader_fallback_v195.py'
      - 'tests/test_lyric_bounded_continuation_v191.py'
      - 'tests/test_lyric_draft_boundary_v192.py'
      - 'hf_space/lyric_structure_patterns_v1.json'
      - 'tests/test_crossgenre_song_structure_v190.py'
      - 'hf_space/lyric_output_contract.py'
      - 'tests/test_lyric_output_contract_v187.py'
      - 'hf_space/lyric_craft_catalog_v2.json'
      - 'hf_space/lfm2_700m_engine.py'
      - 'tests/test_archive_grounded_lyric_craft_v182.py'
      - '.github/workflows/lyric-ocean-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  corpus-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate without promotion
        uses: actions/checkout@v4
      - name: Compile bounded runtime teaching code
        run: |
          python -m py_compile hf_space/lyric_craft_school.py hf_space/lyric_output_contract.py hf_space/lfm2_700m_engine.py
      - name: Validate cross-genre structure study bank and bounded model cues
        run: |
          python -m py_compile hf_space/lyric_structure_school.py
          python -m unittest discover -s tests -p test_crossgenre_song_structure_v190.py -v
      - name: Validate exact-line continuation on bounded fake model streams
        run: |
          python -m py_compile hf_space/lyric_bounded_continuation.py hf_space/lfm2_700m_engine.py
          python -m unittest discover -s tests -p test_lyric_bounded_continuation_v191.py -v
      - name: Verify 139-to-40 whole-draft boundary and negative constraints
        run: python -m unittest discover -s tests -p test_lyric_draft_boundary_v192.py -v
      - name: Validate causal story planner routing and model-derived beat safety
        run: |
          python -m py_compile hf_space/lyric_story_spine.py hf_space/lfm2_700m_engine.py
          python -m unittest discover -s tests -p test_lyric_story_spine_v193.py -v
      - name: Validate planner fallback categories and authored scene continuity
        run: |
          python -m py_compile hf_space/lyric_story_spine.py hf_space/lfm2_700m_engine.py
          python -m unittest discover -s tests -p test_lyric_native_reader_fallback_v195.py -v
      - name: Verify bounded research and saved abstract songwriting techniques
        run: |
          python -m py_compile hf_space/lyric_research_lab.py hf_space/lfm2_700m_engine.py
          python -m unittest discover -s tests -p test_research_assisted_lyrics_v196.py -v
      - name: Verify rap beat-pocket micro-lessons and original lyrical constraints
        run: |
          python -m py_compile hf_space/rap_micro_curriculum.py hf_space/lfm2_700m_engine.py
          python -m unittest discover -s tests -p test_rap_micro_curriculum_v198.py -v
      - name: Validate lyric school, revision evidence, and privacy shape
        run: python tests/test_archive_grounded_lyric_craft_v182.py
      - name: Verify direct original lyric count and unrequested-refusal regression
        run: python tests/test_lyric_output_contract_v187.py
      - name: Report non-production scope
        run: |
          echo "Validated source-only corpus schemas, counts, teaching selector and evidence anchors."
          echo "No GGUF weight training, creative-performance benchmark, HF release or deployment occurred."
