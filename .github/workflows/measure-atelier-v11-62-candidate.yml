name: Measure §E v11.62 governed source seal
on:
  pull_request:
    paths:
      - 'projects/swrlz-forge-moba/patches/v11_62_mobile_tool_layout.py'
      - 'projects/swrlz-forge-moba/patches/v11_62_mobile_tool_layout_preview.py'
      - 'projects/swrlz-forge-moba/scripts/measure_v11_62_candidate.py'
      - 'projects/swrlz-forge-moba/source-manifest.json'
      - '.github/workflows/measure-atelier-v11-62-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Measure exact source candidate against governed manifest
        run: python projects/swrlz-forge-moba/scripts/measure_v11_62_candidate.py
