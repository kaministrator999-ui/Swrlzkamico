name: §E v11.149 targeted menu parity and peer host checks
on:
  push:
    branches: ["feature/se-v11-149-menu-preview-peer-host"]
    paths:
      - "projects/swrlz-forge-moba/**"
      - ".github/workflows/measure-engine-menu-v11-149.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check focused JS and patch
        run: |
          node --check projects/swrlz-forge-moba/runtime/sheep_peer_menu_v11_149.js
          python -m py_compile projects/swrlz-forge-moba/patches/v11_149_peer_menu_parity.py
          node projects/swrlz-forge-moba/tests/sheep_peer_menu_v11_149.mjs
      - name: Build and seal engine
        run: |
          python projects/swrlz-forge-moba/scripts/measure_v11_149_source.py
          python projects/swrlz-forge-moba/scripts/verify_v11_149_release.py --output dist/swrlz-forge-moba
          node --check dist/swrlz-forge-moba-module.mjs
      - name: Browser mobile UI and direct peer connections
        run: |
          python -m pip install playwright
          python projects/swrlz-forge-moba/tests/sheep_peer_menu_chromium_v11_149.py
