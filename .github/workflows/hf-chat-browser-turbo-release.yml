name: Guarded HF Browser Turbo Release
on:
  push:
    branches: [main]
    paths:
      - ".deploy/HF_CHAT_BROWSER_TURBO_REQUEST.txt"
permissions:
  contents: read
# Isolated from the stale queued Local Vosk run. Space revision leasing in
# the publisher prevents overwriting another concurrently published change.
concurrency:
  group: swrlz-hf-browser-turbo-release
  cancel-in-progress: false
jobs:
  browser-turbo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Read approved request
        uses: actions/checkout@v4
      - name: Validate immutable pin and free-only scope
        id: request
        shell: bash
        run: |
          set -euo pipefail
          file=".deploy/HF_CHAT_BROWSER_TURBO_REQUEST.txt"
          get() { sed -n "s/^$1=//p" "$file" | tail -n 1; }
          test -f "$file"
          test "$(get TARGET)" = "kamiloki/Swyrlz"
          test "$(get APPROVED)" = "1"
          test "$(get NO_PAID_SPEECH_API)" = "1"
          test "$(get NO_HARDWARE_UPGRADE)" = "1"
          ref="$(get SOURCE_REF)"
          nonce="$(get REQUEST_NONCE)"
          [[ "$ref" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::Immutable SHA required"; exit 1; }
          [[ "$nonce" =~ ^[A-Za-z0-9._-]{10,96}$ ]] || { echo "::error::Invalid nonce"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Checkout exact verified Browser Turbo candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.ref }}
          path: voice-turbo-source
          fetch-depth: 1
      - name: Verify both recognizer families and Chat voice lifecycle
        shell: bash
        run: |
          set -euo pipefail
          node --check voice-turbo-source/chat/§wyrlz/assets/voice_conversation.js
          node --check voice-turbo-source/chat/§wyrlz/assets/local_voice_vosk.js
          node voice-turbo-source/scripts/test_chat_browser_turbo.cjs
          node voice-turbo-source/scripts/test_chat_streaming_voice.cjs
          node voice-turbo-source/scripts/test_chat_local_voice_accuracy_v6.cjs
          node voice-turbo-source/scripts/test_chat_local_streaming_vosk.cjs
          node voice-turbo-source/scripts/test_chat_local_vosk_recovery.cjs
          node voice-turbo-source/scripts/test_chat_local_turbo.cjs
          python -m py_compile voice-turbo-source/scripts/publish_hf_browser_turbo.py
      - name: Install existing Hugging Face client
        run: python -m pip install 'huggingface_hub>=0.34,<2'
      - name: Verify live §C 1.1.37 and prepare scoped rollback
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          python voice-turbo-source/scripts/publish_hf_browser_turbo.py prepare
      - name: Preserve live Chat, Talk and offline ASR source
        uses: actions/upload-artifact@v4
        with:
          name: hf-browser-turbo-rollback
          path: hf-browser-turbo-rollback/
          retention-days: 90
          if-no-files-found: error
      - name: Publish two-file §C 1.1.38 Browser Turbo with revision guard
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          python voice-turbo-source/scripts/publish_hf_browser_turbo.py publish
