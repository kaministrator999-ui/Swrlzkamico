name: Validate §wyrl§ Engine v5.3 candidate

on:
  push:
    branches: [swyrl-engine-v5-3]
    paths:
      - ".github/workflows/validate-swyrl-v5-3.yml"
      - "projects/swrlz-forge-moba/patches/v5_3_groups_immersive_den.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: swyrl-engine-v5-3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build exact v5.2 source
        run: |
          set -euo pipefail
          python projects/swrlz-forge-moba/build_space.py --output /tmp/v52
      - name: Apply v5.3 patch
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, importlib.util, json
          from pathlib import Path
          source=Path("/tmp/v52/index.html").read_text(encoding="utf-8")
          path=Path("projects/swrlz-forge-moba/patches/v5_3_groups_immersive_den.py")
          spec=importlib.util.spec_from_file_location("v53",path)
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          out=mod.apply(source)
          data=out.encode("utf-8")
          print("SWYRL_V5_3_INTEGRITY="+json.dumps({"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()},sort_keys=True))
          Path("/tmp/swyrl-v5-3.html").write_text(out,encoding="utf-8")
          PY
      - name: Verify grouping and Den semantics
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path("/tmp/swyrl-v5-3.html").read_text(encoding="utf-8")
          required=[
            "SWYRL_ENGINE_DEPLOY_MARKER: V5_3_GROUPS_IMMERSIVE_DEN",
            "function groupActors(",
            "function ungroupActor(",
            "function restoreActorGroups(",
            "groupParentId",
            "Vaulted Cavern Roof",
            "Seed Chamber Stone Floor",
            "Cavern Shell",
            "currentProject?.environment==='dragon-den'",
            "swyrl-engine-agent-v3.3",
          ]
          missing=[x for x in required if x not in s]
          print("MISSING=",missing)
          if missing: raise SystemExit(1)
          PY
      - name: Syntax-check generated module
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path("/tmp/swyrl-v5-3.html").read_text(encoding="utf-8")
          start=s.index('<script type="module">')+len('<script type="module">')
          end=s.rindex('</script>')
          Path("/tmp/swyrl-v5-3.mjs").write_text(s[start:end],encoding="utf-8")
          PY
          node --check /tmp/swyrl-v5-3.mjs
