name: Fix §C live model router callback
on:
  pull_request:
    paths:
      - scripts/hf_chat_real_router_fix_release_v1.py
      - .github/workflows/hf-chat-real-router-fix-v1.yml
  push:
    branches: [main]
    paths:
      - scripts/hf_chat_real_router_fix_release_v1.py
      - .github/workflows/hf-chat-real-router-fix-v1.yml
permissions: {contents: read}
concurrency:
  group: swrlz-real-router-fix-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet 'huggingface_hub>=0.34,<2'
      - name: Validate hotfix and source-extracted real router
        run: |
          python -m py_compile scripts/hf_chat_real_router_fix_release_v1.py
          python scripts/hf_chat_real_router_fix_release_v1.py selftest
      - name: Confirm current production router and patch before publishing
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/hf_chat_real_router_fix_release_v1.py preflight
      - name: Publish and verify current HF Space
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release-real-router-fix-v1]')
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SWRLZ_REAL_ROUTER_APPROVED: '1'
        run: python -u scripts/hf_chat_real_router_fix_release_v1.py publish
