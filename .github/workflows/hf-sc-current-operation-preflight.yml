name: "§C current-operation intent source-pinned preflight"
on:
  pull_request:
    paths:
      - "scripts/hf_guest_prose_intent_override_v1.py"
      - ".github/workflows/hf-guest-prose-intent-override-release.yml"
      - ".github/workflows/hf-sc-current-operation-preflight.yml"
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Check guarded patcher syntax
        run: python -m py_compile scripts/hf_guest_prose_intent_override_v1.py
      - name: Install Hub client
        run: python -m pip install --quiet 'huggingface_hub>=0.34,<2'
      - name: Verify candidate against exact current Hugging Face source
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u scripts/hf_guest_prose_intent_override_v1.py preflight
      - name: Preserve read-only source receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sc-current-operation-source-preflight-${{ github.run_id }}
          path: reports/prose-intent-override-v1/
          if-no-files-found: ignore
          retention-days: 7
