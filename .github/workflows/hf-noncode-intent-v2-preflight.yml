name: Preflight §C non-code intent precedence v2
on:
  pull_request:
    paths:
      - 'scripts/hf_noncoding_intent_precision_v2.py'
      - '.github/workflows/hf-noncode-intent-v2-preflight.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/hf_noncoding_intent_precision_v2.py'
      - '.github/workflows/hf-noncode-intent-v2-preflight.yml'
permissions: {contents: read}
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet 'huggingface_hub>=0.34,<2'
      - name: Compile exact one-file candidate and run live-source contract tests
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m py_compile scripts/hf_noncoding_intent_precision_v2.py
          python -u scripts/hf_noncoding_intent_precision_v2.py preflight
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sc-noncode-intent-preflight-${{ github.run_id }}
          path: reports/sc-noncode-intent-v2/
          retention-days: 21
          if-no-files-found: ignore
