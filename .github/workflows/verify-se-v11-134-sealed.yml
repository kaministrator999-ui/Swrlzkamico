name: §E v11.134 sealed sheep ghost and rapid build interaction
on:
  push:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/source-manifest.json"
      - "projects/swrlz-forge-moba/scripts/verify_v11_134_release.py"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install DOM regression
        run: npm install --prefix /tmp/se134-dom --no-audit --no-fund jsdom@25.0.1
      - name: Rebuild exact 166-patch released engine and verify original 68 assets
        run: |
          python projects/swrlz-forge-moba/scripts/verify_v11_134_release.py --output /tmp/se134-release
          node --check /tmp/se134-release-module.mjs
      - name: Validate Rapid OFF, exact sheep ghost, all ability buttons and swapped skill layout
        env:
          SE_JSDOM_MODULE: /tmp/se134-dom/node_modules/jsdom
          SE_ASSEMBLED_HTML: /tmp/se134-release/index.html
        run: node projects/swrlz-forge-moba/tests/rapid_off_sheep_ghost_skill_layout_v11_134.mjs
