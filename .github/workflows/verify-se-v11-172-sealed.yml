name: §E v11.172 sealed embedded Chat header verification
on:
  push:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/scripts/verify_v11_172_release.py"
      - ".github/workflows/verify-se-v11-172-sealed.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Verify exact package, 68 assets and no redundant link
        run: python projects/swrlz-forge-moba/scripts/verify_v11_172_release.py --output dist/se172
      - name: Check targeted panel regression and previous modal
        run: |
          node projects/swrlz-forge-moba/tests/chat_header_v11_172.mjs
          node projects/swrlz-forge-moba/tests/project_modal_stack_v11_171.mjs
