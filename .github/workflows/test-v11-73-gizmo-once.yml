name: Test §E v11.73 gizmo switch and arc touch once
on:
  push:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/patches/v11_73_gizmo_touch.py"
permissions:
  contents: read
jobs:
  gizmo-interaction:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble 105-patch candidate and syntax check
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,gzip,hashlib,importlib.util,json
          from pathlib import Path
          root=Path('projects/swrlz-forge-moba')
          m=json.loads((root/'source-manifest.json').read_text())
          raw=gzip.decompress(base64.b64decode(''.join((root/p).read_text().strip() for p in m['chunks'])))
          assert hashlib.sha256(raw).hexdigest()==m['baseSha256']
          html=raw.decode()
          for i,path in enumerate(m['patches']+['patches/v11_73_gizmo_touch.py']):
              spec=importlib.util.spec_from_file_location('p'+str(i),root/path)
              mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
              html=mod.apply(html)
          data=html.encode()
          print('SWRLZ_V1173_FINAL_BYTES='+str(len(data)),flush=True)
          print('SWRLZ_V1173_FINAL_SHA256='+hashlib.sha256(data).hexdigest(),flush=True)
          print('SWRLZ_V1173_PATCH_COUNT='+str(len(m['patches'])+1),flush=True)
          assert html.count('SWYRL_ENGINE_DEPLOY_MARKER: V11_73_INSTANT_GIZMO_ROTATION_TOUCH')==1
          assert 'if(btn.dataset.mode||btn.dataset.axis)atelierMeshPaintModeImmediately();' in html
          assert 'atelierArcThickenRulers();' in html
          assert 'if(atelierArcEasyDown(e))return true;' in html
          Path('/tmp/1173.mjs').write_text(html.split('<script type="module">',1)[1].rsplit('</script>',1)[0])
          Path('/tmp/1173.html').write_text(html)
          PY
          node --check /tmp/1173.mjs
      - name: Install browser interaction driver
        run: npm install --no-save --prefix /tmp/swyrl-browser-test playwright@1.56.0
      - name: Verify immediate tool paint and full-arc hit testing in Chromium
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME_BIN" ]; then
            /tmp/swyrl-browser-test/node_modules/.bin/playwright install chromium
            CHROME_BIN="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -path '*chrome-linux*' | head -1)"
          fi
          test -x "$CHROME_BIN"
          export CHROME_BIN
          python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/1173.html').read_text()
          instrument="""window.__gizmoTouchTest={
           ready:()=>!!(renderer&&modelRoot&&model()?.parts?.length),
           pick:()=>{const p=model().parts.find(p=>/anatomical head/i.test(p.name))||model().parts[0];select(p.id);return p.name;},
           switchMode:(mode)=>{
             const prev=atelierModePaintCount;
             document.querySelector('#modelAtelierMeshQuickStrip [data-mode="'+mode+'"]').click();
             return {mode:atelierMeshMode,painted:atelierModePaintCount-prev,
               gizmoCount:world.children.filter(o=>o.name==='Selected mesh transforms').length,
               arcCount:atelierArcRings.size,
               thick:[...atelierArcRings.values()].filter(v=>!!v.wideTrack).length};
           },
           arcDimensions:()=>{
             const a=atelierArcRings.get('z');
             return {radius:a?.radius,thickness:a?.wideTrack?.geometry?.parameters?.radius,
               beadRadius:a?.bead?.geometry?.parameters?.radius*a?.bead?.scale?.x};
           },
           arcPoint:(axis,offset)=>{
             const item=atelierArcRings.get(axis);
             const screen=v=>{
               const p=v.clone().project(camera),r=renderer.domElement.getBoundingClientRect();
               return {x:r.left+(p.x+1)*r.width/2,y:r.top+(1-p.y)*r.height/2};
             };
             const at=screen(item.ring.localToWorld(atelierArcPoint(item.radius,item.phase+offset)));
             const ahead=screen(item.ring.localToWorld(atelierArcPoint(item.radius,item.phase+offset+.1)));
             const bead=screen(item.hit.getWorldPosition(new THREE.Vector3()));
             const dx=ahead.x-at.x,dy=ahead.y-at.y,length=Math.hypot(dx,dy)||1;
             const hit=atelierArcPickOnScreen({clientX:at.x,clientY:at.y,pointerType:'mouse'});
             return {...at,tx:dx/length,ty:dy/length,selectedAxis:hit?.axis||null,
               beadDistance:Math.hypot(at.x-bead.x,at.y-bead.y)};
           },
           state:()=>{
             const m=atelierMeshSelectedMeshes()[0],r=atelierArcRings.get(atelierMeshDrag?.axis||atelierMeshAxis);
             return {dragging:!!atelierMeshDrag,axis:atelierMeshDrag?.axis,
               rotation:m?.rotation.toArray().slice(0,3)||[],
               beadAngle:r?Math.atan2(r.hit.position.y,r.hit.position.x)-r.phase:0};
           },
           mobile:()=>{
             const previous=atelierModePaintCount;
             document.querySelector('#modelAtelierMeshQuickStrip [data-mode="move"]').click();
             document.querySelector('#modelAtelierMeshQuickStrip [data-mode="rotate"]').click();
             const r=atelierArcRings.get('x'),p=r.ring.localToWorld(atelierArcPoint(r.radius,r.phase+.4)).project(camera);
             const b=renderer.domElement.getBoundingClientRect();
             const x=b.left+(p.x+1)*b.width/2,y=b.top+(1-p.y)*b.height/2;
             return {repaint:atelierModePaintCount-previous===2?1:0,arcCount:atelierArcRings.size,
               touchHit:!!atelierArcPickOnScreen({clientX:x+13,clientY:y+10,pointerType:'touch'})};
           }
          };"""
          anchor='function atelierMeshGizmoDown(e){'
          assert s.count(anchor)==1
          s=s.replace(anchor,instrument+'\n'+anchor,1)
          d=Path('/tmp/swyrl1173');d.mkdir(exist_ok=True)
          (d/'index.html').write_text(s)
          PY
          python -m http.server 8765 --bind 127.0.0.1 --directory /tmp/swyrl1173 >/tmp/swyrl1173-server.log 2>&1 &
          sleep 2
          node projects/swrlz-forge-moba/scripts/test_v11_73_gizmo_touch.mjs
