name: Verify §E v11.62 native cinematic candidate
on:
  push:
    branches: [main]
    paths: &anime_paths
      - '.github/workflows/verify-swrlz-native-cinematic.yml'
      - 'projects/swrlz-forge-moba/patches/v8_6*'
      - 'projects/swrlz-forge-moba/patches/v8_7*'
      - 'projects/swrlz-forge-moba/patches/v8_8*'
      - 'projects/swrlz-forge-moba/patches/v8_9*'
      - 'projects/swrlz-forge-moba/patches/v9_*'
      - 'projects/swrlz-forge-moba/assets/anime/**'
      - 'projects/swrlz-forge-moba/episodes/**'
      - 'projects/swrlz-forge-moba/scenes/ghosts-in-different-forms-*'
      - 'projects/swrlz-forge-moba/runtime/anime_*'
      - 'projects/swrlz-forge-moba/runtime/character_*'
      - 'projects/swrlz-forge-moba/tests/anime_*'
      - 'projects/swrlz-forge-moba/tests/native_anime*'
      - 'projects/swrlz-forge-moba/tests/storybook_*'
      - 'projects/swrlz-forge-moba/tests/episode_*'
      - 'projects/swrlz-forge-moba/tests/character_*'
      - 'projects/swrlz-forge-moba/tests/depth_theatre*'
      - 'projects/swrlz-forge-moba/tests/socket_*'
      - 'projects/swrlz-forge-moba/build_space.py'
  pull_request:
    branches: [main]
    paths: *anime_paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engine-ci-verify-swrlz-native-cinematic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  route:
    name: Select affected anime/cinematic subsystem
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.select.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - id: select
        name: Skip unrelated Model Atelier / Sheep / Maul edits
        run: |
          python projects/swrlz-forge-moba/scripts/route_ci_suites.py \
            --component anime --event '${{ github.event_name }}' \
            --base HEAD^ --head HEAD --output "$GITHUB_OUTPUT"
  verify:
    needs: route
    if: needs.route.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct exact cinematic candidate from baseline
        run: |
          python - <<'PY'
          import base64,gzip,json,hashlib
          from pathlib import Path
          import runpy
          root=Path("projects/swrlz-forge-moba")
          manifest=json.loads((root/"source-manifest.json").read_text(encoding="utf-8"))
          mod=runpy.run_path(str(root/"build_space.py"))
          raw=gzip.decompress(base64.b64decode("".join((root/p).read_text(encoding="utf-8").strip() for p in manifest["chunks"])))
          assert hashlib.sha256(raw).hexdigest()==manifest["baseSha256"]
          assert len(raw)==manifest["baseBytes"]
          source=raw.decode("utf-8")
          for rel in manifest["patches"]:
            source=mod["load_patch"](root/rel)(source)
          output=source.encode("utf-8")
          print("CINEMATIC_BYTES="+str(len(output)))
          print("CINEMATIC_SHA256="+hashlib.sha256(output).hexdigest())
          assert len(manifest["patches"])==94
          assert manifest['patches'][-1]=='patches/v11_62_mobile_adaptive.py'
          print('UNSEALED_V11_4_CANDIDATE_BYTES='+str(len(output)),flush=True)
          print('UNSEALED_V11_4_CANDIDATE_SHA256='+hashlib.sha256(output).hexdigest(),flush=True)
          assert len(output)==manifest['finalBytes']
          assert hashlib.sha256(output).hexdigest()==manifest['finalSha256']
          for needle in (
            'V11_62_MOBILE_ADAPTIVE_TOOL_SHEET','SWYRL_ENGINE_PERFORMANCE','anime-performance-v1','SWYRL_ENGINE_STORY_EFFECTS','anime-story-effects-v1','MAUL_BATCH_CORE','grouped-v1','MAUL_LAYOUT_CORE','classic-v2','SWYRL_ENGINE_MAUL','MAUL_CORE','maul-frostveil','SWYRL_ENGINE_SHEEP_TAG_RUNS','SWYRL_ENGINE_RUNS','stRunAfterTick','stRunInstallUI','stRunViewerMount','swyrl-editor-play-run-v1','stTouchPlacementScreen','stTouchPlacementGround','touchPlacement','SWYRL_ENGINE_SHEEP_TAG','sheep-tag-meadow','sheep-tag-moonbell-archive','swyrl-sheep-tag-map-v1','SWYRL_ENGINE_TRANSPORT','animeCineRewind','animeCineFastForward','SWYRL_ENGINE_STAFF','rigFullStaffStatus','painted-full-v1','assets/anime/kami-full-staff.png','Maker v11.62','animeStartCinematic',
            'SWYRL_ENGINE_ANIMATION','SWYRL_ENGINE_STORYBOARD','SWYRL_ENGINE_RIG','SWYRL_ENGINE_SCENERY','SWYRL_ENGINE_SOCKETS','SWYRL_ENGINE_EMERGENCE','SWYRL_ENGINE_RELIEF',
                          'anime-rig-sockets-v1','anime-book-emergence-v1','anime-character-relief-v1','storyEditorInstall',
            'animeUpdateCinematic','animeEndCinematic','animeSpeakerCues',
            'animeCineExplore','animeCineScrub','updateWorkspaceInteraction(t);animeUpdateCinematic(dt);',
            'if(animeCine?.active)return;',
            'if(currentProject?.canonicalId===\'ghosts-different-forms-ep01\'',
          ):
            assert needle in source,needle
          assert "V8_5_ANIME_STUDIO_STARTER" not in source
          i=source.index('<script type="module">')+len('<script type="module">')
          e=source.rindex("</script>")
          Path('/tmp/cinematic-engine.mjs').write_text(source[i:e],encoding='utf-8')
          Path('/tmp/cinematic-engine.html').write_bytes(output)
          print("CINEMATIC_RECONSTRUCT_OK")
          PY
          node --check /tmp/cinematic-engine.mjs
          python -m py_compile projects/swrlz-forge-moba/patches/v8_6_native_anime_cinematic.py
          echo "CINEMATIC_NODE_AND_PYTHON_SYNTAX_OK"
          python projects/swrlz-forge-moba/build_space.py --output /tmp/cinematic-package
          python projects/swrlz-forge-moba/tests/maul_layout_package.py --package /tmp/cinematic-package
          python projects/swrlz-forge-moba/tests/maul_batch_package.py --package /tmp/cinematic-package
          python projects/swrlz-forge-moba/tests/episode_performance_package.py --package /tmp/cinematic-package
