name: §E v11.114 viewport gizmos full-source seal
on:
  push:
    branches: ['feature/se-v11-114-circle-viewport-gizmos']
    paths: ['.github/workflows/se-v11114-full-seal.yml']
permissions:
  contents: read
jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Reconstruct all 146 patches and calculate exact runtime integrity seal
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import gzip,base64,hashlib,json,sys
          root=Path('projects/swrlz-forge-moba')
          sys.path.insert(0,str(root.resolve()))
          from build_space import load_patch
          m=json.loads((root/'source-manifest.json').read_text())
          assert m['name']=='§wyrl§ Engine v11.114' and len(m['patches'])==146
          assert m['patches'][-1]=='patches/v11_114_circle_viewport_handles.py'
          data=gzip.decompress(base64.b64decode(''.join((root/p).read_text().strip() for p in m['chunks'])))
          assert len(data)==m['baseBytes'] and hashlib.sha256(data).hexdigest()==m['baseSha256']
          html=data.decode('utf-8')
          for patch in m['patches']:html=load_patch(root/patch)(html)
          for needle in (
           'SWYRL_ENGINE_DEPLOY_MARKER: V11_114_CIRCLE_VIEWPORT_HANDLES',
           '<title>§wyrl§ Engine · Maker v11.114</title>',
           "window.SWRLZ_FORGE_BUILD={version:'v11.114'",
           'function atelierPrecisionGizmoDraw(){',
           'function atelierPrecisionGizmoDown(event){',
           'function atelierPrecisionGizmoMove(event){',
           'function atelierPrecisionGizmoUp(event){',
           'atelierPrecisionGizmoInstall();',
           'modelAtelierBoreGizmoRadius',
           'modelAtelierBoreGizmoDepth'):
            assert needle in html,needle
          assert '3 holes · bowling ball' not in html
          Path('/tmp/se-v11114.mjs').write_text(html.split('<script type="module">',1)[1].rsplit('</script>',1)[0])
          raw=html.encode('utf-8')
          print('SE_V11114_FULL_BYTES='+str(len(raw)))
          print('SE_V11114_FULL_SHA256='+hashlib.sha256(raw).hexdigest())
          assert len(raw)==m['finalBytes'], 'Full HTML byte count mismatch'
          assert hashlib.sha256(raw).hexdigest()==m['finalSha256'], 'Full HTML SHA mismatch'
          print('SE_V11114_FULL_GIZMO_SOURCE_PASS')
          PY
          node --check /tmp/se-v11114.mjs
      - name: Verify full official release, source receipt, all bundled assets
        run: |
          set -euo pipefail
          python projects/swrlz-forge-moba/scripts/verify_v11_114_release.py --output /tmp/se-v11114-release
          node --check /tmp/se-v11114-release-module.mjs
