name: Measure §E v11.68 live mesh drag once
on:
  push:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/patches/v11_68_live_mesh_drag.py"
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble unchanged original and verify live-drag path
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,gzip,hashlib,importlib.util,json
          from pathlib import Path
          root=Path('projects/swrlz-forge-moba')
          manifest=json.loads((root/'source-manifest.json').read_text())
          raw=gzip.decompress(base64.b64decode(''.join((root/p).read_text().strip() for p in manifest['chunks'])))
          assert hashlib.sha256(raw).hexdigest()==manifest['baseSha256']
          html=raw.decode()
          for n,rel in enumerate(manifest['patches']+['patches/v11_68_live_mesh_drag.py']):
              spec=importlib.util.spec_from_file_location('patch'+str(n),root/rel)
              p=importlib.util.module_from_spec(spec)
              spec.loader.exec_module(p);html=p.apply(html)
          out=html.encode()
          print('SWRLZ_V1168_FINAL_BYTES='+str(len(out)),flush=True)
          print('SWRLZ_V1168_FINAL_SHA256='+hashlib.sha256(out).hexdigest(),flush=True)
          print('SWRLZ_V1168_PATCH_COUNT='+str(len(manifest['patches'])+1),flush=True)
          drag=html.split('function atelierMeshGizmoMove(e){',1)[1].split('function atelierMeshGizmoUp(e){',1)[0]
          assert 'atelierMeshLiveDragPreview(values)' in drag
          assert 'atelierMeshRestoreLiveTransforms(records)' in html
          assert 'atelierMeshGizmo.position.copy(center)' in html
          assert 'if(!atelierMeshDrag)atelierMeshGizmoBuild();' in html
          select=html.split('  function select(id){',1)[1].split('\n  function ',1)[0]
          assert 'atelierMeshSelectFast();' in select and 'renderParts();' not in select
          assert 'function atelierMeshSelectFast()' in html
          assert "SWYRL_ENGINE_DEPLOY_MARKER: V11_68_LIVE_MESH_GIZMO_FEEDBACK" in html
          Path('/tmp/v1168.mjs').write_text(html.split('<script type="module">',1)[1].rsplit('</script>',1)[0],encoding='utf-8')
          PY
          node --check /tmp/v1168.mjs
          echo SWRLZ_V1168_LIVE_DRAG_SYNTAX_PASS
