name: §C research context v2 exact-source and factual regression preflight
on:
  push:
    branches: [fix/chat-research-evidence-context-v2]
    paths:
      - "api/research_context_v2.py"
      - "api/selective_retrieval.py"
      - "scripts/hf_chat_research_context_v2_release.py"
      - "tests/test_hf_research_context_v2.py"
      - ".github/workflows/hf-chat-research-context-v2-preflight.yml"
permissions: {contents: read}
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --quiet "huggingface_hub>=0.34,<2"
      - name: Test public enumerations, scope, facts, safety, and noncapture
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_hf_research_context_v2.py' -v
          python -m unittest discover -s tests -p 'test_hf_factual_grounding_v1.py' -v
          python -m py_compile api/research_context_v2.py api/selective_retrieval.py scripts/hf_chat_research_context_v2_release.py
      - name: Check exact current Hugging Face source before publishing
        run: |
          set -euo pipefail
          python -u scripts/hf_chat_research_context_v2_release.py --out swrlz-research-v2-rollback
      - name: Verify real first-party pages through §C guarded public fetch adapter
        run: |
          python - <<'PY'
          import sys,importlib.util,json
          from huggingface_hub import HfApi,hf_hub_download
          from api.selective_retrieval import enrich_payload
          from api.research_context_v2 import verified_roster_context
          space="kamiloki/Swyrlz"
          rev=HfApi().repo_info(space,repo_type="space").sha
          path=hf_hub_download(space,"api/online_research.py",repo_type="space",revision=rev)
          spec=importlib.util.spec_from_file_location("research_v2_safe_reader",path)
          module=importlib.util.module_from_spec(spec)
          sys.modules[spec.name]=module
          spec.loader.exec_module(module)
          prompt="What were all the classes in Diablo 2 LoD?"
          data,receipt=enrich_payload({"prompt":prompt},module.research,
                                      fetch_page=module._page_fetch,enabled=True)
          bundle=data.get("onlineContext") or {}
          report={
              "route":receipt,
              "sources":[{"title":i.get("title"),"role":i.get("referenceRole"),
                          "url":i.get("url")} for i in bundle.get("evidence",[])],
              "groundedRoster":bundle.get("verifiedContext",{}).get("classes",[]),
          }
          print("SWRLZ_RESEARCH_V2_ACTUAL_PUBLIC_SOURCE_PROBE "+json.dumps(report),flush=True)
          assert receipt.get("coverage")=="version_specific_roster",report
          assert set(report["groundedRoster"])=={
              "Amazon","Barbarian","Necromancer","Paladin","Sorceress","Assassin","Druid"},report
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swrlz-research-v2-preflight-source-snapshot
          path: swrlz-research-v2-rollback/
          retention-days: 7
          if-no-files-found: warn
