name: Diagnose v11.59 hosted static release
on:
  push:
    branches:
      - diagnostics/v11-59-hosted-20261019
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch actual public served assets and report source bytes
        run: |
          python - <<'PY'
          import urllib.request,urllib.error,hashlib,json,re,datetime
          base='https://kamiloki-swrlz-forge-moba.static.hf.space/'
          expected='f8aa7858b2fc44abc5b957566f4b82eb03a87d1002610653301aa8edbbb3c32f'
          print('UTC',datetime.datetime.now(datetime.timezone.utc).isoformat(),flush=True)
          uris=[
            base+'SOURCE.json?diag=853d57-v11-59',
            base+'index.html?diag=853d57-v11-59',
            base+'?diag=853d57-v11-59',
            'https://huggingface.co/spaces/kamiloki/swrlz-forge-moba/resolve/main/SOURCE.json',
          ]
          for url in uris:
            print('URL',url,flush=True)
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'swrlz-release-diag/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=25) as resp:
                body=resp.read()
                print('HTTP',resp.status,'URLFINAL',resp.geturl(),'BYTES',len(body),'ETAG',resp.headers.get('ETag'),'CACHE',resp.headers.get('Cache-Control'),flush=True)
              if 'SOURCE.json' in url:
                data=json.loads(body)
                print('SOURCE',json.dumps({key:data.get(key) for key in ('sourceVersion','finalSha256','finalBytes')},ensure_ascii=False),'PATCHES',len(data.get('patches',[])),'ASSETS',len(data.get('assets',{})),flush=True)
              else:
                normalized,count=re.subn(rb'(?<=<head>)<script>window\.huggingface=\{variables:\{.*?\}\};</script>',b'',body,count=1)
                title=re.search(rb'<title[^>]*>(.*?)</title>',body,re.I|re.S)
                print('RAW_SHA',hashlib.sha256(body).hexdigest(),'NORMALIZED_SHA',hashlib.sha256(normalized).hexdigest(),
                  'NORMALIZED_BYTES',len(normalized),'STRIPPED',count,
                  'EXPECTED_MATCH',hashlib.sha256(normalized).hexdigest()==expected,
                  'NEW_MARKER',b'V11_59_PRECISION_MODEL_ATELIER' in body,
                  'OLD_MARKER',b'V11_20_ANATOMICAL_HEAD' in body,
                  'HAS_HF_INJECTION',b'window.huggingface' in body,
                  'TITLE',title.group(1).decode('utf-8','replace')[:120] if title else 'missing',flush=True)
            except Exception as e:
              print('PROBE_ERROR',type(e).__name__,str(e)[:400],flush=True)
          PY

      - name: Compare hosted HTML with exact uploaded Space repository HTML
        run: |
          python - <<'PY'
          import urllib.request,hashlib,difflib,re
          urls={
             'repo':'https://huggingface.co/spaces/kamiloki/swrlz-forge-moba/resolve/main/index.html',
             'live':'https://kamiloki-swrlz-forge-moba.static.hf.space/index.html?html-diff=853d57',
          }
          data={}
          for name,url in urls.items():
            req=urllib.request.Request(url,headers={'User-Agent':'SWRLZ-release-byte-diff/1.0','Cache-Control':'no-cache'})
            with urllib.request.urlopen(req,timeout=40) as response:data[name]=response.read()
            print(name,'bytes',len(data[name]),'sha',hashlib.sha256(data[name]).hexdigest(),flush=True)
          source,live=data['repo'],data['live']
          print('LIVE_ADDED_BYTES',len(live)-len(source),'RAW_EQUAL',live==source,flush=True)
          diffs=difflib.SequenceMatcher(None,source[:3000],live[:4000],autojunk=False).get_opcodes()
          for tag,i1,i2,j1,j2 in diffs:
            if tag=='equal':continue
            extra=live[j1:j2]
            print('DIFF',tag,'expected_range',(i1,i2),'live_range',(j1,j2),
                'extra_bytes',len(extra),'extra_sha256',hashlib.sha256(extra).hexdigest(),
                'contains_provider',b'huggingface' in extra.lower(),
                'extra_script_tags',re.findall(rb'<script[^>]*>',extra)[:5],
                'extra_meta_tags',re.findall(rb'<meta[^>]*>',extra)[:5],flush=True)
          PY

      - name: Locate second provider transformation in normalized HTML
        run: |
          python - <<'PY'
          import urllib.request,re,hashlib
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'swyrlz-provider-normalization-debug/1.0'})
            with urllib.request.urlopen(req,timeout=30) as resp:return resp.read()
          source=get('https://huggingface.co/spaces/kamiloki/swrlz-forge-moba/resolve/main/index.html')
          live=get('https://kamiloki-swrlz-forge-moba.static.hf.space/index.html?source-normalize-probe=2')
          norm,count=re.subn(rb'(?<=<head>)<script>window\.huggingface=\{variables:\{.*?\}\};</script>',b'',live,count=1)
          pre=0
          while pre<min(len(source),len(norm)) and source[pre]==norm[pre]:pre+=1
          suffix=0
          while suffix<min(len(source),len(norm))-pre and source[-suffix-1]==norm[-suffix-1]:suffix+=1
          print('SOURCE_SIZE',len(source),'NORMALIZED_SIZE',len(norm),'NORMALIZED_HASH',hashlib.sha256(norm).hexdigest(),'provider_removed',count,flush=True)
          print('COMMON_PREFIX',pre,'COMMON_SUFFIX',suffix,'SOURCE_DIFF_LEN',len(source)-pre-suffix,'LIVE_DIFF_LEN',len(norm)-pre-suffix,flush=True)
          candidate=norm[pre:len(norm)-suffix] if suffix else norm[pre:]
          print('CANDIDATE_LEN',len(candidate),'SCRIPT_TAGS',re.findall(rb'<script[^>]*>',candidate)[:5],
            'META_TAGS',re.findall(rb'<meta[^>]*>',candidate)[:5],
            'START_REPR',repr(candidate[:360]),'END_REPR',repr(candidate[-160:]),flush=True)
          PY

      - name: Inspect actual live label and engine build-version origins
        run: |
          python - <<'PY'
          import urllib.request,re,html
          url="https://huggingface.co/spaces/kamiloki/swrlz-forge-moba/resolve/main/index.html"
          with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"SWRLZ-version-diagnostic"}),timeout=45) as response:
            src=response.read().decode("utf-8")
          for term in ['v11.20','v11.59',"version:'v11.20'","version:11.20","SWYRL_ENGINE_BUILD","SWRLZ_FORGE_BUILD","§E v11.20 Tools","v11.20 · anatomical head studio","Maker v11.59"]:
            matches=list(re.finditer(re.escape(term),src))
            print("VERSION_TERM",repr(term),"COUNT",len(matches),flush=True)
            for match in matches[:12]:
              part=src[max(0,match.start()-190):min(len(src),match.end()+190)]
              print("CONTEXT",repr(term),repr(part).replace("\\n"," ")[:580],flush=True)
          PY
