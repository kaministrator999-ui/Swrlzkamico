name: Quest 239 sealed release verification
on:
  push:
    branches: [fix/quest-fast-headturn-raycast-239]
    paths: [".github/workflows/quest-239-source-seal.yml"]
permissions:
  contents: read
jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate exact v11.239 sealed release and 68 assets (no publish)
        run: python projects/swrlz-forge-moba/scripts/verify_v11_239_release.py --output dist/swrlz-forge-moba
