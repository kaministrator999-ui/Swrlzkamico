name: Staged Multi-File Workspaces v185

on:
  push:
    branches:
      - feature/coder-staged-workspaces-v185
    paths:
      - "hf_space/staged_workspaces.py"
      - "hf_space/station.py"
      - "hf_space/code_packages.py"
      - "hf_space/test_staged_workspaces_v185.py"
      - "hf_space/test_staged_workspaces_http_v185.py"
      - "chat/§wyrlz/index.html"
      - ".github/workflows/verify-staged-workspaces-v185.yml"

permissions:
  contents: read

concurrency:
  group: swrlz-staged-workspaces-v185
  cancel-in-progress: false

jobs:
  source-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Static syntax and pure manifest tests
        run: |
          set -euo pipefail
          python -m py_compile \
            hf_space/code_packages.py hf_space/staged_workspaces.py \
            hf_space/station.py \
            hf_space/test_staged_workspaces_v185.py \
            hf_space/test_staged_workspaces_http_v185.py \
            hf_space/test_code_packages_v184.py \
            hf_space/test_code_packages_http_v184.py
          PYTHONPATH=hf_space python hf_space/test_code_packages_v184.py
          PYTHONPATH=hf_space python hf_space/test_staged_workspaces_v185.py
      - name: Chat JavaScript syntax and multi-turn control contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          src=Path("chat/§wyrlz/index.html").read_text(encoding="utf-8")
          for token in (
              "manageSourceWorkspace=", "workspaceApi=", "projectZipLink=",
              "Project workspace", "Download assembled ZIP", "addCodePackageLink(node,thread,msg)"
          ):
              assert token in src, f"missing {token}"
          scripts=re.findall(r'<script\b[^>]*>([\s\S]*?)</script\s*>',src,re.I)
          assert scripts
          for n,body in enumerate(scripts):
              if body.strip():Path(f"/tmp/swrlz-workspace-inline-{n}.js").write_text(body,encoding="utf-8")
          print("WORKSPACE_UI_JS_EXTRACTED",len(scripts))
          PY
          for file in /tmp/swrlz-workspace-inline-*.js; do node --check "$file"; done
      - name: Caller/session and complete-ZIP integration tests
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'fastapi>=0.115,<1' 'httpx>=0.27,<1'
          PYTHONPATH=hf_space python hf_space/test_code_packages_http_v184.py
          PYTHONPATH=hf_space python hf_space/test_staged_workspaces_http_v185.py
