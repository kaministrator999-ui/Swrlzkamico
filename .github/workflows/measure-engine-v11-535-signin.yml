name: Verify §E v11.535 sign-in code source and static delivery
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/measure-engine-v11-535-signin.yml"
      - "projects/swrlz-forge-moba/patches/v11_535_startup_signin_code.py"
      - "projects/swrlz-forge-moba/source-manifest.json"
      - "projects/swrlz-forge-moba/scripts/verify_v11_535_release.py"
      - "projects/swrlz-forge-moba/scripts/package_static_delivery_v11_535.py"
      - "projects/swrlz-forge-moba/tests/engine_account_signin_v11_535.cjs"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify sealed 512-patch source and focused regressions
        run: python projects/swrlz-forge-moba/scripts/verify_v11_535_release.py --output /tmp/se535-release
      - name: Verify lossless static delivery package
        run: |
          python projects/swrlz-forge-moba/scripts/package_static_delivery_v11_535.py --output /tmp/se535-release
          node --check /tmp/se535-release/swrlz-engine-v11.535.js
      - name: Report exact release receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/se535-release/SOURCE.json').read_text())
          print('SE535_RELEASE_READY',json.dumps({
            'version':r['sourceVersion'],'bytes':r['finalBytes'],
            'sha256':r['finalSha256'],'assets':len(r['assets']),
            'delivery':r.get('staticDelivery',{}).get('mode')
          }))
          PY
