name: §E v11.280 sealed Mage Spell Lab verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/receipt-forge-v11-280.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sealed:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact receipt, 32 native presets and casting source hooks
        run: python projects/swrlz-forge-moba/scripts/verify_v11_280_release.py --output /tmp/se280-sealed
