name: Test §E v11.71 curved rotation ruler once
on:
  push:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/patches/v11_71_rotation_ruler.py"
permissions:
  contents: read
jobs:
  rotation-ruler:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble and syntax-check 3D rotation ruler
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,gzip,hashlib,importlib.util,json
          from pathlib import Path
          root=Path('projects/swrlz-forge-moba')
          m=json.loads((root/'source-manifest.json').read_text())
          raw=gzip.decompress(base64.b64decode(''.join((root/p).read_text().strip() for p in m['chunks'])))
          assert hashlib.sha256(raw).hexdigest()==m['baseSha256']
          html=raw.decode()
          for i,rel in enumerate(m['patches']+['patches/v11_71_rotation_ruler.py']):
              spec=importlib.util.spec_from_file_location('p'+str(i),root/rel)
              module=importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module);html=module.apply(html)
          payload=html.encode()
          print('SWRLZ_V1171_FINAL_BYTES='+str(len(payload)),flush=True)
          print('SWRLZ_V1171_FINAL_SHA256='+hashlib.sha256(payload).hexdigest(),flush=True)
          print('SWRLZ_V1171_PATCH_COUNT='+str(len(m['patches'])+1),flush=True)
          assert html.count('SWYRL_ENGINE_DEPLOY_MARKER: V11_71_ARC_ROTATION_RULER')==1
          assert 'atelierArcBuild(root)' in html
          assert 'atelierArcMove(e)' in html
          assert 'atelierArcInstall(strip)' in html
          Path('/tmp/atelier1171.mjs').write_text(html.split('<script type="module">',1)[1].rsplit('</script>',1)[0])
          Path('/tmp/atelier1171.html').write_text(html)
          PY
          node --check /tmp/atelier1171.mjs
      - name: Install browser driver
        run: npm install --no-save --prefix /tmp/swyrl-browser-test playwright@1.56.0
      - name: Test arc thumb and mesh rotation before release in Chromium
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME_BIN" ]; then
            /tmp/swyrl-browser-test/node_modules/.bin/playwright install chromium
            CHROME_BIN="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -path '*chrome-linux*' | head -1)"
          fi
          test -x "$CHROME_BIN"
          export CHROME_BIN
          python - <<'PY'
          from pathlib import Path
          html=Path('/tmp/atelier1171.html').read_text()
          instrument="""window.__atelierArcTest={
            ready:()=>!!(renderer&&modelRoot&&model()?.parts?.length),
            pick:()=>{const p=model().parts.find(p=>/bodice|torso/i.test(p.name))||model().parts[0];select(p.id);return p.name;},
            rings:()=>[...atelierArcRings.keys()],
            handle:(axis)=>{
              const arc=atelierArcRings.get(axis);if(!arc)return null;
              const screen=v=>{
                const pos=v.clone().project(camera);
                const box=renderer.domElement.getBoundingClientRect();
                return {x:box.left+(pos.x+1)*box.width/2,y:box.top+(1-pos.y)*box.height/2};
              };
              const handle=screen(arc.hit.getWorldPosition(new THREE.Vector3()));
              const future=screen(arc.ring.localToWorld(atelierArcPoint(arc.radius,arc.phase+.2)));
              const dx=future.x-handle.x,dy=future.y-handle.y,mag=Math.hypot(dx,dy)||1;
              return {axis,x:handle.x,y:handle.y,tx:dx/mag,ty:dy/mag,r:arc.radius};
            },
            state:()=>{
              const mesh=atelierMeshSelectedMeshes()[0];
              const item=atelierArcRings.get(atelierMeshDrag?.axis||atelierMeshAxis);
              let thumbAngle=0;
              if(item){
                thumbAngle=Math.atan2(item.hit.position.y,item.hit.position.x)-item.phase;
              }
              const diag=window.SWYRL_ENGINE_MESH_DRAG_DIAGNOSTICS?.status();
              return {rotation:mesh?.rotation.toArray().slice(0,3)||[],position:mesh?.position.toArray()||[],
                dragging:!!atelierMeshDrag,arc:!!atelierMeshDrag?.arc,axis:atelierMeshDrag?.axis,
                amount:atelierMeshDrag?.amount||0,thumbAngle,
                updates:diag?.pointerUpdates||0,renders:diag?.drawnFrames||0};
            }
          };"""
          anchor='function atelierMeshGizmoDown(e){'
          assert html.count(anchor)==1
          html=html.replace(anchor,instrument+'\n'+anchor,1)
          dest=Path('/tmp/swyrl-arc-1171')
          dest.mkdir(exist_ok=True)
          (dest/'index.html').write_text(html)
          PY
          python -m http.server 8765 --bind 127.0.0.1 --directory /tmp/swyrl-arc-1171 >/tmp/arc-http.log 2>&1 &
          sleep 2
          node projects/swrlz-forge-moba/scripts/test_v11_71_rotation_arc.mjs
