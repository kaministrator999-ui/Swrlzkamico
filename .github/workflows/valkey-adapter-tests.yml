name: Valkey adapter contract tests

on:
  push:
    branches:
      - feature/aiven-valkey-storage-adapter
    paths:
      - "api/durable_redis_store.py"
      - "api/durable_redis_atomic.py"
      - "api/canonical_redis_state.py"
      - "api/chat_transcript_store.py"
      - "api/account_routes.py"
      - "tests/test_valkey_adapter_contract.py"
      - ".github/workflows/valkey-adapter-tests.yml"
  pull_request:
    paths:
      - "api/durable_redis_store.py"
      - "api/durable_redis_atomic.py"
      - "api/canonical_redis_state.py"
      - "api/chat_transcript_store.py"
      - "api/account_routes.py"
      - "tests/test_valkey_adapter_contract.py"
      - ".github/workflows/valkey-adapter-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only adapter dependencies
        run: python -m pip install "requests>=2.32,<3" "redis>=5,<7"
      - name: Compile adapter and integrations
        run: python -m py_compile api/durable_redis_store.py api/durable_redis_atomic.py api/canonical_redis_state.py api/chat_transcript_store.py api/account_routes.py
      - name: Test both backend selection paths, without live credentials
        run: python -m unittest discover -s tests -p 'test_valkey_adapter_contract.py' -v
