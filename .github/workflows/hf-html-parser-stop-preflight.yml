name: Preflight §C verified mid-stream HTML completion
on:
  push:
    branches: [main]
    paths:
      - scripts/hf_html_verified_stream_stop_v1.py
      - .github/workflows/hf-html-parser-stop-preflight.yml
permissions: {contents: read}
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet 'huggingface_hub>=0.34,<2'
      - run: python -m py_compile scripts/hf_html_verified_stream_stop_v1.py
      - name: Validate source-bound two-file change and truthful finish-reason fixtures
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u scripts/hf_html_verified_stream_stop_v1.py preflight
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parser-stop-preflight-${{ github.run_id }}
          path: reports/html-verified-stream-closure/
          retention-days: 21
          if-no-files-found: ignore
