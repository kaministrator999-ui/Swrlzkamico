name: Verify §C code-box scroll follow on exact live source (read-only)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hf-chat-code-scroll-preflight.yml"
      - "scripts/hf_chat_code_scroll_follow_v1.py"
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install 'huggingface_hub>=0.34,<2'
      - name: Check exact Chat source anchors, browser JavaScript parser, scroll behavior and UI preservation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/hf_chat_code_scroll_follow_v1.py
          python -u scripts/hf_chat_code_scroll_follow_v1.py preflight
          echo "SWRLZ_CODE_SCROLL_FOLLOW_PREFLIGHT_PASS"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: swrlz-code-scroll-exact-original-chat-ui
          path: swrlz-code-scroll-follow-backup/
          retention-days: 14
          if-no-files-found: error
