name: Release §C two-phase browser startup v15
on:
  pull_request:
    paths:
      - 'api/html_project_local_browser*.py'
      - 'scripts/verify_server_browser_delivery_v1.py'
      - 'tests/test_html_project_local_browser_v1.py'
      - 'api/browser_worker_protocol_v1.py'
      - 'api/html_project_browser_client_v1.py'
      - 'api/html_project_agent_runtime_v1.py'
      - 'scripts/hf_chat_browser_startup_release_v15.py'
      - '.github/workflows/hf-chat-browser-startup-v15.yml'
  push:
    branches: [main]
    paths:
      - 'api/html_project_local_browser*.py'
      - 'scripts/verify_server_browser_delivery_v1.py'
      - 'tests/test_html_project_local_browser_v1.py'
      - 'api/browser_worker_protocol_v1.py'
      - 'api/html_project_browser_client_v1.py'
      - 'api/html_project_agent_runtime_v1.py'
      - 'scripts/hf_chat_browser_startup_release_v15.py'
      - '.github/workflows/hf-chat-browser-startup-v15.yml'
permissions: {contents: read}
concurrency:
  group: swrlz-browser-startup-v15
  cancel-in-progress: false
jobs:
  validate-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Validate browser protocol and pre-approval retry loop
        run: |
          python -m pip install --quiet 'requests>=2.31,<3' 'huggingface_hub>=0.34,<2'
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/api"
          python -m unittest discover -s tests -p 'test_browser_worker_protocol_v1.py' -v
          python -m unittest discover -s tests -p 'test_html_project_agent_runtime_v1.py' -v
          python -m unittest discover -s tests -p 'test_html_project_repair_v1.py' -v
          python -m unittest discover -s tests -p 'test_html_project_local_browser_v1.py' -v
          python scripts/hf_chat_browser_startup_release_v15.py selftest
      - name: Source-pinned production preflight
        run: python scripts/hf_chat_browser_startup_release_v15.py preflight
      - name: Verify packages and sandbox after explicit restart, then activate repair route
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[release-chat-browser-startup-v15]') }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SWRLZ_V15_APPROVED: '1'
        run: python -u scripts/hf_chat_browser_startup_release_v15.py publish
