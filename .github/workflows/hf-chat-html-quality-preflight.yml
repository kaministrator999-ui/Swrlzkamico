name: Preflight §C HTML quality and source-preserving code edits
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hf-chat-html-quality-preflight.yml"
      - "scripts/html_code_quality_v1.py"
      - "scripts/hf_chat_html_quality_release_v1.py"
      - "scripts/test_html_code_quality_v1.py"
      - "scripts/test_hf_chat_html_quality_release_v1.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet "huggingface_hub>=0.34,<2"
      - name: Source and regression tests
        run: |
          python -m py_compile scripts/html_code_quality_v1.py scripts/hf_chat_html_quality_release_v1.py
          python -m unittest discover -s scripts -p "test_html_code_quality_v1.py" -v
          python -m unittest discover -s scripts -p "test_hf_chat_html_quality_release_v1.py" -v
      - name: Authoritative HF Space source preflight; read-only
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u scripts/hf_chat_html_quality_release_v1.py preflight
      - name: Baseline existing live coder with an isolated synthetic HTML request
        timeout-minutes: 20
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          python -u scripts/hf_chat_html_quality_release_v1.py baseline
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: swrlz-html-quality-preflight-source-receipt
          path: swrlz-html-quality-v1-backup/receipt.json
          retention-days: 7
          if-no-files-found: error
