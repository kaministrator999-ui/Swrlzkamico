name: Verify §E v11.415 Model VR tool iconography
on:
  pull_request:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/patches/v11_415_model_vr_iconography.py"
      - "projects/swrlz-forge-moba/scripts/verify_v11_415_release.py"
      - "projects/swrlz-forge-moba/tests/test_model_vr_iconography_v11_415.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vr-tool-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify VR icon painter and mappings
        run: python projects/swrlz-forge-moba/tests/test_model_vr_iconography_v11_415.py
      - name: Independently compute source HTML bytes and checksum
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,subprocess,sys
          root=pathlib.Path('projects/swrlz-forge-moba')
          p=root/'source-manifest.json'
          original=p.read_text()
          manifest=json.loads(original)
          want_sha=manifest['finalSha256'];want_bytes=manifest['finalBytes']
          manifest.update(finalSha256='',finalBytes=0)
          p.write_text(json.dumps(manifest,ensure_ascii=False))
          try:
              subprocess.run([sys.executable,str(root/'build_space.py'),'--output','/tmp/se415-source'],check=True)
              data=pathlib.Path('/tmp/se415-source/index.html').read_bytes()
              got_sha=hashlib.sha256(data).hexdigest();got_bytes=len(data)
              print(f'SE415_COMPUTED_BYTES={got_bytes}',flush=True)
              print(f'SE415_COMPUTED_SHA256={got_sha}',flush=True)
              if (want_sha,want_bytes)!=(got_sha,got_bytes):
                  raise SystemExit('Source manifest seal needs update to these computed values.')
          finally:
              p.write_text(original)
          PY
      - name: Validate rebuilt release and existing VR controls
        run: python projects/swrlz-forge-moba/scripts/verify_v11_415_release.py --output dist/swrlz-forge-moba
