name: One-shot §E GUI/Menu build measurement
on:
  push:
    branches: [feature/game-gui-menu-subtab]
    paths:
      - ".github/workflows/se228-measure-gui.yml"
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current sealed engine
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Add isolated GUI candidate files
        run: |
          git fetch origin feature/game-gui-menu-subtab:refs/remotes/origin/feature/game-gui-menu-subtab
          git checkout origin/feature/game-gui-menu-subtab -- \
            projects/swrlz-forge-moba/runtime/game_gui_menu_subtab_v11_228.js \
            projects/swrlz-forge-moba/runtime/game_gui_menu_subtab_v11_228.css \
            projects/swrlz-forge-moba/patches/v11_228_game_gui_menu_subtab.py \
            projects/swrlz-forge-moba/tests/game_gui_menu_subtab_v11_228.cjs
      - name: Check GUI and measure exact assembled HTML
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('projects/swrlz-forge-moba/source-manifest.json')
          m=json.loads(p.read_text())
          assert m['name']=='§wyrl§ Engine v11.227',m['name']
          assert len(m['patches'])==259
          assert m['patches'][-1]=='patches/v11_227_astra_wolf_rig_animations.py'
          m['name']='§wyrl§ Engine v11.228'
          m['finalArtifact']='swyrl_engine_v11_228.html'
          m['patches'].append('patches/v11_228_game_gui_menu_subtab.py')
          m['finalBytes']=0
          m['finalSha256']=''
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          PY
          node --check projects/swrlz-forge-moba/runtime/game_gui_menu_subtab_v11_228.js
          node projects/swrlz-forge-moba/tests/game_gui_menu_subtab_v11_228.cjs
          python projects/swrlz-forge-moba/build_space.py --output /tmp/se228-measure >/tmp/se228-build.log
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          b=Path('/tmp/se228-measure/index.html').read_bytes()
          assert b'SWYRL_ENGINE_DEPLOY_MARKER: V11_228_GAME_GUI_MENU_STUDIO' in b
          assert b'SWYRL_ENGINE_GUI_STUDIO' in b
          print('SEGUI_MEASURE_JSON='+json.dumps({'version':'v11.228','bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}),flush=True)
          PY
