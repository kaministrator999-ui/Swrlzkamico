name: §E v11.376 VR Selector lasso candidate
on:
  push:
    paths:
      - 'projects/swrlz-forge-moba/patches/v11_376_vr_selector_lasso.py'
      - 'projects/swrlz-forge-moba/runtime/model_vr_selector_lasso_v11_376.js'
      - 'projects/swrlz-forge-moba/scripts/test_v11_376_vr_selector_lasso.cjs'
      - 'projects/swrlz-forge-moba/scripts/verify_v11_376_release.py'
      - 'projects/swrlz-forge-moba/source-manifest.json'
      - '.github/workflows/se-v11-376-selector-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build 383-patch VR Selector candidate and test modes
        run: |
          cd projects/swrlz-forge-moba
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('source-manifest.json');m=json.loads(p.read_text())
          m['finalSha256']='';m['finalBytes']=0
          p.write_text(json.dumps(m))
          PY
          python3 build_space.py --output /tmp/se376-candidate
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          b=Path('/tmp/se376-candidate/index.html').read_bytes()
          print('CANDIDATE_FINAL_BYTES='+str(len(b)),flush=True)
          print('CANDIDATE_FINAL_SHA256='+hashlib.sha256(b).hexdigest(),flush=True)
          PY
          node --check runtime/model_vr_selector_lasso_v11_376.js
          node scripts/test_v11_376_vr_selector_lasso.cjs /tmp/se376-candidate/index.html
          node scripts/test_v11_373_sweep_handoff.cjs /tmp/se376-candidate/index.html
          node scripts/test_v11_374_quest_vr_feedback.cjs /tmp/se376-candidate/index.html
          node scripts/test_v11_375_image_blockout.cjs
      - name: Verify sealed candidate when updated
        run: |
          cd projects/swrlz-forge-moba
          if python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('source-manifest.json').read_text())
          assert m['finalSha256']!='37453b2be4cbaa8db15e30ff4cff9a6739f0f5bca50bd9d7a16b0029449dff04'
          PY
          then
            git checkout -- source-manifest.json
            python3 scripts/verify_v11_376_release.py --output /tmp/se376-sealed
          else
            echo 'Candidate source receipt has not yet been sealed'
          fi
