name: Verify §E v11.198 Quest editor flight and gizmos (temporary)
on:
  push:
    branches: [feature/quest-spatial-editor-flight-gizmo-v11-198]
    paths:
      - "projects/swrlz-forge-moba/**"
      - ".github/workflows/verify-v11-198-quest-editor-candidate.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Controller, XR and gameplay regression
        run: |
          node --check projects/swrlz-forge-moba/runtime/engine_xr_editor_controls_v11_198.js
          python -m py_compile projects/swrlz-forge-moba/patches/v11_198_xr_editor_flight_gizmo_legend.py
          node projects/swrlz-forge-moba/tests/test_v11_198_editor_6dof_flight_gizmo.cjs
          node projects/swrlz-forge-moba/tests/test_v11_197_sheep_visual_stability.cjs
          node projects/swrlz-forge-moba/tests/test_v11_196_quest_fog_menu.cjs
          node projects/swrlz-forge-moba/tests/test_v11_195_quest_stability.cjs
          node projects/swrlz-forge-moba/tests/test_v11_194_emberfall_arpg.cjs
          node projects/swrlz-forge-moba/tests/test_v11_193_sheep_vr.cjs
          node projects/swrlz-forge-moba/tests/test_v11_192_native_vr_editor.cjs
          node projects/swrlz-forge-moba/tests/test_v11_191_xr_recovery.cjs
      - name: Full 230-patch native engine build and measurable artifact hash
        run: |
          python - <<'PY'
          import hashlib,json,subprocess,sys
          from pathlib import Path
          root=Path('projects/swrlz-forge-moba')
          path=root/'source-manifest.json'
          m=json.loads(path.read_text(encoding='utf8'))
          new='patches/v11_198_xr_editor_flight_gizmo_legend.py'
          if new not in m['patches']:m['patches'].append(new)
          assert len(m['patches'])==230 and m['patches'][-1]==new
          m.update(name='§wyrl§ Engine v11.198',
                   finalArtifact='swyrl_engine_v11_198.html',
                   finalBytes=0,finalSha256='')
          path.write_text(json.dumps(m,indent=2,ensure_ascii=False)+'\n',encoding='utf8')
          subprocess.run([sys.executable,str(root/'build_space.py'),'--output','dist/quest198'],check=True)
          out=Path('dist/quest198/index.html').read_bytes()
          s=out.decode('utf8')
          for marker in ['V11_198_SPATIAL_EDITOR_FLIGHT_GIZMOS','window.SWYRL_ENGINE_XR_EDITOR_198',
                         'se198GrabFrame','se198AxisParam','se198FlyFrame','se198LegendCanvas',
                         'se198GizmoRayHit','se198FinishGrab']:
            assert marker in s,marker
          assert s.count('renderer.setAnimationLoop(tick);')==1
          assert len(json.loads(Path('dist/quest198/SOURCE.json').read_text())['assets'])==68
          print('QUEST198_BYTES='+str(len(out)),flush=True)
          print('QUEST198_SHA256='+hashlib.sha256(out).hexdigest(),flush=True)
          print('QUEST198_BUILD_PASS',flush=True)
          PY
