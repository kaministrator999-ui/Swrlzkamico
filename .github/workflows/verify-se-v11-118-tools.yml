name: §E v11.118 semantic tool arrangement preflight
on:
  push:
    branches: [feature/atelier-tool-organization-v11-118]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify official v11.118 source and module integrity
        run: |
          python projects/swrlz-forge-moba/scripts/verify_v11_118_release.py --output /tmp/se-v11118-release
          cp /tmp/se-v11118-release-module.mjs /tmp/se-v11118.mjs
          node --check /tmp/se-v11118.mjs
      - name: Semantic grouping and gesture regression
        run: |
          node projects/swrlz-forge-moba/tests/model_atelier_semantic_tools_v11_118.mjs
          npm install --no-save --no-package-lock three@0.160.1
          cp /tmp/se-v11118.mjs /tmp/se-v11116.mjs
          node projects/swrlz-forge-moba/tests/model_atelier_camera_precision_v11_116.mjs
          node projects/swrlz-forge-moba/tests/model_atelier_precision_gizmos_v11_114.mjs
          node projects/swrlz-forge-moba/tests/model_atelier_preview_selection_v11_115.mjs
          node projects/swrlz-forge-moba/tests/model_atelier_callout_guard_v11_117.mjs
