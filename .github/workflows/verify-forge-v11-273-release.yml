name: Verify §E v11.273 organic galaxy release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-forge-v11-273-release.yml'
      - 'projects/swrlz-forge-moba/source-manifest.json'
      - 'projects/swrlz-forge-moba/scripts/verify_v11_273_release.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reassemble exact engine, verify assets and inline JS parser
        run: python3 projects/swrlz-forge-moba/scripts/verify_v11_273_release.py --output /tmp/swyrl-forge-273
