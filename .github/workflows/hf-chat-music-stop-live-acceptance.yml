name: Live §C anonymous music Stop release acceptance
on:
  push:
    paths:
      - "scripts/probe_hf_music_stop_live_v1.py"
      - ".github/workflows/hf-chat-music-stop-live-acceptance.yml"
permissions: {contents: read}
jobs:
  guest_stop:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact new served Space revision and anonymous native Stop
        run: |
          python -m pip install --quiet 'huggingface_hub>=0.34,<2' requests
          python -m py_compile scripts/probe_hf_music_stop_live_v1.py
          python -u scripts/probe_hf_music_stop_live_v1.py
