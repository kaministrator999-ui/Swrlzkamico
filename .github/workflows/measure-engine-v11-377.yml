name: Measure §E v11.377 2D outline source
on:
  push:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/runtime/model_image_outlines_v11_377.js"
      - "projects/swrlz-forge-moba/patches/v11_377_image_part_outlines.py"
      - "projects/swrlz-forge-moba/source-manifest.json"
      - "projects/swrlz-forge-moba/scripts/test_v11_377_image_outlines.cjs"
      - ".github/workflows/measure-engine-v11-377.yml"
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check outline JS and focused functional test
        run: |
          node --check projects/swrlz-forge-moba/runtime/model_image_outlines_v11_377.js
          node projects/swrlz-forge-moba/scripts/test_v11_377_image_outlines.cjs
      - name: Measure actual packed HTML without trusting pending seal
        shell: bash
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,importlib.util,json
          from pathlib import Path
          root=Path('projects/swrlz-forge-moba')
          m=json.loads((root/'source-manifest.json').read_text())
          assert m['patches'][-1]=='patches/v11_377_image_part_outlines.py'
          blob=''.join((root/f).read_text().strip() for f in m['chunks'])
          html=gzip.decompress(base64.b64decode(blob)).decode('utf8')
          for i,name in enumerate(m['patches']):
              path=root/name
              spec=importlib.util.spec_from_file_location('patch_'+str(i),path)
              module=importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              html=module.apply(html)
          data=html.encode('utf8')
          print('MEASURED_377_BYTES='+str(len(data)))
          print('MEASURED_377_SHA256='+hashlib.sha256(data).hexdigest())
          assert 'SE377_IMAGE_PART_OUTLINES_START' in html
          assert 'v11.377' in html
          Path('/tmp/se377.html').write_bytes(data)
          PY
          python projects/swrlz-forge-moba/scripts/check_inline_js_syntax_v11_266.py /tmp/se377.html
