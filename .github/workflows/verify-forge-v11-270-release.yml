name: Verify §E v11.270 sealed thin galaxy wisps
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-forge-v11-270-release.yml'
      - 'projects/swrlz-forge-moba/source-manifest.json'
      - 'projects/swrlz-forge-moba/scripts/verify_v11_270_release.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-package:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct exact source, verify sealed package, parse inline JavaScript
        run: python3 projects/swrlz-forge-moba/scripts/verify_v11_270_release.py --output /tmp/swyrl-v11-270-release
