name: Validate §wyrl§ Engine v7.3
on:
  push:
    branches: [main]
    paths: [".github/workflows/validate-swrlz-forge-v7-3.yml"]
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Reconstruct and audit engine-health release
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,gzip,hashlib,importlib.util,json,re
          from pathlib import Path
          root=Path("projects/swrlz-forge-moba");m=json.loads((root/"source-manifest.json").read_text())
          html=gzip.decompress(base64.b64decode("".join((root/p).read_text().strip() for p in m["chunks"]))).decode()
          for rel in m["patches"]:
              spec=importlib.util.spec_from_file_location("p",root/rel);mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod);html=mod.apply(html)
          b=html.encode();print("FINAL_BYTES="+str(len(b)));print("FINAL_SHA256="+hashlib.sha256(b).hexdigest())
          required=["V7_3_ENGINE_HEALTH","v7.3 · ENGINE HEALTH","runtime-diag","installRuntimeDiagnostics","Flying Wisp uses one authoritative X/Z translation path","if(h.userData.hoverFlight)","resolveHeroCollision(next,.55)"]
          for x in required: assert x in html,x
          assert "freeMove.lengthSq()>.0001" not in html,"v7.2 duplicate flight pass survived"
          assert html.count("installRuntimeDiagnostics();")==1
          start=html.index('<script type="module">')+len('<script type="module">');end=html.rindex('</script>');Path("/tmp/e.mjs").write_text(html[start:end])
          PY
          node --check /tmp/e.mjs

# retry stable movement slice

# align assertion with unified controller
