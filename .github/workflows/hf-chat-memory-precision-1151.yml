name: Guarded §C 1.1.51 vision memory precision
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hf-chat-memory-precision-1151.yml"
      - ".deploy/HF_CHAT_MEMORY_PRECISION_1151_REQUEST.txt"
permissions:
  contents: read
concurrency:
  group: swrlz-hf-space-deployment
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 34
    steps:
      - uses: actions/checkout@v4
      - name: Enforce production revision and user-authorized scope
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          request=.deploy/HF_CHAT_MEMORY_PRECISION_1151_REQUEST.txt
          mode=inspect
          if [[ -e "$request" ]]; then
            get(){ sed -n "s/^$1=//p" "$request" | tail -1; }
            test "$(get SPACE)" = "kamiloki/Swyrlz"
            test "$(get SOURCE_REVISION)" = "ba91d6841a1e1242eed9f63716d8f9c3330aeffc"
            test "$(get SCOPE)" = "only-station-exact-vision-hints-and-related-visual-history-recall"
            [[ "$(get NONCE)" =~ ^[a-z0-9-]{14,100}$ ]]
            mode="$(get MODE)"
            [[ "$mode" == inspect || "$mode" == deploy ]]
            if [[ "$mode" == deploy ]]; then test "$(get APPROVED)" = yes; fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Compile deterministic source patcher
        run: python -m py_compile scripts/hf_chat_memory_precision_v1151_release.py
      - name: Install Hugging Face pinned-source reader
        run: python -m pip install -q 'huggingface_hub>=0.34,<2'
      - name: Test exact production source, account isolation and old image recall
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u scripts/hf_chat_memory_precision_v1151_release.py inspect
      - name: Save before/after source hashes and fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swrlz-memory-precision-1151-inspection
          path: reports/swrlz-memory-precision-1151/
          retention-days: 30
          if-no-files-found: ignore
      - name: Publish and verify exact running Space with Qwen ready
        if: ${{ steps.gate.outputs.mode == 'deploy' }}
        timeout-minutes: 26
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SWRLZ_MEMORY_PRECISION_1151_APPROVED: "yes"
        run: |
          set -euo pipefail
          python -u scripts/hf_chat_memory_precision_v1151_release.py deploy
          echo SWRLZ_MEMORY_PRECISION_1151_LIVE_VERIFIED
