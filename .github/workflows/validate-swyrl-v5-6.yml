name: Validate §wyrl§ Engine v5.6 candidate

on:
  push:
    branches: [swyrl-engine-v5-6-grounding]
    paths:
      - ".github/workflows/validate-swyrl-v5-6.yml"
      - "projects/swrlz-forge-moba/patches/v5_6_dragon_ground_contact.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: swyrl-engine-v5-6-grounding
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build exact v5.5 source
        run: |
          set -euo pipefail
          python projects/swrlz-forge-moba/build_space.py --output /tmp/v55
      - name: Apply v5.6 patch
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, importlib.util, json
          from pathlib import Path
          source=Path("/tmp/v55/index.html").read_text(encoding="utf-8")
          path=Path("projects/swrlz-forge-moba/patches/v5_6_dragon_ground_contact.py")
          spec=importlib.util.spec_from_file_location("v56",path)
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          out=mod.apply(source)
          data=out.encode("utf-8")
          print("SWYRL_V5_6_INTEGRITY="+json.dumps({"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()},sort_keys=True))
          Path("/tmp/swyrl-v5-6.html").write_text(out,encoding="utf-8")
          PY
      - name: Verify dragon grounding semantics
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path("/tmp/swyrl-v5-6.html").read_text(encoding="utf-8")
          required=[
            "SWYRL_ENGINE_DEPLOY_MARKER: V5_6_DRAGON_GROUND_CONTACT",
            "BP_DragonAvatarV3",
            "SurfaceFootContact",
            "function groundDragonFeet(",
            "function updateDragonSurfaceContacts(",
            "DragonRearFoot",
            "DragonRearPaw",
            "WingFingerQuaternary",
            "WingMembranePanel4",
            "WingMembraneVein",
            "surfaceContact:'raycast-feet'",
          ]
          missing=[x for x in required if x not in s]
          print("MISSING=",missing)
          if missing: raise SystemExit(1)
          PY
      - name: Syntax-check generated module
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path("/tmp/swyrl-v5-6.html").read_text(encoding="utf-8")
          start=s.index('<script type="module">')+len('<script type="module">')
          end=s.rindex('</script>')
          Path("/tmp/swyrl-v5-6.mjs").write_text(s[start:end],encoding="utf-8")
          PY
          node --check /tmp/swyrl-v5-6.mjs
