name: Verify GitHub receipt review UI v2
on:
  push:
    branches: [feature/chat-github-review-receipt-v2]
    paths:
      - 'chat/github-change-review-v1.js'
      - 'scripts/hf_chat_github_review_receipt_release_v2.py'
      - '.github/workflows/chat-github-review-receipt-v2.yml'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: node --check chat/github-change-review-v1.js
      - run: node --test tests/test_chat_github_review_component_v1.mjs
      - run: python -m py_compile scripts/hf_chat_github_review_receipt_release_v2.py
      - run: python -m pip install --quiet 'huggingface_hub>=0.34,<2'
      - run: python -u scripts/hf_chat_github_review_receipt_release_v2.py verify
