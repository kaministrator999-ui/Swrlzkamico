name: Preflight §C bounded multi-file source imports and UI (read-only)
on:
  push:
    branches: [main]
    paths: [".github/workflows/hf-project-files-bridge-preflight.yml"]
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - name: Install client for read-only exact live Space source
        run: python -m pip install 'huggingface_hub>=0.34,<2'
      - name: Python compile, source/model/HTML patch, JS parser, analyzer regression
        run: |
          set -euo pipefail
          python -m py_compile scripts/hf_chat_project_files_bridge_v1.py scripts/project_source_intelligence_v1.py
          python -m unittest discover -s scripts -p test_project_source_intelligence_v1.py -v
          python -u scripts/hf_chat_project_files_bridge_v1.py preflight
          echo "SWRLZ_PROJECT_FILES_BRIDGE_PREFLIGHT_PASS"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: swrlz-project-import-exact-source-snapshot
          path: swrlz-project-source-import-v1-backup/
          retention-days: 14
          if-no-files-found: error
