name: Guarded HF Chat Local Vosk Recovery
on:
  push:
    branches: [main]
    paths:
      - ".deploy/HF_CHAT_LOCAL_VOSK_RECOVERY_REQUEST.txt"
permissions:
  contents: read
concurrency:
  group: swrlz-hf-space-deployment
  cancel-in-progress: false
jobs:
  local-vosk-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout production release request
        uses: actions/checkout@v4
      - name: Verify explicit no-paid release authorization
        id: request
        shell: bash
        run: |
          set -euo pipefail
          file=".deploy/HF_CHAT_LOCAL_VOSK_RECOVERY_REQUEST.txt"
          test -f "$file"
          get() { sed -n "s/^$1=//p" "$file" | tail -n 1; }
          test "$(get TARGET)" = "kamiloki/Swyrlz"
          test "$(get APPROVED)" = "1"
          test "$(get NO_PAID_SPEECH_API)" = "1"
          test "$(get NO_HARDWARE_UPGRADE)" = "1"
          ref="$(get SOURCE_REF)"
          nonce="$(get REQUEST_NONCE)"
          [[ "$ref" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::Source must be immutable SHA"; exit 1; }
          [[ "$nonce" =~ ^[A-Za-z0-9._-]{10,96}$ ]] || { echo "::error::Invalid release nonce"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Checkout immutable reviewed source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.ref }}
          path: voice-streaming-source
          fetch-depth: 1
      - name: Validate Talk, Vosk and regression tests without browser network
        shell: bash
        run: |
          set -euo pipefail
          node --check voice-streaming-source/chat/§wyrlz/assets/local_voice_vosk.js
          node --check voice-streaming-source/chat/§wyrlz/assets/voice_conversation.js
          node --check voice-streaming-source/scripts/patch_hf_local_vosk_recovery.cjs
          node voice-streaming-source/scripts/test_chat_streaming_voice.cjs
          node voice-streaming-source/scripts/test_chat_local_streaming_vosk.cjs
          node voice-streaming-source/scripts/test_chat_local_vosk_recovery.cjs
          python -m py_compile voice-streaming-source/scripts/publish_hf_local_vosk_recovery.py
      - name: Install existing HF source client
        run: python -m pip install 'huggingface_hub>=0.34,<2'
      - name: Snapshot current live Chat and prepare exact source-only patch
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          python voice-streaming-source/scripts/publish_hf_local_vosk_recovery.py prepare
      - name: Save original Chat and voice code before applying fix
        uses: actions/upload-artifact@v4
        with:
          name: hf-chat-local-vosk-recovery-rollback
          path: hf-local-vosk-recovery-rollback/
          retention-days: 90
          if-no-files-found: error
      - name: Publish only Chat HTML and two voice assets to existing HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          python voice-streaming-source/scripts/publish_hf_local_vosk_recovery.py publish
