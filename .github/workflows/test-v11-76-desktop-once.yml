name: Test §E v11.76 desktop modeling once
on:
  push:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/patches/v11_76_desktop_modeling.py"
      - "projects/swrlz-forge-moba/runtime/model_atelier_desktop_edit_v11_76.js"
      - "projects/swrlz-forge-moba/runtime/model_atelier_desktop_edit_v11_76.css"
      - "projects/swrlz-forge-moba/scripts/test_v11_76_desktop.mjs"
      - ".github/workflows/test-v11-76-desktop-once.yml"
permissions:
  contents: read
jobs:
  desktop-modeling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build historical source + v11.76 candidate
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,gzip,hashlib,importlib.util,json
          from pathlib import Path
          root=Path('projects/swrlz-forge-moba')
          mf=json.loads((root/'source-manifest.json').read_text())
          data=gzip.decompress(base64.b64decode(''.join((root/x).read_text().strip() for x in mf['chunks'])))
          assert hashlib.sha256(data).hexdigest()==mf['baseSha256']
          html=data.decode()
          for i,path in enumerate(mf['patches']+['patches/v11_76_desktop_modeling.py']):
              spec=importlib.util.spec_from_file_location('patch'+str(i),root/path)
              mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod);html=mod.apply(html)
          raw=html.encode()
          print('SWRLZ_V1176_FINAL_BYTES='+str(len(raw)),flush=True)
          print('SWRLZ_V1176_FINAL_SHA256='+hashlib.sha256(raw).hexdigest(),flush=True)
          print('SWRLZ_V1176_PATCH_COUNT='+str(len(mf['patches'])+1),flush=True)
          assert html.count('SWYRL_ENGINE_DEPLOY_MARKER: V11_76_DESKTOP_MODELING_REPAIR')==1
          Path('/tmp/v1176.html').write_text(html)
          Path('/tmp/v1176.mjs').write_text(html.split('<script type="module">',1)[1].rsplit('</script>',1)[0])
          PY
          node --check /tmp/v1176.mjs
          echo SWRLZ_V1176_SOURCE_SYNTAX_PASS
      - name: Install browser driver
        run: npm install --no-save --prefix /tmp/swyrl-browser-test playwright@1.56.0
      - name: Verify actual scale, Undo, wire vertices and close zoom
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME_BIN" ]; then
            /tmp/swyrl-browser-test/node_modules/.bin/playwright install chromium
            CHROME_BIN="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -path '*chrome-linux*' | head -1)"
          fi
          test -x "$CHROME_BIN"
          export CHROME_BIN
          python - <<'PY'
          from pathlib import Path
          html=Path('/tmp/v1176.html').read_text()
          instrument="""window.__desktopTest={
           ready:()=>!!(renderer&&modelRoot&&model()?.parts?.length&&
             panel?.querySelector('[data-desktop-wire-options]')),
           initial:()=>({parts:model().parts.length,groups:(model().meshGroups||[]).length,
             toolbar:!!atelierMeshStrip,wireControls:!!panel.querySelector('[data-desktop-wire-options]')}),
           pickScale:()=>{
             const p=model().parts.find(p=>/piñata|pinata|dyed lock|tail/i.test(p.name))||
               model().parts.find(p=>p.scale.every(v=>v<.4))||model().parts[0];
             select(p.id);atelierMeshMode='scale';atelierMeshAxis='x';atelierMeshToolbarRefresh();
             return {id:p.id,name:p.name,kind:p.kind,scale:[...p.scale]};
           },
           scaleCandidate:factor=>{
             const snapshot=atelierMeshSnapshots(),pivot=atelierMeshCenter(atelierMeshSelectedMeshes());
             const d={snapshot,pivot,mode:'scale',axis:'x'};
             const amount=atelierDesktopBoundedAmount(d,factor);
             return {factor:amount,valid:atelierDesktopValidTransform(snapshot,pivot,'scale','x',amount)};
           },
           scaleState:()=>{
             const p=partById(selection);
             const mesh=modelRoot.children.find(m=>m.isMesh&&m.userData.atelierId===selection);
             return {scale:[...p.scale],geometryMeshScale:mesh.scale.toArray()};
           },
           commitScale:factor=>{
             const snapshot=atelierMeshSnapshots(),pivot=atelierMeshCenter(atelierMeshSelectedMeshes());
             const amount=atelierDesktopBoundedAmount({snapshot,pivot,mode:'scale',axis:'x'},factor);
             return atelierMeshCommit(snapshot,pivot,'scale','x',amount);
           },
           undo:()=>atelierMeshHistoryShortcut(true),
           redo:()=>atelierMeshHistoryShortcut(false),
           wireframe:()=>{
             const v=$m('ViewportMode');v.value='wireframe';
             const scope=$m('ViewportScope');scope.value='all';
             atelierViewApplyChoice();atelierDesktopWireRefresh();
           },
           wireState:()=>{
             const active=modelRoot.children.find(o=>o.isMesh&&o.userData.atelierId===selection);
             const other=modelRoot.children.find(o=>o.isMesh&&o!==active);
             const dots=active?.children.find(x=>x.isPoints&&x.userData.atelierHelper);
             return {activeOpacity:active.material.opacity,othersOpacity:other.material.opacity,
               oldWireColor:active.material.color.getHexString(),
               otherWireColor:other.material.color.getHexString(),
               dots:dots?.geometry?.attributes?.position?.count||0};
           },
           zoom:()=>{
             const before=orbit.distance;
             for(let i=0;i<100;i++)renderer.domElement.dispatchEvent(
               new WheelEvent('wheel',{deltaY:-100,bubbles:true,cancelable:true}));
             return {before,distance:orbit.distance,near:camera.near,
               touchMin:atelierCameraMinDistance()};
           }
          };"""
          anchor='function atelierMeshGizmoDown(e){'
          assert html.count(anchor)==1
          html=html.replace(anchor,instrument+'\n'+anchor,1)
          d=Path('/tmp/atelier-v1176');d.mkdir(exist_ok=True)
          (d/'index.html').write_text(html)
          PY
          python -m http.server 8765 --bind 127.0.0.1 --directory /tmp/atelier-v1176 >/tmp/v1176-http.log 2>&1 &
          sleep 2
          node projects/swrlz-forge-moba/scripts/test_v11_76_desktop.mjs
