name: Verify §E live character editor
on:
  workflow_run:
    workflows: ["Deploy §wyrl§ Engine to Hugging Face"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  native-editor:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: native-editor (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        mode: [desktop, mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require the exact requested production source
        run: |
          python - <<'PY'
          import json,urllib.request
          from pathlib import Path
          root=Path('projects/swrlz-forge-moba')
          request=json.loads((root/'DEPLOY_REQUEST.json').read_text())
          manifest=json.loads((root/'source-manifest.json').read_text())
          source=json.load(urllib.request.urlopen('https://kamiloki-swrlz-forge-moba.static.hf.space/SOURCE.json?native='+request['sourceIntegritySha256'],timeout=40))
          assert source['finalSha256']==manifest['finalSha256']==request['sourceIntegritySha256']
          assert source['finalBytes']==manifest['finalBytes']
          print('EXACT_REQUESTED_NATIVE_RELEASE',source['sourceVersion'],source['finalSha256'])
          PY
      - name: Install native browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps --only-shell chromium
      - name: Verify hosted desktop and phone controls, exports and save/load
        env:
          SWYRL_ANIME_TEST_URL: https://kamiloki-swrlz-forge-moba.static.hf.space
          SWYRL_ANIME_TEST_MODE: ${{ matrix.mode }}
        run: node projects/swrlz-forge-moba/tests/model_reference_playwright.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-character-editor-${{ matrix.mode }}-evidence
          path: model-reference-acceptance/
          compression-level: 1
          retention-days: 5
