name: Verify §E v11.58 scoped strict UV-island LOD
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atelier-scoped-uv-island-v1158
  cancel-in-progress: true
jobs:
  native-uv-island-lod:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build isolated candidate atop exact sealed production
        run: |
          python projects/swrlz-forge-moba/scripts/build_atelier_precision_preview_v11_58.py --output /tmp/atelier-uv-island
          node --check /tmp/atelier-uv-island-module.mjs
          node --check projects/swrlz-forge-moba/runtime/model_atelier_topology_lod_v11_38.js
      - name: Native strict UV guard and real desktop/Android reduced OBJ
        run: |
          npm install --no-save playwright@1.56.1 three@0.169.0
          node projects/swrlz-forge-moba/tests/model_atelier_uv_island_lod_v11_58.mjs
          npx playwright install --with-deps --only-shell chromium
          python -m http.server 8787 --directory /tmp/atelier-uv-island >/tmp/atelier-uv-island.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8787/ >/dev/null; then break; fi
            sleep .3
          done
          SWYRL_SCULPT_TEST_URL=http://127.0.0.1:8787 node projects/swrlz-forge-moba/tests/model_atelier_uv_island_lod_browser_v11_58.mjs
