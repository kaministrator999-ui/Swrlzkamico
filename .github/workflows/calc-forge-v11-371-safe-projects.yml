name: Validate final sealed §E v11.371 Safe Save and Clone
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/calc-forge-v11-371-safe-projects.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify exact 378-patch source and starter/cloud overwrite protections
        run: python projects/swrlz-forge-moba/scripts/verify_v11_371_release.py --output /tmp/forge-v11-371
