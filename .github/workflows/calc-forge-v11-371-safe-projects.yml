name: Calculate clean §E v11.371 source seal
# Verify authenticated-host insertion boundary
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/calc-forge-v11-371-safe-projects.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build complete 378-patch source with expected seal temporarily disabled
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('projects/swrlz-forge-moba/source-manifest.json')
          value=json.loads(path.read_text('utf8'))
          assert len(value['patches'])==378
          value['finalSha256']=''
          value['finalBytes']=0
          path.write_text(json.dumps(value,ensure_ascii=False,indent=2)+'\n','utf8')
          PY
          python projects/swrlz-forge-moba/build_space.py --output /tmp/forge-v11-371
          python - <<'PY'
          import hashlib
          from pathlib import Path
          file=Path('/tmp/forge-v11-371/index.html')
          data=file.read_bytes()
          assert data==Path('/tmp/forge-v11-371/modeler.html').read_bytes()
          print('V11_371_CLEAN_BYTES='+str(len(data)),flush=True)
          print('V11_371_CLEAN_SHA256='+hashlib.sha256(data).hexdigest(),flush=True)
          PY
          node --check projects/swrlz-forge-moba/runtime/project_safe_save_v11_371.js
          node projects/swrlz-forge-moba/scripts/test_v11_371_safe_projects.cjs
          python projects/swrlz-forge-moba/scripts/check_inline_js_syntax_v11_266.py /tmp/forge-v11-371/index.html
