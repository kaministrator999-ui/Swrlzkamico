name: Calculate final §E v11.371 full-source seal
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/calc-forge-v11-371-safe-projects.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clean-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Calculate complete source SHA and check native project actions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('projects/swrlz-forge-moba/source-manifest.json')
          value=json.loads(path.read_text('utf8'))
          assert len(value['patches'])==378
          value['finalSha256']=''
          value['finalBytes']=0
          path.write_text(json.dumps(value,ensure_ascii=False,indent=2)+'\n','utf8')
          PY
          python projects/swrlz-forge-moba/build_space.py --output /tmp/forge371
          python - <<'PY'
          import hashlib
          from pathlib import Path
          x=Path('/tmp/forge371/index.html').read_bytes()
          assert x==Path('/tmp/forge371/modeler.html').read_bytes()
          print('V11_371_FINAL_BYTES='+str(len(x)),flush=True)
          print('V11_371_FINAL_SHA256='+hashlib.sha256(x).hexdigest(),flush=True)
          PY
          node --check projects/swrlz-forge-moba/runtime/project_safe_save_v11_371.js
          node projects/swrlz-forge-moba/scripts/test_v11_371_safe_projects.cjs
          python projects/swrlz-forge-moba/scripts/check_inline_js_syntax_v11_266.py /tmp/forge371/index.html
