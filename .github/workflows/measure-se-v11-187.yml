name: §E v11.187 Game and Modeler focused acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workspaces:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Syntax-check the workspace router and source patch
        run: |
          python -m py_compile projects/swrlz-forge-moba/patches/v11_187_separate_game_modeler.py
          python -m py_compile projects/swrlz-forge-moba/build_space.py
          node --check projects/swrlz-forge-moba/runtime/engine_separate_workspaces_v11_187.js
          node --check projects/swrlz-forge-moba/tests/ui_v11_187_workspaces.mjs
      - name: Verify sealed v11.187 source, both routes, and bundled asset receipts
        run: python projects/swrlz-forge-moba/scripts/verify_v11_187_release.py --output /tmp/se187-sealed
      - name: Build and measure exact version with both entrypoint pages
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('projects/swrlz-forge-moba/source-manifest.json')
          m=json.loads(p.read_text())
          assert m['name']=='§wyrl§ Engine v11.187'
          assert len(m['patches'])==219 and m['patches'][-1]=='patches/v11_187_separate_game_modeler.py'
          m['finalBytes']=0;m['finalSha256']=''
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          PY
          python projects/swrlz-forge-moba/build_space.py --output /tmp/se187-package >/tmp/se187-build.log
          python - <<'PY'
          import hashlib
          from pathlib import Path
          a=Path('/tmp/se187-package/index.html').read_bytes()
          b=Path('/tmp/se187-package/modeler.html').read_bytes()
          assert a==b and len(a)>7000000
          assert b'se187SeparateWorkspaces' in a
          assert b'V11_187_GAME_MODELER_WORKSPACES' in a
          print('SE187_MEASURED_BYTES='+str(len(a)),flush=True)
          print('SE187_MEASURED_SHA256='+hashlib.sha256(a).hexdigest(),flush=True)
          PY
      - name: Install focused browser runtime
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps --only-shell chromium
      - name: Check direct pages, independent scratch modeling and tab state
        run: node projects/swrlz-forge-moba/tests/ui_v11_187_workspaces.mjs
