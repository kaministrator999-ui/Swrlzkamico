name: §E v11.195 sealed browser sheep smoke (one-time)
on:
  push:
    branches: [fix/quest-sheep-vr-195-camera-fog-radial]
    paths: [".github/workflows/verify-v11-195-browser-once.yml"]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Build exact sealed candidate and install browser smoke runner
        run: |
          node --check projects/swrlz-forge-moba/runtime/engine_xr_sheep_stability_v11_195.js
          node projects/swrlz-forge-moba/tests/test_v11_195_quest_stability.cjs
          python projects/swrlz-forge-moba/scripts/verify_v11_195_release.py --output dist/quest195 >/tmp/build-195.log
          python -m pip install --quiet "playwright>=1.50,<2"
          which google-chrome || which google-chrome-stable || which chromium
      - name: Native authored Sheep Tag menu, cinematic, match and Stop
        run: |
          python -m http.server 8765 --directory dist/quest195 >/tmp/se195-http.log 2>&1 &
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,channel='chrome',args=[
               '--no-sandbox','--disable-dev-shm-usage','--use-gl=angle',
               '--use-angle=swiftshader','--enable-webgl','--enable-unsafe-swiftshader'])
              page=browser.new_page(viewport={'width':1280,'height':780})
              errors=[]
              page.on('pageerror',lambda e:errors.append(str(e)))
              page.goto('http://127.0.0.1:8765/index.html?project=sheep-tag-meadow',wait_until='domcontentloaded',timeout=120000)
              page.wait_for_function('!!window.SWYRL_ENGINE_LEVELS && !!window.SWYRL_ENGINE_VR_POLISH && !!window.SWYRL_ENGINE_SHEEP_TAG',timeout=120000)
              page.wait_for_function("window.SWYRL_ENGINE_LEVELS.status().levels>=2",timeout=90000)
              level=page.evaluate('window.SWYRL_ENGINE_LEVELS.status()')
              print('VR195_LEVEL_INITIAL',level,flush=True)
              assert level['active']=='menu' and level['levels']>=2
              assert not level['menuPlaying']
              page.evaluate("document.getElementById('playBtn').click()")
              page.wait_for_function("window.SWYRL_ENGINE_LEVELS.status().menuPlaying",timeout=45000)
              print('VR195_AUTHORED_CINEMATIC_PASS',flush=True)
              page.evaluate("document.getElementById('st141StartGame').click()")
              page.wait_for_function("window.SWYRL_ENGINE_SHEEP_TAG.status().active",timeout=45000)
              state=page.evaluate('window.SWYRL_ENGINE_SHEEP_TAG.status()')
              print('VR195_SHEEP_GAME',{'active':state['active'],'units':len(state['units']),'buildings':len(state['buildings'])},flush=True)
              assert len(state['units'])>=2
              page.evaluate("document.getElementById('stopBtn').click()")
              page.wait_for_function("!window.SWYRL_ENGINE_SHEEP_TAG.status().active",timeout=45000)
              assert not page.evaluate('window.SWYRL_ENGINE_VR_POLISH.diagnose().xr')
              critical=[x for x in errors if 'se195' in x or 'se193' in x or 'sheep' in x.lower()]
              assert not critical,'Unexpected Sheep/VR JS page error: '+repr(critical)
              print('VR195_PLAY_STOP_RESTORE_PASS',flush=True)
              browser.close()
          print('VR195_SEALED_BROWSER_SMOKE_PASS',flush=True)
          PY
