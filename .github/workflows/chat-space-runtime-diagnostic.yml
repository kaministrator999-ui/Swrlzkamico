name: Diagnose current Chat Space runtime (sanitized)
on:
  push:
    branches:
      - experiment/chat-vision-qwen3vl4b-20261106
      - feature/chat-vision-grounded-visual-report-20261107
    paths:
      - .deploy/QWEN3VL_RUNTIME_DIAGNOSTIC.txt
      - .deploy/CHAT_VISION_PR385_RUNTIME_DIAGNOSTIC.txt
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect runtime stage and sanitized error class
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m pip -q install 'huggingface_hub>=1.16,<2'
          python - <<'PY'
          import os, re, json
          from huggingface_hub import HfApi
          api=HfApi(token=os.getenv('HF_TOKEN') or None)
          repo='kamiloki/Swyrlz'
          runtime=api.get_space_runtime(repo)
          try:
              settings=api.get_space_variables(repo)
              variant=settings.get('SWRLZ_VISION_MODEL')
              print('CONFIGURED_VISION_VARIANT:',repr(variant.value) if variant is not None else '(not configured)',flush=True)
          except Exception as e:print('MODEL_VAR_LOOKUP_ERROR_TYPE:',type(e).__name__,flush=True)
          print('STAGE:',runtime.stage,'HARDWARE:',runtime.hardware,'REQUESTED:',runtime.requested_hardware,flush=True)
          lines=[]
          try:
              for line in api.fetch_space_logs(repo_id=repo,follow=False):
                  lines.append(str(line).rstrip())
          except Exception as e:
              print('LOG_FETCH_ERROR_TYPE:',type(e).__name__,flush=True)
          print('RUN_LOG_LINE_COUNT:',len(lines),flush=True)
          # Event NAMES only; never expose request payloads or model text.
          names=[]
          for line in lines:
              names.extend(re.findall(r'"event"\s*:\s*"([A-Z0-9_]{4,80})"',line))
          print('SERVER_EVENT_NAMES:',json.dumps(names[-45:]),flush=True)
          # Runtime-only performance breadcrumbs. Never print user text,
          # images, per-user job IDs, or raw log lines.
          perf=[]
          event_allow={'LOCAL_VISION_FIRST_TEXT','LOCAL_VISION_DONE',
                       'LOCAL_VISION_DETAIL_RETRY','LOCAL_VISION_REGION_FAILED',
                       'LOCAL_VISION_FUSION_FAILED','VISION_RESPONSE_RESOURCE_USAGE'}
          for line in lines[-150:]:
              start=line.find('{"event":')
              if start<0: continue
              try: obj=json.loads(line[start:])
              except (ValueError,TypeError): continue
              event=obj.get('event')
              if event not in event_allow: continue
              record={'event':event}
              for key in ('pass','firstChunkSeconds','seconds','errorType'):
                  if key in obj and isinstance(obj[key],(str,int,float)):
                      record[key]=obj[key]
              if event=='VISION_RESPONSE_RESOURCE_USAGE':
                  usage=obj.get('usage')
                  if isinstance(usage,dict):
                      record['outcome']=usage.get('outcome')
                      wall_ms=usage.get('wallTimeMs')
                      record['totalSeconds']=(round(wall_ms/1000,2)
                           if type(wall_ms) in (int,float) and wall_ms>=0 else None)
                      capacity=usage.get('capacity') or {}
                      observed=usage.get('observed') or {}
                      for key,source in (('cpuLimitCores',capacity),('averageCgroupCpuCores',observed),
                                         ('memoryPeakSampledBytes',observed)):
                          value=source.get(key)
                          if type(value) in (int,float):record[key]=value
              perf.append(record)
          print('SANITIZED_VISION_PERFORMANCE:',json.dumps(perf[-30:]),flush=True)
          # The chat itself has no model-status UI. Server logs are the proof.
          for line in lines:
              if '"modelId": "vision"' not in line and '"modelId":"vision"' not in line:
                  continue
              if '"HF_WARMUP_READY"' in line:
                  print('VISION_STARTUP_PREWARM: READY',flush=True)
              elif '"HF_WARMUP_FAILED"' in line:
                  print('VISION_STARTUP_PREWARM: FAILED',flush=True)
          if any('LOCAL_VISION_MODEL_READY' in line for line in lines):
              print('VISION_MODEL_RESIDENT: READY_EVENT_SEEN',flush=True)
          allowed=re.compile(r'Traceback|^\s*(?:File |\^|(?:[A-Za-z_]+Error|Exception|Killed|Segmentation fault|fatal error|ERROR|Error|RuntimeError|MemoryError|OSError):)|QWEN3_VL_|LOCAL_VISION_FAILED|R39_NATIVE_BUILD_FAILED|exit code|signal: killed|memory limit|oom-kill|out.of.memory|CMake Error|Compilation failed',re.I)
          seen=[]
          for line in lines[-260:]:
              line=re.sub(r'^\S*?\d{4}-\d\d-\d\d[T ]\d\d:\d\d:\d\d[^ ]*\s*','',line)
              if allowed.search(line) and not re.search(r'(?:authorization|bearer|cookie|token=|base64|data:image)',line,re.I):
                  # Only report error category; never print model prompts or user data.
                  kind=re.search(r'(?:[A-Za-z_]+Error|Traceback|Killed|Segmentation fault|fatal error|exit code|signal: killed|OOM|out.of.memory|QWEN3_VL_[A-Z_]+)',line,re.I)
                  if kind:seen.append(kind.group(0))
          print('SANITIZED_ERROR_CATEGORIES:',json.dumps(seen[-35:]),flush=True)
          # Print only startup exception type plus bounded message, never full requests.
          for line in lines[-75:]:
              match=re.search(r'(?<![A-Za-z])(?:RuntimeError|ImportError|ModuleNotFoundError|ValueError|OSError|FileNotFoundError):[^\\n]*',line)
              if not match:continue
              diagnostic=match.group(0)[:240]
              diagnostic=re.sub(r'(?:hf_[A-Za-z0-9]{10,}|Bearer\\s+[A-Za-z0-9._-]+)','[REDACTED]',diagnostic)
              print('STARTUP_EXCEPTION:',diagnostic,flush=True)
          PY
