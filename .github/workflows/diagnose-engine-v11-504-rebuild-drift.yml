name: Diagnose §E v11.504 reproducibility drift
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-engine-v11-504-rebuild-drift.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare patch outputs across independent Python hash seeds
        run: |
          set -euo pipefail
          cat > /tmp/audit_patches.py <<'PY'
          import base64,gzip,hashlib,importlib.util,json,sys
          from pathlib import Path
          root=Path('projects/swrlz-forge-moba')
          m=json.loads((root/'source-manifest.json').read_text('utf8'))
          assert m['name']=='§wyrl§ Engine v11.504'
          html=gzip.decompress(base64.b64decode(''.join((root/p).read_text('utf8').strip() for p in m['chunks']))).decode('utf8')
          hashes=[]
          for idx,rel in enumerate(m['patches'][:-1]):
              p=root/rel
              spec=importlib.util.spec_from_file_location('swrlz_patch_'+p.stem,p)
              module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
              html=module.apply(html)
              hashes.append((rel,hashlib.sha256(html.encode('utf8')).hexdigest()))
          Path(sys.argv[1]).write_text(json.dumps(hashes)+'\n','utf8')
          print('BEFORE_504',sys.argv[1],hashes[-1],flush=True)
          PY
          PYTHONHASHSEED=0 python /tmp/audit_patches.py /tmp/seed0.json
          PYTHONHASHSEED=1 python /tmp/audit_patches.py /tmp/seed1.json
          python - <<'PY'
          import json
          a=json.load(open('/tmp/seed0.json'));b=json.load(open('/tmp/seed1.json'))
          changes=[(i,x,y)for i,(x,y)in enumerate(zip(a,b))if x!=y]
          print('HASH_SEED_FIRST_DIVERGENCE',changes[0] if changes else 'NONE')
          print('HASH_SEED_DIFFERING_PATCHES',len(changes))
          PY
