name: Diagnose §E v11.504 reproducibility drift
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-engine-v11-504-rebuild-drift.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Replay inherited patch chain after candidate manifest mutation
        env:
          PYTHONHASHSEED: "0"
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,gzip,hashlib,importlib.util,json
          from pathlib import Path
          root=Path('projects/swrlz-forge-moba').resolve()
          p=root/'source-manifest.json'
          m=json.loads(p.read_text('utf8'))
          assert m['name']=='§wyrl§ Engine v11.504'
          m['name']='§wyrl§ Engine v11.505'
          m['finalArtifact']='swyrl_engine_v11_505.html'
          m['finalSha256']=None
          m['finalBytes']=None
          m['patches'].append('patches/v11_505_action_prerequisites.py')
          p.write_text(json.dumps(m,indent=2,ensure_ascii=False)+'\n','utf8')
          encoded=''.join((root/q).read_text('utf8').strip() for q in m['chunks'])
          html=gzip.decompress(base64.b64decode(encoded)).decode('utf8')
          for idx,rel in enumerate(m['patches'][:-2]):
              q=root/rel
              spec=importlib.util.spec_from_file_location('swrlz_patch_'+q.stem,q)
              module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
              html=module.apply(html)
          print('BEFORE_504_WITH_505_MANIFEST',hashlib.sha256(html.encode('utf8')).hexdigest(),flush=True)
          PY
