name: §E v11.374 Quest Model Studio candidate
on:
  push:
    paths:
      - 'projects/swrlz-forge-moba/patches/v11_374_vr_owner_feedback.py'
      - 'projects/swrlz-forge-moba/runtime/model_vr_feedback_v11_374.js'
      - 'projects/swrlz-forge-moba/scripts/test_v11_374_quest_vr_feedback.cjs'
      - 'projects/swrlz-forge-moba/scripts/verify_v11_374_release.py'
      - 'projects/swrlz-forge-moba/source-manifest.json'
      - '.github/workflows/se-v11-374-quest-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild candidate and run focused regressions
        run: |
          cd projects/swrlz-forge-moba
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('source-manifest.json')
          m=json.loads(p.read_text())
          m['finalSha256']=''
          m['finalBytes']=0
          p.write_text(json.dumps(m))
          PY
          python3 build_space.py --output /tmp/se374-candidate
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('/tmp/se374-candidate/index.html')
          b=p.read_bytes()
          print('CANDIDATE_FINAL_BYTES='+str(len(b)),flush=True)
          print('CANDIDATE_FINAL_SHA256='+hashlib.sha256(b).hexdigest(),flush=True)
          PY
          node --check runtime/model_vr_feedback_v11_374.js
          node scripts/test_v11_374_quest_vr_feedback.cjs /tmp/se374-candidate/index.html
          node scripts/test_v11_373_sweep_handoff.cjs /tmp/se374-candidate/index.html
          node scripts/test_v11_372_model_vr_phase1.cjs
      - name: Verify final sealed source if receipt matches
        run: |
          cd projects/swrlz-forge-moba
          if python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('source-manifest.json').read_text())
          assert m['finalSha256']!='829c7729237af858c37ed0aab1d4835b971b59c0db414ebd1f6b83f8b242e9ba'
          PY
          then
            git checkout -- source-manifest.json
            python3 scripts/verify_v11_374_release.py --output /tmp/se374-sealed
          else
            echo 'Candidate receipt not sealed yet'
          fi
