name: Inspect §C exact provisional code box layout and lifecycle
on:
  push:
    branches: [main]
    paths: [".github/workflows/hf-live-code-draft-box-audit.yml"]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: python -m pip install 'huggingface_hub>=0.34,<2'
      - run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from huggingface_hub import HfApi,hf_hub_download
          S="kamiloki/Swyrlz";rev=HfApi().repo_info(S,repo_type="space").sha
          src=Path(hf_hub_download(S,"chat/§wyrlz/index.html",repo_type="space",revision=rev)).read_text()
          for marker,left,right in [
            ("const draftText=(!g.terminal",400,4800),
            (".swrlz-code-draft",500,2000),
            ("const codeViewState=new Map();",180,900),
            ("const bindCodeViewState=container=>",120,700),
          ]:
              i=src.find(marker)
              if i>=0:print("DRAFT_BOX_SOURCE",json.dumps({"marker":marker,
                "snippet":src[max(0,i-left):i+right]},ensure_ascii=False),flush=True)
          print("DRAFT_BOX_REV",rev,flush=True)
          PY
