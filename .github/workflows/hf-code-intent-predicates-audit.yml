name: Audit §C exact implicit code-continuation predicates
on:
  push:
    branches: [main]
    paths: [".github/workflows/hf-code-intent-predicates-audit.yml"]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: python -m pip install 'huggingface_hub>=0.34,<2'
      - run: |
          python - <<'PY'
          from pathlib import Path
          import ast,json
          from huggingface_hub import HfApi,hf_hub_download
          S="kamiloki/Swyrlz";rev=HfApi().repo_info(S,repo_type="space").sha
          code=Path(hf_hub_download(S,"brain_programming.py",repo_type="space",revision=rev)).read_text()
          tree=ast.parse(code)
          print("ROUTE_PREDICATES_REV",rev,flush=True)
          for n in tree.body:
              if isinstance(n,ast.FunctionDef) and n.name in (
                "_current_programming_signal","_programming_continuation_signal",
                "_last_assistant_artifact","_source_information_request",
                "_fresh_web_project_request","_code_pins",
                "_programming_intent_contract","_source_fence_present"):
                  print("ROUTE_PREDICATE_FUNCTION",json.dumps({"name":n.name,
                    "source":ast.get_source_segment(code,n)},ensure_ascii=False),flush=True)
          print("ROUTE_PREDICATES_DONE",flush=True)
          PY
