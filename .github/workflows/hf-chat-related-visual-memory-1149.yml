name: Guarded §C 1.1.49 related visual and discussion memory
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hf-chat-related-visual-memory-1149.yml"
      - ".deploy/HF_CHAT_RELATED_VISUAL_MEMORY_1149_REQUEST.txt"
permissions:
  contents: read
concurrency:
  group: swrlz-hf-space-deployment
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 34
    steps:
      - uses: actions/checkout@v4
      - name: Gate source-pinned release
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          file=.deploy/HF_CHAT_RELATED_VISUAL_MEMORY_1149_REQUEST.txt
          mode=inspect
          if [[ -e "$file" ]]; then
            get(){ sed -n "s/^$1=//p" "$file" | tail -1; }
            test "$(get SPACE)" = "kamiloki/Swyrlz"
            test "$(get SOURCE_REVISION)" = "221d3fcaea6b6fea9910d787ffc507f15468f63a"
            test "$(get SCOPE)" = "station-model-router-and-related-visual-history-only"
            [[ "$(get NONCE)" =~ ^[a-z0-9-]{14,100}$ ]]
            mode="$(get MODE)"
            [[ "$mode" == inspect || "$mode" == deploy ]]
            if [[ "$mode" == deploy ]]; then test "$(get APPROVED)" = yes; fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Compile release, retrieval and synthetic tests
        run: |
          python -m py_compile scripts/hf_chat_related_visual_memory_v1149_release.py scripts/releases/related_visual_history_v1149.py scripts/tests/test_related_visual_history_v1149.py
          python scripts/tests/test_related_visual_history_v1149.py
      - name: Install Hugging Face source verification client
        run: python -m pip install -q "huggingface_hub>=0.34,<2"
      - name: Check exact live source, patch and Python compile
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u scripts/hf_chat_related_visual_memory_v1149_release.py inspect
      - name: Retain pre-release source and candidate hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swrlz-related-visual-memory-1149-evidence
          path: reports/swrlz-related-visual-memory-v1149/
          retention-days: 30
          if-no-files-found: ignore
      - name: Publish source-pinned 3-file release and verify live Qwen readiness
        if: ${{ steps.gate.outputs.mode == 'deploy' }}
        timeout-minutes: 26
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SWRLZ_RELATED_VISUAL_1149_APPROVED: "yes"
        run: |
          set -euo pipefail
          python -u scripts/hf_chat_related_visual_memory_v1149_release.py deploy
          echo SWRLZ_RELATED_VISUAL_MEMORY_1149_LIVE_VERIFIED
