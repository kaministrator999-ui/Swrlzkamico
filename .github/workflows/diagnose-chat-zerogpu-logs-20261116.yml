name: Diagnose §C ZeroGPU runtime startup logs (read only)
# Read-only verification after Gradio ZeroGPU launch bridge (2026-11-16).
# Read-only runtime-error investigation after UI-only release rollback (2026-11-20).
on:
  push:
    branches: [main]
    paths: [".github/workflows/diagnose-chat-zerogpu-logs-20261116.yml"]
permissions:
  contents: read
jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install authenticated Hub client for private Space logs
        run: python -m pip install --quiet 'huggingface_hub>=1.16,<2'
      - name: Read current startup errors and ZeroGPU registration without changes
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os,re
          from huggingface_hub import HfApi
          api=HfApi(token=os.environ.get('HF_TOKEN'))
          keep=re.compile(r'ZeroGPU|@spaces\.GPU|startup|Startup|ERROR|Error|Traceback|Exception|Import|HF_WARMUP|HF_MODEL_ROUTES|engine|python app.py',re.I)
          found=[]
          try:
              for line in api.fetch_space_logs('kamiloki/Swyrlz',follow=False):
                  s=str(line).strip()
                  if keep.search(s) and len(found)<100:found.append(s[:350])
          except Exception as e:print('SECHAT_LOG_FETCH_FAILURE',type(e).__name__,str(e)[:120],flush=True)
          for line in found[-65:]:print('SECHAT_RUNTIME_LOG',line,flush=True)
          print('SECHAT_FILTERED_COUNT',len(found),flush=True)
          PY
      - name: Inspect bounded build and runtime failure tail without mutation
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import itertools,os,re
          from huggingface_hub import HfApi
          api=HfApi(token=os.environ.get("HF_TOKEN"))
          sensitive=re.compile(r'(?i)(bearer\s+\S+|hf_[a-zA-Z0-9]{15,}|(?:token|secret|password|api[_-]?key)\s*[=:]\s*\S+)')
          for build in (True,False):
              name="BUILD" if build else "RUNTIME"
              try:
                  lines=list(itertools.islice(api.fetch_space_logs("kamiloki/Swyrlz",build=build,follow=False),2500))
                  print("SECHAT_"+name+"_LOG_COUNT",len(lines),flush=True)
                  for row in lines[-90:]:
                      value=sensitive.sub("[REDACTED]",str(row).rstrip())[:520]
                      print("SECHAT_"+name+"_TAIL",value,flush=True)
              except Exception as error:
                  print("SECHAT_"+name+"_LOG_FAILURE",type(error).__name__,str(error)[:140],flush=True)
          PY
      - name: Inspect runtime metadata and nonrepeated startup failures
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,re
          from huggingface_hub import HfApi
          api=HfApi(token=os.environ.get("HF_TOKEN"))
          runtime=api.get_space_runtime("kamiloki/Swyrlz")
          raw=getattr(runtime,"raw",{}) or {}
          safe={k:str(v)[:220] for k,v in raw.items() if any(w in k.lower() for w in ("stage","error","message","sha","hardware","status"))}
          print("SECHAT_RUNTIME_META",json.dumps(safe,sort_keys=True),flush=True)
          lines=list(api.fetch_space_logs("kamiloki/Swyrlz",follow=False))
          selected=[]
          pattern=re.compile(r"startup|warm|zerogpu|cmake|fatal|failed|error|traceback|exception|uvicorn|llama|ready|port|exit|subprocess|server|register",re.I)
          duplicate={}
          for i,line in enumerate(lines):
              message=str(line).strip()
              if not pattern.search(message):continue
              normalized=re.sub(r"0x[0-9a-f]+","0xADDR",message)
              duplicate[normalized]=duplicate.get(normalized,0)+1
              if duplicate[normalized]>2:continue
              selected.append((i,message[:350]))
          for i,line in selected[:125]:
              print("SECHAT_SIGNIFICANT_LOG",i,line,flush=True)
          print("SECHAT_SIGNIFICANT_COUNT",len(selected),len(lines),flush=True)
          PY
      - name: Snapshot exact live startup files for read-only diagnosis
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import json,os,pathlib
          from huggingface_hub import HfApi,hf_hub_download
          api=HfApi(token=os.environ.get("HF_TOKEN"))
          revision=api.repo_info("kamiloki/Swyrlz",repo_type="space").sha
          dest=pathlib.Path("reports/current-space-startup")
          dest.mkdir(parents=True,exist_ok=True)
          (dest/"revision.json").write_text(json.dumps({"revision":revision,"space":"kamiloki/Swyrlz"},indent=2))
          for name in ("app.py","qwen35_single_runtime.py","requirements.txt"):
              source=hf_hub_download("kamiloki/Swyrlz",name,repo_type="space",revision=revision,token=os.environ.get("HF_TOKEN"))
              data=pathlib.Path(source).read_bytes()
              (dest/name).write_bytes(data)
              print("SECHAT_SOURCE_SNAPSHOT",name,len(data),revision,flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: swrlz-exact-live-startup-source-readonly
          path: reports/current-space-startup/
          if-no-files-found: error
          retention-days: 7
      - name: Capture most recent Qwen native compiler failure and build dependencies
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,re
          from huggingface_hub import HfApi
          api=HfApi(token=os.environ.get("HF_TOKEN"))
          rows=list(api.fetch_space_logs("kamiloki/Swyrlz",follow=False))
          print("SECHAT_NATIVE_LOG_ENTRIES",len(rows),flush=True)
          for i,line in enumerate(rows):
              txt=str(line).strip()
              if "QWEN35_BUILD_FAILED" in txt:
                  safe=re.sub(r"hf_[a-zA-Z0-9]{15,}","[REDACTED]",txt)
                  print("SECHAT_COMPILER_FAILURE",i,safe[-6800:],flush=True)
              if 'HF_WARMUP_FAILED' in txt or 'QWEN35_BUILD_SUCCEEDED' in txt:
                  print("SECHAT_BUILD_EVENT",i,txt[:600],flush=True)
          PY
      - name: Snapshot current §C media and Qwen owners (read only)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,pathlib,hashlib
          from huggingface_hub import HfApi,hf_hub_download
          api=HfApi(token=os.environ["HF_TOKEN"])
          info=api.repo_info("kamiloki/Swyrlz",repo_type="space")
          names=api.list_repo_files("kamiloki/Swyrlz",repo_type="space",revision=info.sha)
          selected=[x for x in names if x in (
              "station.py","chat_vision.py","qwen35_single_runtime.py","model_router.py",
              "chat/§wyrlz/index.html","voice_stt.py","audio_tools.py"
              ) or ("vision" in x.lower() and x.endswith(".py"))]
          print("SECHAT_MEDIA_SOURCES",json.dumps({"revision":info.sha,"files":selected}),flush=True)
          root=pathlib.Path("reports/live-media-source")
          root.mkdir(parents=True,exist_ok=True)
          (root/"manifest.json").write_text(json.dumps({"revision":info.sha,"files":selected},indent=2))
          for name in selected:
              original=pathlib.Path(hf_hub_download("kamiloki/Swyrlz",name,repo_type="space",
                  revision=info.sha,token=os.environ["HF_TOKEN"]))
              data=original.read_bytes()
              path=root/name
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(data)
              print("SECHAT_MEDIA_FILE",name,len(data),hashlib.sha256(data).hexdigest(),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: swrlz-exact-live-media-source
          path: reports/live-media-source/
          if-no-files-found: error
          retention-days: 7
