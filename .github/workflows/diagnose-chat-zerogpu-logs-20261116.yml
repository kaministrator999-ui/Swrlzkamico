name: Diagnose §C ZeroGPU runtime startup logs (read only)
# Read-only verification after Gradio ZeroGPU launch bridge (2026-11-16).
# Read-only runtime-error investigation after UI-only release rollback (2026-11-20).
on:
  push:
    branches: [main]
    paths: [".github/workflows/diagnose-chat-zerogpu-logs-20261116.yml"]
permissions:
  contents: read
jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install authenticated Hub client for private Space logs
        run: python -m pip install --quiet 'huggingface_hub>=1.16,<2'
      - name: Read current startup errors and ZeroGPU registration without changes
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os,re
          from huggingface_hub import HfApi
          api=HfApi(token=os.environ.get('HF_TOKEN'))
          keep=re.compile(r'ZeroGPU|@spaces\.GPU|startup|Startup|ERROR|Error|Traceback|Exception|Import|HF_WARMUP|HF_MODEL_ROUTES|engine|python app.py',re.I)
          found=[]
          try:
              for line in api.fetch_space_logs('kamiloki/Swyrlz',follow=False):
                  s=str(line).strip()
                  if keep.search(s) and len(found)<100:found.append(s[:350])
          except Exception as e:print('SECHAT_LOG_FETCH_FAILURE',type(e).__name__,str(e)[:120],flush=True)
          for line in found[-65:]:print('SECHAT_RUNTIME_LOG',line,flush=True)
          print('SECHAT_FILTERED_COUNT',len(found),flush=True)
          PY
      - name: Inspect bounded build and runtime failure tail without mutation
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import itertools,os,re
          from huggingface_hub import HfApi
          api=HfApi(token=os.environ.get("HF_TOKEN"))
          sensitive=re.compile(r'(?i)(bearer\s+\S+|hf_[a-zA-Z0-9]{15,}|(?:token|secret|password|api[_-]?key)\s*[=:]\s*\S+)')
          for build in (True,False):
              name="BUILD" if build else "RUNTIME"
              try:
                  lines=list(itertools.islice(api.fetch_space_logs("kamiloki/Swyrlz",build=build,follow=False),2500))
                  print("SECHAT_"+name+"_LOG_COUNT",len(lines),flush=True)
                  for row in lines[-90:]:
                      value=sensitive.sub("[REDACTED]",str(row).rstrip())[:520]
                      print("SECHAT_"+name+"_TAIL",value,flush=True)
              except Exception as error:
                  print("SECHAT_"+name+"_LOG_FAILURE",type(error).__name__,str(error)[:140],flush=True)
          PY
      - name: Inspect runtime metadata and nonrepeated startup failures
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,re
          from huggingface_hub import HfApi
          api=HfApi(token=os.environ.get("HF_TOKEN"))
          runtime=api.get_space_runtime("kamiloki/Swyrlz")
          raw=getattr(runtime,"raw",{}) or {}
          safe={k:str(v)[:220] for k,v in raw.items() if any(w in k.lower() for w in ("stage","error","message","sha","hardware","status"))}
          print("SECHAT_RUNTIME_META",json.dumps(safe,sort_keys=True),flush=True)
          lines=list(api.fetch_space_logs("kamiloki/Swyrlz",follow=False))
          selected=[]
          pattern=re.compile(r"startup|warm|zerogpu|cmake|fatal|failed|error|traceback|exception|uvicorn|llama|ready|port|exit|subprocess|server|register",re.I)
          duplicate={}
          for i,line in enumerate(lines):
              message=str(line).strip()
              if not pattern.search(message):continue
              normalized=re.sub(r"0x[0-9a-f]+","0xADDR",message)
              duplicate[normalized]=duplicate.get(normalized,0)+1
              if duplicate[normalized]>2:continue
              selected.append((i,message[:350]))
          for i,line in selected[:125]:
              print("SECHAT_SIGNIFICANT_LOG",i,line,flush=True)
          print("SECHAT_SIGNIFICANT_COUNT",len(selected),len(lines),flush=True)
          PY
