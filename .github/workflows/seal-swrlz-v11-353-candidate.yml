name: §E v11.353 viewport toolbar source candidate
on:
  push:
    branches:
      - fix/model-viewport-transform-bar-v11-353
    paths:
      - '.github/workflows/seal-swrlz-v11-353-candidate.yml'
      - 'projects/swrlz-forge-moba/.candidate-v11-353'
permissions:
  contents: read
jobs:
  source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build source, inspect selected-mesh viewport toolbar and compute exact seal
        run: |
          node --check projects/swrlz-forge-moba/runtime/studio_editor_layout_v11_320.js
          python - <<'PY'
          import json,hashlib,subprocess,sys
          from pathlib import Path
          root=Path('projects/swrlz-forge-moba')
          m=json.loads((root/'source-manifest.json').read_text('utf8'))
          assert m['name']=='§wyrl§ Engine v11.353'
          assert len(m['patches'])==361
          assert m['patches'][-1]=='patches/v11_353_model_viewport_transform.py'
          assert not m['finalSha256'] and not m['finalBytes']
          out=Path('/tmp/se353')
          subprocess.run([sys.executable,str(root/'build_space.py'),'--output',str(out)],check=True)
          raw=(out/'index.html').read_bytes()
          assert raw==(out/'modeler.html').read_bytes()
          html=raw.decode('utf8')
          for needle in (
            'SWYRL_ENGINE_DEPLOY_MARKER: V11_353_MODEL_VIEWPORT_TRANSFORM',
            "window.SWRLZ_FORGE_BUILD={version:'v11.353'",
            "se320ModelTransformAccess(panel,inspector);",
            "const scene=q('.atelier-scene',panel);",
            "const active=!!state?.open&&!!state?.selected&&!panel.hidden;",
            'se320-native-transform-proxy',
            'data-se320-transform="move"',
            'data-se320-transform="rotate"',
            'data-se320-transform="scale"',
            'data-se320-transform="minus"',
            'data-se320-transform="plus"',
            'source?.click();',
            'SE350_MODEL_VR_TWO_HAND_WORKSPACE',
            'SE351_GAME_QUICK_ACTIONS_START'
          ):
            assert needle in html,needle
          css=(root/'runtime/studio_editor_layout_v11_320.css').read_text('utf8')
          assert '.atelier-scene > #se320ModelTransform' in css
          assert '#se320ModelTransform[hidden]' in css
          assert 'position:absolute!important' in css
          assert 'se320-native-transform-proxy' in css
          subprocess.run([sys.executable,str(root/'scripts/check_inline_js_syntax_v11_266.py'),str(out/'index.html')],check=True)
          receipt=json.loads((out/'SOURCE.json').read_text('utf8'))
          assert len(receipt['assets'])==71
          assert len([x for x in out.rglob('*') if x.is_file()])==75
          print('V11_353_FINAL_BYTES='+str(len(raw)),flush=True)
          print('V11_353_FINAL_SHA256='+hashlib.sha256(raw).hexdigest(),flush=True)
          print('V11_353_PATCH_COUNT='+str(len(m['patches'])),flush=True)
          print('V11_353_SOURCE_SEAL_PASS',flush=True)
          PY
