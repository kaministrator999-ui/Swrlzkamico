name: Focused §E v11.333 served static Space integrity
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-hf-v11-333-live-artifact.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  served:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Verify remote SOURCE and served HTML bytes, not only upload job
        run: |
          python - <<'PY'
          import hashlib,json,time
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError,URLError
          host='https://kamiloki-swrlz-forge-moba.static.hf.space'
          sha='e3e46cfd23dc4cddaf9ecb5316de58e5f099277b848ab7f884968335c59cd5ce'
          expected_bytes=9027112
          files=['SOURCE.json','index.html','modeler.html']
          def get(path):
              url=host+'/'+path+'?source_probe=v11.333_embedded_rock_atlas'
              with urlopen(Request(url,headers={'Cache-Control':'no-cache','User-Agent':'SwrlzForgeReleaseIntegrity/11.333'}),timeout=40) as r:
                  body=r.read(12000000)
                  assert r.status==200,(path,r.status)
                  return body
          for attempt in range(1,4):
              try:
                  source=json.loads(get('SOURCE.json'))
                  assert source['sourceVersion']=='§wyrl§ Engine v11.333',source.get('sourceVersion')
                  assert source['finalSha256']==sha
                  assert source['finalBytes']==expected_bytes
                  for path in ('index.html','modeler.html'):
                      raw=get(path)
                      assert len(raw)==expected_bytes,(path,len(raw))
                      assert hashlib.sha256(raw).hexdigest()==sha,(path,hashlib.sha256(raw).hexdigest())
                      print('SERVED_V11_333='+json.dumps({'path':path,'bytes':len(raw),'sha256':sha}),flush=True)
                  print('HF_V11_333_SERVED_SOURCE_PASS',flush=True)
                  break
              except (AssertionError,HTTPError,URLError) as err:
                  print('HF_V11_333_PROBE_RETRY='+str(attempt)+' '+str(err)[:400],flush=True)
                  if attempt==3:raise
                  time.sleep(8)
          PY
