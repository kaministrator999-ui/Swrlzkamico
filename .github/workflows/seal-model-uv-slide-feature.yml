name: §E v11.354 UV Slide seal measurement
on:
  push:
    branches:
      - feature/model-uv-surface-slide-undo-redo-20261108
permissions:
  contents: read
jobs:
  measure-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify changed JavaScript syntax
        run: |
          node --check projects/swrlz-forge-moba/runtime/model_atelier_uv_layout_v11_336.js
          node --check projects/swrlz-forge-moba/runtime/studio_editor_layout_v11_320.js
      - name: Rebuild all original source patches and measure HTML
        run: |
          python projects/swrlz-forge-moba/build_space.py --output /tmp/se354-build >/tmp/se354-build.log
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('/tmp/se354-build/index.html')
          data=p.read_bytes()
          html=data.decode('utf8')
          assert len(data)>9200000
          for text in ('SWYRL_ENGINE_DEPLOY_MARKER: V11_354_MODEL_UV_SLIDE_HISTORY',
                       'window.SWYRLZ_E_MODEL_UV_SLIDE=Object.freeze',
                       'data-se320-history="undo"',
                       'data-se320-history="redo"'):
              assert text in html,text
          print('SE354_SOURCE_RECEIPT '+json.dumps({'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}))
          PY
