name: Verify hosted §E v11.380 served receipt

on:
  push:
    branches:
      - fix/sheep-vr-frame-gap-379
    paths:
      - '.github/workflows/verify-se380-served-receipt.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Find canonical runtime host and exact Hub content
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,json,re,hashlib
          meta='https://huggingface.co/api/spaces/kamiloki/swrlz-forge-moba'
          with urllib.request.urlopen(meta,timeout=30) as r: m=json.load(r)
          print('HF_KEYS',sorted(m.keys()),flush=True)
          for k in ['id','sha','lastModified','sdk','subdomain','host','runtime','cardData','disabled','private']:
            print('HF_META',k,repr(m.get(k))[:1600],flush=True)
          with urllib.request.urlopen('https://huggingface.co/spaces/kamiloki/swrlz-forge-moba',timeout=30) as r:page=r.read().decode('utf8','replace')
          print('HF_SPACE_PAGE_HFSPACE_LINKS',list(dict.fromkeys(re.findall(r'https?[^"<>\\s]{0,140}hf\\.space[^"<>\\s]{0,140}',page)))[:20],flush=True)
          src='https://huggingface.co/spaces/kamiloki/swrlz-forge-moba/resolve/main/'
          for name in ['SOURCE.json','index.html','modeler.html']:
            with urllib.request.urlopen(src+name,timeout=80) as r:b=r.read()
            print('HUB_FILE',name,'bytes',len(b),'sha256',hashlib.sha256(b).hexdigest(),flush=True)
          PY
