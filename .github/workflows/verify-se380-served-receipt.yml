name: Verify hosted §E v11.380 served receipt

on:
  push:
    branches:
      - fix/sheep-vr-frame-gap-379
    paths:
      - '.github/workflows/verify-se380-served-receipt.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Verify exact static Space pages and source integrity
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,hashlib,json
          expected='89392538043e679344ad5d20d31cd7e7a0522517e0209d5ba3d9f44b3c5cee9d'
          base='https://kamiloki-swrlz-forge-moba.static.hf.space/'
          with urllib.request.urlopen(base+'SOURCE.json',timeout=40) as r:receipt=json.load(r)
          assert receipt['sourceVersion']=='§wyrl§ Engine v11.380',receipt['sourceVersion']
          assert receipt['finalSha256']==expected,receipt['finalSha256']
          assert receipt['finalBytes']==9524157
          assert len(receipt['patches'])==387
          print('HOSTED_SOURCE_MATCH',receipt['sourceVersion'],receipt['finalBytes'],len(receipt['patches']),flush=True)
          for name in ['index.html','modeler.html']:
            with urllib.request.urlopen(base+name,timeout=90) as r:bytes_=r.read()
            sha=hashlib.sha256(bytes_).hexdigest()
            print('HOSTED_PAGE_MATCH',name,len(bytes_),sha,flush=True)
            assert len(bytes_)==9524157 and sha==expected
          with urllib.request.urlopen(base,timeout=90) as r:
            home=r.read()
          assert hashlib.sha256(home).hexdigest()==expected
          print('SE380_STATIC_SPACE_FULL_SOURCE_VERIFIED',flush=True)
          PY
