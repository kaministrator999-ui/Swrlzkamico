name: Verify hosted §E v11.380 served receipt

on:
  push:
    branches:
      - fix/sheep-vr-frame-gap-379
    paths:
      - '.github/workflows/verify-se380-served-receipt.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Inspect static HTML delivery normalization against exact source
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,json,hashlib,difflib
          source='https://huggingface.co/spaces/kamiloki/swrlz-forge-moba/resolve/main/'
          live='https://kamiloki-swrlz-forge-moba.static.hf.space/'
          expected='89392538043e679344ad5d20d31cd7e7a0522517e0209d5ba3d9f44b3c5cee9d'
          def get(url):
            with urllib.request.urlopen(url,timeout=90) as r:return r.read()
          receipt=json.loads(get(live+'SOURCE.json'))
          assert receipt['sourceVersion']=='§wyrl§ Engine v11.380' and receipt['finalSha256']==expected
          assert receipt['finalBytes']==9524157 and len(receipt['patches'])==387
          print('HOSTED_SOURCE_RECEIPT_OK',flush=True)
          for file in ['index.html','modeler.html']:
            a=get(source+file);b=get(live+file)
            assert hashlib.sha256(a).hexdigest()==expected and len(a)==9524157
            print('HUB',file,len(a),hashlib.sha256(a).hexdigest(),flush=True)
            print('LIVE',file,len(b),hashlib.sha256(b).hexdigest(),flush=True)
            prefix=0
            while prefix<min(len(a),len(b)) and a[prefix]==b[prefix]:prefix+=1
            suffix=0
            while suffix<min(len(a),len(b))-prefix and a[len(a)-1-suffix]==b[len(b)-1-suffix]:suffix+=1
            print('DIFF_FIRST_OFFSET',prefix,'SUFFIX',suffix,'APPENDED_MID_BYTES',len(b)-len(a),flush=True)
            print('SOURCE_MID',repr(a[prefix:min(len(a)-suffix,prefix+350)]),flush=True)
            print('LIVE_MID',repr(b[prefix:min(len(b)-suffix,prefix+850)]),flush=True)
            if prefix+suffix==len(a):print('NORMALIZATION_ONLY_INSERTION',file,len(b)-len(a),flush=True)
            else:
              aa=a.splitlines(keepends=True);bb=b.splitlines(keepends=True)
              matcher=difflib.SequenceMatcher(None,aa,bb,autojunk=True)
              changes=[(tag,i1,i2,j1,j2) for tag,i1,i2,j1,j2 in matcher.get_opcodes() if tag!='equal']
              print('LINE_CHANGES',file,changes[:15],flush=True)
              for tag,i1,i2,j1,j2 in changes[:3]:
                print('ORIGINAL_SNIP',repr(b''.join(aa[i1:i2])[:500]),flush=True)
                print('DELIVERED_SNIP',repr(b''.join(bb[j1:j2])[:900]),flush=True)
          homepage=get(live)
          print('HOME',len(homepage),hashlib.sha256(homepage).hexdigest(),flush=True)
          PY
