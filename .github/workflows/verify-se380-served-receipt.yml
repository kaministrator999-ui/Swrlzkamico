name: Verify hosted §E v11.380 served receipt

on:
  push:
    branches:
      - fix/sheep-vr-frame-gap-379
    paths:
      - '.github/workflows/verify-se380-served-receipt.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Diagnose served Space and Hugging Face repository files
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,urllib.error,json
          urls=[
          'https://huggingface.co/api/spaces/kamiloki/swrlz-forge-moba',
          'https://huggingface.co/api/spaces/kamiloki/swrlz-forge-moba/tree/main',
          'https://huggingface.co/spaces/kamiloki/swrlz-forge-moba/resolve/main/SOURCE.json',
          'https://huggingface.co/spaces/kamiloki/swrlz-forge-moba/resolve/main/README.md',
          'https://kamiloki-swrlz-forge-moba.hf.space/',
          'https://kamiloki-swrlz-forge-moba.hf.space/index.html',
          'https://kamiloki-swrlz-forge-moba.hf.space/SOURCE.json',
          ]
          for url in urls:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 se380-validation'})
              with urllib.request.urlopen(req,timeout=25) as r:
                data=r.read(1500)
                print('SE380_URL',url,'STATUS',r.status,'FINAL',r.url,'TYPE',r.headers.get('Content-Type'),'CONTENT_PREFIX',repr(data[:210]),flush=True)
            except urllib.error.HTTPError as e:
              print('SE380_URL',url,'STATUS',e.code,'FINAL',e.url,'CONTENT_PREFIX',repr(e.read(180)),flush=True)
            except Exception as e:
              print('SE380_URL',url,'ERROR',repr(e),flush=True)
          PY
