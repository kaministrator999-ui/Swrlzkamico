name: Author §E v11.546 Anatomical Robot UV + 4K Guides
on:
  push:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/RELEASE_AUTHOR_V11_546.json"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: se546-humanoid-author
  cancel-in-progress: false
jobs:
  author-robot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline UV and paint authoring dependencies
        run: python -m pip install --quiet "numpy>=1.26,<3" "scipy>=1.12,<2" "pillow>=10,<13" "xatlas>=0.0.9"
      - name: Generate anatomy-separated atlas, robotic paint and genuine 4K export guides
        run: python projects/swrlz-forge-moba/authoring/build_humanoid_anatomy_robot_v11_546.py
      - name: Check exact original 3D geometry and native asset limits
        run: python projects/swrlz-forge-moba/scripts/check_humanoid_anatomy_v11_546.py
      - name: Commit new independently verified authored assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/swrlz-forge-moba/scenes/model-atelier-futuristic-humanoid-v11-546.swyrl.json
          git add projects/swrlz-forge-moba/assets/models/futuristic-humanoid-v11-546-anatomical-robot.png
          git add projects/swrlz-forge-moba/assets/models/futuristic-humanoid-v11-546-uv-guide-4096.png
          git add projects/swrlz-forge-moba/assets/models/futuristic-humanoid-v11-546-anatomy-4096.png
          git add projects/swrlz-forge-moba/docs/qa/futuristic-humanoid-v11-546-views.png
          git add projects/swrlz-forge-moba/docs/qa/futuristic-humanoid-v11-546-metrics.json
          git diff --cached --quiet && exit 0
          git commit -m "asset(modeler): bake anatomy UV robot skin plus full 4K guides"
          git pull --rebase origin main
          git push origin HEAD:main
