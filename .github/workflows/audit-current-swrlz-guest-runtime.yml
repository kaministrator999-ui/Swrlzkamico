name: Audit current deployed §C guest and coding source (read only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-current-swrlz-guest-runtime.yml'
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet 'huggingface_hub>=0.34,<2'
      - run: python -m py_compile scripts/audit_current_swrlz_guest_runtime.py
      - name: Read exact currently deployed Space source and routes
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u scripts/audit_current_swrlz_guest_runtime.py
