name: §E v11.128 sealed default-project production preflight
on:
  push:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/scripts/verify_v11_128_release.py"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install real DOM harness and Three.js
        run: npm install --prefix /tmp/se128-test --no-audit --no-fund jsdom@25.0.1 three@0.170.0
      - name: Verify 160-patch source SHA, assets, and native engine regressions
        run: |
          python projects/swrlz-forge-moba/scripts/verify_v11_128_release.py --output /tmp/se128-release
          node --check /tmp/se128-release-module.mjs
          node projects/swrlz-forge-moba/tests/sheep_passable_placement_v11_124.mjs
      - name: Verify checkbox, saved startup and original organic Clover behavior
        env:
          SE_JSDOM_MODULE: /tmp/se128-test/node_modules/jsdom
          SE_THREE_MODULE: /tmp/se128-test/node_modules/three
          SE_ASSEMBLED_HTML: /tmp/se128-release/index.html
        run: |
          node projects/swrlz-forge-moba/tests/default_starter_v11_128.mjs
          env -u SE_ASSEMBLED_HTML node projects/swrlz-forge-moba/tests/sheep_clover_editor_boot_v11_127.mjs
