name: Release §C evidence-grounded production repair loop v12
on:
  pull_request:
    paths:
      - 'api/html_project_agent_v1.py'
      - 'api/html_project_dependency_tool_v1.py'
      - 'api/html_project_repair_v1.py'
      - 'tests/test_html_project_dependency_tool_v1.py'
      - 'api/html_project_agent_runtime_v1.py'
      - 'tests/test_html_project_agent_v1.py'
      - 'tests/test_html_project_agent_runtime_v1.py'
      - 'tests/test_server_owned_patch_release_v8.py'
      - 'scripts/hf_chat_repair_loop_release_v12.py'
      - 'scripts/verify_html_project_browser_v1.py'
      - '.github/workflows/hf-chat-repair-loop-v12.yml'
  push:
    branches: [main]
    paths:
      - 'api/html_project_agent_v1.py'
      - 'api/html_project_dependency_tool_v1.py'
      - 'api/html_project_repair_v1.py'
      - 'tests/test_html_project_dependency_tool_v1.py'
      - 'api/html_project_agent_runtime_v1.py'
      - 'scripts/hf_chat_repair_loop_release_v12.py'
      - 'scripts/verify_html_project_browser_v1.py'
      - '.github/workflows/hf-chat-repair-loop-v12.yml'
permissions: {contents: read}
concurrency:
  group: swrlz-repair-loop-v12
  cancel-in-progress: false
jobs:
  validate-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Validate dedicated repair grammar and unchanged write boundaries
        run: |
          python -m pip install --quiet 'requests>=2.31,<3'
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/api"
          echo "PYTHONPATH=$PYTHONPATH" >> "$GITHUB_ENV"
          python -m py_compile api/html_project_agent_v1.py api/html_project_agent_runtime_v1.py scripts/hf_chat_repair_loop_release_v12.py
          python -m unittest discover -s tests -p 'test_html_project_dependency_tool_v1.py' -v
          python -m unittest discover -s tests -p 'test_html_project_agent_v1.py' -v
          python -m unittest discover -s tests -p 'test_html_project_agent_runtime_v1.py' -v
          python -m unittest discover -s tests -p 'test_html_project_repair_v1.py' -v
          python -m unittest discover -s tests -p 'test_server_owned_patch_release_v8.py' -v
          python scripts/hf_chat_repair_loop_release_v12.py selftest
      - name: Verify real existing viewer dependency tool with pinned npm registry
        run: |
          python - <<'PY'
          from pathlib import Path
          from api.html_project_agent_v1 import bind_model_edits,apply_proposal,inspect_static
          src=Path("tests/fixtures/interactive-3d-model-viewer-before-repair.html").read_text()
          files={"index.html":src}
          plan=bind_model_edits("interactive-3d-model-viewer",files,{"patches":[{"path":"index.html","op":"localize_imports","anchor":'<script type="importmap">',"code":""}]})
          result=apply_proposal("interactive-3d-model-viewer",files,plan,validation=inspect_static)
          assert result["readyForOwnerReview"] and len(result["changedFiles"])>=4
          print("REAL_VIEWER_DEPENDENCIES_STATIC_PASS",result["afterHashes"],flush=True)
          root=Path("browser-candidate/interactive-3d-model-viewer")
          for path,body in result["proposedFiles"].items():
              target=root/path
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_text(body,encoding="utf-8")
          PY
      - name: Install credential-free Chromium harness
        run: |
          python -m pip install --quiet 'playwright==1.51.0' 'fastapi>=0.115,<1'
          python -m playwright install --with-deps chromium
      - name: Render real existing viewer with production-equivalent sandbox
        run: python scripts/verify_html_project_browser_v1.py --project interactive-3d-model-viewer --root browser-candidate/interactive-3d-model-viewer --viewer-fixture
      - name: Install Hugging Face source reader
        run: python -m pip install --quiet 'huggingface_hub>=0.34,<2'
      - name: Check real production source against exact v12 upgrade
        run: python -u scripts/hf_chat_repair_loop_release_v12.py preflight
      - name: CAS-publish v12 to Hugging Face
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[release-chat-repair-loop-v12]') }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SWRLZ_V12_APPROVED: '1'
        run: python -u scripts/hf_chat_repair_loop_release_v12.py publish
      - name: Independently verify real production repair loop with original user prompt
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[release-chat-repair-loop-v12]') }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u scripts/hf_chat_repair_loop_release_v12.py verify
