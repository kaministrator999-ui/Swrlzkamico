name: Build and seal §E v11.485 single-cloth Sorting Hat
on:
  push:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/RELEASE_PREPARE_V11_485.json"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: engine-v11-485-one-cloth
  cancel-in-progress: false
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Author single cloth, test native mesh, rebuild and verify sealed engine
        run: python projects/swrlz-forge-moba/scripts/prepare_v11_485_release.py
      - name: Commit generated native mesh and exact-source manifest together
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/swrlz-forge-moba/scenes/model-atelier-sorting-hat.swyrl.json \
                  projects/swrlz-forge-moba/source-manifest.json
          git diff --cached --quiet && { echo "No new validated release changes"; exit 1; }
          git commit -m "seal(§E v11.485): one connected UV-painted cloth Sorting Hat"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Retain evidence of authored release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-v11-485-hat-scene-and-integrity
          path: |
            projects/swrlz-forge-moba/scenes/model-atelier-sorting-hat.swyrl.json
            projects/swrlz-forge-moba/source-manifest.json
          if-no-files-found: error
