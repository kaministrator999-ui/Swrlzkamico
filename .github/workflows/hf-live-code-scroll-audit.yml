name: Inspect live §C code preview and scroll rendering (read-only)
on:
  push:
    branches: [main]
    paths: [".github/workflows/hf-live-code-scroll-audit.yml"]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - run: python -m pip install 'huggingface_hub>=0.34,<2'
      - shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from huggingface_hub import HfApi,hf_hub_download
          S="kamiloki/Swyrlz";rev=HfApi().repo_info(S,repo_type="space").sha
          name="chat/§wyrlz/index.html"
          src=Path(hf_hub_download(S,name,repo_type="space",revision=rev)).read_text()
          print("LIVE_SCROLL_SHA",rev,flush=True)
          print("LIVE_SCROLL_COUNTS",json.dumps({s:src.count(s) for s in (
            "const captureCodeViewState=()=>","const restoreCodeViewState=()=>",
            "const renderStationGeneration=()=>","const renderAssistantContent=(container",
            "CANDIDATE_PREVIEW_DELTA","previewText","candidatePreview","renderCode","codeViewState",
            "const applyChatState = data =>","const consumeGeneration = async response =>")}),flush=True)
          for anchor,prefix,suffix in [
            ("const codeViewState=new Map();",200,3300),
            ("const renderAssistantContent=(container",200,3700),
            ("const captureCodeViewState=()=>",150,1900),
            ("const renderStationGeneration=()=>",100,4900),
            ("const applyChatState = data =>",100,3900),
            ("const consumeGeneration = async response =>",100,3100),
            (".assistant-body .code-block{",200,2450),
          ]:
              pos=src.find(anchor)
              if pos<0:
                  print("LIVE_SCROLL_ANCHOR_MISSING",anchor,flush=True);continue
              print("LIVE_SCROLL_REGION",json.dumps({"anchor":anchor,"position":pos,
                  "source":src[max(0,pos-prefix):pos+suffix]},ensure_ascii=False),flush=True)
          print("LIVE_SCROLL_DONE",flush=True)
          PY
