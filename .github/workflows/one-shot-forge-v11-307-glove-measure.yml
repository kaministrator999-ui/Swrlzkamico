name: One-shot §E v11.307 Arcane VR glove source measurement
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-forge-v11-307-glove-measure.yml'
permissions:
  contents: read
jobs:
  focused-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build unsealed exact source and verify glove orientation
        run: |
          python - <<'PY'
          import json,hashlib,subprocess,sys
          from pathlib import Path
          root=Path('projects/swrlz-forge-moba')
          mpath=root/'source-manifest.json'
          m=json.loads(mpath.read_text('utf8'))
          assert m['name']=='§wyrl§ Engine v11.307'
          assert len(m['patches'])==338
          assert m['patches'][-1]=='patches/v11_307_arcane_vr_glove_orientation.py'
          # Temporary checkout-only measurement: never publish unsealed bytes.
          m['finalBytes']=None
          m['finalSha256']=None
          mpath.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n','utf8')
          subprocess.run([sys.executable,'-m','py_compile',
            str(root/'patches/v11_307_arcane_vr_glove_orientation.py')],check=True)
          out=Path('/tmp/swrlz-v11-307')
          subprocess.run([sys.executable,str(root/'build_space.py'),'--output',str(out)],check=True)
          raw=(out/'index.html').read_bytes()
          assert raw==(out/'modeler.html').read_bytes()
          html=raw.decode('utf8')
          assert html.count('SE307_DORSAL_UP_CONTROLLER_GLOVES')==1
          assert html.count("const source=side==='left'?se212HandScene():se279LeftScene();")==1
          assert html.count('poseGroup.rotation.set(-Math.PI/2,Math.PI,0);')==1
          assert 'SWYRL_ENGINE_DEPLOY_MARKER: V11_307_ARCANE_VR_GLOVE_ORIENTATION' in html
          assert "window.SWRLZ_FORGE_BUILD={version:'v11.307'" in html
          assert html.count('renderer.setAnimationLoop(tick);')==1
          assert html.count('function se279XRFrame(){')==1
          assert html.count('function se280Cast(side,record,key){')==1
          subprocess.run([sys.executable,str(root/'scripts/check_inline_js_syntax_v11_266.py'),
            str(out/'index.html')],check=True)
          print('SE307_EXACT_MEASUREMENT='+json.dumps({
            'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),
            'patches':len(m['patches'])},sort_keys=True),flush=True)
          PY
