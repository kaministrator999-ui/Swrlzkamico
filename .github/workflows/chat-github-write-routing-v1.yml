name: Verify §C GitHub mutation routing
on:
  push:
    branches: [fix/chat-github-write-routing-v1]
    paths:
      - 'scripts/hf_chat_github_write_routing_release_v1.py'
      - 'tests/test_chat_github_write_routing_v1.py'
      - '.github/workflows/chat-github-write-routing-v1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet 'huggingface_hub>=0.34,<2'
      - run: python -m unittest discover -s tests -p test_chat_github_write_routing_v1.py -v
      - run: python -m py_compile scripts/hf_chat_github_write_routing_release_v1.py
      - run: python -u scripts/hf_chat_github_write_routing_release_v1.py snapshot
