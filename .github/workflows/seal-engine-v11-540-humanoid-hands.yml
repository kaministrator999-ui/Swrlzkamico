name: Seal §E v11.540 humanoid five-digit hands
on:
  push:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/RELEASE_PREPARE_V11_540.json"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: se540-humanoid-source-seal
  cancel-in-progress: false
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout authoritative engine source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install geometry authoring tools (CI only, not served)
        run: |
          python -m pip install --quiet "numpy>=2,<3" "scipy>=1.15,<2" \
            "scikit-image>=0.25,<0.27" "pillow>=11,<13" "vtk>=9.3,<10"
      - name: Bake continuous 5-digit body and preserve previous six-island atlas
        run: python projects/swrlz-forge-moba/authoring/build_futuristic_humanoid_v11_540.py
      - name: Validate one closed body and all 10 digits
        run: |
          python projects/swrlz-forge-moba/scripts/check_futuristic_humanoid_v11_540.py
          node --check projects/swrlz-forge-moba/runtime/futuristic_humanoid_five_digit_v11_540.js
          node projects/swrlz-forge-moba/tests/futuristic_humanoid_five_digit_v11_540.cjs
          python -m py_compile projects/swrlz-forge-moba/patches/v11_540_humanoid_five_digit.py
      - name: Rebuild actual HTML and calculate exact source hash
        run: python projects/swrlz-forge-moba/scripts/prepare_v11_540_release.py
      - name: Independently verify native editor, project, VR, account and source integrity
        run: |
          python projects/swrlz-forge-moba/scripts/verify_v11_540_release.py --output /tmp/se540-release
          python projects/swrlz-forge-moba/scripts/package_static_delivery_v11_540.py --output /tmp/se540-release
          node --check /tmp/se540-release/swrlz-engine-v11.540.js
      - name: Commit only tested native scene and sealed manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/swrlz-forge-moba/scenes/model-atelier-futuristic-humanoid-v11-540.swyrl.json \
                  projects/swrlz-forge-moba/source-manifest.json
          git diff --cached --quiet && { echo "No verified changes"; exit 1; }
          git commit -m "seal(§E v11.540): verify manifold five-finger humanoid and source hash"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Save build receipts for auditing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: se540-unified-hands-model-and-sha
          path: |
            projects/swrlz-forge-moba/scenes/model-atelier-futuristic-humanoid-v11-540.swyrl.json
            projects/swrlz-forge-moba/source-manifest.json
          if-no-files-found: warn
