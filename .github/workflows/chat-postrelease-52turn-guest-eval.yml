name: §C post-release 64-turn Chromium guest acceptance
on:
  workflow_run:
    workflows:
      - Guarded §C music research and original lyric routing release
    types: [completed]
permissions: {contents: read}
concurrency:
  group: swrlz-chat-postrelease-guest-eval
  cancel-in-progress: false
jobs:
  acceptance:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        batch: [research, songwriting, conversation, transformations, reasoning]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install anonymous Chromium and source receipt dependencies
        run: |
          python -m pip install playwright==1.56.0 'huggingface_hub>=0.34,<2'
          python -m playwright install --with-deps chromium
      - name: Compile and test 52-turn evaluation contract
        run: |
          python -m py_compile scripts/eval_chat_research_lyrics_conversations.py
          python -m unittest discover -s tests -p 'test_chat_broad_guest_round2.py' -v
      - name: Run live guest turns; detect Space source changes during batch
        env:
          SWRLZ_EVAL_BASE: https://kamiloki-swyrlz.hf.space
          SWRLZ_EVAL_MODEL: 700m
          SWRLZ_RESEARCH_LYRICS_TURN_TIMEOUT: '215'
          SWRLZ_BROAD_STRICT: '1'
        shell: bash
        run: |
          set -uo pipefail
          before=$(python -c "from huggingface_hub import HfApi;print(HfApi().repo_info('kamiloki/Swyrlz',repo_type='space').sha)") || exit 2
          echo "SPACE_SHA_BEFORE=$before"
          python -u -m scripts.eval_chat_research_lyrics_conversations --batch ${{ matrix.batch }}
          test_exit=$?
          after=$(python -c "from huggingface_hub import HfApi;print(HfApi().repo_info('kamiloki/Swyrlz',repo_type='space').sha)") || exit 2
          echo "SPACE_SHA_AFTER=$after"
          mkdir -p reports/chat-research-lyrics-conversation
          printf 'Space source before: %s\nSpace source after: %s\n' "$before" "$after" > reports/chat-research-lyrics-conversation/space-revisions.txt
          if [[ "$before" != "$after" ]]; then
            echo "::error::Space changed during testing; batch results may mix model revisions"
            exit 2
          fi
          exit "$test_exit"
      - name: Preserve exact test transcripts and source revision receipts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swrlz-postrelease-guest-qa-${{ matrix.batch }}-${{ github.run_id }}
          path: reports/chat-research-lyrics-conversation/
          retention-days: 21
          if-no-files-found: warn
      - name: Publish independent per-category findings
        if: always()
        run: |
          if [[ -f reports/chat-research-lyrics-conversation/summary.md ]]; then
            cat reports/chat-research-lyrics-conversation/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
