name: Deploy Persistent Server Plane

on:
  push:
    branches: [main]
    paths:
      - ".deploy/SERVER_PLANE.txt"

permissions:
  contents: read

concurrency:
  group: swrlz-server-plane
  cancel-in-progress: false

env:
  SWRLZ_ORG_ID: team_E4y2LpTSFo9UxTErO9aw6HW1
  SOURCE_PROJECT_ID: prj_dGgleDMgkOQ57wULKlDH5fcYj9Yp
  TARGET_PROJECT_NAME: swrlzkamico-o3nu
  TARGET_SCOPE: kamiswrlzco-cloud

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Read deployment gate
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Authorize
        shell: bash
        run: |
          set -euo pipefail
          grep -qx 'APPROVED=1' .deploy/SERVER_PLANE.txt
          grep -qx 'SOURCE_REF=main' .deploy/SERVER_PLANE.txt

      - name: Checkout server source
        uses: actions/checkout@v4
        with:
          ref: main
          clean: true

      - name: Apply server-plane Vercel contract
        shell: bash
        run: |
          cat > vercel.json <<'JSON'
          {
            "$schema": "https://openapi.vercel.sh/vercel.json",
            "version": 2,
            "fluid": true,
            "regions": ["iad1"],
            "git": {"deploymentEnabled": false},
            "functions": {
              "api/**/*.py": {
                "maxDuration": 300,
                "excludeFiles": "{.transport/**,SWRLZ_NEW_SERVER_GITHUB_READY.zip}"
              }
            },
            "routes": [
              {"src": "/api/(.*)", "dest": "/api/index.py"}
            ]
          }
          JSON

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare promoted runtime generation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_runtime_generation.py \
            --accepted-root "accepted_runtime" \
            --output-root "swrzl_prepared_runtime"
          test -f swrzl_prepared_runtime/lalm/r39_engine.py
          test -f swrzl_prepared_runtime/generation.json
          echo "Prepared LALM generation bundled into canonical server plane." >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install --global vercel@59.23.2

      - name: Verify token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: test -n "${VERCEL_TOKEN:-}"

      - name: Pin canonical Vercel project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$SWRLZ_ORG_ID" "$SOURCE_PROJECT_ID" > .vercel/project.json
          grep -q "$SOURCE_PROJECT_ID" .vercel/project.json
          echo "Pinned deployment to existing canonical project $TARGET_PROJECT_NAME ($SOURCE_PROJECT_ID)"

      - name: Deploy persistent server
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          url="$(vercel deploy --prod --yes --scope "$TARGET_SCOPE" --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Server deployment: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify account API
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          PRODUCTION_URL: https://swrlzkamico-o3nu.vercel.app
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 1 30); do
            code="$(curl -L --max-time 15 -sS -o /tmp/account.json -w '%{http_code}' "$PRODUCTION_URL/api/account/status" || true)"
            if [[ "$code" == "200" ]] && python -m json.tool /tmp/account.json >/dev/null 2>&1; then
              cat /tmp/account.json
              echo "Account API verified at $PRODUCTION_URL (deployment $DEPLOYMENT_URL)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "Account API did not become ready" >&2
          cat /tmp/account.json || true
          exit 1

      - name: Purge stale deployments after verified production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ env.SWRLZ_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.SOURCE_PROJECT_ID }}
          VERCEL_PRODUCTION_HOST: swrlzkamico-o3nu.vercel.app
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $VERCEL_TOKEN")

          current_json="$(curl --fail-with-body --silent --show-error \
            "${auth[@]}" \
            "https://api.vercel.com/v13/deployments/$VERCEL_PRODUCTION_HOST?teamId=$VERCEL_ORG_ID")"
          keep_id="$(jq -r '.id // .uid // empty' <<<"$current_json")"
          [[ "$keep_id" == dpl_* ]] || { echo "Could not resolve production deployment; refusing purge." >&2; exit 1; }

          echo "Protecting verified production deployment: $keep_id"
          deleted=0
          failed=0
          for pass in $(seq 1 20); do
            page="$(curl --fail-with-body --silent --show-error "${auth[@]}" \
              "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&limit=100")"
            mapfile -t stale < <(jq -r --arg keep "$keep_id" '.deployments[]? | (.uid // .id // empty) | select(. != $keep)' <<<"$page")
            [[ "${#stale[@]}" -gt 0 ]] || break
            for id in "${stale[@]}"; do
              echo "Deleting stale deployment $id"
              code="$(curl --silent --show-error --output /tmp/delete.json --write-out '%{http_code}' \
                -X DELETE "${auth[@]}" \
                "https://api.vercel.com/v13/deployments/$id?teamId=$VERCEL_ORG_ID" || true)"
              if [[ "$code" =~ ^2 ]]; then
                deleted=$((deleted+1))
              else
                failed=$((failed+1))
                echo "::warning::Delete failed for $id (HTTP $code)"
                cat /tmp/delete.json || true
              fi
            done
          done

          verify="$(curl --fail-with-body --silent --show-error "${auth[@]}" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&limit=100")"
          mapfile -t remaining < <(jq -r '.deployments[]? | .uid // .id // empty' <<<"$verify")
          printf 'Post-deploy purge: deleted=%s failed=%s remaining=%s\n' "$deleted" "$failed" "${remaining[*]:-none}" | tee -a "$GITHUB_STEP_SUMMARY"
          [[ "$failed" -eq 0 ]]
          [[ "${#remaining[@]}" -eq 1 && "${remaining[0]}" == "$keep_id" ]] || {
            echo "Post-deploy purge incomplete; expected only $keep_id." >&2
            exit 1
          }
