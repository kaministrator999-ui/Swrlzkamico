name: Quick verify §E mobile vertex gizmo
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quick-mobile-gizmo-v1123
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build editor and apply preview
        run: |
          python projects/swrlz-forge-moba/build_space.py --output /tmp/editor
          python - <<'PY'
          import runpy
          from pathlib import Path
          p=Path('/tmp/editor/index.html')
          p.write_text(runpy.run_path('projects/swrlz-forge-moba/patches/v11_21_vertex_sphere_brush_preview.py')['apply'](p.read_text()))
          PY
      - name: Test viewport drag with real phone touch
        run: |
          npm install --no-save playwright@1.56.1 three@0.169.0
          npx playwright install --with-deps --only-shell chromium
          python -m http.server 8787 --directory /tmp/editor >/tmp/editor-server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          SWYRL_SCULPT_TEST_URL=http://127.0.0.1:8787 node projects/swrlz-forge-moba/tests/model_sculpt_brush_playwright_v11_21.mjs
