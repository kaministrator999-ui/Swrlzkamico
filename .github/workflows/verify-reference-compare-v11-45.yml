name: Verify §E v11.45 simultaneous front and side reference images
on:
  push:
    branches: [feature/atelier-reference-compare-v11-45]
    paths:
      - 'projects/swrlz-forge-moba/runtime/model_atelier_reference_studio_v11_22.js'
      - 'projects/swrlz-forge-moba/patches/v11_21_vertex_sphere_brush_preview.py'
      - 'projects/swrlz-forge-moba/tests/model_atelier_reference_compare_v11_45.mjs'
      - 'projects/swrlz-forge-moba/tests/model_atelier_reference_compare_browser_v11_45.mjs'
      - '.github/workflows/verify-reference-compare-v11-45.yml'
permissions:
  contents: read
concurrency:
  group: verify-atelier-reference-v1145
  cancel-in-progress: true
jobs:
  layout-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Validate source syntax and build sealed editor overlay
        run: |
          node --check projects/swrlz-forge-moba/runtime/model_atelier_reference_studio_v11_22.js
          python -m py_compile projects/swrlz-forge-moba/patches/v11_21_vertex_sphere_brush_preview.py
          python projects/swrlz-forge-moba/build_space.py --output /tmp/atelier-reference
          python - <<'PY'
          import runpy
          from pathlib import Path
          p=Path('/tmp/atelier-reference/index.html')
          p.write_text(runpy.run_path('projects/swrlz-forge-moba/patches/v11_21_vertex_sphere_brush_preview.py')['apply'](p.read_text()))
          PY
      - name: Reference layout bounds and previous refinement compatibility
        run: |
          npm install --no-save playwright@1.56.1 three@0.169.0
          node projects/swrlz-forge-moba/tests/model_atelier_reference_compare_v11_45.mjs
          node projects/swrlz-forge-moba/tests/model_atelier_refine_layers_v11_31.mjs
      - name: Desktop Android actual dock sizing pin drag and native persistence
        run: |
          npx playwright install --with-deps --only-shell chromium
          python -m http.server 8787 --directory /tmp/atelier-reference >/tmp/atelier-ref-server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8787/ >/dev/null; then break; fi
            sleep 0.3
          done
          curl -fsS http://127.0.0.1:8787/ >/dev/null
          SWYRL_SCULPT_TEST_URL=http://127.0.0.1:8787 node projects/swrlz-forge-moba/tests/model_atelier_reference_compare_browser_v11_45.mjs
