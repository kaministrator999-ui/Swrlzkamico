name: Inspect live §C music-generation routing and quality seams
on:
  push:
    paths: [".github/workflows/hf-chat-music-quality-inspect.yml"]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: python -m pip install --quiet 'huggingface_hub>=0.34,<2'
      - name: Read exact current live source only
        shell: bash
        run: |
          python - <<'PY'
          from huggingface_hub import HfApi,hf_hub_download
          from pathlib import Path
          import re,json
          space="kamiloki/Swyrlz";api=HfApi()
          rev=api.repo_info(space,repo_type="space").sha
          print("MUSIC_LIVE_REV",rev,flush=True)
          names=["lfm2_700m_engine.py","music_structure.py","online_tools.py","station.py","song_identity.py"]
          patterns={
            "lfm2_700m_engine.py":r"creative_music_reference_projection|strict_lyric_turn|reference_structure|original_rap_delivery|longform_target|genre|lyric_contract|song|remix|parod|remaster|response_mode|music",
            "music_structure.py":r"^def |^class |original_rap_violations|reference_structure|style|rhyme|line|chorus|copy|repetition",
            "online_tools.py":r"creative_music_transform_request|music|lyrics_creative|lyrics_lookup|web_decision",
            "station.py":r"creative_music_reference_projection|onlineResearch|online_context|_swrlz_auto_code_chain|event_source=",
            "song_identity.py":r"^def |^class |song|track|artist|lyrics"
          }
          for file in names:
            try: data=Path(hf_hub_download(space,file,repo_type="space",revision=rev)).read_text()
            except Exception as e:
              print("MUSIC_FILE_UNAVAILABLE",file,type(e).__name__,flush=True);continue
            lines=data.splitlines()
            hits=[i for i,line in enumerate(lines) if re.search(patterns[file],line,re.I)]
            print("MUSIC_SOURCE_MAP",json.dumps({"file":file,"lines":len(lines),"hits":[(i+1,lines[i].strip()[:150]) for i in hits[:105]]},ensure_ascii=False),flush=True)
            # Limit output: print only high-value slices.
            for start,end in {
                "lfm2_700m_engine.py":[(860,980),(1140,1260),(1360,1430)],
                "music_structure.py":[(1,200),(200,400),(400,560)],
                "online_tools.py":[],
                "station.py":[],
                "song_identity.py":[],
            }[file]:
              if start>len(lines):continue
              print("MUSIC_SOURCE_SECTION",file,start,end,flush=True)
              for n in range(start,min(end,len(lines))+1):
                print("MUSIC_SRC",file,n,lines[n-1][:400],flush=True)
          PY

      - name: Read live stop, streaming and follow-up routing seams
        shell: bash
        run: |
          python - <<'PY'
          from huggingface_hub import HfApi,hf_hub_download
          from pathlib import Path
          import re,json
          space="kamiloki/Swyrlz";rev=HfApi().repo_info(space,repo_type="space").sha
          print("FOLLOWUP_STOP_REV",rev,flush=True)
          targets={
            "station.py":(r"cancelRequested|cancel_check|cancel_requested|/cancel|/stop|requestId|_swrlz_auto_code_chain|event_source|yield json.dumps|SSE",[(680,810),(1290,1335),(1350,1425),(1495,1545),(1720,1770),(2430,2530)]),
            "chat/§wyrlz/index.html":(r"stopButton|stopGeneration|stationCancel|cancelGeneration|stationSubmission|AbortController|abort\(|/cancel|/stop|function .*stop|stop-button",[]),
            "online_tools.py":(r"def research_decision|def web_decision|creative_music_transform_request|lyrics_lookup|lyrics_creative|_LYRICS_LOOKUP|_EXPLICIT_WEB|user_history|followup|should_web",[(1260,1438)]),
            "lfm2_700m_engine.py":(r"def generate_events\(|_response_mode\(|creative_music_reference_projection|original_rap_violations|SYSTEM|cancel_check|reference_structure",[(770,824),(1885,1915)]),
          }
          for file,(pattern,sections) in targets.items():
            try: lines=Path(hf_hub_download(space,file,repo_type="space",revision=rev)).read_text().splitlines()
            except Exception as e: print("STOP_SOURCE_UNAVAILABLE",file,type(e).__name__,flush=True);continue
            hits=[(n+1,txt[:155]) for n,txt in enumerate(lines) if re.search(pattern,txt,re.I)]
            print("STOP_SOURCE_MAP",json.dumps({"file":file,"totalLines":len(lines),"hits":hits[:130]},ensure_ascii=False),flush=True)
            if file=="chat/§wyrlz/index.html":
              picks=[n for n,t in hits if n>1500]
              for n in picks[:28]:sections.append((max(1,n-8),min(len(lines),n+12)))
            for a,b in sections:
              if a>len(lines):continue
              print("STOP_SOURCE_SECTION",file,a,b,flush=True)
              for n in range(a,min(len(lines),b)+1):
                print("STOP_SRC",file,n,lines[n-1][:400],flush=True)
          PY

      - name: Read exact stop endpoint and 9B local completion transport
        shell: bash
        run: |
          python - <<'PY'
          from huggingface_hub import HfApi,hf_hub_download
          from pathlib import Path
          import json
          space="kamiloki/Swyrlz";api=HfApi();rev=api.repo_info(space,repo_type="space").sha
          files=set(api.list_repo_files(space,repo_type="space",revision=rev))
          print("STOP_NATIVE_REV",rev,flush=True)
          print("STOP_NATIVE_FILES",json.dumps(sorted(f for f in files if any(n in f for n in ("qwen", "runtime", "station"))))[:4000],flush=True)
          for name,regions in {
            "station.py":[(2238,2260),(1360,1405),(1760,1794)],
            "chat/§wyrlz/index.html":[(4950,5005)],
            "hf_chat_qwen35_9b_runtime.py":[(1,53),(189,232)],
            "qwen35_runtime.py":[(1,65),(170,245)],
          }.items():
            if name not in files:continue
            lines=Path(hf_hub_download(space,name,repo_type="space",revision=rev)).read_text().splitlines()
            for start,end in regions:
              print("STOP_NATIVE_SECTION",name,start,end,flush=True)
              for n in range(start,min(end,len(lines))+1):
                print("STOP_NATIVE",name,n,lines[n-1][:500],flush=True)
          PY

      - name: Inspect current live Qwen model streaming class
        shell: bash
        run: |
          python - <<'PY'
          from huggingface_hub import HfApi,hf_hub_download
          from pathlib import Path
          import json,re
          space="kamiloki/Swyrlz";rev=HfApi().repo_info(space,repo_type="space").sha
          lines=Path(hf_hub_download(space,"qwen35_single_runtime.py",repo_type="space",revision=rev)).read_text().splitlines()
          print("NATIVE_STOP_CURRENT",rev,len(lines),flush=True)
          for n,line in enumerate(lines,1):
            if re.search(r"def create_chat_completion|def _post|cancel|threading|HTTP|def _stream|response|def close|def load|def stop",line,re.I):
              print("NATIVE_STOP_HIT",n,line[:300],flush=True)
          for n in range(1,min(len(lines),295)+1):
            print("NATIVE_STOP_LINE",n,lines[n-1][:400],flush=True)
          PY
