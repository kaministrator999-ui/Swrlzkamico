name: Inspect live §C music-generation routing and quality seams
on:
  push:
    paths: [".github/workflows/hf-chat-music-quality-inspect.yml"]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: python -m pip install --quiet 'huggingface_hub>=0.34,<2'
      - name: Read exact current live source only
        shell: bash
        run: |
          python - <<'PY'
          from huggingface_hub import HfApi,hf_hub_download
          from pathlib import Path
          import re,json
          space="kamiloki/Swyrlz";api=HfApi()
          rev=api.repo_info(space,repo_type="space").sha
          print("MUSIC_LIVE_REV",rev,flush=True)
          names=["lfm2_700m_engine.py","music_structure.py","online_tools.py","station.py","song_identity.py"]
          patterns={
            "lfm2_700m_engine.py":r"creative_music_reference_projection|strict_lyric_turn|reference_structure|original_rap_delivery|longform_target|genre|lyric_contract|song|remix|parod|remaster|response_mode|music",
            "music_structure.py":r"^def |^class |original_rap_violations|reference_structure|style|rhyme|line|chorus|copy|repetition",
            "online_tools.py":r"creative_music_transform_request|music|lyrics_creative|lyrics_lookup|web_decision",
            "station.py":r"creative_music_reference_projection|onlineResearch|online_context|_swrlz_auto_code_chain|event_source=",
            "song_identity.py":r"^def |^class |song|track|artist|lyrics"
          }
          for file in names:
            try: data=Path(hf_hub_download(space,file,repo_type="space",revision=rev)).read_text()
            except Exception as e:
              print("MUSIC_FILE_UNAVAILABLE",file,type(e).__name__,flush=True);continue
            lines=data.splitlines()
            hits=[i for i,line in enumerate(lines) if re.search(patterns[file],line,re.I)]
            print("MUSIC_SOURCE_MAP",json.dumps({"file":file,"lines":len(lines),"hits":[(i+1,lines[i].strip()[:150]) for i in hits[:105]]},ensure_ascii=False),flush=True)
            # Limit output: print only high-value slices.
            for start,end in {
                "lfm2_700m_engine.py":[(860,980),(1140,1260),(1360,1430)],
                "music_structure.py":[(1,200),(200,400),(400,560)],
                "online_tools.py":[],
                "station.py":[],
                "song_identity.py":[],
            }[file]:
              if start>len(lines):continue
              print("MUSIC_SOURCE_SECTION",file,start,end,flush=True)
              for n in range(start,min(end,len(lines))+1):
                print("MUSIC_SRC",file,n,lines[n-1][:400],flush=True)
          PY
