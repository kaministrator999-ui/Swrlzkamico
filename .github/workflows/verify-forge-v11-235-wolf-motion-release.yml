name: Verify §E v11.235 wolf model animation release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-forge-v11-235-wolf-motion-release.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-seal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact v11.235 source SHA, wolf motion controls and all 68 assets
        run: python projects/swrlz-forge-moba/scripts/verify_v11_235_release.py --output /tmp/se235-wolf-sealed
