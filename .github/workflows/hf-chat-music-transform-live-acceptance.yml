name: Live §C anonymous music-transform acceptance
on:
  push:
    paths:
      - "scripts/probe_hf_music_transform_live_v1.py"
      - ".github/workflows/hf-chat-music-transform-live-acceptance.yml"
permissions: {contents: read}
jobs:
  guest_remix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify served revision and original remix composition with guest account
        run: |
          python -m pip install --quiet 'huggingface_hub>=0.34,<2' requests
          python -m py_compile scripts/probe_hf_music_transform_live_v1.py
          python -u -m scripts.probe_hf_music_transform_live_v1
