name: Guarded §C tagged evidence and research-results UI release
on:
  push:
    branches: [main]
    paths: [".deploy/HF_CHAT_TAGGED_RESEARCH_REQUEST.txt"]
permissions: {contents: read}
concurrency:
  group: swrlz-hf-space-deployment
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
      - name: Require owner-approved immutable reviewed §C source
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          p=.deploy/HF_CHAT_TAGGED_RESEARCH_REQUEST.txt
          test -f "$p"
          value() { sed -n "s/^$1=//p" "$p" | tail -n 1; }
          test "$(value APPROVED)" = "1"
          test "$(value TARGET)" = "kamiloki/Swyrlz"
          test "$(value MODEL)" = "qwen3.5-9b"
          test "$(value FEATURE)" = "tagged-public-evidence-visible-sources-v1"
          ref="$(value SOURCE_REF)"
          nonce="$(value REQUEST_NONCE)"
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          [[ "$nonce" =~ ^[a-z0-9-]{12,96}$ ]]
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.gate.outputs.ref }}
          path: reviewed-source
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install existing Hugging Face client
        run: python -m pip install --quiet "huggingface_hub>=0.34,<2"
      - name: Repeat public-evidence privacy, provenance and UI source tests
        working-directory: reviewed-source
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_hf_tagged_research_evidence_v1.py' -v
          python -m py_compile api/research_evidence_envelope_v1.py scripts/hf_chat_tagged_research_evidence_v1.py
      - name: Guarded HF publication with runtime, source-card and guest-conversation acceptance
        working-directory: reviewed-source
        timeout-minutes: 37
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SWRLZ_TAGGED_RESEARCH_DEPLOY_APPROVED: "1"
        run: |
          set -euo pipefail
          python -u scripts/hf_chat_tagged_research_evidence_v1.py --deploy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swrlz-tagged-evidence-original-source-rollback
          path: reviewed-source/swrlz-tagged-research-source-backup/
          retention-days: 14
          if-no-files-found: warn
