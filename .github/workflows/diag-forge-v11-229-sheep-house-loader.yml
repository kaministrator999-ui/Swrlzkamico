name: Validate §E v11.229 native sheep house model loading repair
# Follows updated dual-slot engine source provenance from v11.227/228.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-forge-v11-229-sheep-house-loader.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-loader:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble v11.229 correction without touching sealed manifest on main
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('projects/swrlz-forge-moba/source-manifest.json')
          m=json.loads(p.read_text())
          assert m['name']=='§wyrl§ Engine v11.228',m['name']
          assert m['patches'][-1]=='patches/v11_228_game_gui_menu_subtab.py'
          m['name']='§wyrl§ Engine v11.229'
          m['finalArtifact']='swyrl_engine_v11_229.html'
          m['patches'].append('patches/v11_229_sheep_house_model_loader_repair.py')
          m['finalBytes']=0
          m['finalSha256']=''
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          PY
          python projects/swrlz-forge-moba/build_space.py --output /tmp/se229-sheep-loader
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          b=Path('/tmp/se229-sheep-loader/index.html').read_bytes()
          print('SHEEP_HOUSE_V11229_CANDIDATE_BYTES='+str(len(b)))
          print('SHEEP_HOUSE_V11229_CANDIDATE_SHA256='+hashlib.sha256(b).hexdigest())
          PY
      - name: Install Chromium for one focused Model Atelier load
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps --only-shell chromium
      - name: Verify all five real modeler starter loads on mobile view
        run: node projects/swrlz-forge-moba/tests/ui_v11_229_sheep_building_loader.mjs
