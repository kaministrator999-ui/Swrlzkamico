name: §E v11.120 toolbar and zoom preflight
on:
  push:
    branches: [feature/sheep-placement-gap-contract-v11-124]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify sealed v11.120 artifact and module
        run: |
          python projects/swrlz-forge-moba/scripts/verify_v11_124_release.py --output /tmp/se-v11124-release
          cp /tmp/se-v11124-release-module.mjs /tmp/se-v11124.mjs
          cp /tmp/se-v11124.mjs /tmp/se-v11123.mjs
          cp /tmp/se-v11124-release/index.html /tmp/se-v11124.html
          cp /tmp/se-v11124.html /tmp/se-v11123.html
          cp /tmp/se-v11123.mjs /tmp/se-v11121.mjs
          cp /tmp/se-v11123.mjs /tmp/se-v11122.mjs
          cp /tmp/se-v11121.mjs /tmp/se-v11120.mjs
          node --check /tmp/se-v11120.mjs
      - name: Inspect layers and preserve editor interactions
        run: |
          SE_ASSEMBLED_HTML=/tmp/se-v11124.html node projects/swrlz-forge-moba/tests/sheep_passable_placement_v11_124.mjs
          node projects/swrlz-forge-moba/tests/sheep_safe_lanes_editor_toolbar_v11_123.mjs
          node projects/swrlz-forge-moba/tests/engine_sitewide_touch_guard_v11_122.mjs
          node projects/swrlz-forge-moba/tests/model_atelier_component_row_v11_121.mjs
          node projects/swrlz-forge-moba/tests/model_atelier_toolbar_layers_touch_v11_120.mjs
          npm install --no-save --no-package-lock three@0.160.1
          cp /tmp/se-v11120.mjs /tmp/se-v11119.mjs
          cp /tmp/se-v11120.mjs /tmp/se-v11118.mjs
          cp /tmp/se-v11120.mjs /tmp/se-v11116.mjs
          node projects/swrlz-forge-moba/tests/model_atelier_unified_modes_v11_119.mjs
          node projects/swrlz-forge-moba/tests/model_atelier_semantic_tools_v11_118.mjs
          node projects/swrlz-forge-moba/tests/model_atelier_camera_precision_v11_116.mjs
          node projects/swrlz-forge-moba/tests/model_atelier_precision_gizmos_v11_114.mjs
          node projects/swrlz-forge-moba/tests/model_atelier_preview_selection_v11_115.mjs
          node projects/swrlz-forge-moba/tests/model_atelier_callout_guard_v11_117.mjs
