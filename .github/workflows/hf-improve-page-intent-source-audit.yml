name: Audit §C exact current coding-intent classifier and history gates
on:
  push:
    branches: [main]
    paths: [".github/workflows/hf-improve-page-intent-source-audit.yml"]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: python -m pip install 'huggingface_hub>=0.34,<2'
      - run: |
          python - <<'PY'
          from pathlib import Path
          import ast,json
          from huggingface_hub import HfApi,hf_hub_download
          S="kamiloki/Swyrlz";rev=HfApi().repo_info(S,repo_type="space").sha
          code=Path(hf_hub_download(S,"brain_programming.py",repo_type="space",revision=rev)).read_text()
          tree=ast.parse(code)
          print("CODE_INTENT_REV",rev,flush=True)
          for n in tree.body:
              if isinstance(n,ast.FunctionDef) and n.name in ("programming_intent","_continuation_context","_code_followup"):
                  print("CODE_INTENT_FUNCTION",json.dumps({"name":n.name,"start":n.lineno,"end":n.end_lineno,
                    "text":ast.get_source_segment(code,n)},ensure_ascii=False),flush=True)
          for n in tree.body:
              if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id in (
                    "_CODE_TERMS","_NEW_PROJECT","_PROGRAMMING_ACTIONS","_CONTINUATION",
                    "_PROGRAMMING_WEAK_TERMS") for t in n.targets):
                  print("CODE_INTENT_CONSTANT",ast.get_source_segment(code,n),flush=True)
          print("CODE_INTENT_AUDIT_COMPLETE",flush=True)
          PY
