name: Seal and verify §E v11.472 full-resolution textures
on:
  push:
    branches: [fix/se472-native-resolution-textures]
    paths:
      - ".github/workflows/seal-engine-v11-472-textures.yml"
      - ".github/workflows/deploy-swrlz-forge-moba.yml"
      - "projects/swrlz-forge-moba/runtime/texture_full_resolution_v11_472.*"
      - "projects/swrlz-forge-moba/patches/v11_472_full_resolution_textures.py"
      - "projects/swrlz-forge-moba/tests/texture_full_resolution*"
      - "projects/swrlz-forge-moba/scripts/prepare_v11_472_release.py"
      - "projects/swrlz-forge-moba/scripts/verify_v11_472_release.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: se472-full-res-seal
  cancel-in-progress: true
jobs:
  verify-and-seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify original import, selected resolution, 449 patches and all previous regression tests
        run: python projects/swrlz-forge-moba/scripts/prepare_v11_472_release.py
      - name: Seal source hash and approved release request
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/swrlz-forge-moba/source-manifest.json projects/swrlz-forge-moba/DEPLOY_REQUEST.json
          if ! git diff --cached --quiet; then
            git commit -m "seal(§E): verified v11.472 full-resolution source receipt"
            git push origin HEAD:fix/se472-native-resolution-textures
          fi
      - name: Retain verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: se472-full-resolution-source
          path: |
            projects/swrlz-forge-moba/source-manifest.json
            projects/swrlz-forge-moba/DEPLOY_REQUEST.json
          if-no-files-found: error
