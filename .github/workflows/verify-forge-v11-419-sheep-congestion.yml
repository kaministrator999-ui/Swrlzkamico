name: Verify §E v11.419 sealed Sheep Tag congestion release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-forge-v11-419-sheep-congestion.yml'
      - 'projects/swrlz-forge-moba/scripts/verify_v11_419_release.py'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Reconstruct complete sealed 400-patch engine, syntax and regression tests
        run: python projects/swrlz-forge-moba/scripts/verify_v11_419_release.py --output /tmp/se419-verified
