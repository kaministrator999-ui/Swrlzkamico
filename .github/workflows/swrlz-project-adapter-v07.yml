name: §C → §X reviewed project adapter v0.7
on:
  push:
    branches: [feat/swrlz-x-isolation-v03]
    paths:
      - 'api/html_project_x_reviewed_v1.py'
      - 'projects/swrlz-execution/release_project_adapter_v07.py'
      - '.github/workflows/swrlz-project-adapter-v07.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  project-adapter:
    if: github.ref == 'refs/heads/feat/swrlz-x-isolation-v03'
    concurrency:
      group: swrlz-execution-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet 'huggingface_hub>=0.34,<2' 'requests>=2.31,<3'
      - name: Validate reviewed routing, fallback and source patches
        run: python projects/swrlz-execution/release_project_adapter_v07.py
      - name: Deploy production adapter and verify shared model repair loop
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u projects/swrlz-execution/release_project_adapter_v07.py publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swrlz-project-adapter-receipt
          path: swrlz-project-adapter-receipt.json
          if-no-files-found: warn
          retention-days: 14
