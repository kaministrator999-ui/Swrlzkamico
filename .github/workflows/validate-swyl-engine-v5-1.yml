name: Validate §wyrl§ Engine v5.1 candidate

on:
  push:
    branches: [swyls-engine-v5-1]
    paths:
      - ".github/workflows/validate-swyl-engine-v5-1.yml"
      - "projects/swrlz-forge-moba/source-manifest.json"
      - "projects/swrlz-forge-moba/patches/**"
      - "projects/swrlz-forge-moba/build_space.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: swyls-engine-v5-1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Rebuild exact §wyrl§ Engine v5.1 source
        run: |
          set -euo pipefail
          python projects/swrlz-forge-moba/build_space.py --output /tmp/swyrl-engine
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path("/tmp/swyrl-engine/index.html")
          data=p.read_bytes()
          print("SWYRL_V5_1_BYTES="+str(len(data)))
          print("SWYRL_V5_1_SHA256="+hashlib.sha256(data).hexdigest())
          PY

      - name: Verify v5.1 semantics
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path("/tmp/swyrl-engine/index.html").read_text(encoding="utf-8")
          required=[
            "SWYRL_ENGINE_DEPLOY_MARKER: V5_1_SEED_DEN",
            "§wyrl§ ENGINE · MAKER v5.1",
            "Dragon's Den — Seed Chamber",
            "function makeDenStructure",
            "Wake Nook",
            "Creator Alcove",
            "Portal Hall Exit",
            "Memory Vault Exit",
            "Inference Core Exit",
            "window.SWYRL_ENGINE_AGENT",
            "buildDragonsDenProject();refreshAssetList()",
          ]
          missing=[x for x in required if x not in s]
          print("MISSING=",missing)
          print("ASCENSION_PAD_COUNT=",s.count("Ascension Pad"))
          if missing: raise SystemExit(1)
          PY

      - name: Syntax-check generated editor module
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path("/tmp/swyrl-engine/index.html").read_text(encoding="utf-8")
          start=s.index('<script type="module">')+len('<script type="module">')
          end=s.rindex('</script>')
          Path("/tmp/swyrl-engine.mjs").write_text(s[start:end],encoding="utf-8")
          PY
          node --check /tmp/swyrl-engine.mjs
