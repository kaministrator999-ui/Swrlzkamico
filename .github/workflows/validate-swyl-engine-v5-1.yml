name: Validate §wyrl§ Engine v5.1 candidate

on:
  push:
    branches: [swyls-engine-v5-1]
    paths:
      - ".github/workflows/validate-swyl-engine-v5-1.yml"
      - "projects/swrlz-forge-moba/patches/v5_1_swyl_engine_seed_den.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: swyls-engine-v5-1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rebuild exact v5 source
        run: |
          set -euo pipefail
          python projects/swrlz-forge-moba/build_space.py --output /tmp/forge-v5
      - name: Apply v5.1 patch and report integrity
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, importlib.util, json
          from pathlib import Path
          root=Path("projects/swrlz-forge-moba")
          source=Path("/tmp/forge-v5/index.html").read_text(encoding="utf-8")
          path=root/"patches/v5_1_swyl_engine_seed_den.py"
          spec=importlib.util.spec_from_file_location("v5_1",path)
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          out=mod.apply(source)
          data=out.encode("utf-8")
          result={"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()}
          print("SWYRL_V5_1_INTEGRITY="+json.dumps(result,sort_keys=True))
          Path("/tmp/swyl-engine-v5-1.html").write_text(out,encoding="utf-8")
          PY
      - name: Verify v5.1 semantics
        run: |
          set -euo pipefail
          FILE=/tmp/swyl-engine-v5-1.html
          grep -q "SWYRL_ENGINE_DEPLOY_MARKER: V5_1_SEED_DEN" "$FILE"
          grep -q "§wyrl§ ENGINE · MAKER v5.1" "$FILE"
          grep -q "Dragon's Den — Seed Chamber" "$FILE"
          grep -q "function makeDenStructure" "$FILE"
          grep -q "Wake Nook" "$FILE"
          grep -q "Creator Alcove" "$FILE"
          grep -q "Portal Hall Exit" "$FILE"
          grep -q "Memory Vault Exit" "$FILE"
          grep -q "Inference Core Exit" "$FILE"
          grep -q "window.SWYRL_ENGINE_AGENT" "$FILE"
          ! grep -q "Ascension Pad" "$FILE"
      - name: Syntax-check editor module
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path("/tmp/swyl-engine-v5-1.html").read_text(encoding="utf-8")
          start=s.index('<script type="module">')+len('<script type="module">')
          end=s.rindex('</script>')
          Path("/tmp/swyl-engine-v5-1.mjs").write_text(s[start:end],encoding="utf-8")
          PY
          node --check /tmp/swyl-engine-v5-1.mjs
