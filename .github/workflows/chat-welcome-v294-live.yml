name: Chat v294 live desktop welcome publication acceptance

on:
  pull_request:
    paths:
      - 'scripts/verify_chat_welcome_v294_live.py'
      - '.github/workflows/chat-welcome-v294-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile public-only acceptance script
        run: python -m py_compile scripts/verify_chat_welcome_v294_live.py
      - name: Verify v294 revision and served desktop welcome CSS
        run: python scripts/verify_chat_welcome_v294_live.py
