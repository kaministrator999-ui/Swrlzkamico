name: Preflight §C music research routing fixes
on:
  push:
    branches: [main]
    paths:
      - 'scripts/hf_music_research_intent_routing_v1.py'
      - '.github/workflows/hf-music-research-routing-preflight.yml'
permissions: {contents: read}
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet 'huggingface_hub>=0.34,<2'
      - run: python -m py_compile scripts/hf_music_research_intent_routing_v1.py
      - name: Run actual deployed classifier with 14 operation-routing fixtures
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u scripts/hf_music_research_intent_routing_v1.py preflight
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: music-research-route-preflight-${{ github.run_id }}
          path: reports/swrlz-music-router-v1/
          retention-days: 14
          if-no-files-found: ignore
