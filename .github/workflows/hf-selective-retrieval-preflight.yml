name: Read-only preflight for §C selective retrieval
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hf-selective-retrieval-preflight.yml"
permissions:
  contents: read
concurrency:
  group: swrlz-hf-space-deployment
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ad66cbfa08bf498f632995bb090fcfc067c64490
          path: trial-source
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing Hugging Face client
        run: python -m pip install --quiet "huggingface_hub>=0.34,<2"
      - name: Run targeted router and source-drift regression
        working-directory: trial-source
        run: |
          python -m unittest discover -s tests -p "test_selective_retrieval.py" -v
          python -m unittest discover -s tests -p "test_hf_selective_retrieval_trial.py" -v
      - name: Check guarded release Python syntax
        working-directory: trial-source
        run: python -m py_compile scripts/hf_chat_selective_retrieval_release.py
      - name: Inspect exact current HF source, no modification
        working-directory: trial-source
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os,re,json
          from pathlib import Path
          from huggingface_hub import HfApi,hf_hub_download
          token=os.environ.get("HF_TOKEN")
          if not token:raise RuntimeError("Existing owner HF_TOKEN secret is absent")
          api=HfApi(token=token)
          info=api.repo_info("kamiloki/Swyrlz",repo_type="space")
          revision=info.sha
          files=set(api.list_repo_files("kamiloki/Swyrlz",repo_type="space",revision=revision))
          watched=["lfm2_700m_engine.py","station.py","app.py","online_tools.py",
                   "api/online_research.py","api/selective_retrieval.py",
                   "qwen35_single_runtime.py","qwen_coder_engine.py"]
          print("HF_SELECTIVE_PREFLIGHT "+json.dumps({"revision":revision,
              "filesPresent":[name for name in watched if name in files]}))
          for name in ["lfm2_700m_engine.py","station.py","online_tools.py","api/online_research.py"]:
              if name not in files:continue
              body=Path(hf_hub_download("kamiloki/Swyrlz",name,repo_type="space",
                          revision=revision,token=token)).read_text("utf-8")
              lines=body.splitlines()
              patterns=(r"def generate_events\(",r"onlineContext",r"def research\(",
                        r"online_tools",r"def _.*research",r"research_bundle",r"research_requested")
              hits=[{"line":i+1,"code":line.strip()[:150]} for i,line in enumerate(lines)
                    if any(re.search(pattern,line) for pattern in patterns)]
              print("HF_SELECTIVE_HOOKS "+json.dumps({"file":name,"length":len(lines),
                    "hits":hits[:35]},ensure_ascii=True))
          # Inspect the exact live model evidence handoff, without user data.
          for name,ranges in [
              ("lfm2_700m_engine.py", [(739,762),(920,1002)]),
              ("station.py", [(195,265)]),
          ]:
              if name not in files:continue
              body=Path(hf_hub_download("kamiloki/Swyrlz",name,repo_type="space",
                           revision=revision,token=token)).read_text("utf-8")
              lines=body.splitlines()
              for a,b in ranges:
                  print("HF_SELECTIVE_CONTEXT "+json.dumps({
                     "file":name,"range":[a,b],
                     "lines":[str(i+1)+": "+lines[i][:190] for i in range(a-1,min(b,len(lines)))]},
                     ensure_ascii=True))
          PY
      - name: Prepare exact-source candidate without publishing
        working-directory: trial-source
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u scripts/hf_chat_selective_retrieval_trial.py --out /tmp/swrlz-selective-preflight
      - name: Inspect current running Space revision (read-only)
        working-directory: trial-source
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          from huggingface_hub import HfApi
          api=HfApi(token=os.environ["HF_TOKEN"])
          info=api.repo_info("kamiloki/Swyrlz",repo_type="space")
          req=urllib.request.Request("https://huggingface.co/api/spaces/kamiloki/Swyrlz",
                headers={"User-Agent":"SWRLZ-Source-Revision-Audit/1"})
          with urllib.request.urlopen(req,timeout=12) as response:
              public=json.load(response)
          runtime=public.get("runtime") or {}
          print("HF_SELECTIVE_RUNTIME_REVISION "+json.dumps({
              "repoRevision":info.sha,
              "publicRevision":public.get("sha"),
              "runtimeRevision":runtime.get("sha"),
              "runtimeStage":runtime.get("stage"),
              "runtimeKeys":list(runtime.keys())[:24],
          }))
          PY
      - name: Check bounded public reference source access (no user data)
        working-directory: trial-source
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.error
          urls=[
              "https://en.wikipedia.org/wiki/Diablo_II",
              "https://en.wikipedia.org/wiki/Diablo_II:_Lord_of_Destruction",
              "https://en.wikipedia.org/api/rest_v1/page/summary/Diablo_II",
              "https://en.wikipedia.org/w/api.php?action=query&prop=extracts&explaintext=1&titles=Diablo_II&format=json",
          ]
          for url in urls:
              status=None; preview=""; failure=None; content_type=None
              try:
                  req=urllib.request.Request(url,headers={
                      "User-Agent":"SWRLZ-Research/2.0 (source-verification)",
                      "Accept":"text/html,application/json"})
                  with urllib.request.urlopen(req,timeout=10) as response:
                      status=response.status
                      content_type=response.headers.get("Content-Type")
                      data=response.read(600)
                  preview=data.decode("utf-8","replace")[:120]
              except Exception as exc:
                  failure=type(exc).__name__+":"+str(exc)[:80]
              print("HF_SELECTIVE_PUBLIC_REFERENCE "+json.dumps({
                  "url":url,"status":status,"contentType":content_type,
                  "preview":preview,"error":failure}))
          PY
      - name: Probe public Diablo II retrieval using the exact HF adapter
        working-directory: trial-source
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import importlib.util,sys,json,os
          from huggingface_hub import HfApi,hf_hub_download
          api=HfApi(token=os.environ["HF_TOKEN"])
          rev=api.repo_info("kamiloki/Swyrlz",repo_type="space").sha
          path=hf_hub_download("kamiloki/Swyrlz","api/online_research.py",
               revision=rev,repo_type="space",token=api.token)
          spec=importlib.util.spec_from_file_location("swrlz_live_public_search",path)
          module=importlib.util.module_from_spec(spec)
          sys.modules[spec.name]=module
          spec.loader.exec_module(module)
          from api.selective_retrieval import enrich_payload,reference_pages
          urls=[
              "https://en.wikipedia.org/api/rest_v1/page/summary/Diablo_II",
              "https://en.wikipedia.org/api/rest_v1/page/summary/Diablo_II:_Lord_of_Destruction",
          ]
          for url in urls:
              try:
                  record=module._page_fetch(url)
                  raw=str(record.get("extract") or "")
                  try:
                      parsed=json.loads(raw)
                      shape={"validJson":True,"keys":list(parsed.keys())[:14],
                             "title":str(parsed.get("title") or "")[:100]}
                  except ValueError as exc:
                      shape={"validJson":False,"prefix":raw[:140],
                             "jsonError":str(exc)[:120]}
                  print("HF_SELECTIVE_REFERENCE_ADAPTER "+json.dumps({
                     "url":url,"status":record.get("status"),
                     "extractLength":len(raw),**shape}))
              except Exception as exc:
                  print("HF_SELECTIVE_REFERENCE_ADAPTER "+json.dumps({
                      "url":url,"error":type(exc).__name__+":"+str(exc)[:120]}))
          prompt="Was Diablo II Classic released before Lord of Destruction expansion?"
          print("HF_SELECTIVE_REFERENCE_COUNT "+str(len(reference_pages(prompt,module._page_fetch))))
          enriched,route=enrich_payload({"prompt":prompt},module.research,
                    fetch_page=module._page_fetch,enabled=True)
          selected=enriched.get("onlineContext") or {}
          print("HF_SELECTIVE_LIVE_PROVIDER "+json.dumps({
             "route":route["phase"],"relevantResults":selected.get("resultCount",0),
             "sampleTitles":[str(x.get("title") or "")[:120] for x in selected.get("evidence",[])[:4]]
          }))
          if route["phase"]!="RESEARCH_READY" or not selected.get("resultCount"):
              raise RuntimeError("NO_RELEVANT_DIABLO_II_PUBLIC_EVIDENCE")
          PY
