name: Author §E v11.547 True 3D UV Robot Skin
on:
  push:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/RELEASE_AUTHOR_SKIN_V11_547.json"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: se547-anatomical-skin
  cancel-in-progress: false
jobs:
  paint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install authoring-only 3D UV bake dependencies
        run: python -m pip install --quiet "numpy>=1.26,<3" "scipy>=1.12,<2" "pillow>=10,<13" "xatlas>=0.0.9"
      - name: Bake actual 3D anatomical skin into existing v11.546 UV coordinates
        run: python projects/swrlz-forge-moba/authoring/bake_humanoid_3d_uv_skin_v11_547.py
      - name: Verify generated true resolution, scene preservation and model-view proof
        run: |
          python - <<'PY'
          import json,struct,base64,hashlib
          from pathlib import Path
          root=Path('projects/swrlz-forge-moba')
          proof=json.loads((root/'docs/qa/futuristic-humanoid-v11-547-3d-surface-skin-validation.json').read_text())
          assert proof['triangles']==13932 and proof['uvVertices']==8902
          assert not any(proof[k] for k in ['uvCoordinatesModified','geometryModified','oldMaterialOverwritten','triangulationPaintedIntoTexture'])
          for key,res in [('4kMaterial',4096),('2kMaterial',2048),('nativeMaterial',1024)]:
              name='futuristic-humanoid-v11-547-3d-surface-skin-'+str(res)+'.png'
              data=(root/'assets/models'/name).read_bytes()
              assert data[:8]==b'\x89PNG\r\n\x1a\n'
              assert struct.unpack('>II',data[16:24])==(res,res)
              assert hashlib.sha256(data).hexdigest()==proof[key]['sha256']
              assert len(data)<10_000_000
          native=(root/'assets/models/futuristic-humanoid-v11-547-3d-surface-skin-1024.png').read_bytes()
          assert len(base64.b64encode(native))+22<=360000
          view=(root/'docs/qa/futuristic-humanoid-v11-547-3d-surface-skin-front-back-side.png').read_bytes()
          assert struct.unpack('>II',view[16:24])==(1560,606)
          scene=(root/'scenes/model-atelier-futuristic-humanoid-v11-546.swyrl.json').read_bytes()
          assert hashlib.sha256(scene).hexdigest()==proof['sourceSceneSha256']
          print('SE547_SKIN_ASSET_INTEGRITY_PASS')
          PY
      - name: Commit texture assets and 3D render receipts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/swrlz-forge-moba/assets/models/futuristic-humanoid-v11-547-3d-surface-skin-4096.png
          git add projects/swrlz-forge-moba/assets/models/futuristic-humanoid-v11-547-3d-surface-skin-2048.png
          git add projects/swrlz-forge-moba/assets/models/futuristic-humanoid-v11-547-3d-surface-skin-1024.png
          git add projects/swrlz-forge-moba/docs/qa/futuristic-humanoid-v11-547-3d-surface-skin-front-back-side.png
          git add projects/swrlz-forge-moba/docs/qa/futuristic-humanoid-v11-547-3d-surface-skin-validation.json
          git diff --cached --quiet && exit 0
          git commit -m "asset(modeler): add registered 4K robotic mannequin UV skin and 3D QA views"
          git pull --rebase origin main
          git push origin HEAD:main
