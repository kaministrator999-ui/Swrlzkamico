name: Guarded HF Chat Vosk Sample Rate Repair
on:
  push:
    branches: [main]
    paths:
      - ".deploy/HF_CHAT_VOSK_SAMPLERATE_REQUEST.txt"
permissions:
  contents: read
concurrency:
  group: swrlz-hf-space-deployment
  cancel-in-progress: false
jobs:
  vosk-samplerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout scoped production request
        uses: actions/checkout@v4
      - name: Validate approved no-paid release
        id: request
        shell: bash
        run: |
          set -euo pipefail
          file=".deploy/HF_CHAT_VOSK_SAMPLERATE_REQUEST.txt"
          test -f "$file"
          get() { sed -n "s/^$1=//p" "$file" | tail -n 1; }
          test "$(get TARGET)" = "kamiloki/Swyrlz"
          test "$(get APPROVED)" = "1"
          test "$(get NO_PAID_SPEECH_API)" = "1"
          test "$(get NO_HARDWARE_UPGRADE)" = "1"
          ref="$(get SOURCE_REF)"
          nonce="$(get REQUEST_NONCE)"
          [[ "$ref" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::Bad immutable SOURCE_REF"; exit 1; }
          [[ "$nonce" =~ ^[A-Za-z0-9._-]{10,96}$ ]] || { echo "::error::Invalid release nonce"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Checkout reviewed source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.ref }}
          path: voice-streaming-source
          fetch-depth: 1
      - name: Verify Vosk sample-rate source and regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --check voice-streaming-source/chat/§wyrlz/assets/local_voice_vosk.js
          node voice-streaming-source/scripts/test_chat_streaming_voice.cjs
          node voice-streaming-source/scripts/test_chat_local_streaming_vosk.cjs
          node voice-streaming-source/scripts/test_chat_local_vosk_recovery.cjs
          python -m py_compile voice-streaming-source/scripts/publish_hf_vosk_samplerate.py
      - name: Install Hugging Face client
        run: python -m pip install 'huggingface_hub>=0.34,<2'
      - name: Snapshot live Space and verify exact source patch
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          python voice-streaming-source/scripts/publish_hf_vosk_samplerate.py prepare
      - name: Save original production files before publication
        uses: actions/upload-artifact@v4
        with:
          name: hf-chat-vosk-samplerate-rollback
          path: hf-vosk-samplerate-rollback/
          retention-days: 90
          if-no-files-found: error
      - name: Publish sample-rate fix to existing Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          python voice-streaming-source/scripts/publish_hf_vosk_samplerate.py publish
