name: Diagnose live §C GitHub release health
on:
  push:
    branches: [feature/chat-github-live-integration-v1]
    paths: ['.github/workflows/chat-github-runtime-probe.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check current Space stage and HTTP readiness
        run: |
          python - <<'PY'
          import json
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError,URLError
          for url in ('https://huggingface.co/api/spaces/kamiloki/Swyrlz',
                      'https://kamiloki-swyrlz.hf.space/',
                      'https://kamiloki-swyrlz.hf.space/api/github/status',
                      'https://kamiloki-swyrlz.hf.space/chat/%C2%A7wyrlz/assets/github-change-review-v1.js'):
              try:
                  with urlopen(Request(url,headers={'User-Agent':'swrlz-live-health-check','Cache-Control':'no-cache'}),timeout=12) as r:
                      data=r.read(950000);print('CHECK',url,'STATUS',r.status,'BYTES',len(data),flush=True)
                      if url.endswith('/api/spaces/kamiloki/Swyrlz'):
                          j=json.loads(data);print('HF_SHA',j.get('sha'),'STAGE',(j.get('runtime') or {}).get('stage'),flush=True)
                      elif url.endswith('.js'):
                          print('REVIEW_ASSET_PRESENT',b'SwrlzGithubChangeReviewV1' in data,flush=True)
                      elif url.endswith('.space/'):
                          print('REVIEW_HTML_PRESENT',b'swrlz-github-review-v1' in data,flush=True)
              except HTTPError as exc:print('CHECK',url,'STATUS',exc.code,flush=True)
              except Exception as exc:print('CHECK',url,'ERROR',type(exc).__name__,flush=True)
          PY
