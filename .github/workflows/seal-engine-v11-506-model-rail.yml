name: Seal Engine v11.506 Modeling Rail
on:
  workflow_dispatch:
  push:
    branches: [fix/engine-v11-506-model-tool-rail-live]
    paths:
      - 'projects/swrlz-forge-moba/scripts/seal_v11_506_model_rail.py'
permissions:
  contents: write
jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/engine-v11-506-model-tool-rail-live
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install --quiet playwright==1.56.0
      - run: python projects/swrlz-forge-moba/scripts/seal_v11_506_model_rail.py
      - name: Commit verified SHA and size to repair branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/swrlz-forge-moba/source-manifest.json
          git commit -m "seal(engine): exact v11.506 modeling rail source"
          git push origin HEAD:fix/engine-v11-506-model-tool-rail-live
