name: Manual Clean-Room Chat Deploy

on:
  workflow_dispatch:
    inputs:
      approved:
        description: "Deploy only the clean-room Chat surface"
        required: true
        type: choice
        options: ["no", "yes"]
        default: "no"
  push:
    branches: [main]
    paths:
      - ".deploy/CLEAN_ROOM_CHAT_ONLY.txt"

permissions:
  contents: read

concurrency:
  group: swrlz-clean-room-chat-only
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_E4y2LpTSFo9UxTErO9aw6HW1
  VERCEL_PROJECT_ID: prj_dGgleDMgkOQ57wULKlDH5fcYj9Yp

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Authorize isolated Chat deployment
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          allowed=no
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            allowed="${{ inputs.approved }}"
          else
            approved="$(grep '^APPROVED=' .deploy/CLEAN_ROOM_CHAT_ONLY.txt | tail -n1 | cut -d= -f2- || true)"
            [[ "$approved" == "1" ]] && allowed=yes
          fi
          [[ "$allowed" == "yes" ]] || { echo "Not approved."; exit 1; }

      - name: Verify isolated source contract
        shell: bash
        run: |
          set -euo pipefail
          test -f 'chat/§wyrlz/index.html'
          test -f 'file_00000000b13c81f5a7f9fe99c0264ef0.png'
          python - <<'PY'
          import json, re

          version_lines=open("chat/§wyrlz/VERSION.txt",encoding="utf-8").read().splitlines()
          version=version_lines[0].strip() if version_lines else ""
          assert re.fullmatch(r"\d+\.\d+\.\d+", version), f"invalid VERSION.txt version: {version!r}"

          html=open("chat/§wyrlz/index.html",encoding="utf-8").read()
          expected_meta=f'<meta name="swrlz-chat-version" content="{version}">'
          assert expected_meta in html, f"missing canonical version meta for {version!r}"

          trigger={}
          for line in open(".deploy/CLEAN_ROOM_CHAT_ONLY.txt",encoding="utf-8"):
              if "=" in line:
                  key,val=line.rstrip("\\n").split("=",1)
                  trigger[key]=val
          requested=trigger.get("CHAT_VERSION","").strip()
          assert requested==version, f"deploy trigger mismatch: trigger={requested!r} source={version!r}"

          value=json.load(open("vercel.json",encoding="utf-8"))
          assert "functions" not in value, value.get("functions")
          assert value.get("framework") is None, value.get("framework")
          assert value.get("installCommand") == "", value.get("installCommand")
          assert value.get("buildCommand") == "", value.get("buildCommand")
          routes=value.get("routes",[])
          assert len(routes)==2, routes
          assert routes[0]["dest"]=="/chat/§wyrlz/index.html", routes
          assert routes[1]["dest"]=="/file_00000000b13c81f5a7f9fe99c0264ef0.png", routes
          print("isolated clean-room Chat contract verified")
          PY

      - name: Verify Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "VERCEL_TOKEN is required" >&2; exit 1; }

      - name: Purge existing Vercel deployments
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request

          token = os.environ["VERCEL_TOKEN"]
          team = os.environ["VERCEL_ORG_ID"]
          project = os.environ["VERCEL_PROJECT_ID"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
          }

          def request(url, method="GET"):
              req = urllib.request.Request(url, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as r:
                  body = r.read().decode("utf-8")
                  return json.loads(body) if body else {}

          deleted = []
          while True:
              qs = urllib.parse.urlencode({
                  "projectId": project,
                  "teamId": team,
                  "limit": 100,
              })
              data = request(f"https://api.vercel.com/v7/deployments?{qs}")
              deployments = data.get("deployments", [])
              if not deployments:
                  break

              for dep in deployments:
                  dep_id = dep.get("uid") or dep.get("id")
                  if not dep_id:
                      raise RuntimeError(f"deployment missing id: {dep}")
                  request(
                      f"https://api.vercel.com/v13/deployments/{dep_id}?teamId={urllib.parse.quote(team)}",
                      method="DELETE",
                  )
                  deleted.append(dep_id)

              time.sleep(0.5)

          verify_qs = urllib.parse.urlencode({
              "projectId": project,
              "teamId": team,
              "limit": 1,
          })
          remaining = request(f"https://api.vercel.com/v7/deployments?{verify_qs}").get("deployments", [])
          if remaining:
              raise RuntimeError(f"purge verification failed: {remaining}")

          print(f"purged {len(deleted)} deployment(s); project is empty before replacement deploy")
          PY

      - name: Deploy clean-room Chat only
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s%3N)"
          stage="$(mktemp -d)"
          mkdir -p "$stage/chat/§wyrlz"
          cp 'chat/§wyrlz/index.html' "$stage/chat/§wyrlz/index.html"
          cp 'file_00000000b13c81f5a7f9fe99c0264ef0.png' "$stage/"
          cp vercel.json "$stage/vercel.json"
          cd "$stage"
          url="$(npx --yes vercel@59.23.2 deploy --prod --yes --token="$VERCEL_TOKEN")"
          end="$(date +%s%3N)"
          echo "deploy_ms=$((end-start))" >> "$GITHUB_STEP_SUMMARY"
          echo "Production deployment: $url" >> "$GITHUB_STEP_SUMMARY"
