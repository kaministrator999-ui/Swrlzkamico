name: Seal v11.344 Model VR aim/view candidate
on:
  push:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/.candidate-v11-344"
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Source candidate and controller aim regression
        run: python projects/swrlz-forge-moba/scripts/calc_v11_344_candidate.py
