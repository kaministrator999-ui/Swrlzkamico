name: Measure §E v11.477 selectable vertices and operation hierarchy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/measure-engine-v11-477.yml"
      - "projects/swrlz-forge-moba/patches/v11_477_selection_hierarchy.py"
      - "projects/swrlz-forge-moba/runtime/model_vertex_entry_v11_477.js"
      - "projects/swrlz-forge-moba/runtime/model_progressive_hierarchy_v11_477.*"
      - "projects/swrlz-forge-moba/scripts/prepare_v11_477_release.py"
      - "projects/swrlz-forge-moba/scripts/verify_v11_477_release.py"
      - "projects/swrlz-forge-moba/tests/model_progressive_hierarchy_v11_477.mjs"
      - "projects/swrlz-forge-moba/tests/model_progressive_hierarchy_browser_v11_477.cjs"
      - "projects/swrlz-forge-moba/source-manifest.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: se477-source-measure
  cancel-in-progress: true

jobs:
  source-and-touch:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify 454 native-source patches, seal exact HTML and provenance
        run: python projects/swrlz-forge-moba/scripts/prepare_v11_477_release.py
      - name: Install Chromium touch interaction browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps --only-shell chromium
      - name: Tap Sculpt, Extrude, Vertex, Ring and Fill on mobile with native points
        run: node projects/swrlz-forge-moba/tests/model_progressive_hierarchy_browser_v11_477.cjs projects/swrlz-forge-moba/_release_v11_477_candidate
      - name: Save source receipt and viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: se477-native-vertex-hierarchy-receipt
          path: |
            projects/swrlz-forge-moba/source-manifest.json
            projects/swrlz-forge-moba/_release_v11_477_candidate/se477-vertex-*.png
