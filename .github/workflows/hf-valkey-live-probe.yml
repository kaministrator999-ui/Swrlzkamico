name: Guarded Valkey connectivity probe on existing HF Space
on:
  push:
    branches: [feature/aiven-valkey-storage-adapter]
    paths: ["scripts/hf_valkey_live_probe_release.py", ".github/workflows/hf-valkey-live-probe.yml"]
permissions: {contents: read}
concurrency:
  group: swrlz-hf-space-deployment
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install "huggingface_hub>=0.34,<2"
      - name: Compile source-pinned additive probe
        run: python -m py_compile scripts/hf_valkey_live_probe_release.py
      - name: Snapshot and validate exact existing Space source
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u scripts/hf_valkey_live_probe_release.py prepare
      - uses: actions/upload-artifact@v4
        with:
          name: valkey-probe-predeploy-source-backup
          path: valkey-live-probe-snapshot/
          retention-days: 90
          if-no-files-found: error
      - name: Add only the optional probe; do not activate Valkey for users
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u scripts/hf_valkey_live_probe_release.py publish
