name: Measure §E v11.271 Sheep LAN Visibility and Auto-Find
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/calc-sheep-lan-v11-271.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Targeted LAN menu controls and preview tests
        run: |
          python3 -m py_compile projects/swrlz-forge-moba/patches/v11_271_lan_visibility_autofind.py
          node --check projects/swrlz-forge-moba/runtime/sheep_lan_visibility_autofind_v11_271.js
          node projects/swrlz-forge-moba/tests/sheep_lan_visibility_autofind_v11_271.cjs
      - name: Verify exact sealed 302-patch engine, assets and assembled JS syntax
        run: |
          python3 projects/swrlz-forge-moba/scripts/verify_v11_271_release.py --output /tmp/se271-verified
          echo SE271_SOURCE_VERIFIED
