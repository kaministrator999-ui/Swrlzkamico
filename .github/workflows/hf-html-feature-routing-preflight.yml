name: Preflight §C additive feature routing
on:
  push:
    branches: [main]
    paths:
      - scripts/hf_html_feature_routing_fix_v1.py
      - .github/workflows/hf-html-feature-routing-preflight.yml
permissions: {contents: read}
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet 'huggingface_hub>=0.34,<2'
      - run: python -m py_compile scripts/hf_html_feature_routing_fix_v1.py
      - name: Test the deployed Brain classifier with synthetic conversation state
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u scripts/hf_html_feature_routing_fix_v1.py preflight
      - name: Preserve pinned source before-and-after and regression log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swrlz-feature-routing-preflight-${{ github.run_id }}
          path: reports/swrlz-feature-vs-repair/
          retention-days: 21
          if-no-files-found: ignore
