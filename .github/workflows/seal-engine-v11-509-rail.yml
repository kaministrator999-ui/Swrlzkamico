name: Seal Engine v11.509 Modeling Rail
on:
  workflow_dispatch:
  push:
    branches: [fix/engine-v11-509-rail-reexpand]
permissions:
  contents: write
jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/engine-v11-509-rail-reexpand
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install --quiet playwright==1.56.0
      - run: |
          if python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('projects/swrlz-forge-moba/source-manifest.json').read_text())
          assert not m.get('finalSha256')
          PY
          then python projects/swrlz-forge-moba/scripts/seal_v11_509_rail.py
          else echo 'Already sealed; no mutation'
          fi
      - name: Commit verified SHA and size to repair branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/swrlz-forge-moba/source-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "seal(engine): exact v11.509 modeling rail source"
          git push origin HEAD:fix/engine-v11-509-rail-reexpand
