name: Seal and deploy §E v11.505 action prerequisites
on:
  push:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/RELEASE_PREPARE_V11_505.json"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: engine-v11-505-action-prerequisites
  cancel-in-progress: false
jobs:
  verify-seal-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current governed engine
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build actual action prerequisites candidate and check sourced outputs
        run: python projects/swrlz-forge-moba/scripts/prepare_v11_505_release.py
      - name: Commit measured v11.505 source receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/swrlz-forge-moba/source-manifest.json
          git commit -m "seal(§E): verified v11.505 action prerequisites source and HTML digest"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Commit separately scoped deployment request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_COMMIT="$(git rev-parse HEAD)"
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path('projects/swrlz-forge-moba')
          m=json.loads((root/'source-manifest.json').read_text('utf8'))
          assert m['name']=='§wyrl§ Engine v11.505'
          assert m['patches'][-1]=='patches/v11_505_action_prerequisites.py'
          assert len(m['finalSha256'])==64 and m['finalBytes']>100000
          request={
            'schema':'swrlz-forge-deploy-request-v1',
            'requestedBy':'ChatGPT (owner-approved)',
            'target':'kamiloki/swrlz-forge-moba',
            'releaseVersion':'v11.505',
            'deployMarker':'SWYRL_ENGINE_DEPLOY_MARKER: V11_505_ACTION_PREREQUISITES',
            'reason':'Offer verified editable conversion or a recoverable UV-preserving working copy, select the single unambiguous mesh, and resume the original UV/Topology tool after confirmation. Cancel never changes the project.',
            'sourceCommit':os.environ['SOURCE_COMMIT'],
            'sourceIntegritySha256':m['finalSha256']
          }
          (root/'DEPLOY_REQUEST.json').write_text(json.dumps(request,indent=2,ensure_ascii=False)+'\n','utf8')
          PY
          git add projects/swrlz-forge-moba/DEPLOY_REQUEST.json
          git commit -m "deploy(§E): request verified v11.505 action prerequisites"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run deploy-swrlz-forge-moba.yml --ref main
