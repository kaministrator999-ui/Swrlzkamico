name: Seal v11.341 model VR candidate
on:
  push:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/.candidate-v11-341"
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and print candidate integrity
        run: python projects/swrlz-forge-moba/scripts/calc_v11_341_candidate.py
