name: §C GitHub review component safety
on:
  pull_request:
    paths:
      - 'chat/github-change-review-v1.js'
      - 'api/github_review_update_v1.py'
      - 'scripts/hf_chat_github_review_release_v1.py'
      - 'tests/test_github_review_update_v1.py'
      - 'scripts/github_review_gate_v1.py'
      - 'tests/test_github_review_gate_v1.py'
      - 'tests/test_chat_github_review_component_v1.mjs'
      - '.github/workflows/chat-github-review-component-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-component:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile scripts/github_review_gate_v1.py api/github_review_update_v1.py scripts/hf_chat_github_review_release_v1.py
      - run: python scripts/hf_chat_github_review_release_v1.py selftest
      - run: python -m unittest discover -s tests -p 'test_github_review_update_v1.py' -v
      - run: python -m unittest discover -s tests -p 'test_github_review_gate_v1.py' -v
      - run: node --check chat/github-change-review-v1.js
      - run: node --test tests/test_chat_github_review_component_v1.mjs
