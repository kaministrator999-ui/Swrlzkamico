name: Inspect v8.1 runtime order
on:
  push:
    branches: [main]
    paths: [".github/workflows/inspect-v8-1-runtime-order.yml"]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python projects/swrlz-forge-moba/build_space.py --output /tmp/e
          python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/e/index.html').read_text()
          for term in ['scene.add(sun);','const sun=','const sun =','loadCanonicalGlitchDen();','function loadCanonicalGlitchDen','let playing','const playing','installPerformanceSettings();applyPerformanceSettings();']:
            i=s.find(term);print('\n###',term,i);print(s[max(0,i-800):i+1800] if i>=0 else 'MISSING')
          PY
