name: Engine v11.233 Studio Commands sealed source verification
on:
  push:
    branches:
      - feature/se-v11-233-chat-native-studio-bridge-20261102
    paths:
      - .github/workflows/se-v11-233-studio-candidate.yml
      - projects/swrlz-forge-moba/runtime/chat_account_panel_v1.js
      - projects/swrlz-forge-moba/patches/v11_233_chat_native_studio_bridge.py
      - projects/swrlz-forge-moba/scripts/measure_v11_233_chat_studio_candidate.py
      - projects/swrlz-forge-moba/scripts/verify_v11_233_release.py
      - projects/swrlz-forge-moba/source-manifest.json
      - projects/swrlz-forge-moba/SPACE_README.md
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Focused Python/JavaScript parse
        run: |
          python -m py_compile projects/swrlz-forge-moba/patches/v11_233_chat_native_studio_bridge.py projects/swrlz-forge-moba/scripts/verify_v11_233_release.py
          node --check projects/swrlz-forge-moba/runtime/chat_account_panel_v1.js
      - name: Build and verify sealed v11.233 source, both routes, and 68 assets
        run: python projects/swrlz-forge-moba/scripts/verify_v11_233_release.py --output dist/swrlz-forge-moba
