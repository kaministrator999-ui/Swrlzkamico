name: Verify private HF Aiven admin

on:
  push:
    branches: [main]
    paths:
      - "hf_space/aiven_admin.py"
      - "scripts/hf_aiven_admin_release.py"
      - "tests/test_hf_aiven_admin.py"
      - ".github/workflows/verify-hf-aiven-admin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-only-source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test-only framework
        run: python -m pip install 'fastapi>=0.110,<1' 'huggingface_hub>=0.24,<2'
      - name: Validate Python source syntax
        run: python -m py_compile hf_space/aiven_admin.py scripts/hf_aiven_admin_release.py tests/test_hf_aiven_admin.py
      - name: Run owner-identity and safety regression suite
        run: python -m unittest discover -s tests -p 'test_hf_aiven_admin.py' -v
      - name: Inspect live Google login structure (read-only, no credentials)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os, pathlib, re
          from huggingface_hub import HfApi, hf_hub_download
          api=HfApi(token=os.environ.get("HF_TOKEN") or None)
          rev=api.repo_info("kamiloki/Swyrlz",repo_type="space").sha
          path=hf_hub_download("kamiloki/Swyrlz","station.py",repo_type="space",revision=rev,token=os.environ.get("HF_TOKEN") or None)
          lines=pathlib.Path(path).read_text().splitlines()
          print("Station revision:",rev,"lines:",len(lines))
          keys=("_hf_accounts","_account_session","verify_oauth2_token","email_verified","sid=uuid","sid = uuid","user={","user = {",'@app.post("/api/account/google")')
          hits=[i for i,line in enumerate(lines) if any(key in line for key in keys)]
          print("Auth structural hits:",hits[:35])
          for i in hits[:25]:
              value=lines[i].strip()[:190]
              if re.search(r"token\s*=|secret\s*=|password\s*=|authorization",value,re.I):
                  value="[redacted potentially sensitive initialization]"
              print("source line",i+1,":",value)
          print("Relevant live authentication context:")
          for start,end in ((425,440),(484,504)):
              for pos in range(start-1, min(end,len(lines))):
                  value=lines[pos].strip()[:210]
                  if re.search(r"(?:token|secret|password|authorization)\s*=",value,re.I):
                      value="[redacted sensitive initialization]"
                  print("source line",pos+1,":",value)
          PY
      - name: Verify against exact current HF Station (read-only)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/hf_aiven_admin_release.py --mode validate
      - name: Assert public Chat source is not imported
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("hf_space/aiven_admin.py").read_text()
          script = Path("scripts/hf_aiven_admin_release.py").read_text()
          assert '@app.get("/api/admin/aiven/metrics"' in source
          assert 'asyncio.to_thread(read_metrics)' in source
          assert 'SWRLZ_ADMIN_GOOGLE_SUB' in source
          assert 'SWRLZ_ADMIN_GOOGLE_EMAIL' in source
          assert 'parent_commit=revision' in script
          assert 'LIVE_HF_SOURCE_CHANGED_BEFORE_DEPLOY' in script
          print("Aiven candidate: private owner gated, on-demand, source-pinned")
          PY
