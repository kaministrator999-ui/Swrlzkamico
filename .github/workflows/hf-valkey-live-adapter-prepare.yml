name: Validate exact live §C native Valkey adapter without publishing
on:
  push:
    branches: [feature/aiven-valkey-storage-adapter]
    paths: ["scripts/hf_valkey_live_adapter_prepare.py",".github/workflows/hf-valkey-live-adapter-prepare.yml"]
permissions: {contents: read}
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install "huggingface_hub>=0.34,<2"
      - name: Build exact source-pinned candidate; do not change HF runtime
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/hf_valkey_live_adapter_prepare.py
      - uses: actions/upload-artifact@v4
        with:
          name: valkey-real-account-redis-adapter-candidate
          path: valkey-adapter-candidate/
          retention-days: 30
          if-no-files-found: error
