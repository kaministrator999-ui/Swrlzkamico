name: Deploy §C GitHub UPDATE_FILE readback fix
on:
  push:
    branches: [fix/github-update-readback-v2]
    paths: ['.github/workflows/chat-github-update-readback-deploy-v2.yml']
permissions:
  contents: read
concurrency:
  group: swrlz-hf-space-deployment
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet requests 'huggingface_hub>=0.34,<2'
      - run: python -m unittest discover -s tests -p test_github_review_update_v1.py -v
      - run: python scripts/hf_github_update_readback_release_v2.py snapshot
      - name: Publish scoped verified patch
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SWRLZ_READBACK_FIX_APPROVED: '1'
        run: python -u scripts/hf_github_update_readback_release_v2.py publish
      - run: python -u scripts/hf_github_update_readback_release_v2.py verify
