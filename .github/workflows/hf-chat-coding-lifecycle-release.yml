name: Guarded §C coding Stop, resumption, preview and speed release
on:
  push:
    branches: [main]
    paths: [".deploy/HF_CHAT_CODING_LIFECYCLE_REQUEST.txt"]
permissions: {contents: read}
concurrency:
  group: swrlz-hf-space-deployment
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 39
    steps:
      - uses: actions/checkout@v4
      - name: Validate explicitly scoped source request and model invariants
        id: approve
        shell: bash
        run: |
          set -euo pipefail
          p=.deploy/HF_CHAT_CODING_LIFECYCLE_REQUEST.txt
          test -f "$p"
          get() { sed -n "s/^$1=//p" "$p" | tail -n 1; }
          test "$(get TARGET)" = "kamiloki/Swyrlz"
          test "$(get APPROVED)" = "1"
          test "$(get CHANGE_SCOPE)" = "coding-stop-resume-preview-speed-only"
          test "$(get MODEL)" = "qwen3.5-9b"
          test "$(get THREADS)" = "18"
          test "$(get CONTEXT_TOKENS)" = "16384"
          ref="$(get SOURCE_REF)"
          nonce="$(get REQUEST_NONCE)"
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          [[ "$nonce" =~ ^[a-z0-9-]{12,96}$ ]]
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.approve.outputs.ref }}
          path: lifecycle-release
          fetch-depth: 1
      - run: python -m pip install 'huggingface_hub>=0.34,<2'
      - name: Source-level and deterministic native-code tests
        working-directory: lifecycle-release
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          python -m py_compile scripts/hf_chat_coding_lifecycle_v1.py scripts/test_hf_coding_lifecycle_stream.py
          python -u scripts/hf_chat_coding_lifecycle_v1.py preflight
          python -u scripts/test_hf_coding_lifecycle_stream.py
      - uses: actions/upload-artifact@v4
        with:
          name: swrlz-coding-lifecycle-previous-live-production
          path: lifecycle-release/swrlz-coding-lifecycle-original/
          retention-days: 14
          if-no-files-found: error
      - name: Publish guarded HF Space update, verify UI/model/Stop, restore exact prior bytes on failure
        working-directory: lifecycle-release
        timeout-minutes: 32
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SWRLZ_CODING_LIFECYCLE_APPROVED: "1"
        run: |
          set -euo pipefail
          python -u scripts/hf_chat_coding_lifecycle_v1.py publish
          echo "SWRLZ_CODING_LIFECYCLE_LIVE_VERIFIED"
