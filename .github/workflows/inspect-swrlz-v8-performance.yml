name: Inspect §E v8 performance anchors
on:
  push:
    branches: [main]
    paths: [".github/workflows/inspect-swrlz-v8-performance.yml"]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and inspect
        run: |
          python projects/swrlz-forge-moba/build_space.py --output /tmp/e
          python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/e/index.html').read_text()
          for term in ['new THREE.WebGLRenderer','setPixelRatio','function tick','requestAnimationFrame','renderer.render','function beginPlay','function endPlay','function updateHeroMovement']:
            i=s.find(term);print('\n###',term,i);print(s[max(0,i-1200):i+3200] if i>=0 else 'MISSING')
          PY
