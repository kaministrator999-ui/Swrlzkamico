name: Audit live §C artifact completion and GitHub handoff (read-only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-chat-html-publish-conversation-v1.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet 'huggingface_hub>=0.34,<2'
      - env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os,re
          from pathlib import Path
          from huggingface_hub import HfApi,hf_hub_download
          api=HfApi(token=os.environ.get('HF_TOKEN') or None)
          rev=api.repo_info('kamiloki/Swyrlz',repo_type='space').sha
          print('AUDIT_HF_REV',rev)
          for path,ranges in (
              ('station.py',[(1015,1070),(1615,1705),(2010,2175),(2380,2445),(2445,2520)]),
              ('github_conversation_actions_v264.py',[(10,90),(150,245),(415,455),(645,735)]),
          ):
              lines=Path(hf_hub_download('kamiloki/Swyrlz',path,repo_type='space',revision=rev,token=api.token)).read_text().splitlines()
              print('AUDIT_FILE',path,len(lines))
              for lo,hi in ranges:
                  print('AUDIT_RANGE',path,lo,hi)
                  for n in range(lo,min(hi,len(lines))+1):
                      print(f'{n:05d} {lines[n-1][:250]}')
          PY
