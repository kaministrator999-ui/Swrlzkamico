name: Audit live §C GitHub HTML publish conversation routing (read-only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-chat-html-publish-conversation-v1.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet 'huggingface_hub>=0.34,<2'
      - env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi,hf_hub_download
          api=HfApi(token=os.environ.get('HF_TOKEN') or None)
          rev=api.repo_info('kamiloki/Swyrlz',repo_type='space').sha
          print('CHAT_PUBLISH_AUDIT_REVISION',rev)
          for path,ranges in (
             ('station.py',[(1460,1510),(2810,2880)]),
             ('github_conversation_actions_v264.py',[(1,55),(270,310),(440,510),(585,660)])):
              text=Path(hf_hub_download('kamiloki/Swyrlz',path,repo_type='space',revision=rev,token=api.token)).read_text().splitlines()
              print('FILE',path,'LINES',len(text))
              for low,high in ranges:
                  for n in range(low,min(high,len(text))+1):
                      print(f'{n:05d} {text[n-1][:290]}')
          PY
