name: HF Candidate Offline Validation
on:
  push:
    branches:
      - integration/chat-forge-*
      - integration/qwen-project-generation-*
      - feature/version-literacy-content-layout-v199
      - feature/grounded-version-recall-v201
      - feature/google-chatgpt-archive-import-v202
      - feature/chatgpt-archive-sidebar-v204
      - feature/chatgpt-account-memory-v205
      - feature/private-history-search-v206
      - feature/private-history-toolkit-v207
      - feature/private-account-facts-v208
  pull_request:
    paths:
      - 'hf_space/**'
      - 'scripts/prepare_hf_space.py'
      - 'scripts/ci_capture_failure.py'
      - 'tests/test_ci_capture_failure.py'
      - 'chat/§wyrlz/assets/github-explorer-v223.js'
      - 'tests/test_github_directory_parser_v224.mjs'
      - 'tests/test_github_preview_persistence_v227.mjs'
      - 'tests/test_github_source_report_mobile_v232.mjs'
      - 'tests/test_chat_source_context_glass_v253.mjs'
      - 'chat/§wyrlz/index.html'
      - 'chat/§wyrlz/assets/chat-updates-v1.*'
      - 'scripts/build_chat_update_history.py'
      - 'tests/test_chat_updates.mjs'
      - 'tests/test_hf_candidate.py'
      - 'tests/test_archive_grounded_lyric_craft_v182.py'
      - 'training/lyrics/**'
      - '.github/workflows/hf-candidate-validation.yml'
      - '.github/workflows/manual-hf-space.yml'
      - 'accepted_runtime/lalm/**'
      - 'swyrlz/**'
      - 'lalm§wyrlz.transport.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage canonical candidate
        env:
          SWRLZ_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/prepare_hf_space.py && python scripts/prepare_hf_space.py --check
      - name: Install bridge test dependencies
        run: python -m pip install "fastapi>=0.115,<1" "httpx>=0.27,<1"
      - name: Validate lyric ocean v2 scoped craft contracts
        run: |
          python -m py_compile hf_space/lyric_craft_school.py hf_space/lfm2_700m_engine.py
          python tests/test_archive_grounded_lyric_craft_v182.py
      - name: Check syntax and contracts
        run: |
          python -m py_compile hf_space/chatgpt_archive.py hf_space/chatgpt_account_memory.py hf_space/personal_history_lookup.py hf_space/personal_history_query_v207.py hf_space/private_account_facts_v208.py hf_space/test_private_account_facts_v208.py hf_space/app.py hf_space/station.py hf_space/model_router.py hf_space/brain_programming.py hf_space/accepted_runtime/lalm/r39_engine.py hf_space/swyrlz/backend.py hf_space/swyrlz/r39_inference.py
          python -m unittest discover -s tests -p test_hf_candidate.py -v
          python hf_space/test_github_explorer_v223.py
          python hf_space/test_github_report_v226.py
          python hf_space/test_github_thread_routing_v229.py
          python hf_space/test_repository_project_status_v233.py
          python hf_space/test_source_answer_articulation_v230.py
          python hf_space/test_chatgpt_archive_import_v202.py
          python hf_space/test_chatgpt_account_memory_v205.py
          python hf_space/test_personal_history_lookup_v206.py
          python hf_space/test_personal_history_toolkit_v207.py
          python hf_space/test_private_account_facts_v208.py
          node --check 'chat/§wyrlz/assets/chatgpt-archive-import-v1.js'
          node --check 'chat/§wyrlz/assets/chatgpt-archive-sidebar-v204.js'
          node --check 'chat/§wyrlz/assets/github-explorer-v223.js'
          node tests/test_github_directory_parser_v224.mjs
          node tests/test_github_preview_persistence_v227.mjs
          node tests/test_github_source_report_mobile_v232.mjs
          node tests/test_chatgpt_archive_sidebar_v204.mjs
          node --check 'chat/§wyrlz/assets/forge-embed-v1.js'
          node tests/forge_google_account_crossover_v1.mjs
          node tests/test_forge_popup_mobile_recovery.mjs
          node tests/test_forge_workspace_read_v1.mjs
          python hf_space/test_forge_workspace_read_v1.py
          node tests/test_forge_avatar_preflight_v1.mjs
          python hf_space/test_forge_embed.py
      - name: v243 GitHub startup concurrency and source-safety regression
        run: |
          python -m pip install 'requests>=2.32,<3' 'cryptography>=43,<47'
          python -m py_compile hf_space/github_connection.py hf_space/test_github_start_parallel_v243.py
          python hf_space/test_github_start_parallel_v243.py
      - name: v264 Seamless GitHub Chat file preflight and consent regressions
        run: |
          python -m py_compile hf_space/github_conversation_actions_v264.py hf_space/station.py
          python hf_space/test_github_seamless_v264.py
          node tests/test_github_seamless_chat_v264.mjs

      - name: v278 User-identity perspective and no-model fallback regression
        run: |
          python -m py_compile hf_space/lfm2_700m_engine.py hf_space/test_user_identity_perspective_v278.py
          python hf_space/test_user_identity_perspective_v278.py

      - name: v281 Concise identity inference and profile scope regression
        run: |
          python -m py_compile hf_space/lfm2_700m_engine.py hf_space/test_identity_conversation_v281.py
          python hf_space/test_identity_conversation_v281.py

      - name: v283 User versus assistant ownership and correction replay
        run: |
          python -m py_compile hf_space/lfm2_700m_engine.py hf_space/test_identity_ownership_v283.py
          python hf_space/test_identity_ownership_v283.py
          python hf_space/test_identity_completion_retry.py

      - name: v282 Model-generated identity role/name candidate guard
        run: |
          python -m py_compile hf_space/lfm2_700m_engine.py hf_space/test_identity_response_v282.py
          python hf_space/test_identity_response_v282.py

      - name: v279 Independent online research storage and compact 700M evidence regression
        run: |
          python -m py_compile hf_space/model_router.py hf_space/test_online_inference_budget_v279.py
          python hf_space/test_online_inference_budget_v279.py

      - name: v277 Verified GitHub file conversation grounding and source-claim regression
        run: |
          python -m py_compile hf_space/verified_file_dialogue_v277.py hf_space/lfm2_700m_engine.py hf_space/test_verified_file_dialogue_v277.py
          python hf_space/test_verified_file_dialogue_v277.py

      - name: v267 GitHub root listing and compact mobile inventory regressions
        run: |
          python -m py_compile hf_space/github_read_inference_v235.py hf_space/github_connection.py hf_space/station.py
          python hf_space/test_github_read_inference_v235.py
          node tests/test_github_inventory_mobile_v267.mjs

      - name: v293 GitHub read-tool planning and model reasoning permission regressions
        run: |
          python -m py_compile hf_space/github_connection.py hf_space/test_github_model_progress_v211.py
          python hf_space/test_github_model_progress_v211.py

      - name: Source-grounded model cooperation and candidate integrity
        run: |
          python -m unittest discover -s hf_space -p 'test_github*change*.py' -v
          python hf_space/test_web_code_completeness.py
          python hf_space/test_code_deliverable_cognition.py
          python hf_space/test_coder_model_config.py
          python hf_space/test_programming_structured_receipt_scope.py
          python hf_space/test_web_module_contract.py
          python hf_space/test_editor_project_routing.py
          python hf_space/test_source_project_routing.py
          python hf_space/test_application_capabilities.py
          python hf_space/test_application_delivery_policy.py
          python hf_space/test_implementation_completeness.py
          python hf_space/test_large_generation_budget.py
          python hf_space/test_longform_completion.py
          python hf_space/test_longform_engine_completion.py
          python hf_space/test_large_prompt_boundary.py
          python hf_space/test_fresh_web_project_wording.py
          python hf_space/test_generation_completion_budget.py
          python hf_space/test_project_archive.py
          python hf_space/test_project_revision_workspace.py
          python hf_space/test_project_revision_validation.py
          python hf_space/test_project_selected_context.py
          python hf_space/test_runtime_capacity.py
          python hf_space/test_response_cognition_v123.py
          python hf_space/test_dual_model_work_v241.py
          python hf_space/test_github_file_intelligence_v288.py
          python hf_space/test_github_repo_view_v247.py
          python hf_space/test_programming_contract_v117.py

      - name: Shared account and active editor boundaries
        run: |
          python -m unittest discover -s hf_space -p 'test_forge*.py' -v
          python hf_space/test_account_profile_store.py
          node --check 'chat/§wyrlz/assets/forge-embed-v1.js'
          node tests/test_forge_embed_frontend.mjs

      - name: Install pinned real Chromium test dependencies
        run: |
          python tests/test_ci_capture_failure.py
          python scripts/ci_capture_failure.py --label "Playwright npm install" -- npm install --prefix "$RUNNER_TEMP/swrlz-download-test" --no-package-lock --ignore-scripts playwright@1.57.0
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            echo "CHROMIUM_PATH=$browser_path" >> "$GITHUB_ENV"
            "$browser_path" --version
          else
            python scripts/ci_capture_failure.py --label "Playwright Chromium install" -- "$RUNNER_TEMP/swrlz-download-test/node_modules/.bin/playwright" install --with-deps chromium
          fi

      - name: Project ZIP download in real Chromium
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/swrlz-download-test/node_modules/playwright/index.mjs" python scripts/ci_capture_failure.py --label "Project ZIP browser checks" -- node tests/test_project_archive_download.mjs

      - name: Canonical embedded Chat desktop and mobile
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/swrlz-download-test/node_modules/playwright/index.mjs" node tests/test_forge_chat_browser.cjs

      - name: Chat update dialog in real Chromium
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/swrlz-download-test/node_modules/playwright/index.mjs" python scripts/ci_capture_failure.py --label "Chat updates browser checks" -- node tests/test_chat_updates.mjs

      - name: v263 Atomic GitHub file rename, identity, consent and conflict tests
        run: |
          python -m py_compile hf_space/github_rename_v263.py hf_space/github_rename_intent_v263.py hf_space/github_rename_receipt_v263.py hf_space/github_connection.py hf_space/station.py
          python hf_space/test_github_rename_v263.py
          python hf_space/test_github_rename_http_v263.py
          node --check 'hf_space/chat/§wyrlz/assets/github-rename-v263.js'
          node --check 'hf_space/chat/§wyrlz/assets/github-rename-receipt-v263.js'
          node tests/test_github_rename_v263.mjs

      - name: v262 General GitHub file creation (source and binary), no-overwrite and approvals
        run: |
          python -m py_compile hf_space/github_general_create_v262.py hf_space/github_create_intent_v262.py hf_space/github_connection.py hf_space/station.py
          python hf_space/test_github_general_create_v262.py
          python hf_space/test_github_general_http_v262.py
          python hf_space/test_github_general_work_summary_v262.py
          node --check 'hf_space/chat/§wyrlz/assets/github-general-create-v262.js'
          node tests/test_github_general_create_v262.mjs

      - name: v261 AI full-width responsive workspace and widget layout
        run: |
          node tests/test_assistant_fullwidth_v261.mjs
          python -m py_compile hf_space/station.py

      - name: v260 GitHub verified work receipt and statistics visualization
        run: |
          python -m py_compile hf_space/github_work_summary_v260.py hf_space/github_sandbox_create_txt.py hf_space/station.py
          python hf_space/test_github_work_summary_v260.py
          node --check 'hf_space/chat/§wyrlz/assets/github-work-summary-v260.js'
          node tests/test_github_work_summary_v260.mjs

      - name: v259 Direct user-authorized harmless test-file Chat action
        run: |
          python -m py_compile hf_space/github_txt_intent_v256.py hf_space/github_sandbox_create_txt.py hf_space/station.py
          python hf_space/test_direct_github_test_txt_v259.py
      - name: v258 Natural GitHub TXT proposal UI and no-write-before-confirm acceptance
        run: |
          node --check 'hf_space/chat/§wyrlz/assets/github-chat-create-txt-v258.js'
          node tests/test_github_chat_create_txt_v258.mjs
          python -m py_compile hf_space/station.py hf_space/github_connection.py

      - name: v257 GitHub existing-OAuth sandbox permission and HTTP acceptance
        run: |
          python -m py_compile hf_space/github_connection.py hf_space/github_sandbox_create_txt.py hf_space/github_txt_intent_v256.py hf_space/station.py
          python hf_space/test_github_staged_read_v221.py
          python hf_space/test_github_sandbox_create_txt_v257.py
          python hf_space/test_github_txt_intent_v257.py
          python hf_space/test_github_sandbox_live_v257.py
          node --check 'hf_space/chat/§wyrlz/assets/github-sandbox-create-txt-v257.js'
      - name: v244 Stage-1 help and pinned-startup-links regression
        run: |
          python -m py_compile hf_space/github_connection.py hf_space/test_github_info_help_v244.py
          python hf_space/test_github_info_help_v244.py
      - name: v245 mobile guide presentation and source-fidelity regression
        run: |
          node --check 'chat/§wyrlz/assets/source-guides-v245.js'
          node tests/test_source_guide_cards_v245.mjs
      - name: v246 Copy original source fidelity regression
        run: node tests/test_source_copy_v246.mjs
      - name: v247 GitHub natural-language file-view routing regression
        run: |
          python -m py_compile hf_space/brain_programming.py hf_space/github_read_inference_v235.py hf_space/test_github_repo_view_v247.py
          python hf_space/test_github_repo_view_v247.py
      - name: v248 mobile Chat width and clean HF composer regression
        run: |
          python -m py_compile scripts/prepare_hf_space.py tests/test_chat_mobile_shell_v248.py
          python tests/test_chat_mobile_shell_v248.py
      - name: v292 IME-safe mobile composer and keyboard drawer regression
        run: node tests/test_chat_keyboard_ime_v292.mjs
      - name: v294 Desktop Dragon Den first-conversation card and mobile-safe width
        run: node tests/test_chat_desktop_welcome_v294.mjs
      - name: v253 verified-source context card and darker glass presentation
        run: node tests/test_chat_source_context_glass_v253.mjs
      - name: Report scope
        run: echo "Offline checks only. Model reconstruction, inference, HF Space and Chat parity remain unverified."
