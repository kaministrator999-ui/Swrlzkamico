name: HF Candidate Offline Validation
on:
  push:
    branches:
      - feature/version-literacy-content-layout-v199
      - feature/grounded-version-recall-v201
      - feature/google-chatgpt-archive-import-v202
      - feature/chatgpt-archive-sidebar-v204
      - feature/chatgpt-account-memory-v205
      - feature/private-history-search-v206
      - feature/private-history-toolkit-v207
      - feature/private-account-facts-v208
  pull_request:
    paths:
      - 'hf_space/**'
      - 'scripts/prepare_hf_space.py'
      - 'chat/§wyrlz/assets/github-explorer-v223.js'
      - 'tests/test_github_directory_parser_v224.mjs'
      - 'tests/test_github_preview_persistence_v227.mjs'
      - 'tests/test_github_source_report_mobile_v232.mjs'
      - 'tests/test_hf_candidate.py'
      - 'tests/test_archive_grounded_lyric_craft_v182.py'
      - 'training/lyrics/**'
      - '.github/workflows/hf-candidate-validation.yml'
      - '.github/workflows/manual-hf-space.yml'
      - 'accepted_runtime/lalm/**'
      - 'swyrlz/**'
      - 'lalm§wyrlz.transport.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage canonical candidate
        env:
          SWRLZ_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/prepare_hf_space.py && python scripts/prepare_hf_space.py --check
      - name: Install bridge test dependencies
        run: python -m pip install "fastapi>=0.115,<1" "httpx>=0.27,<1"
      - name: Validate lyric ocean v2 scoped craft contracts
        run: |
          python -m py_compile hf_space/lyric_craft_school.py hf_space/lfm2_700m_engine.py
          python tests/test_archive_grounded_lyric_craft_v182.py
      - name: Check syntax and contracts
        run: |
          python -m py_compile hf_space/chatgpt_archive.py hf_space/chatgpt_account_memory.py hf_space/personal_history_lookup.py hf_space/personal_history_query_v207.py hf_space/private_account_facts_v208.py hf_space/test_private_account_facts_v208.py hf_space/app.py hf_space/station.py hf_space/model_router.py hf_space/brain_programming.py hf_space/accepted_runtime/lalm/r39_engine.py hf_space/swyrlz/backend.py hf_space/swyrlz/r39_inference.py
          python -m unittest discover -s tests -p test_hf_candidate.py -v
          python hf_space/test_github_explorer_v223.py
          python hf_space/test_github_report_v226.py
          python hf_space/test_github_thread_routing_v229.py
          python hf_space/test_repository_project_status_v233.py
          python hf_space/test_source_answer_articulation_v230.py
          python hf_space/test_chatgpt_archive_import_v202.py
          python hf_space/test_chatgpt_account_memory_v205.py
          python hf_space/test_personal_history_lookup_v206.py
          python hf_space/test_personal_history_toolkit_v207.py
          python hf_space/test_private_account_facts_v208.py
          node --check 'chat/§wyrlz/assets/chatgpt-archive-import-v1.js'
          node --check 'chat/§wyrlz/assets/chatgpt-archive-sidebar-v204.js'
          node --check 'chat/§wyrlz/assets/github-explorer-v223.js'
          node tests/test_github_directory_parser_v224.mjs
          node tests/test_github_preview_persistence_v227.mjs
          node tests/test_github_source_report_mobile_v232.mjs
          node tests/test_chatgpt_archive_sidebar_v204.mjs
      - name: v243 GitHub startup concurrency and source-safety regression
        run: |
          python -m pip install 'requests>=2.32,<3' 'cryptography>=43,<47'
          python -m py_compile hf_space/github_connection.py hf_space/test_github_start_parallel_v243.py
          python hf_space/test_github_start_parallel_v243.py
      - name: v244 Stage-1 help and pinned-startup-links regression
        run: |
          python -m py_compile hf_space/github_connection.py hf_space/test_github_info_help_v244.py
          python hf_space/test_github_info_help_v244.py
      - name: v245 mobile guide presentation and source-fidelity regression
        run: |
          node --check 'chat/§wyrlz/assets/source-guides-v245.js'
          node tests/test_source_guide_cards_v245.mjs
      - name: v246 Copy original source fidelity regression
        run: node tests/test_source_copy_v246.mjs
      - name: v247 GitHub natural-language file-view routing regression
        run: |
          python -m py_compile hf_space/brain_programming.py hf_space/github_read_inference_v235.py hf_space/test_github_repo_view_v247.py
          python hf_space/test_github_repo_view_v247.py
      - name: Report scope
        run: echo "Offline checks only. Model reconstruction, inference, HF Space and Chat parity remain unverified."
