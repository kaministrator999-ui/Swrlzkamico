name: "§C brief explanation output cap preflight"
on:
  pull_request:
    paths:
      - "scripts/hf_chat_short_prose_budget_v1.py"
      - ".github/workflows/hf-chat-short-prose-budget-preflight.yml"
      - ".github/workflows/hf-chat-short-prose-budget-release.yml"
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Compile exact source patcher
        run: python -m py_compile scripts/hf_chat_short_prose_budget_v1.py
      - run: python -m pip install --quiet 'huggingface_hub>=0.34,<2'
      - name: Read-only current HF source preflight
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u scripts/hf_chat_short_prose_budget_v1.py inspect
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sc-short-prose-preflight-${{ github.run_id }}
          path: reports/short-explanation-budget-v1/
          retention-days: 7
          if-no-files-found: warn
