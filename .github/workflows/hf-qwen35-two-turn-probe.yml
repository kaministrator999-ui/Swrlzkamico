name: §C measure follow-up latency on existing 9B
on:
  push:
    branches: [tune/chat-qwen35-conversation-profile-v4-20261113]
    paths:
      - "scripts/probe_chat_qwen35_two_turns.py"
      - ".github/workflows/hf-qwen35-two-turn-probe.yml"
permissions:
  contents: read
jobs:
  two-turn:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Measure anonymous conversational continuation, no model change
        run: |
          python -m py_compile scripts/probe_chat_qwen35_two_turns.py
          python -u scripts/probe_chat_qwen35_two_turns.py
