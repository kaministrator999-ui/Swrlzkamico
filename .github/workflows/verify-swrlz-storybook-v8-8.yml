name: Validate §E v11.5 native starter and animation studio

on:
  push:
    branches: [main]
    paths: &anime_paths
      - ".github/workflows/verify-swrlz-storybook-v8-8.yml"
      - "projects/swrlz-forge-moba/source-manifest.json"
      - "projects/swrlz-forge-moba/tests/model_atelier_playwright.mjs"
      - "projects/swrlz-forge-moba/tests/model_atelier_package.py"
      - "projects/swrlz-forge-moba/scenes/model-atelier-prism-jester.swyrl.json"
      - "projects/swrlz-forge-moba/patches/v11_3_model_atelier.py"
      - "projects/swrlz-forge-moba/patches/v11_4_prism_ferret_fidelity.py"
      - "projects/swrlz-forge-moba/runtime/model_atelier_organic_v11_4.js"
      - "projects/swrlz-forge-moba/scenes/model-atelier-prism-jester-ferret-v11-4.swyrl.json"
      - "projects/swrlz-forge-moba/tests/prism_ferret_fidelity_package.py"
      - "projects/swrlz-forge-moba/scenes/ghosts-in-different-forms-ep01-performance.swyrl.json"
      - "projects/swrlz-forge-moba/tests/episode_performance_playwright.mjs"
      - "projects/swrlz-forge-moba/tests/episode_performance_package.py"
      - "projects/swrlz-forge-moba/patches/v10_0_sheep_tag.py"
      - "projects/swrlz-forge-moba/scenes/sheep-tag-meadow.swyrl.json"
      - "projects/swrlz-forge-moba/tests/sheep_tag_playwright.mjs"
      - "projects/swrlz-forge-moba/patches/v10_1_sheep_tag_archive.py"
      - "projects/swrlz-forge-moba/scenes/sheep-tag-moonbell-archive.swyrl.json"
      - "projects/swrlz-forge-moba/tests/sheep_archive_playwright.mjs"
      - "projects/swrlz-forge-moba/patches/v10_5_sheep_run_recorder.py"
      - "projects/swrlz-forge-moba/patches/v10_6_maul_tower_defense.py"
      - "projects/swrlz-forge-moba/patches/v10_7_classic_maul_map.py"
      - "projects/swrlz-forge-moba/patches/v10_8_maul_batch_placement.py"
      - "projects/swrlz-forge-moba/scenes/maul-frostveil-groups.swyrl.json"
      - "projects/swrlz-forge-moba/scenes/maul-frostveil-flight.swyrl.json"
      - "projects/swrlz-forge-moba/tests/maul_batch_playwright.mjs"
      - "projects/swrlz-forge-moba/tests/maul_batch_cpu.mjs"
      - "projects/swrlz-forge-moba/tests/maul_batch_package.py"
      - "projects/swrlz-forge-moba/scenes/maul-frostveil-classic.swyrl.json"
      - "projects/swrlz-forge-moba/tests/maul_layout_playwright.mjs"
      - "projects/swrlz-forge-moba/tests/maul_layout_cpu.mjs"
      - "projects/swrlz-forge-moba/tests/maul_layout_package.py"
      - "projects/swrlz-forge-moba/scenes/maul-frostveil.swyrl.json"
      - "projects/swrlz-forge-moba/tests/maul_playwright.mjs"
      - "projects/swrlz-forge-moba/tests/maul_cpu.mjs"
      - "projects/swrlz-forge-moba/runtime/sheep_touch_selection.js"
      - "projects/swrlz-forge-moba/runtime/sheep_placement_grid.js"
      - "projects/swrlz-forge-moba/runtime/sheep_touch_offset.js"
      - "projects/swrlz-forge-moba/runtime/sheep_lanes.js"
      - "projects/swrlz-forge-moba/runtime/sheep_run_recorder.js"
      - "projects/swrlz-forge-moba/runtime/sheep_run_review.js"
      - "projects/swrlz-forge-moba/tests/sheep_run_playwright.mjs"
      - "projects/swrlz-forge-moba/tests/sheep_touch_playwright.mjs"
      - "projects/swrlz-forge-moba/patches/**"
      - "projects/swrlz-forge-moba/runtime/**"
      - "projects/swrlz-forge-moba/tests/episode_transport_playwright.mjs"
      - "projects/swrlz-forge-moba/assets/anime/**"
      - "projects/swrlz-forge-moba/build_space.py"
      - "projects/swrlz-forge-moba/scenes/ghosts-in-different-forms-ep01*.swyrl.json"
      - "projects/swrlz-forge-moba/episodes/ghosts-in-different-forms-ep01.html"
      - "projects/swrlz-forge-moba/tests/*anime*.mjs"
      - "projects/swrlz-forge-moba/tests/storybook_authoring_playwright.mjs"
      - "projects/swrlz-forge-moba/tests/character_rig_playwright.mjs"
      - "projects/swrlz-forge-moba/tests/depth_theatre_playwright.mjs"
      - "projects/swrlz-forge-moba/tests/character_alignment_playwright.mjs"
      - "projects/swrlz-forge-moba/tests/socket_emergence_playwright.mjs"
      - "projects/swrlz-forge-moba/tests/character_relief_playwright.mjs"
  pull_request:
    branches: [main]
    paths: *anime_paths
  workflow_dispatch:
permissions:
  contents: read
# Supersede obsolete validation for the same branch or PR without cancelling release deployment.
concurrency:
  group: swyrl-engine-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    name: browser (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        suite:
          - native_anime
          - storybook_authoring
          - character_rig
          - depth_theatre
          - character_alignment
          - socket_emergence
          - character_relief
          - episode_transport
          - sheep_tag
          - sheep_archive
          - sheep_touch
          - sheep_run
          - maul
          - maul_layout
          - maul_batch
          - episode_performance
          - model_atelier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independently reconstruct sealed v11.5 source
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,json,runpy
          from pathlib import Path
          root=Path('projects/swrlz-forge-moba')
          manifest=json.loads((root/'source-manifest.json').read_text(encoding='utf-8'))
          mod=runpy.run_path(str(root/'build_space.py'))
          raw=gzip.decompress(base64.b64decode(''.join((root/p).read_text(encoding='utf-8').strip() for p in manifest['chunks'])))
          assert len(raw)==manifest['baseBytes']
          assert hashlib.sha256(raw).hexdigest()==manifest['baseSha256']
          assert len(manifest['patches'])==75
          assert manifest['patches'][-1]=='patches/v11_5_festival_loft_atelier.py'
          source=raw.decode('utf-8')
          for patch in manifest['patches']:
              source=mod['load_patch'](root/patch)(source)
          output=source.encode('utf-8')
          assert len(output)==manifest['finalBytes']
          assert hashlib.sha256(output).hexdigest()==manifest['finalSha256']
          for feature in ('MODEL_ATELIER_V11_3_BEGIN','SWYRL_ENGINE_MODEL_ATELIER','V11_5_FESTIVAL_LOFT_ATELIER','SWYRL_ENGINE_PERFORMANCE','anime-performance-v1','SWYRL_ENGINE_STORY_EFFECTS','anime-story-effects-v1','MAUL_BATCH_CORE','grouped-v1','MAUL_LAYOUT_CORE','classic-v2','SWYRL_ENGINE_MAUL','MAUL_CORE','maul-frostveil','SWYRL_ENGINE_SHEEP_TAG_RUNS','SWYRL_ENGINE_RUNS','stRunAfterTick','stRunInstallUI','stRunViewerMount','swyrl-editor-play-run-v1','stTouchPlacementScreen','stTouchPlacementGround','touchPlacement','SWYRL_ENGINE_SHEEP_TAG','sheep-tag-meadow','sheep-tag-moonbell-archive','swyrl-sheep-tag-map-v1','SWYRL_ENGINE_TRANSPORT','animeCineRewind','animeCineFastForward','SWYRL_ENGINE_STAFF','rigFullStaffStatus','painted-full-v1','assets/anime/kami-full-staff.png','Maker v11.5',
                          'CANONICAL_ANIME_EPISODE_PROJECT','SWYRL_ENGINE_CINEMATIC',
                          'SWYRL_ENGINE_ANIMATION','SWYRL_ENGINE_STORYBOARD','SWYRL_ENGINE_RIG','SWYRL_ENGINE_SCENERY','SWYRL_ENGINE_SOCKETS','SWYRL_ENGINE_EMERGENCE','SWYRL_ENGINE_RELIEF',
                          'anime-rig-sockets-v1','anime-book-emergence-v1','anime-character-relief-v1',
                          'animeCreateCelLayers','animeDirectorInstall','animeMakePaperBook',
                          'animePopupStageSafety','storyEditorInstall','anime-ghosts-ep01',
                          'openAnimeScreening','animeUpdateCinematic','animeUpdateCelLayers',
                          'animeLayerVisible','animeDisposeGroup','animeCleanLayers',
                          'popKamiArt','popSwyrlzArt','ANIME_2D_LAYER_SPECS',
                          'animeMakeCast','animeCineLayers','popLowStageTrim',
                          'animePopSanitize','animePopUp','popupHinge','popUpStatus'):
              assert feature in source, feature
          assert 'data-project-template="anime-ghosts-ep01"' in source
          Path('/tmp/swyrl-anime-engine.html').write_bytes(output)
          begin=source.index('<script type="module">')+len('<script type="module">')
          Path('/tmp/swyrl-anime-engine.mjs').write_text(source[begin:source.rindex('</script>')],encoding='utf-8')
          print('ENGINE_EXPECTED_BYTES='+str(len(output)))
          print('ENGINE_EXPECTED_SHA256='+hashlib.sha256(output).hexdigest())
          print('CANDIDATE_75_PATCH_RECONSTRUCT_OK')
          PY
          node --check /tmp/swyrl-anime-engine.mjs
          python -m compileall -q projects/swrlz-forge-moba/patches projects/swrlz-forge-moba/build_space.py
      - name: Verify complete v11.5 package against source and manifest
        run: |
          python projects/swrlz-forge-moba/build_space.py --output /tmp/storybook-test
          python projects/swrlz-forge-moba/tests/model_atelier_package.py --package /tmp/storybook-test
          python projects/swrlz-forge-moba/tests/prism_ferret_fidelity_package.py --package /tmp/storybook-test
          cmp /tmp/swyrl-anime-engine.html /tmp/storybook-test/index.html
          python projects/swrlz-forge-moba/tests/maul_layout_package.py --package /tmp/storybook-test
          python projects/swrlz-forge-moba/tests/maul_batch_package.py --package /tmp/storybook-test
          python projects/swrlz-forge-moba/tests/episode_performance_package.py --package /tmp/storybook-test
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('projects/swrlz-forge-moba')
          out=Path('/tmp/storybook-test')
          manifest=json.loads((root/'source-manifest.json').read_text())
          receipt=json.loads((out/'SOURCE.json').read_text())
          assert receipt['finalBytes']==manifest['finalBytes']
          assert receipt['finalSha256']==manifest['finalSha256']
          assert receipt['patches']==manifest['patches']
          assert len(receipt['patches'])==75
          assert receipt['patches'][-1]=='patches/v11_5_festival_loft_atelier.py'
          expected={'episodes/ghosts-in-different-forms-ep01.html',
                    'scenes/ghosts-in-different-forms-ep01.swyrl.json',
                    'scenes/ghosts-in-different-forms-ep01-storybook.swyrl.json',
                    'scenes/ghosts-in-different-forms-ep01-rigged.swyrl.json',
                    'scenes/ghosts-in-different-forms-ep01-depth.swyrl.json',
                    'scenes/ghosts-in-different-forms-ep01-positioned.swyrl.json',
                    'scenes/ghosts-in-different-forms-ep01-sockets.swyrl.json',
                    'scenes/ghosts-in-different-forms-ep01-staff-grip.swyrl.json',
                    'scenes/ghosts-in-different-forms-ep01-natural-grip.swyrl.json',
                    'scenes/ghosts-in-different-forms-ep01-full-staff.swyrl.json',
                    'scenes/ghosts-in-different-forms-ep01-performance.swyrl.json',
                    'scenes/sheep-tag-meadow.swyrl.json',
                    'scenes/sheep-tag-moonbell-archive.swyrl.json',
                    'scenes/maul-frostveil.swyrl.json',
                    'scenes/maul-frostveil-classic.swyrl.json',
                    'scenes/maul-frostveil-groups.swyrl.json',
                    'scenes/maul-frostveil-flight.swyrl.json',
                    'scenes/model-atelier-prism-jester.swyrl.json','scenes/model-atelier-prism-jester-ferret-v11-4.swyrl.json','scenes/model-atelier-prism-jester-festival-v11-5.swyrl.json'}
          expected.update('assets/anime/'+name+'.png' for name in (
              'kami','swyrlz','cathedral','workshop','foreground','kami-rig',
              'swyrlz-rig','scenery-parts','kami-grip-layers',
              'mage-faces-painted','kami-full-staff'))
          assert {p.relative_to(root).as_posix() for p in (root/'assets/anime').glob('*.png')}=={p for p in expected if p.endswith('.png')}
          assert set(receipt['assets'])==expected
          assert len(receipt['assets'])==31
          maul=json.loads((out/'scenes/maul-frostveil.swyrl.json').read_text())
          assert maul['project']['canonicalId']=='maul-frostveil'
          assert maul['project']['kind']=='maul'
          assert maul['project']['maul']['waves']==30
          maul_actors=maul['scene']['actors']
          assert len({actor['id'] for actor in maul_actors})==len(maul_actors)
          for kind in ('maul-spawn','maul-gate','maul-builder'):
              assert sum(actor['type']==kind for actor in maul_actors)==9,kind
          assert sum(actor['type']=='maul-sector' for actor in maul_actors)>=9
          assert sum(actor['type']=='maul-exit' for actor in maul_actors)==1
          assert all(actor['baked'] and actor['visible'] for actor in maul_actors)
          maul_layers=maul['editor']['layers']
          assert len(maul_layers)==6 and len({layer['id'] for layer in maul_layers})==6
          assert all(any(layer['id'] in actor['editorLayerIds'] for actor in maul_actors) for layer in maul_layers)
          assert all(any(layer['id'] in actor['editorLayerIds'] for layer in maul_layers) for actor in maul_actors)
          meadow=json.loads((out/'scenes/sheep-tag-meadow.swyrl.json').read_text())
          assert meadow['project']['canonicalId']=='sheep-tag-meadow'
          assert meadow['project']['kind']=='sheep-tag'
          assert meadow['project']['sheepTag']=={'duration':1200,'headstart':30,'bounds':40,'startGold':80,'role':'sheep'}
          meadow_actors=meadow['scene']['actors']
          assert len(meadow_actors)==66
          for kind,count in (('st-sheep',6),('st-wolf',2),('st-pen',1),('st-meadow',1),('st-shop',4)):
              assert sum(actor['type']==kind for actor in meadow_actors)==count,kind
          assert all(actor['baked'] for actor in meadow_actors)
          meadow_layers=meadow['editor']['layers']
          assert len(meadow_layers)==4
          assert all(any(layer['id'] in actor['editorLayerIds'] for actor in meadow_actors) for layer in meadow_layers)
          assert len({actor['id'] for actor in meadow_actors})==66
          archive=json.loads((out/'scenes/sheep-tag-moonbell-archive.swyrl.json').read_text())
          assert archive['project']['canonicalId']=='sheep-tag-meadow'
          assert archive['project']['kind']=='sheep-tag'
          archive_rules=archive['project']['sheepTag']
          required_rules={'duration','headstart','bounds','startGold','role','preset','buildSnap',
                          'sheepSpeed','wolfSpeed','wolfDamage','attackInterval','farmHp','incomeHp',
                          'fortHp','sheepRadius','wolfRadius','houseLimit','fogMode','sheepVision',
                          'wolfVision','rescueProtection','rescueHold','thorns','totems','elevated',
                          'split','events','thornChance','thornDuration','thornCooldown','scentInterval',
                          'densityRadius','totemRadius','fadeSeconds','revealSeconds','totemLimit',
                          'totemCooldown','wallCost','rampCost','wallHp','rampHp','wallHeight',
                          'wolvesUseRamps','splitUnlock','progressionSeconds','rescueXp',
                          'splitCooldown','splitLifetime','eventInterval','eventWarning',
                          'eventDuration','eventPool','seed','permittedStructures'}
          assert required_rules.issubset(archive_rules),required_rules-set(archive_rules)
          for key,value in {'preset':'archive','duration':1200,'headstart':30,'bounds':40,
                            'startGold':80,'role':'sheep','buildSnap':0.15,'houseLimit':28,
                            'fogMode':'team','thorns':True,'totems':True,'elevated':True,
                            'split':True,'events':False,'wolvesUseRamps':True,'seed':0}.items():
              assert archive_rules[key]==value,key
          assert all(type(archive_rules[key]) is bool for key in ('thorns','totems','elevated','split','events','wolvesUseRamps'))
          assert archive_rules['totemLimit'] in ('once','cooldown')
          assert archive_rules['eventPool']==['pressure','fog','supply']
          assert archive_rules['permittedStructures']==['st-farm','st-income','st-fort','st-wall','st-ramp']
          numeric_rules=required_rules-{'role','preset','fogMode','thorns','totems','elevated',
                                        'split','events','totemLimit','wolvesUseRamps','eventPool','permittedStructures'}
          assert all(type(archive_rules[key]) in (int,float) and
                     archive_rules[key]==archive_rules[key] and abs(archive_rules[key])<1e9
                     for key in numeric_rules)
          archive_actors=archive['scene']['actors']
          assert len(archive_actors)==92
          assert len({actor['id'] for actor in archive_actors})==92
          for kind,count in (('st-sheep',8),('st-wolf',3),('st-pen',1),('st-meadow',1),
                             ('st-shop',4),('st-thorn',12),('st-zone',2)):
              assert sum(actor['type']==kind for actor in archive_actors)==count,kind
          assert sum(actor['type'] in ('st-road','st-grass','st-earth') for actor in archive_actors)==9
          assert not any(actor['type'] in ('st-farm','st-income','st-fort','st-wall','st-ramp','st-totem') for actor in archive_actors)
          assert all(actor['baked'] and actor['visible'] for actor in archive_actors)
          archive_layers=archive['editor']['layers']
          assert len(archive_layers)==6
          assert len({layer['id'] for layer in archive_layers})==6
          assert all(any(layer['id'] in actor['editorLayerIds'] for actor in archive_actors)
                     for layer in archive_layers)
          assert all(any(layer['id'] in actor['editorLayerIds'] for layer in archive_layers)
                     for actor in archive_actors)
          for asset,data in receipt['assets'].items():
              packed=(out/asset).read_bytes()
              assert (root/asset).read_bytes()==packed, asset
              assert len(packed)==data['bytes'], asset
              assert hashlib.sha256(packed).hexdigest()==data['sha256'], asset
          print('PACKAGING_75_PATCHES_AND_ALL_ASSETS_VERIFIED')
          PY
      - name: Check browser acceptance suite syntax
        run: |
          node --check projects/swrlz-forge-moba/tests/native_anime_playwright.mjs
          node --check projects/swrlz-forge-moba/tests/storybook_authoring_playwright.mjs
          node --check projects/swrlz-forge-moba/tests/character_rig_playwright.mjs
          node --check projects/swrlz-forge-moba/tests/depth_theatre_playwright.mjs
          node --check projects/swrlz-forge-moba/tests/character_alignment_playwright.mjs
          node --check projects/swrlz-forge-moba/tests/socket_emergence_playwright.mjs
          node --check projects/swrlz-forge-moba/tests/character_relief_playwright.mjs
          node --check projects/swrlz-forge-moba/tests/episode_transport_playwright.mjs
          node --check projects/swrlz-forge-moba/tests/sheep_tag_playwright.mjs
          node --check projects/swrlz-forge-moba/tests/sheep_archive_playwright.mjs
          node --check projects/swrlz-forge-moba/tests/sheep_touch_playwright.mjs
          node --check projects/swrlz-forge-moba/runtime/sheep_touch_selection.js
          node --check projects/swrlz-forge-moba/runtime/sheep_placement_grid.js
          node --check projects/swrlz-forge-moba/runtime/sheep_touch_offset.js
          node --check projects/swrlz-forge-moba/runtime/sheep_lanes.js
          node --check projects/swrlz-forge-moba/runtime/sheep_run_recorder.js
          node --check projects/swrlz-forge-moba/runtime/sheep_run_review.js
          node --check projects/swrlz-forge-moba/tests/sheep_run_playwright.mjs
          node --check projects/swrlz-forge-moba/runtime/maul_core.js
          node --check projects/swrlz-forge-moba/runtime/maul_ui.js
          node --check projects/swrlz-forge-moba/tests/maul_playwright.mjs
          node --check projects/swrlz-forge-moba/tests/maul_cpu.mjs
          node --check projects/swrlz-forge-moba/runtime/maul_layout_core.js
          node --check projects/swrlz-forge-moba/runtime/maul_layout_visuals.js
          node --check projects/swrlz-forge-moba/runtime/maul_layout_integration.js
          node --check projects/swrlz-forge-moba/tests/maul_layout_playwright.mjs
          node --check projects/swrlz-forge-moba/tests/maul_layout_cpu.mjs
          node --check projects/swrlz-forge-moba/runtime/maul_batch_core.js
          node --check projects/swrlz-forge-moba/runtime/maul_batch_integration.js
          node --check projects/swrlz-forge-moba/runtime/anime_performance_model.js
          node --check projects/swrlz-forge-moba/runtime/anime_performance_editor.js
          node --check projects/swrlz-forge-moba/runtime/anime_story_effects.js
          node --check projects/swrlz-forge-moba/runtime/anime_story_effects_editor.js
          node --check projects/swrlz-forge-moba/tests/maul_batch_playwright.mjs
          node --check projects/swrlz-forge-moba/tests/episode_performance_playwright.mjs
          node --check projects/swrlz-forge-moba/runtime/model_atelier.js
          node --check projects/swrlz-forge-moba/runtime/model_atelier_organic_v11_4.js
          node --check projects/swrlz-forge-moba/tests/model_atelier_playwright.mjs
          node --check projects/swrlz-forge-moba/tests/maul_batch_cpu.mjs
      - name: Install Chromium and Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test ${{ matrix.suite }} acceptance in desktop and phone layouts
        env:
          SWYRL_ANIME_TEST_URL: http://127.0.0.1:8765
          SWYRL_ANIME_SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory /tmp/storybook-test >/tmp/browser-storybook-http.log 2>&1 &
          SWYRL_TEST_SERVER_PID=$!
          trap 'kill "$SWYRL_TEST_SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..10}; do
            if curl -fsS http://127.0.0.1:8765/SOURCE.json >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/SOURCE.json >/dev/null
          node "projects/swrlz-forge-moba/tests/${SWYRL_ANIME_SUITE}_playwright.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v10-8-${{ matrix.suite }}-browser-views
          path: |
            native-anime-*.png
            storybook-acceptance/
            character-rig-acceptance/
            depth-theatre-acceptance/
            character-alignment-acceptance/
            socket-emergence-acceptance/
            character-relief-acceptance/
            episode-transport-acceptance/
            sheep-tag-acceptance/
            sheep-archive-acceptance/
            sheep-touch-acceptance/
            sheep-run-acceptance/
            maul-acceptance/
            maul-layout-acceptance/
            maul-batch-acceptance/
            episode-performance-acceptance/
            model-atelier-acceptance/
          retention-days: 5
