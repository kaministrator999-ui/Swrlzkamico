name: Validate §E v10.0 native starter and animation studio

on:
  push:
    branches: [main]
    paths: &anime_paths
      - ".github/workflows/verify-swrlz-storybook-v8-8.yml"
      - "projects/swrlz-forge-moba/source-manifest.json"
      - "projects/swrlz-forge-moba/patches/v10_0_sheep_tag.py"
      - "projects/swrlz-forge-moba/scenes/sheep-tag-meadow.swyrl.json"
      - "projects/swrlz-forge-moba/tests/sheep_tag_playwright.mjs"
      - "projects/swrlz-forge-moba/patches/**"
      - "projects/swrlz-forge-moba/runtime/**"
      - "projects/swrlz-forge-moba/tests/episode_transport_playwright.mjs"
      - "projects/swrlz-forge-moba/assets/anime/**"
      - "projects/swrlz-forge-moba/build_space.py"
      - "projects/swrlz-forge-moba/scenes/ghosts-in-different-forms-ep01*.swyrl.json"
      - "projects/swrlz-forge-moba/episodes/ghosts-in-different-forms-ep01.html"
      - "projects/swrlz-forge-moba/tests/*anime*.mjs"
      - "projects/swrlz-forge-moba/tests/storybook_authoring_playwright.mjs"
      - "projects/swrlz-forge-moba/tests/character_rig_playwright.mjs"
      - "projects/swrlz-forge-moba/tests/depth_theatre_playwright.mjs"
      - "projects/swrlz-forge-moba/tests/character_alignment_playwright.mjs"
      - "projects/swrlz-forge-moba/tests/socket_emergence_playwright.mjs"
      - "projects/swrlz-forge-moba/tests/character_relief_playwright.mjs"
  pull_request:
    branches: [main]
    paths: *anime_paths
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    name: browser (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        suite:
          - native_anime
          - storybook_authoring
          - character_rig
          - depth_theatre
          - character_alignment
          - socket_emergence
          - character_relief
          - episode_transport
          - sheep_tag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independently reconstruct sealed v10.0 source
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,json,runpy
          from pathlib import Path
          root=Path('projects/swrlz-forge-moba')
          manifest=json.loads((root/'source-manifest.json').read_text(encoding='utf-8'))
          mod=runpy.run_path(str(root/'build_space.py'))
          raw=gzip.decompress(base64.b64decode(''.join((root/p).read_text(encoding='utf-8').strip() for p in manifest['chunks'])))
          assert len(raw)==manifest['baseBytes']
          assert hashlib.sha256(raw).hexdigest()==manifest['baseSha256']
          assert len(manifest['patches'])==60
          assert manifest['patches'][-1]=='patches/v10_0_sheep_tag.py'
          source=raw.decode('utf-8')
          for patch in manifest['patches']:
              source=mod['load_patch'](root/patch)(source)
          output=source.encode('utf-8')
          assert len(output)==manifest['finalBytes']
          assert hashlib.sha256(output).hexdigest()==manifest['finalSha256']
          for feature in ('V10_0_SHEEP_TAG_STARTER','SWYRL_ENGINE_SHEEP_TAG','sheep-tag-meadow','SWYRL_ENGINE_TRANSPORT','animeCineRewind','animeCineFastForward','SWYRL_ENGINE_STAFF','rigFullStaffStatus','painted-full-v1','assets/anime/kami-full-staff.png','Maker v10.0',
                          'CANONICAL_ANIME_EPISODE_PROJECT','SWYRL_ENGINE_CINEMATIC',
                          'SWYRL_ENGINE_ANIMATION','SWYRL_ENGINE_STORYBOARD','SWYRL_ENGINE_RIG','SWYRL_ENGINE_SCENERY','SWYRL_ENGINE_SOCKETS','SWYRL_ENGINE_EMERGENCE','SWYRL_ENGINE_RELIEF',
                          'anime-rig-sockets-v1','anime-book-emergence-v1','anime-character-relief-v1',
                          'animeCreateCelLayers','animeDirectorInstall','animeMakePaperBook',
                          'animePopupStageSafety','storyEditorInstall','anime-ghosts-ep01',
                          'openAnimeScreening','animeUpdateCinematic','animeUpdateCelLayers',
                          'animeLayerVisible','animeDisposeGroup','animeCleanLayers',
                          'popKamiArt','popSwyrlzArt','ANIME_2D_LAYER_SPECS',
                          'animeMakeCast','animeCineLayers','popLowStageTrim',
                          'animePopSanitize','animePopUp','popupHinge','popUpStatus'):
              assert feature in source, feature
          assert 'data-project-template="anime-ghosts-ep01"' in source
          Path('/tmp/swyrl-anime-engine.html').write_bytes(output)
          begin=source.index('<script type="module">')+len('<script type="module">')
          Path('/tmp/swyrl-anime-engine.mjs').write_text(source[begin:source.rindex('</script>')],encoding='utf-8')
          print('ENGINE_EXPECTED_BYTES='+str(len(output)))
          print('ENGINE_EXPECTED_SHA256='+hashlib.sha256(output).hexdigest())
          print('CANDIDATE_60_PATCH_RECONSTRUCT_OK')
          PY
          node --check /tmp/swyrl-anime-engine.mjs
          python -m compileall -q projects/swrlz-forge-moba/patches projects/swrlz-forge-moba/build_space.py
      - name: Verify complete v10.0 package against source and manifest
        run: |
          python projects/swrlz-forge-moba/build_space.py --output /tmp/storybook-test
          cmp /tmp/swyrl-anime-engine.html /tmp/storybook-test/index.html
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('projects/swrlz-forge-moba')
          out=Path('/tmp/storybook-test')
          manifest=json.loads((root/'source-manifest.json').read_text())
          receipt=json.loads((out/'SOURCE.json').read_text())
          assert receipt['finalBytes']==manifest['finalBytes']
          assert receipt['finalSha256']==manifest['finalSha256']
          assert receipt['patches']==manifest['patches']
          assert len(receipt['patches'])==60
          assert receipt['patches'][-1]=='patches/v10_0_sheep_tag.py'
          expected={'episodes/ghosts-in-different-forms-ep01.html',
                    'scenes/ghosts-in-different-forms-ep01.swyrl.json',
                    'scenes/ghosts-in-different-forms-ep01-storybook.swyrl.json',
                    'scenes/ghosts-in-different-forms-ep01-rigged.swyrl.json',
                    'scenes/ghosts-in-different-forms-ep01-depth.swyrl.json',
                    'scenes/ghosts-in-different-forms-ep01-positioned.swyrl.json',
                    'scenes/ghosts-in-different-forms-ep01-sockets.swyrl.json',
                    'scenes/ghosts-in-different-forms-ep01-staff-grip.swyrl.json',
                    'scenes/ghosts-in-different-forms-ep01-natural-grip.swyrl.json',
                    'scenes/ghosts-in-different-forms-ep01-full-staff.swyrl.json',
                    'scenes/sheep-tag-meadow.swyrl.json'}
          expected.update('assets/anime/'+name+'.png' for name in (
              'kami','swyrlz','cathedral','workshop','foreground','kami-rig',
              'swyrlz-rig','scenery-parts','kami-grip-layers',
              'mage-faces-painted','kami-full-staff'))
          assert {p.relative_to(root).as_posix() for p in (root/'assets/anime').glob('*.png')}=={p for p in expected if p.endswith('.png')}
          assert set(receipt['assets'])==expected
          assert len(receipt['assets'])==22
          meadow=json.loads((out/'scenes/sheep-tag-meadow.swyrl.json').read_text())
          assert meadow['project']['canonicalId']=='sheep-tag-meadow'
          assert meadow['project']['kind']=='sheep-tag'
          assert meadow['project']['sheepTag']=={'duration':1200,'headstart':30,'bounds':40,'startGold':80,'role':'sheep'}
          meadow_actors=meadow['scene']['actors']
          assert len(meadow_actors)==66
          for kind,count in (('st-sheep',6),('st-wolf',2),('st-pen',1),('st-meadow',1),('st-shop',4)):
              assert sum(actor['type']==kind for actor in meadow_actors)==count,kind
          assert all(actor['baked'] for actor in meadow_actors)
          meadow_layers=meadow['editor']['layers']
          assert len(meadow_layers)==4
          assert all(any(layer['id'] in actor['editorLayerIds'] for actor in meadow_actors) for layer in meadow_layers)
          for asset,data in receipt['assets'].items():
              packed=(out/asset).read_bytes()
              assert (root/asset).read_bytes()==packed, asset
              assert len(packed)==data['bytes'], asset
              assert hashlib.sha256(packed).hexdigest()==data['sha256'], asset
          print('PACKAGING_60_PATCHES_AND_ALL_ASSETS_VERIFIED')
          PY
      - name: Check browser acceptance suite syntax
        run: |
          node --check projects/swrlz-forge-moba/tests/native_anime_playwright.mjs
          node --check projects/swrlz-forge-moba/tests/storybook_authoring_playwright.mjs
          node --check projects/swrlz-forge-moba/tests/character_rig_playwright.mjs
          node --check projects/swrlz-forge-moba/tests/depth_theatre_playwright.mjs
          node --check projects/swrlz-forge-moba/tests/character_alignment_playwright.mjs
          node --check projects/swrlz-forge-moba/tests/socket_emergence_playwright.mjs
          node --check projects/swrlz-forge-moba/tests/character_relief_playwright.mjs
          node --check projects/swrlz-forge-moba/tests/episode_transport_playwright.mjs
          node --check projects/swrlz-forge-moba/tests/sheep_tag_playwright.mjs
      - name: Install Chromium and Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test ${{ matrix.suite }} acceptance in desktop and phone layouts
        env:
          SWYRL_ANIME_TEST_URL: http://127.0.0.1:8765
          SWYRL_ANIME_SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory /tmp/storybook-test >/tmp/browser-storybook-http.log 2>&1 &
          SWYRL_TEST_SERVER_PID=$!
          trap 'kill "$SWYRL_TEST_SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..10}; do
            if curl -fsS http://127.0.0.1:8765/SOURCE.json >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/SOURCE.json >/dev/null
          node "projects/swrlz-forge-moba/tests/${SWYRL_ANIME_SUITE}_playwright.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v10-0-${{ matrix.suite }}-browser-views
          path: |
            native-anime-*.png
            storybook-acceptance/
            character-rig-acceptance/
            depth-theatre-acceptance/
            character-alignment-acceptance/
            socket-emergence-acceptance/
            character-relief-acceptance/
            episode-transport-acceptance/
            sheep-tag-acceptance/
          retention-days: 5
