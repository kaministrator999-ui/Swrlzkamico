name: Audit current §C source-limit and guarded coding continuation (read-only)
on:
  push:
    branches: [main]
    paths: [".github/workflows/hf-coder-output-limit-audit.yml"]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - run: python -m pip install 'huggingface_hub>=0.34,<2'
      - run: |
          python - <<'PY'
          import json,ast
          from pathlib import Path
          from huggingface_hub import HfApi,hf_hub_download
          space="kamiloki/Swyrlz";r=HfApi().repo_info(space,repo_type="space").sha
          print("OUTPUT_AUDIT_REV",r,flush=True)
          for name,ranges in {
              "qwen_coder_engine.py":[(8,30),(815,905),(940,1035)],
              "programming_telemetry.py":[(1,46)],
              "programming_repair_context.py":[(180,245)],
              "test_generation_completion_budget.py":[(1,180)]
          }.items():
              try:l=Path(hf_hub_download(space,name,repo_type="space",revision=r)).read_text().splitlines()
              except Exception as exc:print("OUTPUT_AUDIT_UNAVAILABLE",name,str(exc)[:80]);continue
              print("OUTPUT_AUDIT_FILE",name,len(l),flush=True)
              for a,b in ranges:
                  print("OUTPUT_AUDIT_RANGE",json.dumps({"file":name,"start":a,
                      "lines":[str(i+1)+" "+l[i] for i in range(a-1,min(b,len(l)))]},
                      ensure_ascii=False),flush=True)
          print("OUTPUT_AUDIT_DONE",flush=True)
          PY
