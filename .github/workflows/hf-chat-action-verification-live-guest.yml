name: Read-only §C action-check live guest acceptance
on:
  push:
    branches: [main]
    paths:
      - scripts/probe_hf_action_verification_live_v1.py
      - .github/workflows/hf-chat-action-verification-live-guest.yml
permissions:
  contents: read
concurrency:
  group: swrlz-action-verification-guest-qa
  cancel-in-progress: true
jobs:
  guest:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only Hugging Face probe dependencies
        run: python -m pip install -q 'huggingface_hub>=0.34,<2' requests
      - name: Compile synthetic guest acceptance
        run: python -m py_compile scripts/probe_hf_action_verification_live_v1.py
      - name: Verify exact deployed runtime and anonymous advice response
        timeout-minutes: 19
        run: python -u scripts/probe_hf_action_verification_live_v1.py
