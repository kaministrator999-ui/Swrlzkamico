name: Read-only §C 9B output limit and work narration source audit
on:
  push:
    branches: [main]
    paths: [".github/workflows/hf-chat-output-limit-audit.yml"]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - run: python -m pip install --quiet "huggingface_hub>=0.34,<2"
      - name: Inspect exact live code without mutation
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          from huggingface_hub import HfApi,hf_hub_download
          S="kamiloki/Swyrlz";api=HfApi();r=api.repo_info(S,repo_type="space").sha
          print("SWRLZ_LIMIT_REV",r,flush=True)
          names=["lfm2_700m_engine.py","station.py","qwen_coder_engine.py","chat/§wyrlz/index.html"]
          patterns={
            "lfm2_700m_engine.py":r"OUTPUTTOKENLIMIT|OUTPUT_TOKEN|output.token|finish_reason|finishReason|RESEARCH_READY|RESEARCH_UNAVAILABLE|max_tokens|response_tokens|generate_events|onlineContext|completion_validation|yield \{\"type\":\"FAILED\"",
            "station.py":r"OUTPUTTOKENLIMIT|OUTPUT_TOKEN|finish_reason|finishReason|CANDIDATE_.*REJECT|FAILED|RESEARCH_READY|onlineContext|RESPONSE_COGNITION|for event in|for event of",
            "qwen_coder_engine.py":r"OUTPUTTOKENLIMIT|output.token|finish_reason|finishReason|completion_validation|REPAIR_BUDGET|MAX_OUTPUT|OUTPUT_TOKENS",
            "chat/§wyrlz/index.html":r"renderActivityTimelineV238|function activity|activityNarr|progress_timeline|station-activity-title|OUTPUTTOKENLIMIT|status\.reason|status\.phase",
          }
          for name in names:
            lines=Path(hf_hub_download(S,name,repo_type="space",revision=r)).read_text().splitlines()
            hits=[i for i,v in enumerate(lines) if re.search(patterns[name],v,re.I)]
            print("SWRLZ_LIMIT_HITS",json.dumps({"file":name,"totalLines":len(lines),"hitCount":len(hits),
              "hits":[{"line":i+1,"text":lines[i].strip()[:150]} for i in hits[:90]]}),flush=True)
            chunks=[]
            for i in hits:
              start=max(0,i-5);end=min(len(lines),i+9)
              if chunks and start<=chunks[-1][1]:chunks[-1][1]=max(chunks[-1][1],end)
              else:chunks.append([start,end])
            for a,b in chunks[:28]:
              print("SWRLZ_LIMIT_CONTEXT",json.dumps({"file":name,"start":a+1,
                "lines":[str(j+1)+" "+lines[j][:280] for j in range(a,min(b,a+110))]}),flush=True)
          PY