name: §E v11.222 hosted source read-only check
on:
  push:
    branches:
      - feat/se-v11-222-sheep-animations-particles
permissions:
  contents: read
jobs:
  live-receipt:
    runs-on: ubuntu-latest
    steps:
      - name: Check published Space SOURCE.json and served HTML digest
        run: |
          python - <<'PY'
          import hashlib,json,time,urllib.request
          from urllib.error import URLError,HTTPError
          base='https://kamiloki-swrlz-forge-moba.static.hf.space/'
          expected='27876c460d3c824f23d6628d3207693eb0d2194db9091a72c743122a95e17a35'
          for attempt in range(1,5):
              try:
                  with urllib.request.urlopen(base+'SOURCE.json',timeout=30) as r:
                      src=json.load(r)
                  with urllib.request.urlopen(base+'index.html',timeout=45) as r:
                      raw=r.read()
                  observed=hashlib.sha256(raw).hexdigest()
                  print('SE222_LIVE_ATTEMPT',attempt,'version=',src.get('sourceVersion'),
                        'reported=',src.get('finalSha256'),'served=',observed,
                        'bytes=',len(raw),flush=True)
                  assert src['sourceVersion']=='§wyrl§ Engine v11.222'
                  assert src['finalSha256']==observed==expected
                  assert src['finalBytes']==len(raw)==7550334
                  assert len(src['patches'])==254 and len(src['assets'])==68
                  assert b'SWYRL_ENGINE_DEPLOY_MARKER: V11_222_CLOVER_MOTIONS_BUILD_SPARKS' in raw
                  print('SE222_LIVE_SOURCE_VERIFIED',flush=True)
                  break
              except Exception as exc:
                  print('SE222_LIVE_UNCONFIRMED',repr(exc),flush=True)
                  if attempt==4:raise
                  time.sleep(8)
          PY
