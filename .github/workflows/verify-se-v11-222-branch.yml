name: §E v11.222 served markup delta inspection
on:
  push:
    branches:
      - feat/se-v11-222-sheep-animations-particles
permissions:
  contents: read
jobs:
  live-delta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Diff expected compiled bytes against served bytes
        run: |
          python projects/swrlz-forge-moba/scripts/verify_v11_222_release.py --output dist/forge
          python - <<'PY'
          import hashlib,urllib.request,json,difflib
          from pathlib import Path
          expected=Path('dist/forge/index.html').read_bytes()
          base='https://kamiloki-swrlz-forge-moba.static.hf.space/'
          live=urllib.request.urlopen(base+'index.html',timeout=40).read()
          source=json.load(urllib.request.urlopen(base+'SOURCE.json',timeout=30))
          print('EXPECTED',len(expected),hashlib.sha256(expected).hexdigest())
          print('SERVED',len(live),hashlib.sha256(live).hexdigest())
          print('SOURCE',source.get('sourceVersion'),source.get('finalSha256'))
          prefix=0
          while prefix<min(len(expected),len(live)) and expected[prefix]==live[prefix]:prefix+=1
          suffix=0
          while suffix<min(len(expected),len(live))-prefix and expected[-suffix-1]==live[-suffix-1]:suffix+=1
          print('COMMON_PREFIX',prefix,'COMMON_SUFFIX',suffix)
          print('EXPECTED_DIFFERENCE_WINDOW',repr(expected[prefix:len(expected)-suffix][:1500]))
          print('SERVED_DIFFERENCE_WINDOW',repr(live[prefix:len(live)-suffix][:1500]))
          print('EXPECTED_END',repr(expected[-350:]))
          print('SERVED_END',repr(live[-350:]))
          PY
