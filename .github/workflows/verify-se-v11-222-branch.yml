name: §E v11.222 narrow source seal (temporary branch)
on:
  push:
    branches:
      - feat/se-v11-222-sheep-animations-particles
permissions:
  contents: read
jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check scoped source, assemble exact engine, print receipt
        run: |
          python -m py_compile projects/swrlz-forge-moba/patches/v11_222_clover_motion_construction_fx.py
          node --check projects/swrlz-forge-moba/runtime/sheep_animation_particles_v11_222.js
          node --check projects/swrlz-forge-moba/runtime/model_atelier_sheep_animations_v11_222.js
          python projects/swrlz-forge-moba/scripts/verify_v11_222_release.py --output dist/forge
          python - <<'PY'
          import hashlib,json,re,subprocess
          from pathlib import Path
          s=Path('dist/forge/index.html').read_bytes()
          print('SE222_EXACT_RECEIPT bytes=',len(s),' sha256=',hashlib.sha256(s).hexdigest(),flush=True)
          html=s.decode()
          assert 'SWYRL_ENGINE_DEPLOY_MARKER: V11_222_CLOVER_MOTIONS_BUILD_SPARKS' in html
          assert 'function se222SheepPose(' in html
          assert 'function se222SheepPreviewFrame(' in html
          assert 'function se222GameFrame(' in html
          assert 'se222SheepStudioInstall();' in html
          assert 'if(species===\x27sheep\x27)data.project.modelAtelier.sheepAnimations=se222SheepClips();' in html
          scripts=re.findall(r'<script\b[^>]*>(.*?)</script>',html,flags=re.S)
          for i,script in enumerate(scripts):
            if not script.strip():continue
            p=Path('/tmp')/('se222_inline_'+str(i)+'.mjs')
            p.write_text(script)
            subprocess.run(['node','--check',str(p)],check=True)
          print('SE222_NARROW_SOURCE_AND_JS_SYNTAX_PASS')
          PY
