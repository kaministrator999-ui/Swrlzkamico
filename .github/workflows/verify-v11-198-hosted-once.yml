name: Audit live §E v11.198 Quest editor release (one-time)
on:
  push:
    branches: [feature/quest-spatial-editor-flight-gizmo-v11-198]
    paths: [".github/workflows/verify-v11-198-hosted-once.yml"]
permissions:
  contents: read
jobs:
  hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Build exact v11.198 and verify live SOURCE.json plus served HTML
        run: |
          python projects/swrlz-forge-moba/scripts/verify_v11_198_release.py --output /tmp/quest198 >/tmp/quest198-strict.log
          python - <<'PY'
          import hashlib,json,time,urllib.request
          from pathlib import Path
          base='https://kamiloki-swrlz-forge-moba.static.hf.space'
          expected_bytes=7320589
          expected_hash='c5e42de3a9c6dca98d72843b70c4cb2eb549c22589aae4a7fb0d4f7e8ba00f0f'
          raw=Path('/tmp/quest198/index.html').read_bytes()
          assert len(raw)==expected_bytes and hashlib.sha256(raw).hexdigest()==expected_hash
          def get(path,n):
              req=urllib.request.Request(base+path+'?audit198='+str(n),
                  headers={'Cache-Control':'no-cache','User-Agent':'se198-quest-live-verification'})
              with urllib.request.urlopen(req,timeout=35) as response:return response.read()
          for n in range(1,10):
              try:
                  receipt=json.loads(get('/SOURCE.json',n))
                  assert receipt.get('sourceVersion')=='§wyrl§ Engine v11.198',receipt.get('sourceVersion')
                  assert receipt.get('finalBytes')==expected_bytes
                  assert receipt.get('finalSha256')==expected_hash
                  assert len(receipt.get('assets',{}))==68
                  html=get('/index.html',n)
                  if html!=raw:
                      p=0
                      while p<min(len(html),len(raw)) and html[p]==raw[p]:p+=1
                      suffix=0
                      while suffix<min(len(html),len(raw))-p and html[-1-suffix]==raw[-1-suffix]:suffix+=1
                      inserted=html[p:len(html)-suffix]
                      assert p==39 and len(inserted)<1300,('Unexpected hosted difference',p,len(inserted))
                      assert b'window.huggingface' in inserted and b'og:title' in inserted
                      assert html[:p]+html[p+len(inserted):]==raw,'Hosted engine changed beyond HF metadata'
                      print('HF_METADATA_INSERTION_BYTES='+str(len(inserted)),flush=True)
                  print('LIVE_QUEST198_SOURCE_AND_HTML_SHA_VERIFIED',flush=True)
                  break
              except Exception as err:
                  print('LIVE_RETRY_'+str(n)+': '+str(err),flush=True)
                  if n==9:raise
                  time.sleep(5)
          PY
