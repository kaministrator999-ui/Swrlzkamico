name: GitHub account connection v1
on:
  push:
    branches:
      - feature/github-account-project-start-v1
  workflow_dispatch:

jobs:
  github-connection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependencies
        run: python -m pip install 'fastapi>=0.115,<1' 'starlette>=0.40' 'httpx>=0.27,<1' 'requests>=2.32,<3' 'cryptography>=43,<47'
      - name: Python syntax and account isolation tests
        run: |
          python -m py_compile hf_space/github_connection.py hf_space/station.py hf_space/test_github_connection_v1.py
          python hf_space/test_github_connection_v1.py
      - name: Verify canonical Chat inline JavaScript parses
        run: |
          node - <<'NODE'
          const fs=require('fs'), vm=require('vm');
          const html=fs.readFileSync('hf_space/chat/§wyrlz/index.html','utf8');
          const blocks=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)]
            .map(x=>x[1]).filter(x=>x.trim());
          if(!blocks.length)throw Error('No inline Chat JS found');
          for(const script of blocks)new vm.Script(script);
          for(const id of ['githubConnectButton','githubDisconnectButton','githubRepoSelect','githubReadStart'])
            if(!html.includes('id="'+id+'"'))throw Error('Missing '+id);
          console.log('Chat inline script parsed; GitHub controls present');
          NODE
      - name: Guard no OAuth secrets embedded into Chat
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('hf_space/chat/§wyrlz/index.html').read_text()
          assert 'SWRLZ_GITHUB_OAUTH_CLIENT_SECRET' not in s
          assert 'SWRLZ_GITHUB_ENCRYPTION_KEY' not in s
          assert 'localStorage.setItem("github' not in s
          assert 'github_connection.install(app, _account_session)' in Path('hf_space/station.py').read_text()
          print('Client/source ownership checks passed')
          PY
