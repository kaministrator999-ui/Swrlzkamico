name: GitHub account connection v1
on:
  push:
    branches:
      - feature/github-account-project-start-v1
      - feature/github-account-project-start-v191-integration
      - feature/github-oauth-safe-config-diagnostics-v192
      - feature/github-start-mobile-markdown-and-roadmap-v1
      - feature/github-thread-project-continuity-v1
      - feature/github-thread-project-continuity-v194-integration
      - feature/google-durable-chat-history-v1
      - feature/google-durable-chat-history-v195-integration
      - feature/social-checkin-v197-persistence-restart
      - feature/grounded-version-recall-v201
      - feature/google-chatgpt-archive-import-v202
      - feature/chatgpt-archive-sidebar-v204
      - feature/chatgpt-account-memory-v205
      - feature/private-history-search-v206
      - feature/private-history-toolkit-v207
      - feature/private-account-facts-v208
      - fix/native-google-chat-cross-browser-20261011
      - fix/native-chat-capacity-v2091
      - feature/github-capabilities-v210-v2091-integrated
      - fix/native-chat-mobile-sidebar-access-v2111
      - fix/native-chat-first-send-ack-v2112
      - fix/assistant-brand-identity-clarity-v2113
      - feature/github-model-guided-progress-v211
      - feature/github-workflow-studio-v212-v2113-integrated
      - feature/github-project-workbench-v213
      - feature/forge-engine-agent-v214-integrated
      - feature/engine-starter-pack-atomic-v215
      - feature/engine-source-code-agent-v217
      - feature/engine-code-context-verification-v218
      - feature/version-literacy-content-layout-v199
  workflow_dispatch:

jobs:
  github-connection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependencies
        run: python -m pip install 'fastapi>=0.115,<1' 'starlette>=0.40' 'httpx>=0.27,<1' 'requests>=2.32,<3' 'cryptography>=43,<47'
      - name: Python syntax and account isolation tests
        run: |
          python -m py_compile hf_space/github_connection.py hf_space/github_project_v213.py hf_space/test_github_project_v213.py hf_space/forge_project_tools_v213.py hf_space/test_forge_project_tools_v213.py hf_space/engine_starter_pack_v215.py hf_space/test_engine_starter_pack_v215.py hf_space/engine_code_agent_v217.py hf_space/test_engine_code_agent_v217.py hf_space/test_engine_context_verification_v218.py hf_space/github_workflows_v212.py hf_space/test_github_workflows_v212.py hf_space/station.py hf_space/test_github_connection_v1.py hf_space/test_github_capabilities_v210.py hf_space/test_github_model_progress_v211.py hf_space/project_thread_memory.py hf_space/test_project_thread_memory_v1.py hf_space/lfm2_700m_engine.py hf_space/qwen_coder_engine.py hf_space/original_engine.py hf_space/account_chat_store.py hf_space/test_account_chat_store_v1.py hf_space/social_checkin.py hf_space/test_social_checkin_v197.py hf_space/test_project_version_recall_v201.py hf_space/version_literacy.py hf_space/test_version_presentation_v199.py hf_space/chatgpt_archive.py hf_space/test_chatgpt_archive_import_v202.py hf_space/chatgpt_account_memory.py hf_space/test_chatgpt_account_memory_v205.py hf_space/personal_history_lookup.py hf_space/test_personal_history_lookup_v206.py hf_space/personal_history_query_v207.py hf_space/private_account_facts_v208.py hf_space/test_private_account_facts_v208.py hf_space/test_personal_history_toolkit_v207.py
          python hf_space/test_github_connection_v1.py
          python hf_space/test_github_capabilities_v210.py
          python hf_space/test_github_model_progress_v211.py
          python hf_space/test_github_workflows_v212.py
          python hf_space/test_github_project_v213.py
          python hf_space/test_forge_project_tools_v213.py
          python hf_space/test_engine_starter_pack_v215.py
          python hf_space/test_engine_code_agent_v217.py
          python hf_space/test_engine_context_verification_v218.py
          python hf_space/test_project_thread_memory_v1.py
          python hf_space/test_account_chat_store_v1.py
          python hf_space/test_social_checkin_v197.py
          python hf_space/test_project_version_recall_v201.py
          python hf_space/test_version_presentation_v199.py
          python hf_space/test_chatgpt_archive_import_v202.py
          python hf_space/test_chatgpt_account_memory_v205.py
          python hf_space/test_personal_history_lookup_v206.py
          python hf_space/test_personal_history_toolkit_v207.py
          python hf_space/test_private_account_facts_v208.py
          python hf_space/test_assistant_app_identity_v2113.py
      - name: Verify canonical Chat inline JavaScript parses
        run: |
          node - <<'NODE'
          const fs=require('fs'), vm=require('vm');
          const html=fs.readFileSync('chat/§wyrlz/index.html','utf8');
          const blocks=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)]
            .map(x=>x[1]).filter(x=>x.trim());
          if(!blocks.length)throw Error('No inline Chat JS found');
          for(const script of blocks)new vm.Script(script);
          for(const id of ['githubConnectButton','githubDisconnectButton','githubRepoSelect','githubReadStart'])
            if(!html.includes('id="'+id+'"'))throw Error('Missing '+id);
          for(const invariant of ['md-table-scroll','const appendInlineFormatting=(parent,value)=>','safeHttpUrl(match[2])','const tableRule=line=>'])
            if(!html.includes(invariant))throw Error('Missing mobile Markdown contract '+invariant);
          console.log('Chat inline script parsed; GitHub controls present');
          NODE
      - name: Verify ChatGPT archive UI JavaScript
        run: |
          node --check 'chat/§wyrlz/assets/chatgpt-archive-import-v1.js'
          node --check 'chat/§wyrlz/assets/chatgpt-archive-sidebar-v204.js'
          node tests/test_chatgpt_archive_sidebar_v204.mjs
          node tests/test_native_chat_order_v211.mjs
          node tests/test_native_sidebar_mobile_access_v211.mjs
          node tests/test_native_first_send_ack_v2112.mjs
      - name: Guard no OAuth secrets embedded into Chat
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('chat/§wyrlz/index.html').read_text()
          assert 'SWRLZ_GITHUB_OAUTH_CLIENT_SECRET' not in s
          assert 'SWRLZ_GITHUB_ENCRYPTION_KEY' not in s
          assert 'localStorage.setItem("github' not in s
          assert 'github_connection.install(app, _account_session)' in Path('hf_space/station.py').read_text()
          print('Client/source ownership checks passed')
          PY
