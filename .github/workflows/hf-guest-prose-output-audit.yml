name: Read-only §C prose finalization output audit
on:
  push:
    branches: [main]
    paths:
      - scripts/audit_hf_guest_prose_output_v2.py
      - .github/workflows/hf-guest-prose-output-audit.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet 'huggingface_hub>=0.34,<2'
      - run: python -m py_compile scripts/audit_hf_guest_prose_output_v2.py
      - name: Inspect deployed coder streaming and reply finalization
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u scripts/audit_hf_guest_prose_output_v2.py
