name: Verify §E v11.25 interior modeling candidate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-atelier-interior-v1125
  cancel-in-progress: true
jobs:
  browser-and-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Syntax + sealed engine preview build
        run: |
          node --check projects/swrlz-forge-moba/runtime/model_atelier_viewport_v11_21.js
          node --check projects/swrlz-forge-moba/runtime/model_atelier_surface_targeting_v11_22.js
          python -m py_compile projects/swrlz-forge-moba/patches/v11_21_vertex_sphere_brush_preview.py
          python projects/swrlz-forge-moba/build_space.py --output /tmp/atelier-interior
          python - <<'PY'
          import runpy
          from pathlib import Path
          p=Path('/tmp/atelier-interior/index.html')
          p.write_text(runpy.run_path('projects/swrlz-forge-moba/patches/v11_21_vertex_sphere_brush_preview.py')['apply'](p.read_text()))
          PY
      - name: CPU smoke tests + front/inside shell isolation
        run: |
          npm install --no-save playwright@1.56.1 three@0.169.0
          node projects/swrlz-forge-moba/tests/model_atelier_surface_targeting_v11_22.mjs
          node projects/swrlz-forge-moba/tests/model_atelier_interior_camera_v11_25.mjs
          node projects/swrlz-forge-moba/tests/model_atelier_freehand_lasso_v11_24.mjs
      - name: Real desktop + Android-touch editor controls
        run: |
          npx playwright install --with-deps --only-shell chromium
          python -m http.server 8787 --directory /tmp/atelier-interior >/tmp/atelier-interior.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          SWYRL_SCULPT_TEST_URL=http://127.0.0.1:8787 node projects/swrlz-forge-moba/tests/model_atelier_interior_browser_v11_25.mjs
