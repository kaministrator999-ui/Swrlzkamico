name: §C shared response-quality profile source preflight
on:
  pull_request:
    paths:
      - 'scripts/hf_chat_response_quality_v1.py'
      - 'tests/test_hf_chat_response_quality_v1.py'
      - '.github/workflows/hf-chat-response-quality-v1-preflight.yml'
      - '.github/workflows/hf-chat-response-quality-v1-release.yml'
      - '.github/workflows/chat-postrelease-52turn-guest-eval.yml'
  workflow_dispatch: {}
permissions: {contents: read}
concurrency:
  group: swrlz-chat-response-quality-preflight-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify offline policy insertion, history/auth invariants and syntax
        run: |
          python -m py_compile scripts/hf_chat_response_quality_v1.py
          python -m unittest discover -s tests -p 'test_hf_chat_response_quality_v1.py' -v
      - name: Validate guarded release workflow contract without publishing
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml
          source=Path(".github/workflows/hf-chat-response-quality-v1-release.yml").read_text()
          workflow=yaml.safe_load(source)
          assert "publish" in workflow["jobs"]
          assert "swrlz-hf-space-deployment" in source
          assert "git merge-base --is-ancestor" in source
          assert "SWRLZ_EXPECTED_SPACE_REVISION" in source
          assert "SWRLZ_RESPONSE_QUALITY_RELEASE_APPROVED" in source
          assert "persist-credentials: false" in source
          print("SWRLZ_RESPONSE_RELEASE_GOVERNANCE_VERIFIED")
          PY
      - name: Install source-read-only Hugging Face client
        run: python -m pip install --quiet 'huggingface_hub>=0.34,<2'
      - name: Inspect exact live Qwen shared profile source without publishing
        run: python -u scripts/hf_chat_response_quality_v1.py inspect
      - name: Save audit manifest without storing user chat data or model weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swrlz-response-quality-source-preflight-${{ github.run_id }}
          path: reports/chat-response-quality-v1/manifest.json
          if-no-files-found: warn
          retention-days: 14
