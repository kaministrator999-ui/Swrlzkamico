name: Audit live §C music and research routing (read-only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-live-swrlz-music-research.yml'
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet 'huggingface_hub>=0.34,<2'
      - name: Fetch exact active Space source revision and music/research entrypoints
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          from huggingface_hub import HfApi,hf_hub_download
          from pathlib import Path
          import os,hashlib,json
          api=HfApi(token=os.getenv('HF_TOKEN') or None)
          name='kamiloki/Swyrlz'
          info=api.repo_info(name,repo_type='space')
          revision=info.sha
          files=[s.rfilename for s in info.siblings]
          root=Path('reports/music-research-live-source')
          root.mkdir(parents=True,exist_ok=True)
          targets=('online_tools.py','model_router.py','lfm2_700m_engine.py','station.py',
                   'music_structure.py','lyric_craft_school.py','lyric_output_contract.py',
                   'lyric_research_lab.py','lyric_story_spine.py','lyric_bounded_continuation.py',
                   'rap_micro_curriculum.py','song_structure.py',
                   'api/online_research.py','api/selective_retrieval.py','brain_programming.py')
          available=[x for x in targets if x in files]
          manifest={'space':name,'revision':revision,'available':available,
                    'relatedFiles':[x for x in files if any(k in x.lower() for k in
                    ('lyric','music','research','song','online','route'))][:180],
                    'hashes':{}}
          for p in available:
              raw=Path(hf_hub_download(name,p,repo_type='space',revision=revision,
                                      token=api.token)).read_bytes()
              dst=root/p
              dst.parent.mkdir(parents=True,exist_ok=True)
              dst.write_bytes(raw)
              manifest['hashes'][p]=hashlib.sha256(raw).hexdigest()
          (root/'manifest.json').write_text(json.dumps(manifest,indent=2))
          print('LIVE_MUSIC_RESEARCH_SOURCE',revision,'files',len(available),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: live-music-research-source-${{ github.run_id }}
          path: reports/music-research-live-source/
          retention-days: 7
          if-no-files-found: error
