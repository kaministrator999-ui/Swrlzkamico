name: Release §C owner-approved HTML publishing controls to live Space
on:
  push:
    branches: [main]
    paths: ['.deploy/HF_CHAT_HTML_PUBLISH_INTEGRATION_REQUEST.txt']
permissions: {contents: read}
concurrency:
  group: swrlz-hf-space-deployment
  cancel-in-progress: false
jobs:
  release:
    if: ${{ github.actor == 'kaministrator999-ui' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify specific owner-approved scope and pinned source commit
        shell: bash
        run: |
          set -euo pipefail
          request='.deploy/HF_CHAT_HTML_PUBLISH_INTEGRATION_REQUEST.txt'
          test -f "$request"
          get() { sed -n "s/^$1=//p" "$request" | tail -n 1; }
          test "$(get TARGET)" = "kamiloki/Swyrlz"
          test "$(get APPROVED)" = "1"
          test "$(get CHANGE_SCOPE)" = "html-project-owner-approval-ui-api-only"
          ref="$(get SOURCE_REF)"
          nonce="$(get REQUEST_NONCE)"
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          [[ "$nonce" =~ ^[a-z0-9-]{12,96}$ ]]
          git merge-base --is-ancestor "$ref" HEAD
          git diff --exit-code "$ref" HEAD -- api/html_project_publish_action_v1.py chat/html-project-publish-v1.js scripts/hf_chat_html_publish_integration_release_v1.py
          git diff-tree --no-commit-id --name-only -r HEAD | grep -Fx "$request"
      - run: python -m pip install --quiet 'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'huggingface_hub>=0.34,<2'
      - run: python -m py_compile api/html_project_publish_action_v1.py scripts/hf_chat_html_publish_integration_release_v1.py
      - run: node --check chat/html-project-publish-v1.js
      - run: python -m unittest discover -s tests -p 'test_html_project_publish_action_v1.py' -v
      - run: python scripts/hf_chat_html_publish_integration_release_v1.py selftest
      - name: Validate true current Space source and isolated project route
        run: python -u scripts/hf_chat_html_publish_integration_release_v1.py preflight
      - name: Publish only approval module/UI and guarded Station hooks
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SWRLZ_HTML_CHAT_PUBLISH_APPROVED: '1'
        run: python -u scripts/hf_chat_html_publish_integration_release_v1.py publish
      - name: Verify actual live §C controls and anonymous action denial
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u scripts/hf_chat_html_publish_integration_release_v1.py verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swrlz-html-publish-chat-exact-live-before-after
          path: reports/html-project-chat-release-backup/
          if-no-files-found: warn
          retention-days: 14
