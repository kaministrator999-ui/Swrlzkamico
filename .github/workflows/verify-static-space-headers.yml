name: Diagnose §E static Space browser delivery headers

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-static-space-headers.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-headers:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check HEAD, normal GET and Range GET on actual public Space
        run: |
          set -eu
          HOST="https://kamiloki-swrlz-forge-moba.static.hf.space"
          for ROUTE in "/" "/modeler.html" "/swrlz-engine-v11.482.js"; do
            echo "--- ROUTE ${ROUTE}"
            for MODE in HEAD GET RANGE; do
              echo "--- METHOD ${MODE}"
              case "${MODE}" in
                HEAD) curl -sS -L -I --max-time 30 -D /tmp/hf-head -o /dev/null "${HOST}${ROUTE}";;
                GET) curl -sS -L --max-time 40 -D /tmp/hf-head -o /dev/null "${HOST}${ROUTE}";;
                RANGE) curl -sS -L -H 'Range: bytes=0-0' --max-time 30 -D /tmp/hf-head -o /dev/null "${HOST}${ROUTE}";;
              esac
              grep -iE '^HTTP/|^content-type:|^content-disposition:|^content-length:|^content-range:|^location:|^x-' /tmp/hf-head | tail -18 || true
            done
          done
          echo "--- INLINE DELIVERY VARIANTS (actual GET without Range)"
          for PATHQ in \
            '/?download=false' \
            '/?download=0' \
            '/?raw=1' \
            '/?inline=true' \
            '/index.html?download=false' \
            '/index.html?download=0' \
            '/index.html?raw=1' \
            '/index.html?inline=1' \
            '/?v=11482'; do
            echo "--- ${PATHQ}"
            curl -sS -L --max-time 22 -D /tmp/hf-query -o /dev/null "${HOST}${PATHQ}" || true
            grep -iE '^HTTP/|^content-type:|^content-disposition:|^content-length:' /tmp/hf-query | tail -5 || true
          done
          echo "--- HEAD vs GET at known other static space"
          for URL in 'https://kramp-test-static.static.hf.space/' 'https://coyotte508-static-vite.static.hf.space/'; do
            echo "--- ${URL}"
            curl -sS -L --max-time 22 -D /tmp/hf-other -o /dev/null "${URL}" || true
            grep -iE '^HTTP/|^content-type:|^content-disposition:|^content-length:' /tmp/hf-other | tail -5 || true
          done

      - name: Inspect storage metadata for served HTML files
        run: |
          python - <<'PY'
          import json
          from urllib.request import urlopen
          for rid in ('kamiloki/swrlz-forge-moba','kramp/test-static'):
              print('HF_REPO',rid,flush=True)
              url='https://huggingface.co/api/spaces/'+rid+'/tree/main?recursive=false&expand=true'
              try:
                  with urlopen(url,timeout=20) as response:
                      data=json.load(response)
                  for item in data:
                      if item.get('path') in ('index.html','modeler.html',
                           'swrlz-engine-v11.482.js','.gitattributes','README.md'):
                          print('HF_FILE',item.get('path'),{
                              k:item.get(k) for k in ('type','size','oid','lfs','blobId')
                              if k in item
                          },flush=True)
              except Exception as e:
                  print('HF_REPO_PROBE_ERROR',type(e).__name__,str(e),flush=True)
          PY
