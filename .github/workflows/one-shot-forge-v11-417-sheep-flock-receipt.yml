name: One-shot §E v11.417 Sheep Tag flock after satchel receipt
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-forge-v11-417-sheep-flock-receipt.yml'
permissions:
  contents: read
jobs:
  receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build both sequential pending features on sealed source
        run: |
          set -eu
          ROOT=projects/swrlz-forge-moba
          node --check "$ROOT/runtime/sheep_team_setup_v11_416.js"
          node "$ROOT/tests/test_sheep_flock_setup_v11_416.cjs"
          python -m py_compile "$ROOT/patches/v11_417_sheep_flock_setup.py"
          python "$ROOT/build_space.py" --output /tmp/se415-base
          python - <<'PY'
          from pathlib import Path
          import importlib.util,hashlib
          root=Path('projects/swrlz-forge-moba')
          html=Path('/tmp/se415-base/index.html').read_text('utf8')
          for f in ['v11_416_satchel_interactive_coach.py','v11_417_sheep_flock_setup.py']:
            spec=importlib.util.spec_from_file_location(f[:-3],root/'patches'/f)
            module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
            html=module.apply(html)
            print('APPLIED',f,flush=True)
          raw=html.encode('utf8')
          Path('/tmp/se417-candidate.html').write_bytes(raw)
          print('SE417_RECEIPT_BYTES='+str(len(raw)),flush=True)
          print('SE417_RECEIPT_SHA256='+hashlib.sha256(raw).hexdigest(),flush=True)
          assert html.count('SWYRL_ENGINE_SHEEP_TEAM_SETUP_416')>=1
          assert "window.SWRLZ_FORGE_BUILD={version:'v11.417'" in html
          PY
          python "$ROOT/scripts/check_inline_js_syntax_v11_266.py" /tmp/se417-candidate.html

# Recheck after upstream satchel v11.416 source/academy fix passed run 43121460339.
