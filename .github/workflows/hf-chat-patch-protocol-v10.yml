name: Release §C dedicated repair patch grammar v10
on:
  pull_request:
    paths:
      - 'api/html_project_agent_v1.py'
      - 'api/html_project_agent_runtime_v1.py'
      - 'tests/test_html_project_agent_v1.py'
      - 'tests/test_html_project_agent_runtime_v1.py'
      - 'tests/test_server_owned_patch_release_v8.py'
      - 'scripts/hf_chat_patch_protocol_release_v10.py'
      - '.github/workflows/hf-chat-patch-protocol-v10.yml'
  push:
    branches: [main]
    paths:
      - 'api/html_project_agent_v1.py'
      - 'api/html_project_agent_runtime_v1.py'
      - 'scripts/hf_chat_patch_protocol_release_v10.py'
      - '.github/workflows/hf-chat-patch-protocol-v10.yml'
permissions: {contents: read}
concurrency:
  group: swrlz-patch-protocol-v10
  cancel-in-progress: false
jobs:
  validate-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Validate dedicated repair grammar and unchanged write boundaries
        run: |
          python -m pip install --quiet 'requests>=2.31,<3'
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/api"
          echo "PYTHONPATH=$PYTHONPATH" >> "$GITHUB_ENV"
          python -m py_compile api/html_project_agent_v1.py api/html_project_agent_runtime_v1.py scripts/hf_chat_patch_protocol_release_v10.py
          python -m unittest discover -s tests -p 'test_html_project_agent_v1.py' -v
          python -m unittest discover -s tests -p 'test_html_project_agent_runtime_v1.py' -v
          python -m unittest discover -s tests -p 'test_html_project_repair_v1.py' -v
          python -m unittest discover -s tests -p 'test_server_owned_patch_release_v8.py' -v
          python scripts/hf_chat_patch_protocol_release_v10.py selftest
      - name: Install Hugging Face source reader
        run: python -m pip install --quiet 'huggingface_hub>=0.34,<2'
      - name: Check real production source against exact v10 upgrade
        run: python -u scripts/hf_chat_patch_protocol_release_v10.py preflight
      - name: CAS-publish v10 to Hugging Face
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[release-chat-patch-protocol-v10]') }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SWRLZ_PATCH_PROTOCOL_V10_APPROVED: '1'
        run: python -u scripts/hf_chat_patch_protocol_release_v10.py publish
      - name: Independently verify actual coding-model exact patch execution
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[release-chat-patch-protocol-v10]') }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u scripts/hf_chat_patch_protocol_release_v10.py verify
