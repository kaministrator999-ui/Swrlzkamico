name: Read-only live §C storage path inspection
on:
  push:
    branches: [feature/aiven-valkey-storage-adapter]
    paths: ["scripts/hf_valkey_live_layout.py", ".github/workflows/hf-valkey-live-layout.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "huggingface_hub>=0.34,<2"
      - name: Parse only route names and provider flags from Space files
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u scripts/hf_valkey_live_layout.py
