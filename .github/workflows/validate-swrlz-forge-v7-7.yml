name: Validate §wyrl§ Engine v7.7
on:
  push:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/patches/v7_7_canonical_glitch_den_project.py"
      - "projects/swrlz-forge-moba/source-manifest.json"
      - ".github/workflows/validate-swrlz-forge-v7-7.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Rebuild canonical starter
        run: |
          set -euo pipefail
          python projects/swrlz-forge-moba/build_space.py --output /tmp/swyrl-v77
          test -s /tmp/swyrl-v77/index.html
          grep -q "V7_7_CANONICAL_GLITCH_DEN_PROJECT" /tmp/swyrl-v77/index.html
          grep -q "Glitch Dragon Den — Moonfire Sanctum" /tmp/swyrl-v77/index.html
          grep -q "authored revision 142 · 120 actors" /tmp/swyrl-v77/index.html
          python - <<'PY'
          from pathlib import Path
          import hashlib,re
          p=Path('/tmp/swyrl-v77/index.html'); s=p.read_text(encoding='utf-8')
          assert s.count('data-project-template="glitch-dragons-den"')==1
          assert 'data-project-template="moba"' not in s
          assert 'data-project-template="default"' not in s
          assert 'data-project-template="dragons-den"' not in s
          assert 'loadCanonicalGlitchDen();' in s
          assert '"revision":142' in s
          assert s.count('"type":"dragon"') >= 3
          start=s.index('<script type="module">')+len('<script type="module">'); end=s.rindex('</script>')
          Path('/tmp/swyrl-v77.mjs').write_text(s[start:end],encoding='utf-8')
          print('FINAL_BYTES='+str(len(p.read_bytes())))
          print('FINAL_SHA256='+hashlib.sha256(p.read_bytes()).hexdigest())
          PY
          node --check /tmp/swyrl-v77.mjs
