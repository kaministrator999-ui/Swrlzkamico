name: Seal §E v11.542 humanoid relaxed UV atlas
on:
  push:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/RELEASE_PREPARE_V11_542.json"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: se542-humanoid-uv-source-seal
  cancel-in-progress: false
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout authoritative engine source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install offline UV-bake dependencies (not shipped to devices)
        run: python -m pip install --quiet "numpy>=2,<3" "scipy>=1.15,<2" "pillow>=11,<13" "xatlas>=0.0.9,<1"
      - name: Bake anatomical UV charts and preserve painted texture
        run: python projects/swrlz-forge-moba/authoring/build_humanoid_uv_atlas_v11_542.py
      - name: Validate unchanged body, manifold topology and registered UV material
        run: |
          python projects/swrlz-forge-moba/scripts/check_humanoid_uv_atlas_v11_542.py
          node --check projects/swrlz-forge-moba/runtime/humanoid_uv_starter_v11_542.js
          node --check projects/swrlz-forge-moba/runtime/humanoid_uv_guard_v11_542.js
          node projects/swrlz-forge-moba/tests/humanoid_uv_starter_v11_542.cjs
          python -m py_compile projects/swrlz-forge-moba/patches/v11_542_humanoid_relaxed_uv.py
      - name: Generate actual v11.542 SHA-sealed native source
        run: python projects/swrlz-forge-moba/scripts/prepare_v11_542_release.py
      - name: Verify release identity, native scene, editor and browser packaging
        run: |
          python projects/swrlz-forge-moba/scripts/verify_v11_542_release.py --output /tmp/se542-release
          python projects/swrlz-forge-moba/scripts/package_static_delivery_v11_542.py --output /tmp/se542-release
          node --check /tmp/se542-release/swrlz-engine-v11.542.js
      - name: Commit only verified new assets and sealed manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/swrlz-forge-moba/scenes/model-atelier-futuristic-humanoid-v11-542.swyrl.json \
                  projects/swrlz-forge-moba/assets/models/futuristic-humanoid-v11-542-uv-guide.png \
                  projects/swrlz-forge-moba/source-manifest.json
          git diff --cached --quiet && { echo "No verified changes"; exit 1; }
          git commit -m "seal(§E v11.542): verified humanoid UV charts, material reprojection and source SHA"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Retain build receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: se542-humanoid-uv-charts-and-source-integrity
          path: |
            projects/swrlz-forge-moba/scenes/model-atelier-futuristic-humanoid-v11-542.swyrl.json
            projects/swrlz-forge-moba/assets/models/futuristic-humanoid-v11-542-uv-guide.png
            projects/swrlz-forge-moba/source-manifest.json
          if-no-files-found: warn
