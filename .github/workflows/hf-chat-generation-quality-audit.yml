name: Read-only §C code dialog, Stop, Continue and HTML prompt source audit
on:
  push:
    branches: [feature/chat-generation-lifecycle-quality-20261114]
    paths:
      - "scripts/audit_chat_lifecycle_quality_20261114.py"
      - ".github/workflows/hf-chat-generation-quality-audit.yml"
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --quiet "huggingface_hub>=0.34,<2"
      - name: Read authoritative live Space source (no mutations)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m py_compile scripts/audit_chat_lifecycle_quality_20261114.py
          python -u scripts/audit_chat_lifecycle_quality_20261114.py
