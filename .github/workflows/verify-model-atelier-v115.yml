name: Verify v11.13 §E source seal
on:
  push:
    branches:
      - feature/engine-v119-figure-ferret-silhouette
  workflow_dispatch:
jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct and print exact v11.13 SHA
        shell: bash
        run: |
          python - <<'PY'
          import sys,json,base64,gzip,hashlib
          from pathlib import Path
          root=Path('projects/swrlz-forge-moba').resolve()
          sys.path.insert(0,str(root))
          import build_space
          manifest=json.loads((root/'source-manifest.json').read_text())
          encoded=''.join((root/name).read_text().strip() for name in manifest['chunks'])
          html=gzip.decompress(base64.b64decode(encoded)).decode('utf-8')
          assert hashlib.sha256(html.encode()).hexdigest()==manifest['baseSha256']
          for patch in manifest['patches']:
              html=build_space.load_patch(root/patch)(html)
          raw=html.encode('utf-8')
          print('V119_FINAL_BYTES='+str(len(raw)),flush=True)
          print('V119_FINAL_SHA256='+hashlib.sha256(raw).hexdigest(),flush=True)
          assert 'V11_13_REFERENCE_ASSEMBLIES' in html
          assert 'modelAtelierLoftEditor' in html
          assert 'MODEL_ATELIER_LIMIT=1200' in html
          assert 'atelier-v117-0554' in html
          from pathlib import Path
          Path('/tmp/swyrl-v115-source.mjs').write_text(html[html.index('<script type="module">')+len('<script type="module">'):html.rindex('</script>')])
          PY
          node --check /tmp/swyrl-v115-source.mjs
          python -m compileall -q projects/swrlz-forge-moba/patches projects/swrlz-forge-moba/build_space.py
