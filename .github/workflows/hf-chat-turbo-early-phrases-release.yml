name: Guarded HF Turbo Early Phrases Release
on:
  push:
    branches: [main]
    paths:
      - ".deploy/HF_CHAT_TURBO_EARLY_PHRASES_REQUEST.txt"
permissions:
  contents: read
concurrency:
  group: swrlz-hf-turbo-early-phrases-release
  cancel-in-progress: false
jobs:
  turbo-early-phrases:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed request
        uses: actions/checkout@v4
      - name: Verify pinned source and no-paid-service authorization
        id: request
        shell: bash
        run: |
          set -euo pipefail
          file=".deploy/HF_CHAT_TURBO_EARLY_PHRASES_REQUEST.txt"
          test -f "$file"
          get() { sed -n "s/^$1=//p" "$file" | tail -n 1; }
          test "$(get TARGET)" = "kamiloki/Swyrlz"
          test "$(get APPROVED)" = "1"
          test "$(get NO_PAID_SPEECH_API)" = "1"
          test "$(get NO_HARDWARE_UPGRADE)" = "1"
          ref="$(get SOURCE_REF)"
          nonce="$(get REQUEST_NONCE)"
          [[ "$ref" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::Source must be immutable SHA"; exit 1; }
          [[ "$nonce" =~ ^[A-Za-z0-9._-]{10,96}$ ]] || { echo "::error::Invalid release nonce"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Checkout immutable voice candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.ref }}
          path: voice-turbo-source
          fetch-depth: 1
      - name: Validate natural early speech and established voices
        shell: bash
        run: |
          set -euo pipefail
          node --check voice-turbo-source/chat/§wyrlz/assets/voice_conversation.js
          node --check voice-turbo-source/chat/§wyrlz/assets/local_voice_vosk.js
          node voice-turbo-source/scripts/test_chat_turbo_early_phrase.cjs
          node voice-turbo-source/scripts/test_chat_browser_turbo.cjs
          node voice-turbo-source/scripts/test_chat_streaming_voice.cjs
          node voice-turbo-source/scripts/test_chat_local_voice_accuracy_v6.cjs
          node voice-turbo-source/scripts/test_chat_local_streaming_vosk.cjs
          node voice-turbo-source/scripts/test_chat_local_vosk_recovery.cjs
          node voice-turbo-source/scripts/test_chat_local_turbo.cjs
          python -m py_compile voice-turbo-source/scripts/publish_hf_turbo_early_phrases.py
      - name: Install existing Hugging Face client
        run: python -m pip install 'huggingface_hub>=0.34,<2'
      - name: Check live §C 1.1.38, stage early speech, save rollback
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          python voice-turbo-source/scripts/publish_hf_turbo_early_phrases.py prepare
      - name: Preserve before-state for full voice rollback
        uses: actions/upload-artifact@v4
        with:
          name: hf-turbo-early-phrases-rollback
          path: hf-turbo-early-phrases-rollback/
          retention-days: 90
          if-no-files-found: error
      - name: Publish scoped §C 1.1.39 with live revision lease
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          python voice-turbo-source/scripts/publish_hf_turbo_early_phrases.py publish
