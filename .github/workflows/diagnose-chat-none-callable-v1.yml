name: Diagnose live §C NoneType callable
on:
  pull_request:
    paths:
      - scripts/diagnose_live_none_callable_v1.py
      - .github/workflows/diagnose-chat-none-callable-v1.yml
permissions: {contents: read}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet 'huggingface_hub>=0.34,<2'
      - name: Read exact live dispatcher and callable bindings
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/diagnose_live_none_callable_v1.py
