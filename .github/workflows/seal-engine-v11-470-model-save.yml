name: Verify and seal §E v11.470 UV and manual model saves
on:
  push:
    branches: [fix/se470-uv-placement-model-save]
    paths:
      - ".github/workflows/seal-engine-v11-470-model-save.yml"
      - ".github/workflows/deploy-swrlz-forge-moba.yml"
      - "projects/swrlz-forge-moba/patches/v11_470_uv_model_save.py"
      - "projects/swrlz-forge-moba/tests/model_uv_save_v11_470.mjs"
      - "projects/swrlz-forge-moba/tests/studio_asset_isolation_v11_468.mjs"
      - "projects/swrlz-forge-moba/scripts/prepare_v11_470_release.py"
      - "projects/swrlz-forge-moba/scripts/verify_v11_470_release.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: se470-model-save-seal
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify assembled engine, UV position tests, asset save and source package
        run: python projects/swrlz-forge-moba/scripts/prepare_v11_470_release.py
      - name: Commit exact verified checksum and release request
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/swrlz-forge-moba/source-manifest.json projects/swrlz-forge-moba/DEPLOY_REQUEST.json
          if ! git diff --cached --quiet; then
            git commit -m "seal(§E): exact v11.470 release hash and request"
            git pull --rebase origin fix/se470-uv-placement-model-save
            git push origin HEAD:fix/se470-uv-placement-model-save
          fi
      - name: Save release receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: se470-model-uv-save-receipt
          path: |
            projects/swrlz-forge-moba/source-manifest.json
            projects/swrlz-forge-moba/DEPLOY_REQUEST.json
          if-no-files-found: error
