name: Validate §wyrl§ Engine v6.5
on:
  push:
    branches: [main]
    paths: [".github/workflows/validate-swrlz-forge-v6-5.yml"]
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Reconstruct and validate runtime parity
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,gzip,hashlib,importlib.util,json
          from pathlib import Path
          root=Path("projects/swrlz-forge-moba");m=json.loads((root/"source-manifest.json").read_text())
          html=gzip.decompress(base64.b64decode("".join((root/p).read_text().strip() for p in m["chunks"]))).decode()
          for rel in m["patches"]:
              spec=importlib.util.spec_from_file_location("p",root/rel);mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod);html=mod.apply(html)
          b=html.encode();print("FINAL_BYTES="+str(len(b)));print("FINAL_SHA256="+hashlib.sha256(b).hexdigest())
          for x in ["V6_5_GLITCH_DEN_RUNTIME","defaultProject:'glitch-dragons-den'","Wisp Visitor / Creator","visitor.userData.folder='Glitch Den/Visitors'","FIRST PERSON · left stick move · right stick look","function makeWispHero","function makeGlitchDragonV3"]: assert x in html,x
          assert html.count('data-project-template="glitch-dragons-den"')==1
          assert "glitch-dragons-den-apex" not in html
          start=html.index('<script type="module">')+len('<script type="module">');end=html.rindex('</script>');Path("/tmp/e.mjs").write_text(html[start:end])
          PY
          node --check /tmp/e.mjs
