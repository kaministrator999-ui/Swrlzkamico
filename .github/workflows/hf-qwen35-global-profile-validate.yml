name: Validate §C global §wyrlz profile and 9B prompt efficiency
on:
  push:
    branches: [tune/chat-qwen35-global-profile-20261113, fix/chat-qwen35-unified-profile-coder-20261113]
    paths:
      - "scripts/hf_chat_qwen35_global_profile_v5.py"
      - "scripts/test_hf_qwen35_global_profile_v5.py"
      - "scripts/hf_chat_qwen35_global_profile_v5_release.py"
      - "scripts/hf_chat_qwen35_global_profile_v5_dual.py"
      - "scripts/test_hf_chat_qwen35_global_profile_v5_dual.py"
      - ".github/workflows/hf-qwen35-global-profile-validate.yml"
      - ".github/workflows/hf-qwen35-global-profile-release.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install HF read-only source client
        run: python -m pip install 'huggingface_hub>=0.34,<2'
      - name: Inspect exact current Space, syntax, authored profile and preserved routes
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/hf_chat_qwen35_global_profile_v5.py scripts/test_hf_qwen35_global_profile_v5.py
          if test -f scripts/hf_chat_qwen35_global_profile_v5_release.py; then
            python -m py_compile scripts/hf_chat_qwen35_global_profile_v5_dual.py scripts/test_hf_chat_qwen35_global_profile_v5_dual.py scripts/hf_chat_qwen35_global_profile_v5_release.py
          fi
          python -u scripts/test_hf_qwen35_global_profile_v5.py
          python -u scripts/hf_chat_qwen35_global_profile_v5.py inspect
          python -u scripts/test_hf_chat_qwen35_global_profile_v5_dual.py
          python -u scripts/hf_chat_qwen35_global_profile_v5_dual.py inspect
