name: Seal UV texture alignment workspace
on:
  push:
    branches: [main]
    paths:
      - "projects/swrlz-forge-moba/RELEASE_UV_TEXTURE_ALIGNMENT_V11_552.json"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate and seal with persisted diagnostic receipt
        id: validate
        shell: bash
        run: |
          set +e
          LOG=/tmp/se550-build.log
          run_checks() {
            echo "=== JS syntax ==="
            node --check projects/swrlz-forge-moba/runtime/uv_texture_alignment_v11_552.js || return $?
            echo "=== seal source ==="
            python projects/swrlz-forge-moba/scripts/seal_uv_texture_alignment_v11_552.py || return $?
            echo "=== build verified source ==="
            python projects/swrlz-forge-moba/build_space.py --output /tmp/uv-direct-edit || return $?
          }
          run_checks > "$LOG" 2>&1
          result=$?
          mkdir -p projects/swrlz-forge-moba/docs/qa
          python -c 'import json,sys; from pathlib import Path; code=int(sys.argv[1]); lines=Path(sys.argv[2]).read_text(errors="replace").splitlines(); Path("projects/swrlz-forge-moba/docs/qa/uv-direct-edit-v11-552-build-result.json").write_text(json.dumps({"passed":code==0,"exit_code":code,"log_tail":lines[-90:]},indent=2))' "$result" "$LOG"
          echo "result=$result" >> "$GITHUB_OUTPUT"
          cat "$LOG"
          exit 0
      - name: Commit build result and sealed manifest if valid
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/swrlz-forge-moba/docs/qa/uv-direct-edit-v11-552-build-result.json
          if [ "${{ steps.validate.outputs.result }}" = "0" ]; then
            git add projects/swrlz-forge-moba/source-manifest.json
          fi
          git diff --cached --quiet || git commit -m "ci(engine): record UV release build result"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fail job if validation failed
        if: steps.validate.outputs.result != '0'
        run: exit 1
