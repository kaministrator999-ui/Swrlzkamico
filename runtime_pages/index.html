<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050914"><title>§wyrlz Runtime Index</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% -10%,#164b7a66,transparent 35%),radial-gradient(circle at 90% 0,#6d267a55,transparent 34%),#050914;color:#eef8ff;font-family:Inter,system-ui,sans-serif}.wrap{max-width:980px;margin:auto;padding:22px 14px 60px}.hero,.card{background:#091427e8;border:1px solid #2b4b6f;border-radius:18px;box-shadow:0 20px 60px #0006}.hero{padding:24px;text-align:center}.sigil{color:#6beaff;letter-spacing:.25em;font-size:.72rem}.hero h1{margin:6px 0;font-size:clamp(2.2rem,8vw,4.8rem)}.muted{color:#91aac4}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-top:14px}.card{padding:15px}.card a{display:block;color:#81eaff;text-decoration:none;font-weight:750;margin:7px 0}.pill{display:inline-block;border:1px solid #355878;border-radius:999px;padding:3px 7px;font-size:.7rem;color:#a9c5dc}.footer{margin-top:20px;text-align:center;color:#7088a2}</style></head><body><main class="wrap"><section class="hero"><div class="sigil">DRAGON JESTER PROTOCOL</div><h1>§WYRLZ</h1><div>LIVE RUNTIME INDEX</div><p class="muted">One launchpad for every current server page. Runtime pages can update without redeploying the stable server.</p></section><div id="grid" class="grid"><section class="card">Loading current pages…</section></div><div class="footer">KAMI + §WYRLZ ∞</div></main><script>const core=[['Admin','/api/admin'],['Chat','/api/chat'],['Live Page Manager','/api/pages'],['Hot Runtime','/api/hot'],['Health','/api/health'],['LALM','/api/lalm']];function card(title,links){return `<section class="card"><b>${title}</b>${links.map(x=>`<a href="${x[1]}">${x[0]}</a>`).join('')}</section>`}fetch('/api/pages/public',{cache:'no-store'}).then(r=>r.json()).then(j=>{let dynamic=(j.pages||[]).filter(x=>x.exists&&x.url&&!core.some(c=>c[1]===x.url)).map(x=>[x.key,x.url]);grid.innerHTML=card('Core',core)+card('Runtime pages',dynamic.length?dynamic:[['No additional pages yet','#']]);}).catch(e=>{grid.innerHTML=card('Core',core)+`<section class="card"><b>Page discovery failed</b><p class="muted">${String(e)}</p></section>`});</script></body></html>
