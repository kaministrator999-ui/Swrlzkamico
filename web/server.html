<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>§wyrlz Server</title><style>body{margin:0;font-family:system-ui;background:#050914;color:#eef7ff}.wrap{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.card{background:#0b1426;border:1px solid #274362;border-radius:16px;padding:16px}.muted{color:#93aac0}a{color:#71e5ff;text-decoration:none}button,input{font:inherit}button{background:#13243d;color:white;border:1px solid #315478;border-radius:10px;padding:10px 12px;margin:4px}button.hot{border-color:#d69232;background:#433018}input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #315478;border-radius:10px;background:#06101d;color:white}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#040914;border:1px solid #1e3856;border-radius:12px;padding:12px;max-height:430px;overflow:auto}.good{color:#80f0ad}.bad{color:#ff8e9f}</style></head><body><div class="wrap"><div class="top"><div><h1>§WYRLZ Server</h1><div class="muted">Infrastructure / routing / hot-control plane · UI v1.0.0</div></div><div><a href="/api/chat">CHAT</a> · <a href="/lalm/">LALM</a> · <a href="/api/admin">ADMIN</a></div></div><div class="grid"><section class="card"><h3>Server receipt</h3><div id="receipt">Loading…</div><button onclick="refreshAll()">REFRESH</button></section><section class="card"><h3>Client router</h3><p class="muted">Server decides which plane a client should enter.</p><button onclick="location.href='/route?client=chat'">OPEN CHAT</button><button onclick="location.href='/route?client=lalm'">OPEN LALM</button><button onclick="location.href='/route?client=admin'">OPEN ADMIN</button></section><section class="card"><h3>Scoped hot sync</h3><p class="muted">LALM sync updates the model/runtime plane without touching Chat.</p><input id="admin" type="password" placeholder="SWRLZ_ADMIN_TOKEN (needed for Server/all sync)"><div><button class="hot" onclick="sync('lalm')">SYNC LALM</button><button onclick="sync('server')">SYNC SERVER PAGE</button><button onclick="sync('all')">SYNC SERVER + LALM</button></div><div id="syncState" class="muted">Ready.</div></section></div><section class="card"><h3>Raw status</h3><pre id="raw">Loading…</pre></section></div><script>const ADMIN_KEY='swrlzAdminToken',SESSION_KEY='swrlz.vercel.chat.admin-session.v1';admin.value=sessionStorage.getItem(ADMIN_KEY)||'';admin.onchange=()=>sessionStorage.setItem(ADMIN_KEY,admin.value.trim());async function json(url,opt={}){let r=await fetch(url,{cache:'no-store',...opt}),t=await r.text(),j;try{j=JSON.parse(t)}catch{j={raw:t}}if(!r.ok)throw Error(j.error||j.detail||('HTTP '+r.status));return j}async function refreshAll(){try{let j=await json('/api/server/status');raw.textContent=JSON.stringify(j,null,2);let h=j.hot||{},commit=(j.deploymentCommit||'').slice(0,10)||'—';receipt.innerHTML=`<div><b>Server v${j.version}</b></div><div>instance: ${j.instanceId}</div><div>commit: ${commit}</div><div>env: ${j.deploymentEnvironment||'—'}</div><div>uptime: ${j.uptimeSeconds}s</div><br><div class="${h.r39Override?'good':'muted'}">R39 hot override: ${h.r39Override?'YES':'NO'}</div><div class="${h.serverPageOverride?'good':'muted'}">Server page override: ${h.serverPageOverride?'YES':'NO'}</div><div class="${h.lalmPageOverride?'good':'muted'}">LALM page override: ${h.lalmPageOverride?'YES':'NO'}</div>`}catch(e){receipt.innerHTML='<span class="bad">'+e.message+'</span>';raw.textContent=e.stack||e.message}}async function sync(scope){let headers={},adm=admin.value.trim(),session=sessionStorage.getItem(SESSION_KEY)||'';if(adm){headers['x-swrlz-admin-token']=adm;sessionStorage.setItem(ADMIN_KEY,adm)}else if(scope==='lalm'&&session)headers['x-swrlz-chat-session']=session;syncState.textContent='Syncing '+scope+'…';try{let j=await json('/api/control/hot/sync?scope='+encodeURIComponent(scope)+'&branch=dev',{method:'POST',headers});syncState.textContent=`OK · ${j.files.length} file(s) · Chat touched: ${j.chatTouched}`;await refreshAll()}catch(e){syncState.textContent='FAILED · '+e.message}}refreshAll();setInterval(refreshAll,10000)</script></body></html>
