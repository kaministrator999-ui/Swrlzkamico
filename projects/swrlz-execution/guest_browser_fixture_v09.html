<!doctype html><html><head><meta charset="utf-8"><title>§X VM fixture</title></head><body>
<button id="go">Ready</button><canvas id="gl" width="64" height="64"></canvas>
<p id="result">PENDING</p>
<script>
const button=document.getElementById('go');
button.addEventListener('click',()=>{button.textContent='Clicked';});
button.click();
const canvas=document.getElementById('gl');
const gl=canvas.getContext('webgl2',{preserveDrawingBuffer:true})||canvas.getContext('webgl',{preserveDrawingBuffer:true});
let ok=false;
if(gl){gl.clearColor(.36,.19,.76,1);gl.clear(gl.COLOR_BUFFER_BIT);
const pixel=new Uint8Array(4);gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,pixel);
ok=[92,48,194,255].every((v,i)=>Math.abs(v-pixel[i])<=2)&&gl.getError()===gl.NO_ERROR;}
document.getElementById('result').textContent=6*7===42&&button.textContent==='Clicked'&&ok?'SWRLZ_BROWSER_PASS':'SWRLZ_BROWSER_FAIL';
</script></body></html>
