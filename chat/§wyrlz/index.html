<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="swrlz-chat-version" content="1.0.12">
  <meta name="theme-color" content="#010812">
  <title>Chat</title>
  <style>
    :root{--bg:#010812;--text:#eef8ff;--secondary:#c2d4e5;--muted:#91a9c0;--line:rgba(145,169,192,.2);--cyan:#38e8ff;--blue:#4f8cff}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;background:#010812}
    body{
      min-height:100dvh;
      background-image:url("/file_00000000b13c81f5a7f9fe99c0264ef0.png");
      background-position:50% 42%;
      background-size:cover;
      background-repeat:no-repeat;
      background-attachment:fixed;
      overflow:hidden;
      color:var(--text);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    .menu-button{position:fixed;z-index:5;top:12px;left:12px;display:inline-grid;place-items:center;width:36px;height:36px;padding:0;border:1px solid rgba(95,192,255,.38);border-radius:12px;color:#dffaff;background:linear-gradient(145deg,rgba(21,43,65,.94),rgba(7,25,43,.91));box-shadow:0 8px 24px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(22px) saturate(125%);cursor:pointer}\n    .menu-button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}\n    .composer-shell{position:fixed;z-index:4;left:0;right:0;bottom:0;padding:0 12px 8px;background:linear-gradient(to top,rgba(3,10,24,.52),transparent)}
    .composer{width:min(520px,100%);margin:0 auto}
    .composer-box{position:relative;overflow:hidden;min-height:42px;max-height:50dvh;border:1px solid rgba(95,192,255,.38);border-radius:21px;background:linear-gradient(145deg,rgba(21,43,65,.94),rgba(7,25,43,.91));box-shadow:0 12px 36px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(22px) saturate(125%)}
    .composer-box:focus-within{border-color:rgba(56,232,255,.58);box-shadow:0 12px 36px rgba(0,0,0,.42),0 0 0 2px rgba(56,232,255,.06)}
    #prompt{display:block;width:calc(100% - 46px);height:40px;max-height:calc(50dvh - 2px);resize:none;padding:11px 5px 11px 15px;border:0;outline:0;color:var(--text);background:transparent;font:inherit;font-size:13px;line-height:18px;white-space:pre-wrap;overflow-y:hidden;overflow-x:hidden}
    #prompt::placeholder{color:rgba(145,169,192,.78)}
    .composer-tools{position:absolute;right:6px;bottom:6px;display:flex;align-items:center;padding:0}
    .send-button{display:inline-grid;place-items:center;width:28px;height:28px;border:0;border-radius:50%;cursor:pointer;color:#dffaff;background:linear-gradient(145deg,#7de5ff,#58a8ff);box-shadow:0 6px 16px rgba(56,168,255,.24)}
    .send-button svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    @media(min-width:601px){.composer-shell{padding:0 14px 10px}.composer-box{min-height:44px;border-radius:22px}#prompt{height:42px;max-height:calc(50dvh - 2px);padding-top:11px;padding-bottom:11px;font-size:14px;line-height:20px}.composer-tools{bottom:7px}.send-button{width:30px;height:30px}.send-button svg{width:14px;height:14px}}
  </style>
</head>
<body>
  <button class="menu-button" id="menuButton" type="button" aria-label="Open side menu" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/></svg>
  </button>
  <footer class="composer-shell" data-component="composer-scenery">
    <form class="composer" id="composer">
      <div class="composer-box">
        <textarea id="prompt" rows="1" maxlength="16000" aria-label="Message §wyrlz" placeholder="Message §wyrlz…"></textarea>
        <div class="composer-tools">
          <button class="send-button" id="sendButton" type="button" aria-label="Send message">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12 20 4l-6 16-3-7-7-1Z"/><path d="m11 13 9-9"/></svg>
          </button>
        </div>
      </div>
    </form>
  </footer>
  <script>
    (() => {
      const prompt = document.getElementById("prompt");
      const resizeComposer = () => {
        prompt.style.height = "auto";
        const maxHeight = Math.max(40, Math.floor(window.innerHeight * 0.5) - 2);
        const nextHeight = Math.min(prompt.scrollHeight, maxHeight);
        prompt.style.height = nextHeight + "px";
        prompt.style.overflowY = prompt.scrollHeight > maxHeight ? "auto" : "hidden";
      };
      prompt.addEventListener("input", resizeComposer, {passive:true});
      window.addEventListener("resize", resizeComposer, {passive:true});
      resizeComposer();
    })();
  </script>
</body>
</html>
