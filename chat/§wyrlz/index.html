<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="swrlz-chat-version" content="1.0.5">
  <meta name="theme-color" content="#010812">
  <title>Chat</title>
  <style>
    :root{--bg:#010812;--text:#eef8ff;--secondary:#c2d4e5;--muted:#91a9c0;--line:rgba(145,169,192,.2);--cyan:#38e8ff;--blue:#4f8cff}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;background:#010812}
    body{
      min-height:100dvh;
      background-image:url("/file_00000000b13c81f5a7f9fe99c0264ef0.png");
      background-position:50% 42%;
      background-size:cover;
      background-repeat:no-repeat;
      background-attachment:fixed;
      overflow:hidden;
      color:var(--text);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    .composer-shell{position:fixed;z-index:4;left:0;right:0;bottom:0;padding:0 16px 16px;background:linear-gradient(to top,rgba(3,10,24,.72),transparent)}
    .composer{width:min(680px,100%);margin:0 auto}
    .composer-box{position:relative;overflow:hidden;border:1px solid rgba(95,192,255,.38);border-radius:26px;background:linear-gradient(145deg,rgba(21,43,65,.94),rgba(7,25,43,.91));box-shadow:0 18px 52px rgba(0,0,0,.46),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(24px) saturate(125%)}
    .composer-box:focus-within{border-color:rgba(56,232,255,.58);box-shadow:0 18px 52px rgba(0,0,0,.46),0 0 0 2px rgba(56,232,255,.06)}
    #prompt{display:block;width:100%;height:72px;resize:none;padding:22px 22px 8px;border:0;outline:0;color:var(--text);background:transparent;font:inherit;font-size:18px;line-height:1.4}
    #prompt::placeholder{color:rgba(145,169,192,.78)}
    .composer-tools{display:flex;align-items:center;justify-content:flex-end;padding:0 14px 13px}
    .send-button{display:inline-grid;place-items:center;width:50px;height:50px;border:0;border-radius:16px;cursor:pointer;color:#dffaff;background:linear-gradient(145deg,#7de5ff,#58a8ff);box-shadow:0 8px 22px rgba(56,168,255,.28)}
    .send-button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    @media(max-width:600px){.composer-shell{padding:0 14px 14px}.composer{width:100%}.composer-box{border-radius:25px}#prompt{height:68px;padding:20px 20px 7px;font-size:18px}.composer-tools{padding:0 12px 12px}.send-button{width:48px;height:48px;border-radius:15px}}
  </style>
</head>
<body>
  <footer class="composer-shell" data-component="composer-scenery">
    <form class="composer" id="composer">
      <div class="composer-box">
        <textarea id="prompt" rows="1" maxlength="16000" aria-label="Message §wyrlz" placeholder="Message §wyrlz…"></textarea>
        <div class="composer-tools">
          <button class="send-button" id="sendButton" type="button" aria-label="Send message">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12 20 4l-6 16-3-7-7-1Z"/><path d="m11 13 9-9"/></svg>
          </button>
        </div>
      </div>
    </form>
  </footer>
</body>
</html>
