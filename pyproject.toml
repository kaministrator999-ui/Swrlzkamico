[build-system]
requires = ["setuptools>=68", "wheel", "numpy==2.3.2"]
build-backend = "setuptools.build_meta"

[project]
name = "swrlzkamico-native"
version = "0.2.0"
description = "§wyrlz Vercel server native R39 acceleration and durable account chat package"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "numpy==2.3.2",
  "pydantic==2.11.7",
  "google-auth>=2.35,<3",
  "vercel>=0.3,<1",
]

[[tool.vercel.subscribers]]
entrypoint = "queues.swrlz_generation"
topics = ["swrlz-generation"]
retry_after_seconds = 30
max_concurrency = 2
